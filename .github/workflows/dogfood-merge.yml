name: Dogfood merge (采纳 → dev)

# The remote half of the cheesex dogfood loop (采纳即上线): accepting 芝士's work
# on the platform pushes that project's main here as dogfood/<topic>. This
# workflow runs the backend checks on the branch, then lands it on main through
# a SQUASH PR — which triggers build.yml + deploy-dev.yml, so the dev box
# (cheese-dev-env1-app) redeploys with the accepted change. The human gate is
# the 采纳 click on the platform; this workflow only refuses red checks.
#
# Squash keeps main's history clean (one conventional-ish commit per accept —
# the platform's jj auto-snapshot commits never reach main). If the platform
# project fell behind main and the PR conflicts, the merge fails visibly here;
# fix = sync the project's upstream on the platform and re-accept.
#
# NOTE: the PR is created with GITHUB_TOKEN, so pull_request-triggered
# workflows (test.yml etc.) do NOT run on it — that is WHY the check job below
# replicates test.yml's backend checks instead of waiting on them.

on:
  push:
    branches: ['dogfood/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dogfood-merge
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: paradedb/paradedb:v0.18.8-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
      redis:
        image: valkey/valkey:8.0.2
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run pyright

      - name: Install Jujutsu (jj)
        run: |
          JJ_VERSION=v0.43.0
          mkdir -p "$RUNNER_TEMP/jj-dl"
          curl -sSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/jj-dl"
          sudo mv "$RUNNER_TEMP/jj-dl/jj" /usr/local/bin/jj
          jj --version

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
          TEST_PG_BASE: postgresql+asyncpg://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          OPENAI_API_KEY: test-key
          ANTHROPIC_AUTH_TOKEN: test-token
        run: uv run pytest tests/ -n auto --tb=short -k "not kotlin"

  merge:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open squash PR and merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SUBJECT="$(git log -1 --format=%s "origin/$BRANCH")"
          TITLE="dogfood: $SUBJECT"
          # Reuse an existing PR for this branch (re-accept re-pushes it).
          PR=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body \
              "Automated dogfood merge: accepted on the cheesex platform (采纳 = the human gate). Checks ran in this workflow run."
          fi
          gh pr merge "$BRANCH" --squash --delete-branch --subject "$TITLE"
