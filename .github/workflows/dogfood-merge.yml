name: Dogfood merge (采纳 → dev)

# The remote half of the cheesex dogfood loop (采纳即上线): accepting 芝士's work
# on the platform pushes that project's main here as dogfood/<topic>. This
# workflow runs the backend checks on the branch, then lands it on main through
# a SQUASH PR — which triggers build.yml + deploy-dev.yml, so the dev box
# (cheese-dev-env1-app) redeploys with the accepted change. The human gate is
# the 采纳 click on the platform; this workflow only refuses red checks.
#
# Squash keeps main's history clean (one conventional-ish commit per accept —
# the platform's jj auto-snapshot commits never reach main). If the platform
# project fell behind main and the PR conflicts, the merge fails visibly here;
# fix = sync the project's upstream on the platform and re-accept.
#
# NOTE: the PR is created with GITHUB_TOKEN, so pull_request-triggered
# workflows (test.yml etc.) do NOT run on it — that is WHY the check job below
# replicates test.yml's backend checks instead of waiting on them.

on:
  push:
    branches: ['dogfood/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dogfood-merge
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: paradedb/paradedb:v0.18.8-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
      redis:
        image: valkey/valkey:8.0.2
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run pyright

      - name: Install Jujutsu (jj)
        run: |
          JJ_VERSION=v0.43.0
          mkdir -p "$RUNNER_TEMP/jj-dl"
          curl -sSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/jj-dl"
          sudo mv "$RUNNER_TEMP/jj-dl/jj" /usr/local/bin/jj
          jj --version

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
          TEST_PG_BASE: postgresql+asyncpg://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          OPENAI_API_KEY: test-key
          ANTHROPIC_AUTH_TOKEN: test-token
        run: uv run pytest tests/ -n auto --tb=short -k "not kotlin"

  merge:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Push over SSH with a repo deploy key, NOT github.token: GITHUB_TOKEN
      # pushes never trigger workflows (recursion guard), so the squash landed
      # on main without build/deploy ever running — the loop silently stopped
      # at the merge. Deploy-key pushes DO trigger them.
      - name: Use the dogfood push key
        env:
          KEY: ${{ secrets.DOGFOOD_PUSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/dogfood_push && chmod 600 ~/.ssh/dogfood_push
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/dogfood_push -o IdentitiesOnly=yes"
          git remote set-url origin git@github.com:${{ github.repository }}.git

      # Direct squash merge, NOT a PR: the org disables Actions-created PRs
      # ("GitHub Actions is not permitted to create or approve pull requests"),
      # and we deliberately do not loosen that org-wide setting. The real code
      # review already happened on the platform (验收卡 → 采纳 by a human);
      # the checks ran in this workflow's check job. This is the one sanctioned
      # exception to the "all commits go through PR" convention.
      - name: Squash-merge to main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          SUBJECT="$(git log -1 --format=%s "origin/$BRANCH")"
          git config user.name "cheese-dogfood[bot]"
          git config user.email "dogfood@cheese.local"
          git checkout main
          git merge --squash "origin/$BRANCH"
          if git diff --cached --quiet; then
            echo "nothing to merge (already landed)"; exit 0
          fi
          git commit -m "dogfood: $SUBJECT" \
            -m "Accepted on the cheesex platform (采纳 = the human gate); backend checks ran in this workflow run."
          git push origin main
          git push origin --delete "$BRANCH" || true
