name: sandbox-image

on:
  push:
    paths:
      - backend/sandbox/image/Dockerfile
      - backend/sandbox/image/template-packages.tsv
      - backend/sandbox/image/mount-target
      - .github/workflows/sandbox-image.yml
  pull_request:
    paths:
      - backend/sandbox/image/**
      - .github/workflows/sandbox-image.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Registry login
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Build and exercise the filesystem
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/sandbox-rootfs:$GITHUB_SHA"
          docker buildx build --platform linux/amd64 --load --tag "$image" backend/sandbox/image
          docker run --rm "$image" sh -eu -c '
            command -v gcc g++ make gdb git python3 tmux jj
            printf "int main(void){return 0;}\n" > /tmp/main.c
            gcc -Wall -Werror /tmp/main.c -o /tmp/main && /tmp/main
            g++ -Wall -Werror /tmp/main.c -o /tmp/main-cpp && /tmp/main-cpp
            cut -f1 /usr/share/cheese/template-packages.tsv | sort > /tmp/want
            cut -f1 /usr/share/cheese/image-packages.tsv | sort > /tmp/have
            test -z "$(comm -23 /tmp/want /tmp/have)"
          '
          if [ "$PUBLISH" = true ]; then
            docker push "$image"
            docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
