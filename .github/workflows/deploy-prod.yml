name: Deploy (prod RUC box)

# Gated deployment to the prod (RUC) box (cheese-prod-app, 192.168.16.8 →
# cheese.ruc.edu.cn). Like the dev box it's on ghg's private network with no
# public inbound, so a self-hosted runner (label `cheese-prod`) lives ON the box
# and pulls jobs outbound; it runs the SAME unified Docker deploy as dev
# (deploy/deploy-docker.sh). The only difference from dev is the gate: prod
# never auto-deploys —
# it fires on a published GitHub Release (or a manual dispatch of a specific
# ref) and requires a human approval before anything runs.
#
# prod deploys RELEASES, not main commits — its current release is v0.16.4
# (whose images live under the pre-rename `cheese-backend-py/*` path; future
# releases build under `cheese/*` and need no override).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or commit SHA to deploy"
        required: true
        default: main
      dry_run:
        description: "Show what would deploy; do not deploy"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  # manual-approval opens an issue and waits for an approver to comment
  issues: write

concurrency:
  group: deploy-prod-ruc
  cancel-in-progress: false

jobs:
  # Gate on a CI runner, NOT ubuntu-latest: every other workflow here runs
  # self-hosted, so an org billing lapse only ever surfaces in THIS job — and it
  # did (2026-08-15, the 0.18.0 release: "the job was not started because recent
  # account payments have failed", with zero failed steps to point at). The
  # original reason for a hosted runner — a long approval wait must not tie up
  # the PROD box's runner — still holds, and a ci-pool runner satisfies it: the
  # wait occupies one of three, and never the box that deploys. Waits for the
  # release commit's CI (release events only; a manual dispatch trusts the
  # operator's ref) and then a human approval.
  gate:
    # Native CLI artifacts are tool distributions, not application releases.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'forgejo-cli-')
    runs-on: [self-hosted, cheese-ci]
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    # Deliberately unbounded (GitHub's 360m default): this job blocks on a
    # human approving via manual-approval. A tight timeout here would not
    # catch a hang, it would cancel a deploy waiting on its approver.
    steps:
      - name: Check out deployment policy
        if: github.event_name == 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve release commit
        id: candidate
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Check images and selected tests for the release commit
        id: check
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: python3 deploy/check-auto-deploy.py --ci-only "$CANDIDATE_SHA"
      - name: Require completed validation
        if: github.event_name == 'release'
        env:
          READY: ${{ steps.check.outputs.ready }}
        run: |
          if [ "$READY" != true ]; then
            echo '::error::Release images and selected tests must succeed for this commit. Rerun after validation completes.'
            exit 1
          fi

      # GitHub's native environment required-reviewers isn't available on this
      # plan (private repo), so gate on a human approving via an auto-opened
      # issue — the same mechanism the etrip deploy uses. Skipped for dry-run.
      - name: Require manual approval
        if: ${{ !inputs.dry_run }}
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: andylizf
          minimum-approvals: 1
          issue-title: "Approve prod (RUC) deploy${{ github.event.release.tag_name && format(' of {0}', github.event.release.tag_name) || '' }}"
          issue-body: "Deploying to cheese.ruc.edu.cn (prod RUC box). Comment `approve` to proceed or `deny` to cancel."

  deploy:
    needs: gate
    if: ${{ needs.gate.result == 'success' }}
    # See deploy-dev.yml: records a deployment so the target is queryable. The
    # `production` environment already exists (deploy.yml uses it) and carries
    # no protection rules, so the human gate stays where it is — in `gate`.
    environment: production
    runs-on: [self-hosted, cheese-prod]
    timeout-minutes: 30
    steps:
      # Deploy TOOLING (deploy-docker.sh + compose) always comes from the DEFAULT
      # branch — release branches/tags don't carry it (checking out the release
      # ref made the job fail with "deploy/deploy-docker.sh: No such file").
      - name: Check out deploy tooling (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Recheck validation after approval
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.sha }}
        run: python3 deploy/check-auto-deploy.py --require-ci "$CANDIDATE_SHA"

      # The deployed REF only determines WHICH image sha to run. Fetch it and
      # peel to the commit (annotated tags point at a tag object, not the commit).
      - name: Resolve image tag from the release/ref (monorepo commit sha)
        id: img
        env:
          # Preserve the validated commit while approval is pending.
          REF: ${{ needs.gate.outputs.sha || inputs.ref }}
        run: |
          git fetch --depth=1 origin "$REF"
          echo "sha=$(git rev-parse --short=7 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Deploy (or dry-run)
        env:
          SHA: ${{ steps.img.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would docker-deploy sha '$SHA'. Current state:"
            docker compose -f deploy/compose/docker-compose.base.yml -p cheese ps || true
            curl -s -o /dev/null -w 'backend health=%{http_code}\n' http://127.0.0.1:8081/healthz || true
            curl -s -o /dev/null -w 'frontend :8080=%{http_code}\n' http://127.0.0.1:8080/ || true
          else
            CHEESE_CENTRAL_SESSION_HOST=1 bash deploy/deploy-docker.sh "$SHA"
          fi
