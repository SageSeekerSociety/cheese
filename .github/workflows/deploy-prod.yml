name: Deploy (prod RUC box)

# Gated deployment to the prod (RUC) box (cheese-prod-app, 192.168.16.8 →
# cheese.ruc.edu.cn). Like the dev box it's on ghg's private network with no
# public inbound, so a self-hosted runner (label `cheese-prod`) lives ON the box
# and pulls jobs outbound; it runs the SAME unified Docker deploy as dev
# (deploy/deploy-docker.sh). The only difference from dev is the gate: prod
# never auto-deploys —
# it fires on a published GitHub Release (or a manual dispatch of a specific
# ref) and requires a human approval before anything runs.
#
# prod deploys RELEASES, not main commits.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or commit SHA to deploy"
        required: true
        default: main
      dry_run:
        description: "Show what would deploy; do not deploy"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  # manual-approval opens an issue and waits for an approver to comment
  issues: write

concurrency:
  group: deploy-prod-ruc
  cancel-in-progress: false

jobs:
  # On a hosted runner, not the PROD box: this job waits on a human approval for
  # as long as that takes, and the box's runner is what the deploy job below
  # needs. Waits for the release commit's CI (release events only; a manual
  # dispatch trusts the operator's ref) and then a human approval.
  gate:
    # Native CLI artifacts are tool distributions, not application releases.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'forgejo-cli-')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    # Deliberately unbounded (GitHub's 360m default): this job blocks on a
    # human approving via manual-approval. A tight timeout here would not
    # catch a hang, it would cancel a deploy waiting on its approver.
    steps:
      - name: Check out deployment policy
        if: github.event_name == 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve release commit
        id: candidate
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Check images and selected tests for the release commit
        id: check
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: python3 deploy/check-auto-deploy.py --ci-only "$CANDIDATE_SHA"
      - name: Require completed validation
        if: github.event_name == 'release'
        env:
          READY: ${{ steps.check.outputs.ready }}
        run: |
          if [ "$READY" != true ]; then
            echo '::error::Release images and selected tests must succeed for this commit. Rerun after validation completes.'
            exit 1
          fi

      # GitHub's native environment required-reviewers isn't available on this
      # plan (private repo), so gate on a human approving via an auto-opened
      # issue — the same mechanism the etrip deploy uses. Skipped for dry-run.
      - name: Require manual approval
        if: ${{ !inputs.dry_run }}
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: andylizf
          minimum-approvals: 1
          issue-title: "Approve prod (RUC) deploy${{ github.event.release.tag_name && format(' of {0}', github.event.release.tag_name) || '' }}"
          issue-body: "Deploying to cheese.ruc.edu.cn (prod RUC box). While prod's database is still on the 0.16.x line (alembic b1c2d3e4f5a6), this deploy first cuts it over (deploy/cutover-ruc-016-to-main.sh): the 0.16.x backend stops, then backup, UTF8 rebuild, archive of what main drops, bridge, and the deploy's migrations; the site is down until the new release is healthy. Comment `approve` to proceed or `deny` to cancel."

  # Everyday CI runs the backend layers on arm64 runners (test.yml); production
  # runs on x64. So before a release reaches it, the same suite runs once on
  # x64 against the commit being deployed, alongside the approval.
  x86-tests:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'forgejo-cli-')
    uses: ./.github/workflows/test.yml
    with:
      runner: ubuntu-latest
      ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

  deploy:
    needs: [gate, x86-tests]
    if: ${{ needs.gate.result == 'success' && needs.x86-tests.result == 'success' }}
    # See deploy-dev.yml: records a deployment so the target is queryable. The
    # `production` environment already exists (deploy.yml uses it) and carries
    # no protection rules, so the human gate stays where it is — in `gate`.
    environment: production
    runs-on: [self-hosted, cheese-prod]
    # Read by the alert job below: the gate refusing is the one failure of the
    # deploy job that is not a broken deploy.
    outputs:
      refused: ${{ steps.recheck.outputs.refused }}
    # The deploy's 30 plus the cutover's 15.
    timeout-minutes: 45
    steps:
      # Deploy TOOLING (deploy-docker.sh + compose) always comes from the DEFAULT
      # branch — release branches/tags don't carry it (checking out the release
      # ref made the job fail with "deploy/deploy-docker.sh: No such file").
      - name: Check out deploy tooling (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Recheck validation after approval
        id: recheck
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.sha }}
        run: python3 deploy/check-auto-deploy.py --require-ci "$CANDIDATE_SHA"

      # The deployed REF only determines WHICH image sha to run. Fetch it and
      # peel to the commit (annotated tags point at a tag object, not the commit).
      - name: Resolve image tag from the release/ref (monorepo commit sha)
        id: img
        env:
          # Preserve the validated commit while approval is pending.
          REF: ${{ needs.gate.outputs.sha || inputs.ref }}
        run: |
          git fetch --depth=1 origin "$REF"
          echo "sha=$(bash deploy/image-tag.sh FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse FETCH_HEAD^{commit})" >> "$GITHUB_OUTPUT"

      # Moves the database off the 0.16.x line onto main's chain, so the deploy's
      # `alembic upgrade head` can take it the rest of the way. It acts only
      # while the database is at 0.16.x's head and the release is on main's
      # chain; any other run reads the version, says so, and changes nothing.
      # A dry run runs its read-only checks.
      - name: Cut the database over from 0.16.x
        timeout-minutes: 15
        env:
          SHA: ${{ steps.img.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            bash deploy/cutover-ruc-016-to-main.sh --dry-run "$SHA"
          else
            bash deploy/cutover-ruc-016-to-main.sh "$SHA"
          fi

      - name: Deploy (or dry-run)
        env:
          SHA: ${{ steps.img.outputs.sha }}
          APP_RELEASE: ${{ steps.img.outputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would docker-deploy sha '$SHA'. Current state:"
            docker compose -f deploy/compose/docker-compose.base.yml -p cheese ps || true
            curl -s -o /dev/null -w 'backend health=%{http_code}\n' http://127.0.0.1:8081/healthz || true
            curl -s -o /dev/null -w 'frontend :8080=%{http_code}\n' http://127.0.0.1:8080/ || true
          else
            CHEESE_CENTRAL_SESSION_HOST=1 bash deploy/deploy-docker.sh "$SHA"
          fi

  # A failed deploy tells the team's alert group (「Cheese 告警」), not only the
  # Actions tab. Its own job on a hosted runner, because a runner that lost the
  # server mid-deploy runs nothing more in the deploy job. Which outcomes page,
  # and why each, is .github/scripts/deploy-alert.py; a skipped deploy job (a
  # release gate that refused) never reaches it.
  alert:
    # gate for the release commit it resolved.
    needs: [gate, deploy]
    if: always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Here rather than on a step: an `if:` cannot read the `secrets` context.
    env:
      WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      - name: Decide whether the deploy failed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENVIRONMENT: prod（cheese.ruc.edu.cn）
          COMMIT: ${{ needs.gate.outputs.sha || inputs.ref }}
          # The deploy job's own timeout-minutes, so a hang that used it all up pages.
          TIMEOUT_MINUTES: '45'
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          # Validation that regressed while the release waited for approval
          # leaves prod on the release it had; that is CI's news, not a broken
          # deploy. The approval itself is in the gate job, so a denial never
          # fails this one.
          REFUSED: ${{ needs.deploy.outputs.refused }}
        run: python3 .github/scripts/deploy-alert.py
      - name: Tell the team the deploy failed
        if: steps.decide.outputs.text != '' && env.WEBHOOK != ''
        env:
          TEXT: ${{ steps.decide.outputs.text }}
        run: |
          set -uo pipefail
          # Never fail on the alert itself: the deploy's result is the finding.
          curl -sS -m 15 -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')" \
            || echo "::warning::could not reach the alert webhook"
