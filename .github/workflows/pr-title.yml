name: PR title recheck

# Ready PRs check the title in CI required. A title edit re-runs that job
# alone; no suite is restarted for it.
#
# An edit while Required CI is running cannot re-run that run yet. Completion
# recovers any attempt with a real title edit since the affected job started.
# The next job starts after that edit, so an unchanged product failure does not
# loop. Run display_title is not the title the job read; an A -> B -> A edit counts.
# Forks and superseded heads/attempts stay untouched.
on:
  pull_request:
    types: [ready_for_review, edited]
    branches: [main]
  workflow_run:
    workflows: [Required CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  recheck:
    # Concurrency lives on the job, not the workflow. Required CI completes for
    # every conclusion, including `cancelled` — the draft run that a
    # ready_for_review supersedes ends that way — and each completion starts a
    # run of this workflow. The `if` below skips that job, but as a
    # workflow-level group the run still cancelled the title-edit recheck
    # running for the same head. The cancelled `recheck` check then stayed on
    # the head as its last word, so the head's rollup read red even after later
    # attempts passed (#4573). A job skipped by `if` never enters a job-level
    # group, so only rechecks that will actually run supersede each other.
    concurrency:
      group: pr-title-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository
       && !github.event.pull_request.draft
       && (github.event.action == 'ready_for_review' || github.event.changes.title))
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: workflow_run has a write token, so neither code nor artifacts
      # from the pull request may be executed. Titles are JSON data, never shell.
      - name: Re-run the title checks of the head commit's Required CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path

          def timestamp(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def gh_json(*args):
              return json.loads(subprocess.check_output(["gh", *args], text=True))

          repo = os.environ["GITHUB_REPOSITORY"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          completed = os.environ["GITHUB_EVENT_NAME"] == "workflow_run"
          source = event.get("workflow_run", {})
          if completed:
              if (source.get("event") != "pull_request"
                      or source.get("conclusion") != "failure"
                      or source.get("head_repository", {}).get("full_name") != repo):
                  raise SystemExit(0)
              head = source["head_sha"]
              pulls = gh_json("api", f"repos/{repo}/commits/{head}/pulls")
          else:
              pull = event["pull_request"]
              head = pull["head"]["sha"]
              pulls = [gh_json("api", f"repos/{repo}/pulls/{pull['number']}")]

          pulls = [p for p in pulls
                   if p.get("state") == "open" and not p.get("draft")
                   and p.get("base", {}).get("ref") == "main"
                   and p.get("head", {}).get("sha") == head
                   and (p.get("head", {}).get("repo") or {}).get("full_name") == repo]
          if not pulls:
              print("No current ready same-repository PR on this head.")
              raise SystemExit(0)
          runs = gh_json("run", "list", "--repo", repo, "--workflow", "required-ci.yml",
                         "--event", "pull_request", "--commit", head, "--limit", "1",
                         "--json", "databaseId,status,attempt")
          if not runs or runs[0]["status"] != "completed":
              print("Required CI is still running; completion will check for a title edit.")
              raise SystemExit(0)
          run = runs[0]["databaseId"]
          attempt = runs[0]["attempt"]
          if completed and (run != source["id"] or attempt != source["run_attempt"]):
              print("A newer Required CI run or attempt supersedes this completion.")
              raise SystemExit(0)
          pages = gh_json("api", f"repos/{repo}/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100",
                          "--paginate", "--slurp")
          jobs = [job for page in pages for job in page["jobs"]]
          required = next((j for j in jobs if j["name"] == "CI required"
                           and j.get("conclusion") not in ("skipped", "cancelled")), None)
          if required is None:
              print("No CI required job that ran; leave draft or cancelled runs alone.")
              raise SystemExit(0)
          job = required
          if completed:
              started = timestamp(job["started_at"])
              changed = False
              for pull in pulls:
                  pages = gh_json("api", f"repos/{repo}/issues/{pull['number']}/events?per_page=100",
                                  "--paginate", "--slurp")
                  changed = changed or any(
                      edit.get("event") == "renamed"
                      and edit.get("rename", {}).get("to") == pull["title"]
                      and timestamp(edit["created_at"]) >= started
                      for page in pages for edit in page)
              if not changed:
                  print("No new title edit since the affected job started; no automatic retry.")
                  raise SystemExit(0)
          print(f"Re-running {job['name']} (job {job['id']}) of Required CI run {run}.")
          subprocess.run(["gh", "run", "rerun", "--job", str(job["id"]),
                          "--repo", repo], check=True)
          PY
