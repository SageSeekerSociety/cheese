name: PR title recheck

# Ready PRs check the title in fast as well as CI required. Re-run a failed
# fast job and its downstream aggregator; otherwise only the aggregator needs
# the fresh title. No full suite is restarted for a title edit.
#
# An edit while Required CI is running cannot re-run that run yet. Its completion
# is a second chance, only when the current title differs from the run's original
# display title, and only on the first attempt. A remaining product failure must
# not start an automatic retry loop. Forks and superseded heads stay untouched.
on:
  pull_request:
    types: [ready_for_review, edited]
    branches: [main]
  workflow_run:
    workflows: [Required CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  recheck:
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository
       && !github.event.pull_request.draft
       && (github.event.action == 'ready_for_review' || github.event.changes.title))
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.run_attempt == 1
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: workflow_run has a write token, so neither code nor artifacts
      # from the pull request may be executed. Titles are JSON data, never shell.
      - name: Re-run the title checks of the head commit's Required CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def gh_json(*args):
              return json.loads(subprocess.check_output(["gh", *args], text=True))

          repo = os.environ["GITHUB_REPOSITORY"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          completed = os.environ["GITHUB_EVENT_NAME"] == "workflow_run"
          source = event.get("workflow_run", {})
          if completed:
              if (source.get("event") != "pull_request"
                      or source.get("conclusion") != "failure"
                      or source.get("run_attempt") != 1
                      or source.get("head_repository", {}).get("full_name") != repo):
                  raise SystemExit(0)
              head = source["head_sha"]
              pulls = gh_json("api", f"repos/{repo}/commits/{head}/pulls")
          else:
              pull = event["pull_request"]
              head = pull["head"]["sha"]
              pulls = [gh_json("api", f"repos/{repo}/pulls/{pull['number']}")]

          pulls = [p for p in pulls
                   if p.get("state") == "open" and not p.get("draft")
                   and p.get("base", {}).get("ref") == "main"
                   and p.get("head", {}).get("sha") == head
                   and (p.get("head", {}).get("repo") or {}).get("full_name") == repo]
          if not pulls:
              print("No current ready same-repository PR on this head.")
              raise SystemExit(0)
          if completed and all(p.get("title") == source.get("display_title") for p in pulls):
              print("No title change to recover after this run.")
              raise SystemExit(0)

          runs = gh_json("run", "list", "--repo", repo, "--workflow", "required-ci.yml",
                         "--event", "pull_request", "--commit", head, "--limit", "1",
                         "--json", "databaseId,status")
          if not runs or runs[0]["status"] != "completed":
              print("Required CI is still running; completion will check for a title edit.")
              raise SystemExit(0)
          run = runs[0]["databaseId"]
          if completed and run != source["id"]:
              print("A newer Required CI run supersedes this completion.")
              raise SystemExit(0)
          jobs = gh_json("run", "view", str(run), "--repo", repo, "--json", "jobs")["jobs"]
          required = next((j for j in jobs if j["name"] == "CI required"
                           and j.get("conclusion") not in ("skipped", "cancelled")), None)
          if required is None:
              print("No CI required job that ran; leave draft or cancelled runs alone.")
              raise SystemExit(0)
          fast = next((j for j in jobs if j["name"] == "fast"
                       and j.get("conclusion") == "failure"), None)
          job = fast or required
          print(f"Re-running {job['name']} (job {job['databaseId']}) of Required CI run {run}.")
          subprocess.run(["gh", "run", "rerun", "--job", str(job["databaseId"]),
                          "--repo", repo], check=True)
          PY
