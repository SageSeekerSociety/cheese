name: Claude Code build contracts

# The executor runs a room's file operations through the assigned machine's
# `claude mcp serve`, and takes the shell snapshot its commands start from
# from that build's Bash tool; mcp_contract.py checks both, since neither is
# in a published contract. The headless stream-json protocol the Claude Code
# driver speaks (#1606) is unpublished too; headless_contract.py checks the
# parts of it the driver relies on, including through the remote-execution
# plugin. equivalence.py checks that a room's Bash, run through the shell
# prefix on the executor, is what the same build does running there itself.
# Changes to the plugin and its executor run all three. And the metering proxy
# renews the platform's Claude login with a copy of this build's token
# refresh, which refresh_contract.py holds to the build's own, byte for byte.

on:
  workflow_call:
  schedule:
    # Anthropic publishes most days; a morning report is soon enough to learn
    # about a broken behaviour before an upgrade is what someone is debugging.
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-contract-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned:
    # The build the rooms actually run. Breaking this breaks every room.
    runs-on: ubuntu-latest
    # `uv sync` on the shared pool takes 9-14 minutes under contention (measured
    # 2026-09-19, 11 runs queued) and job setup another 2-4. A budget sized for
    # the tests alone is spent before they run, and a job killed by its own
    # timeout reports as cancelled with no failure to read.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/remote_execution/package-lock.json
      - run: npm ci --prefix scripts/remote_execution --no-audit --no-fund
      # The script and what it imports are standard library only, so this job
      # skips `uv sync` and its several minutes.
      - name: Let a session have its own namespace, and install zsh
        # The headless contract and the equivalence check launch sessions the
        # way a room does; the MCP contract checks the build's zsh too.
        run: |
          .github/scripts/allow-user-namespaces.sh
          command -v zsh || { sudo apt-get update -q && sudo apt-get install -yq zsh; }
      - run: >-
          python3 scripts/remote_execution/mcp_contract.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --output tmp/mcp-contract/pinned
      - name: Install tmux
        # The resume checks drive the interactive CLI in a tmux pane.
        if: ${{ !cancelled() }}
        run: command -v tmux || { sudo apt-get update -q && sudo apt-get install -yq tmux; }
      - name: Headless stream-json contract
        # Runs even when the MCP checks failed, so one run reports both.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/remote_execution/headless_contract.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --output tmp/mcp-contract/pinned/headless
      - name: Install mitmproxy
        # The refresh contract answers every request itself through it; the
        # same release as the metering proxy's image.
        if: ${{ !cancelled() }}
        run: python3 -m venv "$RUNNER_TEMP/mitm" && "$RUNNER_TEMP/mitm/bin/pip" install -q mitmproxy==12.1.2
      - name: Token refresh contract
        # The metering proxy renews the platform's Claude login with a request
        # that has to be this build's own, byte for byte.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/remote_execution/refresh_contract.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --mitmdump "$RUNNER_TEMP/mitm/bin/mitmdump"
          --output tmp/mcp-contract/pinned/refresh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        # A quota-refused upload retries until the JOB timeout cancels the job
        # — 20 minutes after the tests passed, reported as cancelled, which
        # `continue-on-error` never gets to tolerate. Bound the step instead.
        timeout-minutes: 3
        if: always()
        with:
          name: mcp-contract-pinned-${{ github.sha }}
          path: tmp/mcp-contract/pinned/

  equivalence:
    # The same build as `pinned`. Each shell's run takes about six minutes;
    # after the contracts above and one another they made `pinned` the
    # longest job in Required CI, so the two shells run side by side here.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/remote_execution/package-lock.json
      - run: npm ci --prefix scripts/remote_execution --no-audit --no-fund
      - name: Let a session have its own namespace
        run: .github/scripts/allow-user-namespaces.sh
      - name: Install FUSE for the forwarded project view, and zsh
        # The equivalence check mounts the view a room's session works in.
        # libfuse2 (fusepy) mounts through `fusermount`; Ubuntu 24.04 ships
        # only `fusermount3`, which takes the same arguments. zsh is the
        # executor shell of the zsh run.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fuse3 libfuse2t64 zsh
          command -v fusermount || sudo ln -s "$(command -v fusermount3)" /usr/local/bin/fusermount
          python3 -m venv tmp/equivalence-venv
          tmp/equivalence-venv/bin/pip install --quiet fusepy==3.0.1
      - name: Remote Bash is equivalent to Claude Code on the executor (${{ matrix.shell }})
        run: >-
          tmp/equivalence-venv/bin/python scripts/remote_execution/equivalence.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --shell ${{ matrix.shell }} --output tmp/mcp-contract/pinned/equivalence-${{ matrix.shell }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        # A quota-refused upload retries until the JOB timeout cancels the job
        # — 20 minutes after the tests passed, reported as cancelled, which
        # `continue-on-error` never gets to tolerate. Bound the step instead.
        timeout-minutes: 3
        if: always()
        with:
          name: mcp-contract-pinned-equivalence-${{ matrix.shell }}-${{ github.sha }}
          path: tmp/mcp-contract/pinned/equivalence-${{ matrix.shell }}/

  latest:
    # The next upgrade, checked before it is what we are debugging. Deliberately
    # not run on pull requests: a build Anthropic published this morning is not
    # a reason to hold up somebody's merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `uv sync` on the shared pool takes 9-14 minutes under contention (measured
    # 2026-09-19, 11 runs queued) and job setup another 2-4. A budget sized for
    # the tests alone is spent before they run, and a job killed by its own
    # timeout reports as cancelled with no failure to read.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve the current Claude release
        id: claude
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-mcp-latest-${{ runner.os }}-${{ runner.arch }}-${{ steps.claude.outputs.version }}
      - name: Install the current Claude release
        env:
          CLAUDE_VERSION: ${{ steps.claude.outputs.version }}
        run: >-
          npm install --no-save --no-audit --no-fund
          --prefix scripts/remote_execution "@anthropic-ai/claude-code@$CLAUDE_VERSION"
      - name: Let a session have its own namespace, and install zsh
        # The headless contract and the equivalence check launch sessions the
        # way a room does; the MCP contract checks the build's zsh too.
        run: |
          .github/scripts/allow-user-namespaces.sh
          command -v zsh || { sudo apt-get update -q && sudo apt-get install -yq zsh; }
      - run: >-
          python3 scripts/remote_execution/mcp_contract.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --output tmp/mcp-contract/latest
      - name: Install tmux
        # The resume checks drive the interactive CLI in a tmux pane.
        if: ${{ !cancelled() }}
        run: command -v tmux || { sudo apt-get update -q && sudo apt-get install -yq tmux; }
      - name: Headless stream-json contract
        # Runs even when the MCP checks failed, so one run reports both.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/remote_execution/headless_contract.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --output tmp/mcp-contract/latest/headless
      - name: Install mitmproxy
        if: ${{ !cancelled() }}
        run: python3 -m venv "$RUNNER_TEMP/mitm" && "$RUNNER_TEMP/mitm/bin/pip" install -q mitmproxy==12.1.2
      - name: Token refresh contract
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/remote_execution/refresh_contract.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --mitmdump "$RUNNER_TEMP/mitm/bin/mitmdump"
          --output tmp/mcp-contract/latest/refresh
      - name: Install FUSE for the forwarded project view, and zsh
        # The equivalence check mounts the view a room's session works in.
        # libfuse2 (fusepy) mounts through `fusermount`; Ubuntu 24.04 ships
        # only `fusermount3`, which takes the same arguments. zsh is the
        # executor shell the second equivalence run and the shell contract use.
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fuse3 libfuse2t64 zsh
          command -v fusermount || sudo ln -s "$(command -v fusermount3)" /usr/local/bin/fusermount
          python3 -m venv tmp/equivalence-venv
          tmp/equivalence-venv/bin/pip install --quiet fusepy==3.0.1
      - name: Remote Bash is equivalent to Claude Code on the executor (bash)
        # Runs even when an earlier check failed, so one run reports all.
        if: ${{ !cancelled() }}
        run: >-
          tmp/equivalence-venv/bin/python scripts/remote_execution/equivalence.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --shell bash --output tmp/mcp-contract/latest/equivalence-bash
      - name: Remote Bash is equivalent to Claude Code on the executor (zsh)
        if: ${{ !cancelled() }}
        run: >-
          tmp/equivalence-venv/bin/python scripts/remote_execution/equivalence.py
          --claude "$PWD/scripts/remote_execution/node_modules/.bin/claude"
          --shell zsh --output tmp/mcp-contract/latest/equivalence-zsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        # A quota-refused upload retries until the JOB timeout cancels the job
        # — 20 minutes after the tests passed, reported as cancelled, which
        # `continue-on-error` never gets to tolerate. Bound the step instead.
        timeout-minutes: 3
        if: always()
        with:
          name: mcp-contract-latest-${{ github.sha }}
          path: tmp/mcp-contract/latest/
