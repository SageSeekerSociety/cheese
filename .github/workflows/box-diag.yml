name: Box diagnostics

# Read-only, fixed probes on each box, manually triggered. The boxes have no
# public inbound (ghg private net) and personal SSH keys don't reach prod, so
# the self-hosted runner is the sanctioned channel for looking at them — the
# same channel deploys use. Probes are HARD-CODED on purpose: this must never
# grow into a parameterized remote shell.
#
# Born from #233: the dev database turned out to be SQL_ASCII (Chinese in
# jsonb crashes), and there was no way to check prod's encoding short of
# asking someone with a key.
#
# The encoding probe deliberately imports NO application code: prod deploys by
# release and can run a much older layout (the first version imported
# app.core.db and crashed on prod). It reads DATABASE_URL and talks to the
# driver directly, asyncpg first, psycopg2 as fallback.

on:
  workflow_dispatch: {}

# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to. Jobs that DO need more (the
# `scope` gh-api jobs) declare it at job level, which overrides this.
permissions:
  contents: read

jobs:
  dev-box:
    runs-on: [self-hosted, cheese-dev]
    # Reading two days of the metering proxy's log is the long pole. A probe
    # killed halfway costs another wait for the box's single runner slot, which
    # is the expensive part of running this at all.
    timeout-minutes: 10
    steps:
      - name: Database encoding
        run: |
          docker exec cheese-backend-1 python -c '
          import os

          Q = (
              "SELECT current_database(), pg_encoding_to_char(encoding), "
              "datcollate, version() "
              "FROM pg_database WHERE datname = current_database()"
          )
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              cand = [k for k in os.environ if "DATABASE" in k or "POSTGRES" in k]
              raise SystemExit(f"no DATABASE_URL; candidates: {cand}")
          dsn = (
              url.replace("postgresql+asyncpg://", "postgresql://")
              .replace("postgresql+psycopg2://", "postgresql://")
          )
          print("db_host:", dsn.rsplit("@", 1)[-1])

          def show(row):
              print(f"db={row[0]} encoding={row[1]} collate={row[2]}")
              print("server:", row[3][:60])

          try:
              import asyncio

              import asyncpg

              async def main():
                  c = await asyncpg.connect(dsn)
                  show(await c.fetchrow(Q))
                  await c.close()

              asyncio.run(main())
          except ModuleNotFoundError:
              import psycopg2

              with psycopg2.connect(dsn) as conn:
                  with conn.cursor() as cur:
                      cur.execute(Q)
                      show(cur.fetchone())
          '
      - name: Deployed images and disk
        run: |
          docker ps --format '{{.Names}}  {{.Image}}' || true
          df -h / | tail -1
      - name: Backend log tail
        # The backend process's own stdout is not reachable any other way: the
        # box has no public inbound, `backend_log.py` is a POST-only intake, and
        # no route reads logs back. So a maintenance loop that is failing every
        # tick — `pr poll failed`, the orphan sweep, the reaper — is invisible
        # from outside while the symptom (a card that never advances) is not.
        #
        # Fixed window and fixed filter, no parameters: same rule as every other
        # probe in this file (see the header) — a grep pattern or a line count
        # taken from workflow input is a remote shell with extra steps. Grep
        # locally in the run log.
        #
        # `--since 2h`, not `--tail N`: a line budget is the wrong unit here.
        # The first version tailed 400 lines and got 10 SECONDS of wall clock,
        # 399 of them routine HTTP access logs — too narrow to contain even one
        # tick of a 60s maintenance loop, which is exactly what the probe is for.
        # The access lines are dropped for the same reason; what is left is
        # startup, the maintenance loops and anything that raised.
        #
        # The httpx line for every call INTO the device connection owner goes
        # with them: one live room emits several a second, so on 2026-09-15 a
        # 600-line tail covered four seconds of wall clock and nothing else —
        # the same failure the line budget had, arriving through a different
        # door. Calls that raised still show up; it is the 200s that are noise.
        run: |
          docker logs --since 2h --timestamps cheese-backend-1 2>&1 \
            | grep -v 'uvicorn.access\|\[http\][[:space:]]*bytes=' \
            | grep -v 'device-connection:8082.*"HTTP/1.1 200 OK"' \
            | tail -600 || true
      - name: Device connection log tail
        # The owner of the DeviceHub is a SEPARATE process on a separate release
        # boundary (deploy/release-device-connection.sh), and every executor call,
        # every machine link and every terminal WebSocket lives in it — not in the
        # backend the probe above reads. The backend only ever sees its HTTP
        # status, so a device-side failure reaches a person as a bare
        # `500 Internal Server Error for url .../call/call_executor` with the
        # reason — a refused socket, an offline machine, a connector's own error
        # string — visible nowhere but here.
        #
        # Its image sha is printed above on purpose: an app release deliberately
        # leaves this container alone, so it routinely runs older code than the
        # backend beside it, and reading its log without knowing which build
        # produced the lines has sent people to the wrong commit.
        #
        # Same rule as every other probe: fixed window, fixed filter, no inputs.
        #
        # The four routine `execution_timing` stages are dropped and
        # `stage=device_error` deliberately kept. Every executor call logs all
        # four at INFO, so an unfiltered 600-line tail of a box with live rooms
        # is twelve seconds of nothing but timings — measured, not guessed:
        # the first run of this probe returned 600 of 600 such lines. The error
        # stage is the one that says a call FAILED, which is the whole reason
        # to read this log.
        run: |
          container="$(docker ps --format '{{.Names}} {{.Image}}' \
            | grep device-connection || true)"
          echo "===== $container ====="
          name="${container%% *}"
          [ -n "$name" ] || exit 0
          docker inspect -f 'status={{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}}' "$name" 2>&1 || true
          docker logs --since 2h --timestamps "$name" 2>&1 \
            | grep -v 'uvicorn.access\|\[http\][[:space:]]*bytes=' \
            | grep -vE 'stage=(device_send_start|device_sent|device_first_data|device_complete)' \
            | tail -600 || true
      - name: Data plane (llm tunnel + api front)
        # The standing pair from #573 carries ALL machine model traffic, and it
        # is deliberately outside deploy-docker.sh's stack — so when it breaks,
        # nothing in the backend's own log says so. On 2026-08-18 every claude
        # on the dev box died with `API Error: Unable to connect to API
        # (ConnectionRefused)` while cheese-llm-tunnel and cheese-api-front were
        # both listed as running: "the container is up" is not "the pipe works",
        # and their logs were the one place that could tell the two apart.
        #
        # Port bindings go with the logs on purpose: this pair's whole contract
        # is who owns :8081 and who answers on :8091, and a half-finished
        # cutover (backend still on :8081, or nginx pointing at a port nothing
        # serves) is invisible in `docker ps --format '{{.Names}}'`.
        run: |
          for c in cheese-llm-tunnel cheese-api-front; do
            echo "===== $c ====="
            docker inspect -f '{{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}}' "$c" 2>&1 || true
            docker port "$c" 2>&1 || true
            docker logs --since 2h --timestamps --tail 200 "$c" 2>&1 || true
          done
          echo "===== who owns :8081 / :8091 ====="
          docker ps --format '{{.Names}}  {{.Ports}}' | grep -E '8081|8091|18081' || true
      - name: Model gateway failures (proxy, gateway, gateway database)
        # A model failure reaches a room as an event block carrying a status
        # code and a request id and nothing else (`backend_log.py`). What the
        # gateway actually answered, and whether it answers that way more often
        # than it used to, is on THIS box in three places and readable from
        # nowhere else: the metering proxy's log, which carries a
        # `gateway_request_timing` line for EVERY request with its status — so a
        # failure count has a denominator, and "more failures" can be told apart
        # from "more traffic"; the gateway container's own log; and the gateway's
        # database, which LiteLLM writes to for every call it serves and every
        # call it fails (`failure_callback: ["postgres"]`).
        #
        # The window is printed rather than assumed. docker's json-file
        # rotation, not `--since`, decides how far back the log actually
        # reaches, and a before/after whose "before" starts after the change
        # under suspicion is worse than no comparison at all. The `StartedAt`
        # stamps are there for the same reason: the addon is mounted into a
        # stock mitmproxy image and the gateway image is built on the box, so
        # when each container last started is when its current code went live.
        #
        # Redacted on the way out — an upstream auth failure can echo a virtual
        # key into an exception string, and a run log is readable by everyone
        # with repo access. Request bodies and tracebacks are dropped rather
        # than redacted: they carry prompts.
        run: |
          redact() { sed -E 's/sk-[A-Za-z0-9_-]{6,}/sk-REDACTED/g'; }
          echo "===== containers: what runs, since when, how much log it keeps ====="
          for c in cheese-metering-proxy cheese-gateway-litellm-1 cheese-gateway-litellm-db-1; do
            docker inspect -f '{{.Name}} image={{.Config.Image}} started={{.State.StartedAt}} restarts={{.RestartCount}} log={{json .HostConfig.LogConfig}}' "$c" 2>&1 || true
          done
          docker image inspect -f 'gateway image built={{.Created}} tags={{.RepoTags}}' \
            "$(docker inspect -f '{{.Config.Image}}' cheese-gateway-litellm-1 2>/dev/null)" 2>&1 || true

          log="${RUNNER_TEMP:-/tmp}/metering-proxy.log"
          docker logs --since 48h --timestamps cheese-metering-proxy 2>&1 | redact > "$log" || true
          echo "===== proxy log: lines held, and the window they cover ====="
          wc -l < "$log" || true
          head -1 "$log" | cut -c1-32 || true
          tail -1 "$log" | cut -c1-32 || true
          echo "===== every gateway request, by hour and status ====="
          grep -F 'gateway_request_timing' "$log" \
            | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}):.*"status": ?([a-z0-9]+).*/\1 status=\2/' \
            | grep -E '^[0-9]{4}' | sort | uniq -c || true
          echo "===== failures the proxy reported, by hour ====="
          grep -E 'Gateway(HTTP|Stream)Error' "$log" \
            | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}):.*(GatewayHTTPError|GatewayStreamError).*/\1 \2/' \
            | sort | uniq -c || true
          echo "===== the last 40 of them, verbatim ====="
          grep -E 'Gateway(HTTP|Stream)Error' "$log" | tail -40 || true
          echo "===== gateway container: anything that raised (6h) ====="
          docker logs --since 6h --timestamps cheese-gateway-litellm-1 2>&1 \
            | grep -iE 'error|exception|traceback' | tail -80 | redact || true
          echo "===== gateway database: what failed, and how much was served ====="
          docker exec -i cheese-gateway-litellm-db-1 \
            psql -U litellm -d litellm -A -P pager=off 2>&1 <<'SQL' | redact || true
          SELECT to_regclass('public."LiteLLM_ErrorLogs"') AS error_table,
                 to_regclass('public."LiteLLM_SpendLogs"') AS spend_table;
          SELECT column_name FROM information_schema.columns
           WHERE table_name = 'LiteLLM_ErrorLogs' ORDER BY ordinal_position;
          SELECT date_trunc('hour', "startTime") AS hour, count(*) AS calls
            FROM "LiteLLM_SpendLogs" WHERE "startTime" > now() - interval '72 hours'
           GROUP BY 1 ORDER BY 1 DESC;
          SELECT date_trunc('hour', "startTime") AS hour, status_code, exception_type,
                 count(*) AS failures
            FROM "LiteLLM_ErrorLogs" WHERE "startTime" > now() - interval '72 hours'
           GROUP BY 1, 2, 3 ORDER BY 1 DESC LIMIT 200;
          SELECT to_jsonb(e) - 'request_kwargs' - 'traceback'
            FROM "LiteLLM_ErrorLogs" e WHERE "startTime" > now() - interval '72 hours'
           ORDER BY "startTime" DESC LIMIT 15;
          SQL
      - name: Reported model failures, as the rooms received them
        # The other end of the same story: what the backend WROTE into rooms.
        # `backend_log.py` keeps the reporter's `exc_type` and the gateway's
        # `x-litellm-call-id` in the block's `meta`, and that id is what joins a
        # room's complaint to a row in the gateway's error log above — the one
        # link that says whether a reported 500 came from LiteLLM at all, and
        # which upstream exception it was. No route reads these back: a block is
        # served only inside its own topic, to people who can already open it.
        #
        # Ids, counts and the platform's own event line only — never a room's
        # messages. Fixed query, no parameters, same rule as every probe here.
        run: |
          docker exec -i cheese-backend-1 python - 2>&1 <<'PY' || true
          import asyncio
          import os

          import asyncpg

          DSN = (
              os.environ["DATABASE_URL"]
              .replace("postgresql+asyncpg://", "postgresql://")
              .replace("postgresql+psycopg2://", "postgresql://")
          )
          KINDS = ["GatewayHTTPError", "GatewayStreamError"]
          BY_HOUR = (
              "SELECT date_trunc($1::text, created_at) AS hour,"
              " meta ->> $2::text AS exc, count(*) AS blocks"
              " FROM blocks WHERE meta ->> $2::text = ANY($3::text[])"
              " AND created_at > now() - make_interval(hours => 72)"
              " GROUP BY 1, 2 ORDER BY 1 DESC"
          )
          ROWS = (
              "SELECT created_at, project_id, topic_id, meta ->> $1::text AS exc,"
              " meta ->> $2::text AS request_id, meta ->> $3::text AS burst_count,"
              " left(content, 200) AS line"
              " FROM blocks WHERE meta ->> $1::text = ANY($4::text[])"
              " AND created_at > now() - make_interval(hours => 72)"
              " ORDER BY created_at DESC LIMIT 40"
          )


          async def main() -> None:
              conn = await asyncpg.connect(DSN)
              try:
                  print("===== reported model failures, by hour (72h) =====")
                  for row in await conn.fetch(BY_HOUR, "hour", "exc_type", KINDS):
                      print(dict(row))
                  print("===== the last 40, with the gateway request id =====")
                  for row in await conn.fetch(ROWS, "exc_type", "request_id", "count", KINDS):
                      print(dict(row))
              finally:
                  await conn.close()


          asyncio.run(main())
          PY
      - name: Public entrypoint (cloudflared connector)
        # okcheese.com reaches this box through ONE cloudflared connector running
        # here as a systemd unit. When that connector dies the edge serves 530 to
        # every visitor while the box itself stays perfectly healthy — deploys go
        # green, healthz answers, containers run — so nothing else in this file
        # can tell the difference between "the site is down" and "the site is up".
        #
        # The 2026-08-25 outage burned three days on exactly that gap: the tunnel
        # was down and the only way in was a key/route combination no single host
        # had. The connector runs HERE, and the runner is already here.
        #
        # Reads only: unit state, why it last failed, and whether this box can
        # still open the outbound TCP session the connector needs. No restart,
        # no config edit — a probe that repairs is a probe nobody can run safely
        # while they are still trying to understand the failure.
        run: |
          systemctl is-active cloudflared 2>&1 || true
          systemctl show cloudflared -p ActiveState -p SubState -p Result \
            -p NRestarts -p ExecMainStartTimestamp 2>&1 || true
          journalctl -u cloudflared --since -6h --no-pager 2>&1 | tail -80 || true
          echo "===== egress to the tunnel edge (TCP 7844, http2 protocol) ====="
          for ip in 198.41.192.167 198.41.200.113; do
            timeout 8 bash -c "cat < /dev/null > /dev/tcp/$ip/7844" \
              && echo "$ip:7844 reachable" || echo "$ip:7844 UNREACHABLE"
          done
          echo "===== resolver + default route ====="
          cat /etc/resolv.conf 2>&1 | grep -v '^#' || true
          ip route show default 2>&1 || true

  prod-box:
    runs-on: [self-hosted, cheese-prod]
    timeout-minutes: 5
    steps:
      - name: Database encoding
        run: |
          docker exec cheese-backend-1 python -c '
          import os

          Q = (
              "SELECT current_database(), pg_encoding_to_char(encoding), "
              "datcollate, version() "
              "FROM pg_database WHERE datname = current_database()"
          )
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              cand = [k for k in os.environ if "DATABASE" in k or "POSTGRES" in k]
              raise SystemExit(f"no DATABASE_URL; candidates: {cand}")
          dsn = (
              url.replace("postgresql+asyncpg://", "postgresql://")
              .replace("postgresql+psycopg2://", "postgresql://")
          )
          print("db_host:", dsn.rsplit("@", 1)[-1])

          def show(row):
              print(f"db={row[0]} encoding={row[1]} collate={row[2]}")
              print("server:", row[3][:60])

          try:
              import asyncio

              import asyncpg

              async def main():
                  c = await asyncpg.connect(dsn)
                  show(await c.fetchrow(Q))
                  await c.close()

              asyncio.run(main())
          except ModuleNotFoundError:
              import psycopg2

              with psycopg2.connect(dsn) as conn:
                  with conn.cursor() as cur:
                      cur.execute(Q)
                      show(cur.fetchone())
          '
      - name: Deployed images and disk
        run: |
          docker ps --format '{{.Names}}  {{.Image}}' || true
          df -h / | tail -1

  # The cheese-ci pool, which now runs every heavy job (test, migration-heads,
  # e2e) and had no diagnostic probe at all.
  #
  # Each pool VM registers TWO runner slots, so covering the pool means covering
  # six slots, not three — three concurrent jobs can land on two machines and
  # leave the third unseen. Saturating all six for ~20s is affordable only
  # because this workflow is workflow_dispatch-only. box-heartbeat.yml
  # deliberately does NOT fan out this way: an hourly probe that needs every
  # slot at once would queue behind an ordinary merge burst and alert on a
  # perfectly healthy pool.
  #
  # `slot` is a fan-out counter only — it is not a machine identity and does not
  # map to cheese-ci-runner-N. `hostname` in the output is the real identity.
  # If a pool machine is down, its job stays QUEUED rather than failing
  # (timeout-minutes bounds execution, not queueing) — a job stuck in "Queued"
  # here IS the signal that the pool is short a machine.
  #
  # Memory is probed because it is what kills jobs here: two runner slots share
  # one VM's RAM, and a job that loses that race is SIGKILLed by the kernel —
  # `exit code 137`, with no message from the tool that died. That failure is
  # unreadable from the job log alone, which is exactly the case this workflow
  # exists for.
  #
  # No database probe: these VMs run no deployment — no cheese-backend-1, no
  # DATABASE_URL. Disk is what matters. They are 40G, every run's postgres
  # service container leaves an anonymous volume behind, and the weekly cron in
  # ci-runner/deps.sh is `docker system prune -af` WITHOUT `--volumes`, which
  # does not touch volumes. This same leak reached 57 volumes / 19GB on the dev
  # box and failed a run with "No space left on device".
  ci-pool:
    strategy:
      fail-fast: false
      # One job per runner SLOT, not per machine: a machine carries two, so
      # three jobs could land on two machines and leave the third unseen. Six
      # jobs cover every slot, and therefore every machine — twice over, which
      # the hostname line below makes obvious rather than confusing.
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 5
    steps:
      - name: Host, disk and docker reclaimables
        run: |
          echo "host: $(hostname)"
          df -h / | tail -1
          docker system df
          echo "dangling volumes: $(docker volume ls -qf dangling=true | wc -l)"
      - name: Memory, and what the kernel killed
        run: |
          echo "host: $(hostname)  cores: $(nproc)"
          free -m
          echo "--- swap"
          swapon --show || echo "(no swap configured)"
          echo "--- biggest resident processes"
          ps -eo rss,etimes,comm --sort=-rss | head -8
          echo "--- runner slots on this host"
          pgrep -af 'Runner.Listener' | sed 's/ --.*//' || echo "(none visible)"
          echo "--- kernel OOM kills (this boot)"
          # A probe must not fail on a box that does not let it read the ring
          # buffer; an empty section is a real answer here.
          { dmesg -T 2>/dev/null || journalctl -k --no-pager -q 2>/dev/null; } \
            | grep -iE 'out of memory|oom-kill|killed process' | tail -10 \
            || echo "(none found, or the ring buffer is not readable)"
