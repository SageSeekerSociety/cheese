name: Repo Guards

# Machine-enforced versions of rules this repo already states as absolute.
#
# The motivating evidence is in the repo itself: .claude/rules/backend-tests.md
# says "Eight files already carry a copy-pasted _auth() helper — don't add a
# ninth", and there are now nine. A rule that only an agent's diligence enforces
# is a rule that decays. Nothing here changes what is allowed; it changes who
# notices.
#
# `.github/workflows/**` is in the path filter because one of the guards judges
# the workflows themselves (action pinning) — filtering on this file alone would
# let an unpinned action land in any other workflow without ever running it.
# And `frontend/**`, for the same reason: the fixed-palette guard judges .vue
# templates, and the change it exists to catch — a new `color="grey-lighten-5"`
# on a component — is by definition a frontend-only diff, which without this
# line would sail past without the guard ever starting.
on:
  workflow_call:
permissions:
  contents: read

# Cancel superseded runs on a PR, never in the merge queue. Keying queue runs
# by sha gives each queued commit its own group, so one entry cannot cancel
# another's run and leave the commit that lands on main with no result — a
# cancelled run is not a red run. PR refs keep the ref key, so repeated pushes
# to one PR still supersede each other.
concurrency:
  group: repo-guards-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This job used to need nothing but bash and python3. It now runs the
      # guards through pre-commit, so that CI and a developer's commit read one
      # list instead of two — and that needs uv on PATH. Same pin as test.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml
          prune-cache: false
          # Restore only: warm-caches.yml saves this key on main.
          save-cache: false

      # Each guard proves itself before it is trusted to judge the tree: a guard
      # that silently stopped matching would otherwise look identical to a clean
      # repo, which is the failure mode these guards exist to prevent.
      - name: Guards self-test
        run: |
          bash .claude/scripts/check-repo-rules.sh --self-test
          bash .claude/scripts/check-action-pins.sh --self-test
          python3 .claude/scripts/check-migration-fork.py --self-test
          python3 .claude/scripts/check-file-sizes.py --self-test
          python3 .claude/scripts/scene-ratchet.py --self-test
          python3 .claude/scripts/frontend_grade.py --self-test
          python3 .claude/scripts/catalog-ratchet.py --self-test

      # The docker-free test services: how start treats a port already held by
      # a server of ours from older pins, or by someone else (stand-in binaries).
      - name: dev-db.sh tests
        run: bash .claude/scripts/test-dev-db.sh

      # Every helper test beside the scripts in .github/scripts, minus the two
      # owned by Required CI itself (test_required_ci.py runs in the scope job,
      # test_ci_fast.py in the cifast job of required-ci.yml — that one drives
      # real pre-commit and is too slow for this lane). The exclusion is by
      # name, so a helper test added tomorrow is collected here automatically;
      # it must not need a list edit somewhere to start running.
      - name: CI helper tests
        run: |
          python3 - <<'PYEOF'
          import importlib.util
          import pathlib
          import unittest

          OWNED_BY_REQUIRED_CI = {"test_required_ci", "test_ci_fast"}
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for path in sorted(pathlib.Path(".github/scripts").glob("test_*.py")):
              if path.stem in OWNED_BY_REQUIRED_CI:
                  continue
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              suite.addTests(loader.loadTestsFromModule(module))
          result = unittest.TextTestRunner().run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYEOF

      # Run through pre-commit rather than calling the scripts directly, so
      # this job and a developer's commit are the same list by construction.
      # The guards' own --self-test above still calls them directly: that step
      # proves the guard fires, which is a different question from whether the
      # tree passes it.
      - name: Repo rules (datetime, HTTPException, palette, platform CLI, …)
        run: uvx pre-commit run --all-files repo-rules

      # Third-party actions run on the dev and prod boxes themselves (build.yml,
      # build-tmux.yml and deploy-dev.yml all target self-hosted runners), so a
      # repointed upstream tag executes with the docker socket and the ghcr
      # credentials in reach. Pins make that an upgrade we review, not one that
      # happens to us.
      - name: Actions are pinned to a commit SHA
        run: uvx pre-commit run --all-files action-pins


      # The remote-tracking ref has to exist for the comparison; a PR checkout
      # does not create it. So does the HISTORY behind it, and that is the part
      # this step used to skip: a file-size finding is measured at the merge
      # base with main, and a depth-1 checkout has no common ancestor to compute
      # one from. The old fallback compared against main's tip, which failed
      # PR #2173 for frontend/src/api.ts "growing" 3615 → 3610 — main had shrunk
      # the file after that branch forked, and the branch never touched it.
      # check-file-sizes.py now exits 2 (cannot judge) rather than guess, so
      # this fetch is what makes the guard judgeable at all. Note the command:
      # a `--depth=1` here would RE-shallow origin/main and undo the merge base.
      - name: Fetch main for comparison
        run: git fetch --no-tags --unshallow origin

      - name: Alembic chain would not fork on merge
        run: uvx pre-commit run --all-files migration-fork

      # Runs here rather than in the backend lane because it needs the ref above
      # and the history behind it: the comparison is against the merge base with
      # main, and a file is frozen at the size it had there. No database, no uv
      # venv, no network — it reads the changed files and counts lines.
      - name: No file grew past its size cap
        run: uvx pre-commit run --all-files file-size
