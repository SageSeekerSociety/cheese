name: Deploy (dev/test box)
# The commit a run releases. For a build-completed event the run's own head SHA
# is main's tip when the event fired, which can be a later commit than the one
# whose images it deploys; .claude/scripts/pr-watch.sh reads this name instead.
run-name: Deploy ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}

# Continuous deployment to the cheese dev/test box (cheese-dev-env1-app,
# 192.168.16.5). The box is on ghg's private network with no public inbound, so
# GitHub-hosted runners can't reach it — a self-hosted runner (label
# `cheese-dev`) lives ON the box and pulls jobs outbound.
#
# dev runs the unified DOCKER deploy (deploy/deploy-docker.sh), the same one
# prod runs: pull the per-commit images, migrate, up, health-check. The frontend
# image bundles its own nginx; the ghg edge terminates TLS and hits :80.

# Triggered by the image build finishing for a main commit. Required CI for that
# commit ran in the merge queue before the commit reached main, so it has already
# finished by then; the eligibility job still checks both for the candidate SHA
# without occupying the deployment runner.
# A release of a commit from before the two slots per service
# (deploy/deploy-docker.sh, "Two slots"), a revert or a manual dispatch, runs
# that commit's own script. It installs its own app-router.conf and reloads —
# which ends app-router's sockets 30 s later — pulls and migrates, and then
# refuses to switch while app-router names BACKEND_PORT_NEXT or
# FRONTEND_PORT_NEXT, as it does whenever the `-b` slots serve. The box's :8080
# and :80 stay up through that (they live in frontend.conf). If a revert lands
# while the `-b` slots serve, no commit on main has the slots any more, and
# every automatic deploy of main does exactly that. deploy-drift.yml converges
# it instead of re-firing that forever: deploy/converge-deploy-drift.sh
# dispatches this workflow on main with `ref` naming the newest commit that
# still has the slots (#2770), which moves back to `backend` and `frontend`;
# the next release of main then goes through. Roll back to a pre-slot commit
# the same way by hand — name it in `ref` — when the last deploy's log ends
# with "backend-b and frontend-b serve this release". From the first slots an
# older commit releases as it always did. deploy/tests/test-pre-slot-release.sh
# checks both states against the last commit before the slots, and
# deploy/tests/test-converge-drift.sh drives the drift job's choice.
on:
  workflow_dispatch:
    inputs:
      rebuilt:
        # desktop.yml names the commit whose images it just rebuilt to carry
        # new installers: a build it starts raises no workflow_run event, so it
        # asks here instead, and gets the same guards as an event-driven
        # release. The commit is named, not taken from the ref, because main
        # can move past it while the rebuild runs.
        description: Release this commit, whose images were just rebuilt, like an automatic deploy (check images, Required CI and the running version)
        type: string
        default: ""
      ref:
        # The rollback entry: dispatch the workflow on main and name the commit
        # to release here. A bare commit SHA is not a legal `--ref` for
        # `gh workflow run` (No ref found), so naming the commit in the ref
        # input is the only way to release one without first creating a ref for
        # it. Like any other manual dispatch it is an explicit release or
        # rollback: it takes the skip=false path below, so the
        # "keep automatic deployments from going backwards" guard does not
        # block it. Leave empty for the dispatch ref's own HEAD.
        description: "Release the commit this names (tag, branch or SHA) instead of the dispatch ref; a manual release or rollback"
        type: string
        default: ""
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read
  # The feedback step at the end reads when each shipped commit's PR was
  # opened and merged.
  pull-requests: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Require images and tests for the same commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          REBUILT: ${{ inputs.rebuilt }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "${REBUILT:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            python3 deploy/check-auto-deploy.py --ci-only "$CANDIDATE_SHA"
          fi
      # A refused release skips the deploy job, and a run whose only skipped job
      # is the deploy concludes success, which reads as "this commit is on dev".
      - name: Fail when this commit will not be deployed
        if: steps.check.outputs.ready != 'true'
        env:
          CANDIDATE_SHA: ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          live="$(curl -fsS --max-time 10 https://okcheese.com/api/version | jq -r '.data.sha // empty')" || true
          reason="its image build or Required CI has no successful latest attempt"
          echo "Not deployed \`$CANDIDATE_SHA\`: $reason. dev runs \`${live:-unknown}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Not deployed $CANDIDATE_SHA: $reason."
          exit 1
      # A newer commit that can be released already is, by its own run; this
      # one skips its deploy job rather than wait for the deploy-dev group,
      # where it would cancel that newer run if it is still waiting
      # (deploy/check-auto-deploy.py, superseded_by).
      - name: Say which newer commit releases this one
        if: steps.check.outputs.superseded != ''
        env:
          CANDIDATE_SHA: ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          NEWER: ${{ steps.check.outputs.superseded }}
        run: |
          echo "Not deployed \`$CANDIDATE_SHA\` on its own: \`$NEWER\`, newer on main, is ready and its deploy run releases both." >> "$GITHUB_STEP_SUMMARY"

  # A failed build used to leave this workflow SKIPPED, which reads exactly like
  # "nothing to do" — so main could sit ahead of the box with nothing red to
  # show it, and a merged fix looked shipped when it was not. This job turns that
  # case red instead. It touches nothing on the box — it only prints and exits.
  build-did-not-produce-images:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Build and Push Docker Image' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say why nothing was deployed
        run: |
          echo "::error::Build ${{ github.event.workflow_run.conclusion }} for \
          ${{ github.event.workflow_run.head_sha }} — no images were pushed, so \
          dev is still running the previous commit. Re-run the build; a PyPI or \
          registry reset is the usual cause."
          exit 1

  deploy:
    needs: eligibility
    # Ineligible completion events must not replace a pending valid release.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # Automatic releases require successful images and Required CI for this SHA.
    # A manual dispatch retains the operator's explicit release/rollback path.
    if: >-
      needs.eligibility.outputs.ready == 'true' &&
      needs.eligibility.outputs.superseded == ''
    # Names this job's target so GitHub records a deployment for it (a job
    # with `environment:` gets one created on start and marked
    # success/failure at the end). Nothing about the deploy changes — this is
    # what makes "did this change reach dev?" answerable from the API instead
    # of by hunting for a workflow run by filename, which is how the accept
    # path used to guess it (#206). The env has no protection rules, so it adds
    # no approval step.
    environment: dev
    runs-on: [self-hosted, cheese-dev]
    # The first Forge cutover archives workspaces and builds a recovery bundle per task.
    timeout-minutes: 180
    steps:
      # The candidate may predate this guard. Read policy from the workflow's
      # default-branch commit before checking out that candidate's deploy code.
      - name: Check out automatic deployment policy
        if: github.event_name == 'workflow_run' || inputs.rebuilt != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Keep automatic deployments from going backwards
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          REBUILT: ${{ inputs.rebuilt }}
        run: |
          # A manual dispatch is an explicit release or rollback, including a
          # commit that predates the automatic guard itself. desktop.yml's,
          # which names a rebuilt commit, takes the guard like any automatic
          # release.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "${REBUILT:-}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$HOME/ops/deploy.env" ]; then
            . "$HOME/ops/deploy.env"
          fi
          export PROJECT="${PROJECT:-cheese}"
          if [ -n "${REBUILT:-}" ]; then
            python3 deploy/check-auto-deploy.py --rebuilt "$CANDIDATE_SHA"
          else
            python3 deploy/check-auto-deploy.py "$CANDIDATE_SHA"
          fi

      - name: Check out the built commit (for the deploy scripts + compose)
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run checks out the DEFAULT branch unless told otherwise, so
          # pin the exact commit whose images were just built.
          ref: ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # A docs commit can include queued code changes relative to the running
      # release. Only the running-version guard above may skip this deployment.

      # Authenticate for the pull rather than trusting the box's stored login:
      # the images are private, and a deploy must not fail because some other
      # job's cleanup removed a credential.
      - name: Log in to ghcr
        if: steps.release.outputs.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      # The configured half of the admin roster, out of a repo variable. It is
      # MERGED with what the box's env file already names, and this is the point
      # of the step: the variable used to overwrite the file whenever it was
      # non-empty, which made a hand edit to the file temporary — it granted
      # access now, and the next deploy silently took it back — which is the
      # shape of the `/admin/feedback` lockout on 2026-09-21: the box's file had
      # been edited to name the requester, and the roster the deploy wrote back
      # did not.
      #
      # Merging makes both sides additive: adding works from either place, and
      # removing means removing from both. Day-to-day add/remove is the page's
      # (`platform_admins`, batch four); this is the root list that must not be
      # lost, and losing it costs server access to repair.
      #
      # Two variables are read because the setting was renamed
      # (`FEEDBACK_ADMIN_HANDLES` → `PLATFORM_ADMIN_HANDLES`; admins administer
      # the platform, not one feature): a repo variable is a GitHub setting, not
      # something this file can rename, so until someone renames it in the
      # repository, the old name is what carries the roster. The new one wins
      # when both exist. The env file is written with the new name and the old
      # spelling is swept out — the backend reads both, so a leftover old line
      # would be configuration that does nothing.
      #
      # The feedback roster is the other list this step writes, and it is NOT
      # merged: it is who may read private feedback on this box, so the value
      # here is the whole truth and a hand edit to the box does not survive a
      # deploy. It lives in this file rather than a repo variable so that
      # widening it is a reviewed change. See `feedback_triage_handles` in
      # backend/app/core/config.py.
      - name: Configure platform and feedback administrators
        if: steps.release.outputs.skip != 'true'
        env:
          NEW_PLATFORM_ADMIN_HANDLES: ${{ vars.PLATFORM_ADMIN_HANDLES }}
          OLD_FEEDBACK_ADMIN_HANDLES: ${{ vars.FEEDBACK_ADMIN_HANDLES }}
          FEEDBACK_TRIAGE_HANDLES: '["andy"]'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy

          def handle_list(raw, source):
              handles = json.loads(raw)
              if not isinstance(handles, list) or any(
                  not isinstance(handle, str) or not handle.strip() for handle in handles
              ):
                  raise ValueError(f"{source} must be a JSON list of account handles")
              return handles

          path = Path(
              os.environ.get(
                  "BACKEND_ENV_FILE", "/home/nictheboy/cheese-backend-py/backend/.env"
              )
          )

          # What the box already names, under either spelling. Written by hand or
          # by an earlier deploy; both count, because neither is more correct.
          named: dict[str, str] = {}
          if path.exists():
              for line in path.read_text().splitlines():
                  key, separator, value = line.strip().removeprefix("export ").partition("=")
                  if separator and key in ("PLATFORM_ADMIN_HANDLES", "FEEDBACK_ADMIN_HANDLES"):
                      named[key] = value
          existing = handle_list(
              named.get("PLATFORM_ADMIN_HANDLES")
              or named.get("FEEDBACK_ADMIN_HANDLES")
              or "[]",
              "PLATFORM_ADMIN_HANDLES in the env file",
          )

          value = os.environ["NEW_PLATFORM_ADMIN_HANDLES"] or os.environ[
              "OLD_FEEDBACK_ADMIN_HANDLES"
          ]
          from_variable = handle_list(value, "PLATFORM_ADMIN_HANDLES") if value else []
          # A variable that is set but names nobody is a typo, not an instruction
          # to contribute nothing — the way to say the latter is to leave it
          # unset. The list still has to fail closed the way it always did.
          if value and not from_variable:
              raise ValueError("PLATFORM_ADMIN_HANDLES must name at least one account")

          # Order is the file's first, so a deploy that changes nothing changes
          # nothing; `save_environment` skips a write when the text is identical.
          handles = list(existing)
          handles += [handle for handle in from_variable if handle not in handles]

          # One write, both keys in a fixed order, so a deploy that changes
          # nothing rewrites nothing. No platform names anywhere: leave that key
          # alone. Writing an empty list would be a box that cannot boot, which
          # is worse than a box with no roster.
          updates = {}
          if handles:
              updates["PLATFORM_ADMIN_HANDLES"] = json.dumps(handles)
          updates["FEEDBACK_TRIAGE_HANDLES"] = json.dumps(
              handle_list(os.environ["FEEDBACK_TRIAGE_HANDLES"], "FEEDBACK_TRIAGE_HANDLES")
          )
          save = runpy.run_path("deploy/bootstrap-forgejo.py")["save_environment"]
          save(path, updates, remove=["FEEDBACK_ADMIN_HANDLES"] if handles else [])
          PY

      # What cloud compute costs on this box, and whether a session may have a
      # whole cloud VM (#2320). Like the feedback roster above, the value here is
      # the whole truth: a price is a reviewed change, and a hand edit to the
      # box does not survive a deploy. A whole VM is MicroCloud's `standard-vm`
      # offering at its default size (`cloud_vm_cores` / `cloud_vm_memory_mb`).
      - name: Configure cloud compute prices
        if: steps.release.outputs.skip != 'true'
        env:
          CLOUD_SANDBOX_CREDITS_PER_HOUR: "5"
          MICROCLOUD_VM_OFFERING_ID: "55"
          CLOUD_VM_CREDITS_PER_HOUR: '{"4c8g": 20}'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy

          path = Path(
              os.environ.get(
                  "BACKEND_ENV_FILE", "/home/nictheboy/cheese-backend-py/backend/.env"
              )
          )
          prices = json.loads(os.environ["CLOUD_VM_CREDITS_PER_HOUR"])
          if not isinstance(prices, dict) or not all(
              isinstance(price, (int, float)) and price > 0 for price in prices.values()
          ):
              raise ValueError("CLOUD_VM_CREDITS_PER_HOUR must map sizes to prices")
          updates = {
              "CLOUD_SANDBOX_CREDITS_PER_HOUR": str(float(os.environ["CLOUD_SANDBOX_CREDITS_PER_HOUR"])),
              "MICROCLOUD_VM_OFFERING_ID": str(int(os.environ["MICROCLOUD_VM_OFFERING_ID"])),
              "CLOUD_VM_CREDITS_PER_HOUR": json.dumps(prices),
          }
          save = runpy.run_path("deploy/bootstrap-forgejo.py")["save_environment"]
          save(path, updates)
          PY

      # Which release this one replaces, read before it is replaced: the last
      # step below moves the feedback fixed by the commits in between.
      - name: Remember the release being replaced
        id: previous
        if: steps.release.outputs.skip != 'true'
        run: |
          if [ -f "$HOME/ops/deploy.env" ]; then
            . "$HOME/ops/deploy.env"
          fi
          backend="$(bash deploy/app-container.sh backend || true)"
          if [ -n "$backend" ]; then
            image="$(docker inspect --format '{{.Config.Image}}' "$backend")"
            echo "tag=${image##*:}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker deploy this commit
        if: steps.release.outputs.skip != 'true'
        env:
          CHEESE_CENTRAL_SESSION_HOST: "1"
        run: APP_RELEASE="$(git rev-parse HEAD)" bash deploy/deploy-docker.sh "$(bash deploy/image-tag.sh HEAD)"

      - name: Release the verified metering image
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          METERING_ALLOW_INTERRUPT: "1"
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          python3 deploy/check-auto-deploy.py --require-ci "$release_sha"
          bash deploy/release-metering-proxy.sh "$release_sha"

      # A commit carrying `Fixes-feedback: FB-<n>` moves that report to 已修复
      # at the time its PR merged and to 已上线 once the release containing it is
      # live, which is here: every step above succeeded. Only the commits since
      # the replaced release are read, so a report someone reopened later is not
      # moved back by an unrelated deploy. The merge time is the PR's
      # `merged_at`: the commit's own dates are from when it entered the merge
      # queue, which is minutes earlier. A commit pushed without a PR falls back
      # to its committer date, which is when it was pushed. The same lookup
      # gives the PR's `created_at`, recorded as 处理中 on a report nobody
      # assigned; without a PR there is none.
      # The status change goes through the backend's own service in the running
      # container, the way the deploy already runs its other backend scripts —
      # no endpoint, no credential. Convention: app/domain/feedback/shipping.py.
      - name: Mark the feedback this release fixes as deployed
        if: steps.release.outputs.skip != 'true' && steps.previous.outputs.tag != ''
        # The release is already live by now; this only moves feedback reports
        # along. One `gh api` call per shipped commit, none of which time out on
        # their own: a connection the runner lost hung this step for 13 minutes
        # until the next deploy cancelled the run. Bounded, and not the deploy's
        # failure when it runs out.
        timeout-minutes: 3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -f "$HOME/ops/deploy.env" ]; then
            . "$HOME/ops/deploy.env"
          fi
          backend="$(bash deploy/app-container.sh backend)"
          commits="$RUNNER_TEMP/shipped-commits.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS...$(git rev-parse HEAD)" \
            --jq '[.commits[] | {sha, message: .commit.message, merged_at: .commit.committer.date}]' \
            > "$commits"
          COMMITS="$commits" python3 - <<'PY' \
            | docker exec -i "$backend" python -m scripts.ship_feedback \
                --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          import json
          import os
          import subprocess
          import sys

          commits = json.load(open(os.environ["COMMITS"]))
          for commit in commits:
              pulls = json.loads(subprocess.run(
                  [
                      "gh", "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{commit['sha']}/pulls",
                      "--jq", "[.[] | select(.merged_at != null) | {merged_at, created_at}]",
                  ],
                  check=True, capture_output=True, text=True,
              ).stdout)
              if pulls:
                  commit["merged_at"] = pulls[0]["merged_at"]
                  commit["pr_created_at"] = pulls[0]["created_at"]
          json.dump(commits, sys.stdout)
          PY

      # A release that finds the same or a newer one already running skips and
      # succeeds, so the job's status alone does not say what dev runs. Every
      # run ends by naming the candidate's fate and the commit dev serves.
      - name: Say which commit dev runs
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.rebuilt || inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          SKIP: ${{ steps.release.outputs.skip }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -f "$HOME/ops/deploy.env" ]; then
            . "$HOME/ops/deploy.env"
          fi
          live=unknown
          if backend="$(bash deploy/app-container.sh backend)"; then
            image="$(docker inspect --format '{{.Config.Image}}' "$backend")"
            live="${image##*:}"
          fi
          if [ "$OUTCOME" != success ]; then
            line="Not deployed \`$CANDIDATE_SHA\`: this job ended in $OUTCOME."
          elif [ "$SKIP" = true ]; then
            line="Not deployed \`$CANDIDATE_SHA\`: dev already runs the same release or a newer one."
          else
            line="Deployed \`$CANDIDATE_SHA\`."
          fi
          echo "$line dev runs \`$live\`." >> "$GITHUB_STEP_SUMMARY"
