name: Deploy (dev/test box)

# Continuous deployment to the cheese dev/test box (cheese-dev-env1-app,
# 192.168.16.5). The box is on ghg's private network with no public inbound, so
# GitHub-hosted runners can't reach it — a self-hosted runner (label
# `cheese-dev`) lives ON the box and pulls jobs outbound.
#
# dev runs the unified DOCKER deploy (deploy/deploy-docker.sh): pull the
# per-commit images, migrate, up, health-check. The box was cut over from
# bare-metal to containers by deploy/dev-docker-cutover.sh (host nginx dropped —
# the frontend image bundles its own; the ghg edge terminates TLS and hits :80).
# The bare-metal service is kept installed-but-disabled as an instant fallback.
# (prod still uses deploy-blue-green.sh via deploy-prod.yml until it cuts over.)

# Triggered BY the image build finishing, not by the push. The deploy pulls
# per-commit images, so it must not start before they exist — that used to be a
# separate gate job polling check-runs from a GitHub-hosted runner. Once builds
# moved onto the box's single runner (hosted minutes ran out 2026-07-26), a gate
# job there would DEADLOCK: it would hold the only runner while waiting for a
# build that needs that same runner. An event has no such problem.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # A failed build used to leave this workflow SKIPPED, which reads exactly like
  # "nothing to do" — so main could sit ahead of the box with nothing red to
  # show it, and a merged fix looked shipped when it was not. This job turns that
  # case red instead. It runs nowhere near the box, so it costs nothing.
  build-did-not-produce-images:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: [self-hosted, cheese-dev]
    steps:
      - name: Say why nothing was deployed
        run: |
          echo "::error::Build ${{ github.event.workflow_run.conclusion }} for \
          ${{ github.event.workflow_run.head_sha }} — no images were pushed, so \
          dev is still running the previous commit. Re-run the build; a PyPI or \
          registry reset is the usual cause."
          exit 1

  deploy:
    # A manual dispatch trusts the operator's ref; an automatic run requires the
    # build that triggered it to have SUCCEEDED (a red build has no images).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 30
    steps:
      - name: Check out the built commit (for the deploy scripts + compose)
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the DEFAULT branch unless told otherwise, so
          # pin the exact commit whose images were just built.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # `push` used to carry paths-ignore for docs; a workflow_run event cannot,
      # so keep the intent here — a docs-only commit must not restart a backend
      # people are talking to, even though its images were rebuilt.
      - name: Skip docs-only commits
        id: scope
        run: |
          files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo '')"
          echo "$files" | sed 's/^/  changed: /'
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "docs-only commit — not restarting the deployment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticate for the pull rather than trusting the box's stored login:
      # the images are private, and a deploy must not fail because some other
      # job's cleanup removed a credential.
      - name: Log in to ghcr
        if: steps.scope.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Docker deploy this commit
        if: steps.scope.outputs.skip != 'true'
        run: bash deploy/deploy-docker.sh "$(git rev-parse --short=7 HEAD)"
