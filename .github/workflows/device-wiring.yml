name: Device wiring check (no model spend)

# The cheap half of device verification: proves the box-side PLUMBING is intact
# without driving an agent turn (no tokens, no credits). Complements
# device-smoke.yml, which spends real budget to prove end-to-end behavior.
#
# It exists because a silent regression once removed the whole sandbox router
# (a module-level file read failing at import, swallowed by route discovery):
# every agent hook 404'd for a full deploy cycle and only a live turn revealed
# it. These probes catch that class in seconds, so run them after any deploy.

on:
  workflow_dispatch:
    inputs:
      accept:
        description: "Also accept the card this check files — exercises landing on the upstream (no model spend)"
        type: boolean
        default: false

# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to. Jobs that DO need more (the
# `scope` gh-api jobs) declare it at job level, which overrides this.
permissions:
  contents: read

jobs:
  wiring:
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Probe the sandbox routes the device depends on
        run: |
          set -uo pipefail
          fail=0

          # A scoped token, minted the same way a turn does.
          TOK="$(docker exec -w /app -e PYTHONPATH=/app cheese-backend-1 python -c "
          from app.core.sandbox_auth import mint_scoped_token
          print(mint_scoped_token(project_id='00000000-0000-0000-0000-000000000001',
                                  topic_id='00000000-0000-0000-0000-000000000002'))" | tr -d '\r')"
          [ -n "$TOK" ] && echo "PASS  scoped token minted" || { echo "FAIL  could not mint a scoped token"; fail=1; }

          # 1) The hooks route must EXIST (401 without a token, never 404 — a 404
          #    means the router is unmounted and every agent event is being lost).
          code="$(docker exec cheese-backend-1 python -c "
          import urllib.request, urllib.error, json
          req = urllib.request.Request('http://localhost:8081/sandbox/hooks/00000000-0000-0000-0000-000000000002',
                                       data=json.dumps({}).encode(), method='POST',
                                       headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r: print(r.status)
          except urllib.error.HTTPError as e: print(e.code)")"
          if [ "$code" = "401" ]; then
            echo "PASS  /sandbox/hooks route mounted (401 without a token)"
          else
            echo "FAIL  /sandbox/hooks returned $code — expected 401; 404 means the router is unmounted"; fail=1
          fi

          # 2) The CLI endpoint must serve the REAL script, not an error body: a
          #    short 200/404 body is what silently shipped a 100-byte 'cheese' to
          #    the device and made every platform action unavailable to the agent.
          body="$(docker exec cheese-backend-1 python -c "
          import urllib.request, urllib.error
          req = urllib.request.Request('http://localhost:8081/sandbox/cli/cheese', headers={'X-Cheese-Token': '$TOK'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r: print(r.read().decode('utf-8', 'replace'))
          except urllib.error.HTTPError as e: print('HTTP', e.code, e.read()[:200].decode('utf-8', 'replace'))")"
          size=$(printf '%s' "$body" | wc -c | tr -d ' ')
          # Do not pipe the large body into grep -q under pipefail: grep exits
          # early on a match, printf gets SIGPIPE, and a healthy CLI looks false.
          if grep -q "accept-request" <<<"$body" && [ "$size" -gt 1000 ]; then
            echo "PASS  /sandbox/cli/cheese serves the real CLI (${size} bytes)"
          else
            echo "FAIL  /sandbox/cli/cheese returned ${size} bytes: $(printf '%s' "$body" | head -c 200)"; fail=1
          fi


          # 3) The device must be enrolled AND online, or every turn queues. The
          #    probe runs as a FILE (inline python through YAML + bash -e was too
          #    fragile: one non-zero exit aborted the whole step before it could
          #    report) and always prints a number, so `|| echo 0` can never mask
          #    a crash into a silent pass.
          docker cp backend/scripts/device_online_probe.py cheese-backend-1:/tmp/ >/dev/null
          online="$(docker exec -w /app -e PYTHONPATH=/app cheese-backend-1 \
            python /tmp/device_online_probe.py 2>/tmp/probe.err | tail -1 || echo 0)"
          echo "device detail: $(cat /tmp/probe.err 2>/dev/null | head -3)"
          if [ "${online:-0}" -gt 0 ] 2>/dev/null; then
            echo "PASS  $online device(s) online"
          else
            echo "FAIL  no device online — turns would queue forever"
            echo "--- connector service ---"
            systemctl is-active cheese.service || true
            echo "--- connector journal (tail) ---"
            journalctl -u cheese.service -n 12 --no-pager 2>/dev/null | tail -6 || true
            curl -s -o /dev/null -w 'backend /healthz -> %{http_code}\n' http://192.168.16.5:8081/healthz || true
            fail=1
          fi

          exit $fail

      # The two DEVICE CAPABILITIES self-hosting depends on, exercised from the
      # device side with zero model spend: the agent's model provider is not
      # involved in either (the CLI talks to the platform API, and git carries
      # the device's branch back). A paid device-smoke run proves the agent
      # CHOOSES to use them; these prove the device CAN.
      - name: Device capabilities (git clone/push + shipped CLI) — no model spend
        run: |
          set -uo pipefail
          fail=0
          docker cp backend/scripts/device_capability_setup.py cheese-backend-1:/tmp/ >/dev/null
          docker cp backend/scripts/device_capability_verify.py cheese-backend-1:/tmp/ >/dev/null

          setup="$(docker exec -w /app -e PYTHONPATH=/app cheese-backend-1 \
            python /tmp/device_capability_setup.py 2>/dev/null || true)"
          eval "$(printf '%s\n' "$setup" | grep -E '^(PROJECT|TOPIC|TOKEN|BRANCH)=')"
          if [ -z "${TOPIC:-}" ] || [ -z "${TOKEN:-}" ] || [ -z "${BRANCH:-}" ]; then
            echo "FAIL  could not prepare a scratch topic:"; printf '%s\n' "$setup" | head -5; exit 1
          fi
          echo "CAP_TOPIC=$TOPIC" >> "$GITHUB_ENV"
          echo "topic=$TOPIC branch=$BRANCH"

          # #94 — reproduce the exact device boundary: clone the topic branch into
          # a device-owned tree, commit a marker, and push it through smart HTTP.
          MARKER="cap-$(date +%s)-$RANDOM"
          DEVICE_TREE="$PWD/tmp/device-capability-$TOPIC"
          CLI_PROBE="$PWD/tmp/device-capability-cli-$TOPIC"
          # Port 8081 is the backend app itself. Only the public nginx gateway
          # adds and strips /api, so direct device probes use bare route paths.
          REMOTE="http://192.168.16.5:8081/projects/$PROJECT/git"
          case "$DEVICE_TREE" in
            "$PWD"/tmp/device-capability-*) ;;
            *) echo "FAIL  unsafe device tree path: $DEVICE_TREE"; exit 1 ;;
          esac
          mkdir -p "$PWD/tmp"
          if [ -e "$DEVICE_TREE" ]; then
            rm -rf -- "$DEVICE_TREE"
          fi
          if git -c http.extraHeader="X-Cheese-Token: $TOKEN" \
              clone -q --branch "$BRANCH" --single-branch "$REMOTE" "$DEVICE_TREE"; then
            git -C "$DEVICE_TREE" config user.name "Cheese device check"
            git -C "$DEVICE_TREE" config user.email "device-check@zhishi.local"
            git -C "$DEVICE_TREE" config http.extraHeader "X-Cheese-Token: $TOKEN"
            printf 'device probe %s\n' "$MARKER" > "$DEVICE_TREE/DEVICE_PROBE.txt"
            git -C "$DEVICE_TREE" add DEVICE_PROBE.txt
            git -C "$DEVICE_TREE" commit -q -m "test: add device capability marker"
            if git -C "$DEVICE_TREE" push -q origin "HEAD:$BRANCH"; then
              echo "PASS  device clone committed and pushed $BRANCH"
            else
              echo "FAIL  device could not push $BRANCH"; fail=1
            fi
          else
            echo "FAIL  device could not clone $BRANCH"; fail=1
          fi

          # #95 — fetch the CLI the way the screen launcher does, then FILE A CARD
          # with it using the screen's scoped token. This is the whole platform-
          # action path, end to end, on the device.
          curl -sS -f -m 15 -H "X-Cheese-Token: $TOKEN" \
            "http://192.168.16.5:8081/sandbox/cli/cheese" -o "$CLI_PROBE" || true
          chmod +x "$CLI_PROBE" 2>/dev/null || true
          out="$(CHEESE_API=http://192.168.16.5:8081 CHEESE_PROJECT="$PROJECT" \
                 CHEESE_TOPIC="$TOPIC" CHEESE_TOKEN="$TOKEN" CHEESE_AUTHOR=cheese \
                 python3 "$CLI_PROBE" accept-request andy "设备能力检查" \
                   --subject "test(device): verify clone and platform CLI wiring" \
                   2>&1 || true)"
          echo "cli said: $(printf '%s' "$out" | head -c 200)"

          verify="$(docker exec -w /app -e PYTHONPATH=/app cheese-backend-1 \
            python /tmp/device_capability_verify.py "$TOPIC" "$MARKER" 2>/dev/null || true)"
          eval "$(printf '%s\n' "$verify" | grep -E '^(CARDS|MARKER)=')"
          if [ "${CARDS:-0}" -gt 0 ] 2>/dev/null; then
            echo "PASS  the shipped cheese CLI filed an accept card from the device (${CARDS})"
          else
            echo "FAIL  the CLI could not file a card from the device"; fail=1
          fi
          if [ "${MARKER:-0}" = "1" ]; then
            echo "PASS  the backend sees the branch pushed by the device"
          else
            echo "FAIL  the device's pushed marker is missing from the topic branch"; fail=1
          fi

          # Leave the topic branch clean even when the optional accept step runs.
          if [ -d "$DEVICE_TREE/.git" ]; then
            if git -C "$DEVICE_TREE" rm -q DEVICE_PROBE.txt \
                && git -C "$DEVICE_TREE" commit -q -m "test: remove device capability marker"; then
              if git -C "$DEVICE_TREE" push -q origin "HEAD:$BRANCH"; then
                echo "PASS  removed the capability marker from $BRANCH"
              else
                echo "FAIL  could not remove the capability marker from $BRANCH"; fail=1
              fi
            else
              echo "FAIL  could not commit capability marker cleanup"; fail=1
            fi
          fi
          rm -rf -- "$DEVICE_TREE"
          rm -f -- "$CLI_PROBE"

          exit $fail

      # The LANDING half, still without a model: the card this check just filed is
      # accepted exactly as the UI button would, so 采纳 → merge → sync upstream →
      # fast-forward runs for real. The capability commits have no net tree change,
      # so the check exercises the path without leaving probe content behind.
      - name: Accept the filed card (lands on the upstream)
        if: ${{ inputs.accept }}
        run: |
          set -uo pipefail
          TOPIC="${CAP_TOPIC:-}"
          [ -n "$TOPIC" ] || { echo "no topic recorded by the capability step"; exit 1; }
          docker cp backend/scripts/accept_topic_card.py cheese-backend-1:/tmp/ >/dev/null
          docker exec -w /app -e PYTHONPATH=/app cheese-backend-1 \
            python /tmp/accept_topic_card.py "$TOPIC"
