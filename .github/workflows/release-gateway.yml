name: Release gateway

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full merged main SHA with successful Build and Required CI
        required: true
      interrupt:
        description: >-
          Acknowledge interrupting active model streams. Needed only when the release must
          replace gateway-netns, the container that owns the gateway's address (the move
          from the single gateway container, or a change to its port, networks or image);
          a gateway or proxy release never does.
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: gateway-dev
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: [self-hosted, cheese-dev]
    # The old color may serve its streams for up to 30 minutes after the switch
    # (GATEWAY_DRAIN_SECONDS in deploy/release-gateway.sh), and a replaced proxy
    # lives at most 35 (hard-stop-after); the one-time move waits up to 10 for
    # a quiet moment.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify the release commit and image build
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python3 deploy/check-auto-deploy.py --require-ci "$RELEASE_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Release the CI-built gateway without dropping a stream
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          GATEWAY_ALLOW_INTERRUPT: ${{ inputs.interrupt && '1' || '0' }}
        run: bash deploy/release-gateway.sh "$RELEASE_SHA"
