name: Architecture metrics

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arch-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Self-test the measurement
        run: python3 .claude/scripts/arch-metrics.py --self-test
      - name: Fetch pull-request branch heads
        run: |
          git fetch --no-tags --quiet --atomic origin '+refs/pull/*/head:refs/pull/*/head'
          echo "ARCH_METRICS_PR_HEADS=$(git for-each-ref 'refs/pull/*/head' | wc -l)" >> "$GITHUB_ENV"
      - name: Measure architecture
        env:
          OUT: ${{ runner.temp }}
        run: |
          baseline="$(git rev-list -1 --before="$(date -u -d '30 days ago' +%Y-%m-%d)" HEAD || true)"
          if [ -n "$baseline" ]; then
            python3 .claude/scripts/arch-metrics.py --out "$OUT" --compare "$baseline" --quiet
          else
            python3 .claude/scripts/arch-metrics.py --out "$OUT" --quiet
          fi
          cat "$OUT/arch-metrics.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-metrics
          path: ${{ runner.temp }}/arch-metrics.json
          retention-days: 90
