name: Frontend Test

# The frontend had NO check in CI. `grep -rn 'vue-tsc\|eslint' .github/workflows/`
# returned nothing: test.yml is scoped to `backend/**`, e2e.yml runs Playwright
# but no type check, and the only thing that touched frontend/ was build.yml's
# `docker build` — whose `vite build` does not type-check. A type error or an
# undefined variable could be merged to main and deployed to the box as long as
# the bundler survived it. One had been: `} catch {` referencing `error` in
# AuditTask.vue, a guaranteed ReferenceError on the reject path.
#
# The frontend's own unit tests were unrun for the same reason, and build.yml
# only runs on pushes to main anyway. So a
# frontend PR could go green with its own new tests failing, and did. That is
# what the `unit` job below exists for; it is a separate gap from the
# type/lint one and neither covers the other.
#
# node/pnpm come from the setup actions below, exactly as e2e.yml gets them.
#
# These checks live in two jobs that run beside each other, not one job that
# runs them in a row. The split is placed where the measured time is. Unless a
# line says otherwise, a number here is a per-step P50 over the eight completed
# Required CI runs that carried a frontend suite, measured 2026-10-16, and the
# ~24 s of checkout, node, pnpm install and toolchain check that every job in
# this file opens with is added to the sums below:
#
#   eslint  the four `eslint` runs over the tree — `eslint .` plus the three
#           ratcheted configs (component boundaries, direct Web Storage,
#           accessibility). 215 s of checks, ~239 s with the setup.
#   check   everything else: the ratchets that are not eslint (scenes, scene
#           debt, catalog, stylelint, i18n, global fallbacks), the ratchets' own
#           unit tests, the collaboration service, and the two checks that need
#           the backend's Python environment — the API type ratchet and the
#           request paths. 211 s of checks, ~235 s with the setup, measured
#           before the global-fallback step landed; that step adds ~34 s on one
#           work-machine sandbox, and has no runner P50 yet.
#
# The single `check` job they replace measured 448 s end to end, and it was the
# longest thing on any frontend change; split, the critical path is the longer
# of the two, ~4 min. Which check goes where is not "needs Python or not" — the
# eslint runs and the scene ratchets both need only node and a system python3 —
# it is which placement leaves the two jobs the same length. Cutting the other
# way, so that every check not needing the backend sits in `eslint`, puts
# 5.7 min in one job and 2.2 min in the other: the saving spent on waiting for
# the longer one.
#
# `request-paths` used to be a job of its own for the one checker at the bottom
# of `check`. It was a second runner paying for the same node and Python
# installs `check` already paid for, to run a check that takes a second.

on:
  workflow_call:
# No step here comments, pushes or reads another workflow's runs — checkout is
# the only thing that wants the token at all. Without this block the run would
# inherit the repository default, which can be read/write across every scope.
permissions:
  contents: read

# Cancel superseded runs on a PR, never in the merge queue. Keying queue runs
# by sha gives each queued commit its own group, so one entry cannot cancel
# another's run and leave the commit that lands on main with no result — a
# cancelled run is not a red run. PR refs keep the ref key, so repeated pushes
# to one PR still supersede each other.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  # The four eslint runs. `eslint .` is the tree's own config; the other three
  # are the same binary with a config of their own and a JSON report the ratchet
  # reads. Nothing here reads git history, the backend, or anything outside the
  # checkout and node_modules.
  eslint:
    name: eslint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing below pushes, and the lockfile has zero git: specifiers, so
          # there is no reason to leave the token in .git/config while
          # dependencies' install scripts run.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # pnpm comes from frontend/package.json's `packageManager` field
      # (pnpm@9.15.3), so the repo pins the version rather than this workflow.
      # Deliberately NOT `pnpm/action-setup` with a hard-coded major: that
      # overrides the pinned version, and a newer pnpm resolving this lockfile
      # is exactly the drift `--frozen-lockfile` exists to prevent. (corepack
      # reads the field from the working directory, which `defaults.run` has
      # already set to frontend/ — the repo root has no package.json.)
      - name: Enable corepack
        run: corepack enable

      # Explicit cache rather than setup-node's `cache: pnpm`, which shells out
      # to pnpm to locate the store and so would have to run after corepack.
      # Restore only: warm-caches.yml saves this key on main.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          # runner.arch, not just runner.os: `runner.os` is "Linux" on both
          # x64 and arm64, so without it the two architectures share one pnpm
          # store and the platform-specific binaries in it.
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # A missing binary must not read as a passing check. `pnpm exec <missing>`
      # has been observed to exit 0 with no output when node_modules is empty,
      # which is how "vue-tsc reports 0 errors" can mean "vue-tsc never ran".
      # Every step in this job shells out to eslint; the tools the other job
      # runs are named in its own copy of this step.
      - name: Verify the toolchain is actually installed
        run: |
          test -x node_modules/.bin/eslint || { echo "::error::eslint not installed"; exit 1; }
          node_modules/.bin/eslint --version

      # Errors block; the 288 pre-existing warnings do not. `--max-warnings=0`
      # would have meant leaving the whole gate off, and errors are where the
      # real defects were.
      #
      # `pnpm run lint` is safe to gate on ONLY because that script is the
      # read-only `eslint .`; the writing form lives in `lint:fix`. Keep it that
      # way — an `--fix` gate rewrites the checkout and can exit 0 on a
      # violation it silently repaired.
      - name: ESLint
        run: pnpm run lint

      # Component boundaries: nothing under src/components/** may import the
      # network layer (`@/api`, `@/services/*`, `@/network/*`) or vue-router.
      # Ratcheted, for the same reason as the stylelint gate below — the tree
      # starts at 127 violations across 82 components, and a rule that goes red
      # everywhere on day one gets switched off. A component takes props and
      # emits events; if it fetches, it cannot be tested or reused without a
      # server, which is why this one is worth the baseline machinery.
      #
      # Read-only like every other step here (the writer is
      # `pnpm run lint:boundary:update`). Its own tests are in
      # scripts/import-boundary-ratchet.test.mjs, which the Ratchet unit tests
      # step in the other job runs — including the case that plants a violating
      # component and requires this command to fail on it.
      - name: Component boundaries (eslint ratchet)
        run: pnpm run lint:boundary

      # Web Storage: nothing under src/ may reference localStorage or
      # sessionStorage directly. They throw in Safari private mode and when the
      # quota is full, and they are absent outside a browser — one throw in a
      # setup() or a watcher takes the render or the interaction with it.
      # src/lib/browserStorage.ts is the one place that accepts those failure
      # modes, and it never throws. Ratcheted like the steps above: the
      # references already in the tree are frozen in
      # browser-storage-baseline.json and only new ones fail, so the migration
      # can be paid down file by file. Read-only; the writer is `pnpm run
      # lint:storage:update`, which only lowers counts. Its own tests are
      # scripts/browser-storage-ratchet.test.mjs (run by the Ratchet unit tests
      # step in the other job), including the plant that requires this command
      # to fail.
      - name: Direct Web Storage (eslint ratchet)
        run: pnpm run lint:storage

      # Accessibility: eslint-plugin-vuejs-accessibility's recommended rules over
      # src/**/*.vue (a clickable <div> with no keyboard path, a control with no
      # label, an image with no alt). Ratcheted like the boundary step above:
      # 159 violations in 79 files are frozen in a11y-baseline.json, and only new
      # ones fail. Read-only; the writer is `pnpm run lint:a11y:update`, which
      # only lowers counts. Its tests are scripts/a11y-ratchet.test.mjs, run by
      # the Ratchet unit tests step in the other job.
      - name: Accessibility (eslint ratchet)
        run: pnpm run lint:a11y

  # The checks that are not one of the four eslint runs — plus the two that need
  # the backend's Python environment. It is the direct successor of the old
  # single `check` job, which is why it keeps the name.
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    # The margin covers a cold pnpm store and a cold uv cache without letting a
    # wedged run bill for an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The scene ratchets freeze the tree at `git merge-base HEAD
          # origin/main` and grade this one against it, so the history has to be
          # here.
          fetch-depth: 0
          # Nothing below pushes, and the lockfile has zero git: specifiers, so
          # there is no reason to leave the token in .git/config while
          # dependencies' install scripts run.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # The same guard as the other job's, naming what THIS job runs. A missing
      # binary must not read as a passing check: `pnpm exec <missing>` has been
      # observed to exit 0 with no output when node_modules is empty.
      - name: Verify the toolchain is actually installed
        run: |
          test -x node_modules/.bin/stylelint || { echo "::error::stylelint not installed"; exit 1; }
          test -x node_modules/.bin/vue-tsc || { echo "::error::vue-tsc not installed"; exit 1; }
          test -x node_modules/.bin/vitest || { echo "::error::vitest not installed"; exit 1; }
          # The request-path checker below parses the api modules with the
          # TypeScript compiler, and the collaboration service's type check runs
          # its `tsc`: on a checkout where node_modules never installed, both
          # collapse into a report that judges nothing.
          test -d node_modules/typescript || { echo "::error::typescript not installed"; exit 1; }
          node_modules/.bin/vue-tsc --version

      # The scene ratchet: a page or a workbench panel that renders standalone
      # in the tree this branch started from may not stop being able to, and
      # every scene added from now on has to be able to from its first commit.
      # What a scene is, and how to pull a fetch out of one:
      # docs/manual/dev/scenes.md.
      #
      # The freeze is that tree — the merge base with origin/main — graded by
      # this same rule, which is why the checkout above needs the full history.
      # Nothing is written down, so there is no writer and no baseline to edit:
      # the fix is always in the scene.
      #
      # Not the same question as the boundary rule in the other job: that one is
      # about what a file under src/components/ imports, this one about whether a
      # whole scene renders with no backend, no route and no business store — and
      # it judges src/views/ too, which the ESLint rule leaves alone on purpose.
      # It shells out to python3 (stdlib only, no venv, no node_modules) because
      # it grades with the same module arch-metrics.py reports from, so the gate
      # and the board cannot disagree about a scene.
      #
      # Read-only like every other step here. Its own tests are `python3
      # .claude/scripts/scene-ratchet.py --self-test`, which repo-guards.yml
      # runs in its Guards self-test step.
      - name: Scenes (standalone-ratchet)
        run: pnpm run lint:scenes

      # Freeze exact child edges, debt-page route reads and legacy imports.
      # Updating or hand-expanding the baseline cannot accept new debt.
      - name: Scene debt (three downward-only sets)
        run: pnpm run lint:scene-debt

      - name: Scene debt rule self-tests
        run: python3 ../.claude/scripts/scene-debt-ratchet.py --self-test

      # The catalog ratchet: every component under src/ (src/views/demo/
      # excluded) that renders from props alone — grade A, the same grade the
      # Scenes step uses — is in the /demo/catalog preview site, where
      # catalog.spec.ts mounts it and notices the day it stops rendering alone.
      # The ones that are not yet are listed as pending in
      # frontend/catalog-baseline.json, and that list may only shrink: a
      # component that is new, or that just became A, has to get a catalog
      # entry (frontend/AGENTS.md, "The component preview site").
      #
      # "In the catalog" is read from the code, not from a `file:` label:
      # src/views/demo/catalog.ts, or a catalog*.ts volume it imports and
      # spreads into CATALOG (transitively; *Fixtures.ts not read), imports the
      # .vue and uses it as an entry's `component:`. Comments are stripped
      # first; a `component:` in demoRouter.ts or an unimported volume counts
      # for nothing.
      # python3 stdlib only, like the Scenes step.
      #
      # Read-only like every other step here; the writer is
      # `pnpm run lint:catalog:update`, which only ever REMOVES from the
      # pending list. Its own tests are `python3 .claude/scripts/catalog-ratchet.py
      # --self-test`, which repo-guards.yml runs in its Guards self-test step.
      - name: Catalog (preview-ratchet)
        run: pnpm run lint:catalog

      # Design system: no hardcoded colours, radii on the 6/8/12/999 ladder.
      # Enforced through a ratchet (stylelint-baseline.json) because the tree
      # starts at 537 violations across 88 files — a rule that goes red
      # everywhere on day one gets switched off, not fixed. Only NEW violations
      # fail. Spec and paydown map: docs/design-system.md.
      #
      # Note this gates FOUR rules, not everything stylelint reports: the config
      # also carries property-order and class-naming rules that have never run
      # in CI (stylelint appeared in no workflow before this step) and sit at
      # 2842 findings. Widening the gate to those is a separate decision — see
      # DESIGN_RULES in scripts/stylelint-ratchet-core.mjs.
      #
      # Same read-only discipline as every other step here: this script never
      # passes --fix. Measured on this tree: ~22s.
      - name: Design tokens (stylelint ratchet)
        run: pnpm run lint:style

      # Bilingual UI: no Chinese typed straight into a template or a string
      # literal. catalog.spec.ts cannot see this — it compares the catalog with
      # itself, so a string that never reached the catalog is invisible to it
      # and the English UI stays Chinese while every check passes. Zero
      # tolerance: the only Chinese allowed is data, marked on its own line with
      # `// i18n-data: <reason>` (`<!-- … -->` in a template). Spec: docs/i18n.md §5.
      # A Chinese HTML comment counts too, and is the one kind held by a ratchet
      # instead of refused outright: the production build strips comments, vitest
      # and `vite dev` do not, so the Han reaches the DOM the no-Chinese specs
      # read. 1422 lines in 230 files are frozen in
      # frontend/i18n-comments-baseline.json; `lint:i18n:update` tightens it.
      #
      # Pure node, no dependency, about a second. Read-only unless `--update`.
      - name: Hardcoded Chinese (i18n)
        run: pnpm run lint:i18n

      # A component calls a bare name it binds nothing for, and a module in this
      # tree declares that name and exports it to nobody: the call does not
      # fail, it reaches the browser global of the same name and does nothing.
      # That is what a function moved into a composable and left unexported
      # looks like — 2026-10-16 (#1618), `blur()` moved into
      # useDesignViewport.ts without an `export`, and DesignImage.vue's
      # `if (!on) blur()` called `window.blur`, which drops nothing, silently.
      #
      # Nothing else in this workflow sees it. The eslint job's tree-wide run
      # cannot (the config injects the browser globals and turns `no-undef` off
      # for TS), the type check cannot (`lib.dom` declares the same names), and a
      # template's calls are in no scope at all — which is why this rule reads
      # both halves itself, through `vue-eslint-parser`.
      #
      # A plain rule, not a ratchet: measured at 0 findings over 751 components
      # and 957 modules on 2026-10-16, so there is nothing to freeze, no
      # baseline file and no `--update` — a baseline's one use is to let a
      # finding stand, and this rule's whole subject is a call that fails in
      # silence. Read-only. Its tests, including the plant that requires this
      # command to fail on a composable that keeps a function to itself and a
      # component that calls it by bare name, are in
      # scripts/global-fallback-ratchet.test.mjs, run by the Ratchet unit tests
      # step below. Roughly 40 s over the tree, and it moves with the machine:
      # the same tree took 34 s on one sandbox and 47 s on another.
      - name: Global fallbacks (a bare call to a module's own name)
        run: pnpm run lint:global-fallback

      # Via the package script, not a bare `node --test scripts/`: passing a
      # DIRECTORY resolves as a module entry point on node 22 while node 20
      # treated it as a search path, so the two disagreed and CI failed on
      # something that passed locally. An explicit file glob behaves the same
      # everywhere, and going through package.json keeps local and CI on one
      # command instead of two that can drift.
      #
      # This covers the ratchet's OWN tests (frontend/scripts/*.test.mjs),
      # including the eslint ratchets in the other job, not the application's —
      # those are the `unit` job further down.
      - name: Ratchet unit tests
        run: pnpm run test:ratchet

      # src/api/openapi.d.ts is generated, not committed — and neither is the
      # document it is generated from, nor any digest of it. The type check
      # below asks the backend to build the document and then generates the
      # types from it (scripts/typecheck.mjs, scripts/gen-api-types.mjs), so
      # there is no separate "types match the document" step to run and no way
      # for the two to disagree. What brings the suite here when a backend
      # change moves the API surface is required-ci.yml's `api` job, which
      # compares the document at the base and at the change. All of it left the
      # repository because every route change rewrote it (1.4 MB of types,
      # 1.8 MB of document, then one line of digest), and that is what two
      # parallel route changes collided in.
      #
      # Which is why this job installs a second toolchain — the backend's Python
      # environment, in the steps just above the type check: generating the
      # types means building the document and that means importing the app.

      # The *paths* this frontend calls are judged at the bottom of this job,
      # against the same backend environment: reading the routes off the app is
      # what `backend/scripts/route_index.py` does, and the checker that compares
      # them with src/api/*.ts needs the TypeScript parser node_modules carries.

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
          # Restore only: warm-caches.yml saves this key on main.
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync --frozen --no-dev
        working-directory: backend

      # Not a plain `vue-tsc --noEmit`: the errors the tree already has are frozen
      # in tsc-baseline.json and any NEW one fails. See scripts/tsc-ratchet-core.mjs.
      # Runs through scripts/typecheck.mjs, which generates src/api/openapi.d.ts
      # first: the judging project imports it — src/cx_types.ts, and
      # src/types/{canvas,ownAgents,modelConnections}.ts directly.
      - name: Type check (ratchet)
        env:
          # Node's default heap lands around 2GB and vue-tsc on this tree peaks
          # near 1.7GB — too close to the edge to leave to chance. Raising it
          # costs nothing (the pool VMs have far more physical memory) and only
          # removes a cliff. Inherited by the vue-tsc child the ratchet spawns.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run typecheck

      # The collaboration service (collab/) lives in this package because it
      # runs the editors' own document schema, but it is a Node process, not
      # part of the app: its own types (Node, no DOM app), and tests that start
      # a real server and real clients over real sockets.
      - name: Collaboration service type check
        run: pnpm run typecheck:collab

      - name: Collaboration service tests
        run: pnpm run test:collab

      # The *paths* this frontend calls. They are string literals in
      # src/api/*.ts and nothing connected them to the backend, so a renamed
      # route type-checked and failed in the browser. Judged against the routes
      # as the app mounts them, read off the app by
      # `backend/scripts/route_index.py --emit` — the same inventory the
      # addressing contract suite holds the app to. That index used to be a
      # committed file; it changed with every route (84 commits from 83 PRs in
      # its twelve days) and every PR that added one had to carry a regeneration
      # of a 149 KB generated file through review. It is generated here instead,
      # and git-ignored so nobody re-adds it by habit.
      #
      # This was its own job until the split above: what separated them was that
      # reading the routes means installing the backend, which `check` now does
      # anyway for the type check. A second job paid for that same install — uv,
      # Python, ~250 MB of wheels, plus node and pnpm — to run a checker that
      # takes a second.
      - name: Read the routes off the app
        run: |
          uv run python -m scripts.route_index --emit > "$RUNNER_TEMP/route_index.jsonl"
        working-directory: backend

      - name: Request paths match the backend's routes
        run: node scripts/check-request-paths.mjs --routes "$RUNNER_TEMP/route_index.jsonl"
        working-directory: frontend

      # One check that belongs here is deliberately absent, so that nobody
      # reads a green tick as covering it:
      #
      #   * `vite build` — build.yml already runs it via frontend/Dockerfile,
      #     but only on pushes to main, so a build-only breakage still lands
      #     before anything catches it. Worth adding here (~2 min); left out
      #     only because it could not be executed to a verified pass while
      #     writing this file (the sandbox it was authored in caps memory at
      #     2GB and vite OOMs well below the finish line — a limitation of the
      #     sandbox, not evidence that the build is broken).

  # The application's own vitest suite, the gap the header describes. It is
  # its own job, split by file across runners, because the suite takes about
  # 7.5 minutes on one runner, and queued behind lint and the type check in
  # `check` it made that job the longest one on any frontend change. The
  # setup steps repeat `check`'s and follow the same reasoning.
  unit:
    name: unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      # A failing shard must not cancel the others; each keeps its own result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      - name: Verify vitest is actually installed
        run: test -x node_modules/.bin/vitest || { echo "::error::vitest not installed"; exit 1; }

      # `pnpm run test` is the watch-mode `vitest`, which never exits, so CI
      # needs the one-shot form.
      #
      # `--dir src` says what this step actually means: the application suite.
      # The ratchet's tests have their own step in `check`, under the runner
      # they were written for (node:test — vitest fails collecting them outright
      # with "No test suite found in file").
      #
      # It is no longer the only thing standing between vitest and that
      # collision: `vite.config.ts` now carries `exclude: [...configDefaults
      # .exclude, 'scripts/**']`, so a plain `pnpm exec vitest run` — and
      # `pnpm run test` locally — are clean too. Both were written against the
      # same bug from different sides; keeping both means neither the config
      # nor this flag is load-bearing alone.
      - name: Unit tests
        run: pnpm exec vitest run --dir src --shard=${{ matrix.shard }}/${{ strategy.job-total }}
