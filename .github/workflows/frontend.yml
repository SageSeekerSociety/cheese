name: Frontend Test

# The frontend had NO check in CI. `grep -rn 'vue-tsc\|eslint' .github/workflows/`
# returned nothing: test.yml is scoped to `backend/**`, e2e.yml runs Playwright
# but no type check, and the only thing that touched frontend/ was build.yml's
# `docker build` — whose `vite build` does not type-check. A type error or an
# undefined variable could be merged to main and deployed to the box as long as
# the bundler survived it. One had been: `} catch {` referencing `error` in
# AuditTask.vue, a guaranteed ReferenceError on the reject path.
#
# The frontend's own unit tests were unrun for the same reason: `frontend/src`
# holds 29 vitest files / 299 tests (measured on this tree) — including the
# ones added by #244, #246 and #249 — and build.yml only runs on pushes to
# main anyway. So a
# frontend PR could go green with its own new tests failing, and did. That is
# what the `Unit tests` step below exists for; it is a separate gap from the
# type/lint one and neither covers the other.
#
# Hosted, not the box: this is pnpm + eslint + vue-tsc with no service
# containers and no docker, so it must not queue behind builds and deploys on
# the box's single self-hosted runner — parking a multi-minute frontend check
# there would delay deploys for no gain. test.yml already puts its `scope` and
# `lint` jobs on hosted for the same reason.
#
# DELIBERATE DEVIATION from frontend/Dockerfile, which builds on node:21-slim:
# this job runs node 22 (21 is end-of-life and gets no security updates). The
# difference is safe HERE because this job only lints and type-checks — it never
# produces the bundle that ships. If a job that builds the deployable artifact is
# ever added, it must match the Dockerfile instead.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# No step here comments, pushes or reads another workflow's runs — checkout is
# the only thing that wants the token at all. Without this block the run would
# inherit the repository default, which can be read/write across every scope.
permissions:
  contents: read

# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group: with a shared `github.ref` key, a second merge
# cancelled the first one's run and main was left with no result for that
# commit — and a cancelled run is not a red run, so main quietly loses the
# coverage with nothing on the commit to show for it. build.yml already keyed
# on sha for main; these did not. PR refs keep the ref key, so repeated pushes
# to a single PR still supersede each other.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    # Measured locally: install ~40s, eslint ~90s, vitest ~56s. The margin
    # covers a cold pnpm store without letting a wedged run bill for an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing below pushes, and the lockfile has zero git: specifiers, so
          # there is no reason to leave the token in .git/config while
          # third-party postinstall scripts run — and package.json does have
          # one (`postinstall: husky install`).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # pnpm comes from frontend/package.json's `packageManager` field
      # (pnpm@9.15.3), so the repo pins the version rather than this workflow.
      # Deliberately NOT `pnpm/action-setup` with a hard-coded major: that
      # overrides the pinned version, and a newer pnpm resolving this lockfile
      # is exactly the drift `--frozen-lockfile` exists to prevent. (corepack
      # reads the field from the working directory, which `defaults.run` has
      # already set to frontend/ — the repo root has no package.json.)
      - name: Enable corepack
        run: corepack enable

      # Explicit cache rather than setup-node's `cache: pnpm`, which shells out
      # to pnpm to locate the store and so would have to run after corepack.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A missing binary must not read as a passing check. `pnpm exec <missing>`
      # has been observed to exit 0 with no output when node_modules is empty,
      # which is how "vue-tsc reports 0 errors" can mean "vue-tsc never ran".
      - name: Verify the toolchain is actually installed
        run: |
          test -x node_modules/.bin/eslint || { echo "::error::eslint not installed"; exit 1; }
          test -x node_modules/.bin/vue-tsc || { echo "::error::vue-tsc not installed"; exit 1; }
          test -x node_modules/.bin/vitest || { echo "::error::vitest not installed"; exit 1; }
          node_modules/.bin/vue-tsc --version

      # Errors block; the 288 pre-existing warnings do not. `--max-warnings=0`
      # would have meant leaving the whole gate off, and errors are where the
      # real defects were.
      #
      # `pnpm run lint` is safe to gate on ONLY because that script is the
      # read-only `eslint .`; the writing form lives in `lint:fix`. Keep it that
      # way — an `--fix` gate rewrites the checkout and can exit 0 on a
      # violation it silently repaired.
      - name: ESLint
        run: pnpm run lint

      # Via the package script, not a bare `node --test scripts/`: passing a
      # DIRECTORY resolves as a module entry point on node 22 while node 20
      # treated it as a search path, so the two disagreed and CI failed on
      # something that passed locally. An explicit file glob behaves the same
      # everywhere, and going through package.json keeps local and CI on one
      # command instead of two that can drift.
      #
      # This covers the ratchet's OWN tests (frontend/scripts/*.test.mjs), not
      # the application's — those are the `Unit tests` step further down.
      - name: Ratchet unit tests
        run: pnpm run test:ratchet

      # Not a plain `vue-tsc --noEmit`: 31 pre-existing errors are frozen in
      # tsc-baseline.json and any NEW one fails. See scripts/tsc-ratchet-core.mjs.
      - name: Type check (ratchet)
        env:
          # Private-repo hosted runners are 2-core/7GB, where Node's default
          # heap lands around 2GB; vue-tsc on this tree peaks near 1.7GB, which
          # is too close to the edge to leave to chance. Physical memory is
          # nowhere near the limit, so this only removes a cliff. Inherited by
          # the vue-tsc child process the ratchet spawns.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run typecheck

      # The application's own vitest suite — the gap the header describes.
      # `pnpm run test` is the watch-mode `vitest`, which never exits, so CI
      # needs the one-shot form. Measured on this tree: 29 files, 299 tests.
      #
      # `--dir src` says what this step actually means: the application suite.
      # The ratchet's tests have their own step above, under the runner they
      # were written for (node:test — vitest fails collecting them outright
      # with "No test suite found in file").
      #
      # It is no longer the only thing standing between vitest and that
      # collision: `vite.config.ts` now carries `exclude: [...configDefaults
      # .exclude, 'scripts/**']`, so a plain `pnpm exec vitest run` — and
      # `pnpm run test` locally — are clean too. Both were written against the
      # same bug from different sides; keeping both means neither the config
      # nor this flag is load-bearing alone.
      - name: Unit tests
        run: pnpm exec vitest run --dir src

      # One check that belongs here is deliberately absent, so that nobody
      # reads a green tick as covering it:
      #
      #   * `vite build` — build.yml already runs it via frontend/Dockerfile,
      #     but only on pushes to main, so a build-only breakage still lands
      #     before anything catches it. Worth adding here (~2 min); left out
      #     only because it could not be executed to a verified pass while
      #     writing this file (the sandbox it was authored in caps memory at
      #     2GB and vite OOMs well below the finish line — a limitation of the
      #     sandbox, not evidence that the build is broken).
