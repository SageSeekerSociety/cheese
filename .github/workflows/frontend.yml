name: Frontend Test

# The frontend had NO check in CI. `grep -rn 'vue-tsc\|eslint' .github/workflows/`
# returned nothing: test.yml is scoped to `backend/**`, e2e.yml runs Playwright
# but no type check, and the only thing that touched frontend/ was build.yml's
# `docker build` — whose `vite build` does not type-check. A type error or an
# undefined variable could be merged to main and deployed to the box as long as
# the bundler survived it. One had been: `} catch {` referencing `error` in
# AuditTask.vue, a guaranteed ReferenceError on the reject path.
#
# The frontend's own unit tests were unrun for the same reason: `frontend/src`
# holds 29 vitest files / 299 tests (measured on this tree) — including the
# ones added by #244, #246 and #249 — and build.yml only runs on pushes to
# main anyway. So a
# frontend PR could go green with its own new tests failing, and did. That is
# what the `Unit tests` step below exists for; it is a separate gap from the
# type/lint one and neither covers the other.
#
# On the cheese-ci pool, not a hosted runner: this is pnpm + eslint + vue-tsc,
# and the org's Actions billing lapsed on 2026-08-13 (every ubuntu-latest job
# is refused before it starts). It runs on the same three-machine cheese-ci
# pool as test.yml/e2e.yml — separate capacity from the dev box's single deploy
# slot, so a multi-minute frontend check here never queues behind a deploy.
# node/pnpm come from the setup actions below, exactly as e2e.yml gets them.
#
# DELIBERATE DEVIATION from frontend/Dockerfile, which builds on node:21-slim:
# this job runs node 22 (21 is end-of-life and gets no security updates). The
# difference is safe HERE because this job only lints and type-checks — it never
# produces the bundle that ships. If a job that builds the deployable artifact is
# ever added, it must match the Dockerfile instead.
on:
  workflow_call:
# No step here comments, pushes or reads another workflow's runs — checkout is
# the only thing that wants the token at all. Without this block the run would
# inherit the repository default, which can be read/write across every scope.
permissions:
  contents: read

# Cancel superseded runs on a PR, never in the merge queue. Keying queue runs
# by sha gives each queued commit its own group, so one entry cannot cancel
# another's run and leave the commit that lands on main with no result — a
# cancelled run is not a red run. PR refs keep the ref key, so repeated pushes
# to one PR still supersede each other.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    # Measured locally: install ~40s, eslint ~90s, vitest ~56s. The margin
    # covers a cold pnpm store without letting a wedged run bill for an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing below pushes, and the lockfile has zero git: specifiers, so
          # there is no reason to leave the token in .git/config while
          # third-party postinstall scripts run — and package.json does have
          # one (`postinstall: husky install`).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # pnpm comes from frontend/package.json's `packageManager` field
      # (pnpm@9.15.3), so the repo pins the version rather than this workflow.
      # Deliberately NOT `pnpm/action-setup` with a hard-coded major: that
      # overrides the pinned version, and a newer pnpm resolving this lockfile
      # is exactly the drift `--frozen-lockfile` exists to prevent. (corepack
      # reads the field from the working directory, which `defaults.run` has
      # already set to frontend/ — the repo root has no package.json.)
      - name: Enable corepack
        run: corepack enable

      # Explicit cache rather than setup-node's `cache: pnpm`, which shells out
      # to pnpm to locate the store and so would have to run after corepack.
      # Restore only: warm-caches.yml saves this key on main.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          # runner.arch, not just runner.os: `runner.os` is "Linux" on both
          # x64 and arm64, so without it the two architectures share one pnpm
          # store and the platform-specific binaries in it.
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # A missing binary must not read as a passing check. `pnpm exec <missing>`
      # has been observed to exit 0 with no output when node_modules is empty,
      # which is how "vue-tsc reports 0 errors" can mean "vue-tsc never ran".
      - name: Verify the toolchain is actually installed
        run: |
          test -x node_modules/.bin/eslint || { echo "::error::eslint not installed"; exit 1; }
          test -x node_modules/.bin/vue-tsc || { echo "::error::vue-tsc not installed"; exit 1; }
          test -x node_modules/.bin/vitest || { echo "::error::vitest not installed"; exit 1; }
          test -x node_modules/.bin/stylelint || { echo "::error::stylelint not installed"; exit 1; }
          node_modules/.bin/vue-tsc --version

      # Errors block; the 288 pre-existing warnings do not. `--max-warnings=0`
      # would have meant leaving the whole gate off, and errors are where the
      # real defects were.
      #
      # `pnpm run lint` is safe to gate on ONLY because that script is the
      # read-only `eslint .`; the writing form lives in `lint:fix`. Keep it that
      # way — an `--fix` gate rewrites the checkout and can exit 0 on a
      # violation it silently repaired.
      - name: ESLint
        run: pnpm run lint

      # Component boundaries: nothing under src/components/** may import the
      # network layer (`@/api`, `@/services/*`, `@/network/*`) or vue-router.
      # Ratcheted, for the same reason as the stylelint gate below — the tree
      # starts at 127 violations across 82 components, and a rule that goes red
      # everywhere on day one gets switched off. A component takes props and
      # emits events; if it fetches, it cannot be tested or reused without a
      # server, which is why this one is worth the baseline machinery.
      #
      # Read-only like every other step here (the writer is
      # `pnpm run lint:boundary:update`). Its own tests are in
      # scripts/import-boundary-ratchet.test.mjs, which the Ratchet unit tests
      # step below runs — including the case that plants a violating component
      # and requires this command to fail on it.
      - name: Component boundaries (eslint ratchet)
        run: pnpm run lint:boundary

      # The scene ratchet: a page or a workbench panel that renders standalone
      # today may not stop being able to, and every scene added from now on has
      # to be able to from its first commit. 20 are frozen in
      # frontend/scene-baseline.json and 137 are pre-existing debt that may only
      # shrink — what a scene is, and how to pull a fetch out of one:
      # docs/manual/dev/scenes.md.
      #
      # Not the same question as the boundary rule above: that one is about what
      # a file under src/components/ imports, this one about whether a whole
      # scene renders with no backend, no route and no business store — and it
      # judges src/views/ too, which the ESLint rule leaves alone on purpose. It
      # shells out to python3 (stdlib only, no venv, no node_modules) because it
      # grades with the same module arch-metrics.py reports from, so the gate
      # and the board cannot disagree about a scene.
      #
      # Read-only like every other step here; the writer is
      # `pnpm run lint:scenes:update`, which only ever ADDS a scene to the
      # baseline. Its own tests are `python3 .claude/scripts/scene-ratchet.py
      # --self-test`, which repo-guards.yml runs in its Guards self-test step.
      - name: Scenes (standalone-ratchet)
        run: pnpm run lint:scenes

      # Design system: no hardcoded colours, radii on the 6/8/12/999 ladder.
      # Enforced through a ratchet (stylelint-baseline.json) because the tree
      # starts at 537 violations across 88 files — a rule that goes red
      # everywhere on day one gets switched off, not fixed. Only NEW violations
      # fail. Spec and paydown map: docs/design-system.md.
      #
      # Note this gates FOUR rules, not everything stylelint reports: the config
      # also carries property-order and class-naming rules that have never run
      # in CI (stylelint appeared in no workflow before this step) and sit at
      # 2842 findings. Widening the gate to those is a separate decision — see
      # DESIGN_RULES in scripts/stylelint-ratchet-core.mjs.
      #
      # Same read-only discipline as the ESLint step above: this script never
      # passes --fix. Measured on this tree: ~22s.
      - name: Design tokens (stylelint ratchet)
        run: pnpm run lint:style

      # Bilingual UI: no Chinese typed straight into a template or a string
      # literal. catalog.spec.ts cannot see this — it compares the catalog with
      # itself, so a string that never reached the catalog is invisible to it
      # and the English UI stays Chinese while every check passes. Zero
      # tolerance: the only Chinese allowed is data, marked on its own line with
      # `// i18n-data: <reason>` (`<!-- … -->` in a template). Spec: docs/i18n.md §5.
      #
      # Pure node, no dependency, about a second. Read-only.
      - name: Hardcoded Chinese (i18n)
        run: pnpm run lint:i18n

      # Via the package script, not a bare `node --test scripts/`: passing a
      # DIRECTORY resolves as a module entry point on node 22 while node 20
      # treated it as a search path, so the two disagreed and CI failed on
      # something that passed locally. An explicit file glob behaves the same
      # everywhere, and going through package.json keeps local and CI on one
      # command instead of two that can drift.
      #
      # This covers the ratchet's OWN tests (frontend/scripts/*.test.mjs), not
      # the application's — those are the `Unit tests` step further down.
      - name: Ratchet unit tests
        run: pnpm run test:ratchet

      # Not a plain `vue-tsc --noEmit`: 31 pre-existing errors are frozen in
      # tsc-baseline.json and any NEW one fails. See scripts/tsc-ratchet-core.mjs.
      - name: Type check (ratchet)
        env:
          # Node's default heap lands around 2GB and vue-tsc on this tree peaks
          # near 1.7GB — too close to the edge to leave to chance. Raising it
          # costs nothing (the pool VMs have far more physical memory) and only
          # removes a cliff. Inherited by the vue-tsc child the ratchet spawns.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run typecheck

      # The application's own vitest suite — the gap the header describes.
      # `pnpm run test` is the watch-mode `vitest`, which never exits, so CI
      # needs the one-shot form. Measured on this tree: 29 files, 299 tests.
      #
      # `--dir src` says what this step actually means: the application suite.
      # The ratchet's tests have their own step above, under the runner they
      # were written for (node:test — vitest fails collecting them outright
      # with "No test suite found in file").
      #
      # It is no longer the only thing standing between vitest and that
      # collision: `vite.config.ts` now carries `exclude: [...configDefaults
      # .exclude, 'scripts/**']`, so a plain `pnpm exec vitest run` — and
      # `pnpm run test` locally — are clean too. Both were written against the
      # same bug from different sides; keeping both means neither the config
      # nor this flag is load-bearing alone.
      - name: Unit tests
        run: pnpm exec vitest run --dir src

      # The collaboration service (collab/) lives in this package because it
      # runs the editors' own document schema, but it is a Node process, not
      # part of the app: its own types (Node, no DOM app), and tests that start
      # a real server and real clients over real sockets.
      - name: Collaboration service type check
        run: pnpm run typecheck:collab

      - name: Collaboration service tests
        run: pnpm run test:collab

      # One check that belongs here is deliberately absent, so that nobody
      # reads a green tick as covering it:
      #
      #   * `vite build` — build.yml already runs it via frontend/Dockerfile,
      #     but only on pushes to main, so a build-only breakage still lands
      #     before anything catches it. Worth adding here (~2 min); left out
      #     only because it could not be executed to a verified pass while
      #     writing this file (the sandbox it was authored in caps memory at
      #     2GB and vite OOMs well below the finish line — a limitation of the
      #     sandbox, not evidence that the build is broken).
