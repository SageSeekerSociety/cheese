name: Build tmux agent image

# Separate from "Build and Push Docker Image" on purpose: the deploy gates on
# that workflow's conclusion, and no deployment consumes this image yet. A
# failure here must not stop the app images from shipping — it did once, and a
# deploy of three unrelated fixes sat behind an image nobody was pulling.
# Manual only. Splitting this out of the build workflow stopped it GATING the
# deploy, but the box has ONE runner, so building on every push still queued the
# deploy behind an image no deployment pulls yet. Not blocking is not the same as
# not competing. Dispatch it when the image is actually wanted — or wire it back
# to `workflow_run` once something consumes it.
on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: "run id of the build whose sandbox image to build FROM (blank = this run)"
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-tmux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tmux agent image: the sandbox base + tmux + ttyd + pre-accepted
  # first-launch gates. It is the LOCAL transport of the hooks substrate
  # (fusion-design §8.6), and until now nothing built it — so AGENT_BACKEND=tmux
  # could not be selected on any deployment, whatever the code allowed.
  build-tmux-sandbox:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: cheese-box-builder

      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sandbox-tmux
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # github.repository carries the org's capitals and a registry
      # reference must be lowercase; metadata-action lowercases its own output,
      # a hand-written ref does not.
      - name: Resolve the base image this run published
        id: base
        run: |
          name="${IMAGE_NAME,,}"
          echo "ref=${REGISTRY}/${name}/sandbox:run-${RUN_ID}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ github.repository }}
          RUN_ID: ${{ inputs.base_run_id || github.run_id }}

      - name: Build and push tmux sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/sandbox
          file: ./backend/sandbox/tmux.Dockerfile
          push: true
          # Built on the base this same run just pushed, so they cannot drift.
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Reclaim build cache
        if: always()
        run: |
          docker builder prune -af --keep-storage 10GB >/dev/null 2>&1 || true
          df -h / | tail -1

