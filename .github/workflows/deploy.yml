name: Deploy

# Production deploy to the etrip box (Aliyun HK, Dockerized). Fires on a
# published GitHub Release (gated on successful CI for the release commit),
# or manually via workflow_dispatch (controlled deploy of a specific ref, with a
# dry-run option to validate connectivity without changing anything).
#
# We deploy by the monorepo COMMIT SHA, not the version tag. This repo builds one
# backend and one frontend image per commit tagged `<short-sha>` on every main
# push (see build.yml). Those sha tags are the only image tags that reliably exist
# for BOTH images (semver tags are inconsistent — frontend has none), and a single
# commit sha pins backend+frontend together so they can't drift apart the way the
# floating `:main` tag let them (etrip had backend and frontend on different
# commits because of exactly that).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or commit SHA to deploy (a monorepo commit — pins backend+frontend together)"
        required: true
        default: main
      dry_run:
        description: "Connect and show status only; do not deploy"
        type: boolean
        default: false

# The release gate reads workflow runs for the exact candidate commit.
permissions:
  contents: read
  actions: read
  # manual-approval opens an issue and waits for an approver to comment
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate on the release commit's build + tests. Only for release events; a manual
  # dispatch trusts the operator's chosen ref.
  wait-for-ci:
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'forgejo-cli-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Check out deployment policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve release commit
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Check images and selected tests for the release commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: python3 deploy/check-auto-deploy.py --ci-only "$CANDIDATE_SHA"
      - name: Require completed validation
        env:
          READY: ${{ steps.check.outputs.ready }}
        run: |
          if [ "$READY" != true ]; then
            echo '::error::Release images and selected tests must succeed for this commit. Rerun after validation completes.'
            exit 1
          fi

  deploy:
    needs: wait-for-ci
    # wait-for-ci is skipped on manual dispatch, which would otherwise skip this
    # job too — allow dispatch through, and require CI success on release.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.wait-for-ci.result == 'success')
    runs-on: ubuntu-latest
    # Deliberately unbounded (GitHub's 360m default): this job blocks on a
    # human approving via manual-approval. A tight timeout here would not
    # catch a hang, it would cancel a deploy waiting on its approver.
    environment: production
    # Read by the alert job below: the gate refusing is the one failure of the
    # deploy job that is not a broken deploy.
    outputs:
      refused: ${{ steps.recheck.outputs.refused || steps.approval.outputs.approval-status == 'denied' }}

    steps:
      # Approval gate: GitHub's native environment required-reviewers isn't
      # available on this plan (private repo), so gate the prod deploy on a human
      # approving via an auto-opened issue. Skipped for dry-run (it changes
      # nothing). Approver comments "approve"/"yes"/"lgtm" to proceed.
      - name: Require manual approval
        id: approval
        if: ${{ !inputs.dry_run }}
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: andylizf,HuanCheng65
          minimum-approvals: 1
          issue-title: "Approve production deploy${{ github.event.release.tag_name && format(' of {0}', github.event.release.tag_name) || '' }}"
          issue-body: "Deploying to the etrip production box. Comment `approve` to proceed or `deny` to cancel."

      - name: Check out deployment policy after approval
        if: github.event_name == 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Recheck validation after approval
        id: recheck
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.wait-for-ci.outputs.sha }}
        run: python3 deploy/check-auto-deploy.py --require-ci "$CANDIDATE_SHA"

      - name: Check out the validated release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the checked SHA even if the tag moves while approval is pending.
          ref: ${{ needs.wait-for-ci.outputs.sha || inputs.ref }}

      - name: Resolve deploy image tag (monorepo commit sha — built for both images)
        id: img
        run: echo "sha=$(bash deploy/image-tag.sh HEAD)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_SHA: ${{ steps.img.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_SHA,DRY_RUN
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN — would deploy commit $IMAGE_SHA. Current state:"
              docker compose -f docker-compose.prod.yml ps
            else
              ./deploy.sh "$IMAGE_SHA"
            fi

  # A failed deploy tells the team's alert group (「Cheese 告警」), not only the
  # Actions tab. Its own job on a hosted runner, because a runner that lost the
  # server mid-deploy runs nothing more in the deploy job. Which outcomes page,
  # and why each, is .github/scripts/deploy-alert.py; a skipped deploy job (a
  # release gate that refused) never reaches it.
  alert:
    # wait-for-ci for the release commit it resolved.
    needs: [wait-for-ci, deploy]
    if: always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Here rather than on a step: an `if:` cannot read the `secrets` context.
    env:
      WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      - name: Decide whether the deploy failed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENVIRONMENT: etrip（etrip.cn）
          COMMIT: ${{ needs.wait-for-ci.outputs.sha || inputs.ref }}
          # GitHub's default job timeout, which the deploy job keeps so it can wait
          # on its approver; a hang that used it all up past approval pages.
          TIMEOUT_MINUTES: '360'
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          # The approval lives in this deploy job: an approver denying, or nobody
          # approving within the timeout, is a decision and leaves etrip as it
          # was, and so does validation that regressed while it waited.
          REFUSED: ${{ needs.deploy.outputs.refused }}
          WAITS_FOR_A_PERSON: Require manual approval
        run: python3 .github/scripts/deploy-alert.py
      - name: Tell the team the deploy failed
        if: steps.decide.outputs.text != '' && env.WEBHOOK != ''
        env:
          TEXT: ${{ steps.decide.outputs.text }}
        run: |
          set -uo pipefail
          # Never fail on the alert itself: the deploy's result is the finding.
          curl -sS -m 15 -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')" \
            || echo "::warning::could not reach the alert webhook"
