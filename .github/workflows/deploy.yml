name: Deploy

on:
  release:
    types: [published]

# GitHub tightened the default GITHUB_TOKEN to read-only contents — the
# wait-on-check-action needs checks:read to list check-runs (every release
# deploy since 2026-06 failed with 403 without this).
permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Wait for build + test workflows to finish (they trigger on tag push)
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Docker image build
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.release.tag_name }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: 'build-backend'
          wait-interval: 15

      - name: Wait for backend tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.release.tag_name }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: 'test'
          wait-interval: 15

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            ./deploy.sh ${{ github.event.release.tag_name }}
