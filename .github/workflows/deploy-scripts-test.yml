name: Deploy Scripts Test

# deploy/tests/ has had a fake-docker harness for the deploy scripts for months
# and nothing ran it: test.yml is scoped to `backend/**`, so a change under
# deploy/ reached the box having been executed by nobody. That is how the
# 2026-08-11 dev outage shipped — an ownership handover ordered ahead of a check
# that could abort it, six green CI jobs, none of which touched the file (run
# 31466502982).
#
# These suites are pure bash and python against fakes — no service containers, no
# registry, and the only image is the one `docker run` pulls for the failover
# case.
#
# This was one job until 2026-10-14. Its serial work had grown to 589-611 s
# against the 10-minute limit set when the whole file was "under a minute", and
# GitHub cancelled it at 603-611 s in 9 of the last 11 required checks — a
# cancelled job is not a red run, but the `required` aggregator reads it as one.
# The three groups below share no state (every suite builds its own mktemp tree,
# under `$ROOT/.tmp/`, `$ROOT/tmp/` or `$TMPDIR`; nothing reads what an earlier
# step wrote), so they run side by
# side and the longest one sets the lane's wall clock: 406/112/120 s in the first
# run after the split, against ~600 s for the single job. Each step is
# byte-identical to the one in the old job, and required-ci.py reads this
# workflow's overall result, so the split is invisible to the gate. Timeouts are
# 3-4x those measurements — this repo's own convention, P0-2 in
# docs/topics/CI提速P0六条.md.
on:
  workflow_call:
permissions:
  contents: read

# Cancel superseded runs on a PR, never on main. Keying main's runs by sha
# gives each commit its own group, so one push cannot cancel another's run and
# leave a commit on main with no result — a cancelled run is not a red run. PR refs keep the ref key, so repeated pushes
# to one PR still supersede each other.
concurrency:
  group: deploy-scripts-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The bulk of the lane: 406 s here, 401 s of it the app-tier suite (379 s of
  # the step when it sat in the single job). Two of those cases sit out the 60 s a
  # release script spends probing for a healthy owner that the fake never reports
  # — that wait is the behaviour under test, not slack to trim. 20 minutes is 3x.
  shell-tests-app-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A syntax error in a deploy script is only discovered on the box, mid
      # deploy, with the app tier already half-swapped. Cheapest possible gate.
      - name: Parse every deploy script
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || { echo "::error file=$script::bash -n failed"; status=1; }
          done < <(find deploy scripts -name '*.sh' -type f 2>/dev/null)
          exit "$status"

      # One case reads a `run:` block out of deploy-drift.yml. Everything else in
      # these suites is bash against fakes — this is the whole dependency. The
      # system python3 has no PyYAML and `pip install` is blocked (PEP 668), so
      # install the distro package; it is a no-op once a machine already has it.
      # Each job is its own machine and keeps its own copy of this step.
      - name: Ensure a YAML-capable python3
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh python3-yaml
          python3 -c 'import yaml'

      - name: App-tier deploy contract
        run: bash deploy/tests/test-app-tier-health.sh

  # 112 s here (104 s of it the step itself), most of it the nginx install the
  # step does for itself. No PyYAML: these scripts import none and shell
  # out only to the `configure-*.sh` writers and nginx. 6 minutes is 3x.
  shell-tests-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Persistent ingress survives application switches
        run: |
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh nginx
          python3 deploy/tests/test_reserved_port.py
          python3 deploy/tests/test_ingress_lifecycle.py
          python3 deploy/tests/test_front_door_tls.py
          python3 deploy/llm-tunnel/verify-sites.py

  # Everything else: 120 s here, led by the gateway group (72 s) and the failover
  # image pull. 8 minutes is 4x — the mount that can grow on its own is the pull,
  # and a cold one of those is slower than the 120 s this measured.
  shell-tests-deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure a YAML-capable python3
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh python3-yaml
          python3 -c 'import yaml'

      # Fetches the last commit before the two slots per service and runs its
      # deploy script against the state the slots leave.
      - name: A release of an older commit keeps the box's frontend ports
        run: bash deploy/tests/test-pre-slot-release.sh

      # The other half of that case: which commit the drift job fires when a
      # release of main would refuse while the `-b` slots serve.
      - name: Deploy drift converges across the two-slot boundary
        run: bash deploy/tests/test-converge-drift.sh

      - name: Automatic release ordering
        run: python3 deploy/tests/test_auto_deploy.py

      - name: The dev deploy's fetches wait out reset connections
        run: bash deploy/tests/test-git-fetch.sh

      - name: PR watcher follows the deploy that releases a merge
        run: python3 deploy/tests/test_pr_watch_deploy.py

      - name: Hong Kong edge asset copy
        run: python3 deploy/tests/test_edge_asset_sync.py

      - name: Gateway release and image planning
        run: |
          python3 deploy/tests/test_metering_release.py
          python3 deploy/tests/test_claude_login.py
          python3 deploy/tests/test_claude_accounts.py
          python3 deploy/tests/test_chatgpt_login.py
          python3 deploy/tests/test_metering_health.py
          python3 deploy/tests/test_gateway_release.py
          python3 deploy/tests/test_gateway_health_workflow.py
          python3 backend/scripts/test_gateway_supply_probe.py
          python3 backend/scripts/test_gateway_conformance.py
          bash .github/scripts/test-plan-image-builds.sh

      - name: Claude failover preserves HTTP/1.1 and HTTP/2 streaming
        run: |
          docker run --rm --network none --memory 512m --entrypoint python \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            mitmproxy/mitmproxy:12.1.2@sha256:0d7b2a14b4a71a908cd6f31b8f50e29bbc5c8720fe6caa706acf782da558e5c7 \
            deploy/tests/test_claude_retry.py

      - name: Render browser reaches public addresses only
        run: python3 deploy/tests/test_browser_render_egress.py

      - name: Cloud control connection lifecycle
        run: python3 deploy/tests/test_cloud_control.py

      - name: What pending migrations change under the connection owners
        run: python3 deploy/tests/test_migration_touches.py

      - name: Forge deployment configuration
        run: |
          python3 deploy/tests/test_forge_config.py
          python3 deploy/tests/test_forge_workspace_writers.py
          python3 deploy/tests/test_code_digest.py

      - name: Workspace ownership handover
        run: bash deploy/tests/test-workspace-ownership.sh

      - name: Disk-pressure guard
        run: bash deploy/tests/test-disk-pressure-guard.sh

      - name: Foreign-container eviction
        run: bash deploy/tests/test-evict-foreign-container.sh

      - name: Deployment merge survives a reset pulling its scratch images
        run: bash deploy/tests/test-merge-deployment-pull.sh

      - name: CI runner job-started hook
        run: bash deploy/tests/test-ci-runner-job-hook.sh

      - name: CI runner disk guard
        run: bash deploy/tests/test-ci-runner-disk-guard.sh
      - name: CI runner scheduled prune retirement
        run: bash deploy/tests/test-ci-runner-prune-retirement.sh

      - name: Dev-box cache reclaim
        run: bash deploy/tests/test-dev-box-disk-cleanup.sh

      - name: Deploy runner watchdog
        run: bash deploy/tests/test-runner-watchdog.sh

      - name: CI action archive cache
        run: python3 deploy/tests/test_action_archive_cache.py

      - name: CI runner provisioning
        run: bash deploy/tests/test-ci-runner-provision.sh
