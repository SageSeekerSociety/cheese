name: Deploy Scripts Test

# deploy/tests/ has had a fake-docker harness for the deploy scripts for months
# and nothing ran it: test.yml is scoped to `backend/**`, so a change under
# deploy/ reached the box having been executed by nobody. That is how the
# 2026-08-11 dev outage shipped — an ownership handover ordered ahead of a check
# that could abort it, six green CI jobs, none of which touched the file (run
# 31466502982).
#
# On the cheese-ci pool: these suites are pure bash against fakes — no service
# containers, no registry, no docker at all. It ran on a hosted runner until
# the org's Actions billing lapsed on 2026-08-13 (every ubuntu-latest job is
# refused before it starts); the pool is separate capacity from the dev box's
# single deploy slot, so it never queues behind a deploy. Under a minute.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-scripts-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-scripts-test.yml'

permissions:
  contents: read

# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group: with a shared `github.ref` key, a second merge
# cancelled the first one's run and main was left with no result for that
# commit. build.yml already keyed on sha for main; these did not.
concurrency:
  group: deploy-scripts-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-tests:
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A syntax error in a deploy script is only discovered on the box, mid
      # deploy, with the app tier already half-swapped. Cheapest possible gate.
      - name: Parse every deploy script
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || { echo "::error file=$script::bash -n failed"; status=1; }
          done < <(find deploy scripts -name '*.sh' -type f 2>/dev/null)
          exit "$status"

      # One case reads a `run:` block out of deploy-drift.yml. Everything else in
      # these suites is bash against fakes — this is the whole dependency. On the
      # pool the system python3 has no PyYAML and `pip install` is blocked
      # (PEP 668), so install the distro package; it is a no-op once a machine
      # already has it.
      - name: Ensure a YAML-capable python3
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          python3 -c 'import yaml'

      - name: App-tier deploy contract
        run: bash deploy/tests/test-app-tier-health.sh

      - name: Cloud control connection lifecycle
        run: python3 deploy/tests/test_cloud_control.py

      - name: Workspace ownership handover
        run: bash deploy/tests/test-workspace-ownership.sh

      - name: Disk-pressure guard
        run: bash deploy/tests/test-disk-pressure-guard.sh

      - name: Openviking memory backup
        run: bash deploy/tests/test-viking-backup.sh
