# Does the CURRENT Claude Code still speak the protocol we depend on?
#
# `delivery-e2e` in cli.yml pins the version production runs, so it proves our
# code works against a build we already trust. It cannot tell us anything about
# the next build — and prompt delivery rides the rendezvous socket, which is
# undocumented private surface. Its frames already moved once, between 2.1.220
# and 2.1.224. So "upstream might change it" is not a worry, it is a measurement
# we have already taken.
#
# This job installs @latest and runs the same suite. The point is to learn that
# an upgrade would break us BEFORE anyone upgrades, rather than from a room full
# of wedged topics afterwards. A red run is intelligence, not breakage: nothing
# in production changed, and nothing here blocks a merge.
name: Claude Code canary

on:
  schedule:
    # 03:20 UTC — after the nightly quiet period, and off the hour so it does
    # not queue behind everything else that fires at :00 on a shared runner.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "npm version/tag to test (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  issues: write # a silent canary is not a canary — see "Report" below

concurrency:
  group: claude-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Deliberately NOT the pin. Everything else in CI tests the version we
      # trust; this one exists to test the one we do not.
      - name: Install Claude Code (${{ inputs.version || 'latest' }})
        id: install
        run: |
          export NPM_CONFIG_PREFIX="$GITHUB_WORKSPACE/.npm-canary"
          npm install -g --silent "@anthropic-ai/claude-code@${{ inputs.version || 'latest' }}"
          v="$("$NPM_CONFIG_PREFIX/bin/claude" --version | head -n1 | awk '{print $1}')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "canary is testing Claude Code $v"

      # The pin the launcher enforces, read from the source of truth rather than
      # repeated here — a canary that compares against a stale copy of the pin
      # reports the wrong thing on the day it matters.
      - name: Read the pinned version
        id: pin
        run: |
          pin=$(grep -oE 'CLAUDE_PINNED_VERSION = "[^"]+"' \
                  backend/app/domain/agent/harness/claude_code/device_launch.py \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$pin"  # a canary comparing against an empty pin reports nothing
          echo "version=$pin" >> "$GITHUB_OUTPUT"
          echo "production pin is $pin"

      # The mock API's image, fetched before the suite so a registry hiccup is
      # this step's failure and not a skipped test. Through mirror.gcr.io, as
      # every other pull on the pool: Docker Hub's anonymous token endpoint is
      # what refused the canary on 2026-09-17 and -18. Tagged under the name
      # the harness runs, which then resolves locally.
      - name: Pull the mock API image
        run: |
          image=mockserver/mockserver:mockserver-7.5.0
          for attempt in 1 2 3 4 5; do
            if docker pull -q "mirror.gcr.io/$image"; then
              docker tag "mirror.gcr.io/$image" "$image"
              exit 0
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "could not pull $image through the mirror" >&2
          exit 1

      - name: Rendezvous e2e against the newest Claude Code
        id: e2e
        working-directory: cli
        continue-on-error: true
        env:
          CHEESE_E2E_REQUIRE_DOCKER: "1"
        run: |
          export PATH="$GITHUB_WORKSPACE/.npm-canary/bin:$PATH"
          go test -tags claudee2e -v -timeout 40m -run 'TestRendezvous' ./e2e/ 2>&1 | tee /tmp/canary.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Report. A scheduled job that only turns a square red is one nobody sees:
      # the failure arrives days later as "the upgrade broke everything", which
      # is exactly the outcome this exists to prevent. So a break files an issue
      # naming the version, and a recovery closes it — one issue, reopened and
      # updated, never a new one per night.
      #
      # Through the API, not `gh`: the cheese-ci runners do not have `gh`, and
      # from 2026-08-18 to 2026-09-05 every run died here with
      # `gh: command not found` — after the e2e had PASSED. Nineteen green
      # verdicts read as red, no issue ever filed or closed, and the pin was
      # held back by a canary that was not reporting. A canary that cannot
      # speak is the silent one this comment warns about.
      - name: File, update, or close the canary issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STATUS: ${{ steps.e2e.outputs.status }}
          CANARY: ${{ steps.install.outputs.version }}
          PIN: ${{ steps.pin.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { STATUS, CANARY, PIN, RUN_URL } = process.env;
            const marker = 'breaks rendezvous prompt delivery';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            // One issue, found by its title; the first 100 open issues are more
            // than this repository has.
            const { data: open } = await github.rest.issues.listForRepo({ ...repo, state: 'open', per_page: 100 });
            const existing = open.find(i => !i.pull_request && i.title.includes(marker));

            if (STATUS === '0') {
              if (existing) {
                await github.rest.issues.createComment({ ...repo, issue_number: existing.number,
                  body: `Green again against Claude Code \`${CANARY}\`.` });
                await github.rest.issues.update({ ...repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }

            const log = fs.existsSync('/tmp/canary.log') ? fs.readFileSync('/tmp/canary.log', 'utf8') : '';
            const failed = log.split('\n').filter(l => l.startsWith('--- FAIL')).slice(0, 20).map(l => '    ' + l).join('\n');
            const title = `Claude Code ${CANARY} breaks rendezvous prompt delivery`;
            const body = [
              `The rendezvous e2e suite fails against **Claude Code \`${CANARY}\`**, while production is pinned at \`${PIN}\`.`,
              '',
              'Nothing is broken right now — production still runs the pin. What this means is that **upgrading would break prompt delivery**, so the pin cannot move until this is understood.',
              '',
              'Failing cases:',
              '```', failed, '```',
              '',
              `Run: ${RUN_URL}`,
              '',
              'The delivery path rides an undocumented socket protocol (see #480); its frames already changed once between 2.1.220 and 2.1.224. The likely next step is to diff what the new build does to the frames in `cli/internal/rendezvous/client.go`.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number, body });
              await github.rest.issues.update({ ...repo, issue_number: existing.number, title });
            } else {
              try {
                await github.rest.issues.create({ ...repo, title, body, labels: ['ci'] });
              } catch (e) {
                await github.rest.issues.create({ ...repo, title, body });
              }
            }

      # The job's own conclusion still tracks the test, so the run history is
      # honest and `gh run list` shows the break.
      - name: Fail the job when the canary is red
        if: steps.e2e.outputs.status != '0'
        run: |
          echo "rendezvous e2e failed against Claude Code ${{ steps.install.outputs.version }}" >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "| | version |"
            echo "|---|---|"
            echo "| canary tested | \`${{ steps.install.outputs.version }}\` |"
            echo "| production pin | \`${{ steps.pin.outputs.version }}\` |"
            echo "| rendezvous e2e | ${{ steps.e2e.outputs.status == '0' && 'pass' || 'FAIL' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
