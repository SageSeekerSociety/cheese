name: Required CI

# No push trigger: every commit reaches main through the merge queue, which has
# already run this workflow on that exact commit (a squash onto the tested base,
# then a fast-forward). Deployment gates read that merge_group run.
#
# Two tiers, decided by the event (.github/scripts/required-ci.py: tier_for):
#
# - DRAFT pull request → the fast tier only: one inline job runs
#   `ci-fast.py --tier quick`, and every product suite is skipped. Its
#   aggregating job is named `CI required (draft quick)`, so a draft's green is
#   never the check branch protection requires. A draft is work in progress.
# - merge_group entry, or any pull_request that is not a draft (including the
#   `ready_for_review` that promotes a draft) → the full tier: every suite the
#   merge diff selects, aggregated under the required check name `CI required`.
#
# The two aggregating jobs are separate jobs with literal names (`required` and
# `required-draft`), each gated by an `if` on the event. Not one job with a
# computed name: an expression-named job renders as its own source text on a
# cancelled run, which reads as a red check named
# `github.event_name == 'pull_request' && ...`.
#
# A tier's job that the event does not select reports `skipped`, and GitHub
# counts a skipped required check as satisfied — so on a draft PR `CI required`
# is a skipped check rather than an absent one. That is not a way through: a
# draft cannot be merged, the platform reads `skipped`/absent as "did not run"
# (backend/app/domain/review/merge_state.py), and the merge queue re-runs the
# full tier on `merge_group`, which is the result the queue and the deploy gates
# read. What the two names keep is that a draft never produces a *green*
# `CI required`.
#
# `ready_for_review` is listed explicitly so promoting a draft starts a fresh
# FULL run. The concurrency group below (cancel-in-progress) stops a superseded
# draft-quick run only while it is still in flight; a draft-quick run that
# already completed is NOT revoked, and does not need to be — it left
# `CI required` skipped, which does not stand in for the full run's result on
# that commit.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      cli: ${{ steps.scope.outputs.cli }}
      guards: ${{ steps.scope.outputs.guards }}
      deploy: ${{ steps.scope.outputs.deploy }}
      harness: ${{ steps.scope.outputs.harness }}
      mcp: ${{ steps.scope.outputs.mcp }}
      equivalence: ${{ steps.scope.outputs.equivalence }}
      remote: ${{ steps.scope.outputs.remote }}
      cifast: ${{ steps.scope.outputs.cifast }}
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Only the cheap selection/aggregation self-test runs here: every product
      # suite waits on this job, so anything slow on it is serial time for the
      # whole workflow. ci-fast's black-box tests have their own job below.
      - name: Test scope and result handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_required_ci.py'
      - name: Select suites for the complete merge diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 .github/scripts/required-ci.py scope "$BASE_SHA"

  # The DRAFT tier: a bounded local-evidence run, inline so a draft adds no
  # reusable workflow to enumerate (and a draft must not exercise the docs
  # site's workflow-name reading of a `uses:` suite). It runs the SAME tool a
  # developer runs before pushing — `ci-fast.py --tier quick` — never a trimmed
  # full CI. Product suites are skipped on a draft (their `if` also requires
  # tier == 'full'), and the aggregating job's own name is what keeps a draft's
  # green from ever being read as `CI required`.
  #
  # What this tier does NOT have, it must not judge. Two things follow from
  # that, and both are the difference between a draft that reports a verdict on
  # its change and a draft that is red for the platform's own bookkeeping:
  #
  # - A draft's title is the platform's placeholder ("WIP: <task title>"), so
  #   the title is not checked here (ci-fast reads the draft flag from the PR
  #   JSON). The `required` job checks it, and pr-title.yml re-runs that job
  #   when the PR is marked ready.
  # - Redis is here (a service, like every full-tier job) and the pinned Claude
  #   Code/Codex/pi builds are NOT: installing three binaries into every draft
  #   run is the full CI's job, and a test that reaches for one fails rather
  #   than skips. ci-fast names those tests not run instead of running them.
  #
  # Both were read off the runs they broke: the draft job's commit-title step
  # failing on "WIP: <task title>", and backend-pure reporting 138 failed / 121
  # errors whose text is "CHEESE_TEST_CLAUDE/CHEESE_TEST_PI must point to the
  # pinned build". Symptoms a change's author cannot act on are symptoms that
  # make the check worth less than it costs.
  fast:
    needs: scope
    if: needs.scope.outputs.tier == 'quick'
    runs-on: ubuntu-latest
    # The draft tier keeps the quick tier's SELECTION but not the work machine's
    # bounds: ci-fast's 180s / 3072 MiB defaults describe the developer's box
    # (3072 MiB is literally its session cap). A runner that inherits them can
    # never judge a frontend change: of the 12 completed draft runs in the
    # 10-12 03:56–06:30 window, all 12 died in frontend-unit — peaks 2771–3079
    # MiB against that 3072 cap — with every later check left at 0s. This box is
    # the public-repo standard runner (4 vCPU / 16 GiB), which is the machine
    # frontend/vite.config.ts sizes its own pool for: it gets a ceiling that
    # backs that pool (9216 MiB) and a budget from the full-CI step times.
    # Measured on the first real draft run of this tier (2026-10-12, the widest
    # plan — unknown paths widen scope to the full suite plus the full type
    # check): the unit suite passed in 584s on 3 forks at a 3580 MiB peak, the
    # type check in 123s, and backend-pure then hit the 1200s budget. So 1200s
    # covers the targeted plan (change-related tests, changed-file types) with
    # room, and a draft that widens to everything may still report unknown.
    # This job timeout is only the outer backstop; install + pre-commit env prep
    # happen around the budget and are bounded separately.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    # The same valkey every full-tier job runs, on the same port, so a pure test
    # that touches Redis judges the change instead of reporting a connection
    # refused. Without it a draft's backend-pure was red on
    # tests/unit/test_login_attempt_budget.py connecting to localhost:6379 — a
    # service this job simply had not been given.
    env:
      REDIS_URL: redis://localhost:6389/0
    services:
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 1s
          --health-timeout 5s --health-retries 60
    steps:
      # fetch-depth 0: ci-fast.py resolves the merge base with `git merge-base
      # origin/main HEAD`, and a shallow clone would put that base out of reach
      # (no common ancestor → the file-size/migration-fork hooks go unknown).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin origin/main to the event's base sha WITHOUT passing a custom --base:
      # ci-fast.py treats any `--base` other than "origin/main" as unable to be
      # honored by the merge-base hooks and records it unknown. Pointing the
      # remote-tracking ref itself keeps the default and the hooks intact.
      - name: Point origin/main at the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "+$BASE_SHA:refs/remotes/origin/main"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      # Install BOTH dependency sets, unconditionally. ci-fast widens its OWN
      # effective scope beyond the raw select() flags this workflow sees — an
      # unmapped/unknown changed path (e.g. a new file, or a README edit) makes
      # it run both the backend and frontend checks, and an i18n catalog edit
      # widens it to backend — so any scope-gated install here could leave a
      # dependency ci-fast needs absent and report the draft blocked (a false
      # red on a change that touched nothing). Installing both removes the
      # coupling instead of re-deriving ci-fast's rules here and drifting.
      # This prep runs before ci-fast's budget starts: it is outside that
      # budget, bounded only by this job's timeout.
      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen --all-extras)
          (cd frontend && pnpm install --frozen-lockfile)
      # `--tier quick` picks the checks; the bounds are the runner's (see the
      # job comment). The exit code decides, and its three outcomes are not the
      # same thing:
      #
      #   0  every check the tier selected passed.
      #   1  a check failed. The draft goes red — a real red, which is the whole
      #      point of the tier.
      #   2  unknown, 3 blocked: the tier could not judge — the budget ran out,
      #      a check had no input, or this job was not given something a check
      #      needs. A draft is work in progress, `CI required (draft quick)` is
      #      not the check branch protection reads, and the merge queue runs the
      #      full tier on the same commit: so this does not turn the draft red.
      #      It does NOT pass either — every unjudged item is written into the
      #      step summary and a warning annotation, so the green is never read as
      #      "this was fully judged".
      #
      # GitHub has no third conclusion to report; the honest one is available
      # only to a human reading the summary, which is why the summary is not
      # optional here.
      - name: ci:fast quick tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_FAST_PRECOMMIT: uvx pre-commit
        run: |
          # Read the PR live from the API — NOT `gh pr view`, which needs a
          # branch and is unreliable on this detached merge ref, and not the
          # event payload, whose title an edit since then would make stale. The
          # JSON goes to a FILE, never into a workflow expression, a shell
          # variable or $GITHUB_OUTPUT: a title containing quotes, `$(...)` or a
          # newline stays data, and ci-fast.py reads both the title and the
          # draft flag from it.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
          report="$RUNNER_TEMP/ci-fast-report.json"
          status=0
          python3 .github/scripts/ci-fast.py --tier quick --budget 1200 --memory-mib 9216 \
            --pull-request "$RUNNER_TEMP/pull.json" --report "$report" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 1 ]; then
            echo "::error::ci:fast quick tier found a failure: this draft's change is red."
            exit 1
          fi
          {
            echo "### Draft quick tier: what it could not judge"
            echo
            echo "ci:fast exited $status (2 = unknown, 3 = blocked). This did not fail the"
            echo "draft — but it did not pass these either. \`CI required (draft quick)\` is"
            echo "not the check branch protection reads, and the merge queue runs the full"
            echo "Required CI on this same commit; that run is the one to look at."
            echo
            if [ -f "$report" ]; then
              jq -r '.ran[] | select(.result != "pass") | "- `\(.id)`: \(.result) \(.reason // "")"' "$report"
              jq -r '.not_run[]? | "- not run `\(.id)`: \(.reason)"' "$report"
            else
              echo "ci:fast wrote no report at $report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::ci:fast quick tier could not judge everything (exit $status). See this run's step summary; this draft check is not the required gate."
          exit 0

  backend:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.backend == 'true'
    uses: ./.github/workflows/test.yml

  # ci-fast's black-box tests are their own suite: they used to run inside
  # scope, which put their ~65–121s on the serial path of every Required run.
  # A reusable workflow like every other suite — the docs site names the
  # workflow behind a suite by reading this job's `uses:`.
  cifast:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.cifast == 'true'
    uses: ./.github/workflows/ci-fast.yml

  frontend:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml

  e2e:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.e2e == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml

  cli:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.cli == 'true'
    uses: ./.github/workflows/cli.yml

  guards:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.guards == 'true'
    uses: ./.github/workflows/repo-guards.yml

  deploy:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-scripts-test.yml

  harness:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.harness == 'true'
    uses: ./.github/workflows/harness-contract.yml

  mcp:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.mcp == 'true'
    uses: ./.github/workflows/mcp-contract.yml

  equivalence:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.equivalence == 'true'
    uses: ./.github/workflows/mcp-equivalence.yml

  # The tier's aggregator. There are two of them, one per tier, and each has its
  # name written out as a literal. Two literals, not one computed name: a name
  # built from an expression is only rendered when GitHub evaluates it, so a run
  # that is cancelled — or any surface that reads the job before it starts —
  # shows the expression's own text, which reads as a red check on the PR page.
  #
  # The pair is also what keeps the tiers apart. `CI required` is the name branch
  # protection and the merge gate read; only a merge_queue entry or a non-draft
  # pull_request can produce it. A draft run gets `CI required (draft quick)`, so
  # its partial green can never satisfy the required check.
  #
  # Which job runs is keyed off the EVENT's own `draft` flag, not the scope
  # output: if `scope` fails its `tier` output is empty, and keying off that
  # would fall through to the bare `CI required` name on a draft run — exactly
  # the collision this exists to prevent. The event's `draft` flag cannot be
  # lost that way. Both jobs run the same judge, which recomputes the tier from
  # the event and rejects any scope output that disagrees (required-ci.py:
  # failures/tier_for), so a wrong tier is red, never a mislabelled pass.
  #
  # Both jobs need the whole `needs` list: the judge requires every suite to
  # report `skipped` in the quick tier, and a job absent from `needs` is not
  # `skipped` — it is `missing`, which the judge fails.
  required:
    name: CI required
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    # pull-requests: read is for the title step, which reads the PR's title.
    permissions:
      contents: read
      pull-requests: read
    needs: [scope, backend, frontend, e2e, cli, guards, deploy, harness, mcp, equivalence, remote, cifast, fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected suite to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/required-ci.py check
      # This repo's own commit convention (docs/workflows.md §5); the platform
      # leaves a hosted repo's titles to that repo. In the merge queue it reads
      # the squash commits about to land, which is what main will say. On a PR
      # it fetches the PR live rather than from the event payload, so
      # re-running this job after editing the title sees the new one, and it
      # passes a draft, whose title is still a placeholder. pr-title.yml re-runs
      # this job when a PR is marked ready or retitled — which is why the draft
      # job below has no title step: a draft's title is the platform's
      # placeholder, nothing to check, and `ready_for_review` starts this job.
      - name: Commit titles follow the convention
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
              --jq '.commits[].commit.message | split("\n")[0]' \
              | python3 .github/scripts/check-commit-title.py
          else
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
            python3 .github/scripts/check-commit-title.py --pull-request "$RUNNER_TEMP/pull.json"
          fi

  required-draft:
    name: CI required (draft quick)
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft }}
    permissions:
      contents: read
    needs: [scope, backend, frontend, e2e, cli, guards, deploy, harness, mcp, equivalence, remote, cifast, fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected suite to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/required-ci.py check

  remote:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.remote == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/remote-execution.yml
