name: Required CI

# Three tiers, decided by the event (.github/scripts/required-ci.py: tier_for):
#
# - A draft pull request runs no suite. It aggregates as `CI required (draft
#   quick)`, which the merge gate does not read; the platform marks the PR ready
#   when it hands the work over, and `ready_for_review` starts the next tier.
# - A ready pull request runs every suite its diff selects, except the
#   post-merge suites (e2e, remote, mcp, equivalence), with the backend's
#   integration layer narrowed to the test files that executed what the
#   diff changed (the coverage map, coverage-map.yml). It
#   aggregates as `CI required`, the merge gate, and checks the commit title.
# - A push to main is the post-submit gate: every suite the cumulative diff
#   since `refs/heads/main-green` selects, all of each (see `main-green` at the
#   bottom and required-ci.py: effective_base). Deployment gates read that run.
#
# The two aggregating jobs are separate jobs with literal names (`required` and
# `required-draft`), each gated by an `if` on the event. Not one job with a
# computed name: an expression-named job renders as its own source text on a
# cancelled run, which reads as a red check named
# `github.event_name == 'pull_request' && ...`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

# A main push joins one fixed group with `cancel-in-progress: false`, so GitHub
# keeps one run executing and at most one pending, and a newer pending run
# replaces the older one. That is the batching: the run that starts covers
# everything since `main-green`, so the commits of a superseded pending run are
# not dropped. Pull requests cancel their superseded runs.
concurrency:
  group: required-ci-${{ github.event_name }}-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Seconds-long serial job: on a GitHub machine it waited 3-20 min (#4101) in the shared
    # runner queue behind the big jobs. A main push and same-repo PRs
    # use the cheese-ci pool (docs/infrastructure.md); fork PRs and a
    # deleted fork stay on GitHub's machines.
    runs-on: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","cheese-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    # actions: read is for the integration coverage map (coverage-map.yml's
    # newest artifact), which a ready pull request's selection reads.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      cli: ${{ steps.scope.outputs.cli }}
      guards: ${{ steps.scope.outputs.guards }}
      deploy: ${{ steps.scope.outputs.deploy }}
      harness: ${{ steps.scope.outputs.harness }}
      mcp: ${{ steps.scope.outputs.mcp }}
      equivalence: ${{ steps.scope.outputs.equivalence }}
      remote: ${{ steps.scope.outputs.remote }}
      tier: ${{ steps.scope.outputs.tier }}
      base: ${{ steps.scope.outputs.base }}
      integration_files: ${{ steps.scope.outputs.integration_files }}
      integration_shards: ${{ steps.scope.outputs.integration_shards }}
      integration_floor: ${{ steps.scope.outputs.integration_floor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Only the cheap selection/aggregation self-test runs here: every product
      # suite waits on this job, so anything slow on it is serial time for the
      # whole workflow.
      - name: Test scope and result handling
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_required_ci.py'
          python3 -m unittest discover -s .github/scripts -p 'test_download_artifacts.py'
      - name: Select suites for the complete merge diff
        id: scope
        env:
          # A pull request names its base in the event. A main push has no
          # base worth passing here (github.event.before is only the previous
          # tip), so the script resolves its own from the `main-green` ref.
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$EVENT_BASE" ]; then
            # The base the checked-out merge ref was built on, not the payload's:
            # main moves between the two, and diffing against the payload counts
            # unrelated main commits as part of this PR.
            EVENT_BASE=$(python3 .github/scripts/required-ci.py pr-base "$EVENT_BASE")
            # Every selected suite waits on this fetch, so one transient network
            # error here reddens the whole run. Retry it; the selection below is
            # unchanged.
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "$EVENT_BASE"; then break; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::git fetch of $EVENT_BASE failed on all $attempt attempts" >&2
                exit 1
              fi
              sleep 2
            done
          fi
          python3 .github/scripts/required-ci.py scope "$EVENT_BASE"

  backend:
    needs: scope
    if: needs.scope.outputs.tier != 'draft' && needs.scope.outputs.backend == 'true'
    uses: ./.github/workflows/test.yml
    with:
      integration-files: ${{ needs.scope.outputs.integration_files }}
      integration-shards: ${{ needs.scope.outputs.integration_shards }}
      integration-floor: ${{ fromJSON(needs.scope.outputs.integration_floor) }}
      coverage-job: false

  # Two questions about the backend's OpenAPI document, asked of every backend
  # change: the document printed at the diff's base and at this commit,
  # compared (required-ci.py: api_selected; the judge holds the job to it).
  #
  # Did it move? The frontend's types are generated from that document
  # (frontend/scripts/gen-api-types.mjs), so a backend change that moves it
  # runs the frontend suite below. The path map cannot answer this — the
  # document is a function of the app, and no file says when it moved. Until
  # 2026-10-17 one did: the committed digest backend/openapi.sha256, which every
  # API change rewrote and any two of them collided on, in the merge queue
  # above all. This asks the question the digest stood for, with no file to
  # collide on.
  #
  # Does it break a page built against the base? A page left open across the
  # deploy keeps its frontend, and the backend refuses it only when it was
  # built for a lower API generation (backend/app/core/api_generation.py). So a
  # breaking change (.github/scripts/api_compat.py) fails here unless it raised
  # backend/api-generation. Asked of changes that edit the frontend too: those
  # are the ones that change both halves at once. Two pull requests that each
  # raise the number by one merge cleanly to the same value; when the first was
  # deployed before the second, the push run on main (whose base is the last
  # green commit) fails here, and the fix is one more raise.
  #
  # Each `uv run --frozen` syncs the one environment to its own tree's lock, so
  # a change that moves a dependency prints each document with its own
  # dependencies.
  api:
    needs: scope
    if: needs.scope.outputs.tier != 'draft' && needs.scope.outputs.backend == 'true' && needs.scope.outputs.base != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      moved: ${{ steps.compare.outputs.moved }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
          # Restore only: warm-caches.yml saves this key on main.
          save-cache: false
      - name: Compare the OpenAPI document with the base's
        id: compare
        env:
          BASE_SHA: ${{ needs.scope.outputs.base }}
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd backend && uv run --frozen --no-dev python -m scripts.export_openapi --stdout) > "$RUNNER_TEMP/head.json"
          (cd "$RUNNER_TEMP/base/backend" && uv run --frozen --no-dev python -m scripts.export_openapi --stdout) > "$RUNNER_TEMP/base.json"
          if cmp -s "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"; then
            echo "The OpenAPI document is the same at $BASE_SHA and here."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "The OpenAPI document moved since $BASE_SHA, so the frontend suite runs:"
            diff -u "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" | head -n 200 || true
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: A breaking API change raises the API generation
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_api_compat.py'
          # A base from before the generation existed counts as generation 0.
          base_generation=$(cat "$RUNNER_TEMP/base/backend/api-generation" 2>/dev/null || echo 0)
          python3 .github/scripts/api_compat.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" \
            "$base_generation" "$(cat backend/api-generation)"

  # Selected by the paths, or by the `api` job seeing the API surface move.
  # `!cancelled()` is what lets it start when `api` was skipped: a skipped need
  # otherwise skips every job after it.
  frontend:
    needs: [scope, api]
    if: ${{ !cancelled() && needs.scope.outputs.tier != 'draft' && (needs.scope.outputs.frontend == 'true' || needs.api.outputs.moved == 'true') }}
    uses: ./.github/workflows/frontend.yml

  e2e:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.e2e == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml

  cli:
    needs: scope
    if: needs.scope.outputs.tier != 'draft' && needs.scope.outputs.cli == 'true'
    uses: ./.github/workflows/cli.yml

  guards:
    needs: scope
    if: needs.scope.outputs.tier != 'draft' && needs.scope.outputs.guards == 'true'
    uses: ./.github/workflows/repo-guards.yml

  deploy:
    needs: scope
    if: needs.scope.outputs.tier != 'draft' && needs.scope.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-scripts-test.yml

  harness:
    needs: scope
    if: needs.scope.outputs.tier != 'draft' && needs.scope.outputs.harness == 'true'
    uses: ./.github/workflows/harness-contract.yml

  mcp:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.mcp == 'true'
    uses: ./.github/workflows/mcp-contract.yml

  equivalence:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.equivalence == 'true'
    uses: ./.github/workflows/mcp-equivalence.yml

  # The tier's aggregator. There are two of them, one per tier, and each has its
  # name written out as a literal. Two literals, not one computed name: a name
  # built from an expression is only rendered when GitHub evaluates it, so a run
  # that is cancelled — or any surface that reads the job before it starts —
  # shows the expression's own text, which reads as a red check on the PR page.
  #
  # The pair is also what keeps the tiers apart. `CI required` is the name branch
  # protection and the merge gate read; only a main push or a non-draft
  # pull_request can produce it. A draft run gets `CI required (draft quick)`, so
  # its green, which judged no suite, can never satisfy the required check.
  #
  # Which job runs is keyed off the EVENT's own `draft` flag, not the scope
  # output: if `scope` fails its `tier` output is empty, and keying off that
  # would fall through to the bare `CI required` name on a draft run — exactly
  # the collision this exists to prevent. The event's `draft` flag cannot be
  # lost that way. Both jobs run the same judge, which recomputes the tier from
  # the event and rejects any scope output that disagrees (required-ci.py:
  # failures/tier_for), so a wrong tier is red, never a mislabelled pass.
  #
  # Both jobs need the whole `needs` list: the judge requires every suite to
  # report `skipped` in the draft tier, and a job absent from `needs` is not
  # `skipped` — it is `missing`, which the judge fails.
  required:
    name: CI required
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    # pull-requests: read is for the title step, which reads the PR's title.
    # actions: read is for listing and downloading this run's backend shard artifacts.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    needs: [scope, api, backend, frontend, e2e, cli, guards, deploy, harness, mcp, equivalence, remote]
    # Seconds-long serial job: on a GitHub machine it waited 3-20 min (#4101) in the shared
    # runner queue behind the big jobs. A main push and same-repo PRs
    # use the cheese-ci pool (docs/infrastructure.md); fork PRs and a
    # deleted fork stay on GitHub's machines.
    runs-on: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","cheese-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected suite to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/required-ci.py check
      # test.yml's `Backend coverage complete`, run here instead of as a job of
      # its own (the backend job passes coverage-job: false): every case the
      # independent collection names ran on exactly one shard. One runner hop
      # fewer on the critical path. `needs.backend.result == 'success'` already
      # says no shard failed, and an integration layer skipped when it was due
      # leaves its cases missing from the shards, which this step fails on.
      # One request at a time, each retried: the cheese-ci pool's link to GitHub
      # resets a connection now and then, and download-artifact fails its whole
      # call on one reset (download_artifacts.py says more).
      - name: Download backend shard artifacts
        if: needs.backend.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download_artifacts.py 'backend-*' "$RUNNER_TEMP/backend-artifacts"
      - name: Backend coverage complete
        if: needs.backend.result == 'success'
        working-directory: backend
        run: python3 -m scripts.assert_shards_complete "$RUNNER_TEMP/backend-artifacts" --plan backend-expected
      # This repo's own commit convention (docs/workflows.md §5); the platform
      # leaves a hosted repo's titles to that repo. On a main push it reads the
      # squash commits that landed, which is what main says. On a PR it fetches
      # the PR live rather than from the event payload, so re-running this job
      # after editing the title sees the new one; pr-title.yml re-runs it when a
      # PR is retitled. The draft job below has no title step: a draft's title
      # is the platform's placeholder, and `ready_for_review` starts this job.
      - name: Commit titles follow the convention
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A main push's batch base: the anchor scope resolved, empty when there
          # is none yet.
          PUSH_BASE_SHA: ${{ needs.scope.outputs.base }}
        # curl + python3, not gh + jq: the cheese-ci boxes have neither gh nor jq
        # (python3, git and curl only), and both calls are plain GETs.
        #
        # A TLS reset on one of those GETs reddened a run (#4144:
        # curl 35 and a JSONDecodeError), so retry transient network errors and,
        # when the read really fails, name the status instead of handing python
        # an empty string to parse. -f is what makes an HTTP error a failed
        # transfer at all, so --retry covers 5xx too.
        run: |
          set -o pipefail
          api() {
            local out code rc
            out="$(mktemp)"
            code="$(curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 \
              -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$1")" && rc=0 || rc=$?
            if [ "$rc" -ne 0 ] || [ "${code:0:1}" != 2 ]; then
              echo "::error::GitHub API GET $1 failed: curl exit $rc, HTTP ${code:-none}" >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }
          check_compare() {
            # Read the response into a file first: a failed read exits here (the
            # runner's shell runs with errexit) instead of feeding python "".
            api "compare/$1...$2" > "$RUNNER_TEMP/compare.json"
            python3 -c 'import json,sys; [print(c["commit"]["message"].split("\n")[0]) for c in json.load(sys.stdin)["commits"]]' \
              < "$RUNNER_TEMP/compare.json" \
              | python3 .github/scripts/check-commit-title.py ${3:-}
          }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$PUSH_BASE_SHA" ]; then
            # The whole batch: every commit since the last green anchor,
            # including those whose own run was superseded while pending.
            # --warn-only: these titles are already on main, and a red gate would
            # hold the commit (and dev) back over a mistake nobody can retitle.
            check_compare "$PUSH_BASE_SHA" "$GITHUB_SHA" --warn-only
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # No anchor yet (the first push after the gate moved to main): the
            # commits this run can attribute are the push's own.
            python3 -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); [print(c["message"].split("\n")[0]) for c in e.get("commits") or []]' \
              | python3 .github/scripts/check-commit-title.py --warn-only
          else
            api "pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
            python3 .github/scripts/check-commit-title.py --pull-request "$RUNNER_TEMP/pull.json"
          fi

  # The batch anchor for a main push. `scope` diffs a push run from the commit
  # this ref names, so every commit that landed since the gate last passed stays
  # in some run's coverage — including the commits of a run that a newer push
  # superseded while it was pending. Only a main push whose `CI required`
  # passed moves the ref; a red run leaves it, and the next run covers both.
  # Not in `required`'s `needs`: the anchor records the gate's verdict and must
  # never decide it. `contents: write` is only for the ref update, and the job
  # never touches the tree it checked out.
  mark-green:
    name: Mark main green
    needs: required
    if: ${{ !cancelled() && github.event_name == 'push' && needs.required.result == 'success' }}
    permissions:
      contents: write
    # Seconds-long job on the same pool as the aggregators. Hosted runners'
    # queue wait would hold the run's concurrency group — and with it the next
    # batch — behind a machine this does not need.
    runs-on: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","cheese-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point main-green at this commit
        # The REST call, not a `git push`: this job checks out at depth 1, so the
        # client cannot see that the anchor's tip is an ancestor of this commit
        # and rejects the push as non-fast-forward even though it fast-forwards
        # (2026-10-18: two green batches in a row left the anchor behind). The
        # server can see the ancestry; force=false keeps that judgement there,
        # so a rewritten main is still refused.
        #
        # curl, not gh: the cheese-ci boxes have no gh (same reason the title
        # step below spells its calls out in curl).
        #
        # PATCH only updates an existing ref, so when the anchor is gone (deleted
        # by hand, or the very first landing on a repository that never had one)
        # it answers 422 and the anchor would never come back. POST creates it —
        # no fast-forward question to ask about a ref that does not exist.
        #
        # A refusal here must not fail the run. The deploy gate reads this run's
        # conclusion, so a network error on this one call would hold a commit
        # off dev — while an anchor that did not move is safe by construction:
        # the next run diffs from the older commit, which covers more, never
        # less. It is loud instead, so a stuck anchor gets noticed.
        #
        # Only a definite "no such ref" answer earns the create call. A timeout
        # or a 5xx says nothing about whether the ref exists, and a second full
        # retry budget would put this job past its five minutes — a timed-out
        # run is a failed run to the deploy gate, which is the one outcome this
        # job must never cause.
        #
        # Every call below is bounded so the whole step fits in five minutes on
        # its worst path. --max-time bounds one attempt and --retry 2 makes
        # three, but a retry wait is not transport: curl sleeps for the
        # server's Retry-After when it sends one, which --retry-delay and
        # --max-time do not cap (a 429 that says "wait a minute" sleeps a
        # minute, twice). --retry-max-time is the only knob that caps the whole
        # call, waiting included. So one call is at most 60s, and update +
        # create + the 15s read-back is 135s, plus a checkout.
        # (The old 60s/per-call numbers let a PATCH that timed out twice and
        # then answered 422 stack two 246s budgets: 492s.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          ref_url="https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main-green"
          update_ref() {
            curl -sS --retry 2 --retry-delay 2 --retry-max-time 60 --max-time 30 \
              -o /dev/null -w '%{http_code}' "${auth[@]}" "$@"
          }
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/main-green"
          moved=""
          post_code=""
          if code="$(update_ref -X PATCH --data "{\"sha\":\"$GITHUB_SHA\",\"force\":false}" "$url")" \
             && [ "${code:0:1}" = 2 ]; then
            moved=1
          elif [ "$code" = 422 ] || [ "$code" = 404 ]; then
            if post_code="$(update_ref -X POST \
                   --data "{\"ref\":\"refs/heads/main-green\",\"sha\":\"$GITHUB_SHA\"}" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs")" \
               && [ "${post_code:0:1}" = 2 ]; then
              moved=1
            elif [ "$post_code" = 409 ]; then
              # "Reference already exists": either the create really landed
              # and only its response was lost (the retry met the new ref), or
              # someone else made it point elsewhere. Read it back before
              # saying the anchor did not move.
              if curl -sS --max-time 15 "${auth[@]}" "$ref_url" | grep -q "$GITHUB_SHA"; then
                moved=1
              fi
            fi
          fi
          if [ -n "$moved" ]; then
            echo "Main green anchor moved to $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::could not move refs/heads/main-green to $GITHUB_SHA (update HTTP ${code:-none}, create HTTP ${post_code:-not tried}); the next main run starts from the older anchor or the full tree, so it covers this batch too."
          echo "Main green anchor not moved: the next run covers this batch as well." >> "$GITHUB_STEP_SUMMARY"

  required-draft:
    name: CI required (draft quick)
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft }}
    permissions:
      contents: read
    needs: [scope, api, backend, frontend, e2e, cli, guards, deploy, harness, mcp, equivalence, remote]
    # Seconds-long serial job: on a GitHub machine it waited 3-20 min (#4101) in the shared
    # runner queue behind the big jobs. Same-repo PRs use the
    # cheese-ci pool (docs/infrastructure.md); fork PRs and a deleted fork stay on GitHub's machines.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","cheese-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected suite to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/required-ci.py check

  remote:
    needs: scope
    if: needs.scope.outputs.tier == 'full' && needs.scope.outputs.remote == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/remote-execution.yml
