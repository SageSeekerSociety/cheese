name: Backend Test

# Every job here but the last (`test-complete`, a seconds-long aggregation that
# takes the cheese-ci pool for same-repo PRs) runs on a
# GitHub-hosted runner: the repository is public, so
# hosted minutes are free and unlimited. Postgres and Valkey come as service
# containers on the same images and host ports the cheese-ci pool's resident
# pair use (deploy/ci-runner/resident-services.sh), so the test settings do not
# depend on which kind of runner they land on. Jobs that need the dev box's
# own images or a real device live in their own workflows, not here.
on:
  workflow_call:
    inputs:
      # The layers run on arm64: its standard runners have four real cores,
      # while the x64 ones are two cores with hyperthreading on CPUs of
      # different generations, and these layers keep every core busy. The
      # prod release runs the same suite once on x64 (deploy-prod.yml),
      # because production does.
      runner:
        type: string
        default: ubuntu-24.04-arm
      # The commit to test; empty means the commit the caller ran for.
      ref:
        type: string
        default: ""
      # The integration layer's test files, as a JSON array of paths relative
      # to backend/, or the JSON string "all". A pull request passes the files
      # its diff reaches (required-ci.py: integration_plan); an empty array
      # means the layer is not due. Every other caller runs it whole.
      integration-files:
        type: string
        default: '"all"'
      # The integration layer's partitions, a JSON array of "index/count".
      integration-shards:
        type: string
        default: '["0/5","1/5","2/5","3/5","4/5"]'
      # The fewest integration cases the layer may select: the whole layer's
      # floor, or 0 for a narrowed selection, whose files may hold none.
      integration-floor:
        type: number
        default: 2400
      # Whether `test-complete` runs here. required-ci.yml passes false and runs
      # the same shard-coverage check inside its own `CI required` job, one
      # runner hop shorter; deploy-prod's x86 run has no aggregator of its own
      # and keeps the default.
      coverage-job:
        type: boolean
        default: true
      # Trace the whole integration layer under coverage.py, one context per
      # test, and upload each shard's function-to-test-files map: the input of
      # a pull request's integration selection (coverage-map.yml, the only
      # caller). Only the integration layer runs, and a red case does not fail
      # the shard — a traced run is slower and trips the per-case ceiling, and
      # what it produces is a map, not a verdict.
      trace-coverage:
        type: boolean
        default: false
# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# Cancel superseded runs on a PR; elsewhere each commit has its own group, so
# one run cannot cancel another's and leave a commit with no result. PR refs
# keep the ref key, so repeated pushes to one PR supersede each other.
concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}${{ inputs.trace-coverage && '-traced' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything in the backend suite that needs no services: lint and types,
  # module boundaries, the independent collection, the pi extension's tests and
  # the alembic head count. One job rather than three: each of the three used
  # to queue for its own runner and check out the tree for well under two
  # minutes of work, and a run's wall clock is mostly that queue.
  static:
    if: ${{ !inputs.trace-coverage }}
    runs-on: ubuntu-latest
    # Measured median 1.6m for lint and 1.8m for migration-heads as separate
    # jobs; the margin covers a cold uv cache without leaving a stuck run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          # Keep downloaded wheels; uv cache prune --ci would remove them before upload.
          prune-cache: false
          # Restore only: warm-caches.yml saves this key on main.
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        id: install
        run: uv sync --frozen --all-extras

      # From here each check runs whether or not the one before it passed:
      # they were separate jobs, and one red step must not hide another's
      # verdict.
      # The hooks read from .pre-commit-config.yaml, so CI and the local list
      # cannot drift apart. Both are `stages: [manual]`: a commit only fixes the
      # staged files (ruff-fix), and the whole-tree verdict — lint, import
      # order, layout, types — is here. Each hook cds into backend/ on its own,
      # so these run from the workspace root rather than under this job's
      # `defaults`.
      - name: Lint and type-check (pre-commit hooks)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          uvx pre-commit run --all-files --hook-stage manual --show-diff-on-failure ruff
          uvx pre-commit run --all-files --hook-stage manual pyright

      # A check that reports "clean" because it never ran is the failure this
      # job exists to prevent, and this one is easy to break silently: it reads
      # app/ into an import graph through backend/.importlinter, so if the
      # config moved or stopped naming a contract it would find nothing wrong
      # with anything. So it is asked to prove itself — this builds a throwaway
      # package tree, plants a violation in it, and requires a non-zero exit.
      # Since it also grades the tree at the merge base, the throwaway trees
      # include that half: a base tree of its own, a violation it already has,
      # one this tree adds on top, and a base that does not resolve.
      - name: Module boundary check proves it still fires
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python scripts/check_boundaries.py --self-test

      # Two checks below grade this tree against the tree at the merge base with
      # origin/main — the boundary check for the violations it tolerates, the
      # migration check for the release's models — and neither baseline is
      # stored anywhere. A depth-1 checkout has no such commit, and the boundary
      # check would answer "could not judge" — exit 2, a red step that says
      # nothing about the tree. One fetch, here, before both: a second
      # `--unshallow` in the same job fails on a now complete repository.
      # Rules: .claude/rules/architecture.md, .claude/rules/migrations.md.
      - name: Fetch main for comparison
        id: main_history
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git fetch --no-tags --unshallow origin

      # The same hook a developer's commit runs, from the same file, and over
      # all files rather than this diff: the import graph is a property of the
      # tree, not of the commit that touched it.
      - name: Module boundaries (import-linter, baseline from the merge base)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: uvx pre-commit run --all-files boundary-check

      # The same comparison for who may call a write route: no route added
      # here leaves it to its handler (ROUTE_DECIDES).
      - name: No new write route declares ROUTE_DECIDES
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: uvx pre-commit run --all-files route-decides

      # Building the document is also the smoke test that the app can produce
      # one at all: the frontend no longer finds a committed copy, it asks for
      # the document just before type-checking (frontend/scripts/typecheck.mjs).
      # It also holds the ratchet beside it, backend/openapi-untyped.json, which
      # only shrinks, so a new route declares what it returns. Whether the
      # document moved, which decides whether the frontend suite runs, is the
      # `api` job's question in required-ci.yml, not this one's. A step, not a test:
      # building takes about 25 s, longer than the pure layer's per-test
      # ceiling. See scripts/export_openapi.py.
      - name: OpenAPI document builds and untyped ratchet holds
        run: uv run python -m scripts.export_openapi --check

      # The plan holds exactly what the shards are meant to run: with a
      # narrowed integration selection, the same files the shards filter to.
      - name: Independently collect every required backend case
        id: collect
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          INTEGRATION_FILES: ${{ inputs.integration-files }}
        run: |
          mark_args=()
          if [ "$INTEGRATION_FILES" = '[]' ]; then
            mark_args=(-m "not integration")
          fi
          printf '%s' "$INTEGRATION_FILES" > "$RUNNER_TEMP/integration-files.json"
          uv run python -m pytest tests/ --collect-only -q \
            --ignore=tests/forgejo -k 'not kotlin' "${mark_args[@]}" \
            -p scripts.ci_shard --ci-integration-files="$RUNNER_TEMP/integration-files.json" \
            --ci-selection-output="$RUNNER_TEMP/backend-expected"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        with:
          name: backend-expected-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-expected/
          if-no-files-found: error
          retention-days: 14

      # The one piece of backend code that is not Python: the extension a pi room
      # gives its agent. It runs inside pi on a session machine, so the only thing
      # it may ever need is what that machine has — and this lane is held to the
      # same bar. Node strips the types itself; there is no package.json here, no
      # install step, and nothing to keep in a lockfile. A toolchain here would be
      # the first place "a session machine needs no toolchain" stopped being true.
      #
      # Node 24 rather than the 22 the frontend pins: type stripping is on by
      # default from 23.6, and the alternative is carrying an experimental flag
      # that exists only to say so.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        with:
          node-version: 24

      - name: Run the pi extension's tests
        if: ${{ !cancelled() }}
        run: node --test tests/extension/*.test.ts

      # The merge check (app/domain/review/merge_check.py) shells out to git,
      # and the git that decides is the one the backend image ships, not this
      # runner's newer one: `git merge-tree --quiet` passed here and exits 129
      # on the image's Git 2.47 (#4853). So its tests run once more on the
      # image's own runtime stage.
      - name: Merge check tests with the backend image's git
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: bash backend/scripts/test_with_image_git.sh tests/unit/test_merge_check.py

      # Judges only the migrations this PR adds, against origin/main's models
      # (is a dropped column still mapped by the release that keeps serving
      # while migrations run?). The merge base it needs came from the fetch
      # above. Rules: .claude/rules/migrations.md.
      - name: Added migrations are safe under the running release
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.main_history.outcome == 'success' }}
        # The job's default working directory is backend/; the script takes
        # repository paths.
        working-directory: ${{ github.workspace }}
        run: python3 .claude/scripts/check-migration-safety.py

  test:
    if: ${{ !inputs.trace-coverage }}
    runs-on: ${{ inputs.runner }}
    name: ${{ matrix.layer }} (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two pure shards: at one, the pure layer was often the run's
          # slowest job, CPU-bound on its runner. Go back to one if the queue's
          # wait for a runner grows by more than the second shard saves.
          - {layer: pure, shard: '0/2', floor: 4000, timeout: 10}
          - {layer: pure, shard: '1/2', floor: 4000, timeout: 10}
          - {layer: contract, shard: '0/1', floor: 200, timeout: 5}
    # Floors apply to the complete layer before sharding, not each runner.
    env:
      REDIS_URL: redis://localhost:6389/0
      JWT_SECRET: test-secret
      ENVIRONMENT: test
      # LLM tests mock the completions; the client just needs to construct
      # (the openai SDK errors without any credentials). Dummy key.
      OPENAI_API_KEY: test-key
      # The default AI pool is "available" only when its gateway credential is
      # present (AgentProfile.available = bool(auth_token)); the market test
      # asserts availability. Dummy token — no real calls are made.
      ANTHROPIC_AUTH_TOKEN: test-token
    services:
      # The same images the cheese-ci pool's resident pair run
      # (deploy/ci-runner/resident-services.sh), on the same host ports, so the
      # test settings need no translation between the two kinds of runner.
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.24.0-pg17@sha256:663ecc6dac5165ae2a664c7bd16fb8d8970867e89006ae4f6aa9cd26b1a2a3a4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        ports:
          - 5442:5432
        # Use tmpfs for the ephemeral integration DB to reduce observed sync I/O.
        # Bound tmpfs to 4 GiB on 16 GiB runners; sample filesystem and RAM below.
        options: >-
          ${{ matrix.layer == 'integration' && '--tmpfs /var/lib/postgresql/data:rw,size=4g' || '' }}
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 1s
          --health-timeout 5s --health-retries 60
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 1s
          --health-timeout 5s --health-retries 60
    # Each runner has its own services and xdist workers. This ceiling detects
    # hangs; the artifact timings measure whether the feedback budget is met.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      # Hosted matrix runners have isolated service containers. Keep the slot
      # namespace for reproductions on a machine shared by multiple test runs.
      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          # Redis keys are scoped by user id and user ids restart from 1 in every
          # database, so two runs must not share an index: each slot takes its
          # own block of 16, and the resident Valkey has room for both.
          echo "CHEESE_CI_REDIS_BASE_DB=$((slot * 16))" >> "$GITHUB_ENV"
          # `-n auto` is the whole machine; two slots of it is twice the cores.
          # A machine with one slot sets nothing and keeps `auto`.
          echo "CHEESE_CI_TEST_WORKERS=${CHEESE_CI_TEST_WORKERS:-auto}" >> "$GITHUB_ENV"
          # The database `alembic upgrade head` is proved against below. Its own
          # per slot: two runs migrating one database race on its version table.
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "TEST_PG_BASE=$root" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$root/cheese_test_$slot" >> "$GITHUB_ENV"

      # The .deb files of the tools below, saved on main by warm-caches.yml
      # (its harness-bins job, on the same arm64 image) and read here only:
      # with them ensure-apt.sh installs with dpkg and opens no apt, which on a
      # fresh hosted VM is an `apt-get update` every job. A miss is apt as before.
      - name: Name the cached tool packages
        id: apt-debs
        run: echo "key=apt-debs-v1-${ImageOS:-self}-${ImageVersion:-0}-$(uname -m)-bubblewrap-iproute2-iptables-lsof-ripgrep-tmux-zsh" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/cheese-apt-debs
          key: ${{ steps.apt-debs.outputs.key }}

      - name: Ensure required test tools
        run: |
          export CHEESE_APT_DEBS="$HOME/.cache/cheese-apt-debs"
          # bubblewrap: a Cloud session's executor runs in its sandbox, whose
          # network the machine connects with iproute2 and iptables as root.
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh bubblewrap iproute2 iptables lsof ripgrep tmux zsh
          # The hosted runner is a throwaway VM with passwordless sudo, so the
          # tests that start a sandbox may change its iptables rules, cgroups
          # and project quotas the way a Cloud machine's are
          # (tests/unit/test_sandbox_network.py), on a disk like a host's.
          echo "CHEESE_TEST_SANDBOX_HOST=1" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE"/.github/scripts/sandbox-disk.sh
          # Tests that launch a room's session, or sandbox an executor, need
          # its namespace.
          "$GITHUB_WORKSPACE"/.github/scripts/allow-user-namespaces.sh

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          # Keep downloaded wheels; uv cache prune --ci would remove them before upload.
          prune-cache: false
          # Restore only: warm-caches.yml saves this key on main.
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # The resident Postgres outlives the job, and a service container used to
      # bring this database into being by being new. Empty every run on purpose:
      # what the step below proves is that the migrations apply from nothing.
      - name: Give this run an empty database
        if: matrix.layer != 'pure'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"cheese_test_$CHEESE_CI_SLOT\" WITH (FORCE)"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"cheese_test_$CHEESE_CI_SLOT\""

      # DATABASE_URL comes from the slot step above.
      - name: Run database migrations
        if: matrix.layer != 'pure'
        run: uv run alembic upgrade head

      # tests/pinned_claude.py: every command an executor runs goes through the
      # pinned build's `mcp serve`, so the remote-execution tests need the
      # binary itself. The pool has it preinstalled; a hosted runner does not.
      #
      # The contract layer runs none of them: its harness cases feed recorded
      # provider records through each harness's own Assembler
      # (tests/contract/test_harness_contract.py), and nothing under
      # tests/contract names a CHEESE_TEST_* variable. Installing anyway made
      # that layer depend on the network for nothing — run 38251886139's
      # `backend / contract` job died here on an HTTP 500 from pi's checksum
      # fetch and ran zero tests. Its own steps are `uv sync`, a database and
      # pytest; no binary of these three.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.layer != 'contract'
        with:
          node-version: 22
      # Restore only: warm-caches.yml saves this key on main.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.layer != 'contract'
        with:
          path: ~/.npm
          key: npm-harness-pins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/app/domain/agent/harness/claude_code/device_launch.py', 'backend/app/domain/agent/harness/claude_code/remote_execution/client.py', 'backend/app/domain/agent/harness/codex/**') }}
      # The unpacked tools, not the package cache. The key above never matched
      # on its own: warm-caches.yml's `backend` job saves one with x64 in it,
      # these shards are arm64, so every run of all seven unpacked both
      # packages from the registry again — 9–13s each, measured across runs
      # 38925235400 / 38925326757 / 38926053508 — and fetched pi from GitHub
      # Releases again, which is where run 38251886139 died on an HTTP 500.
      #
      # Restore only, like the key above: warm-caches.yml's `harness-bins` job
      # saves this one on main, on arm64 for the same reason these shards are.
      # The path is absolute under $HOME because the run that saves it and the
      # run that restores it are different machines.
      #
      # Launcher code changes do not change the verified vendor builds.
      # Key by versions so a refactor does not force every shard back upstream.
      - name: Resolve pinned harness versions
        id: harness-pins
        if: matrix.layer != 'contract'
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX, PI
          pins = written()
          print("key=" + "-".join(pins[name].pinned_version for name in (CLAUDE_CODE, CODEX, PI)))
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: harness-bins
        if: matrix.layer != 'contract'
        with:
          path: ~/.cache/cheese-harness-bins
          key: harness-bins-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.harness-pins.outputs.key }}
      - name: Install pinned harness binaries
        if: matrix.layer != 'contract' && steps.harness-bins.outputs.cache-hit != 'true'
        run: |
          bins="$HOME/.cache/cheese-harness-bins"
          mkdir -p "$bins"
          packages="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX
          pins = {name: declaration.pinned_version for name, declaration in written().items()}
          print(f"@anthropic-ai/claude-code@{pins[CLAUDE_CODE]} @openai/codex@{pins[CODEX]}")
          PY
          )"
          # Package names and versions come only from checked-in declarations.
          read -r -a pinned_packages <<< "$packages"
          npm install --prefix "$bins/harness-tools" --no-audit --no-fund "${pinned_packages[@]}"
          # pi is not an npm package here: the build a room runs is the
          # vendor's compiled release, fetched and checked by the same code the
          # platform serves it with (`app.domain.machine.pi_dist`).
          case "$(uname -m)" in
            x86_64) pi_platform=linux-x64 ;;
            aarch64 | arm64) pi_platform=linux-arm64 ;;
          esac
          archive="$(uv run python - "$RUNNER_TEMP/pi-dist" "$pi_platform" <<'PY'
          import asyncio, sys
          from pathlib import Path
          from app.domain.agent.harness import PI
          from app.domain.agent.capability.matrix import written
          from app.domain.machine import pi_dist
          version = written()[PI].pinned_version
          print(asyncio.run(pi_dist.ensure_cached(Path(sys.argv[1]), version, sys.argv[2])))
          PY
          )"
          mkdir -p "$bins/pi"
          tar -xzf "$archive" -C "$bins/pi"
      # Runs on a hit and on a miss alike, so a restored directory that is not
      # a working set of binaries fails the shard here rather than inside a
      # test. What it compares is each build's own version against the
      # declaration the key hashes; the plain `--version` calls alone would
      # pass on any build at all.
      - name: Point the tests at the pinned harness binaries
        if: matrix.layer != 'contract'
        run: |
          bins="$HOME/.cache/cheese-harness-bins"
          tools="$bins/harness-tools/node_modules/.bin"
          echo "$tools" >> "$GITHUB_PATH"
          echo "CHEESE_TEST_CLAUDE=$tools/claude" >> "$GITHUB_ENV"
          echo "CHEESE_TEST_CODEX=$tools/codex" >> "$GITHUB_ENV"
          echo "CHEESE_TEST_PI=$bins/pi/pi/pi" >> "$GITHUB_ENV"
          # The pins, from the same declarations the install step reads.
          pins="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX, PI
          every = {name: declaration.pinned_version for name, declaration in written().items()}
          print(every[CLAUDE_CODE], every[CODEX], every[PI])
          PY
          )"
          read -r claude_pin codex_pin pi_pin <<< "$pins"
          for want in "claude $claude_pin" "codex $codex_pin" "pi $pi_pin"; do
            read -r which expected <<< "$want"
            case "$which" in
              claude) built="$("$tools/claude" --version)" ;;
              codex) built="$("$tools/codex" --version)" ;;
              pi) built="$("$bins/pi/pi/pi" --version)" ;;
            esac
            case "$built" in
              *"$expected"*) ;;
              *) echo "$which is $built, not the pinned $expected" >&2; exit 1 ;;
            esac
          done

      # tests/unit/test_preview_runtime_browser.py renders a page with jsdom to
      # check what the injected bridge's snapshot keeps and what it drops.
      # jsdom is a frontend devDependency, and a pure shard has no frontend
      # install; a skipped case fails the suite (scripts/assert_suite_ran.py),
      # so it is installed here.
      #
      # The version is the frontend lockfile's resolution for the root project,
      # not `devDependencies.jsdom` (a caret range, which floats) and not a
      # `jsdom@x` key found anywhere in the file (a transitive dependency
      # pulling another major would win). Only the root importer's own `jsdom:`
      # entry answers "what does the frontend install"; the awk below reads
      # nothing else and fails this step when it is not there.
      #
      # The unpacked tree is cached, keyed by that version: without it both
      # pure shards pulled jsdom and its dependency tree from the registry on
      # every run — the re-download warm-caches.yml's own header says the
      # harness caches exist to remove — and `~/.npm` above cannot help, since
      # warm-caches.yml seeds that key with the harness packages alone and this
      # workflow only ever restores it. Keyed by the version, so it survives
      # everything but a jsdom bump, and `id`-gated so an exact hit installs
      # nothing.
      #
      # This key warms itself rather than being saved by warm-caches.yml: the
      # first run of a PR installs and saves it, and a push to main saves one
      # every other ref can read. So it is `actions/cache@`, not the
      # `cache/restore@` the harness keys use — there is no blessed save to
      # wait for. An absolute path under $HOME, not $RUNNER_TEMP: a later run
      # has to be able to ask for the same path. `--prefer-offline` keeps the
      # restored npm cache in play when an install does run.
      - name: Name the jsdom version the frontend installs
        id: jsdom
        if: matrix.layer == 'pure'
        run: |
          awk '
            /^importers:$/ {in_imp=1; next}
            in_imp && /^  \.:$/ {in_root=1; next}
            in_imp && /^  [^ ]/ {in_root=0}
            in_root && /^      jsdom:$/ {want=1; next}
            want && /^ {8}version: / {sub(/^ {8}version: */, ""); print "version=" $0; exit}
          ' "$GITHUB_WORKSPACE/frontend/pnpm-lock.yaml" > "$RUNNER_TEMP/jsdom-version"
          test -s "$RUNNER_TEMP/jsdom-version" || {
            echo "the root importer in frontend/pnpm-lock.yaml names no jsdom version" >&2
            exit 1
          }
          cat "$RUNNER_TEMP/jsdom-version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: jsdom-cache
        if: matrix.layer == 'pure'
        with:
          path: ~/.cache/cheese-jsdom
          key: jsdom-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.jsdom.outputs.version }}
      - name: Install jsdom for the preview bridge's snapshot test
        if: matrix.layer == 'pure' && steps.jsdom-cache.outputs.cache-hit != 'true'
        run: |
          npm install --prefix "$HOME/.cache/cheese-jsdom" --no-audit --no-fund --prefer-offline \
            "jsdom@${{ steps.jsdom.outputs.version }}"
      - name: Point the snapshot test at the installed jsdom
        if: matrix.layer == 'pure'
        run: echo "CHEESE_TEST_JSDOM=$HOME/.cache/cheese-jsdom/node_modules/jsdom" >> "$GITHUB_ENV"

      - name: Verify integration PostgreSQL storage
        if: matrix.layer == 'integration'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker inspect --format '{{json .HostConfig.Tmpfs}}' "$POSTGRES_CONTAINER"
          pid=$(docker inspect --format '{{.State.Pid}}' "$POSTGRES_CONTAINER")
          data="/proc/$pid/root/var/lib/postgresql/data"
          test "$(sudo -n stat -f -c %T "$data")" = tmpfs
          read -r block_size blocks < <(sudo -n stat -f -c '%S %b' "$data")
          test "$((block_size * blocks))" = 4294967296
          echo "CHEESE_CI_POSTGRES_PID=$pid" >> "$GITHUB_ENV"

      - name: Run the selected layer partition
        timeout-minutes: ${{ matrix.timeout }}
        env:
          TEST_LAYER: ${{ matrix.layer }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/backend-results"
          # The annotation step below can only name a shard's real reason if it
          # can read the run's own output, so tee it here. pipefail keeps the
          # step's status pytest's, not tee's — a bare pipe would report success.
          set -o pipefail
          tests=tests/
          if [ "$TEST_LAYER" = pure ]; then
            export TEST_PG_BASE=postgresql+asyncpg://postgres:postgres@localhost:1
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:1/no_database_here
            # A pure case can only live under tests/unit (`_layer_of`), so the
            # workers need not import and collect the other directories to
            # deselect them; on a fresh checkout that is about half of each
            # worker's collection. The coverage-complete job still compares the
            # cases that ran against a collection of all of tests/.
            tests=tests/unit
          fi
          observe=(uv run python -m scripts.observe_ci_resources --output "$RUNNER_TEMP/backend-results/resources")
          if [ "$TEST_LAYER" = pure ]; then
            observe+=(--no-postgres)
          fi
          # Retry a failed or crashed case once. The 300 s hang timeout ends
          # its worker with os._exit; layer time ceilings only fail the case.
          # Silent worker losses tracked in #3005 have an unknown cause.
          # ci_evidence records retries and hang stacks; verification names
          # the cases that passed only on a retry without claiming a fix.
          "${observe[@]}" -- uv run python -m pytest "$tests" -m "$TEST_LAYER" -k 'not kotlin' \
            --ignore=tests/forgejo -n "$CHEESE_CI_TEST_WORKERS" \
            -p scripts.ci_shard --ci-shard "$TEST_SHARD" \
            --ci-selection-output="$RUNNER_TEMP/backend-results" \
            -p scripts.ci_evidence --ci-evidence-dir="$RUNNER_TEMP/backend-results" \
            --reruns 1 --reruns-delay 1 \
            --dist loadfile --no-loadscope-reorder --tb=short --durations=30 \
            --junitxml="$RUNNER_TEMP/backend-results/results.xml" 2>&1 \
            | tee "$RUNNER_TEMP/backend-results/pytest.log"

      # A failing shard's check run used to carry one annotation: "Process
      # completed with exit code 1." The reason is in the JUnit report pytest
      # wrote and the log nobody can read back (the App has no actions:read), so
      # restate the report — or, when collection died before it existed, the
      # captured output — as annotations that name the tests that broke.
      # failure() keeps this off the happy path; the script always exits 0, so
      # it can never be the reason the job is red.
      - name: Annotate the shard's failing cases
        if: ${{ failure() }}
        run: >-
          uv run python -m scripts.report_failed_cases
          "$RUNNER_TEMP/backend-results/results.xml"
          --log "$RUNNER_TEMP/backend-results/pytest.log"

      # A worker that ran out a case's timeout was ended with os._exit, and
      # the run's own log says only `node down`. Its hang log ends on the
      # case's `start` line followed by every thread's stack.
      - name: Name what a lost worker was running
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/backend-results/hang-*.log; do
            last="$(grep -E '^[0-9:]+ (start|end) ' "$log" | tail -1)"
            if grep -q 'Timeout (' "$log" || [[ "$last" == *" start "* ]]; then
              echo "::group::$(basename "$log"): $last"
              tail -c 20000 "$log"
              echo "::endgroup::"
            fi
          done

      # The runner's disks, when a run fails: whether anything filled up, and
      # with what. The resources/disks.log samples show the trend.
      - name: Show disk use
        if: ${{ failure() }}
        run: |
          df -h / "$RUNNER_TEMP" /tmp || true
          sudo -n du -sh "$RUNNER_TEMP"/* /tmp/pytest-of-* 2>/dev/null | sort -h | tail -15 || true

      - name: Verify the partition ran without skips
        if: ${{ !cancelled() }}
        env:
          LAYER_FLOOR: ${{ matrix.floor }}
        run: >-
          uv run python -m scripts.assert_suite_ran
          "$RUNNER_TEMP/backend-results/results.xml"
          --at-least "$LAYER_FLOOR"
          --selection-dir "$RUNNER_TEMP/backend-results"
          --reruns "$RUNNER_TEMP/backend-results/reruns.jsonl"

      - name: Preserve test results and selection
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.layer }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-results/
          if-no-files-found: error
          retention-days: 14

  # The DB-backed integration layer, over the files `integration-files` names,
  # in the partitions `integration-shards` lists. Not due when the selection is
  # empty: a matrix cannot be empty, so the job is skipped instead.
  integration:
    if: ${{ inputs.integration-files != '[]' }}
    runs-on: ${{ inputs.runner }}
    name: integration (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.integration-shards) }}
    env:
      REDIS_URL: redis://localhost:6389/0
      JWT_SECRET: test-secret
      ENVIRONMENT: test
      OPENAI_API_KEY: test-key
      ANTHROPIC_AUTH_TOKEN: test-token
    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.24.0-pg17@sha256:663ecc6dac5165ae2a664c7bd16fb8d8970867e89006ae4f6aa9cd26b1a2a3a4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        ports:
          - 5442:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=4g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 1s
          --health-timeout 5s --health-retries 60
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 1s
          --health-timeout 5s --health-retries 60
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          echo "CHEESE_CI_REDIS_BASE_DB=$((slot * 16))" >> "$GITHUB_ENV"
          echo "CHEESE_CI_TEST_WORKERS=${CHEESE_CI_TEST_WORKERS:-auto}" >> "$GITHUB_ENV"
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "TEST_PG_BASE=$root" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$root/cheese_test_$slot" >> "$GITHUB_ENV"

      # The .deb files of the tools below, saved on main by warm-caches.yml
      # (its harness-bins job, on the same arm64 image) and read here only:
      # with them ensure-apt.sh installs with dpkg and opens no apt, which on a
      # fresh hosted VM is an `apt-get update` every job. A miss is apt as before.
      - name: Name the cached tool packages
        id: apt-debs
        run: echo "key=apt-debs-v1-${ImageOS:-self}-${ImageVersion:-0}-$(uname -m)-bubblewrap-iproute2-iptables-lsof-ripgrep-tmux-zsh" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/cheese-apt-debs
          key: ${{ steps.apt-debs.outputs.key }}

      - name: Ensure required test tools
        run: |
          export CHEESE_APT_DEBS="$HOME/.cache/cheese-apt-debs"
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh bubblewrap iproute2 iptables lsof ripgrep tmux zsh
          echo "CHEESE_TEST_SANDBOX_HOST=1" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE"/.github/scripts/sandbox-disk.sh
          "$GITHUB_WORKSPACE"/.github/scripts/allow-user-namespaces.sh

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # Through the service container's own psql, as the layers above do: a
      # client installed here would be one more apt run per job.
      - name: Give this run an empty database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"cheese_test_$CHEESE_CI_SLOT\" WITH (FORCE)"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"cheese_test_$CHEESE_CI_SLOT\""

      - name: Run database migrations
        run: uv run alembic upgrade head

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-harness-pins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/app/domain/agent/harness/claude_code/device_launch.py', 'backend/app/domain/agent/harness/claude_code/remote_execution/client.py', 'backend/app/domain/agent/harness/codex/**') }}
      - name: Resolve pinned harness versions
        id: harness-pins
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX, PI
          pins = written()
          print("key=" + "-".join(pins[name].pinned_version for name in (CLAUDE_CODE, CODEX, PI)))
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: harness-bins
        with:
          path: ~/.cache/cheese-harness-bins
          key: harness-bins-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.harness-pins.outputs.key }}
      - name: Install pinned harness binaries
        if: steps.harness-bins.outputs.cache-hit != 'true'
        run: |
          bins="$HOME/.cache/cheese-harness-bins"
          mkdir -p "$bins"
          packages="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX
          pins = {name: declaration.pinned_version for name, declaration in written().items()}
          print(f"@anthropic-ai/claude-code@{pins[CLAUDE_CODE]} @openai/codex@{pins[CODEX]}")
          PY
          )"
          read -r -a pinned_packages <<< "$packages"
          npm install --prefix "$bins/harness-tools" --no-audit --no-fund "${pinned_packages[@]}"
          case "$(uname -m)" in
            x86_64) pi_platform=linux-x64 ;;
            aarch64 | arm64) pi_platform=linux-arm64 ;;
          esac
          archive="$(uv run python - "$RUNNER_TEMP/pi-dist" "$pi_platform" <<'PY'
          import asyncio, sys
          from pathlib import Path
          from app.domain.agent.harness import PI
          from app.domain.agent.capability.matrix import written
          from app.domain.machine import pi_dist
          version = written()[PI].pinned_version
          print(asyncio.run(pi_dist.ensure_cached(Path(sys.argv[1]), version, sys.argv[2])))
          PY
          )"
          mkdir -p "$bins/pi"
          tar -xzf "$archive" -C "$bins/pi"
      - name: Point the tests at the pinned harness binaries
        run: |
          bins="$HOME/.cache/cheese-harness-bins"
          tools="$bins/harness-tools/node_modules/.bin"
          echo "$tools" >> "$GITHUB_PATH"
          echo "CHEESE_TEST_CLAUDE=$tools/claude" >> "$GITHUB_ENV"
          echo "CHEESE_TEST_CODEX=$tools/codex" >> "$GITHUB_ENV"
          echo "CHEESE_TEST_PI=$bins/pi/pi/pi" >> "$GITHUB_ENV"
          pins="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX, PI
          every = {name: declaration.pinned_version for name, declaration in written().items()}
          print(every[CLAUDE_CODE], every[CODEX], every[PI])
          PY
          )"
          read -r claude_pin codex_pin pi_pin <<< "$pins"
          for want in "claude $claude_pin" "codex $codex_pin" "pi $pi_pin"; do
            read -r which expected <<< "$want"
            case "$which" in
              claude) built="$("$tools/claude" --version)" ;;
              codex) built="$("$tools/codex" --version)" ;;
              pi) built="$("$bins/pi/pi/pi" --version)" ;;
            esac
            case "$built" in
              *"$expected"*) ;;
              *) echo "$which is $built, not the pinned $expected" >&2; exit 1 ;;
            esac
          done

      - name: Verify integration PostgreSQL storage
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker inspect --format '{{json .HostConfig.Tmpfs}}' "$POSTGRES_CONTAINER"
          pid=$(docker inspect --format '{{.State.Pid}}' "$POSTGRES_CONTAINER")
          data="/proc/$pid/root/var/lib/postgresql/data"
          test "$(sudo -n stat -f -c %T "$data")" = tmpfs
          read -r block_size blocks < <(sudo -n stat -f -c '%S %b' "$data")
          test "$((block_size * blocks))" = 4294967296
          echo "CHEESE_CI_POSTGRES_PID=$pid" >> "$GITHUB_ENV"

      - name: Run the selected layer partition
        timeout-minutes: ${{ inputs.trace-coverage && 30 || 15 }}
        continue-on-error: ${{ inputs.trace-coverage }}
        env:
          TRACE: ${{ inputs.trace-coverage }}
          TEST_LAYER: integration
          INTEGRATION_FILES: ${{ inputs.integration-files }}
          TEST_SHARD: ${{ matrix.shard }}
        # A narrowed selection names its files to pytest, so collection does
        # not import the rest of the layer; the plugin filters to the same set
        # the plan was collected with either way.
        run: |
          mkdir -p "$RUNNER_TEMP/backend-results"
          set -o pipefail
          printf '%s' "$INTEGRATION_FILES" > "$RUNNER_TEMP/integration-files.json"
          mapfile -t targets < <(python3 -c 'import json,sys; f=json.load(open(sys.argv[1])); print("\n".join(["tests/"] if f == "all" else f))' "$RUNNER_TEMP/integration-files.json")
          with=(); trace=()
          if [ "$TRACE" = true ]; then
            mkdir -p "$RUNNER_TEMP/coverage"
            export COVERAGE_FILE="$RUNNER_TEMP/coverage/.coverage"
            with=(--with pytest-cov==7.0.0 --with coverage==7.10.7)
            trace=(--cov=app --cov=scripts --cov-context=test --cov-report=)
          fi
          uv run python -m scripts.observe_ci_resources --output "$RUNNER_TEMP/backend-results/resources" \
            -- uv run "${with[@]}" python -m pytest "${targets[@]}" "${trace[@]}" -m "$TEST_LAYER" -k 'not kotlin' \
            --ignore=tests/forgejo -n "$CHEESE_CI_TEST_WORKERS" \
            -p scripts.ci_shard --ci-shard "$TEST_SHARD" \
            --ci-integration-files="$RUNNER_TEMP/integration-files.json" \
            --ci-selection-output="$RUNNER_TEMP/backend-results" \
            -p scripts.ci_evidence --ci-evidence-dir="$RUNNER_TEMP/backend-results" \
            --reruns 1 --reruns-delay 1 \
            --dist loadfile --no-loadscope-reorder --tb=short --durations=30 \
            --junitxml="$RUNNER_TEMP/backend-results/results.xml" 2>&1 \
            | tee "$RUNNER_TEMP/backend-results/pytest.log" && status=0 || status=$?
          # A narrowed selection can name files that hold no integration case,
          # or leave this shard none after the split: pytest says "no tests
          # collected" (5). The plan check in CI required still holds every
          # planned case to having run.
          if [ "$status" = 5 ] && [ "$INTEGRATION_FILES" != '"all"' ]; then
            echo "No integration case of the narrowed selection landed on this shard."
            status=0
          fi
          exit "$status"

      - name: Annotate the shard's failing cases
        if: ${{ failure() }}
        run: >-
          uv run python -m scripts.report_failed_cases
          "$RUNNER_TEMP/backend-results/results.xml"
          --log "$RUNNER_TEMP/backend-results/pytest.log"

      - name: Map which test files executed each function
        if: ${{ !cancelled() && inputs.trace-coverage }}
        run: >-
          uv run --with coverage==7.10.7 python ../.github/scripts/coverage_map.py build
          "$RUNNER_TEMP/coverage/.coverage" --backend . --out "$RUNNER_TEMP/coverage/shard.json"

      - name: Preserve the shard's map
        if: ${{ !cancelled() && inputs.trace-coverage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/coverage/shard.json
          if-no-files-found: error
          retention-days: 3

      - name: Name what a lost worker was running
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/backend-results/hang-*.log; do
            last="$(grep -E '^[0-9:]+ (start|end) ' "$log" | tail -1)"
            if grep -q 'Timeout (' "$log" || [[ "$last" == *" start "* ]]; then
              echo "::group::$(basename "$log"): $last"
              tail -c 20000 "$log"
              echo "::endgroup::"
            fi
          done

      - name: Show disk use
        if: ${{ failure() }}
        run: |
          df -h / "$RUNNER_TEMP" /tmp || true
          sudo -n du -sh "$RUNNER_TEMP"/* /tmp/pytest-of-* 2>/dev/null | sort -h | tail -15 || true

      - name: Verify the partition ran without skips
        if: ${{ !cancelled() && !inputs.trace-coverage }}
        env:
          LAYER_FLOOR: ${{ inputs.integration-floor }}
          ALLOW_EMPTY: ${{ inputs.integration-files != '"all"' && '--allow-empty' || '' }}
        run: >-
          uv run python -m scripts.assert_suite_ran
          "$RUNNER_TEMP/backend-results/results.xml"
          --at-least "$LAYER_FLOOR" $ALLOW_EMPTY
          --selection-dir "$RUNNER_TEMP/backend-results"
          --reruns "$RUNNER_TEMP/backend-results/reruns.jsonl"

      - name: Preserve test results and selection
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-integration-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-results/
          if-no-files-found: error
          retention-days: 14

  test-complete:
    name: Backend coverage complete
    needs: [static, test, integration]
    if: ${{ !cancelled() && inputs.coverage-job }}
    # Seconds-long serial job: on a GitHub machine it waited 3-20 min (#4101) in the shared
    # runner queue behind the big jobs. Same-repo PRs use the
    # cheese-ci pool (docs/infrastructure.md); fork PRs, a deleted fork and every
    # other caller (deploy-prod's x86 run) stay on GitHub's machines.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","cheese-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-*
          path: ${{ runner.temp }}/backend-artifacts
      - name: Compare executed partitions with independent collection
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          EXPECT_INTEGRATION: ${{ inputs.integration-files != '[]' }}
          PLAN_ARTIFACT: backend-expected
        run: |
          python3 -m scripts.assert_shards_complete "$RUNNER_TEMP/backend-artifacts" --plan "$PLAN_ARTIFACT"
          test "$TEST_RESULT" = success
          if [ "$EXPECT_INTEGRATION" = true ]; then
            test "$INTEGRATION_RESULT" = success
          else
            test "$INTEGRATION_RESULT" = skipped
          fi
