name: Backend Test

# Every job here runs on a GitHub-hosted runner: the repository is public, so
# hosted minutes are free and unlimited. Postgres and Valkey come as service
# containers on the same images and host ports the cheese-ci pool's resident
# pair use (deploy/ci-runner/resident-services.sh), so the test settings do not
# depend on which kind of runner they land on. Only jobs that need the dev
# box's own images or a real device stay on the self-hosted pool (e2e,
# remote-execution).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/metering-proxy/**'
      - '.pre-commit-config.yaml'
      - '.github/scripts/ensure-apt.sh'
      - '.github/workflows/test.yml'
  workflow_call:
# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group (see the long comment in build.yml): every main
# push shares the one ref, so a ref-only key let a second merge cancel the
# previous commit's still-running suite and left main with no result for that
# commit. A cancelled run is not a red run — main would carry code this
# workflow never finished checking, with nothing on the commit to say so.
# Every main push runs the full suite: a squash merge lands on a main that has
# moved since the PR was tested, and two individually green PRs can be red
# together. Hosted runners make that affordable.
concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set the Cargo target directory
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/lint" >> "$GITHUB_ENV"

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          # Keep downloaded wheels; uv cache prune --ci would remove them before upload.
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # The same hooks a developer's commit runs, read from
      # .pre-commit-config.yaml. Before this, CI and the local gate were two
      # hand-maintained lists that agreed only as long as someone remembered to
      # update both. Each hook cds into backend/ on its own, so these run from
      # the workspace root rather than under this job's `defaults`.
      - name: Lint and type-check (pre-commit hooks)
        working-directory: ${{ github.workspace }}
        run: |
          uvx pre-commit run --all-files --show-diff-on-failure ruff
          uvx pre-commit run --all-files --show-diff-on-failure ruff-format
          uvx pre-commit run --all-files pyright

      - name: Independently collect every required backend case
        run: >-
          uv run python -m pytest tests/ --collect-only -q
          --ignore=tests/forgejo -k 'not kotlin'
          -p scripts.ci_shard
          --ci-selection-output="$RUNNER_TEMP/backend-expected"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-expected-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-expected/
          if-no-files-found: error
          retention-days: 14

  # The one piece of backend code that is not Python: the extension a pi room
  # gives its agent. It runs inside pi on a session machine, so the only thing
  # it may ever need is what that machine has — and this lane is held to the
  # same bar. Node strips the types itself; there is no package.json here, no
  # install step, and nothing to keep in a lockfile. A toolchain here would be
  # the first place "a session machine needs no toolchain" stopped being true.
  #
  # Node 24 rather than the 22 the frontend pins: type stripping is on by
  # default from 23.6, and the alternative is carrying an experimental flag
  # that exists only to say so.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Run the pi extension's tests
        run: node --test tests/extension/*.test.ts

  migration-heads:
    runs-on: ubuntu-latest
    # Measured median 1.8m (uv sync + a graph read, no DB); generous margin for
    # a cold uv cache without leaving a stuck run to sit for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set the Cargo target directory
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/migration-heads" >> "$GITHUB_ENV"

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          # Keep downloaded wheels; uv cache prune --ci would remove them before upload.
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      - name: Exactly one alembic head
        run: |
          uv run alembic heads
          heads="$(uv run alembic heads | grep -c '(head)')"
          if [ "$heads" != "1" ]; then
            echo "::error::alembic has $heads heads — parallel migrations forked the chain. Rechain your new migration onto the current head (or run 'uv run alembic merge heads') before merging."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.layer }} (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {layer: pure, shard: '0/1', floor: 4000, timeout: 5}
          - {layer: contract, shard: '0/1', floor: 200, timeout: 5}
          - {layer: integration, shard: '0/4', floor: 2400, timeout: 15}
          - {layer: integration, shard: '1/4', floor: 2400, timeout: 15}
          - {layer: integration, shard: '2/4', floor: 2400, timeout: 15}
          - {layer: integration, shard: '3/4', floor: 2400, timeout: 15}
          - {layer: search, shard: '0/1', floor: 4, timeout: 5}
    # Floors apply to the complete layer before sharding, not each runner.
    env:
      REDIS_URL: redis://localhost:6389/0
      JWT_SECRET: test-secret
      ENVIRONMENT: test
      # LLM tests mock the completions; the client just needs to construct
      # (the openai SDK errors without any credentials). Dummy key.
      OPENAI_API_KEY: test-key
      # The default AI pool is "available" only when its gateway credential is
      # present (AgentProfile.available = bool(auth_token)); the market test
      # asserts availability. Dummy token — no real calls are made.
      ANTHROPIC_AUTH_TOKEN: test-token
      CHEESEX_TEST_MEILISEARCH_URL: ${{ matrix.layer == 'search' && 'http://localhost:7700' || '' }}
      CHEESEX_TEST_MEILISEARCH_API_KEY: cheese-ci-search-key
    services:
      # The same images the cheese-ci pool's resident pair run
      # (deploy/ci-runner/resident-services.sh), on the same host ports, so the
      # test settings need no translation between the two kinds of runner.
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      meilisearch:
        image: ${{ matrix.layer == 'search' && 'mirror.gcr.io/getmeili/meilisearch:v1.54.0@sha256:0bf32debcbfa8ba4e418679025f4935884972171513c92f0584689ff994a61df' || '' }}
        env:
          MEILI_MASTER_KEY: cheese-ci-search-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    # Each runner has its own services and xdist workers. This ceiling detects
    # hangs; the artifact timings measure whether the feedback budget is met.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Hosted matrix runners have isolated service containers. Keep the slot
      # namespace for reproductions on a machine shared by multiple test runs.
      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          # Redis keys are scoped by user id and user ids restart from 1 in every
          # database, so two runs must not share an index: each slot takes its
          # own block of 16, and the resident Valkey has room for both.
          echo "CHEESE_CI_REDIS_BASE_DB=$((slot * 16))" >> "$GITHUB_ENV"
          # `-n auto` is the whole machine; two slots of it is twice the cores.
          # A machine with one slot sets nothing and keeps `auto`.
          echo "CHEESE_CI_TEST_WORKERS=${CHEESE_CI_TEST_WORKERS:-auto}" >> "$GITHUB_ENV"
          # The database `alembic upgrade head` is proved against below. Its own
          # per slot: two runs migrating one database race on its version table.
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "TEST_PG_BASE=$root" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$root/cheese_test_$slot" >> "$GITHUB_ENV"

      - name: Set the Cargo target directory
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/test" >> "$GITHUB_ENV"

      - name: Ensure required test tools
        run: |
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh lsof tmux zsh

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          # Keep downloaded wheels; uv cache prune --ci would remove them before upload.
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      # The resident Postgres outlives the job, and a service container used to
      # bring this database into being by being new. Empty every run on purpose:
      # what the step below proves is that the migrations apply from nothing.
      - name: Give this run an empty database
        if: matrix.layer != 'pure'
        env:
          PGPASSWORD: postgres
        run: |
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh postgresql-client
          psql -h localhost -p 5442 -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"cheese_test_$CHEESE_CI_SLOT\" WITH (FORCE)"
          psql -h localhost -p 5442 -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"cheese_test_$CHEESE_CI_SLOT\""

      # DATABASE_URL comes from the slot step above.
      - name: Run database migrations
        if: matrix.layer != 'pure'
        run: uv run alembic upgrade head

      # tests/pinned_claude.py: every command an executor runs goes through the
      # pinned build's `mcp serve`, so the remote-execution tests need the
      # binary itself. The pool has it preinstalled; a hosted runner does not.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/app/domain/agent/harness/claude_code/remote_execution/client.py
            backend/app/domain/agent/harness/codex/**
      - name: Install pinned harness binaries
        run: |
          packages="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX
          pins = {name: declaration.pinned_version for name, declaration in written().items()}
          print(f"@anthropic-ai/claude-code@{pins[CLAUDE_CODE]} @openai/codex@{pins[CODEX]}")
          PY
          )"
          # Package names and versions come only from checked-in declarations.
          read -r -a pinned_packages <<< "$packages"
          npm install --prefix "$RUNNER_TEMP/harness-tools" --no-audit --no-fund "${pinned_packages[@]}"
          tools="$RUNNER_TEMP/harness-tools/node_modules/.bin"
          echo "$tools" >> "$GITHUB_PATH"
          echo "CHEESE_TEST_CLAUDE=$tools/claude" >> "$GITHUB_ENV"
          "$tools/claude" --version
          "$tools/codex" --version

      - name: Wait for the search test service
        if: matrix.layer == 'search'
        timeout-minutes: 2
        run: curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 2 http://localhost:7700/health

      - name: Run the selected layer partition
        timeout-minutes: ${{ matrix.timeout }}
        env:
          TEST_LAYER: ${{ matrix.layer }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/backend-results"
          if [ "$TEST_LAYER" = pure ]; then
            export TEST_PG_BASE=postgresql+asyncpg://postgres:postgres@localhost:1
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:1/no_database_here
          fi
          # Real search owns a separate serial runner and index. The four cases
          # previously skipped without a service must pass there on every run.
          if [ "$TEST_LAYER" = search ]; then
            selection=(tests/integration/test_meilisearch_integration.py -m integration)
            workers=0
          else
            selection=(tests/ -m "$TEST_LAYER" -k 'not kotlin and not meilisearch_integration')
            workers="$CHEESE_CI_TEST_WORKERS"
          fi
          uv run python -m pytest "${selection[@]}" --ignore=tests/forgejo -n "$workers" \
            -p scripts.ci_shard --ci-shard "$TEST_SHARD" \
            --ci-selection-output="$RUNNER_TEMP/backend-results" \
            --dist worksteal --tb=short --durations=30 \
            --junitxml="$RUNNER_TEMP/backend-results/results.xml"

      - name: Verify the partition ran without skips
        if: ${{ !cancelled() }}
        env:
          LAYER_FLOOR: ${{ matrix.floor }}
        run: >-
          uv run python -m scripts.assert_suite_ran
          "$RUNNER_TEMP/backend-results/results.xml"
          --at-least "$LAYER_FLOOR"
          --selection-dir "$RUNNER_TEMP/backend-results"

      - name: Preserve test results and selection
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.layer }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-results/
          if-no-files-found: error
          retention-days: 14

  test-complete:
    name: Backend coverage complete
    needs: [lint, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-*
          path: ${{ runner.temp }}/backend-artifacts
      - name: Compare executed partitions with independent collection
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PLAN_ARTIFACT: backend-expected
        run: |
          python3 -m scripts.assert_shards_complete "$RUNNER_TEMP/backend-artifacts" --plan "$PLAN_ARTIFACT"
          test "$TEST_RESULT" = success
