name: Backend Test

# Every job below runs on a self-hosted runner (the cheese-ci pool), not a
# GitHub-hosted one: this is a private repo, so hosted minutes are billed
# per-minute, and the org's Actions billing lapsed on 2026-08-13 — every
# ubuntu-latest job is now refused before it starts ("recent account payments
# have failed"). The heavy jobs (test, migration-heads) needed the pool anyway
# for service containers and native amd64 Docker; the cheap coordinator jobs
# (scope, lint) followed so the whole workflow stops depending on hosted
# minutes at all.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to. Jobs that DO need more (the
# `scope` gh-api jobs) declare it at job level, which overrides this.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# Superseded runs must not occupy the finite self-hosted capacity (three
# cheese-ci slots, one per pool machine), so they are cancelled rather than
# left to queue ahead of the commit that replaced them.
#
# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group, for exactly the reason build.yml already is (see
# the long comment there): every main push shares the one ref, so a ref-only
# key let a second merge cancel the previous commit's still-running suite and
# left main with no result for that commit. That is worse here than it is for a
# build, because a cancelled run is not a red run — main can end up carrying
# code this workflow never finished checking with nothing on the commit to say
# so. It is also precisely the wrong run to cancel: the scope job below already
# skips main pushes whose tree passed on the PR, so anything that reaches these
# jobs is a commit CI has NOT seen. PR refs keep the ref key, so repeated pushes
# to one PR still supersede each other the way they always did.
concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A squash merge produces a new main commit whose tree was already checked on
  # the PR. On the box's only runner, repeating the same five-minute suite delays
  # image publishing and deploy without testing new code. Direct pushes to main
  # have no merged PR association and therefore still run the full gate.
  scope:
    # On the cheese-ci pool, not a hosted runner: the org's Actions billing
    # lapsed on 2026-08-13, so every ubuntu-latest job is refused before it
    # starts. This job is only `gh api` calls, so its sole cost on the pool is
    # the ~1.3m it can queue behind other pool work — an owner-accepted trade
    # (not depending on billing beats shaving the critical path). The pool has
    # no `gh`, so a step below installs it into a per-machine dir.
    runs-on: [self-hosted, cheese-ci]
    # Measured median 0.2m (a couple of gh api calls); wide margin still small
    # next to the jobs it gates.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      # The cheese-ci pool machines don't ship `gh` (hosted runners do).
      # Install it once per machine into a dir that survives actions/checkout's
      # workspace reset, then prepend it to PATH — the same persistence trick
      # the heavy jobs use for their Cargo cache. No checkout runs here, so this
      # step runs from the workspace root, not the `backend` default (which does
      # not exist without a checkout).
      - name: Ensure gh CLI
        working-directory: ${{ github.workspace }}
        run: |
          gh_dir="$(dirname "$RUNNER_TEMP")/gh-cli"
          if [ ! -x "$gh_dir/bin/gh" ]; then
            gh_version=2.63.2
            mkdir -p "$gh_dir"
            curl -sSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" \
              | tar -xz -C "$gh_dir" --strip-components=1
          fi
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Decide whether this commit already passed PR CI
        id: decide
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: test.yml
        run: |
          run_heavy=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if pr_head="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA) | .head.sha')"; then
              if [ -n "$pr_head" ] && passed="$(gh api --method GET \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
                -f head_sha="$pr_head" -f event=pull_request -f status=success \
                --jq '.workflow_runs | length')"; then
                if [ "$passed" -gt 0 ]; then
                  run_heavy=false
                  echo "::notice::Exact squash-merge tree already passed this PR workflow; skipping duplicate main suite"
                fi
              fi
            else
              echo "::warning::Could not inspect associated PRs; running the suite (safe fallback)"
            fi
          fi
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  # Alembic must always have exactly ONE head. Parallel migrations (采纳 pushes,
  # upstream syncs) landing side by side fork the chain; `alembic upgrade head`
  # then refuses, and both the test job and the deploy abort on it — this broke
  # the dev deploy four times on 2026-08-09/10 alone. Deliberately NOT behind
  # the scope gate: squash-merge skipping is exactly how the fork slipped past
  # CI before, so this must run on every push and PR. ~seconds with a warm uv
  # cache; reads the migration graph only, no database needed.
  migration-heads:
    runs-on: [self-hosted, cheese-ci]
    # Measured median 1.8m (uv sync + a graph read, no DB); generous margin for
    # a cold uv cache without leaving a stuck run to sit for hours.
    timeout-minutes: 10
    # `uv sync` builds backend/srp_rs (a Rust/pyo3 extension) via maturin/cargo.
    # actions/checkout resets the workspace before every run, wiping any
    # in-tree target/ dir, so without this the crate fully recompiles every
    # time (measured 41-44s). runner.temp/.. is a sibling of the per-run temp
    # dir and of this repo's checkout dir inside the runner's _work root, so
    # (like microcloud-smoke.yml's state dir) it survives the checkout reset —
    # already proven on this same box. It's also outside Docker's storage
    # entirely, so `docker image/builder prune` in deploy-docker.sh (which only
    # ever touches Docker's own image/build-cache store) cannot sweep it.
    #
    # Keyed per job name (migration-heads/test/e2e each get their own
    # subdirectory) rather than one shared dir: any two of them can land on the
    # same pool machine and, across successive runs, share its disk — and
    # Cargo's own target-dir lock would then serialize them (best case) or
    # corrupt a partial build (worst case, e.g. a crash mid-write). Separate
    # directories make that scenario impossible outright — there is nothing to
    # lock over. The cost is that each job's cache warms up independently
    # (three cold builds the first time, ~1-2GB combined thereafter for this
    # small crate) instead of one job ever reusing another's freshly-built
    # cache — but the two jobs already never shared a cache before this
    # change, so no existing benefit is lost, and each job still gets full
    # warm-cache savings on every run after its own first one.
    #
    # Now that the pool has three machines, these paths live on each machine's
    # own local disk, so every machine cold-starts its own copy of each job's
    # cache once and stays warm from then on — no cross-machine contention,
    # because the caches were never a shared filesystem to begin with. The one
    # scenario this does NOT cover is two instances of the *same* job (e.g. two
    # `test` runs) executing concurrently on the *same* machine — that needs
    # multiple runner processes against one disk, and provision.sh registers
    # exactly one slot per machine; flagging it rather than assuming it away.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/migration-heads" >> "$GITHUB_ENV"

      # Persistent venv, same reasoning as the Cargo dir above (and same
      # per-job keying): checkout wipes an in-workspace .venv every run.
      - name: Point uv at a persistent venv
        run: echo "UV_PROJECT_ENVIRONMENT=$(dirname "$RUNNER_TEMP")/uv-venv/migration-heads" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      - name: Exactly one alembic head
        run: |
          uv run alembic heads
          heads="$(uv run alembic heads | grep -c '(head)')"
          if [ "$heads" != "1" ]; then
            echo "::error::alembic has $heads heads — parallel migrations forked the chain. Rechain your new migration onto the current head (or run 'uv run alembic merge heads') before merging."
            exit 1
          fi

  # ruff + pyright pulled OUT of the test job into their own job: the most
  # common failure class (format/lint/type) reds on its own without dragging
  # the heavier test job with it, and the test job sheds the ~25s it spent on
  # them. This ran on a hosted runner until the org's Actions billing lapsed
  # (2026-08-13); it now runs on the cheese-ci pool like the other jobs, using
  # the persistent Cargo/venv trick below instead of setup-uv's enable-cache
  # (which helps only ephemeral hosted runners — see migration-heads).
  lint:
    needs: scope
    # `always()` + `!= 'false'`, not `== 'true'`: `scope` is an OPTIMISATION —
    # it answers "did this exact commit already pass CI on its PR, so can the
    # heavy jobs be skipped?". An optimisation must not hold a veto. Written as
    # `== 'true'` it did: when `scope` failed, its output was empty, the
    # condition was false, and the heavy jobs were SKIPPED — the workflow
    # reported nothing ran and looked green-ish, having tested nothing.
    #
    # That is not hypothetical. On 2026-08-13 the org's Actions billing lapsed;
    # every ubuntu-latest job was refused before it started ("The job was not
    # started because recent account payments have failed"), 0 steps, 2 seconds.
    # `scope` was hosted at the time, so it died, and with it the self-hosted
    # `test` job on machines that were sitting idle and perfectly able to run.
    # That lapse is also why `scope` itself has since moved onto the pool — but
    # the rule below stays regardless: an optimisation must never veto the tests.
    #
    # Now: skip only on an explicit `false` from a `scope` that actually ran.
    # Any other outcome — failed, cancelled, never started — means we do not
    # know, and not knowing means run the tests.
    if: ${{ !cancelled() && needs.scope.outputs.run_heavy != 'false' }}
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Persist backend/srp_rs's Cargo build cache and the uv venv outside the
      # checkout, keyed to this job — same reasoning as migration-heads/test
      # (checkout wipes an in-workspace target/ and .venv every run). No
      # setup-uv enable-cache: it helps only ephemeral hosted runners; on a
      # persistent pool machine these dirs are the cache.
      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/lint" >> "$GITHUB_ENV"

      - name: Point uv at a persistent venv
        run: echo "UV_PROJECT_ENVIRONMENT=$(dirname "$RUNNER_TEMP")/uv-venv/lint" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      # The same hooks a developer's commit runs, read from
      # .pre-commit-config.yaml. Before this, CI and the local gate were two
      # hand-maintained lists that agreed only as long as someone remembered to
      # update both. Each hook cds into backend/ on its own, so these run from
      # the workspace root rather than under this job's `defaults`.
      - name: Lint and type-check (pre-commit hooks)
        working-directory: ${{ github.workspace }}
        run: |
          uvx pre-commit run --all-files --show-diff-on-failure ruff
          uvx pre-commit run --all-files --show-diff-on-failure ruff-format
          uvx pre-commit run --all-files pyright

  test:
    needs: scope
    # See the note on the job above: `scope` is an optimisation and must
    # not veto. Skip only on an explicit `false` from a run that happened.
    if: ${{ !cancelled() && needs.scope.outputs.run_heavy != 'false' }}
    runs-on: [self-hosted, cheese-ci]
    # Measured median 5.1m; 20m covers a cold uv/docker cache without letting
    # a wedged run sit on the box's single runner for hours.
    timeout-minutes: 20
    # Persists backend/srp_rs's Cargo build cache outside the checkout — see
    # the migration-heads job above for the full reasoning (why this path,
    # why it's immune to docker prune, and why it's job-keyed rather than
    # shared with migration-heads/e2e).
    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/test" >> "$GITHUB_ENV"

      # Same persistence trick as Cargo above, for the venv itself: checkout
      # wipes the workspace every run, so an in-workspace .venv is rebuilt from
      # scratch (~90s measured on the pool). A venv parked outside the
      # workspace makes `uv sync` a no-op re-check (~10s).
      - name: Point uv at a persistent venv
        run: echo "UV_PROJECT_ENVIRONMENT=$(dirname "$RUNNER_TEMP")/uv-venv/test" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      # The cheesex workspace/gate/upstream tests version project repos with
      # Jujutsu (jj colocate). Install the same binary the app shells out to.
      - name: Install Jujutsu (jj)
        run: |
          JJ_VERSION=v0.43.0
          # The runner's own arch, not a hardcoded one: the pool is x86_64 today,
          # and a machine of another arch joining it would fail here with a
          # rejected binary rather than anything naming the real cause.
          case "$(uname -m)" in
            x86_64)          JJ_ARCH=x86_64 ;;
            aarch64 | arm64) JJ_ARCH=aarch64 ;;
            *) echo "no jj build published for $(uname -m)" >&2; exit 1 ;;
          esac
          # Extract into a fresh runner-owned dir, not /tmp (whose sticky bit
          # makes tar fail to set perms on the archive's '.' entry).
          mkdir -p "$RUNNER_TEMP/jj-dl"
          curl -sSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-${JJ_ARCH}-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/jj-dl"
          sudo mv "$RUNNER_TEMP/jj-dl/jj" /usr/local/bin/jj
          jj --version

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
        run: uv run alembic upgrade head

      # The sandbox test runs `docker run python:3.12-slim`. On the self-hosted
      # runner that image is nobody's dependency between test runs, so the
      # deploy's `docker image prune -af` reclaims it — and the box cannot reach
      # Docker Hub to re-pull (auth.docker.io closes the connection), leaving
      # `docker run` to fail with exit 125 and the suite red for a reason that
      # has nothing to do with the change under test. Ensure it from the mirror
      # the box CAN reach, and keep the plain tag the code asks for.
      - name: Ensure the sandbox test base image
        run: |
          if ! docker image inspect python:3.12-slim >/dev/null 2>&1; then
            docker pull mirror.gcr.io/library/python:3.12-slim
            docker tag mirror.gcr.io/library/python:3.12-slim python:3.12-slim
          fi

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
          # Per-worker test DBs are provisioned over the network from this server
          # root (the conftest no longer shells out to `docker exec`).
          TEST_PG_BASE: postgresql+asyncpg://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          # LLM tests mock the completions; the client just needs to construct
          # (the openai SDK errors without any credentials). Dummy key.
          OPENAI_API_KEY: test-key
          # The default AI pool is "available" only when its gateway credential is
          # present (AgentProfile.available = bool(auth_token)); the market test
          # asserts availability. Dummy token — no real calls are made.
          ANTHROPIC_AUTH_TOKEN: test-token
        run: uv run pytest tests/ -n auto --tb=short -k "not kotlin"

      # Every run's postgres service container leaves a volume behind, and
      # nothing ever removed them: 57 had accumulated to 19GB and filled the
      # box's disk mid-run ("No space left on device" from asyncpg). Only
      # volumes no container references are touched, so a live deployment's
      # data is never in scope.
      - name: Reclaim the service containers' volumes
        if: always()
        run: |
          docker volume prune -f >/dev/null 2>&1 || true
          df -h / | tail -1
