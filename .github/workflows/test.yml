name: Backend Test

# The heavy jobs below run on the dev box's own runner, not a GitHub-hosted
# one: this is a private repo, so hosted minutes are billed per-minute, and
# these jobs need service containers plus native amd64 Docker with no
# emulation — the box already has both for free. (Hosted runners themselves
# work fine; billing was never actually exhausted long-term — see the scope
# job below, which is cheap enough to run there.)
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to. Jobs that DO need more (the
# `scope` gh-api jobs) declare it at job level, which overrides this.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# A single self-hosted runner serves this repo, so superseded runs must not
# queue behind each other (deploys share the same runner).
# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group: with a shared `github.ref` key, a second merge
# cancelled the first one's run and main was left with no result for that
# commit. build.yml already keyed on sha for main; these did not.
concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A squash merge produces a new main commit whose tree was already checked on
  # the PR. On the box's only runner, repeating the same five-minute suite delays
  # image publishing and deploy without testing new code. Direct pushes to main
  # have no merged PR association and therefore still run the full gate.
  scope:
    # Hosted, not the box: this job is nothing but `gh api` calls (no
    # checkout, no box-local network/files), and it sits in `test`'s `needs`
    # chain — on the box it queued behind whatever else the single runner was
    # doing (~1.3m measured), which is pure serial overhead on the critical
    # path. Hosted picks it up in ~2s instead.
    runs-on: ubuntu-latest
    # Measured median 0.2m (a couple of gh api calls); wide margin still small
    # next to the jobs it gates.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - name: Decide whether this commit already passed PR CI
        id: decide
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: test.yml
        run: |
          run_heavy=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if pr_head="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA) | .head.sha')"; then
              if [ -n "$pr_head" ] && passed="$(gh api --method GET \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
                -f head_sha="$pr_head" -f event=pull_request -f status=success \
                --jq '.workflow_runs | length')"; then
                if [ "$passed" -gt 0 ]; then
                  run_heavy=false
                  echo "::notice::Exact squash-merge tree already passed this PR workflow; skipping duplicate main suite"
                fi
              fi
            else
              echo "::warning::Could not inspect associated PRs; running the suite (safe fallback)"
            fi
          fi
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  # Alembic must always have exactly ONE head. Parallel migrations (采纳 pushes,
  # upstream syncs) landing side by side fork the chain; `alembic upgrade head`
  # then refuses, and both the test job and the deploy abort on it — this broke
  # the dev deploy four times on 2026-08-09/10 alone. Deliberately NOT behind
  # the scope gate: squash-merge skipping is exactly how the fork slipped past
  # CI before, so this must run on every push and PR. ~seconds with a warm uv
  # cache; reads the migration graph only, no database needed.
  migration-heads:
    runs-on: [self-hosted, cheese-ci]
    # Measured median 1.8m (uv sync + a graph read, no DB); generous margin for
    # a cold uv cache without leaving a stuck run to sit for hours.
    timeout-minutes: 10
    # `uv sync` builds backend/srp_rs (a Rust/pyo3 extension) via maturin/cargo.
    # actions/checkout resets the workspace before every run, wiping any
    # in-tree target/ dir, so without this the crate fully recompiles every
    # time (measured 41-44s). runner.temp/.. is a sibling of the per-run temp
    # dir and of this repo's checkout dir inside the runner's _work root, so
    # (like microcloud-smoke.yml's state dir) it survives the checkout reset —
    # already proven on this same box. It's also outside Docker's storage
    # entirely, so `docker image/builder prune` in deploy-docker.sh (which only
    # ever touches Docker's own image/build-cache store) cannot sweep it.
    #
    # Keyed per job name (migration-heads/test/e2e each get their own
    # subdirectory) rather than one shared dir: migration-heads and test run
    # on the same single self-hosted runner and could execute concurrently,
    # and Cargo's own target-dir lock would then serialize them (best case) or
    # corrupt a partial build (worst case, e.g. a crash mid-write). Separate
    # directories make that scenario impossible outright — there is nothing to
    # lock over. The cost is that each job's cache warms up independently
    # (three cold builds the first time, ~1-2GB combined thereafter for this
    # small crate) instead of one job ever reusing another's freshly-built
    # cache — but the two jobs already never shared a cache before this
    # change, so no existing benefit is lost, and each job still gets full
    # warm-cache savings on every run after its own first one.
    #
    # If a second self-hosted runner is added later (P3): job-name-keyed paths
    # live on that runner's own local disk, so a second machine just cold-
    # starts its own copy of each job's cache once and stays warm from then on
    # — no cross-machine contention, because the caches were never shared
    # filesystems to begin with. The one scenario this does NOT cover is two
    # instances of the *same* job (e.g. two `test` runs) landing concurrently
    # on the *same* physical runner — that would require multiple runner
    # processes registered against one disk, which isn't how this box is set
    # up today; flagging it here rather than assuming it away.
    steps:
      - uses: actions/checkout@v4

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/migration-heads" >> "$GITHUB_ENV"

      # Persistent venv, same reasoning as the Cargo dir above (and same
      # per-job keying): checkout wipes an in-workspace .venv every run.
      - name: Point uv at a persistent venv
        run: echo "UV_PROJECT_ENVIRONMENT=$(dirname "$RUNNER_TEMP")/uv-venv/migration-heads" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      - name: Exactly one alembic head
        run: |
          uv run alembic heads
          heads="$(uv run alembic heads | grep -c '(head)')"
          if [ "$heads" != "1" ]; then
            echo "::error::alembic has $heads heads — parallel migrations forked the chain. Rechain your new migration onto the current head (or run 'uv run alembic merge heads') before merging."
            exit 1
          fi

  # ruff + pyright pulled OUT of the test job onto a hosted runner: the most
  # common failure class (format/lint/type) now reds in ~2 minutes without
  # occupying a pool slot, and the pool's test job sheds the ~25s it spent on
  # them. Hosted is the right home per the CI plan's budget math (~1.2m/run);
  # enable-cache is correct HERE because hosted runners are ephemeral — the
  # same option would be a negative on the persistent pool machines.
  lint:
    needs: scope
    if: needs.scope.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run formatting check
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run pyright

  test:
    needs: scope
    if: needs.scope.outputs.run_heavy == 'true'
    runs-on: [self-hosted, cheese-ci]
    # Measured median 5.1m; 20m covers a cold uv/docker cache without letting
    # a wedged run sit on the box's single runner for hours.
    timeout-minutes: 20
    # Persists backend/srp_rs's Cargo build cache outside the checkout — see
    # the migration-heads job above for the full reasoning (why this path,
    # why it's immune to docker prune, and why it's job-keyed rather than
    # shared with migration-heads/e2e).
    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/test" >> "$GITHUB_ENV"

      # Same persistence trick as Cargo above, for the venv itself: checkout
      # wipes the workspace every run, so an in-workspace .venv is rebuilt from
      # scratch (~90s measured on the pool). A venv parked outside the
      # workspace makes `uv sync` a no-op re-check (~10s).
      - name: Point uv at a persistent venv
        run: echo "UV_PROJECT_ENVIRONMENT=$(dirname "$RUNNER_TEMP")/uv-venv/test" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      # The cheesex workspace/gate/upstream tests version project repos with
      # Jujutsu (jj colocate). Install the same binary the app shells out to.
      - name: Install Jujutsu (jj)
        run: |
          JJ_VERSION=v0.43.0
          # Extract into a fresh runner-owned dir, not /tmp (whose sticky bit
          # makes tar fail to set perms on the archive's '.' entry).
          mkdir -p "$RUNNER_TEMP/jj-dl"
          curl -sSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/jj-dl"
          sudo mv "$RUNNER_TEMP/jj-dl/jj" /usr/local/bin/jj
          jj --version

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
        run: uv run alembic upgrade head

      # The sandbox test runs `docker run python:3.12-slim`. On the self-hosted
      # runner that image is nobody's dependency between test runs, so the
      # deploy's `docker image prune -af` reclaims it — and the box cannot reach
      # Docker Hub to re-pull (auth.docker.io closes the connection), leaving
      # `docker run` to fail with exit 125 and the suite red for a reason that
      # has nothing to do with the change under test. Ensure it from the mirror
      # the box CAN reach, and keep the plain tag the code asks for.
      - name: Ensure the sandbox test base image
        run: |
          if ! docker image inspect python:3.12-slim >/dev/null 2>&1; then
            docker pull mirror.gcr.io/library/python:3.12-slim
            docker tag mirror.gcr.io/library/python:3.12-slim python:3.12-slim
          fi

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese_test
          # Per-worker test DBs are provisioned over the network from this server
          # root (the conftest no longer shells out to `docker exec`).
          TEST_PG_BASE: postgresql+asyncpg://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          # LLM tests mock the completions; the client just needs to construct
          # (the openai SDK errors without any credentials). Dummy key.
          OPENAI_API_KEY: test-key
          # The default AI pool is "available" only when its gateway credential is
          # present (AgentProfile.available = bool(auth_token)); the market test
          # asserts availability. Dummy token — no real calls are made.
          ANTHROPIC_AUTH_TOKEN: test-token
        run: uv run pytest tests/ -n auto --tb=short -k "not kotlin"

      # Every run's postgres service container leaves a volume behind, and
      # nothing ever removed them: 57 had accumulated to 19GB and filled the
      # box's disk mid-run ("No space left on device" from asyncpg). Only
      # volumes no container references are touched, so a live deployment's
      # data is never in scope.
      - name: Reclaim the service containers' volumes
        if: always()
        run: |
          docker volume prune -f >/dev/null 2>&1 || true
          df -h / | tail -1
