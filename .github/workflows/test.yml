name: Backend Test

# Every job here runs on a GitHub-hosted runner: the repository is public, so
# hosted minutes are free and unlimited. Postgres and Valkey come as service
# containers on the same images and host ports the cheese-ci pool's resident
# pair use (deploy/ci-runner/resident-services.sh), so the test settings do not
# depend on which kind of runner they land on. Only jobs that need the dev
# box's own images or a real device stay on the self-hosted pool (e2e,
# remote-execution, build).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group (see the long comment in build.yml): every main
# push shares the one ref, so a ref-only key let a second merge cancel the
# previous commit's still-running suite and left main with no result for that
# commit. A cancelled run is not a red run — main would carry code this
# workflow never finished checking, with nothing on the commit to say so.
# Every main push runs the full suite: a squash merge lands on a main that has
# moved since the PR was tested, and two individually green PRs can be red
# together. Hosted runners make that affordable.
concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Persist backend/srp_rs's Cargo build cache and the uv venv outside the
      # checkout, keyed to this job — same reasoning as migration-heads/test
      # (checkout wipes an in-workspace target/ and .venv every run). No
      # setup-uv enable-cache: it helps only ephemeral hosted runners; on a
      # persistent pool machine these dirs are the cache.
      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/lint" >> "$GITHUB_ENV"

      # The venv is built per job out of uv's cache, which is the thing worth
      # keeping between runs. uv unpacks every wheel into ~/.cache/uv once and
      # HARDLINKS out of it, so a venv built from a warm cache holds 8 MB of its
      # own and takes 0.9s to produce (measured on a CI box, 2026-09-16), and
      # that cache is already shared by every slot on the machine.
      #
      # Keeping the venv between runs instead is what cost the disk: it stops
      # sharing the moment the cache is rebuilt under it, and never repairs
      # itself. All eight venvs found on one box had a link count of 1 on every
      # file — 9.9 GB, none of it shared, against the 1.3 GB cache they were
      # supposed to be views of. The seconds this used to save are a COLD cache;
      # the cache is what makes it fast, and the cache is not in the workspace
      # checkout wipes.
      - name: Point uv at a venv built from the shared cache
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      # $RUNNER_TEMP/setup-uv-cache, setup-uv's default, dies with the job.
      # See the note in test.yml's migration-heads job.
      - name: Point uv's cache outside the per-job temp
        run: echo "UV_SHARED_CACHE=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"
          cache-local-path: ${{ env.UV_SHARED_CACHE }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      # The same hooks a developer's commit runs, read from
      # .pre-commit-config.yaml. Before this, CI and the local gate were two
      # hand-maintained lists that agreed only as long as someone remembered to
      # update both. Each hook cds into backend/ on its own, so these run from
      # the workspace root rather than under this job's `defaults`.
      - name: Lint and type-check (pre-commit hooks)
        working-directory: ${{ github.workspace }}
        run: |
          uvx pre-commit run --all-files --show-diff-on-failure ruff
          uvx pre-commit run --all-files --show-diff-on-failure ruff-format
          uvx pre-commit run --all-files pyright

  # The one piece of backend code that is not Python: the extension a pi room
  # gives its agent. It runs inside pi on a session machine, so the only thing
  # it may ever need is what that machine has — and this lane is held to the
  # same bar. Node strips the types itself; there is no package.json here, no
  # install step, and nothing to keep in a lockfile. A toolchain here would be
  # the first place "a session machine needs no toolchain" stopped being true.
  #
  # Node 24 rather than the 22 the frontend pins: type stripping is on by
  # default from 23.6, and the alternative is carrying an experimental flag
  # that exists only to say so.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Run the pi extension's tests
        run: node --test tests/extension/*.test.ts

  migration-heads:
    runs-on: ubuntu-latest
    # Measured median 1.8m (uv sync + a graph read, no DB); generous margin for
    # a cold uv cache without leaving a stuck run to sit for hours.
    timeout-minutes: 10
    # `uv sync` builds backend/srp_rs (a Rust/pyo3 extension) via maturin/cargo.
    # actions/checkout resets the workspace before every run, wiping any
    # in-tree target/ dir, so without this the crate fully recompiles every
    # time (measured 41-44s). runner.temp/.. is a sibling of the per-run temp
    # dir and of this repo's checkout dir inside the runner's _work root, so
    # (like microcloud-smoke.yml's state dir) it survives the checkout reset —
    # already proven on this same box. It's also outside Docker's storage
    # entirely, so `docker image/builder prune` in deploy-docker.sh (which only
    # ever touches Docker's own image/build-cache store) cannot sweep it.
    #
    # Keyed per job name (migration-heads/test/e2e each get their own
    # subdirectory) rather than one shared dir: any two of them can land on the
    # same pool machine and, across successive runs, share its disk — and
    # Cargo's own target-dir lock would then serialize them (best case) or
    # corrupt a partial build (worst case, e.g. a crash mid-write). Separate
    # directories make that scenario impossible outright — there is nothing to
    # lock over. The cost is that each job's cache warms up independently
    # (three cold builds the first time, ~1-2GB combined thereafter for this
    # small crate) instead of one job ever reusing another's freshly-built
    # cache — but the two jobs already never shared a cache before this
    # change, so no existing benefit is lost, and each job still gets full
    # warm-cache savings on every run after its own first one.
    #
    # Now that the pool has three machines, these paths live on each machine's
    # own local disk, so every machine cold-starts its own copy of each job's
    # cache once and stays warm from then on — no cross-machine contention,
    # because the caches were never a shared filesystem to begin with. The one
    # scenario this does NOT cover is two instances of the *same* job (e.g. two
    # `test` runs) executing concurrently on the *same* machine — that needs
    # multiple runner processes against one disk, and provision.sh registers
    # exactly one slot per machine; flagging it rather than assuming it away.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/migration-heads" >> "$GITHUB_ENV"

      # The venv is built per job out of uv's cache, which is the thing worth
      # keeping between runs. uv unpacks every wheel into ~/.cache/uv once and
      # HARDLINKS out of it, so a venv built from a warm cache holds 8 MB of its
      # own and takes 0.9s to produce (measured on a CI box, 2026-09-16), and
      # that cache is already shared by every slot on the machine.
      #
      # Keeping the venv between runs instead is what cost the disk: it stops
      # sharing the moment the cache is rebuilt under it, and never repairs
      # itself. All eight venvs found on one box had a link count of 1 on every
      # file — 9.9 GB, none of it shared, against the 1.3 GB cache they were
      # supposed to be views of. The ~93s this used to save is a COLD cache;
      # the cache is what makes it fast, and the cache is not in the workspace
      # checkout wipes.
      - name: Point uv at a venv built from the shared cache
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      # The cache the venv above is built from has to outlive the job, and it
      # did not. setup-uv exports UV_CACHE_DIR unconditionally, and with
      # `cache-local-path` empty it points at $RUNNER_TEMP/setup-uv-cache —
      # inside the per-job temp the runner wipes. So every job resolved against
      # an empty cache: 31 wheels, 356 MiB off the network, `Prepared 196
      # packages in 2m 11s` (runner-2, run 35178186973), where a warm cache
      # syncs in about a second. Setting UV_CACHE_DIR in GITHUB_ENV cannot fix
      # it — the action overwrites it — so the input is the way in.
      #
      # $HOME rather than a literal path: `cheese-ci-any` also reaches the ARM
      # runner, where the user is not `ci`. One cache per machine is deliberate;
      # uv's cache is append-only and file-locked, so both slots can share it.
      - name: Point uv's cache outside the per-job temp
        run: echo "UV_SHARED_CACHE=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"
          cache-local-path: ${{ env.UV_SHARED_CACHE }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      - name: Exactly one alembic head
        run: |
          uv run alembic heads
          heads="$(uv run alembic heads | grep -c '(head)')"
          if [ "$heads" != "1" ]; then
            echo "::error::alembic has $heads heads — parallel migrations forked the chain. Rechain your new migration onto the current head (or run 'uv run alembic merge heads') before merging."
            exit 1
          fi

  # ruff + pyright pulled OUT of the test job into their own job: the most
  # common failure class (format/lint/type) reds on its own without dragging
  # the heavier test job with it, and the test job sheds the ~25s it spent on
  # them. This ran on a hosted runner until the org's Actions billing lapsed
  # (2026-08-13); it now runs on the cheese-ci pool like the other jobs, using
  # the persistent Cargo/venv trick below instead of setup-uv's enable-cache
  # (which helps only ephemeral hosted runners — see migration-heads).
  test:
    runs-on: ubuntu-latest
    services:
      # The same images the cheese-ci pool's resident pair run
      # (deploy/ci-runner/resident-services.sh), on the same host ports, so the
      # test settings need no translation between the two kinds of runner.
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    # A hang detector, not a performance budget: a healthy run takes 13-17
    # minutes, and a run that hits this ceiling reports as a failure with no
    # test results in it at all.
    timeout-minutes: 35
    # Persists backend/srp_rs's Cargo build cache outside the checkout — see
    # the migration-heads job above for the full reasoning (why this path,
    # why it's immune to docker prune, and why it's job-keyed rather than
    # shared with migration-heads/e2e).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Postgres and Valkey are resident on the machine (deploy/ci-runner/
      # resident-services.sh), not service containers of this job. A job's own
      # containers bind host 5432/6379 and bring a 3 GB tmpfs each, so two jobs
      # on one machine collided on the port and did not fit in 8 GB of RAM —
      # which is why a pool machine could only run one job at a time.
      #
      # What keeps two concurrent runs apart is the slot, declared by the
      # machine's runner configuration. Unset is the only slot, as on a laptop.
      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          # Redis keys are scoped by user id and user ids restart from 1 in every
          # database, so two runs must not share an index: each slot takes its
          # own block of 16, and the resident Valkey has room for both.
          echo "CHEESE_CI_REDIS_BASE_DB=$((slot * 16))" >> "$GITHUB_ENV"
          # `-n auto` is the whole machine; two slots of it is twice the cores.
          # A machine with one slot sets nothing and keeps `auto`.
          echo "CHEESE_CI_TEST_WORKERS=${CHEESE_CI_TEST_WORKERS:-auto}" >> "$GITHUB_ENV"
          # The database `alembic upgrade head` is proved against below. Its own
          # per slot: two runs migrating one database race on its version table.
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "TEST_PG_BASE=$root" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$root/cheese_test_$slot" >> "$GITHUB_ENV"

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/test" >> "$GITHUB_ENV"

      - name: Ensure the worktree retirement dependency
        run: |
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh lsof

      # The venv is built per job out of uv's cache, which is the thing worth
      # keeping between runs. uv unpacks every wheel into ~/.cache/uv once and
      # HARDLINKS out of it, so a venv built from a warm cache holds 8 MB of its
      # own and takes 0.9s to produce (measured on a CI box, 2026-09-16), and
      # that cache is already shared by every slot on the machine.
      #
      # Keeping the venv between runs instead is what cost the disk: it stops
      # sharing the moment the cache is rebuilt under it, and never repairs
      # itself. All eight venvs found on one box had a link count of 1 on every
      # file — 9.9 GB, none of it shared, against the 1.3 GB cache they were
      # supposed to be views of. The seconds this used to save are a COLD cache;
      # the cache is what makes it fast, and the cache is not in the workspace
      # checkout wipes.
      - name: Point uv at a venv built from the shared cache
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      # $RUNNER_TEMP/setup-uv-cache, setup-uv's default, dies with the job.
      # See the note in test.yml's migration-heads job.
      - name: Point uv's cache outside the per-job temp
        run: echo "UV_SHARED_CACHE=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"
          cache-local-path: ${{ env.UV_SHARED_CACHE }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      # The resident Postgres outlives the job, and a service container used to
      # bring this database into being by being new. Empty every run on purpose:
      # what the step below proves is that the migrations apply from nothing.
      - name: Give this run an empty database
        env:
          PGPASSWORD: postgres
        run: |
          "$GITHUB_WORKSPACE"/.github/scripts/ensure-apt.sh postgresql-client
          psql -h localhost -p 5442 -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"cheese_test_$CHEESE_CI_SLOT\" WITH (FORCE)"
          psql -h localhost -p 5442 -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"cheese_test_$CHEESE_CI_SLOT\""

      # DATABASE_URL comes from the slot step above.
      - name: Run database migrations
        run: uv run alembic upgrade head

      # The sandbox test runs `docker run python:3.12-slim`. On the self-hosted
      # runner that image is nobody's dependency between test runs, so the
      # deploy's `docker image prune -af` reclaims it — and the box cannot reach
      # Docker Hub to re-pull (auth.docker.io closes the connection), leaving
      # `docker run` to fail with exit 125 and the suite red for a reason that
      # has nothing to do with the change under test. Ensure it from the mirror
      # the box CAN reach, and keep the plain tag the code asks for.
      - name: Ensure the sandbox test base image
        run: |
          if ! docker image inspect python:3.12-slim >/dev/null 2>&1; then
            docker pull mirror.gcr.io/library/python:3.12-slim
            docker tag mirror.gcr.io/library/python:3.12-slim python:3.12-slim
          fi

      # tests/pinned_claude.py: every command an executor runs goes through the
      # pinned build's `mcp serve`, so the remote-execution tests need the
      # binary itself. The pool has it preinstalled; a hosted runner does not.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the pinned Claude Code build
        run: |
          version="$(python3 - <<'PY'
          import ast, pathlib
          src = pathlib.Path("app/domain/agent/harness/claude_code/remote_execution/client.py").read_text()
          print(next(ast.literal_eval(n.value) for n in ast.parse(src).body
                     if isinstance(n, ast.Assign) and any(getattr(t, "id", "") == "PINNED_VERSION" for t in n.targets)))
          PY
          )"
          npm install --prefix "$RUNNER_TEMP/claude-tools" --no-audit --no-fund "@anthropic-ai/claude-code@$version"
          echo "CHEESE_TEST_CLAUDE=$RUNNER_TEMP/claude-tools/node_modules/.bin/claude" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/claude-tools/node_modules/.bin/claude" --version
      - name: Run tests
        env:
          # DATABASE_URL and TEST_PG_BASE come from the slot step above: the
          # per-worker databases are provisioned over the network from that
          # server root (the conftest no longer shells out to `docker exec`).
          REDIS_URL: redis://localhost:6389/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          # LLM tests mock the completions; the client just needs to construct
          # (the openai SDK errors without any credentials). Dummy key.
          OPENAI_API_KEY: test-key
          # The default AI pool is "available" only when its gateway credential is
          # present (AgentProfile.available = bool(auth_token)); the market test
          # asserts availability. Dummy token — no real calls are made.
          ANTHROPIC_AUTH_TOKEN: test-token
        # `worksteal` rather than the default `load` scheduler: `load` hands a
        # worker its next batch and cannot take it back, so when the run winds
        # down one worker ends up holding several slow tests and chews them
        # serially while the rest idle. That tail is measurable — a single
        # 72-test chunk has taken over five minutes on a run that passed — and
        # it is what puts a ~14-minute suite within reach of the 20-minute
        # ceiling below. `worksteal` lets an idle worker take work back off a
        # busy one, which is exactly that failure and no other.
        #
        # `--durations` because nobody can currently say WHICH tests make this
        # suite slow: the log is progress dots, and a dot costs the same
        # whether it took 3ms or 40s. This prints the twenty worst on every
        # run, so the question stops being re-asked from zero.
        run: >-
          uv run pytest tests/ -n "$CHEESE_CI_TEST_WORKERS" --dist worksteal
          --tb=short -k "not kotlin" --durations=20

      # Volumes nothing references still accumulate here — 57 of them reached
      # 19GB once and filled the disk mid-run ("No space left on device" from
      # asyncpg). They used to come from this job's own postgres container,
      # which no longer exists; what is left over now is whatever a killed job
      # or a pulled image dropped. Only volumes no container references are
      # touched, so neither the machine's resident pair nor a live deployment
      # is ever in scope.
      - name: Reclaim volumes nothing references
        if: always()
        run: |
          docker volume prune -f >/dev/null 2>&1 || true
          df -h / | tail -1
