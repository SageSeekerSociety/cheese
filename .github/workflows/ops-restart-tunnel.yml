name: Ops — restart the public tunnel

# okcheese.com reaches the dev box through a Cloudflare Tunnel: a `cloudflared`
# connector on the box holds outbound connections to Cloudflare's edge and
# forwards to http://localhost:8080, which is the frontend container
# (docker-compose.base.yml publishes 0.0.0.0:8080 -> :80). That connector is
# HOST-level and predates the deploy scripts, so nothing else in this repo knows
# it exists — `deploy-docker.sh` can rebuild every container without touching it.
#
# When the box's egress to *.argotunnels.com breaks, the connector drops and the
# edge answers HTTP 530 / "error code: 1033" for every request. Fixing the
# network is not enough: the connector can stay wedged in backoff afterwards, and
# it has to be restarted by hand.
#
# 2026-08-25 is why this file exists. Campus network blocked the connector's
# egress; the route was fixed upstream at ~04:00 CST but the tunnel had been down
# since 04:29 UTC+8 and okcheese.com stayed at 1033 for hours. Nobody could
# restart it: the box has no public inbound, the ghg VPN goes through
# 183.174.60.119, and that host was itself unreachable from outside at the time.
# The self-hosted runner was the only way in — so it is now a documented one.
#
# Deliberately unparameterized, same rule as box-diag.yml: it restarts one named
# service and nothing else. It must never grow an input.

on:
  workflow_dispatch: {}
  # TEMPORARY, removed before this branch merges: okcheese.com is down right now
  # and workflow_dispatch only exists once the file is on the default branch.
  push:
    branches: [ops/restart-okcheese-tunnel]

permissions:
  contents: read

concurrency:
  group: ops-restart-tunnel
  cancel-in-progress: false

jobs:
  restart:
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 10
    steps:
      # Printed BEFORE anything is touched, because how the connector is
      # supervised on the box is not recorded anywhere in this repo. If the
      # restart step below finds nothing it recognises, this output is what tells
      # the next person where it actually lives.
      - name: How cloudflared is running here
        run: |
          echo "--- processes ---"
          ps -eo pid,user,etime,args | grep '[c]loudflared' || echo "(none)"
          echo "--- system units ---"
          systemctl list-units --all --type=service --no-legend 2>/dev/null \
            | grep -i cloudflared || echo "(none)"
          echo "--- unit files ---"
          systemctl list-unit-files --no-legend 2>/dev/null \
            | grep -i cloudflared || echo "(none)"
          echo "--- containers ---"
          docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null \
            | grep -i cloudflared || echo "(none)"
          echo "--- can this runner sudo without a password? ---"
          sudo -n true 2>/dev/null && echo yes || echo no

      # Every branch is a restart of an EXISTING supervised service. Nothing here
      # starts a connector that was not already configured, and nothing kills a
      # bare process it cannot bring back — a wrong guess must leave the box
      # exactly as it found it and fail loudly instead.
      - name: Restart the connector
        run: |
          set -u
          how=""

          unit="$(systemctl list-unit-files --no-legend 2>/dev/null \
                  | awk '{print $1}' | grep -i '^cloudflared' | head -1)"
          if [ -n "$unit" ] && sudo -n true 2>/dev/null; then
            sudo -n systemctl restart "$unit" && how="system unit $unit"
          fi

          if [ -z "$how" ]; then
            uunit="$(systemctl --user list-unit-files --no-legend 2>/dev/null \
                     | awk '{print $1}' | grep -i '^cloudflared' | head -1)"
            if [ -n "$uunit" ]; then
              systemctl --user restart "$uunit" && how="user unit $uunit"
            fi
          fi

          if [ -z "$how" ]; then
            ctr="$(docker ps -a --format '{{.Names}}' 2>/dev/null \
                   | grep -i cloudflared | head -1)"
            if [ -n "$ctr" ]; then
              docker restart "$ctr" && how="container $ctr"
            fi
          fi

          if [ -z "$how" ]; then
            echo "::error::No supervised cloudflared found — see the step above \
          for how it is actually running, and add that shape here rather than \
          killing it by hand."
            exit 1
          fi
          echo "restarted: $how"

      # The restart succeeding says the supervisor accepted the command, not that
      # the tunnel registered. Only the edge can tell us that, so ask it: a 1033
      # is served by Cloudflare itself and still returns while the connector is
      # absent. Anything that is not 5xx means the request reached the frontend.
      - name: Confirm the edge is serving through the tunnel again
        run: |
          set -u
          for i in $(seq 1 18); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                    https://okcheese.com/ || echo 000)"
            echo "attempt $i: HTTP $code"
            case "$code" in
              2*|3*) echo "tunnel is up"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::okcheese.com still is not served through the tunnel. \
          The connector restarted, so suspect its egress to *.argotunnels.com \
          rather than the box."
          exit 1

      # A restart that does not bring the tunnel back means the box cannot reach
      # Cloudflare's edge at all, and the connector's own log is the only place
      # that says why. Gathering it here is the difference between "still down"
      # and a diagnosis — the box is not reachable any other way.
      - name: Why it did not come back
        if: failure()
        run: |
          echo "--- connector log ---"
          sudo -n journalctl -u cloudflared --since '-15 min' --no-pager 2>&1 | tail -60
          echo "--- ingress config ---"
          sudo -n cat /etc/cloudflared/config.yml 2>&1
          echo "--- does the edge resolve? ---"
          for h in region1.v2.argotunnels.com region2.v2.argotunnels.com; do
            echo "$h -> $(getent ahostsv4 "$h" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          done
          echo "--- can we open :7844 to the edge? ---"
          for ip in 198.41.192.7 198.41.200.13; do
            timeout 8 bash -c "exec 3<>/dev/tcp/$ip/7844" 2>/dev/null \
              && echo "$ip:7844 open" || echo "$ip:7844 unreachable"
          done
          echo "--- is general egress working at all? ---"
          curl -s -o /dev/null -m 10 -w 'api.cloudflare.com: %{http_code}\n' \
            https://api.cloudflare.com/client/v4/ || echo "api.cloudflare.com unreachable"

      # TEMPORARY probe, removed before this branch merges.
      - name: Probe what actually kills the handshake
        if: always()
        run: |
          echo "=== is it the SNI, like 2026-07-01 on the mac-mini? ==="
          for sni in "" h2.cftunnel.com; do
            if [ -z "$sni" ]; then args=""; label="no SNI"; else args="-servername $sni"; label="SNI $sni"; fi
            out="$(timeout 12 openssl s_client -connect 198.41.192.7:7844 $args </dev/null 2>&1 | wc -c)"
            echo "$label -> $out bytes back"
          done
          echo "=== who answers DNS here ==="
          cat /etc/resolv.conf | grep -v '^#'
          echo "=== is anything proxying on this box ==="
          ss -tlnp 2>/dev/null | grep -E ':(7890|7891|7897|9090)' || echo "(no local clash)"
          ip route get 198.41.192.7
          echo "=== can QUIC get out where http2 cannot? ==="
          echo "(second connector on the same tunnel; the running one is untouched)"
          echo "=== interior reachability from the box (we hold nictheboy's key) ==="
          KEY=~/.ssh/id_ed25519
          SSH="ssh -i $KEY -o IdentitiesOnly=yes -o ConnectTimeout=8 -o BatchMode=yes -o StrictHostKeyChecking=no"
          echo "--- known_hosts the box has reached before ---"
          awk '{print $1}' ~/.ssh/known_hosts 2>/dev/null | sort -u | head -40
          echo "--- who am i on the physical host and gateway ---"
          for h in 192.168.16.1 192.168.16.2 183.174.60.119; do
            echo -n "$h: "
            $SSH root@$h 'echo root-ok $(hostname)' 2>&1 | head -1
            echo -n "$h (nictheboy): "
            $SSH nictheboy@$h 'echo user-ok $(hostname); sudo -n true 2>/dev/null && echo +sudo || echo -sudo' 2>&1 | head -2 | tr "\n" " "; echo
          done
