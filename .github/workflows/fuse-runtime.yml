name: fuse-runtime

# The libfuse 2 runtime cheesehost places on a Linux machine
# (`scripts/build-fuse-runtime.sh`). A pull request that changes the recipe
# builds it and proves a room's executor can load it and mount through it, so
# the recipe is known to work before it merges; publishing the release that
# `agent/toolchain.py` pins is a manual dispatch from main, because a release
# is what machines download.
on:
  pull_request:
    paths:
      - scripts/build-fuse-runtime.sh
      - .github/workflows/fuse-runtime.yml
      - .github/scripts/fuse-view-smoke.py
      # The release the check job places is the one pinned there.
      - backend/app/domain/agent/toolchain.py
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The build happens inside this image and not on the runner, which the
      # recipe checks for itself: glibc symbols are versioned and a library
      # built on a newer one is refused by every older machine's loader.
      # Debian 12 is glibc 2.34, the oldest the source was verified to build
      # against, so one artifact serves Ubuntu 22.04, RHEL 9 and everything
      # after them.
      - name: Build on the baseline distribution
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            debian:bookworm@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8 \
            sh scripts/build-fuse-runtime.sh dist
      - name: Unpack
        run: |
          mkdir "$RUNNER_TEMP/placed"
          tar -xzf dist/fuse-*.tar.gz -C "$RUNNER_TEMP/placed" --strip-components=1
          cat "$RUNNER_TEMP/placed/NOTICE"
          ls "$RUNNER_TEMP/placed/licenses"
          echo "LIBRARY=$RUNNER_TEMP/placed/libfuse.so.2" >> "$GITHUB_ENV"
      - name: The library loads on the runner too, alone as it ships
        # The shipped file is alone beside its license, so a library that needs
        # something else next to it fails here rather than on a machine.
        run: |
          ldd "$LIBRARY"
          python3 -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "$LIBRARY"
      # What a room's executor does with it: `fusepy` loads this file by path
      # (`FUSE_LIBRARY_PATH`, `bootstrap.transcript_view_env`) and mounts a
      # read-only view through it. `fusermount` comes from the distribution on
      # purpose — the library falls back to `execvp("fusermount")` — and the
      # package holds no setuid binary of its own.
      - name: A read-only view mounted through the built library
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y fuse python3-pip
          pip install --quiet "$(grep -m1 '^fusepy' backend/requirements.txt 2>/dev/null || echo fusepy)"
          python3 .github/scripts/fuse-view-smoke.py "$LIBRARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuse-runtime-${{ matrix.runner }}
          path: dist/

  # What a machine does once the release is published: cheesehost places the
  # pinned artifact under the platform's runtime and the executor's bootstrap
  # finds it by path. Against the release rather than the build, because the
  # release is what every machine gets.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Place the released runtime as cheesehost does
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(sed -n 's/^FUSE_RUNTIME_REVISION = "\(.*\)"$/\1/p' \
            backend/app/domain/agent/toolchain.py)
          gh release download "fuse-runtime-v$revision" -p "*-linux-x64.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p ~/.cheese/runtime/fuse
          tar -xzf "$RUNNER_TEMP"/fuse-*-linux-x64.tar.gz \
            -C ~/.cheese/runtime/fuse --strip-components=1
      # The executor's own answer, read out of the code that ships: by
      # architecture first, because a copy built for another one will not load.
      - name: The executor finds it, and may load it
        run: |
          found=$(python3 -c "
          import runpy
          module = runpy.run_path(
              'backend/app/domain/agent/harness/claude_code/remote_execution/bootstrap.py'
          )
          print(module['placed_libfuse']() or '')
          ")
          [ -e "$found" ] || { echo "::error::the executor did not find the placed libfuse: '$found'"; exit 1; }
          python3 -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "$found"
          echo "the executor found and loaded $found"

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recipe=scripts/build-fuse-runtime.sh
          revision=$(sed -n 's/^revision="\(.*\)"$/\1/p' "$recipe")
          version=$(sed -n 's/^version=//p' "$recipe")
          gh release create "fuse-runtime-v$revision" dist/* --target "$GITHUB_SHA" \
            --title "fuse runtime $revision" \
            --notes "libfuse $version, built by \`$recipe\` against glibc on the baseline distribution it names, for cheesehost to place on Linux machines. One shared library per platform; a machine's own \`fusermount\` is used. The source is upstream's, checked against the SHA-256 in the recipe; its license text and the archive's \`NOTICE\` are inside."
