name: Fail-fast probe (temporary)

# Temporary: proves which app a check run created with the job token belongs
# to. Removed before review.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="fail-fast probe" -f head_sha="$SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=probe' -f 'output[summary]=app id probe' --jq '.app.id, .app.slug'
