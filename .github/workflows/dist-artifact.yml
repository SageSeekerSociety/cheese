# Throwaway: hand two production `frontend/dist` builds to the page-open
# measurement work on a sandbox that cannot run `vite build` itself (3 GiB
# cgroup, see the note in frontend.yml). Not a product check — this file is
# deleted before the PR that lands.
#
# It runs only when someone puts the `dist-build` label on a PR, never on every
# push: a build per PR would add CI rounds to a repo already counting them
# (rounds per PR, #1530).
#
# One run builds the base tree and the branch tree, so the pair a measurement
# compares comes from one run against two known commits — not one build now and
# another later, whose difference would be indistinguishable from the change.
name: dist-artifact
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  group: dist-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'dist-build')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # Two checkouts in one job, so each build sees its own lockfile and its
      # own sources and the pnpm store is shared between them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('head/frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Build base
        working-directory: base/frontend
        run: |
          pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"
          NODE_OPTIONS=--max-old-space-size=4096 pnpm run build
      - name: Build head
        working-directory: head/frontend
        run: |
          pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"
          NODE_OPTIONS=--max-old-space-size=4096 pnpm run build
      - name: Note which commit each dist is
        run: |
          git -C base rev-parse HEAD > base/frontend/dist/BUILD_REF.txt
          git -C base log -1 --oneline >> base/frontend/dist/BUILD_REF.txt
          git -C head rev-parse HEAD > head/frontend/dist/BUILD_REF.txt
          git -C head log -1 --oneline >> head/frontend/dist/BUILD_REF.txt
          echo "base: $(tr '\n' ' ' < base/frontend/dist/BUILD_REF.txt)"
          echo "head: $(tr '\n' ' ' < head/frontend/dist/BUILD_REF.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-base-${{ github.event.pull_request.base.sha }}
          path: base/frontend/dist
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-head-${{ github.event.pull_request.head.sha }}
          path: head/frontend/dist
          retention-days: 7
