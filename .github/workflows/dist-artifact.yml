# Throwaway: hand a production `frontend/dist` to the page-open measurement
# work on a sandbox that cannot run `vite build` itself (3 GiB cgroup, see the
# note in frontend.yml). Not a product check — it is deleted before the PR
# that lands.
#
# `build_ref` lets ONE run produce a base build and another produce a branch
# build, so both can be measured interleaved on the same machine.
name: dist-artifact
on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "git ref to check out and build"
        required: true
        default: "HEAD"
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: dist-artifact-${{ github.ref }}-${{ github.event.inputs.build_ref || github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"
        working-directory: frontend
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build
        working-directory: frontend
      - name: Note which ref this dist is
        run: |
          git rev-parse HEAD > frontend/dist/BUILD_REF.txt
          git log -1 --oneline >> frontend/dist/BUILD_REF.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ github.event.inputs.build_ref && 'ref' || 'sha' }}-${{ github.run_id }}
          path: frontend/dist
          retention-days: 7
