name: Build and Push Docker Image

# Build on isolated hosted runners so compilation cannot contend with the app
# or occupy its deployment runner. Each image keeps a separate external cache.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pin the builder used by every image and cache exporter.
  BUILDKIT_IMAGE: mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

# Keep each main commit's build: deployments consume its immutable image tags.
# Repeated manual builds of the same non-main ref can replace one another.
concurrency:
  group: ci-build-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  plan:
    # Keep planning off the shared CI pool so its workload cannot delay builds.
    # Hosted Ubuntu includes gh and buildx for the registry manifest copies.
    runs-on: ubuntu-latest
    # gh api calls + a planning script, no docker builds; still bounded well
    # under the jobs it gates.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      office_render: ${{ steps.plan.outputs.office_render }}
      browser_render: ${{ steps.plan.outputs.browser_render }}
      gateway: ${{ steps.plan.outputs.gateway }}
      metering_proxy: ${{ steps.plan.outputs.metering_proxy }}
      private_executor: ${{ steps.plan.outputs.private_executor }}
      collab: ${{ steps.plan.outputs.collab }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test image build planning
        run: bash .github/scripts/test-plan-image-builds.sh

      - name: Test the apt guard
        run: bash .github/scripts/test-ensure-apt.sh

      - name: Test the apt guard's network bounds
        run: python3 .github/scripts/test_ensure_apt.py

      - name: Test the claude reinstall guard
        run: bash .github/scripts/test-ensure-claude-cli.sh

      # NOT `github.actor` (what GitHub's own template uses) — on a `push` that
      # is the COMMIT AUTHOR, not whoever triggered the run, and the platform
      # authors accept-merge commits as the person whose work was accepted.
      # 2026-08-11, same sha 2e72632e3 twice: as `push` (actor=andylizf) the
      # push to ghcr got `403 permission_denied` and no image was produced, so
      # dev silently stayed on the previous commit; re-run via
      # `workflow_dispatch` (actor=WangChangxin0809) it succeeded. Whether an
      # image ships must not depend on who happened to author the commit.
      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Plan builds from the last complete image set
        id: plan
        run: |
          IMAGE_ROOT="${REGISTRY}/${IMAGE_NAME,,}" \
          CURRENT_SHA="$GITHUB_SHA" \
          EVENT_NAME="$GITHUB_EVENT_NAME" \
          REF_TYPE="$GITHUB_REF_TYPE" \
            bash .github/scripts/plan-image-builds.sh

      - name: Give unchanged images this commit's immutable tag
        if: >-
          steps.plan.outputs.backend == 'false' ||
          steps.plan.outputs.frontend == 'false' ||
          steps.plan.outputs.office_render == 'false' ||
          steps.plan.outputs.browser_render == 'false' ||
          steps.plan.outputs.gateway == 'false' ||
          steps.plan.outputs.metering_proxy == 'false' ||
          steps.plan.outputs.private_executor == 'false' ||
          steps.plan.outputs.collab == 'false'
        env:
          BUILD_BACKEND: ${{ steps.plan.outputs.backend }}
          BUILD_FRONTEND: ${{ steps.plan.outputs.frontend }}
          BUILD_OFFICE_RENDER: ${{ steps.plan.outputs.office_render }}
          BUILD_BROWSER_RENDER: ${{ steps.plan.outputs.browser_render }}
          BUILD_GATEWAY: ${{ steps.plan.outputs.gateway }}
          BUILD_METERING_PROXY: ${{ steps.plan.outputs.metering_proxy }}
          BUILD_PRIVATE_EXECUTOR: ${{ steps.plan.outputs.private_executor }}
          BUILD_COLLAB: ${{ steps.plan.outputs.collab }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          CURRENT_TAG: ${{ steps.plan.outputs.current_tag }}
        run: |
          set -eu
          image_root="${REGISTRY}/${IMAGE_NAME,,}"
          promote() {
            image="$1"
            source_tag="${2:-$BASE_TAG}"
            target_tag="${3:-$CURRENT_TAG}"
            attempt=1
            while [ "$attempt" -le 4 ]; do
              if docker buildx imagetools create \
                --tag "$image_root/$image:$target_tag" \
                "$image_root/$image:$source_tag"; then
                docker buildx imagetools inspect "$image_root/$image:$target_tag" >/dev/null
                echo "promoted $image:$source_tag -> $target_tag"
                return 0
              fi
              echo "promotion attempt $attempt failed for $image; retrying" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }
          # Promotion copies the baseline's tag forward, so an image added to
          # this list has nothing to copy until it has been built once.
          # plan-image-builds.sh builds an image whose job the baseline's
          # workflow lacks, and requires the tags of those listed in `images`
          # there; add the image to that list and to `image_tag` if its tag
          # differs, or the baseline lookup never asks for it.
          [ "$BUILD_BACKEND" = true ] || promote backend
          [ "$BUILD_FRONTEND" = true ] || promote frontend
          [ "$BUILD_OFFICE_RENDER" = true ] || promote office-render
          [ "$BUILD_BROWSER_RENDER" = true ] || promote browser-render
          [ "$BUILD_GATEWAY" = true ] || promote gateway
          [ "$BUILD_METERING_PROXY" = true ] || promote metering-proxy "$BASE_SHA" "$CURRENT_SHA"
          [ "$BUILD_PRIVATE_EXECUTOR" = true ] || promote private-executor
          [ "$BUILD_COLLAB" = true ] || promote collab

      - name: Remove registry credentials
        if: always()
        run: docker logout "$REGISTRY" >/dev/null 2>&1 || true

  build-gateway:
    needs: plan
    if: needs.plan.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push gateway image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        id: gateway_build
        with:
          context: ./deploy/gateway
          file: ./deploy/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=gateway
          cache-to: type=gha,version=2,scope=gateway,mode=max

  build-metering-proxy:
    needs: plan
    if: needs.plan.outputs.metering_proxy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/metering-proxy
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push metering-proxy image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        id: metering_proxy_build
        with:
          context: ./deploy/metering-proxy
          file: ./deploy/metering-proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=metering-proxy
          cache-to: type=gha,version=2,scope=metering-proxy,mode=max

  build-backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        id: backend_build
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          # Bake the commit sha so the running app can report its own version
          # (settings.app_version → /api/version → the 内测 badge).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # The connector sources live at the repo root, outside the backend
          # context; without this the image ships no cheesehost binaries and
          # one-line device enrollment 404s.
          # The sentence catalogs are the frontend's; the backend renders push
          # and desktop notices from the same files (backend/Dockerfile).
          build-contexts: |
            cli=./cli
            i18n=./frontend/src/i18n/messages
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=backend
          cache-to: type=gha,version=2,scope=backend,mode=max

  build-frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The docs changelog is built from git: every release tag and the
          # commits between them. A shallow clone has neither.
          fetch-depth: 0
          fetch-tags: true

      - name: Test frontend static-asset integrity guard
        run: sh frontend/scripts/test-check-static-assets.sh

      - name: Test where the image serves the docs (DOCS_ORIGIN)
        run: sh frontend/scripts/test-docs-mode.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The docs site ships inside this image, but its sources (docs/manual,
      # docs/site) are outside the build context (./frontend), so the docker
      # build cannot make it — it has to arrive in the context first. public/
      # is Vite's copy-verbatim directory, so landing it there is all it takes.
      # check-static-assets, which the image build and healthcheck both run,
      # fails if this step did not happen. The build also fails on a broken
      # internal link or a developer page missing its kind/summary/covers.
      # Twice, from the same sources: under /docs/ for a deployment that serves
      # them on the platform, and at the root for the docs' own host
      # (docs/site/src/where.mjs). The container serves one (frontend/nginx/docs/).
      - name: Build the docs site into the image context
        run: |
          cd docs/site
          npm ci --no-audit --no-fund
          npm run build
          DOCS_BASE= OUT=../../frontend/docs-host npm run build

      # The site serves the desktop installers itself (/downloads/desktop/):
      # GitHub release downloads are unreliable from mainland networks. Like the
      # docs above, they have to land in public/ before the docker build. The
      # updater manifest is rewritten to point at this site too. desktop.yml
      # dispatches this workflow after each publish, so the image follows it.
      - name: Put the desktop installers into the image context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=frontend/public/downloads/desktop
          mkdir -p "$out"
          gh release download desktop-latest --repo "$GITHUB_REPOSITORY" --dir "$out" \
            --pattern 'Cheese-*.dmg' --pattern 'Cheese-*.exe' --pattern 'Cheese-*.app.tar.gz' --pattern latest.json --pattern CHANGELOG.md
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-latest"
          jq --arg base "$base" '.platforms[].url |= sub("^" + $base; "https://okcheese.com/downloads/desktop")' \
            "$out/latest.json" > "$out/latest.json.new"
          mv "$out/latest.json.new" "$out/latest.json"
          if grep -q github.com "$out/latest.json"; then
            echo "::error::latest.json still points at GitHub" >&2
            exit 1
          fi
          ls -l "$out"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          # The commit the web build is made from, shown in the desktop app's
          # 关于 dialog next to the app's own version.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=frontend
          cache-to: type=gha,version=2,scope=frontend,mode=max


  build-browser-render:
    needs: plan
    if: needs.plan.outputs.browser_render == 'true'
    runs-on: ubuntu-24.04
    # Pulling Playwright's base image is most of this job; nothing compiles.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/browser-render
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push browser-render image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./deploy/browser-render
          file: ./deploy/browser-render/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=browser-render
          cache-to: type=gha,version=2,scope=browser-render,mode=max


  build-office-render:
    needs: plan
    if: needs.plan.outputs.office_render == 'true'
    runs-on: ubuntu-24.04
    # Most of this job is apt installing LibreOffice (~800MB); nothing compiles.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/office-render
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push office-render image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./deploy/office-render
          file: ./deploy/office-render/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=office-render
          cache-to: type=gha,version=2,scope=office-render,mode=max


  build-private-executor:
    needs: plan
    if: needs.plan.outputs.private_executor == 'true'
    runs-on: ubuntu-24.04
    # A slim Node base plus one npm install; nothing compiles.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/private-executor
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      # The recipe copies backend files, so its context is the repository root.
      - name: Build and push private-executor image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./backend/sandbox/Dockerfile.private
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=private-executor
          cache-to: type=gha,version=2,scope=private-executor,mode=max


  build-collab:
    needs: plan
    if: needs.plan.outputs.collab == 'true'
    runs-on: ubuntu-24.04
    # A pnpm install of the frontend's dependencies and one esbuild bundle.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/collab
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push collab image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/collab/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=collab
          cache-to: type=gha,version=2,scope=collab,mode=max
