name: Build and Push Docker Image

# The build jobs below run on the dev box's own runner, not a GitHub-hosted
# one: this is a private repo, so hosted minutes are billed per-minute, and
# these jobs need native amd64 Docker with a warm layer cache across runs — the
# box already has both for free, and a hosted runner would rebuild every layer
# from scratch every time. (The org's Actions billing lapsed on 2026-08-13, so
# even the `plan` job that used to run hosted moved onto the cheese-ci pool.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub is intermittently unreachable from the dev box. Pin BuildKit in
  # Google's public Docker Hub cache; the builder config below routes Dockerfile
  # frontend/base-image resolution through the same cache.
  BUILDKIT_IMAGE: mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

# The build jobs below stay on the dev box, whose single runner slot is also
# what deploys use, so superseded runs must not queue behind each other. (The
# heavy test/e2e jobs moved off to the cheese-ci pool; these did not — see the
# header comment on why they need the box's warm layer cache.) On main, every
# push shares one ref, so a plain ref-keyed group would let each merge cancel
# the previous commit's still-running build — GitHub cancels not just the
# in-progress run but any run still pending in the group, so even
# cancel-in-progress: false wouldn't save a pending one queued behind it.
# Keying the group by commit sha on main gives every commit its own group, so
# there is never a same-group collision to cancel in the first place. Other
# refs (tags, workflow_dispatch on non-main) keep the original ref-only
# grouping, so repeated pushes to the same tag/branch still cancel each other.
concurrency:
  group: ci-build-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  plan:
    # On the cheese-ci pool, not the dev box: gh api calls + a planning script +
    # registry-side `buildx imagetools` manifest copies — no docker builds, no
    # local layer cache, nothing box-local. It gates all three heavy build jobs,
    # so running it on the dev box meant even "does this need building?" queued
    # behind whatever else that single slot was doing (measured over 63 runs:
    # median 0.3m queue, p90 5.9m, max 16.8m). It ran on a hosted runner for
    # that reason until the org's Actions billing lapsed on 2026-08-13; the
    # cheese-ci pool is separate three-machine capacity, so it still never queues
    # behind the dev-box builds it gates (and it does not wait on them — they
    # `needs: plan`, so there is no deadlock). The pool has no `gh`, so a step
    # below installs it per-machine; docker/buildx for the imagetools promotion
    # already ship on the pool (the e2e job uses the pool's docker).
    runs-on: [self-hosted, cheese-ci]
    # gh api calls + a planning script, no docker builds; still bounded well
    # under the jobs it gates.
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
      frontend: ${{ steps.plan.outputs.frontend }}
      browser_render: ${{ steps.plan.outputs.browser_render }}
      office_render: ${{ steps.plan.outputs.office_render }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The cheese-ci pool machines don't ship `gh` (hosted runners do). Install
      # it once per machine into a dir that survives actions/checkout's workspace
      # reset, then prepend it to PATH — same trick test.yml's scope uses.
      - name: Ensure gh CLI
        run: |
          gh_dir="$(dirname "$RUNNER_TEMP")/gh-cli"
          if [ ! -x "$gh_dir/bin/gh" ]; then
            gh_version=2.63.2
            mkdir -p "$gh_dir"
            curl -sSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" \
              | tar -xz -C "$gh_dir" --strip-components=1
          fi
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Test image build planning
        run: bash .github/scripts/test-plan-image-builds.sh

      - name: Plan builds from the last successful image set
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_sha=""
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            if ! base_sha="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=${GITHUB_REF_NAME}&status=success&event=push&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty')"; then
              echo "::warning::Could not resolve the previous successful build; rebuilding every image"
              base_sha=""
            fi
          fi
          BASE_SHA="$base_sha" \
          CURRENT_SHA="$GITHUB_SHA" \
          EVENT_NAME="$GITHUB_EVENT_NAME" \
          REF_TYPE="$GITHUB_REF_TYPE" \
            bash .github/scripts/plan-image-builds.sh

      # NOT `github.actor` (what GitHub's own template uses) — on a `push` that
      # is the COMMIT AUTHOR, not whoever triggered the run, and the platform
      # authors accept-merge commits as the person whose work was accepted.
      # 2026-08-11, same sha 2e72632e3 twice: as `push` (actor=andylizf) the
      # push to ghcr got `403 permission_denied` and no image was produced, so
      # dev silently stayed on the previous commit; re-run via
      # `workflow_dispatch` (actor=WangChangxin0809) it succeeded. Whether an
      # image ships must not depend on who happened to author the commit.
      - name: Log in to Container Registry for unchanged images
        if: >-
          steps.plan.outputs.backend == 'false' ||
          steps.plan.outputs.sandbox == 'false' ||
          steps.plan.outputs.frontend == 'false' ||
          steps.plan.outputs.browser_render == 'false' ||
          steps.plan.outputs.office_render == 'false'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Give unchanged images this commit's immutable tag
        if: >-
          steps.plan.outputs.backend == 'false' ||
          steps.plan.outputs.sandbox == 'false' ||
          steps.plan.outputs.frontend == 'false' ||
          steps.plan.outputs.browser_render == 'false' ||
          steps.plan.outputs.office_render == 'false'
        env:
          BUILD_BACKEND: ${{ steps.plan.outputs.backend }}
          BUILD_SANDBOX: ${{ steps.plan.outputs.sandbox }}
          BUILD_FRONTEND: ${{ steps.plan.outputs.frontend }}
          BUILD_BROWSER_RENDER: ${{ steps.plan.outputs.browser_render }}
          BUILD_OFFICE_RENDER: ${{ steps.plan.outputs.office_render }}
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          CURRENT_TAG: ${{ steps.plan.outputs.current_tag }}
        run: |
          set -eu
          image_root="${REGISTRY}/${IMAGE_NAME,,}"
          promote() {
            image="$1"
            attempt=1
            while [ "$attempt" -le 4 ]; do
              if docker buildx imagetools create \
                --tag "$image_root/$image:$CURRENT_TAG" \
                "$image_root/$image:$BASE_TAG"; then
                docker buildx imagetools inspect "$image_root/$image:$CURRENT_TAG" >/dev/null
                echo "promoted $image:$BASE_TAG -> $CURRENT_TAG"
                return 0
              fi
              echo "promotion attempt $attempt failed for $image; retrying" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }
          # Promotion copies the PREVIOUS successful build's tag forward, so an
          # image added to this list has nothing to copy until it has been built
          # once. Adding one means also touching its build context in the same
          # commit, or this step fails on the merge that introduces it.
          [ "$BUILD_BACKEND" = true ] || promote backend
          if [ "$BUILD_SANDBOX" = false ]; then
            promote sandbox
          fi
          [ "$BUILD_FRONTEND" = true ] || promote frontend
          [ "$BUILD_BROWSER_RENDER" = true ] || promote browser-render
          [ "$BUILD_OFFICE_RENDER" = true ] || promote office-render

      - name: Remove registry credentials
        if: always()
        run: docker logout "$REGISTRY" >/dev/null 2>&1 || true

  build-backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: [self-hosted, cheese-dev]
    # No step-level profiling for this job; sized to comfortably cover a
    # cold-cache docker build+push while killing the kind of wedged run that
    # measured 681m in the wild (would otherwise pin the box's one runner for
    # half a day).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            # The runner's UDP resolver returns fake IPs; TCP reaches public DNS.
            [dns]
              nameservers = ["1.1.1.1", "1.0.0.1"]
              options = ["use-vc"]
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          # This is a persistent, single-runner box. Preserve the named
          # builder's state volume so unchanged dependency layers survive jobs.
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        id: backend_build
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          # Bake the commit sha so the running app can report its own version
          # (settings.app_version → /api/version → the 内测 badge).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # The connector sources live at the repo root, outside the backend
          # context; without this the image ships no cheesehost binaries and
          # one-line device enrollment 404s.
          build-contexts: |
            cli=./cli
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Agent sandbox: the image 芝士 turns run inside (spawned as sibling
  # containers by the backend through the host docker.sock). Built here so
  # deploy.sh can `docker pull` it — production has no repo checkout.

      # Building on the box that also SERVES dev means build layers land on the
      # deployment's own disk — at 63GB it hit 100% twice on 2026-07-25, which
      # is where the original 6GB cap came from. The disk is 252GB now, and at
      # 6GB the three images' layer caches evict each other (the cap is pruned
      # to after EVERY image), so most builds ran semi-cold — backend's rust
      # compile alone pushed a build to 32min against its 45min timeout on
      # 2026-08-10. 20GB holds all three caches warm; --min-free-space still
      # floors the disk independently. (In-use images are never touched.)
      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 20GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-sandbox:
    needs: plan
    if: needs.plan.outputs.sandbox == 'true'
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            # The runner's UDP resolver returns fake IPs; TCP reaches public DNS.
            [dns]
              nameservers = ["1.1.1.1", "1.0.0.1"]
              options = ["use-vc"]
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sandbox
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend/sandbox
          file: ./backend/sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Building on the box that also SERVES dev means build layers land on the
      # deployment's own disk — at 63GB it hit 100% twice on 2026-07-25, which
      # is where the original 6GB cap came from. The disk is 252GB now, and at
      # 6GB the three images' layer caches evict each other (the cap is pruned
      # to after EVERY image), so most builds ran semi-cold — backend's rust
      # compile alone pushed a build to 32min against its 45min timeout on
      # 2026-08-10. 20GB holds all three caches warm; --min-free-space still
      # floors the disk independently. (In-use images are never touched.)
      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 20GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test frontend static-asset integrity guard
        run: sh frontend/scripts/test-check-static-assets.sh

      # Without a node of its own, the box's own answers, and it is Debian's:
      # node 20, whose corepack is too old to load a modern pnpm and links its
      # shims into /usr/bin, which the runner user cannot write. Same pairing
      # as frontend.yml — setup-node first, corepack second — because that is
      # what puts both the node and the shims somewhere writable.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The manual ships inside this image, but its sources (docs/manual) are
      # outside the build context (./frontend), so the docker build cannot make
      # it — it has to arrive in the context first. public/ is Vite's
      # copy-verbatim directory, so landing it there is all it takes.
      # check-static-assets, which the image build and healthcheck both run,
      # fails if this step did not happen.
      - name: Build the user manual into the image context
        run: |
          cd docs/manual
          # The runner cannot install shims beside its root-owned Node binary.
          corepack pnpm@9.15.3 install --frozen-lockfile
          corepack pnpm@9.15.3 exec vitepress build .
          python3 ../../scripts/emit_llms.py ../../frontend/public/docs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            # The runner's UDP resolver returns fake IPs; TCP reaches public DNS.
            [dns]
              nameservers = ["1.1.1.1", "1.0.0.1"]
              options = ["use-vc"]
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Building on the box that also SERVES dev means build layers land on the
      # deployment's own disk — at 63GB it hit 100% twice on 2026-07-25, which
      # is where the original 6GB cap came from. The disk is 252GB now, and at
      # 6GB the three images' layer caches evict each other (the cap is pruned
      # to after EVERY image), so most builds ran semi-cold — backend's rust
      # compile alone pushed a build to 32min against its 45min timeout on
      # 2026-08-10. 20GB holds all three caches warm; --min-free-space still
      # floors the disk independently. (In-use images are never touched.)
      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 20GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1

  build-browser-render:
    needs: plan
    if: needs.plan.outputs.browser_render == 'true'
    runs-on: [self-hosted, cheese-dev]
    # Pulling Playwright's base image is most of this job; nothing compiles.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            # The runner's UDP resolver returns fake IPs; TCP reaches public DNS.
            [dns]
              nameservers = ["1.1.1.1", "1.0.0.1"]
              options = ["use-vc"]
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/browser-render
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push browser-render image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./deploy/browser-render
          file: ./deploy/browser-render/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 20GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-office-render:
    needs: plan
    if: needs.plan.outputs.office_render == 'true'
    runs-on: [self-hosted, cheese-dev]
    # Most of this job is apt installing LibreOffice (~800MB); nothing compiles.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            # The runner's UDP resolver returns fake IPs; TCP reaches public DNS.
            [dns]
              nameservers = ["1.1.1.1", "1.0.0.1"]
              options = ["use-vc"]
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/office-render
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push office-render image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./deploy/office-render
          file: ./deploy/office-render/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 20GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
