name: Build and Push Docker Image

# Runs on the dev box's own runner, not a GitHub-hosted one: hosted minutes are
# billed for this private repo and ran out mid-2026-07-26, which stopped ALL CI
# ("the job was not started because recent account payments have failed or your
# spending limit needs to be increased"). The box is Linux/x64 with Docker, so it
# satisfies everything these jobs need — service containers and native amd64
# builds — with no emulation. Move back to ubuntu-latest once billing is sorted
# if you prefer hosted isolation; nothing else in these files depends on it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub is intermittently unreachable from the dev box. Pin BuildKit in
  # Google's public Docker Hub cache; the builder config below routes Dockerfile
  # frontend/base-image resolution through the same cache.
  BUILDKIT_IMAGE: mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

# A single self-hosted runner serves this repo, so superseded runs must not
# queue behind each other (deploys share the same runner).
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          # This is a persistent, single-runner box. Preserve the named
          # builder's state volume so unchanged dependency layers survive jobs.
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        id: backend_build
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          # The connector sources live at the repo root, outside the backend
          # context; without this the image ships no cheesehost binaries and
          # one-line device enrollment 404s.
          build-contexts: |
            cli=./cli
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Agent sandbox: the image 芝士 turns run inside (spawned as sibling
  # containers by the backend through the host docker.sock). Built here so
  # deploy.sh can `docker pull` it — production has no repo checkout.

      # Building on the box that also SERVES dev means build layers land on the
      # same 63GB disk the deployment lives on — it hit 100% twice on 2026-07-25.
      # Reclaim build cache after each image (in-use images are never touched).
      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 6GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-sandbox:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sandbox
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: the tmux image is built FROM
            # the base this run pushed, and `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/sandbox
          file: ./backend/sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The deployed backend uses this derivative for every local tmux turn.
      # Build it in the SAME gated workflow from the exact base above: otherwise
      # app deploys can go green while the first real user message cannot start.
      - name: Extract tmux sandbox metadata
        id: tmux_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sandbox-tmux
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=run-${{ github.run_id }}

      - name: Resolve this run's sandbox base image
        id: sandbox_base
        run: |
          name="${IMAGE_NAME,,}"
          echo "ref=${REGISTRY}/${name}/sandbox:run-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Build and push tmux sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/sandbox
          file: ./backend/sandbox/tmux.Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.sandbox_base.outputs.ref }}
          tags: ${{ steps.tmux_meta.outputs.tags }}
          labels: ${{ steps.tmux_meta.outputs.labels }}

      # Building on the box that also SERVES dev means build layers land on the
      # same 63GB disk the deployment lives on — it hit 100% twice on 2026-07-25.
      # Reclaim build cache after each image (in-use images are never touched).
      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 6GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-frontend:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Test frontend static-asset integrity guard
        run: sh frontend/scripts/test-check-static-assets.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          keep-state: true

      - name: Retain the BuildKit image
        run: |
          docker rm -f cheese-buildkit-image-retainer >/dev/null 2>&1 || true
          docker create --name cheese-buildkit-image-retainer \
            --label com.cheese.image-retainer=buildkit \
            "$BUILDKIT_IMAGE" >/dev/null

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Building on the box that also SERVES dev means build layers land on the
      # same 63GB disk the deployment lives on — it hit 100% twice on 2026-07-25.
      # Reclaim build cache after each image (in-use images are never touched).
      - name: Reclaim build cache
        if: always()
        run: |
          docker buildx prune --builder cheese-box-builder -af \
            --max-used-space 6GB --min-free-space 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
