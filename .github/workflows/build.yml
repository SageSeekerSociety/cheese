name: Build and Push Docker Image

# Runs on the dev box's own runner, not a GitHub-hosted one: hosted minutes are
# billed for this private repo and ran out mid-2026-07-26, which stopped ALL CI
# ("the job was not started because recent account payments have failed or your
# spending limit needs to be increased"). The box is Linux/x64 with Docker, so it
# satisfies everything these jobs need — service containers and native amd64
# builds — with no emulation. Move back to ubuntu-latest once billing is sorted
# if you prefer hosted isolation; nothing else in these files depends on it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A single self-hosted runner serves this repo, so superseded runs must not
# queue behind each other (deploys share the same runner).
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        id: backend_build
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          # The connector sources live at the repo root, outside the backend
          # context; without this the image ships no cheesehost binaries and
          # one-line device enrollment 404s.
          build-contexts: |
            cli=./cli
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The image having built is not evidence the asset is IN it — a missing
      # COPY silently produced a backend whose /connector endpoints all 404'd.
      - name: Verify the image actually carries the connector binaries
        run: |
          set -eu
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "checking $tag"
          docker run --rm --entrypoint sh "$tag" -c '
            set -eu
            for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
              f="/app/connector-dist/$t/cheesehost"
              [ -s "$f" ] || { echo "MISSING $f"; exit 1; }
              echo "ok $t ($(wc -c < "$f") bytes)"
            done'

  # Agent sandbox: the image 芝士 turns run inside (spawned as sibling
  # containers by the backend through the host docker.sock). Built here so
  # deploy.sh can `docker pull` it — production has no repo checkout.

      # Building on the box that also SERVES dev means build layers land on the
      # same 63GB disk the deployment lives on — it hit 100% twice on 2026-07-25.
      # Reclaim build cache after each image (in-use images are never touched).
      - name: Reclaim build cache
        if: always()
        run: |
          docker builder prune -af --keep-storage 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-sandbox:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sandbox
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # An unambiguous handle for THIS run: the tmux image is built FROM
            # the base this run pushed, and `type=sha` is the short sha, so
            # ${{ github.sha }} would name a tag that does not exist.
            type=raw,value=run-${{ github.run_id }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/sandbox
          file: ./backend/sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Building on the box that also SERVES dev means build layers land on the
      # same 63GB disk the deployment lives on — it hit 100% twice on 2026-07-25.
      # Reclaim build cache after each image (in-use images are never touched).
      - name: Reclaim build cache
        if: always()
        run: |
          docker builder prune -af --keep-storage 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
  build-frontend:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # A stable builder name: the default is per-run, which would throw away
          # the box's layer cache between builds — the very cache that replaces
          # the removed type=gha export.
          name: cheese-box-builder

      # Retry: the box reaches ghcr through ghg's egress, which resets
      # connections often enough to have failed a build on the login step alone
      # ("read: connection reset by peer"). A hosted runner never saw this.
      - name: Log in to Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Building on the box that also SERVES dev means build layers land on the
      # same 63GB disk the deployment lives on — it hit 100% twice on 2026-07-25.
      # Reclaim build cache after each image (in-use images are never touched).
      - name: Reclaim build cache
        if: always()
        run: |
          docker builder prune -af --keep-storage 10GB >/dev/null 2>&1 || true
          df -h / | tail -1
