name: CLI Test (Go)

# `cli/` is a Go module — the cheesehost binary that build.yml bakes into the
# sandbox images — and nothing in CI has ever compiled it. `go build|go test|go
# vet|setup-go` matched zero workflows; the two apparent hits in test.yml and
# e2e.yml are comments about a Cargo cache. It even ships two test files
# (internal/terminal, internal/update) that no job ran.
#
# This is the same hole the frontend had before frontend.yml: the tooling and
# the tests existed, nothing called them. Unlike the frontend, this one starts
# clean — build, vet, and the tests all passed on the first run — so it gates at
# zero from day one with no baseline and no ratchet.
#
# On the cheese-ci pool: pure Go, but the org's Actions billing lapsed on
# 2026-08-13 (every ubuntu-latest job is refused before it starts). The pool is
# separate capacity from the dev box's single deploy slot, so this never queues
# behind a deploy; Go comes from setup-go below, and `go test -race` finds the
# gcc it needs in the pool's build-essential (installed there for srp_rs).
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR, never on main: keying push runs by sha puts
  # each merge in its own group, so a second merge cannot cancel the first one's
  # result and leave main with no signal for that commit.
  group: cli-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cli

jobs:
  go:
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The toolchain version comes from cli/go.mod, so the repo pins it rather
      # than this workflow drifting from what the module declares.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # thirdparty/crypto11 is a vendored upstream module with its own go.mod —
      # not ours to format. `./...` already excludes it (separate module); only
      # gofmt walks the filesystem and needs telling.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^thirdparty/' || true)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted" | sed 's/^/  /'
            echo "::error::gofmt -w the files above"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race because this binary's whole job is concurrent: it supervises tmux
      # sessions and multiplexes screens over a bus.
      - name: go test
        run: go test -race ./...

  # The delivery e2e (ported in spirit from micro-connector's testbed): a REAL
  # Claude Code at a pinned version, driven through the real rendezvous socket
  # and the real tmux layer, against a MockServer Anthropic emulation. It
  # asserts the one thing unit tests cannot — that a prompt handed to the
  # connector is enqueued and ACTED on (the mock's scripted tool call runs),
  # including a 30KB body. Pinned npm version so this leg only breaks when WE
  # change something; bump the pin deliberately, and expect intelligence (not
  # blockage) from it when Anthropic changes the first-run flow.
  delivery-e2e:
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # node is NOT ambient on the ci pool (first run: `npm: command not
      # found`) — it arrives via setup-node exactly as frontend.yml does.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # MUST match device_launch.CLAUDE_PINNED_VERSION: prompt delivery rides
      # the rendezvous socket, which is undocumented private surface whose
      # frames moved between 2.1.220 and 2.1.224. A CI pin below the launcher's
      # floor tests a transport production never uses (and the socket simply
      # never binds). Raising either one means raising both, in the same PR.
      #
      # NPM_CONFIG_PREFIX keeps the install inside the workspace: runners are
      # shared, and a global install would fight concurrent jobs (and
      # root-owned paths).
      - name: Install Claude Code (pinned)
        working-directory: .
        run: |
          export NPM_CONFIG_PREFIX="$GITHUB_WORKSPACE/.npm-e2e"
          npm install -g --silent @anthropic-ai/claude-code@2.1.277
          "$NPM_CONFIG_PREFIX/bin/claude" --version

      - name: Delivery e2e
        run: |
          export PATH="$GITHUB_WORKSPACE/.npm-e2e/bin:$PATH"
          go test -tags claudee2e -v -timeout 35m ./e2e/
