name: CLI Test (Go)

# `cli/` is a Go module — the cheesehost binary that build.yml bakes into the
# sandbox images — and nothing in CI has ever compiled it. `go build|go test|go
# vet|setup-go` matched zero workflows. It even ships two test files
# (internal/terminal, internal/update) that no job ran.
#
# This is the same hole the frontend had before frontend.yml: the tooling and
# the tests existed, nothing called them. Unlike the frontend, this one starts
# clean — build, vet, and the tests all passed on the first run — so it gates at
# zero from day one with no baseline and no ratchet.
#
# backend/tests/fixtures/wire is in the path filters because the Go side reads
# it: cli/internal/link/frames_test.go is held to the same committed frames the
# backend is, and a fixture edited to suit one language has to face the other in
# the same run or it is not a shared fixture.
on:
  workflow_call:
permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR, never in the merge queue: keying queue runs
  # by sha gives each queued commit its own group, so one entry cannot cancel
  # another's result and leave the commit that lands on main with no signal.
  group: cli-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cli

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The toolchain version comes from cli/go.mod, so the repo pins it rather
      # than this workflow drifting from what the module declares.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false
      # Restore only: warm-caches.yml saves this key on main.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/go.mod', 'cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      # thirdparty/crypto11 is a vendored upstream module with its own go.mod —
      # not ours to format. `./...` already excludes it (separate module); only
      # gofmt walks the filesystem and needs telling.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^thirdparty/' || true)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted" | sed 's/^/  /'
            echo "::error::gofmt -w the files above"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Windows devices run a build of the same code with its own service,
      # process and executor files; nothing else here would notice it stop
      # compiling.
      - name: go vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      # -race because this binary's whole job is concurrent: it supervises tmux
      # sessions and multiplexes screens over a bus.
      - name: go test
        run: go test -race ./...

  # The boot e2e: a REAL Claude Code at the pinned version, started headless the
  # way a room's session is, against a MockServer Anthropic emulation that
  # answers every non-model request from the metering proxy's own answer table.
  # It asserts what unit tests cannot — that a real boot asks for nothing the
  # table does not answer, and that a real request names its model inside the
  # proxy's head budget (e2e/control_table_e2e_test.go). Pinned npm version so
  # this leg only breaks when WE change something.
  boot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false
      # Restore only: warm-caches.yml saves this key on main.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/go.mod', 'cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # MUST match device_launch.CLAUDE_PINNED_VERSION: the boot this checks is
      # the one production launches. Raising either one means raising both, in
      # the same PR.
      #
      # NPM_CONFIG_PREFIX keeps the install inside the workspace rather than
      # in the root-owned global prefix.
      - name: Install Claude Code (pinned)
        working-directory: .
        run: |
          export NPM_CONFIG_PREFIX="$GITHUB_WORKSPACE/.npm-e2e"
          npm install -g --silent @anthropic-ai/claude-code@2.1.282
          "$NPM_CONFIG_PREFIX/bin/claude" --version

      # The mock API's image, fetched before the suite so a registry hiccup is
      # this step's failure and not a skipped test. Through mirror.gcr.io:
      # Docker Hub's anonymous token endpoint is what refused the canary on
      # 2026-09-17 and -18. Tagged under the name the harness runs, which then
      # resolves locally.
      - name: Pull the mock API image
        run: |
          image=mockserver/mockserver:mockserver-7.5.0
          for attempt in 1 2 3 4 5; do
            if docker pull -q "mirror.gcr.io/$image"; then
              docker tag "mirror.gcr.io/$image" "$image"
              exit 0
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "could not pull $image through the mirror" >&2
          exit 1

      - name: Boot e2e
        env:
          CHEESE_E2E_REQUIRE_DOCKER: "1"
        run: |
          export PATH="$GITHUB_WORKSPACE/.npm-e2e/bin:$PATH"
          go test -tags claudee2e -v -timeout 35m ./e2e/
