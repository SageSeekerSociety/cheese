# Is what we merged actually running?
#
# The image build happens AFTER a merge, so a failed build leaves main ahead of
# the box with nothing red on the PR to show it. That has happened twice, both
# times from the same cause — the box's egress proxy resetting a connection to
# ghcr — and both times it was found by hand, days later, while the fix everyone
# believed was live was not.
#
# Runs on the self-hosted runner to inspect the deployment and gateway locally.
#
# Detection alone proved not enough (#188): the build/deploy chain is
# edge-triggered — every push is a trigger, and a lost edge (a build cancelled
# by the next accept landing minutes later, observed 2026-08-06 and 2026-08-09)
# meant silence until a human noticed. So on drift this now CONVERGES instead of
# only alerting: re-dispatch the missing build or deploy for main's HEAD. The
# one case it deliberately does NOT retry is a FAILED build — that is real
# breakage needing eyes, and auto-retrying it would just loop; the run stays
# red and GitHub emails the repo's watchers, same as before.
#
# Which commit the deploy leg fires is not always main: a release of main
# refuses while the `-b` slots serve if main's tree no longer has the two slots,
# so re-firing it hourly would loop red with nothing changing.
# `deploy/converge-deploy-drift.sh` makes that choice and fails loudly when no
# re-dispatch can converge (#2770).
name: Deploy drift and gateway health

on:
  schedule:
    - cron: '40 * * * *'  # hourly, offset away from the other hourly jobs
  workflow_dispatch: {}

permissions:
  contents: read
  # Convergence re-dispatches build.yml / deploy-dev.yml on drift.
  actions: write

concurrency:
  group: deploy-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 5
    steps:
      # Same shared workspace as deploy-dev: a sparse checkout left by another
      # workflow on this runner keeps deploy/ off disk even though
      # actions/checkout reports green (2026-10-18 09:53). Clear it first.
      - name: Repair a sparse workspace
        run: |
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0
          git config --local --unset-all core.sparseCheckout || true
          git config --worktree --unset-all core.sparseCheckout 2>/dev/null || true
          if ! git sparse-checkout disable; then
            echo "::warning::could not disable a leftover sparse checkout; deploy scripts may be missing"
          fi
          rm -f "$(git rev-parse --git-dir)/info/sparse-checkout"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare main with what is running, converge on drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Drift is against the green anchor, not main's tip. Main moving ahead
          # of the anchor is the normal state of a batch still under test; firing
          # its commit here would deploy a batch the gate has not judged, which
          # is exactly what happened at 11:33 on 2026-10-18.
          if ! api_out="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main-green" --jq '.object.sha' 2>&1)"; then
            # 404 is the honest "no batch has passed yet"; every other answer
            # (403, 5xx, a dropped connection) means this run could not tell,
            # and calling that "no anchor" would skip the hour in silence.
            case "$api_out" in
              *404*) echo "no main-green anchor yet (no main batch has passed); nothing to converge to"; exit 0 ;;
            esac
            echo "::warning::could not read refs/heads/main-green: ${api_out:-no output}; skipping this convergence rather than guessing"
            exit 0
          fi
          anchor="$api_out"
          main_sha="${anchor:0:7}"
          # The runner IS the box, so ask docker directly rather than over ssh.
          live="$(docker ps -a --no-trunc \
            --filter 'label=com.docker.compose.project=cheese' \
            --format '{{.Label "com.docker.compose.service"}}\t{{.Image}}\t{{.State}}\t{{.Status}}' \
            || true)"
          echo "main: ${main_sha}"
          echo "${live}"
          if printf '%s\n' "$live" | bash deploy/check-app-tier.sh "$main_sha"; then
            echo "live matches main-green (${anchor})"
            exit 0
          fi

          # Drifted. Decide from the state of main HEAD's build runs which edge
          # was lost, and re-fire exactly that one. head_sha filtering needs the
          # FULL sha — a short sha silently matches nothing. `gh api --jq` keeps
          # us off system jq, which this box does not have.
          full_sha="$anchor"
          api="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${full_sha}&per_page=30"
          build_runs='.workflow_runs[] | select(.path==".github/workflows/build.yml")'
          in_flight="$(gh api "$api" --jq "[${build_runs} | select(.status==\"queued\" or .status==\"in_progress\")] | length")"
          built_ok="$(gh api "$api" --jq "[${build_runs} | select(.conclusion==\"success\")] | length")"
          built_failed="$(gh api "$api" --jq "[${build_runs} | select(.conclusion==\"failure\")] | length")"
          echo "build runs for ${main_sha}: in_flight=${in_flight} success=${built_ok} failure=${built_failed}"

          if [ "${in_flight}" -gt 0 ]; then
            echo "a build for ${main_sha} is already in flight — convergence is under way, nothing to do"
            exit 0
          fi
          if [ "${built_ok}" -gt 0 ]; then
            # Images exist; the deploy leg was the lost edge (cancelled, or the
            # box was unreachable when it ran). Re-fire deploy only — but not
            # always for main: a release of main refuses while the `-b` slots
            # serve if main's tree no longer has the slots, and re-firing that
            # hourly is a red loop that changes nothing. The script makes that
            # choice (and says so) and fails instead of re-dispatching blind.
            TARGET_SHA="$anchor" bash deploy/converge-deploy-drift.sh
            exit 0
          fi
          if [ "${built_failed}" -gt 0 ]; then
            echo "::error::build for ${main_sha} FAILED — real breakage, not auto-retrying. \
          Check: gh run list --workflow=build.yml"
            exit 1
          fi
          # No build at all, or only cancelled ones. Do not dispatch one: a
          # dispatched build builds main's tip, which is the commit this step
          # just decided is not the anchor — deploying it is the bypass this
          # check exists to stop. Say so; the anchor's own build either exists
          # or the next push rebuilds it.
          # A build of main's tip is not a build of the anchor, so dispatching
          # one here would be the bypass this step exists to stop. Say it
          # loudly instead: the anchor's images missing means either its own
          # build was cancelled, or it never ran.
          echo "::warning::the green anchor ${anchor} has no live build (none, or cancelled) and main's tip is not it, so nothing was dispatched"
          exit 0

      # A failed deployment check must not hide an independent gateway failure.
      # Credentials stay inside the container; the default probe generates no tokens.
      # Cancellation may still run this read-only check, bounded to one minute.
      - name: Gateway database and authenticated catalog are ready
        if: ${{ always() }}
        timeout-minutes: 1
        # Run inside whichever color serves, against the proxy at gateway-netns: the path callers take.
        run: |
          set -euo pipefail
          gateway="$(docker ps --format '{{.Names}}' | grep -E '^cheese-gateway-litellm-(blue|green)-1$' | head -n 1 || true)"
          if [ -z "$gateway" ] || ! docker exec -i -e GATEWAY_BASE=http://gateway-netns:4000 "$gateway" python - \
            < backend/scripts/gateway_supply_probe.py; then
            echo '::error::Gateway readiness failed. Inspect the classified probe result; use the Release gateway workflow for code or configuration recovery.'
            exit 1
          fi
