name: Box uptime check

# GitHub scheduling gaps make current health unknown. Alert on repeated
# execution failures or a started run that remains unfinished for three hours.
on:
  schedule:
    - cron: '25 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  # Reading the self-hosted runner list is an administration read, which is not
  # covered by `actions: read`.
  administration: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check monitor behavior
        # Every test beside a script in .github/scripts, not one named file:
        # the next script added there is covered without anyone remembering to
        # extend this line.
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Assess heartbeat execution and observation coverage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/box-uptime.py

  # Which CI machines are there, asked of the API rather than by running a job
  # on each. A job would need a slot per machine every hour, and would queue
  # behind a merge burst and report that as death — which is why the old check
  # asked only whether ONE machine answered, and why two of three being down on
  # 2026-09-15 looked like nothing but slow CI.
  ci-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Which machines are in the pool
        id: pool
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/ci-pool-health.py

      - name: Tell the team a CI machine is missing
        if: ${{ failure() && env.WEBHOOK != '' }}
        env:
          PROBLEMS: ${{ steps.pool.outputs.problems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          text="$(printf 'CI 机器掉了：%s\n这一轮：%s' \
            "${PROBLEMS:-见运行日志}" "$RUN_URL")"
          curl -sS -m 15 -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$text" '{msg_type:"text",content:{text:$t}}')" \
            || echo "::warning::could not reach the alert webhook"

  # Opt-in endpoint probe. With no URL configured, the job is visibly skipped.
  dev-health:
    if: ${{ vars.DEV_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe dev /api/health latency from outside the box
        env:
          HEALTH_URL: ${{ vars.DEV_HEALTH_URL }}
          MAX_MS: ${{ vars.DEV_HEALTH_MAX_MS || '5000' }}
        run: |
          set -euo pipefail

          # Two attempts so a single hosted-runner network blip does not page
          # admins; the box is only judged unhealthy if BOTH fail the bar.
          last=""
          for attempt in 1 2; do
            # -m caps the whole request, so a wedged endpoint fails HERE instead
            # of hanging the job; %{time_total} is wall-clock seconds spent.
            if out="$(curl -sS -o /dev/null -m 20 \
                -w '%{http_code} %{time_total}' "$HEALTH_URL" 2>/dev/null)"; then
              code="${out% *}"
              secs="${out#* }"
              ms="$(awk -v s="$secs" 'BEGIN{printf "%d", s*1000}')"
              echo "attempt $attempt: HTTP $code in ${ms}ms (threshold ${MAX_MS}ms)"
              if [ "$code" = "200" ] && [ "$ms" -le "$MAX_MS" ]; then
                echo "dev /api/health healthy"
                exit 0
              fi
              last="HTTP $code in ${ms}ms"
            else
              echo "attempt $attempt: request failed or timed out"
              last="request failed or timed out"
            fi
            # An `[ ... ] && sleep` one-liner returns non-zero on attempt 2 and
            # would abort the step under `set -e` before the error below.
            if [ "$attempt" -eq 1 ]; then
              sleep 10
            fi
          done

          echo "::error::dev /api/health is slow or unreachable ($last, threshold ${MAX_MS}ms) — the box may be browning out (see #356: a migration lock wait starved it for ~70 min while the runner still looked alive)"
          exit 1
