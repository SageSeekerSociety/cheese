name: Box uptime check

# The CHECK half of box monitoring (probe half: box-heartbeat.yml). Runs on a
# GitHub-HOSTED runner (so it still works when a box is down) and fails — which
# emails repo admins — when the heartbeat stops landing or when a box stops
# completing its liveness job. Uses only `actions: read`, which GITHUB_TOKEN CAN
# hold; the original design polled the runners API and 403'd on every run since
# birth (administration is not a grantable workflow permission).
#
# WHY CONSECUTIVE FAILURES, NOT AN AGE THRESHOLD
#
# The obvious rule — "latest heartbeat still not finished after N minutes" — was
# what this file used, and it does not work at either setting. Replayed against
# the 93 real box-uptime runs and 100 real heartbeat runs from 2026-08-04..08-11:
#
#   rule                              fires   during a real outage   false alarms
#   latest still queued > 20m           11              7                 4
#   latest still queued > 45m            1              0                 1
#   last 2 completed both non-success   11             10                 0(*)
#
# 20m is noisy; 45m is worse than useless — it MISSED a 23-hour outage entirely
# and still kept the false alarm. The reason is sampling, not the number: this
# workflow and box-heartbeat.yml both ask for `0 * * * *`, GitHub lags and drops
# both together, so the check tends to observe the heartbeat while it is still
# YOUNG (observed age: median 25m, p90 63m, max 88m). During the real outage the
# sampled ages were 20-40m, so a 45m bar was never cleared even though the dev
# box could not run a 10-second job for most of a day.
#
# Consecutive failures are immune to that: they do not depend on WHEN we look.
# Ordinary contention resolves within one heartbeat, so it never trips the rule
# — on 2026-08-09 the dev-box job sat queued 33.8 min behind a build job and
# then ran fine in 11s; the old 20m rule emailed admins about a healthy box,
# this rule stays silent (verified against that exact run).
#
# (*) the one apparent false alarm at 2026-08-05 00:52 is a true positive: the
# dev-box job was cancelled on two consecutive heartbeats before it recovered.
#
# What the real outage was, for the record: `build.yml`'s `plan` job wedged and
# held cheese-dev's single runner slot from 2026-08-07 07:18 to 15:29, on top of
# a rougher patch starting 08-06. Every heartbeat in that window had prod-box
# green in seconds and dev-box cancelled — never the reverse. `plan` has since
# moved to a hosted runner, and no heartbeat has failed since 08-07 13:06.
# The standing exposure is that the dev box has ONE slot serving 11 workflows;
# monitoring is detecting a condition that a second slot would mostly remove.

on:
  schedule:
    # Deliberately NOT on the hour: sharing `0 * * * *` with the probe is what
    # correlated the two and kept observed ages low. Two samples halve detection
    # latency (the rule needs two failed heartbeats, ~4.8h at the observed
    # 68-min median heartbeat interval).
    - cron: '25 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alert if heartbeats stopped or a box keeps failing them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # event=schedule only: a manual workflow_dispatch heartbeat is not part
          # of the cadence and must not count as one of the two samples.
          runs="$(gh api \
            "/repos/$REPO/actions/workflows/box-heartbeat.yml/runs?event=schedule&per_page=20" \
            --jq '[.workflow_runs[] | {id, status, conclusion, created_at}]')"

          count="$(echo "$runs" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "::error::no scheduled box-heartbeat runs found — is the probe workflow present and enabled?"
            exit 1
          fi

          show_jobs() {
            gh api "/repos/$REPO/actions/runs/$1/jobs" \
              --jq '.jobs[] | "    \(.name): \(.status) \(.conclusion // "")"' || true
          }

          latest="$(echo "$runs" | jq -r '.[0]')"
          created="$(echo "$latest" | jq -r .created_at)"
          status="$(echo "$latest" | jq -r .status)"
          run_id="$(echo "$latest" | jq -r .id)"
          age_s=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "latest heartbeat: $latest (age $((age_s/60))m)"

          # Freshness. Hourly probe, but GitHub's scheduler is loose: measured
          # heartbeat gaps over a week were median 68m, p90 166m, max 376m, and
          # the age this check actually observes topped out at 88m. 2h35m sits
          # above every observed sample (0 false fires in 93) while still
          # catching "heartbeats stopped landing at all".
          if [ "$age_s" -gt 9300 ]; then
            echo "::error::latest box heartbeat is $((age_s/60)) minutes old — heartbeats have stopped (Actions disabled? probe deleted?)"
            exit 1
          fi

          # Backstop for a run that never finishes AND never gets cancelled.
          # box-heartbeat has cancel-in-progress, so a stuck run normally becomes
          # `cancelled` at the next heartbeat and is caught by the rule below;
          # this only covers the case where that does not happen. 3h is far above
          # the 88m worst observed age — 0 false fires in the replay.
          if [ "$status" != "completed" ] && [ "$age_s" -gt 10800 ]; then
            show_jobs "$run_id"
            echo "::error::box heartbeat has been '$status' for $((age_s/60)) min without being cancelled — a runner is offline or wedged"
            exit 1
          fi

          # The real rule: the two most recent FINISHED heartbeats both failed to
          # come back green. Cancelled counts as failed — that is exactly what a
          # box unable to pick up a 10-second job looks like, because the next
          # heartbeat cancels the one still waiting.
          done_runs="$(echo "$runs" | jq '[.[] | select(.status == "completed")]')"
          n_done="$(echo "$done_runs" | jq 'length')"
          if [ "$n_done" -lt 2 ]; then
            echo "only $n_done finished heartbeat(s) available — not enough history to judge, treating as OK"
            exit 0
          fi

          n_bad="$(echo "$done_runs" | jq '[.[0], .[1]] | map(select(.conclusion != "success")) | length')"
          if [ "$n_bad" -eq 2 ]; then
            for rid in $(echo "$done_runs" | jq -r '[.[0], .[1]][].id'); do
              echo "  heartbeat run $rid:"
              show_jobs "$rid"
            done
            echo "::error::the last 2 box heartbeats both failed to complete — a box runner is offline or wedged (job lists above name which box)"
            exit 1
          fi

          latest_done_concl="$(echo "$done_runs" | jq -r '.[0].conclusion')"
          echo "boxes look alive (latest heartbeat ${age_s}s old, status=$status; last finished heartbeat=$latest_done_concl)"

  # External /api/health latency probe (#356). The heartbeat check above only
  # sees the runner queue; it CANNOT see the ~70-minute brownout where the box
  # was up and running jobs but a migration held a table lock, connection pool
  # exhausted, and the pure-memory /api/health crawled to 12.3s while logins
  # timed out. Probing the endpoint from OUTSIDE the box (a hosted runner, like
  # the check above) is the only way that condition shows up in an alert.
  #
  # Cron granularity bounds detection: this runs twice an hour, so it catches a
  # sustained brownout (like #356's) but not a sub-minute blip — a true
  # minute-level SLO needs a dedicated always-on monitor, not a scheduled
  # workflow. This is the cheap 80%.
  #
  # Opt-in: needs the dev box's PUBLIC health URL, which is deliberately not in
  # the repo. Set repo variable DEV_HEALTH_URL to enable; unset = the step
  # skips green, so this can never page anyone before ops turns it on. Optional
  # DEV_HEALTH_MAX_MS overrides the 5s threshold (healthy is ~65ms, the brownout
  # was 12.3s — 5s separates them with wide margin either way).
  dev-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe dev /api/health latency from outside the box
        env:
          HEALTH_URL: ${{ vars.DEV_HEALTH_URL }}
          MAX_MS: ${{ vars.DEV_HEALTH_MAX_MS || '5000' }}
        run: |
          set -euo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "DEV_HEALTH_URL not set — external health probe disabled."
            echo "Set the repo variable to the dev box's public /api/health URL to enable it."
            exit 0
          fi

          # Two attempts so a single hosted-runner network blip does not page
          # admins; the box is only judged unhealthy if BOTH fail the bar.
          last=""
          for attempt in 1 2; do
            # -m caps the whole request, so a wedged endpoint fails HERE instead
            # of hanging the job; %{time_total} is wall-clock seconds spent.
            if out="$(curl -sS -o /dev/null -m 20 \
                -w '%{http_code} %{time_total}' "$HEALTH_URL" 2>/dev/null)"; then
              code="${out% *}"
              secs="${out#* }"
              ms="$(awk -v s="$secs" 'BEGIN{printf "%d", s*1000}')"
              echo "attempt $attempt: HTTP $code in ${ms}ms (threshold ${MAX_MS}ms)"
              if [ "$code" = "200" ] && [ "$ms" -le "$MAX_MS" ]; then
                echo "dev /api/health healthy"
                exit 0
              fi
              last="HTTP $code in ${ms}ms"
            else
              echo "attempt $attempt: request failed or timed out"
              last="request failed or timed out"
            fi
            # An `[ ... ] && sleep` one-liner returns non-zero on attempt 2 and
            # would abort the step under `set -e` before the error below.
            if [ "$attempt" -eq 1 ]; then
              sleep 10
            fi
          done

          echo "::error::dev /api/health is slow or unreachable ($last, threshold ${MAX_MS}ms) — the box may be browning out (see #356: a migration lock wait starved it for ~70 min while the runner still looked alive)"
          exit 1
