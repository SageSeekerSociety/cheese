name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

# Superseded runs must not occupy the finite self-hosted capacity (three
# cheese-ci slots, one per pool machine). test.yml and build.yml already do
# this; e2e.yml was the one workflow still missing it — any backend/frontend
# change triggers all three at once, and without this an e2e run for a
# superseded commit keeps running to completion instead of being cancelled
# (measured: only ~1.7% of e2e runs were ever cancelled, vs 15%/33% for
# test/build).
#
# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group: with a shared `github.ref` key, a second merge
# cancelled the first one's run and main was left with no result for that
# commit — and a cancelled run is not a red run, so main can carry code this
# workflow never finished checking with nothing on the commit to say so. It is
# also precisely the wrong run to cancel: the scope job below already skips
# main pushes whose tree passed on the PR, so anything reaching the e2e job is
# a commit CI has NOT seen. build.yml already keyed on sha for main; these did
# not. PR refs keep the ref key, so repeated pushes to one PR still supersede
# each other.
#
# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to. Jobs that DO need more (the
# `scope` gh-api jobs) declare it at job level, which overrides this.
permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # See test.yml: merged squash commits contain the exact PR tree already gated.
  # The cheap API decision preserves full CI for direct main pushes.
  scope:
    # On the cheese-ci pool, not a hosted runner: identical `gh api`-only job as
    # test.yml's scope, moved for the same reason — the org's Actions billing
    # lapsed on 2026-08-13, so every ubuntu-latest job is refused before it
    # starts. The pool has no `gh`, so a step below installs it per-machine.
    runs-on: [self-hosted, cheese-ci]
    # Same job as test.yml's scope: measured median 0.2m, wide margin.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      # The cheese-ci pool machines don't ship `gh` (hosted runners do). Install
      # it once per machine into a dir that survives actions/checkout's
      # workspace reset, then prepend it to PATH — same trick test.yml's scope
      # uses. (No `working-directory` override needed: this workflow sets no
      # `backend` default.)
      - name: Ensure gh CLI
        run: |
          gh_dir="$(dirname "$RUNNER_TEMP")/gh-cli"
          if [ ! -x "$gh_dir/bin/gh" ]; then
            gh_version=2.63.2
            mkdir -p "$gh_dir"
            curl -sSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" \
              | tar -xz -C "$gh_dir" --strip-components=1
          fi
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Decide whether this commit already passed PR CI
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: e2e.yml
        run: |
          run_heavy=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if pr_head="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA) | .head.sha')"; then
              if [ -n "$pr_head" ] && passed="$(gh api --method GET \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
                -f head_sha="$pr_head" -f event=pull_request -f status=success \
                --jq '.workflow_runs | length')"; then
                if [ "$passed" -gt 0 ]; then
                  run_heavy=false
                  echo "::notice::Exact squash-merge tree already passed this PR workflow; skipping duplicate main suite"
                fi
              fi
            else
              echo "::warning::Could not inspect associated PRs; running the suite (safe fallback)"
            fi
          fi
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  e2e:
    needs: scope
    # `always()` + `!= 'false'`, not `== 'true'`: `scope` is an OPTIMISATION —
    # it answers "did this exact commit already pass CI on its PR, so can the
    # heavy jobs be skipped?". An optimisation must not hold a veto. Written as
    # `== 'true'` it did: when `scope` failed, its output was empty, the
    # condition was false, and the heavy jobs were SKIPPED — the workflow
    # reported nothing ran and looked green-ish, having tested nothing.
    #
    # That is not hypothetical. On 2026-08-13 the org's Actions billing lapsed;
    # every ubuntu-latest job was refused before it started ("The job was not
    # started because recent account payments have failed"), 0 steps, 2 seconds.
    # `scope` was hosted at the time, so it died, and with it the self-hosted
    # `test` job on machines that were sitting idle and perfectly able to run.
    # That lapse is also why `scope` itself has since moved onto the pool — but
    # the rule below stays regardless: an optimisation must never veto the tests.
    #
    # Now: skip only on an explicit `false` from a `scope` that actually ran.
    # Any other outcome — failed, cancelled, never started — means we do not
    # know, and not knowing means run the tests.
    if: ${{ !cancelled() && needs.scope.outputs.run_heavy != 'false' }}
    # Not ubuntu-latest: this is a private repo, so hosted minutes are billed
    # per-minute, and this job needs native amd64 Docker plus the Playwright
    # browser install. Runs on the cheese-ci pool (MicroCloud VMs, one runner
    # slot each — see docs/infrastructure.md), NOT on the dev box: the box is
    # the deploy target and its single slot serialized every heavy job.
    runs-on: [self-hosted, cheese-ci]
    timeout-minutes: 15
    # Persists backend/srp_rs's Cargo build cache outside the checkout, same
    # as test.yml's migration-heads/test jobs — see the comment on
    # migration-heads there for the full reasoning (why this path survives
    # actions/checkout and is immune to docker prune, and why it's keyed per
    # job rather than shared).
    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese
        # The data directory lives in RAM. The cheese-ci VMs sit on Proxmox
        # storage shared with every MicroCloud machine, and a Postgres at its
        # defaults fsyncs every commit onto it: measured 2026-09-02, a 4 KB
        # sync write cost 3.5 ms on a busy host and the DB-bound two-thirds of
        # the suite ran 4-5x slower than on a quiet one (#668 needed five
        # attempts to fit the 20-minute timeout). Nothing in a CI database
        # outlives the job, so durability buys nothing here. A full run writes
        # ~1 GB (measured locally, WAL included); 3g leaves room for WAL growth
        # on an 8 GB runner that otherwise sits at ~4 GB free.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=3g
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point Cargo at the persistent target dir
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/cargo-target/e2e" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      # Persistent venv (same trick as test.yml): checkout wipes the workspace
      # every run; an out-of-workspace venv turns the measured ~93s uv sync
      # into a no-op re-check.
      - name: Point uv at a persistent venv
        run: echo "UV_PROJECT_ENVIRONMENT=$(dirname "$RUNNER_TEMP")/uv-venv/e2e" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras

      - name: Report Cargo target cache size
        run: du -sh "$CARGO_TARGET_DIR" 2>/dev/null || echo "(no cache dir yet)"

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese
        run: uv run alembic upgrade head

      # alice (seeded by the migration above) owns no project until this runs;
      # the app-shell / topic / chat specs need her to land on a real project
      # rail tile. This is the same fusion demo the dev box is seeded with.
      - name: Seed fusion demo data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese
        run: uv run python -m scripts.seed_fusion_demo

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install E2E deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # Non-default ports: this job used to run on the dev box, which serves the
      # dev deployment on 8081, and Playwright died with "8081 is already used"
      # before a single test ran. It now runs on the cheese-ci pool where
      # nothing else listens, but the overrides stay — they cost nothing and the
      # config's defaults (8081/3000) still collide with a local dev stack.
      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BACKEND_PORT: '8791'
          E2E_FRONTEND_PORT: '3100'
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          CI: true
        run: pnpm exec playwright test

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      # Same reclaim test.yml does, and for the same reason: every run's
      # postgres service container leaves an anonymous volume behind. This job
      # had no reclaim at all, and nothing else on a pool machine removes them
      # — deploy-docker.sh never runs here, and ci-runner/deps.sh's weekly cron
      # is `docker system prune -af` WITHOUT `--volumes`, which does not touch
      # volumes. So e2e's volumes only ever got swept when a test job happened
      # to land on the same machine afterwards. On the dev box this exact leak
      # reached 57 volumes / 19GB and failed a run with "No space left on
      # device"; these pool VMs have 40G. Only volumes no container references
      # are removed.
      - name: Reclaim the service containers' volumes
        if: always()
        run: |
          docker volume prune -f >/dev/null 2>&1 || true
          df -h / | tail -1
