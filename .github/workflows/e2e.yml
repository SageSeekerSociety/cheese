name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

jobs:
  # See test.yml: merged squash commits contain the exact PR tree already gated.
  # The cheap API decision preserves full CI for direct main pushes.
  scope:
    runs-on: [self-hosted, cheese-dev]
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - name: Decide whether this commit already passed PR CI
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: e2e.yml
        run: |
          run_heavy=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if pr_head="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA) | .head.sha')"; then
              if [ -n "$pr_head" ] && passed="$(gh api --method GET \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
                -f head_sha="$pr_head" -f event=pull_request -f status=success \
                --jq '.workflow_runs | length')"; then
                if [ "$passed" -gt 0 ]; then
                  run_heavy=false
                  echo "::notice::Exact squash-merge tree already passed this PR workflow; skipping duplicate main suite"
                fi
              fi
            else
              echo "::warning::Could not inspect associated PRs; running the suite (safe fallback)"
            fi
          fi
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  e2e:
    needs: scope
    if: needs.scope.outputs.run_heavy == 'true'
    # Not ubuntu-latest: GitHub-hosted runners are unavailable to this org (the
    # job is refused before any step runs — "recent account payments have failed
    # or your spending limit needs to be increased"), so this gate has been dead
    # rather than passing. Every self-hosted job in this repo is green. Move it
    # back once billing is sorted; the dev box's 5432/6379 are free, so the
    # service containers below bind the same ports they did.
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 15

    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese
        run: uv run alembic upgrade head

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install E2E deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # The runner is the dev box, which already serves the deployment on 8081.
      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BACKEND_PORT: '8791'
          E2E_FRONTEND_PORT: '3100'
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cheese
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          CI: true
        run: pnpm exec playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
