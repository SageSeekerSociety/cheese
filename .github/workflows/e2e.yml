name: E2E Tests

on:
  workflow_call:
# Superseded PR runs should not keep using a runner after a newer commit arrives.
#
# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group: with a shared `github.ref` key, a second merge
# cancelled the first one's run and main was left with no result for that
# commit — and a cancelled run is not a red run, so main can carry code this
# workflow never finished checking with nothing on the commit to say so. Main
# must retain a result for every source-changing commit. PR refs keep the
# ref key, so repeated pushes to one PR still supersede each other.
#
# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to.
permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every matching main commit runs E2E. A PR result belongs to the PR head
  # and may have excluded this workflow, so it cannot prove the merged commit
  # ran it.
  e2e:
    env:
      JWT_SECRET: test-secret
      ENVIRONMENT: test
      DOCKER_CONTEXT: default
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.18.8-pg16@sha256:8a14fee5257f554a60d70afc89490a6460a9833c3f7f99f7d88dbbf12e4042a2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    # Same reasoning as test.yml's: a successful `e2e` runs 5m41s to 10m26s
    # (median 7m33s) over the last 40 runs, and 15 minutes has already
    # cancelled a run at 20m01s that was slow rather than stuck.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keep the existing slot-scoped names and ports for local reproductions.
      # A hosted runner uses slot zero and has its own service containers.
      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          # Playwright starts a backend, a frontend and the stub gateway on fixed
          # ports; two runs on one machine would take the same ones.
          echo "E2E_BACKEND_PORT=$((8791 + slot))" >> "$GITHUB_ENV"
          echo "E2E_FRONTEND_PORT=$((3100 + slot))" >> "$GITHUB_ENV"
          echo "E2E_STUB_GATEWAY_PORT=$((4010 + slot))" >> "$GITHUB_ENV"
          echo "CHEESE_E2E_DB=cheese_e2e_$slot" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_PORT=$((13100 + slot))" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_S3_PORT=$((13200 + slot))" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_PROJECT=cheese-e2e-forge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_TOKEN_FILE=$RUNNER_TEMP/e2e-forge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-token" >> "$GITHUB_ENV"
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "DATABASE_URL=$root/cheese_e2e_$slot" >> "$GITHUB_ENV"
          # Redis keys are scoped by user id, and user ids restart from 1 in each
          # database; each slot takes its own block of 16.
          echo "REDIS_URL=redis://localhost:6389/$((slot * 16))" >> "$GITHUB_ENV"

      # Preserve the database creation expected by the migration and seed steps.
      - name: Give this run an empty database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"$CHEESE_E2E_DB\" WITH (FORCE)"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"$CHEESE_E2E_DB\""

      # Keep the dependency steps unchanged to measure the hosted runner's setup.
      - name: Point uv's cache outside the per-job temp
        run: echo "UV_SHARED_CACHE=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"
          cache-local-path: ${{ env.UV_SHARED_CACHE }}

      - name: Set up Python
        run: uv python install 3.13

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Build a fresh venv for this job on the hosted runner's filesystem.
      - name: Point uv at a per-job venv
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start the isolated project forge
        run: bash backend/tests/forgejo/start.sh

      # alice (seeded by the migration above) owns no project until this runs;
      # the app-shell / topic / chat specs need her to land on a real project
      # rail tile. This is the same fusion demo the dev box is seeded with.
      - name: Seed fusion demo data
        working-directory: backend
        run: uv run python -m scripts.seed_fusion_demo

      # Keep the store outside setup-pnpm, which the setup action deletes each run.

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.local/share/pnpm/store"

      - name: Install E2E deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.local/share/pnpm/store"

      # Keep explicit ports aligned with the browser fixture and local runs.
      - name: Run E2E tests
        id: e2e_tests
        working-directory: e2e
        env:
          # Ports, DATABASE_URL and REDIS_URL come from the slot step above.
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          CI: true
        run: bash ./run-isolated.sh

      - name: Produce E2E CLEAN evidence
        id: clean_evidence
        if: ${{ !cancelled() }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/ci-test-evidence.py
          --suite e2e
          --source e2e/test-results/playwright-results.json
          --output "$RUNNER_TEMP/ci-test-evidence/e2e/evidence.json"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --head-sha "$EVIDENCE_HEAD_SHA"
          --tested-sha "$GITHUB_SHA"
          --steps-json "$CI_STEPS_JSON"
          --require-step e2e_tests

      - name: Upload E2E CLEAN evidence
        if: ${{ !cancelled() && steps.clean_evidence.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          path: ${{ runner.temp }}/ci-test-evidence/e2e/evidence.json
          if-no-files-found: error
          retention-days: 90

      # Clean runs do not retain traces or the full HTML report. Keep the
      # reporter's small JSON result so case durations remain observable.
      - name: Upload clean E2E durations
        if: ${{ !cancelled() && steps.e2e_tests.outcome == 'success' && hashFiles('e2e/test-results/**/trace.zip') == '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/test-results/playwright-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Tolerated: this is debug output, and the account's artifact storage
        # filling up is not this change being broken. On 2026-09-16 it reported
        # exactly that — E2E, acceptance and harness contracts all red with every
        # test passing and only the upload step failing.
        continue-on-error: true
        # A quota-refused upload retries until the JOB timeout cancels the job
        # — 20 minutes after the tests passed, reported as cancelled, which
        # `continue-on-error` never gets to tolerate. Bound the step instead.
        timeout-minutes: 3
        # Keep reports for red runs and for failed attempts whose retry passed.
        # Clean green runs previously accounted for 454 MB across 78 uploads in one week.
        if: ${{ !cancelled() && (failure() || hashFiles('e2e/test-results/**/trace.zip') != '') }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 3

      - name: Remove the isolated project forge
        if: always()
        run: docker compose -p "$FORGEJO_TEST_PROJECT" -f backend/tests/forgejo/compose.yml down --volumes
