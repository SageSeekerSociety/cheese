name: E2E Tests

on:
  workflow_call:
# Superseded runs must not occupy the finite self-hosted capacity (three
# cheese-ci slots, one per pool machine). test.yml and build.yml already do
# this; e2e.yml was the one workflow still missing it — any backend/frontend
# change triggers all three at once, and without this an e2e run for a
# superseded commit keeps running to completion instead of being cancelled
# (measured: only ~1.7% of e2e runs were ever cancelled, vs 15%/33% for
# test/build).
#
# Cancel superseded runs on a PR, never on main. Keying push runs by sha puts
# each merge in its own group: with a shared `github.ref` key, a second merge
# cancelled the first one's run and main was left with no result for that
# commit — and a cancelled run is not a red run, so main can carry code this
# workflow never finished checking with nothing on the commit to say so. Main
# must retain a result for every source-changing commit. PR refs keep the
# ref key, so repeated pushes to one PR still supersede each other.
#
# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to.
permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every matching main commit runs E2E. A PR result belongs to the PR head
  # and may have excluded this workflow, so it cannot prove the merged commit
  # ran it.
  e2e:
    env:
      JWT_SECRET: test-secret
      ENVIRONMENT: test
      DOCKER_CONTEXT: default
    runs-on: [self-hosted, cheese-ci]
    # Same reasoning as test.yml's: a successful `e2e` runs 5m41s to 10m26s
    # (median 7m33s) over the last 40 runs, and 15 minutes has already
    # cancelled a run at 20m01s that was slow rather than stuck.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Postgres and Valkey are resident on the machine (deploy/ci-runner/
      # resident-services.sh) rather than service containers of this job: a
      # job's own bind host 5432/6379 and bring a 3 GB tmpfs each, which is why
      # a pool machine could only ever run one job at a time.
      #
      # Everything this job binds or names therefore has to be its own. The slot
      # comes from the machine's runner configuration; unset is the only slot.
      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          # Playwright starts a backend, a frontend and the stub gateway on fixed
          # ports; two runs on one machine would take the same ones.
          echo "E2E_BACKEND_PORT=$((8791 + slot))" >> "$GITHUB_ENV"
          echo "E2E_FRONTEND_PORT=$((3100 + slot))" >> "$GITHUB_ENV"
          echo "E2E_STUB_GATEWAY_PORT=$((4010 + slot))" >> "$GITHUB_ENV"
          echo "CHEESE_E2E_DB=cheese_e2e_$slot" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_PORT=$((33100 + slot))" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_S3_PORT=$((33200 + slot))" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_PROJECT=cheese-e2e-forge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_TOKEN_FILE=$RUNNER_TEMP/e2e-forge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-token" >> "$GITHUB_ENV"
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "DATABASE_URL=$root/cheese_e2e_$slot" >> "$GITHUB_ENV"
          # Redis keys are scoped by user id, and user ids restart from 1 in each
          # database; each slot takes its own block of 16.
          echo "REDIS_URL=redis://localhost:6389/$((slot * 16))" >> "$GITHUB_ENV"

      # The resident Postgres outlives the job, so this database has to be made
      # empty deliberately — a service container used to do it by being new. The
      # seed step below is not idempotent, and a run that inherited the previous
      # run's rows would fail somewhere far from the cause.
      - name: Give this run an empty database
        run: |
          docker exec cheese-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"$CHEESE_E2E_DB\" WITH (FORCE)"
          docker exec cheese-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"$CHEESE_E2E_DB\""

      # $RUNNER_TEMP/setup-uv-cache, setup-uv's default, dies with the job.
      # See the note in test.yml's migration-heads job.
      - name: Point uv's cache outside the per-job temp
        run: echo "UV_SHARED_CACHE=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"
          cache-local-path: ${{ env.UV_SHARED_CACHE }}

      - name: Set up Python
        run: uv python install 3.13

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The venv is built per job out of uv's cache, which is the thing worth
      # keeping between runs. uv unpacks every wheel into ~/.cache/uv once and
      # HARDLINKS out of it, so a venv built from a warm cache holds 8 MB of its
      # own and takes 0.9s to produce (measured on a CI box, 2026-09-16), and
      # that cache is already shared by every slot on the machine.
      #
      # Keeping the venv between runs instead is what cost the disk: it stops
      # sharing the moment the cache is rebuilt under it, and never repairs
      # itself. All eight venvs found on one box had a link count of 1 on every
      # file — 9.9 GB, none of it shared, against the 1.3 GB cache they were
      # supposed to be views of. The seconds this used to save are a COLD cache;
      # the cache is what makes it fast, and the cache is not in the workspace
      # checkout wipes.
      - name: Point uv at a venv built from the shared cache
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start the isolated project forge
        run: bash backend/tests/forgejo/start.sh

      # alice (seeded by the migration above) owns no project until this runs;
      # the app-shell / topic / chat specs need her to land on a real project
      # rail tile. This is the same fusion demo the dev box is seeded with.
      - name: Seed fusion demo data
        working-directory: backend
        run: uv run python -m scripts.seed_fusion_demo

      # Keep the store outside setup-pnpm, which the setup action deletes each run.

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.local/share/pnpm/store"

      - name: Install E2E deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.local/share/pnpm/store"

      # Non-default ports: this job used to run on the dev box, which serves the
      # dev deployment on 8081, and Playwright died with "8081 is already used"
      # before a single test ran. It now runs on the cheese-ci pool where
      # nothing else listens, but the overrides stay — they cost nothing and the
      # config's defaults (8081/3000) still collide with a local dev stack.
      - name: Run E2E tests
        id: e2e_tests
        working-directory: e2e
        env:
          # Ports, DATABASE_URL and REDIS_URL come from the slot step above.
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          CI: true
        run: bash ./run-isolated.sh

      - name: Produce E2E CLEAN evidence
        id: clean_evidence
        if: ${{ !cancelled() }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/ci-test-evidence.py
          --suite e2e
          --source e2e/test-results/playwright-results.json
          --output "$RUNNER_TEMP/ci-test-evidence/e2e/evidence.json"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --head-sha "$EVIDENCE_HEAD_SHA"
          --tested-sha "$GITHUB_SHA"
          --steps-json "$CI_STEPS_JSON"
          --require-step e2e_tests

      - name: Upload E2E CLEAN evidence
        if: ${{ !cancelled() && steps.clean_evidence.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          path: ${{ runner.temp }}/ci-test-evidence/e2e/evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Tolerated: this is debug output, and the account's artifact storage
        # filling up is not this change being broken. On 2026-09-16 it reported
        # exactly that — E2E, acceptance and harness contracts all red with every
        # test passing and only the upload step failing.
        continue-on-error: true
        # A quota-refused upload retries until the JOB timeout cancels the job
        # — 20 minutes after the tests passed, reported as cancelled, which
        # `continue-on-error` never gets to tolerate. Bound the step instead.
        timeout-minutes: 3
        # Keep reports for red runs and for failed attempts whose retry passed.
        # Clean green runs previously accounted for 454 MB across 78 uploads in one week.
        if: ${{ !cancelled() && (failure() || hashFiles('e2e/test-results/**/trace.zip') != '') }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 3

      # Same reclaim test.yml does, and for the same reason: every run's
      # postgres service container leaves an anonymous volume behind. This job
      # had no reclaim at all, and nothing else on a pool machine removes them
      # — deploy-docker.sh never runs here, and ci-runner/deps.sh's weekly cron
      # is `docker system prune -af` WITHOUT `--volumes`, which does not touch
      # volumes. So e2e's volumes only ever got swept when a test job happened
      # to land on the same machine afterwards. On the dev box this exact leak
      # reached 57 volumes / 19GB and failed a run with "No space left on
      # device"; these pool VMs have 40G. Only volumes no container references
      # are removed.
      - name: Reclaim the service containers' volumes
        if: always()
        run: |
          docker volume prune -f >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Remove the isolated project forge
        if: always()
        run: docker compose -p "$FORGEJO_TEST_PROJECT" -f backend/tests/forgejo/compose.yml down --volumes
