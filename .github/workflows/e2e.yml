name: E2E Tests

on:
  workflow_call:
# Superseded PR runs should not keep using a runner after a newer commit arrives.
#
# Cancel superseded runs on a PR, never in the merge queue. Keying queue runs
# by sha gives each queued commit its own group, so one entry cannot cancel
# another's run and leave the commit that lands on main with no result — a
# cancelled run is not a red run. PR refs keep the ref key, so repeated pushes
# to one PR still supersede each other.
#
# Least privilege: none of these jobs write anything back to GitHub, so the
# token they run with should not be able to.
permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every matching main commit runs E2E. A PR result belongs to the PR head
  # and may have excluded this workflow, so it cannot prove the merged commit
  # ran it.
  #
  # Playwright runs one test at a time inside a job (see playwright.config.ts),
  # so the suite is split across jobs instead: each shard starts its own
  # backend, frontend and database on its own runner, and runs the tests
  # e2e/shard.mjs gives it, balanced by recorded duration (see that file).
  # `CI required` sees this workflow's result, which is success only when
  # every shard succeeded. `fail-fast` is off so a failing shard does not
  # cancel the others and each keeps its own report.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      JWT_SECRET: test-secret
      ENVIRONMENT: test
      DOCKER_CONTEXT: default
      E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Names this shard's evidence and artifacts, e.g. e2e-1-of-2.
      E2E_SUITE: e2e-${{ matrix.shard }}-of-${{ strategy.job-total }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/paradedb/paradedb:v0.24.0-pg17@sha256:663ecc6dac5165ae2a664c7bd16fb8d8970867e89006ae4f6aa9cd26b1a2a3a4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 1s
          --health-timeout 5s --health-retries 60
      valkey:
        image: mirror.gcr.io/valkey/valkey:8.0.2@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 1s
          --health-timeout 5s --health-retries 60
    # Same reasoning as test.yml's: a slow run must not be cancelled as stuck.
    # 25 minutes was set when one job ran the whole suite (up to 10m26s); a
    # shard runs about a fifth of it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keep the existing slot-scoped names and ports for local reproductions.
      # A hosted runner uses slot zero and has its own service containers.
      - name: Scope this run to its runner slot
        run: |
          slot="${CHEESE_CI_SLOT:-0}"
          echo "CHEESE_CI_SLOT=$slot" >> "$GITHUB_ENV"
          # Playwright starts a backend, a frontend and the stub gateway on fixed
          # ports; two runs on one machine would take the same ones.
          echo "E2E_BACKEND_PORT=$((8791 + slot))" >> "$GITHUB_ENV"
          echo "E2E_FRONTEND_PORT=$((3100 + slot))" >> "$GITHUB_ENV"
          echo "E2E_COMPONENT_PORT=$((3300 + slot))" >> "$GITHUB_ENV"
          echo "E2E_STUB_GATEWAY_PORT=$((4010 + slot))" >> "$GITHUB_ENV"
          echo "E2E_COLLAB_PORT=$((8902 + slot))" >> "$GITHUB_ENV"
          echo "CHEESE_E2E_DB=cheese_e2e_$slot" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_PORT=$((13100 + slot))" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_S3_PORT=$((13200 + slot))" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_PROJECT=cheese-e2e-forge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "FORGEJO_TEST_TOKEN_FILE=$RUNNER_TEMP/e2e-forge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-token" >> "$GITHUB_ENV"
          root="postgresql+asyncpg://postgres:postgres@localhost:5442"
          echo "DATABASE_URL=$root/cheese_e2e_$slot" >> "$GITHUB_ENV"
          # Redis keys are scoped by user id, and user ids restart from 1 in each
          # database; each slot takes its own block of 16.
          echo "REDIS_URL=redis://localhost:6389/$((slot * 16))" >> "$GITHUB_ENV"

      # Preserve the database creation expected by the migration and seed steps.
      - name: Give this run an empty database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS \"$CHEESE_E2E_DB\" WITH (FORCE)"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"$CHEESE_E2E_DB\""

      # Keep the dependency steps unchanged to measure the hosted runner's setup.
      - name: Point uv's cache outside the per-job temp
        run: echo "UV_SHARED_CACHE=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.12.1"
          cache-local-path: ${{ env.UV_SHARED_CACHE }}

      - name: Set up Python
        run: uv python install 3.13

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Keep the store outside setup-pnpm, which the setup action deletes each run.
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.local/share/pnpm/store"

      # The browser runs against a production build served by `vite preview`
      # (playwright.config.ts), not the dev server, which compiled every route
      # on its first visit. The build needs nothing from the backend steps
      # below, so it runs alongside them and the wait step joins it.
      # VITE_API_BASE_URL is baked in at build time, as in production.
      - name: Start the frontend build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          nohup bash -c 'pnpm exec vite build > "$RUNNER_TEMP/frontend-build.log" 2>&1; echo $? > "$RUNNER_TEMP/frontend-build.status"' > /dev/null 2>&1 &

      # Build a fresh venv for this job on the hosted runner's filesystem.
      - name: Point uv at a per-job venv
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      # --frozen, as every other `uv sync` in CI carries: without it uv is free
      # to re-resolve, so this job could install a set the lockfile does not
      # name and pass or fail on something the branch never chose. This was the
      # one `uv sync` in .github/workflows that had no lock flag.
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen --all-extras

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Verify forge fixture CI pull behavior
        run: python3 backend/tests/forgejo/test_pull_ci.py

      - name: Start the isolated project forge
        env:
          FORGEJO_TEST_CI_PULL_RETRY: "1"
        run: bash backend/tests/forgejo/start.sh

      # alice (seeded by the migration above) owns no project until this runs;
      # the app-shell / topic / chat specs need her to land on a real project
      # rail tile. This is the same fusion demo the dev box is seeded with.
      - name: Seed fusion demo data
        working-directory: backend
        run: uv run python -m scripts.seed_fusion_demo

      - name: Install E2E deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.local/share/pnpm/store"

      - name: Wait for the frontend build
        timeout-minutes: 5
        run: |
          until [ -f "$RUNNER_TEMP/frontend-build.status" ]; do sleep 1; done
          tail -5 "$RUNNER_TEMP/frontend-build.log"
          status=$(cat "$RUNNER_TEMP/frontend-build.status")
          [ "$status" = 0 ] || { cat "$RUNNER_TEMP/frontend-build.log"; exit "$status"; }

      # Every shard computes the same split from the same test list and
      # e2e/shard-durations.json, so each test runs in exactly one shard.
      - name: Choose this shard's tests
        working-directory: e2e
        env:
          CI: true
        run: node shard.mjs "$E2E_SHARD" "$RUNNER_TEMP/e2e-tests.txt"

      # Keep explicit ports aligned with the browser fixture and local runs.
      - name: Run E2E tests
        id: e2e_tests
        working-directory: e2e
        env:
          # Ports, DATABASE_URL and REDIS_URL come from the slot step above.
          JWT_SECRET: test-secret
          ENVIRONMENT: test
          CI: true
        run: bash ./run-isolated.sh --test-list="$RUNNER_TEMP/e2e-tests.txt"

      - name: Produce E2E CLEAN evidence
        id: clean_evidence
        if: ${{ !cancelled() }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/ci-test-evidence.py
          --suite "$E2E_SUITE"
          --source e2e/test-results/playwright-results.json
          --output "$RUNNER_TEMP/ci-test-evidence/$E2E_SUITE/evidence.json"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --head-sha "$EVIDENCE_HEAD_SHA"
          --tested-sha "$GITHUB_SHA"
          --steps-json "$CI_STEPS_JSON"
          --require-step e2e_tests

      - name: Say when E2E is not clean
        # CI retries a failed case twice, so a case that fails every first
        # attempt still leaves this job green. The evidence above records it;
        # this puts it on the run a PR author looks at.
        if: ${{ !cancelled() && steps.clean_evidence.outcome == 'success' }}
        run: |
          python3 - "$RUNNER_TEMP/ci-test-evidence/$E2E_SUITE/evidence.json" <<'PY'
          import json, os, sys
          evidence = json.load(open(sys.argv[1]))
          if not evidence["clean"]:
              message = (
                  f"{evidence['suite']} evidence is not clean ({evidence['retries']} retries,"
                  f" {evidence['skipped']} skipped): {evidence['reason']}"
              )
              print(f"::warning title=E2E is not clean::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"### E2E is not clean\n\n{message}\n")
          PY

      - name: Upload E2E CLEAN evidence
        if: ${{ !cancelled() && steps.clean_evidence.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.E2E_SUITE }}
          path: ${{ runner.temp }}/ci-test-evidence/${{ env.E2E_SUITE }}/evidence.json
          if-no-files-found: error
          retention-days: 90

      # Clean runs do not retain traces or the full HTML report. Keep the
      # reporter's small JSON result so case durations remain observable.
      - name: Upload clean E2E durations
        if: ${{ !cancelled() && steps.e2e_tests.outcome == 'success' && hashFiles('e2e/test-results/**/trace.zip') == '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-playwright-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.E2E_SUITE }}
          path: e2e/test-results/playwright-results.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Tolerated: this is debug output, and the account's artifact storage
        # filling up is not this change being broken. On 2026-09-16 it reported
        # exactly that — E2E, acceptance and harness contracts all red with every
        # test passing and only the upload step failing.
        continue-on-error: true
        # A quota-refused upload retries until the JOB timeout cancels the job
        # — 20 minutes after the tests passed, reported as cancelled, which
        # `continue-on-error` never gets to tolerate. Bound the step instead.
        timeout-minutes: 3
        # Keep reports for red runs and for failed attempts whose retry passed.
        # Clean green runs previously accounted for 454 MB across 78 uploads in one week.
        if: ${{ !cancelled() && (failure() || hashFiles('e2e/test-results/**/trace.zip') != '') }}
        with:
          name: playwright-report-${{ env.E2E_SUITE }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 3

      - name: Remove the isolated project forge
        if: always()
        run: docker compose -p "$FORGEJO_TEST_PROJECT" -f backend/tests/forgejo/compose.yml down --volumes
