# Self-maintenance for the self-hosted runner fleet (#562).
#
# The runners' boxes have no reachable SSH from outside their private net, but
# they run our jobs — so a job IS the shell we have on them. This workflow lets
# a maintainer apply the action-archive-cache retrofit (and future .env tweaks)
# without holding a key to any box.
#
# Deliberately uses NO actions (not even checkout): every action would be a
# download from codeload.github.com, which is exactly the rate-limited path
# this maintenance exists to eliminate — and a maintenance job that dies of
# the disease it treats cannot cure anyone.
#
# Populate both slots on each machine without restarting their services.
name: Runner maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'deploy/ci-runner/cache-action-archives.py'
  workflow_dispatch:
    inputs:
      operation:
        description: Maintenance operation
        type: choice
        default: action-archive-cache
        options:
          - action-archive-cache
          - disk-guard

jobs:
  action-archive-cache:
    if: inputs.operation != 'disk-guard'
    permissions:
      contents: read
    concurrency:
      group: action-archive-cache-${{ matrix.box }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        box: [1, 2, 3]
    runs-on: [self-hosted, cheese-ci, "cheese-ci-box-${{ matrix.box }}"]
    timeout-minutes: 20
    steps:
      - name: Populate the action archives for both runner slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/cache-action-archives-$GITHUB_RUN_ID.py"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/deploy/ci-runner/cache-action-archives.py?ref=$GITHUB_SHA" \
            -o "$candidate"
          directories=()
          for config in "$HOME"/actions-runner*/.env; do
            [ -f "$config" ] || continue
            directory="$(sed -n 's/^ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE=//p' "$config")"
            [ -n "$directory" ] || continue
            directories+=(--cache-dir "$directory")
          done
          [ "${#directories[@]}" -gt 0 ]
          python3 "$candidate" --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" "${directories[@]}"
          echo "runner=$RUNNER_NAME revision=$GITHUB_SHA populated=${#directories[@]} arguments" >> "$GITHUB_STEP_SUMMARY"

  disk-guard:
    if: inputs.operation == 'disk-guard'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        box: [1, 2, 3]
    runs-on: [self-hosted, cheese-ci, "cheese-ci-box-${{ matrix.box }}"]
    timeout-minutes: 5
    steps:
      - name: Update the disk guard without restarting runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/disk-guard-$GITHUB_RUN_ID.sh"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/deploy/ci-runner/disk-guard.sh?ref=$GITHUB_SHA" \
            -o "$candidate"
          bash -n "$candidate"
          updated=0
          for guard in "$HOME"/actions-runner*/disk-guard.sh; do
            [ -f "$guard" ] || continue
            backup="$guard.before-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RUNNER_NAME"
            [ ! -e "$backup" ]
            cp -p "$guard" "$backup"
            install -m 0755 "$candidate" "$guard.next-$GITHUB_RUN_ID-$RUNNER_NAME"
            mv "$guard.next-$GITHUB_RUN_ID-$RUNNER_NAME" "$guard"
            cmp "$candidate" "$guard"
            echo "runner=$RUNNER_NAME guard=$guard revision=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            updated=$((updated + 1))
          done
          [ "$updated" -gt 0 ]

      - name: Retire scheduled global Docker prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/retire-docker-prune-$GITHUB_RUN_ID.sh"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/deploy/ci-runner/retire-docker-prune.sh?ref=$GITHUB_SHA" \
            -o "$candidate"
          bash -n "$candidate"
          bash "$candidate" "$HOME/ci-maintenance-backups/prune-retirement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "runner=$RUNNER_NAME revision=$GITHUB_SHA scheduled Docker prune retired" >> "$GITHUB_STEP_SUMMARY"
