name: Warm dependency caches

# Required CI runs in pull requests and the merge queue, never on main. A cache
# saved from a pull-request or merge-queue ref is visible to that ref alone,
# while one saved on main is visible to every ref, so the suites only restore
# and this workflow is the one place their dependency caches are saved. Each
# job installs dependencies the way its suite does, under the suite's exact
# key, and runs no tests. A key that already exists is left as it is.
#
# Keys, and the suites that restore them:
#   backend uv (setup-uv inputs)       test.yml, harness-contract.yml, remote-execution.yml
#   npm-harness-pins-*                 test.yml, harness-contract.yml
#   harness-bins-v1-*                  test.yml (its arm64 shards)
#   pre-commit uv (setup-uv inputs)    repo-guards.yml
#   npm-remote-execution-*             mcp-contract.yml, mcp-equivalence.yml
#   go-*                               cli.yml
#   pnpm-hosted-v2-*                   frontend.yml
# Changing a key or an install step in one of those suites means changing it
# here in the same PR.
on:
  push:
    branches: [main]
    paths:
      - backend/uv.lock
      - .pre-commit-config.yaml
      - backend/app/domain/agent/harness/claude_code/device_launch.py
      - backend/app/domain/agent/harness/claude_code/remote_execution/client.py
      - backend/app/domain/agent/harness/codex/**
      # The pi pin: the tarball in `harness-bins-*` is the build this version
      # names, so a bump here has to re-warm that key the same way a Claude
      # Code or Codex bump re-warms `npm-harness-pins-*`.
      - backend/app/domain/agent/harness/pi/launch.py
      - scripts/remote_execution/package-lock.json
      - cli/go.mod
      - cli/go.sum
      - frontend/pnpm-lock.yaml
      - frontend/package.json
      - .github/workflows/warm-caches.yml
  # Re-saves a key that eviction removed while no dependency changed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
          save-cache: true

      - name: Install Python and dependencies
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --frozen --all-extras

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-harness-pins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/app/domain/agent/harness/claude_code/device_launch.py', 'backend/app/domain/agent/harness/claude_code/remote_execution/client.py', 'backend/app/domain/agent/harness/codex/**') }}

      # The same packages test.yml and scripts/test_harness_contracts.py install.
      - name: Download the pinned harness binaries
        working-directory: backend
        run: |
          packages="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX
          pins = {name: declaration.pinned_version for name, declaration in written().items()}
          print(f"@anthropic-ai/claude-code@{pins[CLAUDE_CODE]} @openai/codex@{pins[CODEX]}")
          PY
          )"
          read -r -a pinned_packages <<< "$packages"
          npm install --prefix "$RUNNER_TEMP/harness-tools" --no-audit --no-fund "${pinned_packages[@]}"

  # The unpacked tools test.yml's shards put on PATH, under the key they
  # restore. This is the one job here that is not on ubuntu-latest: the shards
  # run on arm64 (test.yml's `runner` input) and what gets cached is native —
  # the npm packages carry platform binaries, pi's tarball is built per
  # platform — so a directory unpacked on x64 is one the shards can never use.
  #
  # `npm-harness-pins-*` is here for the same reason: the key the `backend` job
  # above saves has x64 in it, so the shards' restore of that key never
  # matched, and every one of them pulled both packages from the registry on
  # every run.
  harness-bins:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use a fresh virtual environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
          save-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --all-extras

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-harness-pins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/app/domain/agent/harness/claude_code/device_launch.py', 'backend/app/domain/agent/harness/claude_code/remote_execution/client.py', 'backend/app/domain/agent/harness/codex/**') }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: harness-bins
        with:
          # An absolute path under $HOME, so a shard that restores it lands on
          # the same one this job unpacked into. $RUNNER_TEMP cannot be used
          # here: it names this run's own directory, not a path a later run can
          # ask for.
          path: ~/.cache/cheese-harness-bins
          # Every pin whose build is in the directory, pi's included: the pi
          # tarball is fetched under `written()[PI].pinned_version`, and that
          # version is written only in `pi/launch.py`
          # (`test_capability_matrix.py` holds it there). Without it a pi bump
          # would leave this key unchanged, the shards — which only restore —
          # would keep restoring the old build, and every one of them would go
          # red on `pinned_claude.pi_binary` with no way to repair itself from
          # the pull-request side.
          key: harness-bins-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/app/domain/agent/harness/claude_code/device_launch.py', 'backend/app/domain/agent/harness/claude_code/remote_execution/client.py', 'backend/app/domain/agent/harness/codex/**', 'backend/app/domain/agent/harness/pi/launch.py') }}

      # The unpacking test.yml does on a miss, so the cache holds exactly what
      # a shard would have produced on its own. It runs only when this key had
      # nothing to restore, which is also the condition actions/cache saves
      # under: leaving an existing key alone is what stops this job from
      # overwriting a cache the shards are already reading.
      - name: Unpack the pinned harness binaries
        if: steps.harness-bins.outputs.cache-hit != 'true'
        run: |
          bins="$HOME/.cache/cheese-harness-bins"
          mkdir -p "$bins"
          packages="$(uv run python - <<'PY'
          from app.domain.agent.capability.matrix import written
          from app.domain.agent.harness import CLAUDE_CODE, CODEX
          pins = {name: declaration.pinned_version for name, declaration in written().items()}
          print(f"@anthropic-ai/claude-code@{pins[CLAUDE_CODE]} @openai/codex@{pins[CODEX]}")
          PY
          )"
          read -r -a pinned_packages <<< "$packages"
          npm install --prefix "$bins/harness-tools" --no-audit --no-fund "${pinned_packages[@]}"
          case "$(uname -m)" in
            x86_64) pi_platform=linux-x64 ;;
            aarch64 | arm64) pi_platform=linux-arm64 ;;
          esac
          archive="$(uv run python - "$RUNNER_TEMP/pi-dist" "$pi_platform" <<'PY'
          import asyncio, sys
          from pathlib import Path
          from app.domain.agent.harness import PI
          from app.domain.agent.capability.matrix import written
          from app.domain.machine import pi_dist
          version = written()[PI].pinned_version
          print(asyncio.run(pi_dist.ensure_cached(Path(sys.argv[1]), version, sys.argv[2])))
          PY
          )"
          mkdir -p "$bins/pi"
          tar -xzf "$archive" -C "$bins/pi"

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml
          prune-cache: false
          save-cache: true
      - name: Install pre-commit the way repo-guards.yml runs it
        run: uvx pre-commit --version

  remote-execution-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-remote-execution-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/remote_execution/package-lock.json') }}
      - name: Install scripts/remote_execution the way mcp-contract.yml does
        run: npm ci --prefix scripts/remote_execution --no-audit --no-fund

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/go.mod', 'cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Builds what cli.yml builds; `-run '^$'` compiles the test binaries and
      # runs none of them.
      - name: Build the module, its vet targets and its test binaries
        run: |
          go mod download
          go build ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test -race -run '^$' ./...
          go test -tags claudee2e -run '^$' ./e2e/

  pnpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-hosted-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies the way frontend.yml does
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"
