name: Review pin recheck

# Required CI judges, in its `CI required` job, that the newest independent
# review pinned on the PR (`<!-- pr-review sha=<head> -->`, posted by
# .claude/scripts/pr-review.sh) is of the PR's current head and has no blocker
# or major finding (.github/scripts/check-review-pin.py). The pin is a PR
# comment, usually posted after the push that started the run, and a comment is
# not an event Required CI runs on; running every suite again for one would
# cost a full CI round. So this re-runs that one job of the head commit's
# finished Required CI run: the suites keep their results and the pin is read
# again, live.
#
# A run in progress whose review-pin step has not started needs nothing: the
# step reads the comments as they are when it does. One whose step has started
# may already have read them, so this waits for the run to finish (the step is
# the last thing in it) and re-runs the job. A draft has no `CI required` that
# ran, and a fork PR's run has no token to re-run with: both are left alone.
#
# `issue_comment` runs the workflow as it is on main, with a write-capable
# token, on a comment anyone may post. Nothing from the comment reaches a shell
# or a checkout: only its author (a role here, or the repository's GitHub App,
# which agents post through and GitHub reports as CONTRIBUTOR) and the marker
# it opens with select the run, and the PR is read back from the API. Whether
# the pin is trusted is decided by check-review-pin.py, not here.
on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  recheck:
    if: >-
      github.event.issue.pull_request
      && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          || (github.event.comment.user.login == 'cheesex-app[bot]' && github.event.comment.user.type == 'Bot'))
      && (startsWith(github.event.comment.body, '<!-- pr-review sha=')
          || startsWith(github.event.changes.body.from, '<!-- pr-review sha='))
    # On the job, not the workflow: every comment on any PR starts a run of this
    # workflow, and a run whose job is skipped must not queue behind, or cancel,
    # the recheck of a real pin. Never cancel one that is waiting to re-run.
    concurrency:
      group: review-pin-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Re-run the review-pin check of the head commit's Required CI run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          head=$(jq -r '.head.sha' <<<"$pull")
          if [ "$(jq -r '.head.repo.full_name' <<<"$pull")" != "$GITHUB_REPOSITORY" ]; then
            echo "A fork PR's run has no token to re-run with; leaving it."
            exit 0
          fi
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow required-ci.yml \
            --event pull_request --commit "$head" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "No Required CI run on $head yet; its review-pin step will read the comments when it runs."
            exit 0
          fi
          status() { gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status --jq .status; }
          if [ "$(status)" != "completed" ]; then
            started=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '[.jobs[] | select(.name == "CI required") | .steps[]
                     | select(.name | startswith("review-pin")) | select(.status != "queued" and .status != "pending")] | length')
            if [ "${started:-0}" = 0 ]; then
              echo "Run $run has not reached its review-pin step; the step reads the review when it does."
              exit 0
            fi
            echo "Run $run is past the start of its review-pin step; waiting for it to finish."
            for _ in $(seq 1 24); do
              [ "$(status)" = "completed" ] && break
              sleep 10
            done
            if [ "$(status)" != "completed" ]; then
              echo "::error::Required CI run $run did not finish in 4 minutes; re-run its 'CI required' job by hand."
              exit 1
            fi
          fi
          # Only a job that actually ran is worth re-running: `CI required` is a
          # literal name in required-ci.yml, so it also matches the job of a
          # draft-quick or superseded run, where it is skipped or cancelled and
          # re-running it would report nothing about the review.
          job=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name == "CI required")
                  | select(.conclusion != "skipped" and .conclusion != "cancelled")
                  | .databaseId')
          if [ -z "$job" ]; then
            echo "Run $run has no 'CI required' that ran (draft quick or superseded); the run in flight reads the review when it does."
            exit 0
          fi
          echo "Re-running 'CI required' (job $job) of Required CI run $run."
          gh run rerun --job "$job" --repo "$GITHUB_REPOSITORY"
