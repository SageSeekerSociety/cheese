version: '3'

dotenv: ['.env', 'backend/.env']

includes:
  be:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
    aliases: [backend]

tasks:
  check:
    desc: Run all checks (backend)
    cmds:
      - task: be:check
  check:full:
    desc: Run all checks with full test suite
    cmds:
      - task: be:check:full
  dev:
    desc: Start backend dev server (+ infrastructure)
    deps: [infra]
    cmds:
      - task: be:dev
  infra:
    desc: Start infrastructure services (PG, Valkey, ES)
    cmds:
      - docker compose up -d
    status:
      - docker compose ps --status running postgres --quiet
  infra:down:
    desc: Stop infrastructure services
    cmds:
      - docker compose down
  infra:logs:
    desc: Tail infrastructure logs
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}
  infra:ps:
    desc: Show running infrastructure containers
    cmds:
      - docker compose ps
