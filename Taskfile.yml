version: '3'

dotenv: ['.env', 'backend/.env']

set: [pipefail]

includes:
  be:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
    aliases: [backend]
  fe:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
    aliases: [frontend]
  e2e:
    taskfile: ./e2e/Taskfile.yml
    dir: ./e2e
  docs:
    taskfile: ./docs/site/Taskfile.yml
    dir: ./docs/site

tasks:
  default:
    desc: Show available commands
    silent: true
    cmds:
      - task --list

  setup:
    desc: First-time setup — install deps, start infra, run migrations
    preconditions:
      - sh: command -v uv
        msg: "uv is required. Install: curl -LsSf https://astral.sh/uv/install.sh | sh"
      - sh: command -v pnpm
        msg: "pnpm is required. Install: corepack enable"
      - sh: command -v docker
        msg: "Docker is required. Install: https://docs.docker.com/get-docker/"
    cmds:
      - task: git:config
      - task: be:deps:sync
      - task: fe:install
      - task: infra
      - task: be:db:migrate
      - echo ""
      - echo "Setup complete! Run 'task dev' to start backend + frontend."

  git:config:
    desc: Repo-local git settings that CLAUDE.md's rules depend on
    cmds:
      # autostash turns `git pull` into a stash push and pop, and the stash is
      # one stack for the whole repository — no worktree owns an entry, and
      # nothing warns either side. Agents work in parallel worktrees here, so an
      # autostash pop lands somebody else's uncommitted work in your tree and
      # drops it from theirs. Two entries in this repo's stash are already
      # labelled as having been popped by the wrong worktree. CLAUDE.md says
      # never to stash; git does it for you unless this is off, and it is on by
      # default for many people through their global config.
      - git config --local merge.autoStash false
      - git config --local rebase.autoStash false

  lark:setup:
    desc: Connect this machine to the team's Feishu (lark-cli, --profile cheese)
    interactive: true
    cmds:
      - bash scripts/setup-lark-cli.sh

  dev:
    desc: Start backend + frontend dev servers (+ infrastructure)
    deps: [dev:backend, dev:frontend, dev:collab]

  dev:backend:
    desc: Start backend dev server only
    deps: [infra]
    cmds:
      - task: be:dev

  dev:frontend:
    desc: Start frontend dev server only
    aliases: [dev:fe]
    cmds:
      - task: fe:dev

  dev:collab:
    desc: Start the collaboration service only
    cmds:
      - task: fe:dev:collab

  dev:docker:
    desc: Start all services in Docker (Windows without WSL)
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      - echo ""
      - echo "Backend running at http://localhost:8081"
      - echo "Run 'task dev:fe' in another terminal for frontend."

  check:
    desc: Run all checks (backend + frontend)
    cmds:
      - task: be:check
      - task: fe:check

  # Architecture gates: import boundaries, standalone scenes, shrinking scene
  # debt, catalog coverage and file sizes. Scene debt and file sizes require
  # an up-to-date origin/main; frontend checks require installed dependencies.
  boundaries:
    desc: Boundaries + scenes + scene debt + catalog + file-size caps
    cmds:
      - task: be:boundaries
      - task: fe:lint:boundary
      - task: fe:lint:scenes
      - task: fe:lint:scene-debt
      - task: fe:lint:catalog
      - python3 .claude/scripts/check-file-sizes.py

  check:full:
    desc: Run all checks with full test suite
    cmds:
      - task: be:check:full

  hooks:
    desc: Install the git hooks (a fresh clone has none)
    cmds:
      - uvx pre-commit install

  guards:
    desc: Run the pre-commit checks over the whole tree (what CI runs)
    cmds:
      - uvx pre-commit run --all-files

  # Static fast check before opening a PR: picks pre-commit hook IDs by the
  # merge-diff scope (same select() and path map as the Required CI gate) and
  # runs only those. v1 is static checks ONLY — pytest/typecheck/build/e2e do
  # not run here and the summary says so; full CI stays the merge gate.
  # `task ci:fast -- --types` adds pyright/vue-tsc. Exit 0 means the selected
  # static checks really ran green, nothing more.
  ci:fast:
    desc: Static fast check scoped to the merge diff (not full CI)
    cmds:
      - python3 .github/scripts/ci-fast.py {{.CLI_ARGS}}

  infra:
    desc: Start infrastructure services (PG, Valkey)
    cmds:
      - docker compose up -d
    status:
      # `ps --quiet` exits 0 even when nothing matches, so ask whether it
      # printed a container id rather than trusting its exit code.
      - test -n "$(docker compose ps --status running postgres --quiet)"

  infra:down:
    desc: Stop infrastructure services
    cmds:
      - docker compose down

  infra:logs:
    desc: Tail infrastructure logs
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  infra:ps:
    desc: Show running infrastructure containers
    cmds:
      - docker compose ps

  live:
    desc: "What is actually running on dev, next to what main says"
    cmds:
      - bash scripts/whats-live.sh
