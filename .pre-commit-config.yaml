# One list of checks, read by both a developer's machine and CI.
#
# WHY THIS REPLACED A HAND-WRITTEN SCRIPT: check.sh was a scheduler — it decided
# which checks ran, in what order, and against which files. All three are things
# this framework does declaratively, and the hand-written version had drifted
# from CI in the way that arrangement always drifts: the local/CI coverage table
# lived in a comment, maintained by whoever remembered. Now CI runs
# `pre-commit run --all-files` against THIS file, so the two cannot disagree
# about what a check is. `files:` and `types:` replace a scope_of() written by
# hand; `pre-commit install` replaces install-hooks.sh copying a script into
# .git/hooks.
#
# THE HEAVY CHECKS ARE HERE TOO, under `stages: [manual]` — they just never run
# on a commit. pytest needs Postgres and ~60s; the frontend typecheck and build
# OOM on a small box. A commit gate that fails on a missing database teaches
# people to pass --no-verify, and a bypassed gate protects nothing. But leaving
# them out of this file entirely would mean the file is not the list, and then
# there is no single answer to "what do we check". Run them with
# `pre-commit run --hook-stage manual <id> --all-files`, or `task check`.
#
# CI does NOT invoke them through pre-commit: test.yml gives pytest a database
# service, a persistent uv venv, and a scope gate, and frontend.yml does the
# same for the build. Those are workflow-level concerns a hook cannot express.
# So for the heavy three, this file states WHAT is checked and CI owns HOW —
# which is an honest split, unlike a hook that claims to be runnable anywhere
# and is not.
#
# Every guard below is a standalone executable that says what it thinks through
# its exit code, and carries --self-test to prove it still fires. That shape
# predates this file; it is why the migration needed no changes to any of them.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      # --- backend ------------------------------------------------------
      # Each of these reads its config from backend/pyproject.toml, so they run
      # from that directory rather than taking file arguments. `files:` is what
      # keeps a docs-only commit from paying for any of it.
      - id: ruff
        name: ruff (lint)
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff (format)
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: pyright
        name: pyright
        entry: bash -c 'cd backend && uv run pyright'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      # The import graph, not the diff: this walks every module under app/ and
      # reports the ones that broke a declared boundary (api -> domain -> core,
      # no route reaching another domain's models, no cycle between sibling
      # domains). The baseline it measures against is the tree at the merge base
      # with origin/main: the violations that tree already has are held open,
      # and a violation only this tree has is the verdict. Nothing is stored, so
      # no pull request has to carry a list of exemptions and no writer has to
      # keep one in step.
      #
      # `files:` includes .importlinter because it is the declaration the check
      # reads, and because writing an exception in it is how somebody could make
      # a violation go away without fixing it.
      - id: boundary-check
        name: module boundaries (import-linter, baseline from the merge base)
        entry: bash -c 'cd backend && uv run python scripts/check_boundaries.py'
        language: system
        pass_filenames: false
        files: ^backend/(.*\.py|\.importlinter)$

      # Imports inside a function body may only go down. Each file's count of
      # unexplained ones is frozen in backend/deferred-import-baseline.json; an
      # import that says why (`# deferred-import: <reason>`, same line or the
      # line above) is not counted. Whole tree, like the graph check above.
      - id: deferred-imports
        name: deferred imports only go down (annotated or frozen)
        entry: bash -c 'cd backend && uv run python scripts/check_deferred_imports.py'
        language: system
        pass_filenames: false
        files: ^backend/(app/.*\.py|deferred-import-baseline\.json|scripts/check_deferred_imports\.py)$

      # The two refactors that leave every other gate green: a module becomes a
      # package and its facade stops offering a name, and a name leaves a module
      # for a sibling while the callers still import it from where it left. The
      # callers are often under scripts/ or backend/scripts/, which pyright
      # never reads (`include app`), so nothing else notices. The guard compares
      # each changed module with its base-ref self, reads every caller in the
      # tree, and leaves a deleted module whose place a package took to
      # --check-facade, so one break is not reported twice. Exit 2 (cannot
      # judge) is a failure here, never a pass.
      #
      # `always_run`, not `files:`: pre-commit's default diff filter drops
      # deleted files, and a commit that only deletes a module is one of the
      # cases this answers. The script reads `git diff` itself, so a commit that
      # touches no Python costs one git call.
      #
      # The base is HEAD, the commit's parent: the question is what this commit
      # introduced, and a long-lived branch must not rescan everything it ever
      # changed on every commit. A runner that names a range
      # (`pre-commit run --from-ref ... --to-ref ...`) passes that range's start
      # through PRE_COMMIT_FROM_REF instead.
      #
      # The interpreter is picked from PATH rather than taken from `python3`
      # blindly: `uvx pre-commit` (what Taskfile.yml installs) puts its tool
      # venv first, and on the work image that python is 3.9 — the guard needs
      # 3.10 (`zip(strict=True)`). Because this hook runs on every commit, a
      # 3.9 traceback would turn every commit red; with none found it is exit 2,
      # which says it could not judge instead of pretending to.
      - id: module-split
        name: split packages and moved names keep every caller importing
        entry: |
          bash -c '
          set -u
          base=${PRE_COMMIT_FROM_REF:-HEAD}
          tool=.claude/scripts/verify-module-split.py
          if ! git rev-parse --verify -q "$base^{commit}" >/dev/null 2>&1; then
            printf "cannot judge: %s is not a ref in this checkout (git fetch origin)\n" "$base" >&2
            exit 2
          fi
          py=
          for candidate in python3 python3.13 python3.12 python3.11 python3.10; do
            if command -v "$candidate" >/dev/null 2>&1 \
               && "$candidate" -c "import sys; raise SystemExit(sys.version_info < (3, 10))" >/dev/null 2>&1; then
              py=$candidate
              break
            fi
          done
          if [ -z "$py" ]; then
            printf "cannot judge: no Python 3.10+ on PATH for verify-module-split.py\n" >&2
            exit 2
          fi
          status=0
          changed=$(git diff --name-only --no-renames "$base" -- .)
          untracked=$(git ls-files --others --exclude-standard -- .)
          while IFS= read -r init; do
            dir=${init%/__init__.py}
            if git cat-file -e "$base:$dir.py" 2>/dev/null; then
              "$py" "$tool" --check-facade "$dir" --base-ref "$base" || status=$?
            fi
          done < <(printf "%s\n" "$changed" | grep -E "(^|/)__init__\.py$" || true)
          if printf "%s\n%s\n" "$changed" "$untracked" | grep -q "\.py$"; then
            "$py" "$tool" --check-moves . --base-ref "$base" || status=$?
          fi
          exit "$status"
          '
        language: system
        pass_filenames: false
        always_run: true

      # The API surface the frontend's types are generated from. This builds
      # the document and holds the two one-line files beside it: the digest,
      # which is how a change is routed into the frontend types suite, and the
      # untyped ratchet, which only shrinks. CI runs it as a step of the
      # `backend / static` job (test.yml) rather than through pre-commit, since
      # that job has the venv already synced — the pre-push entry point is what
      # reads this id. `stages: [manual]` for the reason the heavy hooks above
      # carry it: 23s on a work machine is too much for a commit gate.
      - id: openapi-document
        name: OpenAPI document builds, digest and untyped ratchet hold
        entry: bash -c 'cd backend && uv run python -m scripts.export_openapi --check'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [manual]

      # Two checks in one script: backend/alembic/HEAD must name the chain's
      # tip, and merging into main must not leave two heads. The second is only
      # visible against main — a tree with one head still forks if a sibling
      # branch added a migration on the same parent — and the first is what
      # makes two such branches collide in git rather than merge cleanly.
      - id: migration-fork
        name: merging would not fork the alembic chain
        entry: python3 .claude/scripts/check-migration-fork.py
        language: system
        pass_filenames: false
        files: ^backend/alembic/

      # The migrations this branch adds must be safe while the previous
      # release keeps serving (.claude/rules/migrations.md). CI runs the same
      # script in test.yml's static job.
      - id: migration-safety
        name: added migrations are safe under the running release
        entry: python3 .claude/scripts/check-migration-safety.py
        language: system
        pass_filenames: false
        files: ^backend/alembic/versions/

      # --- frontend -----------------------------------------------------
      # typecheck and build are deliberately absent: both OOM on a small box, and
      # a check that dies on memory reports as a code failure. CI's frontend.yml
      # owns them.
      #
      # These two DO go red on a checkout with no node_modules, and that is the
      # intended answer rather than an oversight. A hook that quietly passes
      # when it could not run is the exact failure the old script's BLOCKED
      # state existed to prevent — and since `files:` means these only fire when
      # you are editing frontend/, being asked to `pnpm install` first is fair.
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && pnpm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: stylelint
        name: stylelint
        entry: bash -c 'cd frontend && pnpm run lint:style'
        language: system
        pass_filenames: false
        files: ^(frontend/|docs/site/src/style\.css$)

      - id: i18n-cjk
        name: hardcoded Chinese (i18n)
        entry: bash -c 'cd frontend && pnpm run lint:i18n'
        language: system
        pass_filenames: false
        files: ^frontend/

      # Components must not reach the network layer: `@/api`, `@/services/*`,
      # `@/network/*` and vue-router are off limits under src/components/**.
      # 127 violations in 82 components are frozen in
      # frontend/import-boundary-baseline.json, which is why this is a separate
      # ESLint config (eslint.boundary.config.mjs) rather than a rule in the
      # one `pnpm run lint` reads: as a plain rule it would have turned the
      # whole tree red on day one, and a gate that red everywhere gets deleted.
      # Same go-red-without-node_modules answer as eslint/stylelint above.
      - id: boundary-check-frontend
        name: component boundaries (eslint + ratchet)
        entry: bash -c 'cd frontend && pnpm run lint:boundary'
        language: system
        pass_filenames: false
        files: ^frontend/(src/components/|eslint\.boundary\.config\.mjs|import-boundary-baseline\.json|package\.json|scripts/import-boundary-ratchet)

      # Accessibility rules (eslint-plugin-vuejs-accessibility, flat/recommended)
      # over src/**/*.vue. The violations already in the tree are frozen per
      # file in frontend/a11y-baseline.json, so this is a separate ESLint config
      # (eslint.a11y.config.mjs) for the same reason as the boundary check above.
      # `files:` includes the base config because the a11y one extends it.
      - id: a11y-frontend
        name: accessibility (eslint + ratchet)
        entry: bash -c 'cd frontend && pnpm run lint:a11y'
        language: system
        pass_filenames: false
        files: ^frontend/(src/.*\.vue|eslint\.(a11y\.)?config\.mjs|a11y-baseline\.json|package\.json|pnpm-lock\.yaml|scripts/(a11y-ratchet|tsc-ratchet-core|ratchet-report))

      # Check the index against the branch baseline, not unstaged repairs.
      # CI's test:ratchet also checks the committed tree via the discovered test.
      - id: sfc-attribute-diff
        name: Vue splits preserve explicit attribute fallbacks (staged)
        entry: node frontend/scripts/sfc-attribute-diff.mjs --staged
        language: system
        pass_filenames: false
        files: ^(.*\.vue|frontend/scripts/sfc-attribute-diff(\.test)?\.mjs|\.pre-commit-config\.yaml)$

      - id: sfc-attribute-diff-self-test
        name: Vue split attribute guard self-test
        entry: node frontend/scripts/sfc-attribute-diff.mjs --self-test
        language: system
        pass_filenames: false
        files: ^(frontend/scripts/sfc-attribute-diff(\.test)?\.mjs|\.pre-commit-config\.yaml)$

      # Every page the router reaches and every SFC under
      # src/components/panels/ has to render with no backend, no route and no
      # business store. The freeze is the tree at the merge base with
      # origin/main: a scene that is standalone-ready there may not stop being,
      # and a scene added from now on has to be from its first commit. Nothing
      # is written down, so there is no writer and no list to edit. The router
      # is in `files:` because registering a page there is what makes it a
      # scene. python3 stdlib only — no venv, no node_modules — because it
      # grades with the same module arch-metrics.py reports from, and the two
      # must not disagree about a scene.
      - id: scene-ratchet
        name: scenes run standalone (python ratchet)
        entry: python3 .claude/scripts/scene-ratchet.py --base origin/main
        language: system
        pass_filenames: false
        files: ^(frontend/(src/(views|router|components/panels)/.*|package\.json)|\.claude/scripts/(frontend_grade|scene-ratchet|ratchet_report)\.py)$

      # Exact rendered child edges, useRoute callers and legacy importers can
      # only disappear. This parser needs frontend dependencies and origin/main.
      - id: scene-debt-ratchet
        name: scene dependencies and legacy imports only go down
        entry: python3 .claude/scripts/scene-debt-ratchet.py --base origin/main
        language: system
        pass_filenames: false
        files: ^(frontend/.*|\.claude/scripts/(frontend_grade|scene-ratchet|scene-debt-ratchet|test_scene_debt_ratchet|ratchet_report)\.py)$

      # Every grade-A SFC is registered in /demo/catalog or frozen as pending.
      # The pending list can only shrink; imports determine the grade.
      # `pnpm run lint:catalog:update` removes paid-down entries.
      - id: catalog-ratchet
        name: grade-A components are in the catalog (python ratchet)
        entry: python3 .claude/scripts/catalog-ratchet.py
        language: system
        pass_filenames: false
        files: ^(frontend/(src/.*\.(vue|ts)|catalog-baseline\.json|package\.json)|\.claude/scripts/(frontend_grade|catalog-ratchet|ratchet_report)\.py)$

      # --- heavy: never on commit, see the note at the top ---------------
      - id: pytest
        name: backend test suite (needs Postgres)
        entry: bash -c 'cd backend && uv run pytest tests/ -n 4 -q'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: frontend-typecheck
        name: vue-tsc (ratcheted)
        entry: bash -c 'cd frontend && pnpm run typecheck'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: frontend-build
        name: frontend build
        entry: bash -c 'cd frontend && pnpm run build'
        language: system
        pass_filenames: false
        stages: [manual]

      # --- repo-wide guards ---------------------------------------------
      # always_run because it judges relationships across the tree — duplicate
      # topic notes, a platform command leaking into AGENTS.md — which no single
      # changed path predicts.
      - id: repo-rules
        name: repo rules (datetime, HTTPException, palette, platform CLI, …)
        entry: bash .claude/scripts/check-repo-rules.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: action-pins
        name: actions pinned to a commit SHA
        entry: bash .claude/scripts/check-action-pins.sh
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      # The user manual's anchors: the site's llms.txt is built from them, and
      # a model answers with those URLs. A slug generated from a heading dies
      # the moment someone rewords it, and a section with no opening sentence
      # ships an entry the model has to guess from — neither turns anything
      # else in the tree red.
      - id: manual-anchors
        name: user manual anchors (explicit slugs, every section has a summary)
        entry: python3 .claude/scripts/check-manual-anchors.py
        language: system
        pass_filenames: false
        files: ^docs/manual/

      # The other half of the same problem, for the files no site build reads:
      # an agent document that names a path or a section of another document,
      # where the target has since moved. Nothing else looks at .claude/ — no
      # build, no test, no checker imports it — so the sentence keeps reading
      # perfectly while the reader who obeys it gets a "No such file". The live
      # example is in the script's docstring: five dead section names in
      # cheese-py-code-review/SKILL.md, in the file a reviewer is told to trust.
      # always_run because the claim is about the TREE, not about the file that
      # carries it: a rename anywhere can be what falsifies a sentence here.
      - id: doc-references
        name: agent docs name paths and sections that exist
        entry: python3 .claude/scripts/check-doc-references.py
        language: system
        pass_filenames: false
        always_run: true

      # `docs/reviews/artifacts/` is read by nothing — no build, no test, no
      # link checker — so an artifact whose note was rewritten stays on disk
      # named by nobody. Two one-off PDFs sat there until #4032 removed them by
      # hand. The guard fails when a file under that directory is named by no
      # note in `docs/reviews/`. always_run because the claim is about the
      # tree: a deleted or rewritten note anywhere is what falsifies it.
      - id: review-artifacts
        name: review artifacts are cited by a review note
        entry: python3 .claude/scripts/check-review-artifacts.py
        language: system
        pass_filenames: false
        always_run: true

      # A file-size ratchet, not a cliff: 7 files are already past their cap
      # (frontend/src 1000 lines, backend/app 1500) and each is frozen at the
      # size it had where this branch left main — the merge base, which is why
      # main moving on cannot fail a branch for a file it never touched. Only
      # the files the branch actually changed are read, so an oversized file may
      # shrink but not grow, and a new file must land under the cap. It needs a
      # remote-tracking origin/main AND the history to find the merge base with
      # it: CI fetches both (see .github/workflows/repo-guards.yml); locally
      # `git fetch origin` is the fix, which is why each missing piece is a
      # "cannot judge" (exit 2) naming the fetch rather than a pass.
      - id: file-size
        name: files have not grown past their size cap
        entry: python3 .claude/scripts/check-file-sizes.py
        language: system
        pass_filenames: false
        files: ^(backend/app/|frontend/src/|\.claude/scripts/check-file-sizes\.py)
