[project]
name = "cheese-backend-py"
version = "0.1.0"
description = "Cheese backend rewrite in Python (FastAPI + SQLAlchemy)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cheese Team" }]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "taskiq[redis,fastapi]>=0.11.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "cryptography>=43.0.0,<44.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    "alembic>=1.17.2",
    "openai>=1.50.0,<2.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "structlog>=24.0.0,<25.0.0",
    "pyotp>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "anyio>=4.0.0,<5.0.0",
]
dev = [
    "ruff>=0.5.0,<1.0.0",
    "pyright>=1.1.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "scripts",
    "tests",
    "pyproject.toml",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
