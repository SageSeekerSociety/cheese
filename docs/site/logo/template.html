<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知是 logo 动效 · 冒孔</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
    transition:background-color .3s,color .3s;-webkit-font-smoothing:antialiased}
  body[data-theme=light]{--bg:#faf7f0;--card:#fffdf8;--fg:#3b3229;--dim:#8a8175;--line:#e6dccb}
  body[data-theme=dark]{--bg:#121016;--card:#1a171f;--fg:#ece6dc;--dim:#968f9f;--line:#2f2a36}
  header{max-width:720px;margin:0 auto;padding:36px 24px 8px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.01em}
  header p{margin:6px 0 0;color:var(--dim);max-width:60ch}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:13px;color:var(--fg);background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;cursor:pointer;transition:border-color .2s}
  button:hover{border-color:var(--dim)}
  button[aria-pressed=true]{border-color:#f59e0b;color:#d97706}
  body[data-theme=dark] button[aria-pressed=true]{color:#fbbf24}
  label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
  main{max-width:720px;margin:0 auto;padding:16px 24px 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
  .stage{aspect-ratio:1;display:grid;place-items:center;cursor:pointer;border-radius:12px;overflow:hidden}
  .stage svg{width:72%;height:auto;display:block;overflow:visible}
  .card p{margin:0;color:var(--dim);font-size:13px}
  .card ul{margin:0;padding-left:18px;color:var(--dim);font-size:12.5px}
  body[data-freeze] header{display:none}
</style>
</head>
<body data-theme="light">
<header>
  <div>
    <h1>知是 logo 动效 · 冒孔</h1>
    <p>老鼠先从月亮前探出头，三个孔再从它鼻尖前一个接一个冒出来，沿着弧线越飘越大，像它在想事情。入场约 2.6 秒，之后一直轻轻循环；每一圈都会经过和静态标志完全一样的画面。点图可以重播。</p>
  </div>
  <div class="bar">
    <button id="all">重播</button>
    <button id="slow" aria-pressed="false">慢放 ×0.5</button>
    <button id="theme">深色背景</button>
    <label><input type="checkbox" id="rm">减少动态效果</label>
  </div>
</header>
<main id="cards"></main>
<script>
const P = __PARTS__;
const [CX, CY, R] = P.moon, EYE = P.eye, NOSE = P.nose, HOLES = P.holes;
const clamp = (v,a=0,b=1)=>v<a?a:v>b?b:v;
const seg = (t,a,b)=>clamp((t-a)/(b-a));
const eOut = t=>1-Math.pow(1-t,3);
const eBack = (t,s=1.6)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);
const n2 = v=>Math.round(v*100)/100;
const TAU = Math.PI*2;
function build(id){
  const h = HOLES.map((c,i)=>`<circle data-h="${i}" cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#000"/>`).join('');
  return `<svg viewBox="0 0 1000 1000" role="img" aria-label="知是">
  <defs>
    <clipPath id="${id}-disk"><circle cx="${CX}" cy="${CY}" r="${R}"/></clipPath>
    <mask id="${id}-cheese" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="1400">
      <rect x="-200" y="-200" width="1400" height="1400" fill="#fff"/>
      <g class="mcut"><path d="${P.mouse}" fill="#000"/></g>
      <g class="holes">${h}</g>
    </mask>
  </defs>
  <g class="wheel">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="${P.colour}" mask="url(#${id}-cheese)"/>
    <g clip-path="url(#${id}-disk)"><g class="mparts"><circle class="eye" cx="${EYE[0]}" cy="${EYE[1]}" r="${EYE[2]}" fill="${P.colour}"/></g></g>
  </g>
  <g class="crumbs"></g>
</svg>`;
}
function blink(i, period=5200, off=900){
  const k = (i+off)%period;
  if (k>160) return 1;
  return 1-0.9*Math.sin(Math.PI*k/160);
}
// ---------- 冒孔 ----------
const BUBBLE = {
  D:2600,
  frame(S,t,i){
    // Loop: every term below is exactly at rest when i%L==0, so the cycle always passes through the static mark.
    const L=9600, u=i!=null?(i%L)/L:0, live=i!=null;
    const breath=live?0.006*Math.sin(Math.PI*u)**2:0;
    const a=eOut(seg(t,0,320));
    S.wheel(`translate(${CX} ${CY}) scale(${n2(.94+.06*a+breath)}) translate(${-CX} ${-CY})`, a);
    // the mouse rises in front of the moon
    const m=seg(t,280,900);
    S.mouse(0, 480*(1-eBack(m,1.3)));
    // then the holes come out of its snout one after another, each from where the last one is
    HOLES.forEach((c,k)=>{
      const p=seg(t,1000+k*300,1000+k*300+600), from=k?HOLES[k-1]:NOSE, e=eOut(p);
      let r=c[2]*(p<=0?0:eBack(p,2)), x=from[0]+(c[0]-from[0])*e, y=from[1]+(c[1]-from[1])*e;
      if(live){ const d=(u-(0.15+k*0.12))/0.14, w=Math.abs(d)<1?(1+Math.cos(Math.PI*d))/2:0; r*=1+0.07*w; y-=5*w; }
      S.hole(k,r,x,y);
    });
    // at the end of a loop the largest thought lets a small one rise off the moon
    if(live){
      const b=seg(u,0.72,0.95), top=HOLES[HOLES.length-1];
      if(b>0&&b<1) S.crumbs([[top[0]+6*Math.sin(b*TAU), top[1]-top[2]-40-150*eOut(b), 16*(1-.4*b), .8*Math.sin(Math.PI*b)]]);
    }
    S.eye(live?blink(i,4800,900):1);
  }
};

// ---------- 把 frame 的调用落到某一张 SVG 上 ----------
function stageFor(svg){
  const q=s=>svg.querySelector(s), qa=s=>[...svg.querySelectorAll(s)];
  const wheel=q('.wheel'), holes=qa('[data-h]'), mcut=q('.mcut'), mparts=q('.mparts'), eye=q('.eye'), crumbsG=q('.crumbs');
  const set=(el,k,v)=>{ v=String(v); if(el.getAttribute(k)!==v) el.setAttribute(k,v); };
  return {
    reset(){
      set(wheel,'transform',''); set(wheel,'opacity',1);
      holes.forEach((h,k)=>{ set(h,'r',HOLES[k][2]); set(h,'cx',HOLES[k][0]); set(h,'cy',HOLES[k][1]); });
      set(eye,'transform',''); crumbsG.innerHTML='';
      [mcut,mparts].forEach(g=>set(g,'transform',''));
    },
    wheel(tr,op){ set(wheel,'transform',tr); set(wheel,'opacity',n2(op)); },
    hole(k,r,x,y){ set(holes[k],'r',n2(Math.max(0,r))); set(holes[k],'cx',n2(x)); set(holes[k],'cy',n2(y)); },
    mouse(dx,dy){
      const tr=(dx||dy)?`translate(${n2(dx)} ${n2(dy)})`:'';
      [mcut,mparts].forEach(g=>set(g,'transform',tr));
    },
    eye(s){ set(eye,'transform',s>=.999?'':`translate(${EYE[0]} ${EYE[1]}) scale(1 ${n2(s)}) translate(${-EYE[0]} ${-EYE[1]})`); },
    crumbs(list){
      crumbsG.innerHTML=list.map(([x,y,r,o])=>`<circle cx="${n2(x)}" cy="${n2(y)}" r="${n2(r)}" fill="${P.colour}" opacity="${n2(o)}"/>`).join('');
    }
  };
}

// 调试用：?sheet=100,400,... 把这些时刻的画面排成一行
const params=new URLSearchParams(location.search);
if(params.has('sheet')){
  const ts=params.get('sheet').split(',').map(Number), SZ=+(params.get('sz')||118);
  document.querySelectorAll('header,main').forEach(e=>e.remove());
  if(params.get('theme')==='dark') document.body.dataset.theme='dark';
  const row=document.createElement('div'); row.style.cssText='display:flex;gap:4px;align-items:center;padding:8px';
  row.innerHTML=ts.map((t,k)=>'<div style="width:'+SZ+'px;text-align:center;font-size:10px;color:#999">'+build('s'+k).replace('<svg ','<svg style="width:'+SZ+'px;height:'+SZ+'px;overflow:visible" ')+'<br>'+t+'</div>').join('');
  document.body.appendChild(row);
  [...row.querySelectorAll('svg')].forEach((svg,k)=>{ const S=stageFor(svg); S.reset(); const t=ts[k]; BUBBLE.frame(S,Math.min(t,BUBBLE.D),t>=BUBBLE.D?t-BUBBLE.D:null); });
  throw 'sheet';
}
// ---------- 播放 ----------
const $=s=>document.querySelector(s);
const FREEZE=params.has('t')?+params.get('t'):null;
if(params.get('theme')==='dark') document.body.dataset.theme='dark';
if(FREEZE!=null) document.body.dataset.freeze='1';
const reduced=()=>$('#rm').checked||matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed=1;
const card=document.createElement('section'); card.className='card';
card.innerHTML=`<div class="stage" title="点一下重播">${build('c')}</div>
  <p>之后循环：一道很慢的波从小孔到大孔依次走过，孔轻轻鼓起、上浮一点，整轮月亮跟着呼吸；波走到最大的孔，冒出一个小泡升起、淡掉；老鼠偶尔眨眼。</p>`;
$('#cards').appendChild(card);
const S=stageFor(card.querySelector('svg'));
const pl={clock:0,last:0,draw(){ S.reset(); if(reduced()) return; const t=pl.clock; BUBBLE.frame(S,Math.min(t,BUBBLE.D),t>=BUBBLE.D?t-BUBBLE.D:null); },
  replay(){ pl.clock=0; pl.last=0; }};
card.querySelector('.stage').addEventListener('click',pl.replay);
if(FREEZE!=null){ pl.clock=FREEZE; pl.draw(); }
else{
  const tick=now=>{ const dt=pl.last?Math.min(now-pl.last,64):0; pl.last=now; pl.clock+=dt*speed; pl.draw(); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pl.last=0; });
}
$('#all').onclick=()=>pl.replay();
$('#slow').onclick=e=>{ speed=speed===1?.5:1; e.target.setAttribute('aria-pressed',speed!==1); };
$('#theme').onclick=e=>{ const dk=document.body.dataset.theme==='dark'; document.body.dataset.theme=dk?'light':'dark'; e.target.textContent=dk?'深色背景':'浅色背景'; };
$('#rm').onchange=()=>pl.replay();
</script>
</body>
</html>
