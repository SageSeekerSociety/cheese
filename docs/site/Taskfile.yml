version: '3'

tasks:
  install:
    desc: Install the docs site's build dependencies
    cmds:
      - npm ci --no-audit --no-fund
    sources:
      - package-lock.json

  build:
    desc: Build the docs site (docs/manual → frontend/public/docs; OUT=<dir> to build elsewhere)
    deps: [install]
    cmds:
      - npm run build

  test:
    desc: Drive the interactive demos in a DOM (builds first; happy-dom comes from frontend/node_modules)
    cmds:
      - npm test

  diagrams:
    desc: Regenerate the archify diagrams under diagrams/ (needs a local archify checkout)
    cmds:
      - npm run diagrams
