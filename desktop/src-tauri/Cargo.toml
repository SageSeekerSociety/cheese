[package]
name = "cheese-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros"] }
url = "2"
tauri-plugin-window-state = "2.4.1"
notify-rust = "4.18.1"
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4.10"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tauri-plugin-autostart = "2.5.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
