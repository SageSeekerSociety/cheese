<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheese</title>
    <!--
      The app's own first page. It is on screen the moment the window opens,
      finds out whether the server answers, and then hands the window to the
      server's page. The tile is the rail's home slot, larger, and it must stay
      pixel-identical to the boot splash in frontend/index.html: the page that
      replaces this one paints that splash as its first frame, and any
      difference shows as a jump at the moment of the switch.
    -->
    <script>
      (function () {
        var theme = window.__CHEESE_APP__ && window.__CHEESE_APP__.theme;
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* --canvas, --ink and --muted of frontend/src/style.css, light and dark.
         The theme is the one last picked in the web app (main.rs hands it over);
         "system" follows the system. */
      :root {
        color-scheme: light;
        --canvas: #f7f8fa;
        --ink: #16181b;
        --muted: #6b6f76;
        --line-2: #e2e3e6;
        --surface: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --canvas: #141517;
          --ink: #f1f2f4;
          --muted: #9ea2a9;
          --line-2: #3a3e45;
          --surface: #1b1d20;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #141517;
        --ink: #f1f2f4;
        --muted: #9ea2a9;
        --line-2: #3a3e45;
        --surface: #1b1d20;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--canvas);
        font:
          14px/20px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans SC",
          system-ui,
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        perspective: 900px;
      }
      /* Brand paint: the same literals as the rail's home tile, in both themes. */
      .tile {
        width: 112px;
        height: 112px;
        border-radius: 18.67px;
        background: #ffa20f;
        position: relative;
        transition: filter 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .tile svg {
        position: absolute;
        inset: 18.67px;
        width: 74.67px;
        height: 74.67px;
      }
      .offline .tile {
        filter: grayscale(1) opacity(0.45);
      }
      .note {
        position: fixed;
        left: 50%;
        top: calc(50% + 88px);
        transform: translateX(-50%);
        width: min(320px, 90%);
        display: grid;
        justify-items: center;
        gap: 4px;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          visibility 0s 220ms;
      }
      .offline .note {
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .note b {
        color: var(--ink);
        font-size: 15px;
        line-height: 21px;
        font-weight: 600;
      }
      .note span {
        color: var(--muted);
        font-size: 13px;
        line-height: 19px;
      }
      .note button {
        margin-top: 8px;
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 5px 16px;
        cursor: pointer;
      }
      .note button:focus-visible {
        outline: 2px solid #f57f17;
        outline-offset: 2px;
      }
    </style>
  </head>
  <!-- Where the title bar is drawn over the page, the page is what moves the window. -->
  <body data-tauri-drag-region="deep">
    <div class="stage">
      <div class="tile" id="tile">
        <svg viewBox="0 0 1000 1000" aria-hidden="true">
          <mask id="boot-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect width="1000" height="1000" fill="#fff" />
            <g fill="#000">
              <path d="M156.6 810.9Q167.7 793.7 186.8 775.5Q193.7 768.8 210.1 757.9Q210.2 757.8 210.3 757.8L212.2 756.5L212.2 756.5Q212.3 756.5 212.3 756.5Q213.4 755.7 216.4 754Q216.5 753.9 216.6 753.9Q229.2 746.5 233.3 741Q233.3 741 233.4 741Q233.4 741 233.4 741Q240.4 731.5 239.7 715.8Q221.6 715.8 208.2 712.2Q208.1 712.2 208.1 712.2Q193.6 708.3 178.7 698.8Q178.7 698.7 178.6 698.7C169.1 692.6 160 684.6 152.5 675Q152.4 675 152.4 674.9C144.9 665.4 138.9 654.5 135.6 642.5Q135.5 642.4 135.5 642.3C126.7 610.1 130.8 577.2 154.2 554.4Q154.4 554.2 154.6 554Q171.6 537.7 193.4 533.8Q212.5 530.4 239.7 536.2Q238.4 533.4 237.7 530.6Q236.3 524.6 238.2 518.7Q238.7 517.3 239.3 516C241.3 511.8 244.6 508.1 248.9 504.9Q249 504.8 249.1 504.8Q249.1 504.8 249.2 504.7C262.7 494.9 297.9 504.6 312.3 513.1Q330.6 524.1 340.3 534.8Q346.1 541.2 352.6 552.9C355.7 558.4 358.8 564 364.1 570.2Q398.7 568.2 416.9 568.7L416.9 568.7Q417.2 568.7 417.3 568.7Q425.4 568.9 431.6 568.9Q461.7 568.9 490.5 570.6Q496.1 570.9 498.1 575.6C499.7 580.2 500.3 585.6 500.3 591.3Q500.3 603.6 496.7 621.9C494.9 630.9 492.6 639.6 490.2 646.9Q490.2 647 490.1 647.1Q490.1 647.2 490.1 647.3C487.7 654.6 485.4 660.5 483.5 663.8Q471.4 685.9 432.6 732.7Q409.2 760.8 401.6 808.4Q397.2 836.2 398.8 861.3Q402.2 913.6 408.4 935C409.6 939.3 411.1 943.8 412.7 948.5Q413.7 951.9 412.1 955.1Q410.5 958.4 407 959.6Q405.3 960.2 403.5 960.1C370.3 953.1 338.3 942.7 308 929.1Q307.6 928.9 307.2 928.7Q306.7 928.6 306.4 928.4C249.9 902.8 199.4 866.4 157.5 821.8Q155.5 819.6 155.2 816.6Q154.9 813.5 156.6 810.9Z" />
              <circle cx="641.3" cy="602.7" r="34" />
              <circle cx="743" cy="500.7" r="56" />
              <circle cx="712.7" cy="290.9" r="92" />
            </g>
          </mask>
          <g fill="#23242a">
            <circle cx="500" cy="500" r="470" mask="url(#boot-holes)" />
            <circle cx="399" cy="618" r="14.1" />
          </g>
        </svg>
      </div>
    </div>
    <div class="note" role="status">
      <b>无法连接服务器</b>
      <span>检查网络连接，恢复后会自动重试</span>
      <button type="button" id="retry">重试</button>
    </div>
    <script>
      (function () {
        // Set by the app (main.rs) before this page runs.
        var ORIGIN = window.__CHEESE_APP__.origin;
        // The page to open once the server answers: the one a cheese:// link
        // named (links.rs), passed at launch or on this page's address.
        var start =
          new URLSearchParams(location.search).get("start") ||
          window.__CHEESE_APP__.start ||
          "/";
        if (start.charAt(0) !== "/" || start.charAt(1) === "/") start = "/";
        // How long the server has to answer before this counts as offline, and
        // how often it is asked again after that.
        var PATIENCE = 8000;
        var RETRY_EVERY = 5000;
        // The tile holds still for a moment that is too short to wait through.
        var STILL_FOR = 400;

        var tile = document.getElementById("tile");
        var holes = [].slice.call(
          document.querySelectorAll("#boot-holes circle"),
        );
        var radii = holes.map(function (c) {
          return +c.getAttribute("r");
        });
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

        // While it waits, the holes breathe one after another (cheese holes are
        // the bubbles of its ripening). amp eases between 0, the rail's still
        // tile, and 1.
        var amp = 0;
        var want = 0;
        var aimX = 0;
        var aimY = 0;
        var tiltX = 0;
        var tiltY = 0;
        var raf = 0;
        var t0 = performance.now();
        var settled = null;

        function frame(now) {
          raf = 0;
          var t = (now - t0) / 1000;
          amp += (want - amp) * 0.06;
          tiltX += (aimX - tiltX) * 0.08;
          tiltY += (aimY - tiltY) * 0.08;
          var moving =
            Math.abs(want - amp) > 0.002 ||
            Math.abs(aimX - tiltX) + Math.abs(aimY - tiltY) > 0.001;
          if (!moving) {
            amp = want;
            tiltX = aimX;
            tiltY = aimY;
          }
          var a = reduced.matches ? 0 : amp;
          for (var i = 0; i < holes.length; i++) {
            var k = 0.5 + 0.5 * Math.sin(t * 2.6 - i * 0.8);
            holes[i].setAttribute("r", radii[i] * (1 - 0.22 * a * (1 - k)));
          }
          tile.style.transform =
            "rotateX(" + -tiltY * 8 + "deg) rotateY(" + tiltX * 8 + "deg)";
          if (moving || want > 0) raf = requestAnimationFrame(frame);
          else if (settled) {
            var done = settled;
            settled = null;
            done();
          }
        }
        function kick() {
          if (!raf) raf = requestAnimationFrame(frame);
        }
        // Resolves once the tile is back to the still pose the next page opens with.
        function settle() {
          want = 0;
          aimX = aimY = 0;
          return new Promise(function (resolve) {
            settled = resolve;
            kick();
          });
        }

        if (!reduced.matches) {
          document.addEventListener("pointermove", function (e) {
            aimX = (e.clientX / innerWidth) * 2 - 1;
            aimY = (e.clientY / innerHeight) * 2 - 1;
            kick();
          });
          document.addEventListener("pointerleave", function () {
            aimX = aimY = 0;
            kick();
          });
        }

        // An opaque answer is enough: any response at all means the server is up.
        function reachable() {
          var controller = new AbortController();
          var timer = setTimeout(function () {
            controller.abort();
          }, PATIENCE);
          return fetch(ORIGIN + "/", {
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal,
          }).then(
            function () {
              clearTimeout(timer);
              return true;
            },
            function () {
              clearTimeout(timer);
              return false;
            },
          );
        }

        var trying = false;
        var retryTimer = 0;
        function attempt() {
          if (trying) return;
          trying = true;
          clearTimeout(retryTimer);
          var waiting = setTimeout(function () {
            document.body.classList.remove("offline");
            want = 1;
            kick();
          }, STILL_FOR);
          reachable().then(function (up) {
            clearTimeout(waiting);
            if (up) {
              settle().then(function () {
                location.replace(ORIGIN + start);
              });
              return;
            }
            trying = false;
            want = 0;
            kick();
            document.body.classList.add("offline");
            retryTimer = setTimeout(attempt, RETRY_EVERY);
          });
        }

        document.getElementById("retry").addEventListener("click", attempt);
        window.addEventListener("online", attempt);
        attempt();
      })();
    </script>
  </body>
</html>
