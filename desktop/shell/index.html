<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheese</title>
    <!--
      The app's own first page. It is on screen the moment the window opens,
      finds out whether the server answers, and then hands the window to the
      server's page. The tile is the rail's home slot, larger, and it must stay
      pixel-identical to the boot splash in frontend/index.html: the page that
      replaces this one paints that splash as its first frame, and any
      difference shows as a jump at the moment of the switch.
    -->
    <style>
      :root {
        color-scheme: light dark;
        /* --canvas, --ink and --muted of frontend/src/style.css, light and dark. */
        --canvas: #f7f8fa;
        --ink: #16181b;
        --muted: #6b6f76;
        --line-2: #e2e3e6;
        --surface: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #141517;
          --ink: #f1f2f4;
          --muted: #9ea2a9;
          --line-2: #3a3e45;
          --surface: #1b1d20;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--canvas);
        font:
          14px/20px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans SC",
          system-ui,
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        perspective: 900px;
      }
      /* Brand paint: the same literals as the rail's home tile, in both themes. */
      .tile {
        width: 112px;
        height: 112px;
        border-radius: 18.67px;
        background: linear-gradient(var(--flow, 180deg), #ff9500, #ffe600);
        position: relative;
        transition: filter 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .tile svg {
        position: absolute;
        inset: 18.67px;
        width: 74.67px;
        height: 74.67px;
      }
      .offline .tile {
        filter: grayscale(1) opacity(0.45);
      }
      .note {
        position: fixed;
        left: 50%;
        top: calc(50% + 88px);
        transform: translateX(-50%);
        width: min(320px, 90%);
        display: grid;
        justify-items: center;
        gap: 4px;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          visibility 0s 220ms;
      }
      .offline .note {
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .note b {
        color: var(--ink);
        font-size: 15px;
        line-height: 21px;
        font-weight: 600;
      }
      .note span {
        color: var(--muted);
        font-size: 13px;
        line-height: 19px;
      }
      .note button {
        margin-top: 8px;
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 5px 16px;
        cursor: pointer;
      }
      .note button:focus-visible {
        outline: 2px solid #f57f17;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>

    </div>
    <div class="note" role="status">
      <b>无法连接服务器</b>
      <span>检查网络连接，恢复后会自动重试</span>
      <button type="button" id="retry">重试</button>
    </div>
    <script>
      (function () {
        // Set by the app (main.rs) before this page runs.
        var ORIGIN = window.__CHEESE_ORIGIN__;
        // How long the server has to answer before this counts as offline, and
        // how often it is asked again after that.
        var PATIENCE = 8000;
        var RETRY_EVERY = 5000;
        // The tile holds still for a moment that is too short to wait through.
        var STILL_FOR = 400;

        var tile = document.getElementById("tile");
        var holes = [].slice
          .call(document.querySelectorAll("#boot-holes circle"))
          .slice(0, 8);
        var radii = holes.map(function (c) {
          return +c.getAttribute("r");
        });
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

        // While it waits, the holes breathe one after another (cheese holes are
        // the bubbles of its ripening) and the gradient turns slowly. amp eases
        // between 0, the rail's still tile, and 1.
        var amp = 0;
        var want = 0;
        var aimX = 0;
        var aimY = 0;
        var tiltX = 0;
        var tiltY = 0;
        var raf = 0;
        var t0 = performance.now();
        var settled = null;

        function frame(now) {
          raf = 0;
          var t = (now - t0) / 1000;
          amp += (want - amp) * 0.06;
          tiltX += (aimX - tiltX) * 0.08;
          tiltY += (aimY - tiltY) * 0.08;
          var moving =
            Math.abs(want - amp) > 0.002 ||
            Math.abs(aimX - tiltX) + Math.abs(aimY - tiltY) > 0.001;
          if (!moving) {
            amp = want;
            tiltX = aimX;
            tiltY = aimY;
          }
          var a = reduced.matches ? 0 : amp;
          for (var i = 0; i < holes.length; i++) {
            var k = 0.5 + 0.5 * Math.sin(t * 2.6 - i * 0.8);
            holes[i].setAttribute("r", radii[i] * (1 - 0.22 * a * (1 - k)));
          }
          tile.style.setProperty(
            "--flow",
            180 +
              0.55 * a * (60 * Math.sin(t * 1.3) + 40 * Math.sin(t * 0.7)) +
              "deg",
          );
          tile.style.transform =
            "rotateX(" + -tiltY * 8 + "deg) rotateY(" + tiltX * 8 + "deg)";
          if (moving || want > 0) raf = requestAnimationFrame(frame);
          else if (settled) {
            var done = settled;
            settled = null;
            done();
          }
        }
        function kick() {
          if (!raf) raf = requestAnimationFrame(frame);
        }
        // Resolves once the tile is back to the still pose the next page opens with.
        function settle() {
          want = 0;
          aimX = aimY = 0;
          return new Promise(function (resolve) {
            settled = resolve;
            kick();
          });
        }

        if (!reduced.matches) {
          document.addEventListener("pointermove", function (e) {
            aimX = (e.clientX / innerWidth) * 2 - 1;
            aimY = (e.clientY / innerHeight) * 2 - 1;
            kick();
          });
          document.addEventListener("pointerleave", function () {
            aimX = aimY = 0;
            kick();
          });
        }

        // An opaque answer is enough: any response at all means the server is up.
        function reachable() {
          var controller = new AbortController();
          var timer = setTimeout(function () {
            controller.abort();
          }, PATIENCE);
          return fetch(ORIGIN + "/", {
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal,
          }).then(
            function () {
              clearTimeout(timer);
              return true;
            },
            function () {
              clearTimeout(timer);
              return false;
            },
          );
        }

        var trying = false;
        var retryTimer = 0;
        function attempt() {
          if (trying) return;
          trying = true;
          clearTimeout(retryTimer);
          var waiting = setTimeout(function () {
            document.body.classList.remove("offline");
            want = 1;
            kick();
          }, STILL_FOR);
          reachable().then(function (up) {
            clearTimeout(waiting);
            if (up) {
              settle().then(function () {
                location.replace(ORIGIN + "/");
              });
              return;
            }
            trying = false;
            want = 0;
            kick();
            document.body.classList.add("offline");
            retryTimer = setTimeout(attempt, RETRY_EVERY);
          });
        }

        document.getElementById("retry").addEventListener("click", attempt);
        window.addEventListener("online", attempt);
        attempt();
      })();
    </script>
  </body>
</html>
