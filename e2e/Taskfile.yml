version: '3'

tasks:
  install:
    desc: Install E2E test dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml

  test:
    desc: Run E2E tests
    deps: [install]
    cmds:
      - pnpm exec playwright test

  test:headed:
    desc: Run E2E tests with browser visible
    deps: [install]
    cmds:
      - pnpm exec playwright test --headed

  test:debug:
    desc: Debug E2E tests with inspector
    deps: [install]
    cmds:
      - pnpm exec playwright test --debug

  report:
    desc: Show last test report
    cmds:
      - pnpm exec playwright show-report
