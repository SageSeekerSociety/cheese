# Project Domain Paths

/projects:
  get:
    summary: List projects
    operationId: listProjects
    tags: [Projects]
    parameters:
      - name: q
        in: query
        description: Search keyword
        schema:
          type: string
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Projects list
  post:
    summary: Create project
    operationId: createProject
    tags: [Projects]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateProjectRequest'
    responses:
      '201':
        description: Project created

/projects/{projectId}:
  get:
    summary: Get project details
    operationId: getProject
    tags: [Projects]
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
    responses:
      '200':
        description: Project details
  put:
    summary: Update project
    operationId: updateProject
    tags: [Projects]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateProjectRequest'
    responses:
      '200':
        description: Project updated
  delete:
    summary: Delete project
    operationId: deleteProject
    tags: [Projects]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
    responses:
      '204':
        description: Project deleted

/projects/{projectId}/members:
  get:
    summary: List project members
    operationId: listProjectMembers
    tags: [Projects]
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Members list
  post:
    summary: Add project member
    operationId: addProjectMember
    tags: [Projects]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: integer
                format: int64
              role:
                type: string
                enum: [ADMIN, MEMBER]
            required:
              - userId
    responses:
      '201':
        description: Member added

/projects/{projectId}/members/{userId}:
  put:
    summary: Update member role
    operationId: updateProjectMemberRole
    tags: [Projects]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
      - $ref: '../../common/parameters.yaml#/UserId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              role:
                type: string
                enum: [ADMIN, MEMBER]
    responses:
      '200':
        description: Role updated
  delete:
    summary: Remove project member
    operationId: removeProjectMember
    tags: [Projects]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/ProjectId'
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '204':
        description: Member removed
