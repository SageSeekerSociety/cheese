services:
  db:
    image: postgres:17
    container_name: cheesex-pg
    environment:
      POSTGRES_USER: cheesex
      POSTGRES_PASSWORD: cheesex
      POSTGRES_DB: cheesex
    ports:
      - "5433:5432"
    volumes:
      - cheesex-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheesex -d cheesex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cheesex-pg-data:
