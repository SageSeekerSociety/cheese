name: DB backup freshness check

# Daily guard that the scheduled DB backups (systemd timer on the dev box) are
# actually running. Runs on the on-box self-hosted runner and reads the marker
# db-backup.sh writes on each success; a stale marker fails the job, and GitHub
# emails repo admins. Note: this can't detect a fully-down box (the runner would
# be down too) — that needs an external uptime check.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch: {}

jobs:
  check:
    runs-on: [self-hosted, cheese-dev]
    timeout-minutes: 5
    steps:
      - name: Fail if the latest DB backup is stale (> 26h)
        run: |
          MARK=/home/nictheboy/backups/.last-success
          if [ ! -f "$MARK" ]; then
            echo "::error::no backup success marker ($MARK) — has a backup ever run?"
            exit 1
          fi
          last="$(cat "$MARK")"; now="$(date +%s)"; age_h=$(( (now - last) / 3600 ))
          echo "last successful DB backup: ${age_h}h ago"
          if [ "$age_h" -gt 26 ]; then
            echo "::error::DB backup is stale (${age_h}h > 26h) — check the cheese-db-backup.timer"
            exit 1
          fi
          echo "DB backup is fresh (${age_h}h)"
