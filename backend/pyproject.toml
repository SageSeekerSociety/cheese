[project]
name = "cheesex-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "claude-agent-sdk>=0.2.101",
    "fastapi>=0.137.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]
