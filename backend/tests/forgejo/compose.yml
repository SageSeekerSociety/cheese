services:
  snapshots:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    ports:
      - "127.0.0.1:${FORGEJO_TEST_S3_PORT:-33286}:9000"
    environment:
      MINIO_ROOT_USER: e2e-snapshots
      MINIO_ROOT_PASSWORD: e2e-snapshots-secret
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.9-rootless
    ports:
      - "127.0.0.1:${FORGEJO_TEST_PORT:-33086}:3000"
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REGISTER_EMAIL_CONFIRM: "false"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:${FORGEJO_TEST_PORT:-33086}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      # The integration relay listens on the host, outside this container.
      FORGEJO__webhook__ALLOWED_HOST_LIST: host.docker.internal
    volumes:
      - data:/var/lib/gitea
volumes:
  data:
