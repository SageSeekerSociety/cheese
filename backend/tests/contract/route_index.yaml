owners:
  admin: "Platform admin membership and allow-list; domain/admin/AdminService, not every /admin route business domain."
  usage.report: "What a team or a person used of their credits this month, as ratios for members; domain/usage/report.py."
  usage.plans: "Credit plans, which plan each team is on, credits administrators issue, and their audit; domain/usage/plans.py and ledger.py."
  agent.models: "AI model catalogue, gateway project budgets and audit; domain/agent/gateway_admin.py and gateway_models.py."
  agent.execution: "Agent session execution/control/diagnostics; domain/agent runtime and domain/agent_session. HTTP diagnostics are assembled in app/main.py."
  agent.types: "Agent type catalogue; domain/agent_type/library.py."
  agent.instances: "Project agent identities/configuration; domain/agent_instance/services.py and configuration.py."
  agent.credentials: "Off-platform project agent credentials and generation revocation; domain/agent_credential/services.py."
  agent.llm: "Model admission, budget metering/proxy and subscription tunnel; domain/agent budget_proxy/chat/supply plus core subscription meter. This is the existing transport responsibility."
  compute.availability: "Compute pool catalogue and node availability; domain/agent/market.py and work-runner active load (market.list_nodes)."
  machine: "Cloud machines, project supply and execution lease lifecycle; domain/machine/services.py, supply.py and session_work.py."
  machine.live: "Signal to a team's open pages that its machines changed, naming the projects to read again; domain/machine/live.py (team_channel, note_change, announce_changes), written by domain/machine/repositories.py and runner.py and announced by machines.py after commit."
  device: "User/team hosted-device enrollment, session links and screen streams; domain/device/service.py, owner_reads.py and domain/agent/device_hub.py."
  local_fs: "User-selected local-directory grants and access audit; domain/local_fs services/enforcement."
  review: "Accept cards, reviewer decisions and PR readiness/merge; domain/review/AcceptService. Route owns request composition."
  review.delivery: "Published accept-card artifact delivery; domain/review card ownership composed with project artifacts/library snapshots in accept route."
  room_task: "Room tasks and their lifecycle/rail presentation; domain/room_task/TaskService and presentation.py. Not legacy external domain/task."
  room_task.awaiting: "Cross-room work waiting for caller action; awaiting route composes room_task, review, block and delivery reads; the route is the assembly owner."
  block: "Room blocks and reactions; domain/block editing/documents. Routes own broadcasting."
  topic: "Canonical rooms and room hierarchy/read markers/title/archive; domain/topic/TopicService and related naming/retire queries."
  topic.membership: "Room participant roster and roles; domain/topic_membership/TopicMemberService."
  topic.chat: "Room messaging/live chat relay; domain/agent/ChatService and topic/member identity, with route owning delivery/broadcast ordering."
  delivery: "Room delivery timer requests and same-handle note dispatch; domain/delivery timer/addressing, composed by room route."
  documents: "Office/spreadsheet conversion, revisions and editor callbacks; domain/documents editor/convert/revisions/spreadsheet."
  living_doc: "Documents: canonical journal, receipts, history, restoration and comment threads; domain/living_doc/DocumentJournal and living_doc/comments, with block/document persistence. Versions are recorded only by the collaboration service's store (api/doc_store.py); other writers go through living_doc/collab.replace."
  room.files: "Room retained files and shown-source composition; domain/project/room_files.py plus block/shown. The route owns composing file save and shown-block broadcast."
  project: "Project lifecycle, association, ownership and repository settings; domain/project/ProjectService and project forge/protection. Route retains request assembly."
  project.rail: "Project rail assembly in projects.list_project_tasks: project_reader -> TaskService -> latest_cards_by_task -> beats -> asked -> one now -> presentation. Domain owners of facts remain room_task/review/block; v6 says assembly owner is the route."
  project.artifacts: "Published project artifact catalogue/version comparisons; domain/project/artifacts.py, composed with library/preview/repository bytes by the route."
  project.environment: "Project/room execution environment and recovery; domain/project/environment.py and environment_recovery.py, composed with machine/device state."
  project.export: "Caller-visible offline project export; domain/project/export.create_archive owns archive construction and delegated auth."
  project.skills: "Project-owned reusable skills/revisions; domain/project_skill/ProjectSkillService."
  skill.bundle: "Content-addressed delivery of a session's shipped platform skills plus this project's own skills to the launching machine; domain/project_skill/service.session_skill_bundle and the device launcher cache. Derived content, not new business state."
  project.context: "Project context search assembly; project_context route composes filtered room/block/library/task queries using domain/search bm25. No new cross-domain service is invented."
  project.run_config: "Project default model/compute choices and tier policy; project route composes existing agent compute configs, policy and machine/device services."
  membership: "Project members and invitations; domain/membership/MemberService, InvitationService and roster."
  library: "Project library files and source descriptions; domain/library records and file service."
  memory: "Agent/person memory entries and memory files; domain/memory stores/files. Private read/write boundaries stay distinct in notes."
  notification: "User/project inbox notifications and live notice delivery; domain/notification services/live/push."
  dashboard: "Viewer-filtered project/space/person dashboard assembly; domain/dashboard/DashboardService."
  feedback: "Feedback visibility, support/comments and proposals; domain/feedback/FeedbackService, proposals/shipping."
  feature_stats: "Feature usage catalogue and reports; domain/feature_stats registry/stats."
  platform_stats: "Platform usage/performance/product/pipeline/integration reports; domain/platform_stats services."
  ratchet: "Ratchet board ingestion and state; domain/ratchet board/store/ingest."
  space.review: "Platform review of spaces; domain/space/review_service.py."
  space.materials: "A board's shared material library and its two visibility tiers; domain/space/material_service.py over the material rows domain/materials owns. Bytes leave only through the permission-checked download route; the material url never appears in a response."
  integration: "Personal and room mail/Feishu connections, drafts and OAuth callback; domain/integration/IntegrationService."
  remote_mcp: "Declared remote MCP connection, per-project secrets and forwarding; domain/remote_mcp service/oauth/upstream."
  fetch: "Outbound URL retrieval; domain/fetch service/guard/layers."
  doc_agent: "The AI teammate answering from a document (the room's agents for a room's document, the project's own for one in no room) — a comment thread's session, or a selection box's — domain/agent/document orchestration over domain/agent/session_host and living_doc/collab."
  docs_site: "Manual/dev-doc access, assistant/search and visit attribution; domain/docs_site access/library/visits."
  repository.transport: "Task workspace Git and snapshots; git_http/workspace routes compose domain/repository forge_files and room_task snapshot/checkout services. Existing route assembly owns transport."
  forge.transport: "Forge capability transport and token leases; forge_token route composes domain/project/forge, agent GitHub/Forgejo token adapters."
  github.binding: "GitHub account/install/repository association; domain/oauth with project forge installation records, assembled by GitHub routes."
  preview: "Room app preview transport and viewer grants; api/preview_host and domain/agent preview_hub/tunnel. Existing host middleware is the content-host boundary."
  site: "Project static site publication and grants; domain/site/services.py and hosting.py."
  webhook: "Room webhook token receive/dispatch; domain/webhook service."
  routine: "Room automation rules and runs; domain/routine/RoutineService and schedule."
  user.sign_in: "Desktop browser-to-app login handoff and sessions; domain/user session issue seam invoked by app_sign_in route."
  legal: "Versioned legal text and user consents; domain/legal documents/services."
  frontend.error.intake: "Browser frontend error intake; domain/frontend_log intake/fingerprint. frontend_log route composes block event persistence and alerting."
  backend.error.intake: "Backend unhandled-error intake and room attribution; domain/backend_log.record/intake."
  core.health: "Backend health/readiness/metrics/build visibility; core metrics/config plus app and health-route process probes."
  core.upload.delivery: "Local uploaded asset delivery; core storage settings and uploads._safe_path/inert response. No fabricated upload business domain."
  api.documentation: "FastAPI generated schema and Swagger/ReDoc documentation endpoints, assembled by FastAPI application."
  installer: "Machine CLI/runtime distribution; domain/machine claude/pi/toolchain distribution and current sandbox CLI source."
  sandbox.maintenance: "Sandbox pool storage sweep/journal maintenance; existing domain/agent compute pool, not new business state."
  assistant: "Personal task assistant conversations; domain/assistant service; route composes legacy task visibility and personal usage."
  answers: "Community answers and reactions; domain/answers services, composed with discussion reactions."
  attachment: "General uploaded attachments and access-controlled delivery; domain/attachment/AttachmentService, composed with task attachment visibility."
  avatars: "Account avatar asset catalogue and image delivery; domain/avatars/AvatarService."
  comments: "Community comments/reactions; domain/comments/CommentService."
  groups: "Learning groups, study targets and question curation; domain/groups/GroupService."
  knowledge: "Team knowledge library and votes; domain/knowledge/KnowledgeService."
  materials.bundles: "Curated learning-material bundles; domain/materials/MaterialBundleService, not project artifact catalogues."
  materials: "Uploaded learning materials; domain/materials/MaterialService, not runtime local asset delivery."
  questions: "Community questions/discovery/answer invitations; domain/questions services, composed with domain/discussion."
  team.recruitment: "Team recruitment posts; domain/team/recruitment_services.py."
  space.announcements: "Learning board announcements; domain/space/announcement_service.py."
  space.applications: "Learning board creation/review resubmission; domain/space/review_service.py."
  space: "Learning board lifecycle/membership; domain/space/SpaceService. Existing product term learning board maps to the space domain."
  space.analytics: "Learning board participation reports/exports; domain/space analytics_service.py and analytics_view_service.py."
  space.analytics.learning: "Learning board analytics/learning analysis assembly; domain/space analytics_view_service.py and learning_service.py."
  space.learning: "Learning board conversation analysis; domain/space/learning_service.py, filtered through project/room access."
  space.invites: "Learning board membership invitation credentials; domain/space/SpaceService."
  space.publishing: "Learning board member publishing history; domain/space/member_publishing_service.py."
  space.organization: "Learning board categories/groups/management roles; domain/space/SpaceService and tags_service."
  tag: "Content classification labels; domain/tag/TagService."
  task: "External learning-task publication/participation/submission/review; domain/task services. Distinct from domain/room_task."
  team: "Team discovery/membership/shared resources; domain/team/TeamService and membership services."
  user: "Account registration/sign-in/profile/security; domain/user services, composed with OAuth/legal/invite by user route."
  user.activity: "Account profile community question/answer activity; user route composes domain/questions and domain/answers."
  account.admission: "Registration admission credentials; domain/invite/InviteCodeService, managed through platform-admin approval."
  user.2fa: "Account second factor and recovery codes; domain/user credential services."
  user.realname: "Real-name identity and access history; domain/user/realname_services.py."
  passkey: "Passkey credentials/enrollment/assertion; domain/passkey/PasskeyService, composed with user session issue."
  user.password: "Account passwords/recovery; domain/user password/reset services and sessions."
  user.sessions: "Sign-in sessions and trusted browsers; domain/user/sessions.py and trusted_devices.py."
  team.personal_membership: "Personal team requests/invitations/leaving; domain/team membership_services.py and TeamService, composed by users_team routes."
