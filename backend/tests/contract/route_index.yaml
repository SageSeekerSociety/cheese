# Handwritten navigation notes: format/coverage are checked; semantics require source review.
# Fixed source: a5f8812d2c3f1cffc8aca9c387002f092a3ce3e9 plus main ac83786b. Profile: route-index-local-uploads-v1.
# Addresses cover the real regenerated profiled snapshot in scripts/route_index.json.
# Each address is explicit. Catalog ids only share explanatory text; the app never reads this sidecar.
# Preserve duplicate leaf registrations in scripts/route_index.json; a shared address note is not a leaf id.
# Intent still unconfirmed: /debug/turns, /frontend-errors, /market/nodes, question followers,
# cross-user favorites and learning-task team eligibility. Notes record existing gates, not policy approval.
version: 1
auth_entries:
  platform.admin: "PlatformAdminDep -> admin_common.require_platform_admin: ActorResolver.resolve, authz.policy.refuse_management_action (including agent binding), then AdminService.require_admin. Configured root admins and platform_admins are the allow-list. Source: app/api/routes/admin_common.py."
  feedback.admin: "FeedbackAdminDep -> admin_feedback.require_feedback_admin: resolve caller, refuse_management_action with IdentityService agent binding, then FeedbackService.require_admin. Source: app/api/routes/admin_feedback.py."
  actor.project: "ActorResolver.resolve(project_id=...) then authorize_project; app/api/auth.py checks project membership when authz_enforce_topic_access is enabled, with its explicit global sandbox development override. The setting is a real limit, not an unconditional login claim."
  actor.topic: "ActorResolver.resolve in the actual room/project then authorize_topic, directly or through topics._actor_in_place / room_files._in_room. app/api/auth.py applies the roster policy when authz_enforce_topic_access is enabled; ordinary calls do not force that setting. The actor comes from the credential only; no body or query field names it."
  actor.topic.enforced: "ActorResolver.resolve in the actual room/project then authorize_topic(enforce=True); ignores the topic-access kill switch, retaining the resolver global sandbox development override. Source: app/api/auth.py and the cited handler."
  actor.topic.verified: "Room-context ActorResolver.resolve + authorize_topic, plus an explicit authenticated-caller check or require_verified_caller in the cited handler/helper. Topic membership retains the authz_enforce_topic_access setting unless enforce=True is specified there."
  project.reader: "api/place.project_reader: optional authorized_place verifies that the named room belongs to this project then resolves/authorizes that room; otherwise resolves and authorize_project. Room title results are filtered by readable_topic_ids where used. Source: app/api/place.py,48; resolver access setting applies."
  project.manager: "ActorResolver resolves/authorizes project and MemberService.require_manager decides management access. This is the membership service seam, not an admin router-name convention. Source: app/domain/membership/services.py and cited handler."
  project.steward: "Depends(require_project_steward), from agent_credential: verified actor and MemberService.manages(project_id, handle); project owner or owner/admin of its team. An agent with the same standing is admitted. Source: app/api/routes/agent_credential.py."
  project.owner: "projects._project_owner: require_verified_caller, project.owner_handle equality; members who are not owners are refused and outsiders get NotFound. Does not use authorize_project, so the one permitted unarchive write can cross the archive guard. Source: app/api/routes/projects.py."
  project.create: "projects.create_project requires an authenticated caller, who becomes the owner (the body has no owner field), checks _require_team_membership and _require_claim before attaching team/task. These association checks are independent of the topic-access kill switch. Source: app/api/routes/projects.py and its two helpers."
  project.list: "projects.list_projects resolves/rejects failed credentials; handles caller-visible project listing or authorize_team for a team filter and require_verified_caller for the self filter. Source: app/api/routes/projects.py. Different query branches are intentional, not a universal public listing."
  task.visibility: "ActorResolver.resolve then authorize_task delegates visibility to domain/task/TaskVisibilityService, subject to authz_enforce_topic_access; nonexistent task returns the unchanged empty result. Source: app/api/auth.py and projects.projects_for_task."
  team.access: "ActorResolver.resolve then authorize_team requires verified team membership when authz_enforce_topic_access is enabled. Source: app/api/auth.py; cited handler."
  artifact.keeper: "projects_artifacts._artifact_keeper: ProjectService.get_or_404, ActorResolver.require_verified_caller(project_id), authorize_project. Index records those concrete checks; the helper human-only comment is not treated as a separate implemented policy. Source: app/api/routes/projects_artifacts.py."
  library.keeper: "library._library_keeper: ProjectService.get_or_404, require_verified_caller(project_id), authorize_project. The index names implemented checks rather than granting a new human/agent category. Source: app/api/routes/library.py."
  review.task: "accept._task_actor: resolve using task room/project, authorize_topic, explicitly require authenticated actor and TaskService.require_in_room. AcceptService decides filing/readiness/reviewer admission for the operation. Source: app/api/routes/accept.py; domain/review/services.py."
  review.card: "accept._card_actor resolves the card actual room/project and calls authorize_topic; handlers explicitly reject unauthenticated callers. AcceptService owns reviewer/decision/revoke rules, including management operations. Source: app/api/routes/accept.py and domain/review/services.py."
  review.download: "accept.download_card_deliverable resolves the card project and authorize_project before artifact snapshot delivery. It is the project access path rather than _task_actor. Source: app/api/routes/accept.py."
  team.member.read: "authenticated(require_permission rejects guest, then checks Action.READ, Resource.TEAM_MEMBERSHIP, 'teamId'): the caller is a member of the team. Source: app/api/routes/credit_usage.py, app/auth/checker.py."
  user.session: "Depends(require_auth_user) rejects guest after numeric-account access-token verification (or X-User-Id only in non-compose development/test); this shared numeric seam does not itself consult sign-in session revocation. Domain service and cited handler retain ownership checks. get_auth_user alone is not used as a synonym. Source: app/auth/checker.py and app/common/auth.py."
  assistant.task: "assistant AuthUser -> require_auth_user, _readable_task -> tasks.ensure_task_readable for task-scoped operations; conversation _owned binds user_id for reads/asks. Source: app/api/routes/assistant.py,73,106."
  controller.room: "agent_control.controller: resolve in canonical room/project, explicitly require authenticated actor, authorize_topic(enforce=True). Source: app/api/routes/agent_control.py."
  notification.recipient: "ActorResolver.resolve_recipient binds the verified/requested recipient to project scope; mutations call alerts._acting_recipient with allow_anonymous=False. List/count endpoints retain the resolver own empty/recipient behavior. Source: app/api/routes/alerts.py and app/api/auth.py."
  notification.create: "alerts.create_notification: require_verified_caller then authorize_topic(enforce=True) or authorize_project; named recipients pass topic_admits_handle / may_read_project. This handler has its own gate, outside main._CHEESE_WRITE_PATHS. Source: app/api/routes/alerts.py."
  awaiting.self: "awaiting.list_awaiting_me resolves caller; an unauthenticated caller gets an empty page, and authenticated results use the credential handle/user_id. This is an explicit empty-response behavior, not a blanket require-login gate. Source: app/api/routes/awaiting.py."
  device.flow.start: "public(device enrollment start): connector.device_start issues a pending DeviceService code; binding requires the separate logged-in approval route. No route login dependency. Source: app/api/routes/connector.py."
  device.flow.code: "DeviceService.poll / code_device_name checks the supplied pending device_code, including expiration. The code is the approval-flow secret; no preexisting user login is required. Source: app/api/routes/connector.py,205; app/domain/device/service.py."
  device.connect: "connector.device_connect resolves caller, explicitly rejects unauthenticated caller, authorize_project, then assigns the pending code to project. Source: app/api/routes/connector.py."
  device.user: "connector._require_user uses ActorResolver.resolve and requires authenticated actor.user_id; DeviceService owner operations additionally bind the supplied device id to that user. Source: app/api/routes/connector.py and domain/device/service.py."
  device.team: "connector._require_user plus TeamRepository.is_team_member or DeviceService team ownership checks on registration/removal. Source: app/api/routes/connector.py and domain/device/service.py."
  device.agent.ws: "connector.agent_socket authenticates durable device session token via device.owner_reads.device_for_token from X-Cheese-Session or token query; binds the socket to that device. Source: app/api/routes/connector.py."
  device.viewer.ws: "connector._may_view_screen verifies query access token and actual screen project-member/owner or topic roster membership before the viewer socket. Source: app/api/routes/connector.py."
  local.device.owner: "local_dirs._require_user requires verified user_id, then _require_owned_device checks Device.owner_user_id. All selected-directory and access-log operations stay bound to caller device ownership. Source: app/api/routes/local_dirs.py."
  machine.manager: "machines._require_project_access resolves an authenticated actor; reads require current numeric user_id and TeamRepository.is_team_member, while delete/power action delegates MachineService.require_manage_authority (team owner/admin and agent standing). Source: app/api/routes/machines.py; domain/machine/services.py."
  dashboard.board: "dashboard._require_board_reader: require_verified_caller and membership in at least one project in the space board via may_read_project; global sandbox development override is explicit. Source: app/api/routes/dashboard.py."
  dashboard.person: "dashboard._signed_in resolves a verified handle; DashboardService filters profile/topics by viewer access. forget_understanding deletes only facts about that same viewer. Source: app/api/routes/dashboard.py,186,198,232."
  docs.dev.cookie: "docs_site.check_dev_access verifies the dev docs cookie through docs_site.access; internal proof or holder still in AdminService allow-list is required for nginx auth_request. Source: app/api/routes/docs_site.py."
  docs.agent: "docs_site._agent_scope resolves in named canonical room/project and calls authorize_topic (ordinary access setting applies), then library.reads_dev_docs checks that project dev-doc scope. No separate unconditional require_verified_caller is invented. Source: app/api/routes/docs_site.py."
  docs.visit: "public(docs visit beacon) with optional get_optional_user_id attribution; random visitor id is accepted, unusable anonymous id is ignored, and visit rate limiting is not authorization. Source: app/api/routes/docs_visit.py."
  feedback.read: "Feedback routes resolve optional caller (with ?topic=, in that room via _in_room, authorize_topic enforce=True, and _reader requires the room to be in a platform project: FeedbackService.require_platform_room), then FeedbackService.list_public / visible_row / visible_ref / may_see filters public, author, originating-room and admin visibility. _is_admin also applies refuse_management_action and agent-binding checks; it is not just an allow-list. Source: app/api/routes/feedback.py,260,336."
  feedback.write: "Feedback routes explicitly require authenticated actor/handle; FeedbackService owns author/moderator rights. _is_admin adds refuse_management_action with IdentityService agent binding. create refuses agent direct filing in the service. Source: app/api/routes/feedback.py and domain/feedback/services.py."
  feedback.claim: "_claimer resolves the caller from the credential (in the named room via _in_room, authorize_topic enforce=True, when ?topic= is given); FeedbackService.claim/release: visible_ref 404s what the caller cannot see, may_claim = feedback admin or works_on_platform (room project or a readable project in settings.docs_dev_repositories), release = holder or admin. Source: app/api/routes/feedback.py and domain/feedback/services.py, claims.py."
  feedback.proposal: "feedback_proposals._actor_in_topic resolves in actual room, authorize_topic, explicitly rejects unauthenticated actor; proposal mutations require the matching proposal block and service decision checks. Source: app/api/routes/feedback_proposals.py."
  fetch.caller: "fetch.read_url calls require_verified_caller with the supplied project/topic context before URL retrieval. FetchService controls the separate outbound URL safety boundary. Source: app/api/routes/fetch.py; domain/fetch/guard.py."
  integration.person: "integrations._person requires Actor.via=token and user_id; IntegrationService ownership checks bind personal connections/drafts to that handle. Source: app/api/routes/integrations.py."
  integration.room: "integrations._in_room / _usable resolve actual room, authorize_topic(enforce=True), and IntegrationService.for_project ties connection to room project. Source: app/api/routes/integrations.py,139."
  integration.oauth.state: "integrations._finish_feishu verifies the keyed INTEGRATION_STATE digest, loads that integration and exchanges code. No ordinary login dependency on provider callback. Source: app/api/routes/integrations.py."
  mcp.member: "remote_mcp.member resolves actor, rejects failed credentials/anonymous caller, and checks actual project roster independently of the access kill switch. Source: app/api/routes/remote_mcp.py."
  mcp.oauth.state: "remote_mcp.callback validates signed flow via service.read_state then service.finish_connect (code, issuer); no ordinary login dependency on provider callback. Source: app/api/routes/remote_mcp.py."
  mcp.proxy: "remote_mcp.proxy requires scoped_token_claims from X-Cheese-Token and binds server forwarding to claimed project/room in remote_mcp service. Source: app/api/routes/remote_mcp.py."
  memory.read: "memory.list_memory resolves/authorize_project and forbids user_handle different from actor.handle for about-person notes. Source: app/api/routes/memory.py."
  memory.delete: "memory.delete_memory: require_verified_caller, resolve project from stored entry scope, authorize_project; person-scope suffix must match caller. Refusal uses NotFound. Source: app/api/routes/memory.py."
  memory.files.read: "memory_files._readable: resolve/authorize_project; private files require matching handle or MemberService.manages. Source: app/api/routes/memory_files.py."
  memory.files.write: "memory_files._writable invokes _readable, then private owner must equal caller even for managers; team scope uses the project reader access. _owner_of alone only validates scope and is not authorization. Source: app/api/routes/memory_files.py."
  membership.service: "MemberService / InvitationService receive the resolved Actor and decide seat/remove/leave/invite standing; route resolution alone is not the gate. Source: app/api/routes/members.py,85,99,123; domain/membership/services.py."
  invitation.verified: "members invitation inbox/respond/revoke calls require_verified_caller then InvitationService binds recipient or revoker standing. Source: app/api/routes/members.py onward; domain/membership/services.py."
  routines.room: "routines._viewer / _routine_actor resolve in rule room and authorize_topic(enforce=True), then _sees_room; read lists filter readable rules. Source: app/api/routes/routines.py,182."
  routines.manage: "routines._routine_actor -> enforced room access, then _require_manage / _person according to operation: ownership or project manager and person-only confirmation/run/pause decisions. Agent draft/update limits remain in those helpers. Source: app/api/routes/routines.py onward."
  routines.create: "routines.create_routine uses _viewer(enforced room access); owner/speaker and draft-vs-confirmed state are decided by _speaker and _is_person. Source: app/api/routes/routines.py."
  skill.project: "project_skills._in_project / _load bind skill actual project, use enforced room access when topic is supplied, otherwise authorize_project. Source: app/api/routes/project_skills.py,127."
  skill.bundle: "skill_bundles.download_skill_bundle reads scoped_token_claims from X-Cheese-Token (the session's project token) and derives the project from claim p; the URL carries no project id, so the credential itself is the only scope. A global sandbox token is not a project claim and is refused. Source: app/api/routes/skill_bundles.py and app/core/sandbox_auth.py."
  environment.user: "project_environment.User -> require_auth_user; access resolves user handle and checks roster for reads / MemberService.manages for writes, plus archive-write guard. room/apply operations bind the room and idle requirement. Source: app/api/routes/project_environment.py,54,79."
  environment.overview: "project_environment.overview_access requires scoped claims p=URL project and t=project.root_topic_id; recovery repair additionally requires idle and matching incident. Source: app/api/routes/project_environment.py."
  export.human: "domain/project/export.create_archive requires token user_id, rejects IdentityService agent binding, checks may_read_project and filters readable_topic_ids. This is the route delegated authorization seam. Source: app/domain/project/export.py."
  context.rooms: "project_context._readable_rooms uses enforced supplied-room access or authorize_project, then readable_topic_ids filters every search group. Source: app/api/routes/project_context.py."
  site.access: "ActorResolver resolves verified actor then site.services.require_site_access, for publication/read or minting a short-lived site grant. Source: app/api/routes/project_sites.py and site_sessions.py; app/domain/site/services.py."
  preview.access: "preview_sessions resolves authenticated actor then api/preview_host.require_preview_access, before minting resource-bound preview grant. Source: app/api/routes/preview_sessions.py; app/api/preview_host.py."
  workspace.access: "Decorator Depends(workspace.require_project_access): verify_scoped_token for project or auth.caller.may_access_project, then actual requested room/task containment + authorize_topic, with archive/task-ended PUT guards. Source: app/api/routes/workspace.py."
  document.reader: "api/doc_access.reach: a room's document resolves the actor in its room then authorize_topic (the topic-access setting applies); a document in no room resolves in its project then authorize_project. Source: app/api/doc_access.py and the cited handler."
  document.member: "document_comments._member uses api/doc_access.reach(enforce=True) (room roster for a room's document, project membership for one in no room) and doc_identity.operation_actor; mutations also bind the comment to its document. Source: app/api/routes/document_comments.py; app/api/doc_access.py."
  delegated.self: "ActorResolver.resolve(); the caller must be authenticated with a user id: a person's login, or a delegated credential (sandbox_auth.DelegatedClaims, cxdg_ prefix) that api.auth.DELEGATED_ROUTES admits here and resolves to the person the 芝士 answers for. Lists only that person's own rows. Source: app/api/routes/tasks/participation.py; app/api/auth.py."
  document.human: "document_agent._asker uses api/doc_access.reach(enforce=True) and doc_identity.human_operation_actor (verified human, not agent identity); a box conversation is held in Valkey with its asker and document, and only that person on that document may go on with it, stop it, or put its answer into a thread they started. Source: app/api/routes/document_agent.py; app/domain/agent/document/box.py; app/api/doc_identity.py."
  collab.service: "living_docs._service: the bearer derived from COLLAB_SECRET (living_doc.collab.verify_service); only the collaboration service holds it. Identity in a store comes from the actors it carries, which the service took from backend-signed tickets or from the backend's own replace call. Source: app/api/routes/living_docs.py."
  living.document: "living_docs resolves through api/doc_access.reach (room roster for a room's document, project membership for one in no room); state-changing/history/receipt/restore branches enforce it and use doc_identity.operation_actor, and writes refuse an archived room or project (doc_access.require_writable). Source: app/api/routes/living_docs.py; app/api/doc_access.py. Endpoint-specific branch is kept in the map below."
  editor.link: "room_files.editor_fetches_file authenticates the signed/expiring document link with documents.editor.read_link; that link is the only credential. Source: app/api/routes/room_files.py; domain/documents/editor.py."
  editor.callback: "room_files.editor_saves_file validates the link via editor.read_link and callback JWT/body via editor.verify_callback before saving. Internal download URL validation is a separate safety check. Source: app/api/routes/room_files.py; domain/documents/editor.py."
  capability.execution: "execution.execute validates scoped cheese claims, then device.owner_reads session_execution / legacy_execution and execution_device_authorized bind project/room/session/device. No ordinary Bearer dependency. Source: app/api/routes/execution.py; domain/device/owner_reads.py."
  capability.preview.ws: "app_preview.preview_tunnel verifies scoped claims including project, room and teammate; wire.accepts_launch restricts the running launch before registration. Source: app/api/routes/app_preview.py."
  capability.forge: "forge_token uses scoped_token_claims from caller credential, project binding and claimed scope before transport/token minting; scope=\"project\" capability is specific here. Global sandbox is not silently a project identity. Source: app/api/routes/forge_token.py,140,260."
  capability.git: "git_http._task_for / task_workspace verify scoped project/room capability and bind the task to that project before workspace or snapshots; open additionally requires token_agent_handle. Source: app/api/routes/git_http.py and cited handler."
  capability.llm: "llm_proxy validates _caller_token via scoped_token_claims; admission additionally binds agent/model, budget and policy gate. proxy reuses request capability instead of exposing provider credentials. Source: app/api/routes/llm_proxy.py,355."
  capability.llm.ws: "llm_tunnel.tunnel validates scoped_token_claims from X-Cheese-Session or token query before dialing only the configured meter listener; meter performs its own CONNECT/token/host gate. Source: app/api/routes/llm_tunnel.py."
  capability.session.lease: "topics_compute.acquire_session_work_lease requires scoped claims then machine.session_work.ensure checks actual topic/session/lease scope. Source: app/api/routes/topics_compute.py; domain/machine/session_work.py."
  capability.cli: "sandbox.get_cheese_cli requires valid scoped cheese claims before serving the deployed CLI source. Source: app/api/routes/sandbox.py."
  sandbox.global: "sandbox.trigger_storage_sweep accepts only is_global_sandbox_token; not a project/room identity. Source: app/api/routes/sandbox.py."
  backend.errors: "backend_log._room accepts scoped_token_claims (claims override body IDs) or explicit global sandbox token; missing/invalid proof is Unauthorized. Source: app/api/routes/backend_log.py,57."
  webhook.token: "webhooks.receive_webhook verifies the per-room webhook token through webhook_service.verify, then resolves actual room/project; callback provider token is the credential. Source: app/api/routes/webhooks.py."
  github.manager: "github_install._manager resolves authenticated actor and MemberService.require_manager for repository connect/install authorization. Source: app/api/routes/github_install.py."
  github.state: "GitHub provider callback verifies signed install/account-link state and scopes the resulting binding; no ordinary login dependency at callback. Source: app/api/routes/github_install.py; github_account_link.py."
  app.sign_in.code: "app_sign_in.finish_app_sign_in requires same origin, signed code, PKCE verifier challenge and single-use claim before issuing session. Source: app/api/routes/app_sign_in.py."
  notice.ws: "notifications_live.live verifies dedicated notice token from Authorization then _signed_in confirms active user session, periodically rechecking. Source: app/api/routes/notifications_live.py."
  topic.members.manage: "topic_members resolves authenticated actor; TopicMemberService decides roster/role management for actual topic. Source: app/api/routes/topic_members.py onward; domain/topic_membership/services.py."
  topic.archive: "topics archive/unarchive resolves/authorize_topic and TopicMemberService.require_archive_manager; archive also checks cleanup policy in the handler. Source: app/api/routes/topics.py onward."
  topic.names: "topics.list_topic_names resolves/rejects failed credential and limits names to caller visible project IDs; not a raw global room directory. Source: app/api/routes/topics.py."
  cheese.room.gate: "main.cheese_token_gate matches this exact POST path in _CHEESE_WRITE_PATHS: valid scoped cheese token, explicit global sandbox override or project-agent credential with actual room authorization, followed by handler room actor check. Source: app/main.py,721."
  cheese.project.gate: "main.cheese_token_gate matches a project-scoped POST path in _CHEESE_WRITE_PATHS and checks project scope / explicit global sandbox / authorized project-agent credential. Source: app/main.py,721."
  memory.closed.write: "POST project memory remains in main.cheese_token_gate, but projects.add_memory unconditionally rejects the obsolete write with ValidationError. No memory is persisted; this is a closed operation, not a newly granted permission. Source: app/api/routes/projects.py; app/main.py."
  public.catalogue: "public(catalogue): the cited read handler returns published static/catalogue choices without credential dependencies. This entry is only used for agent types, public resource limits, installer and public metadata reads verified below."
  public.health: "public(health/readiness/metrics/version): no route credential dependency or authorization call. Handler exposes health/build/metrics data as currently implemented. Source: app/api/routes/health.py; app/main.py,842."
  public.legal: "public(legal document text/version): no credential dependency; consent operations use require_auth_user separately. Source: app/api/routes/legal.py onward."
  public.uploads: "public(local uploaded asset delivery): no credential check; _safe_path requires contained existing storage path, executable suffixes are served as download/inert content. Fixed local profile registers /uploads/{key:path}. Source: app/api/routes/uploads.py,61."
  public.mcp.metadata: "public(remote MCP OAuth client metadata): publishes only the OAuth client declaration; management and callbacks use separate gates. Source: app/api/routes/remote_mcp.py."
  observed.debug: "当前路由无认证或授权校验；公开访问意图尚未确认。GET /debug/turns returns agent execution lifecycle summaries. Source: app/main.py."
  observed.frontend.errors: "当前路由无认证或授权校验；公开访问意图尚未确认。仅校 project/topic 存在；frontend_log.intake 限流/去重不构成授权。Source: app/api/routes/frontend_log.py."
  observed.compute.nodes: "当前路由无认证或授权校验；公开访问意图尚未确认。GET /market/nodes returns compute availability and deployment active-turn count. Source: app/api/routes/market.py."
  project.can_manage.read: "ActorResolver.resolve + authorize_project gates the read; MemberService.require_manager is caught to return can_manage true/false, not to reject a nonmanager. Source: projects.get_topic_naming and projects_run_config.get_default_model/get_compute_configs."
  project.private.chat: "projects.get_private_chat calls require_verified_caller; authenticated actors must pass authorize_project and be one of the named DM participants. Explicit global sandbox development override remains in resolver. Source: app/api/routes/projects.py."
  chat.ws: "chat.chat reads access credential from token query, constructs ActorResolver with bearer and no cheese token, applies authz.policy.refuse_unauthenticated_chat, then resolves actual task/room and authorize_topic for membership. Topic access setting applies to the membership step, not the initial login refusal. Source: app/api/routes/chat.py; domain/authz/policy.py."
  team.live.ws: "team_live.team_live reads access credential from token query, constructs ActorResolver with bearer and no cheese token, requires resolve() to be authenticated, then authorize_team(actor, team_id). AuthenticationRequiredError and ForbiddenError map to the room socket auth_expired/forbidden codes and close 1008. Source: app/api/routes/team_live.py; app/api/auth.py."
  routines.list: "routines.list_routines uses _viewer(enforced room access) for topic-filtered reads or resolve/authorize_project otherwise, then _readable_rules filters each rule. Source: app/api/routes/routines.py."
