<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 说明模板 - 完整文档，直接在里面写。槽位见 SKILL.md 与 references/explainer.md。
     一份教人「它怎么运作」的说明：一句话导读，接着编号步骤（每步一段短文配一个图或一段代码），
     最后用读者新学到的说法收个小结。token 与组件取自 references/design-system.md（知是设计系统），
     --cx-* 前缀，两套主题，不连外网。 -->
<title><!-- SLOT: TITLE - 要解释的东西，写成读者心里的那个问题 -->它怎么运作</title>
<style>
:root {
  color-scheme: light;

  /* 中性色阶（暖冷灰）：每档按「信息离读者多远」选，不跳档 */
  --cx-ink: #191a1c;      /* 标题 */
  --cx-text: #36383c;     /* 正文 */
  --cx-muted: #5a5e66;    /* 次要：副标题、说明、轴标签、表头 */
  --cx-faint: #747a82;    /* 元信息：时间戳、ID、计数 */

  --cx-line: #ecedef;     /* 发丝分隔线 */
  --cx-line-2: #e2e3e6;   /* 更明显的分隔线，也是选中行底色 */
  --cx-fill: #f4f5f7;     /* 悬停、内嵌区块 */
  --cx-fill-2: #eeeff1;   /* 比 fill 重一档 */

  --cx-canvas: #f7f8fa;   /* 页面底色 */
  --cx-surface: #ffffff;  /* 内容区、卡片 */
  --cx-raised: #ffffff;   /* 浮层：菜单、弹窗、抽屉 */

  /* 琥珀：全页只给一处 */
  --cx-accent: #f57f17;
  --cx-accent-press: #d96e0a;
  --cx-accent-ink: #9a5413;   /* 琥珀色文字（--cx-accent 写字对比度不够） */
  --cx-accent-wash: #fdf1e2;  /* 极浅琥珀底，罕用 */
  --cx-on-accent: #ffffff;    /* 琥珀实心上的字 */

  /* 状态三件套：记号 / 文字 / 底，不可换用 */
  --cx-ok: #1f9d55;     --cx-ok-ink: #12703a;     --cx-ok-wash: #e8f6ee;
  --cx-warn: #e8901c;   --cx-warn-ink: #8f5406;   --cx-warn-wash: #faf0dc;
  --cx-danger: #dc2626; --cx-danger-ink: #b91c1c; --cx-danger-wash: #fdecec;

  /* 图表系列：分类用，最多六条。两条以内优先用 --cx-text / --cx-muted 加线型 */
  --cx-chart-1: #3d6bb3;
  --cx-chart-2: #2a9d8f;
  --cx-chart-3: #d9822b;
  --cx-chart-4: #8a63c2;
  --cx-chart-5: #c9506f;
  --cx-chart-6: #6b7b8c;

  /* 代码块：两套主题下都反色 */
  --cx-code-bg: #212121;
  --cx-code-ink: #e0e0e0;

  /* 圆角：三档加胶囊 */
  --cx-radius-sm: 6px;     /* 标签、chip、小徽章 */
  --cx-radius-md: 8px;     /* 按钮、输入框、卡片内的小块 */
  --cx-radius-lg: 12px;    /* 卡片、面板、callout、图 */
  --cx-radius-pill: 999px; /* 胶囊、状态标签、圆点 */

  /* 投影：只给浮层，卡片只描边 */
  --cx-shadow-1: 0 1px 2px rgba(25, 26, 28, 0.06), 0 2px 8px rgba(25, 26, 28, 0.06);
  --cx-shadow-2: 0 4px 12px rgba(25, 26, 28, 0.1), 0 12px 32px rgba(25, 26, 28, 0.1);
  --cx-focus-ring: #c2570a; /* 键盘焦点环，别移除 */

  /* 字体：只用系统中文字体栈，不引外部字体（CJK 网络字体每字重好几兆，也连不上） */
  --cx-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
    "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --cx-font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
    "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  /* 前四个 Windows 上没有，落到裸 monospace 会被映射成宋体；垫上自带的 Cascadia Mono / Consolas */
  --cx-font-mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas,
    "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --cx-ink: #f3f4f6;
    --cx-text: #d3d6db;
    --cx-muted: #aeb4bd;
    --cx-faint: #888ea0;

    --cx-line: #2b2e33;
    --cx-line-2: #3a3e45;
    --cx-fill: #212429;
    --cx-fill-2: #282c31;

    --cx-canvas: #141517;   /* 不用纯黑：纯黑之下没有更暗的一档，卡片浮不起来 */
    --cx-surface: #1b1d20;
    --cx-raised: #212429;   /* 比 surface 亮一档，浮层靠亮度而非投影分开 */

    --cx-accent: #ffa733;   /* 深色下必须提亮，否则按钮上的字读不出 */
    --cx-accent-press: #ffbc5e; /* 深色下按下变亮，不像亮色那样变深 */
    --cx-accent-ink: #ffc670;
    --cx-accent-wash: #2e2216;
    --cx-on-accent: #191a1c; /* 浅琥珀上的字要用深色 */

    --cx-ok: #3fbf7f;     --cx-ok-ink: #6fd9a0;     --cx-ok-wash: #14261d;
    --cx-warn: #f0a94a;   --cx-warn-ink: #f7c078;   --cx-warn-wash: #2a2114;
    --cx-danger: #f0625c; --cx-danger-ink: #f79490; --cx-danger-wash: #2e1a1a;

    --cx-chart-1: #7aa2e3;
    --cx-chart-2: #4fb8aa;
    --cx-chart-3: #eba25a;
    --cx-chart-4: #ad8fe2;
    --cx-chart-5: #e57f99;
    --cx-chart-6: #9eacba;

    --cx-code-bg: #282c31;  /* 反色块在深色下改用 fill-2，否则和卡片糊在一起 */
    --cx-code-ink: #d3d6db;

    --cx-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
    --cx-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.4);
    --cx-focus-ring: rgba(255, 167, 51, 0.65);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --cx-ink: #f3f4f6;
  --cx-text: #d3d6db;
  --cx-muted: #aeb4bd;
  --cx-faint: #888ea0;

  --cx-line: #2b2e33;
  --cx-line-2: #3a3e45;
  --cx-fill: #212429;
  --cx-fill-2: #282c31;

  --cx-canvas: #141517;
  --cx-surface: #1b1d20;
  --cx-raised: #212429;

  --cx-accent: #ffa733;
  --cx-accent-press: #ffbc5e;
  --cx-accent-ink: #ffc670;
  --cx-accent-wash: #2e2216;
  --cx-on-accent: #191a1c;

  --cx-ok: #3fbf7f;     --cx-ok-ink: #6fd9a0;     --cx-ok-wash: #14261d;
  --cx-warn: #f0a94a;   --cx-warn-ink: #f7c078;   --cx-warn-wash: #2a2114;
  --cx-danger: #f0625c; --cx-danger-ink: #f79490; --cx-danger-wash: #2e1a1a;

  --cx-chart-1: #7aa2e3;
  --cx-chart-2: #4fb8aa;
  --cx-chart-3: #eba25a;
  --cx-chart-4: #ad8fe2;
  --cx-chart-5: #e57f99;
  --cx-chart-6: #9eacba;

  --cx-code-bg: #282c31;
  --cx-code-ink: #d3d6db;

  --cx-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
  --cx-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.4);
  --cx-focus-ring: rgba(255, 167, 51, 0.65);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cx-canvas); /* body 必须显式设背景，透明会露出宿主底色还不报警 */
  color: var(--cx-text);
  font-family: var(--cx-font-sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

:focus-visible { outline: 2px solid var(--cx-focus-ring); outline-offset: 2px; border-radius: var(--cx-radius-sm); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---- 页面骨架 ---- */
/* 说明页以连续正文为主，用 660 阅读栏；图和表可以在栏内换行、也可各自横滑。 */
.page {
  max-width: 660px;
  margin-inline: auto;
  padding-block: 48px 64px;      /* 竖向；不用会把左右清零的 padding 简写 */
  padding-inline: 20px;          /* 左右至少 16px */
  display: flex;
  flex-direction: column;
  gap: 40px;                     /* 区块之间统一 40（32-48 之间） */
}

.masthead {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--cx-line);
}
.eyebrow { margin: 0; font-size: 13px; line-height: 20px; color: var(--cx-muted); }
.title { margin: 0; font-size: 34px; line-height: 1.2; font-weight: 650; color: var(--cx-ink); text-wrap: balance; }
.subtitle { margin: 0; font-size: 18px; line-height: 27px; color: var(--cx-muted); }

.section { display: flex; flex-direction: column; gap: 12px; }
.section > h2 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 650; color: var(--cx-ink); text-wrap: balance; }
.section > p { margin: 0; font-size: 16px; line-height: 28px; color: var(--cx-text); }

.footnote { border-top: 1px solid var(--cx-line); padding-top: 16px; }
.footnote p { margin: 0; font-size: 13px; line-height: 20px; color: var(--cx-muted); }

/* ---- lede：把「读完会弄懂什么」先给出来，靠底纹 + 描边立起来（不用左竖条，那在 AI 味清单里） ---- */
.lede {
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px 20px;
  background: var(--cx-fill);
  border: 1px solid var(--cx-line);
  border-radius: var(--cx-radius-lg);
}
.lede__label { margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--cx-muted); }
.lede p { margin: 0; font-size: 15px; line-height: 26px; color: var(--cx-text); }
/* 全页唯一的琥珀：这一页最要紧的那一处，用 --cx-accent-ink */
.lede .pick { color: var(--cx-accent-ink); font-weight: 600; }

/* ---- 步骤（编号是内容里真实的先后顺序） ---- */
.steps {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 32px;   /* 组间 32 */
  counter-reset: step;
}
.step {
  position: relative;
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px 20px;
  counter-increment: step;
}
.step__num {
  grid-column: 1; grid-row: 1;
  margin: 0;
  width: 30px; height: 30px; display: grid; place-items: center;
  background: var(--cx-surface);
  border: 1px solid var(--cx-line-2);
  border-radius: var(--cx-radius-sm);
  font-size: 14px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--cx-ink); z-index: 1;
}
.step__num::before { content: counter(step); }
/* 连接相邻步骤的发丝线，只在真有先后顺序时用；窄屏折成一列后隐藏 */
.step:not(:last-child)::before {
  content: ""; position: absolute; left: 14.5px; top: 30px; bottom: -32px; width: 1px;
  background: var(--cx-line);
}
.step__body { grid-column: 2; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.step__body > h2 { margin: 0; font-size: 18px; line-height: 27px; font-weight: 600; color: var(--cx-ink); text-wrap: balance; }
.step__body > p { margin: 0; font-size: 16px; line-height: 28px; color: var(--cx-text); }
@media (max-width: 520px) {
  .step { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .step:not(:last-child)::before { display: none; }
  .step__body { grid-column: 1; }
}

/* ---- 另一种结构：顺序不严格时用小节，和 .steps 二选一 ---- */
.topics { display: flex; flex-direction: column; gap: 40px; }
.topic { display: flex; flex-direction: column; gap: 12px; }
.topic > h2 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 650; color: var(--cx-ink); text-wrap: balance; }
.topic > p { margin: 0; font-size: 16px; line-height: 28px; color: var(--cx-text); }

/* ---- 小结：把核心结论用读者新学到的说法重列几条 ---- */
.recap { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.recap li { font-size: 16px; line-height: 28px; color: var(--cx-text); }
.recap li::marker { color: var(--cx-faint); }

/* ---- 目录（可选）：四个以上小节才留 ---- */
.toc {
  display: flex; flex-direction: column; gap: 8px;
  padding: 16px 20px;
  border: 1px solid var(--cx-line);
  border-radius: var(--cx-radius-lg);
}
.toc__label { margin: 0; font-size: 13px; font-weight: 600; color: var(--cx-muted); }
.toc ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.toc li::marker { color: var(--cx-faint); font-variant-numeric: tabular-nums; }
.toc a { color: var(--cx-text); text-decoration: none; }
.toc a:hover { color: var(--cx-accent-ink); }

/* ---- 图 + 图注 + 数据表孪生体 ---- */
/* 图内文字走 token 的 style 属性（var() 在 SVG 呈现属性里失效）。文字保 12px 起。 */
.figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.figure-outer { position: relative; }
.figure-scroll { overflow-x: auto; }
/* min-width 保图内文字 ≥11px，max-width 免宽屏上文字被放大到离谱。
   说明页的图排在步骤正文栏里（更窄），比设计系统的 560/680 收一档。 */
.figure svg { display: block; width: 100%; height: auto; min-width: 440px; max-width: 520px; }
.figcaption { font-size: 13px; line-height: 20px; color: var(--cx-muted); }
.data-twin { font-size: 13px; }
.data-twin > summary { cursor: pointer; color: var(--cx-muted); padding: 2px 0; }
.data-twin > summary:hover { color: var(--cx-text); }
.data-twin[open] > summary { margin-bottom: 8px; }

.scroll-hint { display: none; margin: 6px 0 0; font-size: 12px; line-height: 18px; color: var(--cx-faint); }
@media (max-width: 720px) {
  .figure-outer::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 32px;
    background: linear-gradient(to right, transparent, var(--cx-canvas));
    pointer-events: none;
  }
  .scroll-hint { display: block; }
}

/* ---- 数据表：外层横滑，窄屏右缘渐隐 + 一行小字 ---- */
.table-outer { position: relative; }
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--cx-line);
  border-radius: var(--cx-radius-md);
  background: var(--cx-surface);
}
.table-wrap table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
.table-wrap th, .table-wrap td {
  padding: 10px 14px; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--cx-line);
}
.table-wrap thead th { font-size: 13px; font-weight: 600; color: var(--cx-muted); }
.table-wrap tbody tr:last-child td { border-bottom: 0; }
.table-wrap .num { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 720px) {
  .table-outer::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 32px;
    background: linear-gradient(to right, transparent, var(--cx-surface));
    pointer-events: none;
    border-top-right-radius: var(--cx-radius-md); border-bottom-right-radius: var(--cx-radius-md);
  }
}

/* ---- callout：提醒、类比、岔路 ---- */
.callout {
  display: flex; flex-direction: column; gap: 4px;
  padding: 14px 18px;
  border: 1px solid var(--cx-line);
  border-radius: var(--cx-radius-lg);
}
.callout__title { margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; }
.callout__body { margin: 0; font-size: 15px; line-height: 26px; color: var(--cx-text); }
.callout--note   { background: var(--cx-fill); }
.callout--note   .callout__title { color: var(--cx-muted); }
.callout--warn   { background: var(--cx-warn-wash);   border-color: transparent; }
.callout--warn   .callout__title { color: var(--cx-warn-ink); }
.callout--danger { background: var(--cx-danger-wash); border-color: transparent; }
.callout--danger .callout__title { color: var(--cx-danger-ink); }

/* ---- 代码块与行内代码：代码块反色 ---- */
.code {
  margin: 0; padding: 14px 16px;
  background: var(--cx-code-bg); color: var(--cx-code-ink);
  border-radius: var(--cx-radius-md);
  font-family: var(--cx-font-mono); font-size: 13px; line-height: 20px;
  overflow-x: auto;
}
code:not(pre code) {
  font-family: var(--cx-font-mono); font-size: 0.92em;
  background: var(--cx-fill); border: 1px solid var(--cx-line);
  border-radius: 4px; padding: 1px 4px;
}

/* ---- 打印：固定亮色，别在纸上留下暗底 ---- */
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    color-scheme: light;
    --cx-ink: #191a1c; --cx-text: #36383c; --cx-muted: #5a5e66; --cx-faint: #747a82;
    --cx-line: #d9dadc; --cx-line-2: #c9cacd; --cx-fill: #f4f5f7; --cx-fill-2: #eeeff1;
    --cx-canvas: #ffffff; --cx-surface: #ffffff; --cx-raised: #ffffff;
    --cx-accent: #f57f17; --cx-accent-press: #d96e0a; --cx-accent-ink: #9a5413;
    --cx-accent-wash: #fdf1e2; --cx-on-accent: #ffffff;
    --cx-code-bg: #212121; --cx-code-ink: #e0e0e0;
  }
  body { font-size: 12pt; }
  .page { max-width: none; padding-block: 0; }
  .step, .figure, .callout, .lede, .toc, .table-wrap, pre { break-inside: avoid; }
  .masthead, .step__body > h2, .section > h2 { break-after: avoid; }
  .scroll-hint { display: none !important; }
  .data-twin { display: block; }
  .data-twin > summary { display: none; }
}

/* ---- 窄屏（≤480px）：图不横向滚动，数值靠展开的数据表读 ----
   手写 SVG 带 min-width，窄屏会横向滚动、图内文字缩到读不清。这里让图缩到一栏宽
   （不再横滑），并由页尾的脚本把它的数据表孪生体展开——数值不只活在图形里。 */
@media screen and (max-width: 480px) {
  .figure svg { min-width: 0; }
  .figure-scroll { overflow-x: visible; }
  /* 图不再横滑，那行「左右滑动看图」的提示和右缘渐隐都不成立了，去掉 */
  .figure > .scroll-hint { display: none; }
  .figure-outer::after { display: none; }
}
</style>
</head>
<body>
<!-- CONTENT:START -->

<main class="page">

  <header class="masthead">
    <p class="eyebrow"><!-- SLOT: EYEBROW - 可选：这份说明所属的主题或日期，如「预览链路 · 2026 年 10 月」 -->说明</p>
    <h1 class="title"><!-- SLOT: TITLE - 要解释的东西，写成读者心里的那个问题，如「一份文件怎么出现在预览里」 -->它怎么运作</h1>
    <p class="subtitle"><!-- SLOT: SUBTITLE - 一句话说清这份说明讲的是什么 -->一句话说清这份说明讲的是什么。</p>
  </header>

  <!-- SLOT: LEDE - 两三句：读者读完会弄懂什么，为什么值得懂。整段换掉。 -->
  <div class="lede">
    <p class="lede__label">导读</p>
    <p>这段话告诉读者读完会弄懂什么、为什么值得弄懂。</p>
  </div>

  <!-- SLOT: TOC_ITEMS（可选）- 四个以上小节或步骤才留；就几步就整块删掉 <nav class="toc">。
       每个下面的 h2 一条 <li><a href="#id">标题</a></li>，写完正文再回来照实际标题填。 -->
  <nav class="toc" aria-label="目录">
    <p class="toc__label">目录</p>
    <ol>
      <li><a href="#s1">第一步</a></li>
    </ol>
  </nav>

  <!-- SLOT: STEPS - 编号步骤型（默认）。每个概念或阶段一个 <li class="step">：
       一个 <h2> 标题、一到三段短文，再配一个 .visual（多数是内联 SVG 图，偶尔是 <pre> 代码或一张小表）。
       一步只讲一个意思。可以用一段 <p class="callout"> 收尾放提醒、类比或岔路。
       不是真的先后顺序，就改用下面的 SECTIONS 型，并把这段删掉。 -->
  <ol class="steps" role="list">
    <li class="step">
      <p class="step__num" aria-hidden="true"></p>
      <div class="step__body">
        <h2>这一步发生的事</h2>
        <p>一段短文，说清这一步发生了什么、为什么。</p>
        <figure class="figure">
          <div class="figure-outer"><div class="figure-scroll">
            <!-- 图形词汇保持一致：方块=东西，箭头=动作或因果。
                 当前这一步要强调的方块用 fill:var(--cx-fill-2) + stroke:var(--cx-ink)，其余用 surface + line-2；
                 颜色一律写进 style，SVG 呈现属性里的 var() 不生效。
                 每个 <svg> 给 role="img" 和一句 aria-label 说明它画了什么；marker 的 id 要唯一。 -->
            <svg viewBox="0 0 440 120" role="img" aria-label="两个方块用箭头连起来，示意这一步里的流程">
              <defs>
                <marker id="ar-demo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                  <path d="M0 0 L10 5 L0 10 z" style="fill:var(--cx-muted)"/>
                </marker>
              </defs>
              <rect x="24" y="40" width="140" height="48" rx="6" style="fill:var(--cx-fill-2);stroke:var(--cx-ink)"/>
              <text x="94" y="69" text-anchor="middle" font-size="13" font-family="var(--cx-font-sans)" style="fill:var(--cx-ink)">这一步的主体</text>
              <line x1="172" y1="64" x2="256" y2="64" stroke-width="1.5" marker-end="url(#ar-demo)" style="stroke:var(--cx-muted)"/>
              <rect x="264" y="40" width="140" height="48" rx="6" style="fill:var(--cx-surface);stroke:var(--cx-line-2)"/>
              <text x="334" y="69" text-anchor="middle" font-size="13" font-family="var(--cx-font-sans)" style="fill:var(--cx-muted)">它带到的地方</text>
            </svg>
          </div></div>
          <p class="scroll-hint">窄屏可左右滑动看图</p>
          <figcaption>图 1 · 一句话说清读者该从这张图里得到什么。</figcaption>
          <!-- 图里带数值时（柱、线、饼），同一小节里跟一张数据表孪生体，默认折叠，标「查看数据表」。
               纯示意图不需要，整块删掉 <details class="data-twin">。数字列右对齐、等宽。 -->
          <details class="data-twin">
            <summary>查看数据表</summary>
            <div class="table-outer">
            <div class="table-wrap">
              <table>
                <thead><tr><th scope="col">项目</th><th scope="col" class="num">数值</th></tr></thead>
                <tbody>
                  <tr><td>第一项</td><td class="num">42</td></tr>
                  <tr><td>第二项</td><td class="num">58</td></tr>
                </tbody>
              </table>
            </div>
            </div>
            <p class="scroll-hint">左右滑动看全部列</p>
          </details>
        </figure>
      </div>
    </li>
    <li class="step">
      <p class="step__num" aria-hidden="true"></p>
      <div class="step__body">
        <h2>第二步发生的事</h2>
        <p>这一步用一段代码当图，代码本身就是这一步的主体。</p>
        <pre class="code"><code>cheese show out/explainer.html</code></pre>
      </div>
    </li>
  </ol>

  <!-- SLOT: SECTIONS（另一种结构，和 STEPS 二选一）
       顺序不严格、代码占更多分量时（走读代码、巡一遍架构），用 <section class="topic"> 包 <h2>。
       用不上就整块删掉 <div class="topics">。
  <div class="topics">
    <section class="topic">
      <h2>小节标题</h2>
      <p>正文。</p>
    </section>
  </div>
  -->

  <!-- SLOT: RECAP - 用读者新学到的说法，把核心结论重列几条。 -->
  <section class="section">
    <h2>小结</h2>
    <ul class="recap">
      <li>重述的核心结论。</li>
    </ul>
  </section>

  <footer class="footnote">
    <!-- SLOT: FOOTNOTE - 口径、来源、时间戳。 -->
    <p>口径与来源。</p>
  </footer>

</main>
<!-- CONTENT:END -->


<script>
  // 窄屏（≤480px）：把手写 SVG 图的 data twin（数据表）展开，数值不只活在图形里；
  // 图本身在窄屏由样式缩到一栏宽、不再横向滚动（见样式里的 480px 块）。
  (() => {
    const mq = window.matchMedia('(max-width: 480px)');
    const sync = () => {
      document.querySelectorAll('.figure').forEach((fig) => {
        const twin = fig.querySelector('details.data-twin');
        if (!twin) return;
        if (mq.matches) {
          if (!twin.open) { twin.open = true; twin.dataset.autoOpen = '1'; }
        } else if (twin.dataset.autoOpen) {
          twin.open = false;
          delete twin.dataset.autoOpen;
        }
      });
    };
    sync();
    mq.addEventListener('change', sync);
  })();
</script>
</body>
</html>
