<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A4 单页模板 · 知是设计系统（--cx-* token）。完整文档，直接在里面写。
     一页纸的汇报：报头 / 一句话结论 / 一个读数（或 ≤3 个 stat tiles）/ 一张小图带数据表 /
     3–5 条要点 / 风险与下一步 / 来源脚注。打印时必须正好一页 A4，别让它溢到第二页。
     槽位见 references/pdf.md；组件与 token 见 references/design-system.md。 -->
<title><!-- SLOT: TITLE — 这一页的名字，一个专名或那个问题本身 -->A4 单页</title>
<style>
:root {
  color-scheme: light;

  /* 中性色阶（暖冷灰）：每档按「信息离读者多远」选，不跳档 */
  --cx-ink: #191a1c;      /* 标题 */
  --cx-text: #36383c;     /* 正文 */
  --cx-muted: #5a5e66;    /* 次要：副标题、说明、轴标签、表头 */
  --cx-faint: #747a82;    /* 元信息：时间戳、ID、计数 */

  --cx-line: #ecedef;     /* 发丝分隔线 */
  --cx-line-2: #e2e3e6;   /* 更明显的分隔线，也是选中行底色 */
  --cx-fill: #f4f5f7;     /* 悬停、内嵌区块 */
  --cx-fill-2: #eeeff1;   /* 比 fill 重一档 */

  --cx-canvas: #f7f8fa;   /* 页面底色 */
  --cx-surface: #ffffff;  /* 内容区、卡片 */
  --cx-raised: #ffffff;   /* 浮层：菜单、弹窗、抽屉 */

  /* 琥珀：全页只给一处 */
  --cx-accent: #f57f17;
  --cx-accent-press: #d96e0a;
  --cx-accent-ink: #9a5413;   /* 琥珀色文字（--cx-accent 写字对比度不够） */
  --cx-accent-wash: #fdf1e2;  /* 极浅琥珀底，罕用 */
  --cx-on-accent: #ffffff;    /* 琥珀实心上的字 */

  /* 状态三件套：记号 / 文字 / 底，不可换用 */
  --cx-ok: #1f9d55;     --cx-ok-ink: #12703a;     --cx-ok-wash: #e8f6ee;
  --cx-warn: #e8901c;   --cx-warn-ink: #8f5406;   --cx-warn-wash: #faf0dc;
  --cx-danger: #dc2626; --cx-danger-ink: #b91c1c; --cx-danger-wash: #fdecec;

  /* 图表系列：分类用，最多六条。两条以内优先用 --cx-text / --cx-muted 加线型 */
  --cx-chart-1: #3d6bb3;
  --cx-chart-2: #2a9d8f;
  --cx-chart-3: #d9822b;
  --cx-chart-4: #8a63c2;
  --cx-chart-5: #c9506f;
  --cx-chart-6: #6b7b8c;

  /* 代码块：两套主题下都反色 */
  --cx-code-bg: #212121;
  --cx-code-ink: #e0e0e0;

  /* 圆角：三档加胶囊 */
  --cx-radius-sm: 6px;     /* 标签、chip、小徽章 */
  --cx-radius-md: 8px;     /* 按钮、输入框、卡片内的小块 */
  --cx-radius-lg: 12px;    /* 卡片、面板、callout、图 */
  --cx-radius-pill: 999px; /* 胶囊、状态标签、圆点 */

  /* 投影：只给浮层，卡片只描边 */
  --cx-shadow-1: 0 1px 2px rgba(25, 26, 28, 0.06), 0 2px 8px rgba(25, 26, 28, 0.06);
  --cx-shadow-2: 0 4px 12px rgba(25, 26, 28, 0.1), 0 12px 32px rgba(25, 26, 28, 0.1);
  --cx-focus-ring: #c2570a; /* 键盘焦点环，别移除 */

  /* 字体：只用系统中文字体栈，不引外部字体 */
  --cx-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
    "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --cx-font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
    "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --cx-font-mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas,
    "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --cx-ink: #f3f4f6;
    --cx-text: #d3d6db;
    --cx-muted: #aeb4bd;
    --cx-faint: #888ea0;
    --cx-line: #2b2e33;
    --cx-line-2: #3a3e45;
    --cx-fill: #212429;
    --cx-fill-2: #282c31;
    --cx-canvas: #141517;
    --cx-surface: #1b1d20;
    --cx-raised: #212429;
    --cx-accent: #ffa733;
    --cx-accent-press: #ffbc5e;
    --cx-accent-ink: #ffc670;
    --cx-accent-wash: #2e2216;
    --cx-on-accent: #191a1c;
    --cx-ok: #3fbf7f;     --cx-ok-ink: #6fd9a0;     --cx-ok-wash: #14261d;
    --cx-warn: #f0a94a;   --cx-warn-ink: #f7c078;   --cx-warn-wash: #2a2114;
    --cx-danger: #f0625c; --cx-danger-ink: #f79490; --cx-danger-wash: #2e1a1a;
    --cx-chart-1: #7aa2e3;
    --cx-chart-2: #4fb8aa;
    --cx-chart-3: #eba25a;
    --cx-chart-4: #ad8fe2;
    --cx-chart-5: #e57f99;
    --cx-chart-6: #9eacba;
    --cx-code-bg: #282c31;
    --cx-code-ink: #d3d6db;
    --cx-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
    --cx-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.4);
    --cx-focus-ring: rgba(255, 167, 51, 0.65);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --cx-ink: #f3f4f6;
  --cx-text: #d3d6db;
  --cx-muted: #aeb4bd;
  --cx-faint: #888ea0;
  --cx-line: #2b2e33;
  --cx-line-2: #3a3e45;
  --cx-fill: #212429;
  --cx-fill-2: #282c31;
  --cx-canvas: #141517;
  --cx-surface: #1b1d20;
  --cx-raised: #212429;
  --cx-accent: #ffa733;
  --cx-accent-press: #ffbc5e;
  --cx-accent-ink: #ffc670;
  --cx-accent-wash: #2e2216;
  --cx-on-accent: #191a1c;
  --cx-ok: #3fbf7f;     --cx-ok-ink: #6fd9a0;     --cx-ok-wash: #14261d;
  --cx-warn: #f0a94a;   --cx-warn-ink: #f7c078;   --cx-warn-wash: #2a2114;
  --cx-danger: #f0625c; --cx-danger-ink: #f79490; --cx-danger-wash: #2e1a1a;
  --cx-chart-1: #7aa2e3;
  --cx-chart-2: #4fb8aa;
  --cx-chart-3: #eba25a;
  --cx-chart-4: #ad8fe2;
  --cx-chart-5: #e57f99;
  --cx-chart-6: #9eacba;
  --cx-code-bg: #282c31;
  --cx-code-ink: #d3d6db;
  --cx-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
  --cx-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.4);
  --cx-focus-ring: rgba(255, 167, 51, 0.65);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cx-canvas); /* body 必须显式设背景 */
  color: var(--cx-text);
  font-family: var(--cx-font-sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

:focus-visible { outline: 2px solid var(--cx-focus-ring); outline-offset: 2px; border-radius: var(--cx-radius-sm); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---- 纸：屏幕上是一张 A4 纸浮在画布上；打印时正好一页 ---- */
.sheet {
  width: 210mm;
  min-height: 297mm;
  margin: 20px auto;
  padding: 14mm;                 /* 打印时就是页边距（@page margin 设 0） */
  background: var(--cx-surface);
  border: 1px solid var(--cx-line);
  box-shadow: var(--cx-shadow-2);
  display: flex;
  flex-direction: column;
  gap: 20px;
  font-size: 14.5px;
  line-height: 1.68;
}
@media screen and (max-width: 840px) {
  .sheet { width: auto; min-height: 0; margin: 12px; padding: 20px; box-shadow: none; }
}

/* ---- 报头 ---- */
.masthead {
  display: flex; flex-direction: column; gap: 4px;
  padding-bottom: 12px; border-bottom: 1px solid var(--cx-line);
}
.eyebrow { margin: 0; font-size: 12px; line-height: 18px; color: var(--cx-muted); }
.title { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 650; color: var(--cx-ink); text-wrap: balance; }
.conclusion { margin: 2px 0 0; font-size: 16px; line-height: 1.5; font-weight: 600; color: var(--cx-ink); }

/* ---- 读数：全页唯一的琥珀，只放一个 ---- */
.readout { display: flex; flex-direction: column; gap: 2px; }
.readout__label { margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--cx-muted); }
.readout__value {
  margin: 0; font-size: 46px; line-height: 1.05; font-weight: 650;
  color: var(--cx-accent-ink); font-variant-numeric: tabular-nums;
}
.readout__note { margin: 0; font-size: 12px; line-height: 18px; color: var(--cx-muted); }

/* ---- 一排小结读数（用了 readout 就别再用；二选一，最多三个） ---- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: var(--cx-radius-md); }
.stat__label { margin: 0; font-size: 12px; line-height: 18px; color: var(--cx-muted); }
.stat__value { margin: 0; font-size: 20px; line-height: 26px; font-weight: 650; color: var(--cx-ink); font-variant-numeric: tabular-nums; }
.stat__unit { margin-left: 3px; font-size: 12px; font-weight: 400; color: var(--cx-muted); }

/* ---- 小节 ---- */
.section { display: flex; flex-direction: column; gap: 8px; }
.section > h2 { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 650; color: var(--cx-ink); }
.section p { margin: 0; font-size: 14px; line-height: 1.7; }

/* ---- 并排两栏：窄屏折成一列 ---- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media screen and (max-width: 840px) { .grid2 { grid-template-columns: 1fr; } }

/* ---- 要点列表 ---- */
.takeaways { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.takeaways li { font-size: 14px; line-height: 1.62; }
.takeaways li::marker { color: var(--cx-faint); font-variant-numeric: tabular-nums; }

/* ---- 图 + 图注 + 数据表孪生体 ---- */
.figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.figure-outer { position: relative; }
.figure-scroll { overflow-x: auto; }
.figure svg { display: block; width: 100%; height: auto; min-width: 520px; max-width: 640px; }
.figcaption { font-size: 12px; line-height: 18px; color: var(--cx-muted); }
.data-twin { font-size: 12px; }
.data-twin > summary { cursor: pointer; color: var(--cx-muted); padding: 2px 0; }
.data-twin > summary:hover { color: var(--cx-text); }
.data-twin[open] > summary { margin-bottom: 6px; }

/* ---- 表格 ---- */
.table-wrap { overflow-x: auto; border: 1px solid var(--cx-line); border-radius: var(--cx-radius-md); background: var(--cx-surface); }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 18px; }
.table-wrap th, .table-wrap td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--cx-line); }
.table-wrap thead th { font-size: 12px; font-weight: 600; color: var(--cx-muted); }
.table-wrap tbody tr:last-child td { border-bottom: 0; }
.table-wrap .num { text-align: right; font-variant-numeric: tabular-nums; }

.table-outer { position: relative; }
.scroll-hint { display: none; margin: 4px 0 0; font-size: 12px; line-height: 18px; color: var(--cx-faint); }
@media (max-width: 720px) {
  .table-outer::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 32px;
    background: linear-gradient(to right, transparent, var(--cx-surface));
    pointer-events: none;
    border-top-right-radius: var(--cx-radius-md); border-bottom-right-radius: var(--cx-radius-md);
  }
  .figure-outer::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 32px;
    background: linear-gradient(to right, transparent, var(--cx-surface));
    pointer-events: none;
  }
  .scroll-hint { display: block; }
}

/* ---- 状态标签 ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; font-size: 12px; line-height: 18px; border-radius: var(--cx-radius-pill); white-space: nowrap; }
.pill__dot { width: 6px; height: 6px; border-radius: var(--cx-radius-pill); flex: none; }
.pill--ok      { color: var(--cx-ok-ink);     background: var(--cx-ok-wash); }
.pill--ok      .pill__dot { background: var(--cx-ok); }
.pill--warn    { color: var(--cx-warn-ink);   background: var(--cx-warn-wash); }
.pill--warn    .pill__dot { background: var(--cx-warn); }
.pill--danger  { color: var(--cx-danger-ink); background: var(--cx-danger-wash); }
.pill--danger  .pill__dot { background: var(--cx-danger); }
.pill--neutral { color: var(--cx-muted);      background: var(--cx-fill); }
.pill--neutral .pill__dot { background: var(--cx-faint); }

/* ---- callout：说明 / 注意 / 风险 ---- */
.callout { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; border: 1px solid var(--cx-line); border-radius: var(--cx-radius-lg); }
.callout__title { margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; }
.callout__body { margin: 0; font-size: 14px; line-height: 1.62; color: var(--cx-text); }
.callout--note   { background: var(--cx-fill); }
.callout--note   .callout__title { color: var(--cx-muted); }
.callout--warn   { background: var(--cx-warn-wash);   border-color: transparent; }
.callout--warn   .callout__title { color: var(--cx-warn-ink); }
.callout--danger { background: var(--cx-danger-wash); border-color: transparent; }
.callout--danger .callout__title { color: var(--cx-danger-ink); }

/* ---- 脚注 ---- */
.footnote { margin-top: auto; border-top: 1px solid var(--cx-line); padding-top: 8px; }
.footnote p { margin: 0; font-size: 12px; line-height: 18px; color: var(--cx-muted); }

/* ---- 打印：固定亮色，正好一页 A4 ---- */
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    color-scheme: light;
    --cx-ink: #191a1c;
    --cx-text: #36383c;
    --cx-muted: #5a5e66;
    --cx-faint: #747a82;
    --cx-line: #ecedef;
    --cx-line-2: #e2e3e6;
    --cx-fill: #f4f5f7;
    --cx-fill-2: #eeeff1;
    --cx-canvas: #ffffff;
    --cx-surface: #ffffff;
    --cx-raised: #ffffff;
    --cx-accent: #f57f17;
    --cx-accent-press: #d96e0a;
    --cx-accent-ink: #9a5413;
    --cx-accent-wash: #fdf1e2;
    --cx-on-accent: #ffffff;
    --cx-ok: #1f9d55;     --cx-ok-ink: #12703a;     --cx-ok-wash: #e8f6ee;
    --cx-warn: #e8901c;   --cx-warn-ink: #8f5406;   --cx-warn-wash: #faf0dc;
    --cx-danger: #dc2626; --cx-danger-ink: #b91c1c; --cx-danger-wash: #fdecec;
    --cx-chart-1: #3d6bb3;
    --cx-chart-2: #2a9d8f;
    --cx-chart-3: #d9822b;
    --cx-chart-4: #8a63c2;
    --cx-chart-5: #c9506f;
    --cx-chart-6: #6b7b8c;
    --cx-code-bg: #212121;
    --cx-code-ink: #e0e0e0;
  }
  @page { size: A4; margin: 0; }   /* 页边距交给 .sheet 的 padding，屏幕与打印一致 */
  body { background: #fff; }
  .sheet { width: auto; min-height: 297mm; margin: 0; padding: 14mm; border: 0; box-shadow: none; }
  /* 窄屏的横滑提示与右缘渐隐在纸面没有意义，打印时去掉 */
  .scroll-hint { display: none !important; }
  .table-outer::after, .figure-outer::after { display: none !important; }
  table, figure, .callout, .readout, .stat-row { break-inside: avoid; }
  thead { display: table-header-group; }
  h2 { break-after: avoid; }
}

/* ---- 窄屏（≤480px）：图不横向滚动，数值靠展开的数据表读 ----
   手写 SVG 带 min-width，窄屏会横向滚动、图内文字缩到读不清。这里让图缩到一栏宽
   （不再横滑），并由页尾的脚本把它的数据表孪生体展开——数值不只活在图形里。 */
@media screen and (max-width: 480px) {
  .figure svg { min-width: 0; }
  .figure-scroll { overflow-x: visible; }
  /* 图不再横滑，那行「左右滑动看图」的提示和右缘渐隐都不成立了，去掉 */
  .figure > .scroll-hint { display: none; }
  .figure-outer::after { display: none; }
}
</style>
</head>
<body>
<!-- CONTENT:START -->
<article class="sheet">

  <header class="masthead">
    <p class="eyebrow"><!-- SLOT: EYEBROW — 类型与日期，如「进展 · 2026 年 10 月 4 日」 -->进展 · 2026 年 10 月 4 日</p>
    <h1 class="title"><!-- SLOT: TITLE — 这一页的名字，一个专名 -->单页标题</h1>
    <p class="conclusion"><!-- SLOT: CONCLUSION — 一句话结论，放这一页最想让人记住的那句 -->把这一页的结论用一句话写在这里，带具体数字。</p>
  </header>

  <!-- SLOT: READOUT — 全页唯一的琥珀，只放一个读数。改用 ≤3 个 stat tiles 就换成 .stat-row 那块。 -->
  <div class="readout">
    <p class="readout__label">读数标签</p>
    <p class="readout__value">0.00 秒</p>
    <p class="readout__note">读数的一句话说明，带上对比值。</p>
  </div>

  <!-- SLOT: CHART — 一张小图，紧跟数据表孪生体（默认折叠），数值不只活在图形里。 -->
  <section class="section">
    <h2>图与数据</h2>
    <figure class="figure">
      <div class="figure-outer">
      <div class="figure-scroll">
        <svg viewBox="0 0 640 210" role="img" aria-label="各格式文件预览耗时，改前 14.5 到 16.4 秒，改后仅 Markdown 约 1 秒，其余未测">
          <g style="stroke:var(--cx-line)" stroke-width="1">
            <line x1="96" y1="26" x2="96" y2="200"/>
            <line x1="264" y1="26" x2="264" y2="200"/>
            <line x1="432" y1="26" x2="432" y2="200"/>
            <line x1="600" y1="26" x2="600" y2="200"/>
          </g>
          <line x1="96" y1="26" x2="600" y2="26" style="stroke:var(--cx-line-2)" stroke-width="1"/>
          <g style="fill:var(--cx-muted)" font-size="12" font-family="var(--cx-font-sans)" text-anchor="middle">
            <text x="96" y="204">0</text><text x="264" y="204">6</text>
            <text x="432" y="204">12</text><text x="600" y="204">18</text>
          </g>
          <g style="fill:var(--cx-muted)" font-size="12" font-family="var(--cx-font-sans)" text-anchor="end">
            <text x="88" y="45">Markdown</text>
            <text x="88" y="79">Word</text>
            <text x="88" y="113">Excel</text>
            <text x="88" y="147">PPT</text>
            <text x="88" y="181">PDF</text>
          </g>
          <!-- 改前：五种格式各一次实测（副系列拉低一档到 faint，和改后的 text 去色也分得开） -->
          <g style="fill:var(--cx-faint)">
            <rect x="96" y="34" width="406" height="10" rx="2"/>
            <rect x="96" y="68" width="426" height="10" rx="2"/>
            <rect x="96" y="102" width="454" height="10" rx="2"/>
            <rect x="96" y="136" width="459" height="10" rx="2"/>
            <rect x="96" y="170" width="448" height="10" rx="2"/>
          </g>
          <!-- 改后：只测了 Markdown，柱高取 0.91 秒（三次 0.91 / 1.06 / 1.17） -->

<script>
  // 窄屏（≤480px）：把手写 SVG 图的 data twin（数据表）展开，数值不只活在图形里；
  // 图本身在窄屏由样式缩到一栏宽、不再横向滚动（见样式里的 480px 块）。
  (() => {
    const mq = window.matchMedia('(max-width: 480px)');
    const sync = () => {
      document.querySelectorAll('.figure').forEach((fig) => {
        const twin = fig.querySelector('details.data-twin');
        if (!twin) return;
        if (mq.matches) {
          if (!twin.open) { twin.open = true; twin.dataset.autoOpen = '1'; }
        } else if (twin.dataset.autoOpen) {
          twin.open = false;
          delete twin.dataset.autoOpen;
        }
      });
    };
    sync();
    mq.addEventListener('change', sync);
  })();
</script>
