# Common Parameters
# Shared path and query parameters used across multiple domains

PageStart:
  name: page_start
  in: query
  description: ID of the first item on the page, leave empty to start from beginning
  schema:
    type: integer
    format: int64

PageSize:
  name: page_size
  in: query
  description: Number of items per page
  schema:
    type: integer
    format: int64
    default: 20
    minimum: 1
    maximum: 100

