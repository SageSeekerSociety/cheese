# Security Schemes
# Authentication and authorization configurations

BearerAuth:
  description: JWT access token authentication
  type: http
  scheme: bearer
  bearerFormat: JWT

RefreshTokenCookie:
  type: apiKey
  description: >-
    Opaque refresh token in an HTTP-only cookie scoped to /api/users/auth.
    Rotated on every refresh; a replaced token presented again after a short
    grace window ends the sign-in.
  name: cheese_refresh
  in: cookie

ApiKeyAuth:
  type: apiKey
  description: API key for service-to-service communication
  name: X-API-Key
  in: header
