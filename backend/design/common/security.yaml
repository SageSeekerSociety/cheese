# Security Schemes
# Authentication and authorization configurations

BearerAuth:
  description: JWT access token authentication
  type: http
  scheme: bearer
  bearerFormat: JWT

RefreshTokenCookie:
  type: apiKey
  description: Refresh token passed via HTTP-only cookie
  name: REFRESH_TOKEN
  in: cookie

ApiKeyAuth:
  type: apiKey
  description: API key for service-to-service communication
  name: X-API-Key
  in: header
