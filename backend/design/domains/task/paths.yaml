# Task Domain Paths

/tasks:
  get:
    summary: List tasks
    operationId: listTasks
    tags: [Tasks]
    parameters:
      - name: spaceId
        in: query
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        schema:
          $ref: './schemas.yaml#/TaskStatus'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Tasks list
  post:
    summary: Create task
    operationId: createTask
    tags: [Tasks]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateTaskRequest'
    responses:
      '201':
        description: Task created

/tasks/{taskId}:
  get:
    summary: Get task details
    operationId: getTask
    tags: [Tasks]
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    responses:
      '200':
        description: Task details
  put:
    summary: Update task
    operationId: updateTask
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateTaskRequest'
    responses:
      '200':
        description: Task updated
  delete:
    summary: Delete task
    operationId: deleteTask
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    responses:
      '204':
        description: Task deleted

/tasks/{taskId}/resubmit:
  post:
    summary: Request task resubmission
    operationId: requestResubmit
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    responses:
      '200':
        description: Resubmission requested

/tasks/{taskId}/participants:
  get:
    summary: List task participants
    operationId: listTaskParticipants
    tags: [Tasks]
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Participants list
  post:
    summary: Join task
    operationId: joinTask
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              teamId:
                type: integer
                format: int64
                nullable: true
    responses:
      '201':
        description: Joined task

/tasks/{taskId}/participants/{participantId}:
  get:
    summary: Get participant details
    operationId: getTaskParticipant
    tags: [Tasks]
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Participant details
  delete:
    summary: Leave task
    operationId: leaveTask
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Left task

/tasks/{taskId}/participants/{participantId}/submissions:
  get:
    summary: List participant submissions
    operationId: listSubmissions
    tags: [Tasks]
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Submissions list
  post:
    summary: Submit work
    operationId: submitWork
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: string
              attachmentIds:
                type: array
                items:
                  type: integer
                  format: int64
    responses:
      '201':
        description: Work submitted

/tasks/{taskId}/participants/{participantId}/submissions/{version}:
  get:
    summary: Get submission by version
    operationId: getSubmission
    tags: [Tasks]
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: version
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Submission details

/tasks/{taskId}/participants/{participantId}/submissions/{submissionId}/review:
  post:
    summary: Review submission
    operationId: reviewSubmission
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: submissionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              score:
                type: number
                format: float
              feedback:
                type: string
    responses:
      '200':
        description: Review submitted

/tasks/{taskId}/teams:
  get:
    summary: List task teams
    operationId: listTaskTeams
    tags: [Tasks]
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Teams list

# AI Advice endpoints
/tasks/{taskId}/ai-advice/conversations:
  get:
    summary: List AI advice conversations
    operationId: listAiConversations
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Conversations list
  post:
    summary: Create AI advice conversation
    operationId: createAiConversation
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
    responses:
      '201':
        description: Conversation created

/tasks/{taskId}/ai-advice/conversations/grouped:
  get:
    summary: List AI conversations grouped by user
    operationId: listAiConversationsGrouped
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    responses:
      '200':
        description: Grouped conversations

/tasks/{taskId}/ai-advice/conversations/{conversationId}:
  get:
    summary: Get AI conversation details
    operationId: getAiConversation
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Conversation details
  delete:
    summary: Delete AI conversation
    operationId: deleteAiConversation
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Conversation deleted

/tasks/{taskId}/ai-advice:
  post:
    summary: Get AI advice
    operationId: getAiAdvice
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              conversationId:
                type: integer
                format: int64
              message:
                type: string
            required:
              - message
    responses:
      '200':
        description: AI advice response

/tasks/{taskId}/ai-advice/status:
  get:
    summary: Get AI advice status
    operationId: getAiAdviceStatus
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    responses:
      '200':
        description: AI advice status

# Task participation routes (Python-specific)
/tasks/{taskId}/participations/user:
  post:
    summary: Join task as user (self-join)
    operationId: joinTaskAsUser
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              deadline:
                type: integer
                format: int64
                description: Deadline timestamp in milliseconds
              email:
                type: string
              phone:
                type: string
              applyReason:
                type: string
              personalAdvantage:
                type: string
              remark:
                type: string
    responses:
      '200':
        description: Joined task successfully

/tasks/{taskId}/participations/team:
  post:
    summary: Join task as team
    operationId: joinTaskAsTeam
    tags: [Tasks]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              teamId:
                type: integer
                format: int64
              deadline:
                type: integer
                format: int64
              email:
                type: string
              phone:
                type: string
              applyReason:
                type: string
              personalAdvantage:
                type: string
              remark:
                type: string
            required:
              - teamId
    responses:
      '200':
        description: Team joined task successfully

# AI Advice streaming endpoint
/tasks/{taskId}/ai-advice/conversations/stream:
  post:
    summary: Stream AI advice conversation (SSE)
    operationId: streamAiConversation
    tags: [Tasks, AI]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TaskId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              question:
                type: string
              parentId:
                type: integer
                format: int64
              conversationId:
                type: string
              modelType:
                type: string
              context:
                type: object
                properties:
                  section:
                    type: string
                  sectionIndex:
                    type: integer
                  index:
                    type: integer
            required:
              - question
    responses:
      '200':
        description: SSE stream of AI response
        content:
          text/event-stream:
            schema:
              type: string
