# Health Check Schemas

HealthStatus:
  type: object
  properties:
    status:
      type: string
      enum: [healthy, unhealthy, degraded]
    timestamp:
      type: string
      format: date-time

DetailedHealthStatus:
  type: object
  properties:
    status:
      type: string
      enum: [healthy, degraded]
    checks:
      type: object
      description: >
        One entry per dependency, keyed by name (database, redis, memory).
        Only some of them gate readiness — see /readyz. `skipped` means the
        check had nothing to do on this deployment, which is not a failure.
      additionalProperties:
        type: object
        properties:
          status:
            type: string
            enum: [up, down, skipped]
          error:
            type: string
