# Health Check Schemas

HealthStatus:
  type: object
  properties:
    status:
      type: string
      enum: [healthy, unhealthy, degraded]
    timestamp:
      type: string
      format: date-time

DetailedHealthStatus:
  type: object
  properties:
    status:
      type: string
      enum: [healthy, unhealthy, degraded]
    database:
      type: object
      properties:
        status:
          type: string
        latency_ms:
          type: number
    redis:
      type: object
      properties:
        status:
          type: string
        latency_ms:
          type: number
    elasticsearch:
      type: object
      properties:
        status:
          type: string
        latency_ms:
          type: number
    timestamp:
      type: string
      format: date-time
