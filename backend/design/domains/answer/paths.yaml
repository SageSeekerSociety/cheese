# Answer Domain Paths

/questions/{questionId}/answers:
  get:
    summary: List answers for a question
    operationId: listAnswers
    tags: [Answers]
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
      - name: sort
        in: query
        schema:
          type: string
          enum: [newest, oldest, votes]
          default: votes
    responses:
      '200':
        description: Answers list
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    answers:
                      type: array
                      items:
                        $ref: './schemas.yaml#/Answer'
                    page:
                      $ref: '../../common/responses.yaml#/Page'
  post:
    summary: Create answer
    operationId: createAnswer
    tags: [Answers]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateAnswerRequest'
    responses:
      '201':
        description: Answer created
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64

/questions/{questionId}/answers/{answerId}:
  get:
    summary: Get answer details
    operationId: getAnswer
    tags: [Answers]
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/AnswerId'
    responses:
      '200':
        description: Answer details
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    answer:
                      $ref: './schemas.yaml#/Answer'
  put:
    summary: Update answer
    operationId: updateAnswer
    tags: [Answers]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/AnswerId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateAnswerRequest'
    responses:
      '200':
        description: Answer updated
  delete:
    summary: Delete answer
    operationId: deleteAnswer
    tags: [Answers]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/AnswerId'
    responses:
      '204':
        description: Answer deleted

/questions/{questionId}/answers/{answerId}/attitudes:
  post:
    summary: Vote on answer
    operationId: voteAnswer
    tags: [Answers]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/AnswerId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              attitude_type:
                $ref: '../../common/responses.yaml#/AttitudeType'
    responses:
      '200':
        description: Vote recorded
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    attitudes:
                      $ref: '../../common/responses.yaml#/AttitudeStats'

/questions/{questionId}/answers/{answerId}/favorite:
  post:
    summary: Favorite answer
    operationId: favoriteAnswer
    tags: [Answers]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/AnswerId'
    responses:
      '200':
        description: Answer favorited
  delete:
    summary: Unfavorite answer
    operationId: unfavoriteAnswer
    tags: [Answers]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/QuestionId'
      - $ref: '../../common/parameters.yaml#/AnswerId'
    responses:
      '200':
        description: Answer unfavorited
