# Space Domain Paths

/spaces:
  get:
    summary: List approved spaces
    operationId: listSpaces
    tags: [Spaces]
    parameters:
      - name: q
        in: query
        description: Search keyword
        schema:
          type: string
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Spaces list
  post:
    summary: Submit a space for platform review
    operationId: createSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateSpaceRequest'
    responses:
      '201':
        description: Space created in PENDING state; it cannot accept tasks until approved

/space-applications:
  get:
    summary: List the caller's space applications
    operationId: listSpaceApplications
    tags: [Spaces]
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Owner's applications with review state and rejection reason

/space-applications/{spaceId}/resubmit:
  post:
    summary: Resubmit a rejected application as its owner
    operationId: resubmitSpaceApplication
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
              intro:
                type: string
              avatarId:
                type: integer
                description: Uploaded avatar ID; omitted to keep the existing avatar
    responses:
      '200':
        description: Application returned to PENDING
      '409':
        description: Application is not rejected, or the name is taken

/admin/spaces:
  get:
    summary: List space applications as a platform administrator
    operationId: listSpaceReviews
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          default: PENDING
    responses:
      '200':
        description: Applications with applicant and review details
      '403':
        description: Platform administrator required

/admin/spaces/{spaceId}/review:
  post:
    summary: Approve or reject a pending space as a platform administrator
    operationId: reviewSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [approved]
            properties:
              approved:
                type: boolean
              reason:
                type: string
                description: Required and nonblank when rejecting
    responses:
      '200':
        description: Application reviewed
      '400':
        description: Rejection reason missing
      '403':
        description: Platform administrator required
      '409':
        description: Application already reviewed

/spaces/{spaceId}:
  get:
    summary: Get space details
    operationId: getSpace
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Space details
  put:
    summary: Update space
    operationId: updateSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateSpaceRequest'
    responses:
      '200':
        description: Space updated
  delete:
    summary: Delete space
    operationId: deleteSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '204':
        description: Space deleted

/spaces/{spaceId}/categories:
  get:
    summary: List space categories
    operationId: listSpaceCategories
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Categories list
  post:
    summary: Create category
    operationId: createSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCategoryRequest'
    responses:
      '201':
        description: Category created

/spaces/{spaceId}/categories/{categoryId}:
  get:
    summary: Get category details
    operationId: getSpaceCategory
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Category details
  put:
    summary: Update category
    operationId: updateSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCategoryRequest'
    responses:
      '200':
        description: Category updated
  delete:
    summary: Delete category
    operationId: deleteSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Category deleted

/spaces/{spaceId}/categories/{categoryId}/archive:
  post:
    summary: Archive category
    operationId: archiveSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Category archived

/spaces/{spaceId}/managers:
  get:
    summary: List space managers
    operationId: listSpaceManagers
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Managers list

/spaces/{spaceId}/managers/{userId}:
  put:
    summary: Add space manager
    operationId: addSpaceManager
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: Manager added
  delete:
    summary: Remove space manager
    operationId: removeSpaceManager
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '204':
        description: Manager removed

/spaces/{spaceId}/analytics/tasks:
  get:
    summary: Get space task analytics
    operationId: getSpaceTaskAnalytics
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Task analytics

/spaces/{spaceId}/publishers/participation:
  get:
    summary: Get publisher participation stats
    operationId: getPublisherParticipation
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Participation stats

/spaces/{spaceId}/participants/export:
  get:
    summary: Export participants data
    operationId: exportParticipants
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Participants data export

/spaces/join:
  post:
    summary: Join a space with an invite code
    description: |
      Redeem one of the space's invite codes and become a member. Only a CODE
      space accepts a code: a PRIVATE one is joined by being added, and a
      PUBLIC one needs no door. Redeeming twice is a no-op, not an error.
    operationId: joinSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/JoinSpaceRequest'
    responses:
      '200':
        description: Joined; the space is returned
      '400':
        description: The code is exhausted, expired, or the space is not CODE
      '404':
        description: No such invite code

/spaces/{spaceId}/members:
  get:
    summary: List space members
    description: |
      404 when the caller cannot see the space at all, so a PRIVATE space is
      not confirmed to exist through this route either.
    operationId: listSpaceMembers
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Members list
      '404':
        description: The space does not exist, or the caller cannot see it
  post:
    summary: Add a space member
    description: |
      The owner and admins may add. This is the only way into a PRIVATE space.
    operationId: addSpaceMember
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/AddSpaceMemberRequest'
    responses:
      '201':
        description: Member added
      '403':
        description: The caller is neither the owner nor an admin

/spaces/{spaceId}/members/{userId}:
  delete:
    summary: Remove a space member
    description: |
      The owner and admins alike may remove. Removal only decides who the
      space is visible to — the member's tasks, submissions and projects are
      not this space's to delete. Revoke an admin's role through /managers.
    operationId: removeSpaceMember
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '204':
        description: Member removed
      '400':
        description: The target is an admin of this space
      '403':
        description: The caller is neither the owner nor an admin

/spaces/{spaceId}/leave:
  post:
    summary: Leave a space
    description: |
      Stop being a member. Nothing else the person owns is touched. The owner
      and admins cannot leave — the role is revoked by the owner, not set down.
    operationId: leaveSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '204':
        description: Left the space
      '403':
        description: The caller is the owner or an admin of this space
      '404':
        description: The caller is not a member of this space

/spaces/{spaceId}/invite-codes:
  get:
    summary: List a space's invite codes
    description: The owner and admins see the codes; nobody else sees them at all.
    operationId: listSpaceInviteCodes
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Invite codes list
  post:
    summary: Mint a space invite code
    operationId: createSpaceInviteCode
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateSpaceInviteCodeRequest'
    responses:
      '201':
        description: Invite code created
