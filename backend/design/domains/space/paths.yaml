# Space Domain Paths

/spaces:
  get:
    summary: List approved spaces
    operationId: listSpaces
    tags: [Spaces]
    parameters:
      - name: q
        in: query
        description: Search keyword
        schema:
          type: string
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Spaces list
  post:
    summary: Submit a space for platform review
    operationId: createSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateSpaceRequest'
    responses:
      '201':
        description: Space created in PENDING state; it cannot accept tasks until approved

/space-applications:
  get:
    summary: List the caller's space applications
    operationId: listSpaceApplications
    tags: [Spaces]
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Owner's applications with review state and rejection reason

/space-applications/{spaceId}/resubmit:
  post:
    summary: Resubmit a rejected application as its owner
    operationId: resubmitSpaceApplication
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
              intro:
                type: string
    responses:
      '200':
        description: Application returned to PENDING
      '409':
        description: Application is not rejected, or the name is taken

/admin/spaces:
  get:
    summary: List space applications as a platform administrator
    operationId: listSpaceReviews
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          default: PENDING
    responses:
      '200':
        description: Applications with applicant and review details
      '403':
        description: Platform administrator required

/admin/spaces/{spaceId}/review:
  post:
    summary: Approve or reject a pending space as a platform administrator
    operationId: reviewSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [approved]
            properties:
              approved:
                type: boolean
              reason:
                type: string
                description: Required and nonblank when rejecting
    responses:
      '200':
        description: Application reviewed
      '400':
        description: Rejection reason missing
      '403':
        description: Platform administrator required
      '409':
        description: Application already reviewed

/spaces/{spaceId}:
  get:
    summary: Get space details
    operationId: getSpace
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Space details
  put:
    summary: Update space
    operationId: updateSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateSpaceRequest'
    responses:
      '200':
        description: Space updated
  delete:
    summary: Delete space
    operationId: deleteSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '204':
        description: Space deleted

/spaces/{spaceId}/categories:
  get:
    summary: List space categories
    operationId: listSpaceCategories
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Categories list
  post:
    summary: Create category
    operationId: createSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCategoryRequest'
    responses:
      '201':
        description: Category created

/spaces/{spaceId}/categories/{categoryId}:
  get:
    summary: Get category details
    operationId: getSpaceCategory
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Category details
  put:
    summary: Update category
    operationId: updateSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCategoryRequest'
    responses:
      '200':
        description: Category updated
  delete:
    summary: Delete category
    operationId: deleteSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Category deleted

/spaces/{spaceId}/categories/{categoryId}/archive:
  post:
    summary: Archive category
    operationId: archiveSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Category archived

