# Space Domain Schemas

Space:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    intro:
      type: string
    description:
      type: string
    reviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    reviewReason:
      type: string
      nullable: true
    avatarId:
      type: integer
      format: int64
    enableRank:
      type: boolean
    defaultCategoryId:
      type: integer
      format: int64
    announcements:
      type: string
      description: |
        JSON-encoded array of SpaceAnnouncement objects, e.g. `"[]"` or
        `'[{"title":"...","content":"...","createdAt":...,"updatedAt":...,"publisher":"..."}]'`.
        Stored as JSONB internally; serialized as a JSON string on the wire to
        match the NT contract and the Vue frontend (which calls JSON.parse on it).
    taskTemplates:
      type: string
      description: |
        JSON-encoded array of SpaceTaskTemplate objects. Same wire format as
        announcements (JSON string of an array).
    createdAt:
      type: integer
      format: int64
    updatedAt:
      type: integer
      format: int64
SpaceCategory:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
    space_id:
      type: integer
      format: int64
    is_archived:
      type: boolean
    created_at:
      type: integer
      format: int64

SpaceManager:
  type: object
  properties:
    user:
      $ref: '../user/schemas.yaml#/User'
    added_at:
      type: integer
      format: int64

CreateSpaceRequest:
  type: object
  properties:
    name:
      type: string
    intro:
      type: string
    description:
      type: string
    avatarId:
      type: integer
      format: int64
    enableRank:
      type: boolean
    announcements:
      oneOf:
        - type: string
        - type: array
          items:
            type: object
      description: |
        Either a JSON-encoded string (NT-compatible form, what the Vue frontend
        sends via JSON.stringify) or a raw JSON array. The server normalizes
        both to a list before storing.
    taskTemplates:
      oneOf:
        - type: string
        - type: array
          items:
            type: object
      description: Same shape as announcements.
  required:
    - name

UpdateSpaceRequest:
  type: object
  properties:
    name:
      type: string
    intro:
      type: string
    description:
      type: string
    avatarId:
      type: integer
      format: int64
    enableRank:
      type: boolean
    announcements:
      oneOf:
        - type: string
        - type: array
          items:
            type: object
    taskTemplates:
      oneOf:
        - type: string
        - type: array
          items:
            type: object
    defaultCategoryId:
      type: integer
      format: int64

CreateCategoryRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
  required:
    - name

SpaceMember:
  type: object
  description: |
    One person the space is visible to. Membership and the admin relation are
    different questions: a space's owner and admins keep seeing it without a
    row here, and removing a member takes nothing else away.
  properties:
    userId:
      type: integer
      format: int64
    joinedAt:
      type: integer
      format: int64
    user:
      $ref: '../user/schemas.yaml#/User'

SpaceInviteCode:
  type: object
  description: |
    A space's own invite code. Not the platform's registration `invite_code`:
    redeeming this one puts you in the space, it does not create an account.
  properties:
    id:
      type: integer
      format: int64
    spaceId:
      type: integer
      format: int64
    code:
      type: string
    maxUses:
      type: integer
    useCount:
      type: integer
    expiresAt:
      type: integer
      format: int64
      nullable: true
    createdAt:
      type: integer
      format: int64

JoinSpaceRequest:
  type: object
  properties:
    code:
      type: string
  required:
    - code

AddSpaceMemberRequest:
  type: object
  properties:
    userId:
      type: integer
      format: int64
  required:
    - userId

CreateSpaceInviteCodeRequest:
  type: object
  properties:
    maxUses:
      type: integer
      description: How many times the code may be redeemed. Defaults to 50.
    expiresAt:
      type: integer
      format: int64
      nullable: true
      description: Epoch milliseconds; omit for a code that never expires.
