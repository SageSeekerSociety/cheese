# Avatar Domain Schemas

Avatar:
  type: object
  properties:
    id:
      type: integer
      format: int64
    url:
      type: string
      description: Avatar image URL
    is_predefined:
      type: boolean
      description: Whether this is a system predefined avatar
    created_at:
      type: integer
      format: int64

PredefinedAvatar:
  type: object
  properties:
    id:
      type: integer
      format: int64
    url:
      type: string
    name:
      type: string
