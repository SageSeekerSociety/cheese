# Avatar Domain Paths

/avatars:
  post:
    summary: Upload avatar
    operationId: uploadAvatar
    tags: [Avatars]
    security:
      - BearerAuth: []
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
            required:
              - file
    responses:
      '200':
        description: Avatar uploaded
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64

/avatars/default:
  get:
    summary: Get default avatar
    operationId: getDefaultAvatar
    tags: [Avatars]
    responses:
      '200':
        description: Default avatar image
        content:
          image/*:
            schema:
              type: string
              format: binary

/avatars/default/id:
  get:
    summary: Get default avatar ID
    operationId: getDefaultAvatarId
    tags: [Avatars]
    responses:
      '200':
        description: Default avatar ID
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64

/avatars/predefined/id:
  get:
    summary: Get predefined avatar IDs
    operationId: getPredefinedAvatarIds
    tags: [Avatars]
    responses:
      '200':
        description: Predefined avatar IDs
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    avatars:
                      type: array
                      items:
                        $ref: './schemas.yaml#/PredefinedAvatar'

/avatars/{avatarId}:
  get:
    summary: Get avatar image
    operationId: getAvatar
    tags: [Avatars]
    parameters:
      - $ref: '../../common/parameters.yaml#/AvatarId'
    responses:
      '200':
        description: Avatar image
        content:
          image/*:
            schema:
              type: string
              format: binary
  delete:
    summary: Delete avatar
    operationId: deleteAvatar
    tags: [Avatars]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/AvatarId'
    responses:
      '200':
        description: Avatar deleted
