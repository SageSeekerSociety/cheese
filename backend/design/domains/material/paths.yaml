# Material Domain Paths

/materials:
  get:
    summary: List materials
    operationId: listMaterials
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Materials list
  post:
    summary: Upload material
    operationId: uploadMaterial
    tags: [Materials]
    security:
      - BearerAuth: []
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
              type:
                type: string
                enum: [image, video, audio, file]
            required:
              - file
              - type
    responses:
      '200':
        description: Material uploaded
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64

/materials/{materialId}:
  get:
    summary: Get material details
    operationId: getMaterial
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/MaterialId'
    responses:
      '200':
        description: Material details
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    material:
                      $ref: './schemas.yaml#/Material'
  delete:
    summary: Delete material
    operationId: deleteMaterial
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/MaterialId'
    responses:
      '200':
        description: Material deleted

/material-bundles:
  get:
    summary: List material bundles
    operationId: listMaterialBundles
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - name: q
        in: query
        description: Search keyword
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum: [newest, oldest, rating]
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Material bundles list
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    materials:
                      type: array
                      items:
                        $ref: './schemas.yaml#/MaterialBundle'
                    page:
                      $ref: '../../common/responses.yaml#/Page'
  post:
    summary: Create material bundle
    operationId: createMaterialBundle
    tags: [Materials]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateMaterialBundleRequest'
    responses:
      '201':
        description: Material bundle created

/material-bundles/{materialBundleId}:
  get:
    summary: Get material bundle details
    operationId: getMaterialBundle
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/MaterialBundleId'
    responses:
      '200':
        description: Material bundle details
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    materialBundle:
                      $ref: './schemas.yaml#/MaterialBundle'
  patch:
    summary: Update material bundle
    operationId: updateMaterialBundle
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/MaterialBundleId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateMaterialBundleRequest'
    responses:
      '200':
        description: Material bundle updated
  delete:
    summary: Delete material bundle
    operationId: deleteMaterialBundle
    tags: [Materials]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/MaterialBundleId'
    responses:
      '200':
        description: Material bundle deleted
