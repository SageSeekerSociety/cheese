# Project Domain Schemas

Project:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
    owner:
      $ref: '../user/schemas.yaml#/User'
    team:
      $ref: '../team/schemas.yaml#/Team'
      nullable: true
    created_at:
      type: integer
      format: int64
    updated_at:
      type: integer
      format: int64
    member_count:
      type: integer
      format: int64
    is_member:
      type: boolean

ProjectMember:
  type: object
  properties:
    user:
      $ref: '../user/schemas.yaml#/User'
    role:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    joined_at:
      type: integer
      format: int64

CreateProjectRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    teamId:
      type: integer
      format: int64
      nullable: true
  required:
    - name

UpdateProjectRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
