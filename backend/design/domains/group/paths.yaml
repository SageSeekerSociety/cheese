# Group Domain Paths (Legacy)

/groups:
  get:
    summary: List groups
    operationId: listGroups
    tags: [Groups]
    parameters:
      - name: q
        in: query
        description: Search keyword
        schema:
          type: string
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Groups list
  post:
    summary: Create group
    operationId: createGroup
    tags: [Groups]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateGroupRequest'
    responses:
      '201':
        description: Group created

/groups/{groupId}:
  get:
    summary: Get group details
    operationId: getGroup
    tags: [Groups]
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    responses:
      '200':
        description: Group details
  put:
    summary: Update group
    operationId: updateGroup
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateGroupRequest'
    responses:
      '200':
        description: Group updated
  delete:
    summary: Delete group
    operationId: deleteGroup
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    responses:
      '204':
        description: Group deleted

/groups/{groupId}/members:
  get:
    summary: List group members
    operationId: listGroupMembers
    tags: [Groups]
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Members list
  post:
    summary: Join group
    operationId: joinGroup
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    responses:
      '201':
        description: Joined group
  delete:
    summary: Leave group
    operationId: leaveGroup
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    responses:
      '200':
        description: Left group

/groups/{groupId}/questions:
  get:
    summary: List group questions
    operationId: listGroupQuestions
    tags: [Groups]
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Questions list

/groups/{groupId}/targets:
  get:
    summary: List group targets
    operationId: listGroupTargets
    tags: [Groups]
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    responses:
      '200':
        description: Targets list
  post:
    summary: Create group target
    operationId: createGroupTarget
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              intro:
                type: string
              start_date:
                type: integer
                format: int64
              end_date:
                type: integer
                format: int64
    responses:
      '201':
        description: Target created

/groups/{groupId}/targets/{targetId}:
  get:
    summary: Get target details
    operationId: getGroupTarget
    tags: [Groups]
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
      - name: targetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Target details
  delete:
    summary: Delete target
    operationId: deleteGroupTarget
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
      - name: targetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Target deleted

/groups/{groupId}/targets/{targetId}/attend:
  post:
    summary: Attend target (check-in)
    operationId: attendGroupTarget
    tags: [Groups]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/GroupId'
      - name: targetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Attended successfully
