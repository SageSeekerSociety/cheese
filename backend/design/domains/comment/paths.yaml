# Comment Domain Paths

# Note: Specific routes must come BEFORE generic ones in FastAPI

/comments/{commentId}/attitudes:
  post:
    summary: Vote on comment
    operationId: voteComment
    tags: [Comments]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/CommentId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              attitude_type:
                $ref: '../../common/responses.yaml#/AttitudeType'
    responses:
      '200':
        description: Vote recorded
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    attitudes:
                      $ref: '../../common/responses.yaml#/AttitudeStats'

/comments/{commentId}:
  get:
    summary: Get comment by ID
    operationId: getComment
    tags: [Comments]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/CommentId'
    responses:
      '200':
        description: Comment details
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    comment:
                      $ref: './schemas.yaml#/Comment'
  patch:
    summary: Update comment
    operationId: updateComment
    tags: [Comments]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/CommentId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateCommentRequest'
    responses:
      '200':
        description: Comment updated
  delete:
    summary: Delete comment
    operationId: deleteComment
    tags: [Comments]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/CommentId'
    responses:
      '200':
        description: Comment deleted

/comments/{commentableType}/{commentableId}:
  get:
    summary: List comments for an object
    operationId: listComments
    tags: [Comments]
    security:
      - BearerAuth: []
    parameters:
      - name: commentableType
        in: path
        required: true
        schema:
          type: string
          enum:
            - answer
            - comment
            - insight
            - question
            - material_bundle
      - name: commentableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Comments list
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    comments:
                      type: array
                      items:
                        $ref: './schemas.yaml#/Comment'
                    page:
                      $ref: '../../common/responses.yaml#/Page'
  post:
    summary: Create comment
    operationId: createComment
    tags: [Comments]
    security:
      - BearerAuth: []
    parameters:
      - name: commentableType
        in: path
        required: true
        schema:
          type: string
          enum:
            - answer
            - comment
            - insight
            - question
            - material_bundle
      - name: commentableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCommentRequest'
    responses:
      '201':
        description: Comment created
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
