# Comment Domain Schemas

Comment:
  type: object
  description: Comment details
  properties:
    id:
      type: integer
      format: int64
      description: Comment ID
    commentable_id:
      type: integer
      format: int64
      description: ID of the commented object
    commentable_type:
      type: string
      description: Type of the commented object
      enum:
        - ANSWER
        - COMMENT
        - INSIGHT
        - QUESTION
        - MATERIAL_BUNDLE
    content:
      type: string
      minLength: 1
      description: Comment content
    user:
      $ref: '../user/schemas.yaml#/User'
    created_at:
      type: integer
      format: int64
      description: Creation timestamp
    attitudes:
      $ref: '../../common/responses.yaml#/AttitudeStats'
  required:
    - id
    - commentable_id
    - commentable_type
    - content
    - user
    - created_at

CreateCommentRequest:
  type: object
  properties:
    content:
      type: string
      minLength: 1
  required:
    - content

UpdateCommentRequest:
  type: object
  properties:
    content:
      type: string
      minLength: 1
