# User Domain Paths

/users:
  post:
    summary: Register user
    operationId: register
    tags: [Users]
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RegisterRequest'
    responses:
      '201':
        description: User registered successfully
        headers:
          Set-Cookie:
            description: Refresh token cookie
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/RegisterResponse'

/users/auth/login:
  post:
    summary: User login
    operationId: login
    tags: [Users]
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/LoginRequest'
    responses:
      '200':
        description: Login successful
        headers:
          Set-Cookie:
            description: Refresh token cookie
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/LoginResponse'

/users/auth/refresh-token:
  post:
    summary: Refresh access token
    operationId: refreshAccessToken
    tags: [Users]
    security:
      - RefreshTokenCookie: []
    responses:
      '200':
        description: Token refreshed
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    accessToken:
                      type: string

/users/auth/logout:
  post:
    summary: User logout
    operationId: logout
    tags: [Users]
    security:
      - RefreshTokenCookie: []
    responses:
      '200':
        description: Logged out successfully

/users/verify/email:
  post:
    summary: Send email verification code
    operationId: sendEmailVerification
    tags: [Users]
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
            required:
              - email
    responses:
      '201':
        description: Verification email sent

/users/recover/password/request:
  post:
    summary: Request password reset
    operationId: requestPasswordReset
    tags: [Users]
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
            required:
              - email
    responses:
      '200':
        description: Reset email sent

/users/recover/password/verify:
  post:
    summary: Verify token and reset password
    operationId: resetPassword
    tags: [Users]
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
              new_password:
                type: string
            required:
              - token
              - new_password
    responses:
      '200':
        description: Password reset successful

/users/{userId}:
  get:
    summary: Get user information
    operationId: getUserInfo
    tags: [Users]
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: User information
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    user:
                      $ref: './schemas.yaml#/User'
  put:
    summary: Update user information
    operationId: updateUserInfo
    tags: [Users]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              nickname:
                type: string
              intro:
                type: string
              avatarId:
                type: integer
    responses:
      '200':
        description: User updated

/users/{userId}/questions:
  get:
    summary: Get user's questions
    operationId: getUserQuestions
    tags: [Users]
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: User's questions list

/users/{userId}/answers:
  get:
    summary: Get user's answers
    operationId: getUserAnswers
    tags: [Users]
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: User's answers list

/users/{userId}/followers:
  get:
    summary: Get user's followers
    operationId: getUserFollowers
    tags: [Users]
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: User's followers list
  post:
    summary: Follow user
    operationId: followUser
    tags: [Users]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: Followed successfully
  delete:
    summary: Unfollow user
    operationId: unfollowUser
    tags: [Users]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: Unfollowed successfully

/users/{userId}/follow/questions:
  get:
    summary: Get questions followed by user
    operationId: getUserFollowedQuestions
    tags: [Users]
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Followed questions list

/users/{userId}/follow/users:
  get:
    summary: Get users followed by user
    operationId: getUserFollowedUsers
    tags: [Users]
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Followed users list

# Passkey endpoints
/users/auth/passkey/challenge:
  post:
    summary: Get Passkey login challenge
    operationId: getPasskeyChallenge
    tags: [Users, Auth]
    responses:
      '200':
        description: Challenge generated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PasskeyChallengeResponse'

/users/auth/passkey/verify:
  post:
    summary: Verify Passkey login
    operationId: verifyPasskey
    tags: [Users, Auth]
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/PasskeyVerificationRequest'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/LoginResponse'

/users/{userId}/passkeys:
  get:
    summary: List user's Passkey credentials
    operationId: listPasskeys
    tags: [Users, Auth]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: Passkey list
  post:
    summary: Register new Passkey
    operationId: registerPasskey
    tags: [Users, Auth]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/PasskeyCredentialRegistrationRequest'
    responses:
      '201':
        description: Passkey registered

/users/{userId}/passkeys/{credentialId}:
  delete:
    summary: Delete Passkey credential
    operationId: deletePasskey
    tags: [Users, Auth]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Passkey deleted

# 2FA endpoints
/users/{userId}/2fa/enable:
  post:
    summary: Enable 2FA
    operationId: enable2FA
    tags: [Users, Auth]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: TOTP verification code
    responses:
      '200':
        description: 2FA enabled
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/TOTPSetupResponse'

/users/{userId}/2fa/disable:
  post:
    summary: Disable 2FA
    operationId: disable2FA
    tags: [Users, Auth]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
    responses:
      '200':
        description: 2FA disabled

/users/{userId}/2fa/status:
  get:
    summary: Get 2FA status
    operationId: get2FAStatus
    tags: [Users, Auth]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: 2FA status

/users/auth/verify-2fa:
  post:
    summary: Verify 2FA code
    operationId: verify2FA
    tags: [Users, Auth]
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              tempToken:
                type: string
              code:
                type: string
            required:
              - tempToken
              - code
    responses:
      '200':
        description: 2FA verified
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/LoginResponse'

