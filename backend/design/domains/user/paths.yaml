# Team-related user endpoints (from Kotlin backend)
/users/me/team-requests:
  get:
    summary: List my team join requests
    operationId: listMyTeamRequests
    tags: [Users, Teams]
    security:
      - BearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: My team requests list

/users/me/team-requests/{requestId}:
  delete:
    summary: Cancel my pending team request
    operationId: cancelMyTeamRequest
    tags: [Users, Teams]
    security:
      - BearerAuth: []
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Request cancelled

/users/me/team-invitations:
  get:
    summary: List team invitations I received
    operationId: listMyTeamInvitations
    tags: [Users, Teams]
    security:
      - BearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED]
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: My team invitations list

/users/me/team-invitations/{invitationId}/accept:
  post:
    summary: Accept team invitation
    operationId: acceptTeamInvitation
    tags: [Users, Teams]
    security:
      - BearerAuth: []
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Invitation accepted

/users/me/team-invitations/{invitationId}/decline:
  post:
    summary: Decline team invitation
    operationId: declineTeamInvitation
    tags: [Users, Teams]
    security:
      - BearerAuth: []
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Invitation declined

/users/me/teams/{teamId}:
  delete:
    summary: Leave team
    operationId: leaveTeam
    tags: [Users, Teams]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/TeamId'
    responses:
      '204':
        description: Left team

