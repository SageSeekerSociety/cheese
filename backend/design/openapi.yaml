openapi: 3.0.3
info:
  title: Cheese Community API
  description: |
    Cheese is a collaborative learning platform with task management, team collaboration,
    knowledge sharing, and AI integration features.

    This API specification is split across multiple files by domain:
    - **User**: Authentication, profiles, passkeys, 2FA
    - **Question/Answer**: Q&A system with voting
    - **Comment**: Comments on various entities
    - **Topic**: Topic/tag management
    - **Material**: File uploads and material bundles
    - **Knowledge**: Knowledge base items
    - **Team**: Team management and membership
    - **Project**: Project management
    - **Space**: Learning spaces
    - **Task**: Task management with AI advice
    - **Avatar**: User avatars
    - **Attachment**: File attachments
    - **Notification**: User notifications
    - **Discussion**: Threaded discussions with reactions
    - **AI/LLM**: AI chat and quota management
  version: 2.0.0
  contact:
    name: Cheese Team
    url: https://github.com/SageSeekerSociety/cheese-backend-py

servers:
  - url: http://127.0.0.1:8799
    description: Merged backend (scripts/dev flow)
  - url: http://localhost:8081
    description: Merged backend (docker dev flow)

tags:
  - name: Users
    description: User management, authentication, profiles
  - name: Auth
    description: Authentication (passkeys, 2FA)
  - name: Questions
    description: Question management
  - name: Answers
    description: Answer management
  - name: Comments
    description: Comment system
  - name: Topics
    description: Topic/tag management
  - name: Materials
    description: Material uploads and bundles
  - name: Knowledge
    description: Knowledge base
  - name: Teams
    description: Team management
  - name: Projects
    description: Project management
  - name: Spaces
    description: Learning spaces
  - name: Tasks
    description: Task management
  - name: Avatars
    description: User avatars
  - name: Attachments
    description: File attachments
  - name: Notifications
    description: User notifications
  - name: Discussions
    description: Threaded discussions
  - name: AI
    description: AI/LLM features
  - name: Groups
    description: Legacy group system

