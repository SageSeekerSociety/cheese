[package]
name = "srp_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "srp_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
sha2 = "0.10.8"
hex = "0.4.3"
lazy_static = "1.5.0"
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"
