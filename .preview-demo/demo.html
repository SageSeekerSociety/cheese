<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>预览功能演示</title>
<style>
  :root{--bg:#0f1220;--card:#1a1f36;--accent:#7c9cff;--text:#e8ecff;--muted:#9aa4d6}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(160deg,#0f1220,#1a1f36);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid #2a3157;border-radius:18px;max-width:520px;width:100%;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  h1{margin:0 0 4px;font-size:24px}
  .tag{display:inline-block;background:rgba(124,156,255,.15);color:var(--accent);font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:18px}
  p{color:var(--muted);line-height:1.7;margin:12px 0}
  .box{background:#12172b;border-radius:12px;padding:16px;margin-top:18px}
  .box b{color:var(--accent)}
  code{background:#0b0e1a;padding:2px 7px;border-radius:6px;color:#ffd479;font-size:13px}
  .live{margin-top:20px;text-align:center}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4ade80;margin-right:6px;animation:p 1.4s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  #t{font-size:30px;font-weight:700;color:#fff;margin-top:6px}
</style></head>
<body><div class="card">
  <span class="tag">● 芝士预览 · Live</span>
  <h1>预览功能跑通了 👋</h1>
  <p>你现在在右侧看到的这一整块,就是我在这台机器上生成的一个网页文件,通过 <b>cheese artifact</b> 推给你的预览。它是<b>实时渲染</b>的——下面这个时钟就是页面里的 JS 在你浏览器里跑:</p>
  <div class="live"><span class="dot"></span><span style="color:var(--muted)">页面脚本运行中</span><div id="t">--:--:--</div></div>
  <div class="box">
    <p style="margin-top:0"><b>怎么让我给你出预览?</b> 直接说人话就行,比如:</p>
    <p>· "做一个 XX 页面/图表给我预览"<br>· "把这个数据画成图表看看"<br>· "把刚才做的东西预览一下"</p>
    <p style="margin-bottom:0">我会生成文件、自己调 <code>cheese artifact</code> 或起服务,预览就出现在你右侧,不用你敲任何命令。</p>
  </div>
</div>
<script>
  function tick(){const d=new Date();document.getElementById('t').textContent=d.toLocaleTimeString('zh-CN',{hour12:false})}
  tick();setInterval(tick,1000);
</script>
</body></html>
