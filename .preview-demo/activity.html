<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>各项目活跃度</title>
<style>
:root{--bg:#0e1120;--card:#171c30;--line:#2a3150;--text:#eef1ff;--muted:#9aa4d6;--human:#7c9cff;--ai:#4ade80;--accent:#ffd479}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(160deg,#0e1120,#171c30);color:var(--text);padding:24px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.callout{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:var(--muted)}
.callout b{color:var(--accent)}
.legend{display:flex;gap:18px;font-size:13px;margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.row{margin-bottom:14px}
.rlabel{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.rlabel .nm{font-weight:600}
.rlabel .tot{color:var(--muted)}
.bar{height:22px;background:#0b0e1a;border-radius:6px;overflow:hidden;display:flex}
.seg{height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.seg.h{background:var(--human)}
.seg.a{background:var(--ai)}
.foot{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
</style></head><body><div class="wrap">
<h1>各项目活跃度对比</h1>
<p class="sub">按消息条数 · 数据取自平台数据库 · 2026-09-07</p>
<div class="callout">📊 <b>cheese 自建</b>(我们自己的开发项目)独占全平台约 94% 的消息(人 2426 / AI 15577),比外部项目高两个数量级——为看清其余项目,下图<b>不含它</b>。「知伴」等文档导入的噪声也已剔除。</div>
<div class="legend"><span><i class="sw" style="background:var(--human)"></i>人发消息</span><span><i class="sw" style="background:var(--ai)"></i>AI 消息</span></div>
<div id="chart"></div>
<div class="foot">外部真实用户项目里，<b style="color:var(--text)">朱批</b>(黑客松三人队)人发消息最多；<b style="color:var(--text)">agent</b>(你的项目)AI 轮次最多。柱子按「人+AI」总量排序。</div>
</div>
<script>
const data=[
 {n:"agent（你的）",h:77,a:338},
 {n:"朱批",h:108,a:256},
 {n:"P-pig[Reborn]",h:8,a:98},
 {n:"microcloud开机实测",h:22,a:58},
 {n:"demo1",h:21,a:58},
 {n:"墨者世界",h:7,a:48},
 {n:"crt test",h:3,a:36},
 {n:"idk",h:4,a:7},
 {n:"cloud-repro",h:7,a:6},
];
const max=Math.max(...data.map(d=>d.h+d.a));
const c=document.getElementById('chart');
data.forEach((d,i)=>{
 const tot=d.h+d.a;
 const row=document.createElement('div');row.className='row';
 row.innerHTML=`<div class="rlabel"><span class="nm">${d.n}</span><span class="tot">${tot} 条（人 ${d.h} · AI ${d.a}）</span></div>
 <div class="bar"><div class="seg h" data-w="${d.h/max*100}"></div><div class="seg a" data-w="${d.a/max*100}"></div></div>`;
 c.appendChild(row);
});
requestAnimationFrame(()=>document.querySelectorAll('.seg').forEach(s=>s.style.width=s.dataset.w+'%'));
</script>
</body></html>
