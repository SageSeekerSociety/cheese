# Optional: run backend in Docker (for Windows without WSL)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# This adds a backend container that hot-reloads on code changes via volume mount.
# Linux/macOS/WSL users should use `task dev` instead (faster, better IDE integration).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cheese_py_backend
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - TZ=Asia/Shanghai
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@cheese_py_postgres:5432/cheese
      - REDIS_URL=redis://cheese_py_valkey:6379/0
      - JWT_SECRET=dev-secret
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8081 --reload"]
    networks:
      - cheese_py_network
