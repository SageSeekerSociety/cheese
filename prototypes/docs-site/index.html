<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheese 文档</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--amber:#f59e0b;--amber-d:#b45309;--r:12px}
body[data-theme=light]{--bg:#faf7f0;--bg2:#f3eee3;--card:#fffdf8;--fg:#2f2820;--fg2:#5b5146;--dim:#8a8175;--line:#e7ddcb;--hl:#fff3d6;--code:#f1ebdf}
body[data-theme=dark]{--bg:#131116;--bg2:#1a171e;--card:#1c1920;--fg:#ece6dc;--fg2:#c9c1b5;--dim:#958d9d;--line:#2e2934;--hl:#3a2b10;--code:#24202a;--amber-d:#fbbf24}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
a{color:inherit}
button{font:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:22px;padding:0 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:.01em}
.brand svg{width:28px;height:28px}
.brand small{font-weight:500;color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;height:100%}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;text-decoration:none;color:var(--fg2);font-size:14px;border-bottom:2px solid transparent;height:100%}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--amber);font-weight:600}
.lock{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--hl);color:var(--amber-d);font-weight:500}
.hdr .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;width:240px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--dim);font-size:13px;cursor:pointer}
.search kbd{margin-left:auto;font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.go{height:34px;padding:0 14px;border-radius:9px;background:var(--fg);color:var(--bg);text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:600}

/* ---------- home ---------- */
.home{max-width:1120px;margin:0 auto;padding:0 24px 80px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 40px}
.hero h1{margin:0 0 14px;font-size:44px;line-height:1.2;letter-spacing:-.01em;font-weight:750}
.hero h1 em{font-style:normal;color:var(--amber-d)}
.hero p.sub{margin:0 0 26px;color:var(--fg2);font-size:17px;max-width:30em}
.ask{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 8px 30px -18px rgba(80,50,0,.35)}
.ask input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--fg);min-width:0}
.ask button{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}
.ask .b1{background:var(--bg2)}
.ask .b2{background:var(--amber);color:#2b1a00}
.hero .ctas{display:flex;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:600;background:var(--card)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.art{display:grid;place-items:center}
.art svg{width:min(400px,100%);height:auto;overflow:visible;cursor:pointer}
.sec{padding:48px 0 8px}
.sec h2{margin:0 0 6px;font-size:26px;font-weight:700}
.sec .desc{margin:0 0 22px;color:var(--dim)}
.who{display:flex;gap:6px;margin-bottom:18px;background:var(--bg2);padding:4px;border-radius:12px;width:max-content}
.who button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--fg2);font-size:14px}
.who button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-decoration:none;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--amber);transform:translateY(-2px)}
.card b{font-size:15px}
.card span{color:var(--dim);font-size:13px;line-height:1.6}
.card i{margin-top:auto;padding-top:8px;font-style:normal;font-size:12px;color:var(--amber-d)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}
.step{padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--hl);color:var(--amber-d);display:grid;place-items:center;font-size:13px;font-weight:700;margin-bottom:10px}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--dim);font-size:13px}
.mock{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--bg);font-size:12px;color:var(--fg2);display:flex;flex-direction:column;gap:6px}
.mock .bub{align-self:flex-end;background:var(--hl);border-radius:8px 8px 2px 8px;padding:4px 8px;max-width:90%}
.mock .bot{align-self:flex-start;background:var(--bg2);border-radius:8px 8px 8px 2px;padding:4px 8px;max-width:90%}
.mock .bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.mock .bar i{display:block;height:100%;width:62%;background:var(--amber)}
.mock .chip{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}
.mock .ok{background:#16a34a;color:#fff;border-color:#16a34a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid a{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.grid a:hover{border-color:var(--amber)}
.grid a small{color:var(--dim);font-size:11px}
details.qa{border-bottom:1px solid var(--line);padding:14px 2px}
details.qa summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.qa summary::after{content:"+";color:var(--dim);font-weight:400}
details.qa[open] summary::after{content:"−"}
details.qa div{color:var(--fg2);margin-top:8px;font-size:14px}
.closing{margin-top:56px;padding:34px;border-radius:18px;background:var(--bg2);text-align:center}
.closing h3{margin:0 0 8px;font-size:22px}
.closing p{margin:0 0 18px;color:var(--dim)}

/* ---------- docs ---------- */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 220px;max-width:1360px;margin:0 auto}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:22px 14px 40px 24px;border-right:1px solid var(--line)}
.side h4{margin:18px 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.side h4:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;text-decoration:none;font-size:14px;color:var(--fg2)}
.side a:hover{background:var(--bg2);color:var(--fg)}
.side a.on{background:var(--hl);color:var(--fg);font-weight:600}
.side a .todo{margin-left:auto;flex-shrink:0;white-space:nowrap;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-weight:400}
.main{padding:34px 48px 80px;min-width:0}
.article{max-width:760px}
.crumb{font-size:13px;color:var(--amber-d);font-weight:600;margin-bottom:6px}
.article h1{margin:0 0 18px;font-size:34px;line-height:1.3}
.article h2{margin:38px 0 12px;font-size:22px;padding-top:6px}
.article h3{margin:26px 0 8px;font-size:17px}
.article p,.article li{color:var(--fg2)}
.article blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--amber);background:var(--bg2);border-radius:0 8px 8px 0}
.article blockquote p{margin:0}
.article code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:1px 6px;border-radius:5px}
.article table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}
.article th,.article td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.article th{background:var(--bg2)}
.article a{color:var(--amber-d);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.lead{font-size:17px}
.draft-box{margin-top:18px;padding:18px 22px;border:1px dashed var(--line);border-radius:var(--r);background:var(--card)}
.draft-tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--hl);color:var(--amber-d);font-weight:600;margin-bottom:6px}
.imgph{display:block;padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:13px;text-align:center}
.admin-note{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:22px;border-radius:10px;background:var(--hl);color:var(--amber-d);font-size:13px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:14px}
.pager a small{display:block;color:var(--dim);font-size:12px}
.pager a.nx{text-align:right}
.toc{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:34px 20px}
.toc h5{margin:0 0 8px;font-size:12px;color:var(--dim)}
.toc a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--line);font-size:13px;color:var(--dim);text-decoration:none}
.toc a.l3{padding-left:22px}
.toc a.on{color:var(--fg);border-left-color:var(--amber)}

/* ---------- changelog ---------- */
.cl{max-width:900px;margin:0 auto;padding:40px 24px 80px}
.cl h1{margin:0 0 6px;font-size:34px}
.cl .intro{color:var(--dim);margin:0 0 30px}
.rel{display:grid;grid-template-columns:170px 1fr;gap:28px;padding:28px 0;border-top:1px solid var(--line)}
.rel .meta{position:sticky;top:84px;align-self:start}
.rel .ver{font-size:24px;font-weight:750}
.rel .date{color:var(--dim);font-size:13px}
.rel .env{display:inline-block;margin-top:8px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg2)}
.rel.unreleased .env{background:var(--hl);color:var(--amber-d);border-color:transparent}
.rel .nums{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.8}
.rel h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
.badge.新功能{background:#dcfce7;color:#166534}
.badge.改进{background:#dbeafe;color:#1e40af}
.badge.修复{background:#fee2e2;color:#991b1b}
body[data-theme=dark] .badge.新功能{background:#14532d;color:#bbf7d0}
body[data-theme=dark] .badge.改进{background:#1e3a8a;color:#bfdbfe}
body[data-theme=dark] .badge.修复{background:#7f1d1d;color:#fecaca}
.rel ul{margin:0 0 18px;padding-left:18px}
.rel li{color:var(--fg2);margin:3px 0}
.rel li .pr{color:var(--dim);font-size:12px;margin-left:6px;text-decoration:none}
.rel details summary{cursor:pointer;color:var(--amber-d);font-size:14px;font-weight:600}
.rel details ol{max-height:420px;overflow:auto;margin:10px 0 0;padding:10px 10px 10px 34px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2)}
.note{font-size:13px;color:var(--dim);padding:12px 14px;border-radius:10px;background:var(--bg2);margin-bottom:10px}

/* ---------- search ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,15,5,.35);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.modal.on{display:flex}
.modal .box{width:min(620px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);overflow:hidden}
.modal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:16px;background:transparent;color:var(--fg);outline:0}
.modal .res{max-height:50vh;overflow:auto;padding:6px}
.modal .res a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none}
.modal .res a:hover,.modal .res a.sel{background:var(--hl)}
.modal .res small{display:block;color:var(--dim);font-size:12px}
.modal .res .none{padding:14px;color:var(--dim);font-size:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.view{animation:fade .28s ease}
body[data-shot] .view{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.toc{display:none}.layout{grid-template-columns:240px minmax(0,1fr)}}
@media (max-width:820px){.hero{grid-template-columns:1fr}.art{order:-1}.cards,.steps,.grid{grid-template-columns:1fr 1fr}.side{display:none}.layout{grid-template-columns:1fr}.main{padding:24px}.search{display:none}.rel{grid-template-columns:1fr}.rel .meta{position:static}.hdr{gap:8px;padding:0 12px}.brand small,.go,.lock{display:none}.tabs{gap:0}.tab{padding:0 7px;font-size:13px;white-space:nowrap}.art svg{width:min(260px,70vw)}.hero{padding-top:28px}.hero h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.card{transition:none}}
</style>
</head>

D500"/><stop offset="1" stop-color="#FFE600"/></linearGradient><linearGradient id="gTail" data-light="1" gradientUnits="userSpaceOnUse" x1="449.7304" y1="984.8141" x2="449.7304" y2="1181.3331"><stop offset="0" stop-color="#FF9500"/><stop offset="0.2227" stop-color="#FF9900"/><stop offset="0.445" stop-color="#FFA500"/><stop offset="0.6673" stop-color="#FFB900"/><stop offset="0.8883" stop-color="#FFD500"/><stop offset="1" stop-color="#FFE600"/></linearGradient></defs></svg>

<div id="app"></div>
<div class="modal" id="modal"><div class="box"><input id="q" placeholder="搜索文档，或直接问芝士…" autocomplete="off"><div class="res" id="res"></div></div></div>

<script>
const DATA = {"pages":[{"slug":"quickstart","title":"快速开始","group":"开始使用","section":"docs","html":"<p>按照本页步骤，可以创建个人项目，让芝士完成一项小任务，并查看交付结果。开始前需要登录 Cheese；执行任务时，项目需要有可用的运行环境。运行环境的接入方法见<a href=\"#/docs/devices~devices\">设备与运行环境</a>。</p>\n<h2 id=\"project\">创建项目</h2><p>创建个人项目后，会自动进入第一个话题。</p>\n<ol>\n<li>在空间页「从这里开始」区域点击「新建项目」。</li>\n<li>填写「项目名称」，将「所属团队」保持为默认的「个人」。</li>\n<li>点击「创建」，进入话题。</li>\n</ol>\n<h2 id=\"talk\">把任务交给芝士</h2><p>在话题中说明要完成的任务，并将消息交给芝士处理。例如：</p>\n<blockquote>\n<p>请在项目中创建一份欢迎说明，写一句介绍这个项目的话，完成后交给我验收。</p>\n</blockquote>\n<p>将这段要求输入话题底部的消息框，按 <code>Ctrl/Cmd+Enter</code> 发送并交给芝士。开始执行后，话题中会显示「芝士正在处理…」。其他发送方式见<a href=\"#/docs/agents~summon\">让 AI 队友处理消息</a>。</p>\n<h2 id=\"result\">查看结果</h2><p>任务完成后，先在话题消息中查看结果说明。如果生成或修改了文件，可以通过系统消息中的「查看改动」或右侧「改动」检查内容。</p>\n<p>任务进入验收后，可以在右侧「总览」或项目看板的「待处理」中打开任务，点击「去验收」。查看差异后，再决定「采纳」或「退回」。更多说明见<a href=\"#/docs/accept~accept\">验收与采纳</a>。</p>\n<p>如果话题提示机器尚未配置或未连接，参见<a href=\"#/docs/troubleshooting~device-offline\">机器未配置或未连接</a>。</p>\n","toc":[[2,"project","创建项目"],[2,"talk","把任务交给芝士"],[2,"result","查看结果"]],"lead":"按照本页步骤，可以创建个人项目，让芝士完成一项小任务，并查看交付结果。开始前需要登录 Cheese；执行任务时，项目需要有可用的运行环境。运行环境的接入方法见设备与运行环境。"},{"slug":"working-with-cheese","title":"与芝士协作","group":"开始使用","section":"docs","html":"<p>与芝士协作时，先说明目标和判断完成的标准，再根据执行过程补充要求、检查结果。</p>\n<h2 id=\"describe-goal\">描述目标</h2><p>任务要求应说明预期成果、已有材料和完成标准。例如，整理一份说明时，可以明确读者、需要覆盖的内容和格式要求。对操作步骤有具体要求时，也一并说明。</p>\n<h2 id=\"start-work\">发起处理</h2><p>准备好要求后，在话题中使用 <code>@芝士</code> 或 <code>Ctrl/Cmd+Enter</code> 发起处理。空闲时直接发送的普通消息不会自动触发执行。完整触发方式见<a href=\"#/docs/agents~summon\">AI 队友</a>。</p>\n<h2 id=\"add-context\">执行中补充要求</h2><p>芝士执行时，可以在话题中补充条件或调整要求。直接写明需要改变的内容；消息在执行期间正常送达时，会进入当前一轮。</p>\n<p>如果出现「消息没能送进正在进行的会话，已转入队列」，说明消息已排队。先查看后续运行状态，再判断是否需要重新发送，避免重复提交同一要求。</p>\n<h2 id=\"follow-progress\">查看进度并回答问题</h2><p>执行进度和补充信息请求可以在话题中查看。执行期间，话题会显示「芝士正在处理…」。右侧的「总览」「现场」「改动」提供任务、运行现场和文件改动的查看入口。</p>\n<p>芝士需要补充信息时，可能直接在对话中提问。看到这类消息时，按问题回复，再用 <code>@芝士</code> 或「交给芝士」继续。</p>\n<h2 id=\"review-result\">检查结果</h2><p>检查结果时，应同时核对结果说明和实际文件内容。一轮结束后，先阅读话题中的结果说明，再通过「查看改动」或右侧「改动」检查文件。收到验收卡时，查看差异并决定采纳或退回。详见<a href=\"#/docs/accept~accept\">验收与采纳</a>。</p>\n","toc":[[2,"describe-goal","描述目标"],[2,"start-work","发起处理"],[2,"add-context","执行中补充要求"],[2,"follow-progress","查看进度并回答问题"],[2,"review-result","检查结果"]],"lead":"与芝士协作时，先说明目标和判断完成的标准，再根据执行过程补充要求、检查结果。"},{"slug":"tut-student","title":"学生：在空间里完成第一道题目","group":"教程","section":"docs","draft":true,"lead":"从加入空间开始，走完一道题目：看题、参与、让芝士协助、提交。","html":"<p class=\"lead\">从加入空间开始，走完一道题目：看题、参与、让芝士协助、提交。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>找到老师给的空间和题目</li><li>参与题目，从题目创建自己的项目</li><li>在话题里和芝士一起完成</li><li>按题目要求提交，查看提交记录</li></ul></div>","toc":[]},{"slug":"tut-teacher","title":"老师 / 助教：开一门课，收作业、打分","group":"教程","section":"docs","draft":true,"lead":"从零开一门课：建课程、排单元、布置作业和测验、看提交并打分。","html":"<p class=\"lead\">从零开一门课：建课程、排单元、布置作业和测验、看提交并打分。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>创建课程和课程团队</li><li>按周排单元，挂作业和测验</li><li>邀请学生加入</li><li>查看提交记录、打分，看学生卡在哪里</li></ul></div>","toc":[]},{"slug":"tut-office","title":"办公：完成第一个协作项目","group":"教程","section":"docs","draft":true,"lead":"一个小团队用 Cheese 完成一件真实的事：从建团队到验收交付。","html":"<p class=\"lead\">一个小团队用 Cheese 完成一件真实的事：从建团队到验收交付。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>建团队、邀请同事</li><li>建项目、开话题、把任务交给芝士</li><li>中途补充要求、回答芝士的问题</li><li>验收采纳，把成果发布或下载</li></ul></div>","toc":[]},{"slug":"spaces","title":"空间与题目","group":"使用 Cheese","section":"docs","draft":true,"lead":"空间是老师和组织发布题目的地方。","html":"<p class=\"lead\">空间是老师和组织发布题目的地方。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>找到空间和题目</li><li>题目详情与参与</li><li>从题目创建项目</li><li>我参与的、我发布的</li><li>发布和编辑题目，参与者管理与数据分析</li></ul></div>","toc":[]},{"slug":"courses","title":"课程与作业","group":"使用 Cheese","section":"docs","draft":true,"lead":"课程把教学按单元组织起来。","html":"<p class=\"lead\">课程把教学按单元组织起来。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>加入课程</li><li>课程首页与单元</li><li>作业与测验</li><li>课程成员与课程团队</li><li>课程设置</li></ul></div>","toc":[]},{"slug":"teams","title":"团队","group":"使用 Cheese","section":"docs","html":"<p>团队用于管理共同使用的项目和成员。项目建在团队下时，团队已有成员会自动进入该项目。</p>\n<h2 id=\"create-team\">找到和创建团队</h2><p>在左侧导航打开「团队」，可以查找已有团队或创建团队。页面有「发现」「我的」「待定」三个页签。</p>\n<ol>\n<li>点击右上角的「创建团队」。</li>\n<li>填写「团队名称」和「团队描述」，按需上传头像。</li>\n<li>点击「创建团队」。</li>\n</ol>\n<p>创建完成后会进入新团队的「项目」页面。团队侧栏还有「成员管理」「知识库」和「算力」。</p>\n<h2 id=\"invite-member\">邀请成员</h2><p>队长和管理员可以通过 UID 邀请成员。受邀者可以在自己的头像菜单中查看 UID。</p>\n<ol>\n<li>在团队侧栏打开「成员管理」，点击「邀请成员」。</li>\n<li>填写对方的 UID，选择「普通成员」或「管理员」，按需填写邀请消息。</li>\n<li>点击「邀请」。页面显示「邀请已发送」。</li>\n</ol>\n<p>受邀者可以在「团队 → 待定」的「收到的邀请」中查看邀请，点击对勾接受或点击叉拒绝。邀请也会出现在右上角的通知中心。</p>\n<h2 id=\"join-request\">申请加入团队与审核申请</h2><p>用户可以在「团队 → 发现」中查找团队并申请加入。搜索团队 ID 或名称，点击结果中的「申请加入」，填写申请理由并提交。</p>\n<p>队长可以在该团队的「成员管理 → 加入申请」中查看理由，选择「批准」或「拒绝」。普通成员的成员管理页只显示「成员列表」。</p>\n<h2 id=\"manage-team-members\">管理成员</h2><p>团队成员的管理权限由角色决定。</p>\n<table>\n<thead>\n<tr>\n<th>角色</th>\n<th>成员管理权限</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>队长</td>\n<td>邀请成员、调整成员角色、移除成员</td>\n</tr>\n<tr>\n<td>管理员</td>\n<td>邀请成员、移除成员</td>\n</tr>\n<tr>\n<td>普通成员</td>\n<td>查看成员列表</td>\n</tr>\n</tbody></table>\n<p>邀请记录在「成员管理 → 已发送邀请」中。</p>\n<h2 id=\"team-pages\">其他团队页面</h2><p>「知识库」页面提供搜索、资料类型、标签和「上传资料」入口。「算力」页面显示团队的设备和额度，参见<a href=\"#/docs/quota~quota\">额度与算力</a>。</p>\n<p>「发现」页的「招募广场」目前显示「即将推出」，还不能发布或浏览招募信息；查找团队和申请加入可使用页面上的搜索。</p>\n<h2 id=\"mention-member\">在话题中提醒成员</h2><p>在话题中 <code>@</code> 一位人类成员后，对方会在项目侧栏看到该话题的未读角标。打开话题并读到新消息后，角标会消失。</p>\n","toc":[[2,"create-team","找到和创建团队"],[2,"invite-member","邀请成员"],[2,"join-request","申请加入团队与审核申请"],[2,"manage-team-members","管理成员"],[2,"team-pages","其他团队页面"],[2,"mention-member","在话题中提醒成员"]],"lead":"团队用于管理共同使用的项目和成员。项目建在团队下时，团队已有成员会自动进入该项目。"},{"slug":"projects","title":"项目","group":"使用 Cheese","section":"docs","html":"<p>项目用于组织话题、成员和 AI 队友。第一次使用 Cheese 时，可以直接创建个人项目。</p>\n<h2 id=\"create-project\">创建项目</h2><p>可以从空间页的「从这里开始」区域，或左侧导航栏底部的「新建项目」按钮创建项目。</p>\n<ol>\n<li>点击「新建项目」。</li>\n<li>填写「项目名称」。如果创建个人项目，将「所属团队」保持为默认的「个人」。</li>\n<li>点击「创建」。</li>\n</ol>\n<p>创建完成后，页面会直接进入项目的第一个话题。话题操作参见<a href=\"#/docs/rooms~rooms\">话题</a>。</p>\n<h2 id=\"project-navigation\">进入项目并查找功能</h2><p>项目侧栏可以进入「看板」「日历」「资料库」「导出与发布」「成员」，也可以在「话题」分组中打开已有话题。打开项目名菜单可以进入「项目设置」。</p>\n<h2 id=\"invite-project-member\">邀请项目成员</h2><p>项目所有者或组长可以通过 UID 邀请成员。</p>\n<ol>\n<li>在项目侧栏打开「成员」，点击「邀请成员」。</li>\n<li>输入对方的 UID，选择角色。角色默认为「成员」。</li>\n<li>点击「邀请」。</li>\n</ol>\n<p>发出邀请后，成员页会显示「等待接受」。对方接受前，可以撤回邀请。</p>\n<p>受邀者可以在侧栏「待定」的「收到的项目邀请」中选择「接受」或「拒绝」。接受后便可进入项目。</p>\n<p>如果项目属于团队，团队已有成员会直接出现在项目成员页，无需逐个邀请。</p>\n<h2 id=\"manage-project-member\">管理项目成员</h2><p>项目所有者或组长可以邀请成员，并在成员行管理角色或移出成员。导师和普通成员可以查看成员，但没有邀请或管理成员的入口。</p>\n<h2 id=\"upstream\">关联上游仓库</h2><p>「上游仓库」用于关联已有仓库并同步其更新。在项目名菜单中打开「项目设置」，找到「上游仓库」。填写仓库地址并点击「保存」后，可以点击「同步上游」。</p>\n<p>有新提交时，页面会显示合入的提交数。没有新提交时，页面显示「已是最新，没有新提交」。</p>\n<p>创建项目和在话题中使用芝士都不要求连接上游仓库。</p>\n","toc":[[2,"create-project","创建项目"],[2,"project-navigation","进入项目并查找功能"],[2,"invite-project-member","邀请项目成员"],[2,"manage-project-member","管理项目成员"],[2,"upstream","关联上游仓库"]],"lead":"项目用于组织话题、成员和 AI 队友。第一次使用 Cheese 时，可以直接创建个人项目。"},{"slug":"rooms","title":"话题","group":"使用 Cheese","section":"docs","html":"<p>话题用于在项目中围绕一项工作交流。创建项目后会自动进入第一个话题；需要讨论另一项工作时，可以再建话题。</p>\n<h2 id=\"create-topic\">新建话题</h2><p>在项目侧栏的「话题」右侧点击「+」（「新建话题」），即可创建话题。页面会直接进入名为「新话题」的话题，使用项目当前的默认 AI 队友。创建时不需要填写表单。</p>\n<h2 id=\"topic-layout\">认识话题页面</h2><p>话题页面包括顶部的话题信息、中间的消息、底部的输入区和右侧面板。输入区可以发送消息或上传文件；右侧提供「总览」「现场」「改动」等入口，也可以查看和编辑文档。消息的处理方式见<a href=\"#/docs/agents~summon\">让 AI 队友处理消息</a>。</p>\n<h2 id=\"topic-members\">调整话题中的 AI 队友</h2><p>在话题顶部打开「话题成员」，可以查看和调整话题中的 AI 队友。具体步骤见<a href=\"#/docs/agents~change-agent-in-topic\">在话题中更换 AI 队友</a>。</p>\n<h2 id=\"topic-runtime\">选择运行环境</h2><p>话题的运行环境可以从顶部「更多 → 运行环境」进入。打开「选择运行环境」后，首次运行前可以改选可用资源。选项含义和项目默认设置见<a href=\"#/docs/devices~topic-environment\">设备与运行环境</a>。</p>\n<h2 id=\"manage-topic\">重命名和归档</h2><p>话题可以通过侧栏中的「更多操作」重命名或归档。将鼠标移到话题上，打开该菜单。</p>\n<ul>\n<li>选择「重命名」，修改话题名称。</li>\n<li>选择「归档」，话题会移入「已归档」列表。</li>\n</ul>\n<p>当前菜单没有删除入口。</p>\n<h2 id=\"edit-topic-document\">编辑右侧文档</h2><p>话题右侧的文档可以直接编辑。编辑后页面会显示「已保存」，但不会自动启动 AI 队友。需要让队友处理新要求时，在话题中发送消息并<a href=\"#/docs/agents~summon\">交给 AI 队友</a>。</p>\n","toc":[[2,"create-topic","新建话题"],[2,"topic-layout","认识话题页面"],[2,"topic-members","调整话题中的 AI 队友"],[2,"topic-runtime","选择运行环境"],[2,"manage-topic","重命名和归档"],[2,"edit-topic-document","编辑右侧文档"]],"lead":"话题用于在项目中围绕一项工作交流。创建项目后会自动进入第一个话题；需要讨论另一项工作时，可以再建话题。"},{"slug":"agents","title":"AI 队友","group":"使用 Cheese","section":"docs","html":"<p>AI 队友用于在项目中协助处理任务。项目可以使用多个 AI 队友；新话题默认使用项目中标为「默认」的队友。</p>\n<h2 id=\"edit-agent\">修改 AI 队友</h2><p>已有 AI 队友的配置可以在「项目设置 → 队友」中修改。</p>\n<ol>\n<li>在话题页面点击项目标题旁的「项目菜单」，选择「项目设置」。</li>\n<li>找到「队友」区域，在对应队友的卡片上点击「编辑」。</li>\n<li>在「修改 AI 队友」弹窗中修改「名字」「角色设定」或模型设置，然后点击「保存」。</li>\n</ol>\n<p>弹窗还显示队友的「标识」。页面提示，修改从下一轮开始生效，已有记忆保留。</p>\n<p>也可以在项目「成员」页的「AI 队友」区域，点击对应队友的「设置」进入同一弹窗。</p>\n<h2 id=\"default-agent\">项目默认 AI 队友</h2><p>新建话题会使用项目中标为「默认」的 AI 队友，创建话题时没有单独选择队友的步骤。</p>\n<h2 id=\"change-agent-in-topic\">在话题中更换 AI 队友</h2><p>话题中的 AI 队友可以通过「话题成员」调整。打开话题顶部的「话题成员」，对当前 AI 队友选择「移出话题」，再点击「加入」并选择另一位 AI 队友。更换后，话题成员和输入框中的目标队友会随之变化。</p>\n<h2 id=\"summon\">让 AI 队友处理消息</h2><p>AI 队友空闲时，需要明确指定由队友处理消息，才会开始执行。可以使用以下方式：</p>\n<ul>\n<li>在消息中 <code>@</code> 队友后发送。输入框旁标有队友名字的「交给」按钮可以帮助插入 <code>@</code>。</li>\n<li>按 <code>Ctrl/Cmd+Enter</code>，发送消息并交给 AI 队友处理。</li>\n</ul>\n<p>空闲时直接发送的普通消息会留在话题中，不会自动触发处理。需要处理已发出的消息时，可以点击消息下方的「让它现在就动」。</p>\n<p>队友正在执行时，后续普通消息和补充要求在正常送达后会进入当前一轮。补充要求和消息排队时的处理方法见<a href=\"#/docs/working-with-cheese~add-context\">与芝士协作</a>。</p>\n<h2 id=\"runtime-and-model\">设置模型</h2><p>AI 队友可以使用单独指定的模型，也可以使用项目主模型。在「修改 AI 队友」弹窗中找到「为这个队友指定模型」并设置；不指定时使用项目主模型。</p>\n","toc":[[2,"edit-agent","修改 AI 队友"],[2,"default-agent","项目默认 AI 队友"],[2,"change-agent-in-topic","在话题中更换 AI 队友"],[2,"summon","让 AI 队友处理消息"],[2,"runtime-and-model","设置模型"]],"lead":"AI 队友用于在项目中协助处理任务。项目可以使用多个 AI 队友；新话题默认使用项目中标为「默认」的队友。"},{"slug":"tasks","title":"任务与看板","group":"使用 Cheese","section":"docs","html":"<p>项目看板用于查看芝士创建的任务及其当前状态。你可以从看板打开任务，查看进度和交付内容。</p>\n<h2 id=\"open-board\">打开看板</h2><p>项目侧栏的「看板」汇集项目中的任务。话题右侧也有看板区域，可以查看当前话题的任务。</p>\n<h2 id=\"task\">任务如何产生</h2><p>芝士可以根据话题中的要求创建任务。一条任务可以包含多个文件的改动；较复杂的工作也可能作为一条任务处理。需要分别交付时，可以在要求中说明为各项工作分别创建任务。</p>\n<p>当前看板没有手动新建任务的入口。</p>\n<h2 id=\"board\">看板显示什么</h2><p>看板按任务状态组织内容，主要列为「施工中」「交付中」「待处理」。页面另有「做出了什么」和可展开的「已完成」。任务的具体状态显示在卡片上。</p>\n<p>点击任务卡片，可以查看任务标题、状态、指派人、简报和相关 PR。任务面板还提供评论框。待验收的任务可以从这里进入<a href=\"#/docs/accept~accept\">验收与采纳</a>。</p>\n<h2 id=\"needs-attention\">等待人工处理</h2><p>「待人工处理」表示当前需要人工介入，具体原因要结合话题中的提示判断。任务等待验收时，可以从看板的「待处理」打开任务，查看交付并决定采纳或退回。</p>\n<p>额度耗尽也可能显示「待人工处理」，但此时不代表有一条待验收的任务。遇到额度提示时，参见<a href=\"#/docs/quota~quota\">额度与算力</a>。</p>\n<h2 id=\"task-status\">任务状态如何变化</h2><p>任务状态随交付和验收操作变化。芝士递交成果后，任务可以进入「等待验收」；采纳完成后显示「已采纳」，退回后显示「交付被退回」。</p>\n<p>看板目前没有拖拽任务或手动选择状态的入口。</p>\n<p>一轮工作结束时，话题中的「运行状态」会概述本轮结果。当前界面没有名为「结论卡」的独立功能。</p>\n","toc":[[2,"open-board","打开看板"],[2,"task","任务如何产生"],[2,"board","看板显示什么"],[2,"needs-attention","等待人工处理"],[2,"task-status","任务状态如何变化"]],"lead":"项目看板用于查看芝士创建的任务及其当前状态。你可以从看板打开任务，查看进度和交付内容。"},{"slug":"files","title":"文件与成果","group":"使用 Cheese","section":"docs","html":"<p>话题中的文件可以作为芝士处理任务的材料。生成或修改文件后，可以在话题消息和交付页面中查看改动。</p>\n<h2 id=\"upload-file\">上传文件</h2><p>话题底部的「上传文件」用于提供任务所需的材料。点击后选择文件，单个文件最大 10MB。超过限制时，页面会提示无法上传。</p>\n<h2 id=\"find-result\">查找芝士生成的文件</h2><p>一轮任务完成后，先查看话题中的结果消息。产生文件改动时，系统消息可能提供「查看改动」和文件名；也可以打开话题右侧的「改动」。</p>\n<p>如果任务已进入验收，可以从任务面板点击「去验收」，在「差异」页查看文件改动。入口和步骤见<a href=\"#/docs/accept~open-acceptance\">验收与采纳</a>。</p>\n<p>话题右侧还有可编辑文档。编辑文档会保存内容，但不会自动启动芝士。参见<a href=\"#/docs/rooms~edit-topic-document\">编辑右侧文档</a>。</p>\n","toc":[[2,"upload-file","上传文件"],[2,"find-result","查找芝士生成的文件"]],"lead":"话题中的文件可以作为芝士处理任务的材料。生成或修改文件后，可以在话题消息和交付页面中查看改动。"},{"slug":"submit","title":"提交","group":"使用 Cheese","section":"docs","draft":true,"lead":"按题目或作业的要求提交成果。","html":"<p class=\"lead\">按题目或作业的要求提交成果。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>提交条件和入口</li><li>表单与文件要求</li><li>发布者如何查看提交</li></ul></div>","toc":[]},{"slug":"accept","title":"验收与采纳","group":"使用 Cheese","section":"docs","html":"<p>芝士完成一条任务并递交成果后，话题中会出现「验收卡」。验收时先查看交付内容，再决定采纳或退回。</p>\n<h2 id=\"open-acceptance\">进入验收</h2><p>待验收任务可以从话题右侧「总览」或项目看板进入。</p>\n<ol>\n<li>在话题右侧「总览」的待处理项，或项目看板「待处理」列中，打开相应任务。</li>\n<li>查看任务面板中的标题、状态、简报和对应的 PR（合并请求）。</li>\n<li>点击「去验收」，进入验收页面查看文件改动。</li>\n</ol>\n<p>验收页面提供「差异」「编辑」页签。任务面板还提供评论框，以及「改派」「采纳」「退回」等按钮。</p>\n<h2 id=\"is-merge\">采纳交付</h2><p>「采纳」用于接受当前任务的交付。确认改动符合要求后，在任务面板中点击「采纳」。采纳并合并成功后，对应 PR 的改动进入项目主线，任务显示「已采纳」，并移入看板的「已完成」。</p>\n<p>同一话题中的多条任务可以对应不同的分支、PR 和验收卡，需要分别查看。一条任务中的多个文件可以一起交付。</p>\n<h2 id=\"reject-delivery\">退回交付</h2><p>「退回」用于要求修改当前交付。点击任务面板中的「退回」后，任务会显示「交付被退回」，需要再次交付后才能重新验收。反馈时说明不符合要求的内容和期望结果，便于芝士继续处理。</p>\n<h2 id=\"delivery-settings\">查看交付规则</h2><p>项目的合并要求位于「项目设置 → 交付」。页面提供合并前检查、分支与主线同步、需要的采纳人数等设置。</p>\n","toc":[[2,"open-acceptance","进入验收"],[2,"is-merge","采纳交付"],[2,"reject-delivery","退回交付"],[2,"delivery-settings","查看交付规则"]],"lead":"芝士完成一条任务并递交成果后，话题中会出现「验收卡」。验收时先查看交付内容，再决定采纳或退回。"},{"slug":"sites","title":"发布网站","group":"使用 Cheese","section":"docs","draft":true,"lead":"把项目里做出的网页发布成一个项目网站。","html":"<p class=\"lead\">把项目里做出的网页发布成一个项目网站。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>哪些东西能发布</li><li>发布与更新</li><li>谁能打开</li></ul></div>","toc":[]},{"slug":"devices","title":"设备与运行环境","group":"使用 Cheese","section":"docs","html":"<p>芝士执行任务需要可用的运行环境。你可以在「我的设备」中接入自有设备，并在项目或话题中查看运行环境设置。</p>\n<h2 id=\"add-device\">接入自有设备</h2><p>接入自有设备需要完成安装、登录和网页批准，再运行连接命令。</p>\n<ol>\n<li>点击右上角头像，打开「我的设备」，选择「添加设备」。复制弹窗提供的安装命令，在要接入的机器上运行。</li>\n<li>按提示运行 <code>cheesehost auth login</code>，在浏览器中打开「批准这台设备」页面。</li>\n<li>检查设备名称，点击「批准并绑定到我」。页面会提示设备已绑定到你。</li>\n<li>按批准页面的提示，回到命令行运行 <code>cheese link connect</code>，让设备保持在线并接受任务。</li>\n</ol>\n<p>连接成功后，在「我的设备」页面确认设备显示「在线」。设备名旁有重命名入口，设备行提供「解绑」。</p>\n<h2 id=\"team-device\">将设备用于团队</h2><p>已接入的自有设备可以添加到团队，供团队项目使用。在团队侧栏打开「算力」，找到「自有设备」区域，通过「添加自有设备」选择已接入的设备。</p>\n<p>添加后，设备会出现在团队的设备列表中。该区域同时显示设备数量和在线数量。</p>\n<h2 id=\"topic-environment\">选择话题运行环境</h2><p>话题首次运行前，可以在「选择运行环境」中改选可用资源。入口位于话题顶部的「更多 → 运行环境」。</p>\n<p>「自动选择」的界面说明为「首次运行时选择在线设备」。「项目默认」标记表示当前选择与项目默认设置一致。</p>\n<p>项目默认设置位于「项目设置 → 运行环境 → 默认与常用算力」。新话题会使用该默认设置。</p>\n","toc":[[2,"add-device","接入自有设备"],[2,"team-device","将设备用于团队"],[2,"topic-environment","选择话题运行环境"]],"lead":"芝士执行任务需要可用的运行环境。你可以在「我的设备」中接入自有设备，并在项目或话题中查看运行环境设置。"},{"slug":"quota","title":"额度与算力","group":"使用 Cheese","section":"docs","html":"<p>团队的「算力」页面显示设备和额度；项目和话题也提供各自的用量信息。</p>\n<h2 id=\"team-quota\">查看团队额度</h2><p>团队的「算力」页面显示共享额度和各项目的用量，普通成员也可以查看。进入团队后，在左侧打开「算力」。</p>\n<p>页面显示「团队云虚拟机」「团队 tokens 额度」，并按项目列出「占用云机器」「累计 tokens」「定向额度剩余」。</p>\n<p>页面说明，团队额度由所有项目共享，机构定向额度只供指定项目使用。当前用户界面没有发放、修改或回收额度的入口。</p>\n<h2 id=\"project-usage\">查看项目和话题用量</h2><p>话题顶部的「更多」菜单分别显示「本话题」和「全项目」的用量。指标包括「运行次数」「总 token」「输入」「输出」「费用」。</p>\n<p>项目的额度上限显示在「项目设置 → 运行环境」。</p>\n<h2 id=\"quota-exhausted\">额度用完时</h2><p>项目可用 tokens 额度用完时，话题会显示「可用的 tokens 额度已用完，这轮没有执行」，并标记「待人工处理」。这一轮不会执行，也不会产生文件改动。</p>\n<p>当前提示没有提供补充额度的操作入口或联系人。需要继续执行时，可联系团队管理员或额度发放方核对额度。</p>\n","toc":[[2,"team-quota","查看团队额度"],[2,"project-usage","查看项目和话题用量"],[2,"quota-exhausted","额度用完时"]],"lead":"团队的「算力」页面显示设备和额度；项目和话题也提供各自的用量信息。"},{"slug":"troubleshooting","title":"常见问题与排障","group":"常见问题","section":"docs","html":"<p>遇到无法执行或找不到结果时，先根据话题中的提示确认具体原因，再按对应功能页操作。</p>\n<h2 id=\"device-offline\">提示机器未配置或未连接</h2><p>「这条会话的机器尚未配置或未连接」表示当前话题没有可用的运行设备。</p>\n<p>先在头像菜单的「我的设备」中查看设备是否在线，再核对当前话题选择的运行环境。如果使用团队设备，还需要在团队「算力」页查看设备是否已添加。设备接入和运行环境设置见<a href=\"#/docs/devices~devices\">设备与运行环境</a>。</p>\n<p>设备已在线但仍出现同样提示时，可联系管理员核对项目运行环境。</p>\n<h2 id=\"quota-exhausted\">提示额度已用完</h2><p>「可用的 tokens 额度已用完，这轮没有执行」表示本轮因额度不足未执行。当前提示没有补充额度的入口，可联系团队管理员或额度发放方核对。查看额度的方法见<a href=\"#/docs/quota~quota\">额度与算力</a>。</p>\n<h2 id=\"upload-failed\">文件无法上传</h2><p>单个文件超过 10MB 时，话题上传入口会提示无法上传。先检查文件大小，缩小文件或拆分后再试。上传位置见<a href=\"#/docs/files~upload-file\">文件与成果</a>。</p>\n<h2 id=\"result-not-found\">找不到芝士的结果</h2><p>芝士的结果说明显示在发起任务的话题中。回到该话题，先查看运行结果，再根据任务状态查找文件。</p>\n<ul>\n<li>已产生文件改动：打开「查看改动」或右侧「改动」。</li>\n<li>任务等待验收：从话题右侧「总览」或项目看板的「待处理」进入任务。</li>\n</ul>\n<p>更多说明见<a href=\"#/docs/files~find-result\">文件与成果</a>。</p>\n","toc":[[2,"device-offline","提示机器未配置或未连接"],[2,"quota-exhausted","提示额度已用完"],[2,"upload-failed","文件无法上传"],[2,"result-not-found","找不到芝士的结果"]],"lead":"遇到无法执行或找不到结果时，先根据话题中的提示确认具体原因，再按对应功能页操作。"},{"slug":"overview","title":"系统总览","group":"架构","section":"dev","draft":true,"lead":"线上跑着哪些服务、各自管什么，以及它们之间怎么通信。","html":"<p class=\"lead\">线上跑着哪些服务、各自管什么，以及它们之间怎么通信。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>后端是一份代码按四种方式启动：主 API、机器连接服务（握着设备和终端的长连接，发版时不重启）、模型隧道（远端机器的模型流量）、代码托管事件中继（接 GitHub 事件）</li><li>前端 nginx 同时反代 /api 和 /uploads</li><li>模型网关（LiteLLM）与计量代理（mitmproxy）</li><li>Forgejo 代码托管、Office 与网页渲染服务</li><li>Postgres + Valkey</li></ul></div>","toc":[]},{"slug":"topology","title":"部署拓扑","group":"架构","section":"dev","draft":true,"lead":"测试环境和正式环境各跑哪些容器，发版时换什么、不换什么。","html":"<p class=\"lead\">测试环境和正式环境各跑哪些容器，发版时换什么、不换什么。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>镜像按提交号构建，发版按提交号部署</li><li>随发版替换的应用层 vs 常驻的数据面（机器连接、模型隧道、网关、计量代理）</li><li>后端滚动发版时正在跑的轮怎么交接</li><li>正式环境发版的审批</li></ul></div>","toc":[]},{"slug":"data","title":"数据存在哪","group":"架构","section":"dev","draft":true,"lead":"每一类数据的位置、谁写、怎么备份。","html":"<p class=\"lead\">每一类数据的位置、谁写、怎么备份。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>数据库：记录、事件、权限</li><li>上传文件与资料库</li><li>话题工作目录与任务分支</li><li>会话记录</li><li>备份与恢复演练</li></ul></div>","toc":[]},{"slug":"turn","title":"一条消息怎么变成芝士的一轮","group":"关键流程","section":"dev","draft":true,"lead":"从有人点名 AI 队友，到结果回到房间。","html":"<p class=\"lead\">从有人点名 AI 队友，到结果回到房间。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>点名与投递：平台只投递、不主动发起</li><li>找到或新建这个队友在这个房间的会话</li><li>这一轮要不要机器、租哪台</li><li>骨架（Claude Code / Codex / Pi）启动与续跑</li><li>结果、失败与超时如何回到房间</li></ul></div>","toc":[]},{"slug":"cli","title":"cheese CLI 原理","group":"关键流程","section":"dev","draft":true,"lead":"名字都叫 cheese，其实是两个东西。","html":"<p class=\"lead\">名字都叫 cheese，其实是两个东西。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>沙盒里的 cheese（单个 Python 文件，一份两用）：会话侧是平台 MCP 工具表，机器上是命令行</li><li>命令行只管必须在机器上跑的事：任务目录、同步推送、摆预览、应用预览、取资料、Office 转换与重算</li><li>身份靠启动时注入的环境变量（平台地址、令牌、项目、话题）</li><li>用户电脑上的 cheese（Go 连接器）：登录、连上之后平台在这台机器上开「屏幕」跑活；它本身不知道屏幕里跑的是什么</li><li>哪些动作走 CLI、哪些走 MCP，以及为什么</li></ul></div>","toc":[]},{"slug":"llm","title":"模型调用流程","group":"关键流程","section":"dev","draft":true,"lead":"一次模型请求从芝士出发，到拿回 token 的完整路径。","html":"<p class=\"lead\">一次模型请求从芝士出发，到拿回 token 的完整路径。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>每个请求先问后端 /llm/admission：能不能跑、走哪条路、用哪个模型名（唯一控制点，换模型不用重启）</li><li>订阅路：计量代理把请求转给上游，换上平台的凭证</li><li>网关路：改写到 LiteLLM，换上项目自己的虚拟 key</li><li>上游密钥从不下发到沙盒和用户机器；远端机器只带自己的短期令牌，由平台换 key 转发</li><li>流式、重试与超时</li></ul></div>","toc":[]},{"slug":"billing","title":"计费流程","group":"关键流程","section":"dev","draft":true,"lead":"用量怎么计、记在谁头上、用完了怎么办。","html":"<p class=\"lead\">用量怎么计、记在谁头上、用完了怎么办。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>两处计量：网关逐次记账；计量代理逐条写日志，后端定时收进用量表（只收一次）</li><li>算力额度：按 token 折算，走网关的按真实花费折算</li><li>两道刹车：后端放行前查额度、网关虚拟 key 上的预算上限</li><li>额度用完时房间里的平台提示</li><li>待拍板：额度单价的两个口径不一致</li></ul></div>","toc":[]},{"slug":"machines","title":"设备与机器接入","group":"关键流程","section":"dev","draft":true,"lead":"一台机器怎么变成芝士能用的「手」。","html":"<p class=\"lead\">一台机器怎么变成芝士能用的「手」。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>连接器登录与自动重连</li><li>自托管设备、云机器、托管机器的区别</li><li>机器上的文件授权</li><li>机器离线时一轮会怎样</li></ul></div>","toc":[]},{"slug":"delivery","title":"任务 → 分支 → PR → 验收合并","group":"关键流程","section":"dev","draft":true,"lead":"一条活从开卡到合进主干。","html":"<p class=\"lead\">一条活从开卡到合进主干。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>开任务：工作目录与分支</li><li>提交同步与 draft PR</li><li>验收卡与闸门</li><li>采纳即合并</li></ul></div>","toc":[]},{"slug":"preview","title":"预览与项目网站","group":"关键流程","section":"dev","draft":true,"lead":"房间里的预览和项目网站怎么托管、怎么鉴权。","html":"<p class=\"lead\">房间里的预览和项目网站怎么托管、怎么鉴权。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>预览子域名与短期凭证换 cookie</li><li>静态文件预览与运行中的应用预览</li><li>发布快照与访问范围</li></ul></div>","toc":[]},{"slug":"auth","title":"登录与令牌","group":"安全与权限","section":"dev","draft":true,"lead":"浏览器里存了什么、每次请求带什么。","html":"<p class=\"lead\">浏览器里存了什么、每次请求带什么。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>访问令牌：浏览器本地存储，请求头携带</li><li>刷新令牌：HttpOnly cookie，只发给登录与刷新接口</li><li>两步验证与受信设备</li><li>芝士与机器使用的令牌</li></ul></div>","toc":[]},{"slug":"seats","title":"席位与权限判定","group":"安全与权限","section":"dev","draft":true,"lead":"谁能在哪里做什么。","html":"<p class=\"lead\">谁能在哪里做什么。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>席位是唯一的授权载体</li><li>项目、团队、空间的角色</li><li>AI 队友不能做的管理动作</li></ul></div>","toc":[]},{"slug":"admins","title":"平台管理员","group":"安全与权限","section":"dev","draft":true,"lead":"后台管理的入口与名单。","html":"<p class=\"lead\">后台管理的入口与名单。</p><div class=\"draft-box\"><div class=\"draft-tag\">提纲 · 待写</div><ul><li>管理员名单从哪来</li><li>后台各模块</li><li>开发文档的访问控制</li></ul></div>","toc":[]}],"nav":{"docs":[{"group":"开始使用","slugs":["quickstart","working-with-cheese"]},{"group":"教程","slugs":["tut-student","tut-teacher","tut-office"]},{"group":"使用 Cheese","slugs":["spaces","courses","teams","projects","rooms","agents","tasks","files","submit","accept","sites","devices","quota"]},{"group":"常见问题","slugs":["troubleshooting"]}],"dev":[{"group":"架构","slugs":["overview","topology","data"]},{"group":"关键流程","slugs":["turn","cli","llm","billing","machines","delivery","preview"]},{"group":"安全与权限","slugs":["auth","seats","admins"]}]},"faq":[{"q":"提示机器未配置或未连接","id":"device-offline","a":"「这条会话的机器尚未配置或未连接」表示当前话题没有可用的运行设备。"},{"q":"提示额度已用完","id":"quota-exhausted","a":"「可用的 tokens 额度已用完，这轮没有执行」表示本轮因额度不足未执行。当前提示没有补充额度的入口，可联系团队管理员或额度发放方核对。查看额度的方法见<a href=\"/quota#quota\">额度与算力</a>。"},{"q":"文件无法上传","id":"upload-failed","a":"单个文件超过 10MB 时，话题上传入 function blink(i, period=5200, off=900){
  const k = ((i+off)%period)/period*period; // ms into cycle
  if (k>160) return 1;
  return 1-0.9*Math.sin(Math.PI*k/160);
}
function twitch(i, period=3700, off=0){
  // 胡须：短促地抖两下
  const k = (i+off)%period;
  if (k>520) return 0;
  return Math.sin(k/520*TAU*2)*(1-k/520);
}
function tailSway(i){ return Math.sin(i/4200*TAU)*2.2 + Math.sin(i/1900*TAU+1)*0.5; }


const BUBBLE = {
  key:'bubble', title:'冒孔', en:'Bubbling',
  desc:'芝士在“发酵”：孔从下往上一个个冒出来，像气泡；孔都冒齐了，老鼠从芝士下边探出头来。',
  loop:['孔轮流轻轻鼓一下，像还在发酵','老鼠眨眼、胡须抖动、尾巴摆'],
  D:2600,
  frame(S,t,i){
    const order=[5,6,7,2,0,4,1,3]; // 大致从下往上
    const a=eOut(seg(t,0,320));
    S.wheel(`translate(${CX} ${CY}) scale(${n2(.94+.06*a)}) translate(${-CX} ${-CY})`, a);
    order.forEach((h,k)=>{
      const p=seg(t,280+k*130,280+k*130+520);
      let r=HOLES[h][2]*(p<=0?0:eBack(p,2.2)), dy=26*(1-eOut(p));
      if(i!=null){ const q=((i/1500)|0)%8, ph=(i%1500)/1500; if(order[q]===h) r*=1+0.07*Math.sin(Math.PI*ph); }
      S.hole(h,r,dy);
    });
    const m=seg(t,1360,1960);
    S.mouse(0, 560*(1-eBack(m,1.3)));
    const tl=seg(t,1800,2400);
    S.tail(-14*(1-eOut(tl))+(i!=null?tailSway(i):0), eOut(tl));
    S.whisk(i!=null?twitch(i):twitch(Math.max(0,t-2050),99999));
    S.eye(i!=null?blink(i):1);
  }
};
function stageFor(svg){
  const q=s=>svg.querySelector(s), qa=s=>[...svg.querySelectorAll(s)];
  const wheel=q('.wheel'), spin=q('.spin'), holes=qa('[data-h]'), notches=qa('[data-n]'),
    mcut=q('.mcut'), whisk=q('.whisk'), ws=qa('[data-w]'), mparts=q('.mparts'), eye=q('.eye'),
    tailg=q('.tailg'), crumbsG=q('.crumbs');
  const set=(el,k,v)=>{ v=String(v); if(el.getAttribute(k)!==v) el.setAttribute(k,v); };
  return {
    reset(){
      set(wheel,'transform',''); set(wheel,'opacity',1); set(spin,'transform','');
      holes.forEach((h,k)=>{ set(h,'r',HOLES[k][2]); set(h,'cy',HOLES[k][1]); });
      notches.forEach(n=>set(n,'transform',''));
      ws.forEach(w=>set(w,'transform',''));
      set(eye,'transform',''); crumbsG.innerHTML='';
      [mcut,whisk,mparts].forEach(g=>set(g,'transform',''));
      set(mcut,'opacity',1); set(tailg,'transform',''); set(tailg,'opacity',1);
    },
    wheel(tr,op){ set(wheel,'transform',tr); set(wheel,'opacity',n2(op)); },
    spin(tr){ set(spin,'transform',tr); },
    hole(k,r,dy){ set(holes[k],'r',n2(Math.max(0,r))); set(holes[k],'cy',n2(HOLES[k][1]+dy)); },
    notch(k,s){
      // 咬：缺口那个圆从芝士外面一口扣进来，而不是在里面长大
      const c=NOTCHES[k], nx=c[0]-CX, ny=c[1]-CY, L=Math.hypot(nx,ny), d=(1-s)*c[2]*1.15;
      set(notches[k],'transform',s>=1?'':`translate(${n2(nx/L*d)} ${n2(ny/L*d)})`);
    },
    mouse(dx,dy){
      const tr=(dx||dy)?`translate(${n2(dx)} ${n2(dy)})`:'';
      [mcut,whisk,mparts].forEach(g=>set(g,'transform',tr));
    },
    tail(deg,op){ set(tailg,'transform',Math.abs(deg)<.005?'':`rotate(${n2(deg)} ${TAIL_ROOT[0]} ${TAIL_ROOT[1]})`); set(tailg,'opacity',n2(op)); },
    whisk(a){ ws.forEach((w,k)=>{ const v=a*[7,-5,6][k]; const r=WHISKER_ROOT[k]; set(w,'transform',Math.abs(v)<.01?'':`rotate(${n2(v)} ${r[0]} ${r[1]})`); }); },
    whiskScale(sc){ ws.forEach((w,k)=>set(w,'transform',Math.abs(sc[k]-1)<.001?'':`translate(${NOSE[0]} ${NOSE[1]}) scale(${n2(Math.max(0,sc[k]))}) translate(${-NOSE[0]} ${-NOSE[1]})`)); },
    eye(s){ set(eye,'transform',s>=.999?'':`translate(${EYE[0]} ${EYE[1]}) scale(1 ${n2(s)}) translate(${-EYE[0]} ${-EYE[1]})`); },
    crumbs(list){
      crumbsG.innerHTML=list.map(([x,y,r,o])=>`<circle cx="${n2(x)}" cy="${n2(y)}" r="${n2(r)}" fill="#FFAE00" opacity="${n2(o)}"/>`).join('');
    }
  };
}


const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const bySlug={}; DATA.pages.forEach(p=>bySlug[p.section+'/'+p.slug]=p);
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-toast]');if(a){e.preventDefault();toast(a.dataset.toast)}});

// ---------- logo ----------
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function mountLogo(el,id,animate){
  el.outerHTML=build(id); const svg=document.querySelector('svg[aria-label^="Cheese logo"]:not([data-m])'); svg.dataset.m=id;
  if(!animate) return svg;
  const S=stageFor(svg); let clock=+(new URLSearchParams(location.search).get('t')||0),last=0,raf=0;
  const tick=now=>{ if(!svg.isConnected) return; const dt=last?Math.min(now-last,64):0; last=now; clock+=dt;
    S.reset(); if(!reduced()) BUBBLE.frame(S,Math.min(clock,BUBBLE.D),clock>=BUBBLE.D?clock-BUBBLE.D:null);
    raf=requestAnimationFrame(tick) };
  raf=requestAnimationFrame(tick);
  svg.addEventListener('click',()=>{clock=0;last=0});
  document.addEventListener('visibilitychange',()=>{last=0});
  return svg;
}
mountLogo($('#mini'),'mini',false);

    </div>
  </section>

    <h2>按功能查找</h2><p class="desc">已经会用了，只想查某个功能？</p>

    <h2>常见问题</h2><p class="desc">来自<a href="#/docs/troubleshooting">常见问题与排障</a>。</p>
    ${DATA.faq.map(f=>`<details class="qa"><summary>${escH(f.q)}</summary><div>${f.a} <a href="#/docs/troubleshooting~${f.id}">详细说明</a></div></details>`).join('')}
  </section>
  <div class="closing"><h3>不知道从哪开始？问芝士</h3><p>用你自己的话描述想做的事，芝士会告诉你从哪一页、哪一步开始。</p><a class="btn pri" href="#" data-toast="会打开问芝士">问芝士</a></div>

function renderWho(k){ $('#whoCards').innerHTML=WHO[k].map(([t,d,s])=>`<a class="card" href="#/docs/${s}"><b>${t}</b><span>${d}</span><i>${bySlug['docs/'+s].title} →</i></a>`).join('') }

function docPage(sec,slug,anchor){
  const p=bySlug[sec+'/'+slug]||bySlug[sec+'/'+DATA.nav[sec][0].slugs[0]];
  const flat=DATA.nav[sec].flatMap(g=>g.slugs); const i=flat.indexOf(p.slug);
  const prev=bySlug[sec+'/'+flat[i-1]], next=bySlug[sec+'/'+flat[i+1]];
  const side=DATA.nav[sec].map(g=>`<h4>${g.group}</h4>`+g.slugs.map(s=>{const q=bySlug[sec+'/'+s];return `<a href="#/${sec}/${s}" class="${s===p.slug?'on':''}">${q.title}${q.draft&&sec==='docs'?'<span class="todo">待写</span>':''}</a>`}).join('')).join('');
  return `<div class="layout view"><aside class="side">${side}</aside>
  <main class="main"><article class="article">
    ${sec==='dev'?'<div class="admin-note"><b>仅管理员</b>平台管理员可见；从后台管理进入。这一部分按当前代码撰写，不沿用仓库里旧的设计文档。</div>':''}
    <div class="crumb">${sec==='dev'?'开发文档':'使用文档'} · ${p.group}</div>
    <h1>${p.title}</h1>${p.html}
    <div class="pager">${prev?`<a href="#/${sec}/${prev.slug}"><small>上一页</small>${prev.title}</a>`:'<span></span>'}${next?`<a class="nx" href="#/${sec}/${next.slug}"><small>下一页</small>${next.title}</a>`:'<span></span>'}</div>
  </article></main>
  <nav class="toc">${p.toc.length?'<h5>本页内容</h5>'+p.toc.map(([d,id,t])=>`<a class="l${d}" href="#/${sec}/${p.slug}~${id}" data-id="${id}">${escH(t)}</a>`).join(''):''}</nav></div>`;
}

  return `<div class="cl view"><h1>更新日志</h1><p class="intro">按版本记录 Cheese 的变化。每个版本先列要点，完整的改动清单可以展开。</p>

// ---------- router ----------
function route(){
  const h=location.hash.replace(/^#\/?/,''); const [pathPart,anchor]=h.split('~'); const [sec,slug]=pathPart.split('/');
  const app=$('#app'); let s='home';
  if(sec==='docs'||sec==='dev'){ app.innerHTML=docPage(sec,slug); s=sec }
  else if(sec==='changelog'){ app.innerHTML=changelog(); s='changelog' }
  else { app.innerHTML=home(); mountLogo($('#heroLogo'),'hero',true); renderWho('学生');
    $('#who').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#who button').forEach(x=>x.classList.toggle('on',x===b));renderWho(b.dataset.who)};
    $('#heroAsk').onsubmit=e=>{e.preventDefault();toast('会打开问芝士，并带上你的问题')};
    $('#heroSearch').onclick=()=>openSearch($('#heroAsk input').value);
  }
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.sec===s));
  if(anchor){ const el=document.getElementById(anchor); if(el){ el.scrollIntoView(); return } }
  window.scrollTo(0,0); spy();
}
function spy(){ const links=$$('.toc a'); if(!links.length) return; let cur=links[0];
  for(const a of links){ const el=document.getElementById(a.dataset.id); if(el&&el.getBoundingClientRect().top<120) cur=a }
  links.forEach(a=>a.classList.toggle('on',a===cur)) }
addEventListener('scroll',spy,{passive:true});
addEventListener('hashchange',route);

// ---------- search ----------
const idx=DATA.pages.map(p=>({p,text:(p.title+' '+p.html.replace(/<[^>]+>/g,' ')).toLowerCase()}));
let sel=0;
function openSearch(v=''){ $('#modal').classList.add('on'); const q=$('#q'); q.value=v; q.focus(); find() }
function find(){ const v=$('#q').value.trim().toLowerCase(); const r=$('#res');
  const hits=v?idx.filter(x=>x.text.includes(v)).slice(0,8):idx.filter(x=>!x.p.draft).slice(0,6); sel=0;
  r.innerHTML=hits.length?hits.map((x,i)=>`<a href="#/${x.p.section}/${x.p.slug}" class="${i?'':'sel'}">${x.p.title}<small>${x.p.section==='dev'?'开发文档':'使用文档'} · ${x.p.group}</small></a>`).join('')
    :`<div class="none">没有找到「${escH(v)}」。<a href="#" data-toast="会打开问芝士，并带上你的问题">问芝士 →</a></div>` }
$('#openSearch').onclick=()=>openSearch();
$('#q').oninput=find;
$('#q').onkeydown=e=>{const as=$$('#res a:not([data-toast])');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as.forEach((a,i)=>a.classList.toggle('sel',i===sel))}if(e.key==='Enter'&&as[sel]){location.hash=as[sel].getAttribute('href');closeSearch()}};
function closeSearch(){ $('#modal').classList.remove('on') }
$('#modal').onclick=e=>{ if(e.target.id==='modal'||e.target.closest('#res a')) closeSearch() };
addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()} if(e.key==='Escape') closeSearch() });

// ---------- theme ----------
const qs=new URLSearchParams(location.search);
if(qs.has('t')) document.body.dataset.shot='1';
if(qs.get('theme')==='dark'||(!qs.get('theme')&&matchMedia('(prefers-color-scheme: dark)').matches)) document.body.dataset.theme='dark';
$('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'};
route();
