  <div class="meta">
    <h1>01 · 咬痕<span class="en">nibble</span></h1>
    <p>月亮上那八个洞不是天生的，是这只老鼠啃出来的。进场时奶酪是完整的一块，洞从离鼻尖最近的地方开始，一口一口向外扩散——每个洞都从靠近老鼠的一侧先破开，像被咬掉一口。最后胡须从鼻尖扫开：它抬起头，看向月亮。<br><kbd>悬停</kbd> 胡须一颤 <kbd>点击</kbd> 再咬一口</p>

<div class="bar">
  <button id="replay" type="button">重播</button>
  <button id="theme" type="button">深色背景</button>
  <label class="rm"><input id="rm" type="checkbox"> 模拟 reduced-motion</label>
</div>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const logo = $('#logo');

  const themeBtn = $('#theme');
  themeBtn.addEventListener('click', () => {
    const dark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = dark ? 'light' : 'dark';
    themeBtn.textContent = dark ? '深色背景' : '浅色背景';
  });

  const runsReduced = () =>
    $('#rm').checked || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Entrance progress lives in one place (t: 0..1) so it can be scrubbed,
  // interrupted mid-flight, or skipped outright under prefers-reduced-motion.
  let curT = 0;
  let curH = 0;
  function makeMotion(frame, duration) {
    let raf = 0;
    const draw = () => frame(curT, curH);
    const play = (dur = duration) => {
      cancelAnimationFrame(raf);
      if (runsReduced()) {
        curT = 1;
        draw();
        return;
      }
      const start = performance.now();
      const step = (now) => {
        curT = clamp((now - start) / dur);
        draw();
        if (curT < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };
    const stop = () => cancelAnimationFrame(raf);
    // hover: a there-and-back gesture that always lands back on the end frame
    let hraf = 0;
    const pulse = () => {
      cancelAnimationFrame(hraf);
      if (runsReduced()) return;
      const start = performance.now();
      const step = (now) => {
        const p = (now - start) / 620;
        curH = p >= 1 ? 0 : p < 0.42 ? p / 0.42 : 1 - (p - 0.42) / 0.58;
        draw();
        if (p < 1) hraf = requestAnimationFrame(step);
      };
      hraf = requestAnimationFrame(step);
    };
    return {
      play,
      stop: () => {
        stop();
        cancelAnimationFrame(hraf);
      },
      pulse,
      set: (t) => {
        curT = clamp(t);
        draw();
      },
    };
  }

  const HOLES = [{"n":1,"cx":230.8,"cy":427.66,"r":29.36,"d":437.2},{"n":2,"cx":411.93,"cy":259.92,"r":87.44,"d":447.7},{"n":3,"cx":487.39,"cy":471.77,"r":48.8,"d":224.3},{"n":4,"cx":630.77,"cy":177.61,"r":48.51,"d":491.6},{"n":5,"cx":788.51,"cy":378.23,"r":91.91,"d":347.9},{"n":6,"cx":801.77,"cy":929.08,"r":30.64,"d":332.4},{"n":7,"cx":814,"cy":699.41,"r":75.95,"d":220.3},{"n":8,"cx":981.18,"cy":720.45,"r":42.13,"d":388.7}];
  const NOSE = { x: 596, y: 668 };
  const whiskers = $('#whiskers');
  const cuts = $$('#cuts circle').map((el) => {
    const h = HOLES.find((o) => o.n === +el.dataset.hole);
    return { el, ...h };
  });
  // 「从老鼠的鼻尖一口一口向外啃」——顺序 = 离鼻尖的距离
  const order = [...cuts].sort((a, b) => a.d - b.d);

  // the eye is the one orange detail the mouse keeps while it eats; it warms
  // up at the end of the bite
  const glint = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  glint.setAttribute('cx', '502.71');
  glint.setAttribute('cy', '699.41');
  glint.setAttribute('r', '15.32');
  glint.setAttribute('fill', '#FFF0B8');
  glint.setAttribute('opacity', '0');
  $('#eye').after(glint);

  // click: it takes one more bite, then swallows it (the hole closes again)
  const crumb = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  crumb.setAttribute('cx', '700');
  crumb.setAttribute('cy', '556');
  crumb.setAttribute('r', '0');
  crumb.setAttribute('fill', '#000');
  whiskers.parentNode.appendChild(crumb);

  const whiskerTransform = (s, rot) =>
    `translate(${NOSE.x} ${NOSE.y}) rotate(${rot}) scale(${s}) translate(${-NOSE.x} ${-NOSE.y})`;

  const T = 1050;
  const FIRST = 90, STAGGER = 55, OPEN = 380;
  const W0 = 560, WD = 380, G0 = 820, GD = 230;

  function frame(t, h) {
    const now = t * T;
    for (let i = 0; i < order.length; i++) {
      const p = order[i];
      const s = clamp((now - (FIRST + i * STAGGER)) / OPEN);
      const e = 1 - Math.pow(1 - s, 2.4); // bites fast, settles
      // the cut starts as a point on the side of the hole that faces the mouse
      // and opens away from it — a bite, not an iris
      const ux = (p.cx - NOSE.x) / p.d, uy = (p.cy - NOSE.y) / p.d;
      p.el.setAttribute('r', (p.r * e).toFixed(2));
      p.el.setAttribute('cx', (p.cx - ux * p.r * (1 - e)).toFixed(1));
      p.el.setAttribute('cy', (p.cy - uy * p.r * (1 - e)).toFixed(1));
    }
    // whiskers sweep out from the nose; the pointer makes them quiver
    const w = clamp((now - W0) / WD);
    const ws = (0.02 + 0.98 * easeOutCubic(w)) * (1 + 0.06 * h);
    whiskers.setAttribute('transform', whiskerTransform(ws, -7 * (1 - easeOutCubic(w)) - 1.6 * h));
    // the eye catches the last light
    const g = clamp((now - G0) / GD);
    glint.setAttribute('opacity', (Math.sin(g * Math.PI) * 0.85).toFixed(3));
  }

  const motion = makeMotion(frame, T);

  // --- click: one more bite, swallowed ---------------------------------------
  let craf = 0, chew = 0;
  function bite() {
    cancelAnimationFrame(craf);
    if (runsReduced()) return;
    const start = performance.now();
    const step = (now) => {
      const p = (now - start) / 900;
      if (p >= 1) {
        crumb.setAttribute('r', '0');
        chew = 0;
        frame(curT, curH);
        return;
      }
      // open fast, hold, close
      const open = p < 0.3 ? easeOutCubic(p / 0.3) : p < 0.62 ? 1 : 1 - (p - 0.62) / 0.38;
      crumb.setAttribute('r', (26 * open).toFixed(1));
      chew = Math.sin(clamp((p - 0.28) / 0.5) * Math.PI) * 0.9;
      frame(curT, Math.max(curH, chew));
      craf = requestAnimationFrame(step);
    };
    craf = requestAnimationFrame(step);
  }

  $('#replay').addEventListener('click', () => motion.play());
  $('#rm').addEventListener('change', (e) => (e.target.checked ? motion.set(1) : motion.play()));
  logo.addEventListener('pointerenter', () => motion.pulse());
  logo.addEventListener('click', () => bite());
  window.__frame = (t) => { motion.stop(); frame(clamp(+t), 0); };
  window.__end = () => { motion.stop(); frame(1, 0); };
  window.__ready = true;

  if (runsReduced()) frame(1, 0); else motion.play();
})();
</script>
