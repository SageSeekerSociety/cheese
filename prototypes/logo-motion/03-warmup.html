    <h1>03 · 回暖<span class="en">first light</span></h1>
    <p>用的是 logo 自己的那段渐变：橙到黄，从上到下。开场它只是一块平的暖橙——轮廓、洞、胡须、耳朵、眼睛都在，但没有光；然后光从下缘升起来，像日落后贴地的那一层，慢慢把这块奶酪点亮成它本来的样子。没有任何颜色是外加的，从头到尾都在这条渐变上跑。<br>点亮之后光没有走：它退到奶酪的下缘待着，一上一下地呼吸，上缘被那层暖橙轻轻压一下又放开——那块暖橙也是 logo 自己的颜色。<br><kbd>悬停</kbd> 胡须一颤 <kbd>点击</kbd> 光再来一次</p>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const logo = $('#logo');

  const themeBtn = $('#theme');
  // index.html 的预览用 #thumb,dark 这样的片段指定"只显示 logo"和初始背景
  if (location.hash.indexOf('thumb') >= 0) document.body.dataset.thumb = '1';
  if (location.hash.indexOf('dark') >= 0) document.body.dataset.theme = 'dark';
  themeBtn.textContent = document.body.dataset.theme === 'dark' ? '浅色背景' : '深色背景';
  themeBtn.addEventListener('click', () => {
    const dark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = dark ? 'light' : 'dark';
    themeBtn.textContent = dark ? '深色背景' : '浅色背景';
  });

  const runsReduced = () =>
    $('#rm').checked || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- light breathing -------------------------------------------------------
  // 整枚标记的光一直在极缓慢地移动：每个渐变按各自的跨度做同一比例的小幅漂移，
  // 月亮上那条橙黄的界线会几像素上下浮动，小的零件（眼睛、耳朵）几乎不动。
  // 静帧下把属性还原成 logo.svg 里的原字符串，保证逐像素一致。
  // 只挑 logo 自己的那几个填充渐变（data-light），别去动 mask 里那条光带
  const gradients = $$('#logo linearGradient[data-light]').map((el) => ({
    el,
    y1: +el.getAttribute('y1'),
    y2: +el.getAttribute('y2'),
    y1s: el.getAttribute('y1'),
    y2s: el.getAttribute('y2'),
  }));
  const num = (v) => String(Math.round(v * 100) / 100);
  function lightBreath(ms) {
    const d = Math.sin((ms / 6200) * Math.PI * 2) * 0.72 + Math.sin((ms / 9100) * Math.PI * 2 + 1.2) * 0.36;
    for (const g of gradients) {
      const off = (g.y2 - g.y1 || 1) * 0.017 * d;
      g.el.setAttribute('y1', num(g.y1 + off));
      g.el.setAttribute('y2', num(g.y2 + off));
    }
  }
  function lightRest() {
    for (const g of gradients) {
      if (g.el.getAttribute('y1') !== g.y1s) g.el.setAttribute('y1', g.y1s);
      if (g.el.getAttribute('y2') !== g.y2s) g.el.setAttribute('y2', g.y2s);
    }
  }

  // ---- motion ----------------------------------------------------------------
  // Entrance progress lives in one place (t: 0..1) so it can be scrubbed,
  // interrupted mid-flight, or skipped outright under prefers-reduced-motion.
  // After the entrance the same loop keeps running and hands the frame an idle
  // clock (it, in ms, growing without end); it is null whenever the mark has to
  // hold still — reduced motion, scrubbing, the static end frame.
  let curT = 0;
  let curH = 0;
  let curI = null;
  function makeMotion(frame, duration) {
    let raf = 0;
    let want = false;
    let start = 0;
    let idleMs = 0;
    let last = 0;
    const draw = () => frame(curT, curH, curI);
    const step = (now) => {
      if (!want) return;
      if (curT < 1) {
        const p = clamp((now - start) / duration);
        if (p >= 1) {
          curT = 1;
          idleMs = 0;
          last = now;
        } else curT = p;
      } else {
        // idle: the clock only advances while frames are actually painted, so a
        // hidden tab (no rAF) freezes it, and a throttled one barely creeps
        idleMs += last ? Math.min(now - last, 64) : 16;
        last = now;
        curI = idleMs;
      }
      draw();
      raf = requestAnimationFrame(step);
    };
    const play = (dur = duration) => {
      want = false;
      cancelAnimationFrame(raf);
      if (runsReduced()) {
        curT = 1;
        curI = null;
        draw();
        return;
      }
      duration = dur;
      curT = 0;
      curI = null;
      idleMs = 0;
      last = 0;
      start = performance.now();
      want = true;
      raf = requestAnimationFrame(step);
    };
    const stop = () => {
      want = false;
      cancelAnimationFrame(raf);
    };
    // hover: a there-and-back gesture that always lands back on the end frame
    let hraf = 0;
    const pulse = () => {
      cancelAnimationFrame(hraf);
      if (runsReduced()) return;
      const t0 = performance.now();
      const walk = (now) => {
        const p = Math.max(0, (now - t0) / 620);
        curH = p >= 1 ? 0 : p < 0.42 ? p / 0.42 : 1 - (p - 0.42) / 0.58;
        draw();
        if (p < 1) hraf = requestAnimationFrame(walk);
      };
      hraf = requestAnimationFrame(walk);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else if (want) {
        last = 0;
        raf = requestAnimationFrame(step);
      }
    });
    return {
      play,
      stop: () => {
        stop();
        cancelAnimationFrame(hraf);
      },
      pulse,
      set: (t) => {
        want = false;
        cancelAnimationFrame(raf);
        curI = null;
        curT = clamp(t);
        draw();
      },
      idle: (ms) => {
        want = false;
        cancelAnimationFrame(raf);
        curI = ms;
        curT = 1;
        draw();
      },
    };
  }

  const NOSE = { x: 596, y: 668 };
  const whiskers = $('#whiskers');
  const scene = $('#scene');
  const lit = $('#lit');
  const lightGrad = $('#lightGrad');

  // 未点亮的那一层：整块 logo 的副本，填成一个平的暖橙
  const flat = scene.cloneNode(true);
  flat.removeAttribute('id');
  flat.classList.add('flat');
  flat.querySelectorAll('[id]').forEach((el) => el.removeAttribute('id'));
  lit.parentNode.insertBefore(flat, lit);

  const glint = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  glint.setAttribute('cx', '502.71');
  glint.setAttribute('cy', '699.41');
  glint.setAttribute('r', '15.32');
  glint.setAttribute('fill', '#FFF0B8');
  glint.setAttribute('opacity', '0');
  $('#eye').after(glint);

  const whiskerTransform = (s, rot) =>
    `translate(${NOSE.x} ${NOSE.y}) rotate(${rot}) scale(${s}) translate(${-NOSE.x} ${-NOSE.y})`;

  const TOP = 1700, SPAN = 1750, BAND = 420;
  const T = 1500;
  const WARM = 6200, WINK = 4600;
  // 呼吸：光退回下缘，同时把那条前沿拉得非常宽（lightGrad 的 stops 让它中间
  // 28% 才是真正的过渡带，所以带宽要放到几千才算「软」）。退回最低时标记上缘
  // 被暖橙压掉约一半，往下到 y≈950 就完全放开——暖橙从下往上浅浅渗一层。
  const BAND_I = 6400, Y1_LOW = 3250;
  const Y1_REST = TOP - SPAN; // 全亮：-50
  let lightOverride = null; // 0 = 平的那块暖橙，1 = logo 本来的渐变

  let maskOff = false;
  function frame(t, h, it) {
    const idleOn = it != null;
    // 太阳贴地那一下：光起得快，然后停稳；之后退回下缘，一上一下地呼吸
    const p = lightOverride !== null ? lightOverride : 1 - Math.pow(1 - t, 1.25);
    const y1 = idleOn
      ? Y1_REST + (Y1_LOW - Y1_REST) * (0.5 - 0.5 * Math.cos((it / WARM) * Math.PI * 2))
      : TOP - SPAN * p; // 光的前沿：下缘是亮的（white），往上是暗的
    lightGrad.setAttribute('y1', y1.toFixed(1));
    lightGrad.setAttribute('y2', (y1 - (idleOn ? BAND_I : BAND)).toFixed(1));
    // 全部点亮之后把绘制交还给原件本身：多一层 mask 合成会让边缘差半个像素
    const lit_ = p >= 1 && !idleOn;
    if (lit_ !== maskOff) {
      maskOff = lit_;
      lit.setAttribute('mask', lit_ ? '' : 'url(#warmMask)');
      flat.style.display = lit_ ? 'none' : '';
    }
    const g = clamp((t - 0.72) / 0.28);
    const wink = idleOn ? Math.pow(0.5 - 0.5 * Math.cos((it / WINK) * Math.PI * 2), 3) * 0.5 : 0;
    glint.setAttribute('opacity', Math.max(Math.sin(g * Math.PI) * 0.8 * (lightOverride === null ? 1 : p), wink).toFixed(3));
    whiskers.setAttribute('transform', whiskerTransform(1 + 0.05 * h, -1.4 * h));
    if (idleOn) lightBreath(it);
    else lightRest();
  }

  const motion = makeMotion(frame, T);

  // 点击：先退回那块平的暖橙，光再升上来一次
  let lraf = 0;
  function relight() {
    cancelAnimationFrame(lraf);
    if (runsReduced()) return;
    motion.set(1);
    const start = performance.now();
    const step = (now) => {
      const q = Math.max(0, (now - start) / 1150);
      if (q >= 1) {
        lightOverride = null;
        frame(1, 0, null);
        return;
      }
      lightOverride = clamp(q < 0.26 ? 1 - easeInOutCubic(q / 0.26) : easeInOutCubic((q - 0.26) / 0.74));
      frame(1, 0, null);
      lraf = requestAnimationFrame(step);
    };
    lraf = requestAnimationFrame(step);
  }

  $('#replay').addEventListener('click', () => { lightOverride = null; motion.play(); });
  $('#rm').addEventListener('change', (e) => { lightOverride = null; e.target.checked ? motion.set(1) : motion.play(); });
  logo.addEventListener('pointerenter', () => motion.pulse());
  logo.addEventListener('click', relight);
  window.__frame = (t) => { lightOverride = null; motion.stop(); frame(clamp(+t), 0, null); };
  window.__end = () => { lightOverride = null; motion.stop(); frame(1, 0, null); };
  window.__idle = (ms) => motion.idle(+ms);
  window.__ready = true;

  if (runsReduced()) frame(1, 0, null); else motion.play();
})();
</script>
</body>
</html>
