# User Domain Schemas

User:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: User ID
      minimum: 1
    username:
      type: string
      description: Username
      example: "cheese"
    nickname:
      type: string
      description: Display name
      example: "Cheese"
    avatarId:
      type: integer
      description: Avatar ID
    intro:
      type: string
      description: User bio
      default: "This user has not set an introduction yet."
    follow_count:
      type: integer
      format: int64
      description: Number of users following
      minimum: 0
    fans_count:
      type: integer
      format: int64
      description: Number of followers
      minimum: 0
    question_count:
      type: integer
      format: int64
      description: Number of questions asked
      minimum: 0
    answer_count:
      type: integer
      format: int64
      description: Number of answers given
      minimum: 0
    is_follow:
      type: boolean
      description: Whether current user follows this user
  required:
    - id
    - username
    - nickname
    - avatarId
    - intro
    - follow_count
    - fans_count
    - question_count
    - answer_count

UserProfile:
  type: object
  properties:
    user:
      $ref: '#/User'
    email:
      type: string
      description: User email (only visible to self)
    created_at:
      type: integer
      format: int64
      description: Account creation timestamp
    settings:
      $ref: '#/UserSettings'

UserSettings:
  type: object
  properties:
    email_notifications:
      type: boolean
      default: true
    push_notifications:
      type: boolean
      default: true

LoginRequest:
  type: object
  properties:
    username:
      type: string
    password:
      type: string
  required:
    - username
    - password

LoginResponse:
  type: object
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/User'
        requires2fa:
          type: boolean
          description: Whether 2FA verification is required
        tempToken:
          type: string
          description: Temporary token for 2FA (only when requires2fa is true)
      required:
        - accessToken
        - user
        - requires2fa

RegisterRequest:
  type: object
  properties:
    username:
      type: string
    nickname:
      type: string
    password:
      type: string
    email:
      type: string
    emailCode:
      type: string
    isLegacyAuth:
      type: boolean
      description: Whether to use legacy authentication
  required:
    - username
    - nickname
    - password
    - email
    - emailCode

RegisterResponse:
  type: object
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/User'
      required:
        - accessToken
        - user

PasskeyChallengeResponse:
  type: object
  description: Passkey login challenge response
  properties:
    challenge:
      type: string
      description: Random challenge string
    timeout:
      type: integer
      description: Challenge timeout in milliseconds
    rpId:
      type: string
      description: Relying party identifier
    allowCredentials:
      type: array
      description: List of allowed credential IDs
      items:
        type: string

PasskeyVerificationRequest:
  type: object
  description: Passkey login verification request
  properties:
    credentialId:
      type: string
      description: Credential ID
    clientDataJSON:
      type: string
      description: Client data (Base64 encoded)
    authenticatorData:
      type: string
      description: Authenticator data (Base64 encoded)
    signature:
      type: string
      description: Signature (Base64 encoded)
    userHandle:
      type: string
      description: User handle (optional)

PasskeyCredential:
  type: object
  description: User Passkey credential information
  properties:
    id:
      type: integer
      format: int64
      description: Credential record ID
    credentialId:
      type: string
      description: Passkey credential ID
    publicKey:
      type: string
      description: Public key
    transports:
      type: array
      description: Supported transports
      items:
        type: string
    created_at:
      type: integer
      format: int64
      description: Registration timestamp

PasskeyCredentialRegistrationRequest:
  type: object
  description: Register Passkey credential request
  properties:
    credentialId:
      type: string
    publicKey:
      type: string
    transports:
      type: array
      items:
        type: string
  required:
    - credentialId
    - publicKey

TOTPSetupResponse:
  type: object
  description: TOTP 2FA setup response
  properties:
    secret:
      type: string
      description: TOTP secret (only returned on initial setup)
    otpauth_url:
      type: string
      description: TOTP QR code URL (only on initial setup)
    backup_codes:
      type: array
      description: Backup codes list (only on initial setup or regeneration)
      items:
        type: string

UserIdentity:
  type: object
  description: User real-name identity information
  properties:
    id:
      type: integer
      format: int64
    userId:
      type: integer
      format: int64
    realName:
      type: string
      description: Real name (may be encrypted)
    idNumber:
      type: string
      description: ID number (may be encrypted)
    verified:
      type: boolean
    created_at:
      type: integer
      format: int64
