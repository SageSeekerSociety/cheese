# Answer Domain Schemas

Answer:
  type: object
  description: Answer details
  properties:
    id:
      type: integer
      format: int64
      description: Answer ID
    question_id:
      type: integer
      format: int64
      description: Question ID this answer belongs to
    content:
      type: string
      description: Answer content
    attachments:
      type: array
      description: Attachments in the content
      items:
        $ref: '../attachment/schemas.yaml#/Attachment'
    author:
      $ref: '../user/schemas.yaml#/User'
    created_at:
      type: integer
      format: int64
      description: Creation timestamp
    updated_at:
      type: integer
      format: int64
      description: Last update timestamp
    attitudes:
      $ref: '../../common/responses.yaml#/AttitudeStats'
    is_favorite:
      type: boolean
      description: Whether current user favorited this answer
    comment_count:
      type: integer
      description: Number of comments
    favorite_count:
      type: integer
      description: Number of favorites
    view_count:
      type: integer
      description: Number of views
    group:
      $ref: '../group/schemas.yaml#/Group'
      nullable: true

CreateAnswerRequest:
  type: object
  properties:
    content:
      type: string
  required:
    - content

UpdateAnswerRequest:
  type: object
  properties:
    content:
      type: string
