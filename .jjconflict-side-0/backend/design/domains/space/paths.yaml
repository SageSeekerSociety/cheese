# Space Domain Paths

/spaces:
  get:
    summary: List spaces
    operationId: listSpaces
    tags: [Spaces]
    parameters:
      - name: q
        in: query
        description: Search keyword
        schema:
          type: string
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Spaces list
  post:
    summary: Create space
    operationId: createSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateSpaceRequest'
    responses:
      '201':
        description: Space created

/spaces/{spaceId}:
  get:
    summary: Get space details
    operationId: getSpace
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Space details
  put:
    summary: Update space
    operationId: updateSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateSpaceRequest'
    responses:
      '200':
        description: Space updated
  delete:
    summary: Delete space
    operationId: deleteSpace
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '204':
        description: Space deleted

/spaces/{spaceId}/categories:
  get:
    summary: List space categories
    operationId: listSpaceCategories
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Categories list
  post:
    summary: Create category
    operationId: createSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCategoryRequest'
    responses:
      '201':
        description: Category created

/spaces/{spaceId}/categories/{categoryId}:
  get:
    summary: Get category details
    operationId: getSpaceCategory
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Category details
  put:
    summary: Update category
    operationId: updateSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCategoryRequest'
    responses:
      '200':
        description: Category updated
  delete:
    summary: Delete category
    operationId: deleteSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Category deleted

/spaces/{spaceId}/categories/{categoryId}/archive:
  post:
    summary: Archive category
    operationId: archiveSpaceCategory
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Category archived

/spaces/{spaceId}/managers:
  get:
    summary: List space managers
    operationId: listSpaceManagers
    tags: [Spaces]
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Managers list

/spaces/{spaceId}/managers/{userId}:
  put:
    summary: Add space manager
    operationId: addSpaceManager
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '200':
        description: Manager added
  delete:
    summary: Remove space manager
    operationId: removeSpaceManager
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
      - $ref: '../../common/parameters.yaml#/UserId'
    responses:
      '204':
        description: Manager removed

/spaces/{spaceId}/analytics/tasks:
  get:
    summary: Get space task analytics
    operationId: getSpaceTaskAnalytics
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Task analytics

/spaces/{spaceId}/publishers/participation:
  get:
    summary: Get publisher participation stats
    operationId: getPublisherParticipation
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Participation stats

/spaces/{spaceId}/participants/export:
  get:
    summary: Export participants data
    operationId: exportParticipants
    tags: [Spaces]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/SpaceId'
    responses:
      '200':
        description: Participants data export
