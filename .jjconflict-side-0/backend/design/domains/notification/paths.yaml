# Notification Domain Paths

/notifications:
  get:
    summary: List notifications
    operationId: listNotifications
    tags: [Notifications]
    security:
      - BearerAuth: []
    parameters:
      - name: is_read
        in: query
        description: Filter by read status
        schema:
          type: boolean
      - $ref: '../../common/parameters.yaml#/PageStart'
      - $ref: '../../common/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Notifications list
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    notifications:
                      type: array
                      items:
                        $ref: './schemas.yaml#/Notification'
                    page:
                      $ref: '../../common/responses.yaml#/Page'

/notifications/{notificationId}:
  get:
    summary: Get notification details
    operationId: getNotification
    tags: [Notifications]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/NotificationId'
    responses:
      '200':
        description: Notification details
  patch:
    summary: Mark notification as read
    operationId: markNotificationRead
    tags: [Notifications]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/NotificationId'
    responses:
      '200':
        description: Notification marked as read
  delete:
    summary: Delete notification
    operationId: deleteNotification
    tags: [Notifications]
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../common/parameters.yaml#/NotificationId'
    responses:
      '204':
        description: Notification deleted

/notifications/status:
  get:
    summary: Get notification status
    operationId: getNotificationStatus
    tags: [Notifications]
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Notification status
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  $ref: './schemas.yaml#/NotificationStatus'

/notifications/unread-count:
  get:
    summary: Get unread notification count
    operationId: getUnreadCount
    tags: [Notifications]
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Unread count
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    count:
                      type: integer
                      format: int64
