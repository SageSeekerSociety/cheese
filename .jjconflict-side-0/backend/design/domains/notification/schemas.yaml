# Notification Domain Schemas

Notification:
  type: object
  properties:
    id:
      type: integer
      format: int64
    type:
      type: string
      description: Notification type
    title:
      type: string
    content:
      type: string
    is_read:
      type: boolean
    created_at:
      type: integer
      format: int64
    data:
      type: object
      description: Additional notification data
      additionalProperties: true

NotificationStatus:
  type: object
  properties:
    unread_count:
      type: integer
      format: int64
    total_count:
      type: integer
      format: int64

NotificationSettings:
  type: object
  properties:
    email_enabled:
      type: boolean
    push_enabled:
      type: boolean
    types:
      type: object
      additionalProperties:
        type: boolean
