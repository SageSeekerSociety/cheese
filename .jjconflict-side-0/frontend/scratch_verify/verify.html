<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>md-content overflow verify</title>
<style>
  html, body { margin: 0; background: #f2f2f2; }
  /* Mimic the app shell: a fixed-width chat column like the real layout. */
  .chat-shell {
    width: 720px;
    margin: 24px auto;
    background: #fff;
    border: 1px solid #ddd;
    overflow-x: hidden; /* if content escapes, this reveals it as a visible cut / or the outer page scrolls */
  }
  .im-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 4px 16px;
    margin-top: 8px;
  }
  .im-gutter { width: 28px; flex: 0 0 28px; }
  .im-main { min-width: 0; flex: 1 1 auto; }
  .im-text {
    font-size: 14px;
    line-height: 1.62;
    color: #222;
    word-break: break-word;
  }
  /* ---- exact copy of .md-content rules from ChatPanel.vue (scoped :deep stripped) ---- */
  .md-content { font-size: 0.9rem; line-height: 1.6; }
  .md-content p { margin: 0 0 8px; }
  .md-content p:last-child { margin-bottom: 0; }
  .md-content h1, .md-content h2, .md-content h3 { font-size: 1.02em; font-weight: 600; margin: 10px 0 4px; }
  .md-content ul, .md-content ol { margin: 4px 0; padding-left: 20px; }
  .md-content li { margin: 2px 0; }
  .md-content a { color: #06c; text-decoration: none; overflow-wrap: anywhere; }
  .md-content a:hover { text-decoration: underline; }
  .md-content img { max-width: 100%; height: auto; border-radius: 8px; }
  .md-content table { display: block; width: max-content; max-width: 100%; overflow-x: auto; }
  .md-content code { font-family: monospace; background: #eee; padding: 0.5px 5px; border-radius: 4px; font-size: 0.88em; }
  .md-content pre { background: #eee; padding: 11px 13px; border-radius: 8px; overflow-x: auto; }
  .md-content pre code { background: none; padding: 0; }
  .md-content blockquote { margin: 6px 0; padding-left: 12px; border-left: 2px solid #ccc; color: #666; }
  /* ---- end copy ---- */

  #report { max-width: 720px; margin: 12px auto; font: 13px monospace; white-space: pre-wrap; }
  .ok { color: green; } .bad { color: red; }
</style>
</head>
<body>
  <div class="chat-shell" id="shell">
    <div class="im-row">
      <div class="im-gutter"></div>
      <div class="im-main">
        <div class="im-text md-content" id="rendered"></div>
      </div>
    </div>
  </div>
  <div id="report"></div>

<script type="module">
  import { renderMarkdown } from '/src/lib/renderMessage.ts'

  // A very wide inline SVG data-URI image (2400x300) — exercises the img rule,
  // same "data URI inline image" path the brief says is already confirmed working.
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='2400' height='300'><rect width='2400' height='300' fill='%23ffb703'/><text x='20' y='160' font-size='40' fill='%23222'>2400x300 wide image</text></svg>`
  const dataUri = 'data:image/svg+xml,' + svg.replace(/#/g, '%23')

  const md = `一张超宽图：

![wide](${dataUri})

一张宽表：

| Col A very long header | Col B very long header | Col C very long header | Col D very long header | Col E very long header | Col F very long header | Col G very long header |
| --- | --- | --- | --- | --- | --- | --- |
| aaaaaaaaaaaaaaaa | bbbbbbbbbbbbbbbb | cccccccccccccccc | dddddddddddddddd | eeeeeeeeeeeeeeee | ffffffffffffffff | gggggggggggggggg |
| row2 | row2 | row2 | row2 | row2 | row2 | row2 |

一个超长无空格 URL 测试自动换行：
https://example.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
`

  document.getElementById('rendered').innerHTML = renderMarkdown(md, { mentionNames: {}, topicTitles: {} })

  requestAnimationFrame(() => {
    const shell = document.getElementById('shell')
    const shellOverflows = shell.scrollWidth > shell.clientWidth
    const pageOverflows = document.documentElement.scrollWidth > document.documentElement.clientWidth
    const img = document.querySelector('#rendered img')
    const table = document.querySelector('#rendered table')
    const lines = [
      `shell.clientWidth=${shell.clientWidth} shell.scrollWidth=${shell.scrollWidth} shellOverflows=${shellOverflows}`,
      `page scrollWidth=${document.documentElement.scrollWidth} clientWidth=${document.documentElement.clientWidth} pageOverflows=${pageOverflows}`,
      img ? `img renderedWidth=${img.getBoundingClientRect().width} (natural 2400) withinShell=${img.getBoundingClientRect().width <= shell.clientWidth}` : 'img: NOT FOUND',
      table ? `table renderedWidth=${table.getBoundingClientRect().width} shellClientWidth=${shell.clientWidth} withinShell=${table.getBoundingClientRect().width <= shell.clientWidth + 0.5}` : 'table: NOT FOUND',
    ]
    document.getElementById('report').innerHTML = lines.map(l => `<div class="${/false|NOT FOUND/.test(l) ? 'bad' : 'ok'}">${l}</div>`).join('')
    document.title = shellOverflows || pageOverflows ? 'FAIL-OVERFLOW' : 'PASS-NO-OVERFLOW'
  })
</script>
</body>
</html>
