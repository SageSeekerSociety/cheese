user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$http_origin" - "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout 65;

    # Allow large file uploads (PDF, etc.)
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            # here allow the spa itself to control the route
            try_files $uri $uri/ /index.html ;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # 现场实时终端 / 运行环境预览 反代: these two are the ONLY /api paths that
        # must reach the backend un-rewritten. The block below strips one `/api`
        # (see its comment), but both are iframe sources whose page resolves its
        # own assets, WebSocket and HMR relative to `location.pathname` — the
        # backend therefore serves them at the exact `/api/…` path the browser
        # asks for. Stripped, they arrive as `/topics/…` and 404, which is how the
        # terminal shipped 100% broken in production while dev worked (vite.config.ts
        # already carried this exception; nginx did not). Regex location, so it
        # wins over the `/api/` prefix block regardless of order.
        location ~ ^/api/topics/[^/]+/(terminal|app)(/|$) {
            # No URI part on proxy_pass → the request URI is passed through as-is.
            proxy_pass http://backend:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # A pane/app socket stays open as long as the drawer does.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Agent SSE/WS streams outlive the 60s default.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 知是 2.0 connector plane: device enrollment (install.sh, cheesehost),
        # device↔hub WebSockets, live-screen (现场) viewers. The backend serves
        # /connector/* natively, so NO path strip here (unlike /api/ above).
        location /connector/ {
            proxy_pass http://backend:8081/connector/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Device hub + 现场 terminals hold WebSockets open for hours.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
