version: '3'

tasks:
  install:
    desc: Install E2E test dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml
  test:
    desc: Run E2E tests
    deps: [install]
    cmds:
      - pnpm exec playwright test
  test:changed:
    desc: Run only the E2E specs touched since origin/main (pre-push check)
    deps: [install]
    cmds:
      # Playwright resolves the diff through git, so this needs a git checkout
      # (a jj-only agent workspace has none) and an up-to-date origin/main.
      # BASE overrides the comparison point, e.g. `task e2e:test:changed BASE=HEAD~1`.
      - pnpm exec playwright test --only-changed={{.BASE | default "origin/main"}}
  test:headed:
    desc: Run E2E tests with browser visible
    deps: [install]
    cmds:
      - pnpm exec playwright test --headed
  test:debug:
    desc: Debug E2E tests with inspector
    deps: [install]
    cmds:
      - pnpm exec playwright test --debug
  report:
    desc: Show last test report
    cmds:
      - pnpm exec playwright show-report
