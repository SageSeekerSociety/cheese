name: Frontend Test

# Two gaps, both real, both closed here:
#
#   * Nothing in CI ever TYPE-CHECKED the frontend. test.yml is scoped to
#     `backend/**`, e2e.yml runs Playwright but no type check, and the only job
#     that touched `frontend/` was build.yml's `docker build` — whose `vite
#     build` strips types without checking them. A type error or an undefined
#     variable could be merged and deployed as long as the bundler survived it.
#     One had been: `} catch {` referencing `error` in AuditTask.vue, a
#     guaranteed ReferenceError on the reject path.
#   * Nothing in CI ever ran the frontend's OWN tests. `frontend/src` holds 29
#     vitest files / ~289 assertions — including the ones added by #244, #246
#     and #249 — so a frontend PR could go green with its new tests failing,
#     and did.
#
# Hosted, not the box: pnpm + eslint + vue-tsc + vitest need no service
# containers, no native amd64 Docker and nothing box-local, and the box's
# self-hosted slot is also the deploy target — parking a multi-minute frontend
# check there would queue ahead of deploys for no gain. test.yml already puts
# its `scope` and `lint` jobs on hosted for the same reason.
#
# DELIBERATE DEVIATION from frontend/Dockerfile, which builds on node:21-slim:
# this job runs node 22 (21 is end-of-life and gets no security updates). The
# difference is safe HERE because this job only lints, type-checks and tests —
# it never produces the bundle that ships. If a job that builds the deployable
# artifact is ever added, it must match the Dockerfile instead.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# No step here comments, pushes or reads another workflow's runs — checkout is
# the only thing that wants the token at all. Without this block the run would
# inherit the repository default, which can be read/write across every scope.
permissions:
  contents: read

# Keyed by commit sha on main, the same way build.yml, test.yml and e2e.yml are
# (build.yml carries the long version of this comment): every main push shares
# the one ref, so a ref-only key lets each merge cancel the previous commit's
# still-running check — and a cancelled run is not a red run, so main quietly
# loses the coverage with nothing on the commit to show for it. Other refs (PR
# merge refs) keep the ref-only key, so repeated pushes to a single PR still
# supersede each other.
concurrency:
  group: ci-frontend-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    # Measured locally: install ~40s, eslint ~90s, vitest ~56s. The margin
    # covers a cold pnpm store without letting a wedged run bill for an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing below pushes, and the lockfile has zero git: specifiers, so
          # there is no reason to leave the token in .git/config while
          # third-party postinstall scripts run.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # pnpm comes from frontend/package.json's `packageManager` field
      # (pnpm@9.15.3), so the repo pins the version rather than this workflow.
      # Deliberately NOT `pnpm/action-setup` with a hard-coded major: that
      # overrides the pinned version, and a newer pnpm resolving this
      # lockfile is exactly the drift `--frozen-lockfile` exists to prevent.
      - name: Enable corepack
        run: corepack enable

      # Explicit cache rather than setup-node's `cache: pnpm`, which shells out
      # to pnpm to locate the store and so would have to run after corepack.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A missing binary must not read as a passing check. `pnpm exec <missing>`
      # has been observed to exit 0 with no output when node_modules is empty,
      # which is how "vue-tsc reports 0 errors" can mean "vue-tsc never ran".
      - name: Verify the toolchain is actually installed
        run: |
          test -x node_modules/.bin/eslint || { echo "::error::eslint not installed"; exit 1; }
          test -x node_modules/.bin/vue-tsc || { echo "::error::vue-tsc not installed"; exit 1; }
          test -x node_modules/.bin/vitest || { echo "::error::vitest not installed"; exit 1; }
          node_modules/.bin/vue-tsc --version

      # `lint` is `eslint .` — the read-only form. It must stay that way: the
      # writing form lives in `lint:fix`, and a gate that rewrites the checkout
      # can exit 0 on a violation it silently repaired.
      #
      # No --max-warnings: the tree carries 288 warnings today (mostly
      # no-explicit-any and unused vars) and only errors fail this step.
      # Tightening that is a separate cleanup, not a prerequisite for having any
      # lint gate at all.
      - name: Lint
        run: pnpm run lint

      # Not a plain `vue-tsc --noEmit` (that is `typecheck:raw`): the
      # pre-existing errors are frozen in tsc-baseline.json and any NEW one
      # fails. See scripts/tsc-ratchet-core.mjs. `pnpm build` does NOT type
      # check — the build script is a bare `vite build`.
      - name: Type check (ratchet)
        env:
          # Private-repo hosted runners are 2-core/7GB, where Node's default
          # heap lands around 2GB; vue-tsc on this tree peaks near 1.7GB, which
          # is too close to the edge to leave to chance. Physical memory is
          # nowhere near the limit, so this only removes a cliff.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run typecheck

      # `pnpm run test` is vitest in WATCH mode and would hang the runner until
      # the timeout; `vitest run` is the one-shot form.
      - name: Unit tests
        run: pnpm exec vitest run

      # The ratchet's own tests. Via the package script, not a bare
      # `node --test scripts/`: passing a DIRECTORY resolves as a module entry
      # point on node 22 while node 20 treated it as a search path, so the two
      # disagreed and CI failed on something that passed locally. An explicit
      # file glob behaves the same everywhere, and going through package.json
      # keeps local and CI on one command instead of two that can drift.
      - name: Ratchet unit tests
        run: pnpm run test:ratchet

      # One check that belongs here is deliberately absent, so that nobody
      # reads a green tick as covering it:
      #
      #   * `vite build` — build.yml already runs it via frontend/Dockerfile,
      #     but only on pushes to main, so a build-only breakage still lands
      #     before anything catches it. Worth adding here (~2 min); left out
      #     only because it could not be executed to a verified pass while
      #     writing this file (the sandbox it was authored in caps memory at
      #     2GB and vite OOMs well below the finish line — a limitation of the
      #     sandbox, not evidence that the build is broken).
