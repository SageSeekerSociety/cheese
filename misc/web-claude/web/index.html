<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web-claude</title>
  <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css">
  <script src="https://unpkg.com/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://unpkg.com/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/@xterm/addon-clipboard@0.1.0/lib/addon-clipboard.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #14121a; color: #e7e3f0; height: 100vh; display: flex; }
    #side { width: 320px; flex: none; border-right: 1px solid #2b2740; height: 100vh; display: flex; flex-direction: column; }
    #sidetop { flex: 0 0 auto; max-height: 42vh; overflow-y: auto; padding: 1rem 1rem 0; }
    .chathdr { flex: none; padding: 0 1rem; margin: .6rem 0 .3rem; }
    #chatform { flex: none; border-top: 1px solid #2b2740; background: #14121a; padding: .6rem 1rem; margin: 0; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #9d93b8; margin: 1.4rem 0 .5rem; }
    .device { border: 1px solid #2b2740; border-radius: .5rem; padding: .6rem; margin-bottom: .6rem; }
    .device .name { font-weight: 600; }
    .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; margin-right: .4rem; }
    .on { background: #4ade80; } .off { background: #6b6580; }
    button { font: inherit; padding: .3rem .7rem; border: 0; border-radius: .4rem; background: #6b46c1; color: #fff; cursor: pointer; margin-top: .4rem; }
    button:disabled { background: #3a3550; cursor: default; }
    .screen { font-size: .85rem; padding: .3rem 0; border-top: 1px dashed #2b2740; margin-top: .4rem; cursor: pointer; }
    .screen.active { color: #c4b5fd; }
    .kv { font-size: .8rem; color: #b8b0d0; }
    #vars { height: 8rem; overflow-y: auto; overflow-wrap: anywhere; border: 1px solid #221f30; border-radius: .3rem; padding: .3rem; }
    .kv b { color: #e7e3f0; font-weight: 600; }
    .badge { font-size: .7rem; padding: .05rem .4rem; border-radius: .3rem; background: #3a3550; }
    .badge.busy { background: #b45309; } .badge.idle { background: #15803d; }
    .badge.waiting { background: #be123c; } .badge.dead { background: #52525b; }
    #chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 1rem; display: flex; flex-direction: column; gap: .3rem; }
    .msg { font-size: .82rem; padding: .35rem .5rem; border-radius: .4rem; max-width: 95%; white-space: pre-wrap; }
    .msg.user { background: #4c1d95; align-self: flex-end; }
    .msg.claude { background: #1f2937; align-self: flex-start; }
    #chatform { display: flex; gap: .3rem; margin-top: .4rem; }
    #chatform input { flex: 1; }
    .choicebox { display: flex; flex-direction: column; gap: .3rem; }
    .choicebtn { text-align: left; background: #3a3550; color: #e7e3f0; padding: .35rem .5rem; border-radius: .4rem; }
    .choicebtn:hover { background: #6b46c1; }
    #gatebar { font-size: .78rem; color: #9d93b8; padding: .3rem .6rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .modebtn { font-size: .75rem; padding: .15rem .5rem; margin: 0 .1rem; border-radius: .3rem; background: #2b2740; color: #cbc4e0; }
    .modebtn.on { background: #6b46c1; color: #fff; }
    #gatebar .hint b { color: #e7e3f0; }
    .cbar { display: inline-flex; align-items: center; gap: .35rem; color: #fbbf24; }
    .ctrack { display: inline-block; width: 90px; height: .5rem; border-radius: .25rem; background: #2b2740; overflow: hidden; }
    .cfill { display: block; height: 100%; background: #fbbf24; transition: width .3s ease; }
    #termwrap { flex: 1; padding: .5rem; min-height: 0; position: relative; }
    #term { height: 100%; }
    #gatebar .fontctl { margin-left: auto; display: inline-flex; gap: .1rem; }
    #note { font-size: .82rem; padding: .3rem 0; border-bottom: 1px solid #221f30; }
    #note .who { color: #9d93b8; }
    #empty { color: #6b6580; padding: 2rem; text-align: center; }
    input[type=text] { width: 100%; padding: .3rem; margin-top: .3rem; background: #1c1926; border: 1px solid #2b2740; color: inherit; border-radius: .3rem; }
  </style>
</head>
<body>
  <div id="side">
    <div id="sidetop">
      <h1>🧀 web-claude</h1>
      <h2>Devices</h2>
      <div id="devices"></div>
      <h2>Screen variables</h2>
      <div id="vars" class="kv">— open a screen —</div>
    </div>
    <h2 class="chathdr">Chat with this Claude</h2>
    <div id="chat"></div>
    <form id="chatform"><input type="text" id="chatinput" placeholder="Say something…"><button>Send</button></form>
  </div>
  <div id="main">
    <div id="gatebar"></div>
    <div id="termwrap">
      <div id="term"></div>
    </div>
  </div>

  <script>
    const state = { devices: [], notes: [] };
    let active = null; // {deviceId, sid}
    let termWs = null;

    const term = new Terminal({
      fontSize: parseInt(localStorage.getItem('cheeseFont') || '14', 10),
      lineHeight: 1.1,
      fontFamily: '"JetBrainsMono Nerd Font", "JetBrains Mono", "MesloLGS NF", monospace',
      theme: { background: '#000000', foreground: '#e7e3f0' }, // pure black
      cursorBlink: true,
      // Let programs (Claude's copy) set the system clipboard via OSC 52 — this
      // copies the real text with no wrap-newlines, exactly like Claude's own copy.
      allowProposedApi: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    try { term.loadAddon(new ClipboardAddon.ClipboardAddon()); } catch (e) {}
    term.open(document.getElementById('term'));
    term.writeln('\x1b[90mSelect a device on the left and open a Claude screen.\x1b[0m');

    // Adjustable terminal font size (persisted). Resizing changes the grid, so
    // re-fit and re-sync the size to the real terminal after each change.
    function setFont(n) {
      const size = Math.max(8, Math.min(30, n));
      term.options.fontSize = size;
      localStorage.setItem('cheeseFont', size);
      try { fit.fit(); } catch (e) {}
      sendSize(false);
    }

    // Three viewer modes:
    //   readonly — pure observation (default): no keyboard/scroll. Interact via the
    //              chat box and choice buttons. Reported to the driver as PASSIVE,
    //              so it can reliably sample busy/idle from the live footer.
    //   scroll   — wheel scrolls Claude's history (screen may leave the bottom).
    //   full     — full keyboard + scroll.
    // Only scroll/full are "active" (the screen may be scrolled / changing), so the
    // driver freezes its busy/idle reading then; readonly is passive.
    let viewMode = 'readonly';
    function setMode(m) { viewMode = m; sendSize(false); sendControl(); renderModeBar(); }

    // Tell the driver what the human is doing so it knows when the screen is
    // trustworthy to sample and when to buffer its own commands.
    function controlLevel() {
      return viewMode === 'full' ? 'full' : viewMode === 'scroll' ? 'scroll' : 'passive';
    }
    function sendControl() {
      if (termWs && termWs.readyState === 1)
        termWs.send(JSON.stringify({ type: 'control', level: controlLevel() }));
    }

    const enc = new TextEncoder();
    term.onData(d => {
      if (viewMode !== 'full') return;               // only 'full' types into the program
      if (termWs && termWs.readyState === 1) termWs.send(enc.encode(d));
    });

    // sendSize fits xterm and tells the server our exact size, so the real
    // terminal (a tmux client on a pty) matches what we render — "the frontend
    // is the real terminal". `force` sends even when not interacting, used once on
    // attach to establish the view; otherwise only scroll/full viewers resize.
    function sendSize(force) {
      try { fit.fit(); } catch (e) {}
      if (!force && viewMode === 'readonly') return; // passive read-only doesn't disturb size
      if (termWs && termWs.readyState === 1)
        termWs.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
    window.addEventListener('resize', () => sendSize(false));
    setInterval(() => sendSize(false), 3000);

    // Scrolling. Claude is a full-screen TUI, so xterm has no local scrollback —
    // history lives in Claude, reachable with PgUp/PgDn. Only scroll/full modes
    // may scroll (readonly stays pinned to the live bottom so the driver can
    // sample). Translate the wheel into PgUp/PgDn sent to the program, and report
    // 'scroll' so the driver freezes its reading; after the wheel goes idle,
    // revert to the mode's level (the driver then snaps back to the bottom).
    let scrollIdle = null;
    document.getElementById('term').addEventListener('wheel', (e) => {
      if (viewMode !== 'scroll' && viewMode !== 'full') return;
      if (!termWs || termWs.readyState !== 1) return;
      e.preventDefault();
      e.stopPropagation();               // stop xterm from also acting on the wheel
      const seq = e.deltaY < 0 ? '\x1b[5~' : '\x1b[6~'; // PgUp / PgDn
      termWs.send(enc.encode(seq));      // one page per notch
      termWs.send(JSON.stringify({ type: 'control', level: 'scroll' }));
      clearTimeout(scrollIdle);
      scrollIdle = setTimeout(sendControl, 2000);
    }, { passive: false, capture: true });

    // Dashboard event stream.
    function connectEvents() {
      const ws = new WebSocket(`ws://${location.host}/ui/events`);
      ws.onmessage = ev => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'state') { state.devices = msg.devices; state.notes = msg.notes; render(); }
      };
      ws.onclose = () => setTimeout(connectEvents, 1000);
    }
    connectEvents();

    async function openScreen(deviceId) {
      const r = await fetch(`/ui/devices/${deviceId}/open`, { method: 'POST' });
      if (!r.ok) { alert('could not open screen'); return; }
      const { sid } = await r.json();
      attach(deviceId, sid);
    }

    function attach(deviceId, sid) {
      if (termWs) { termWs.close(); termWs = null; }
      active = { deviceId, sid };
      term.reset();
      termWs = new WebSocket(`ws://${location.host}/ui/screen/${deviceId}/${sid}`);
      termWs.binaryType = 'arraybuffer';
      termWs.onopen = () => setTimeout(() => { sendSize(true); sendControl(); }, 30);
      termWs.onmessage = ev => {
        if (typeof ev.data === 'string') term.write(ev.data);
        else term.write(new Uint8Array(ev.data));
      };
      render();
    }

    function render() {
      // Devices
      const dv = document.getElementById('devices');
      dv.innerHTML = '';
      if (!state.devices.length) dv.innerHTML = '<div id="empty">No devices yet.<br>Run <code>cheese auth login</code>.</div>';
      for (const d of state.devices) {
        const el = document.createElement('div');
        el.className = 'device';
        el.innerHTML = `<div class="name"><span class="dot ${d.online ? 'on' : 'off'}"></span>${escapeHtml(d.name)}</div>`;
        const btn = document.createElement('button');
        btn.textContent = 'Open Claude screen';
        btn.disabled = !d.online;
        btn.onclick = () => openScreen(d.id);
        el.appendChild(btn);
        for (const s of d.screens) {
          const se = document.createElement('div');
          se.className = 'screen' + (active && active.sid === s.sid ? ' active' : '');
          const st = (s.vars && s.vars.status) || '?';
          const meta = (s.vars && s.vars.status === 'busy' && s.vars.elapsed)
            ? ` · ${s.vars.elapsed}${s.vars.tokens ? ' · ' + s.vars.tokens : ''}` : '';
          se.innerHTML = `▸ ${s.sid} <span class="badge ${st}">${st}${escapeHtml(meta)}</span>`;
          se.onclick = () => attach(d.id, s.sid);
          el.appendChild(se);
        }
        dv.appendChild(el);
      }
      const sc = activeScreen();
      renderModeBar();
      // Chat for the active screen, plus Claude's current choice-dialog rendered
      // as clickable options in the message box.
      const ch = document.getElementById('chat');
      let html = ((sc && sc.chat) || []).map(m =>
        `<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('');
      const choices = sc && sc.vars && sc.vars.status === 'waiting' && sc.vars.choices;
      if (choices && choices.length) {
        html += `<div class="msg claude choicebox"><div>${escapeHtml(sc.vars.question || 'Claude is asking:')}</div>` +
          choices.map(c => `<button class="choicebtn" data-n="${c.n}">${c.n}. ${escapeHtml(c.label)}</button>`).join('') +
          `</div>`;
      }
      // Keep the newest chat in view only if the user is already near the bottom,
      // so auto-updates never yank them away while they scroll up.
      const nearBottom = ch.scrollHeight - ch.scrollTop - ch.clientHeight < 80;
      ch.innerHTML = html;
      ch.querySelectorAll('.choicebtn').forEach(b => b.onclick = () => active &&
        fetch(`/ui/screen/${active.deviceId}/${active.sid}/choose`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ n: parseInt(b.dataset.n, 10) }),
        }));
      // Variables for the active screen
      const vv = document.getElementById('vars');
      const screen = activeScreen();
      if (screen && screen.vars) {
        vv.innerHTML = Object.entries(screen.vars)
          .map(([k, v]) => `<div><b>${escapeHtml(k)}</b>: ${escapeHtml(String(v))}</div>`).join('');
      } else vv.textContent = '— open a screen —';
      if (nearBottom) ch.scrollTop = ch.scrollHeight;
    }

    function activeScreen() {
      if (!active) return null;
      const d = state.devices.find(x => x.id === active.deviceId);
      return d && d.screens.find(s => s.sid === active.sid);
    }

    // The mode bar: the three viewer-mode buttons, a compact button, and — only
    // when relevant — the pending decision or compaction progress.
    function renderModeBar() {
      const gb = document.getElementById('gatebar');
      const sc = activeScreen();
      if (!sc) { gb.innerHTML = ''; return; }
      const status = (sc.vars && sc.vars.status) || '?';
      const q = sc.vars && sc.vars.question;
      const modes = [['readonly', '👁 只读'], ['scroll', '📜 滚动'], ['full', '⌨ 交互']];
      const buttons = modes.map(([m, label]) =>
        `<button class="modebtn${viewMode === m ? ' on' : ''}" data-mode="${m}">${label}</button>`).join('');
      const compact = sc.vars && sc.vars.compact;
      const pct = Math.max(0, Math.min(100, (sc.vars && sc.vars.compactPct) || 0));
      let hint = '';
      if (status === 'waiting' && q) hint = `❓ ${escapeHtml(q)}`;
      else if (compact === 'running')
        hint = `<span class="cbar" title="compacting ${pct}%">🗜<span class="ctrack">` +
          `<span class="cfill" style="width:${pct}%"></span></span><b>${pct}%</b></span>`;
      gb.innerHTML = `<span class="modes">${buttons}</span>` +
        `<button class="modebtn" id="compactbtn" title="run Claude's /compact">🗜 compact</button>` +
        `<span class="hint">${hint}</span>` +
        `<span class="fontctl"><button class="modebtn" id="fontminus" title="smaller font">A−</button>` +
        `<button class="modebtn" id="fontplus" title="larger font">A+</button></span>`;
      gb.querySelectorAll('.modebtn[data-mode]').forEach(b =>
        b.onclick = () => setMode(b.dataset.mode));
      const cb = gb.querySelector('#compactbtn');
      if (cb) cb.onclick = () => active &&
        fetch(`/ui/screen/${active.deviceId}/${active.sid}/compact`, { method: 'POST' });
      gb.querySelector('#fontminus').onclick = () => setFont(term.options.fontSize - 1);
      gb.querySelector('#fontplus').onclick = () => setFont(term.options.fontSize + 1);
    }

    document.getElementById('chatform').onsubmit = async (e) => {
      e.preventDefault();
      const inp = document.getElementById('chatinput');
      if (!inp.value.trim() || !active) return;
      await fetch(`/ui/screen/${active.deviceId}/${active.sid}/say`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: inp.value.trim() }),
      });
      inp.value = '';
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
  </script>
</body>
</html>
