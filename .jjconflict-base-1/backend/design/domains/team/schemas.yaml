# Team Domain Schemas

Team:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
    avatarId:
      type: integer
      format: int64
    owner:
      $ref: '../user/schemas.yaml#/User'
    created_at:
      type: integer
      format: int64
    updated_at:
      type: integer
      format: int64
    member_count:
      type: integer
      format: int64
    is_member:
      type: boolean
    is_admin:
      type: boolean
    is_owner:
      type: boolean

TeamMember:
  type: object
  properties:
    user:
      $ref: '../user/schemas.yaml#/User'
    role:
      $ref: '#/TeamRole'
    joined_at:
      type: integer
      format: int64

TeamRole:
  type: string
  enum:
    - OWNER
    - ADMIN
    - MEMBER

ApplicationStatus:
  type: string
  enum:
    - PENDING
    - APPROVED
    - REJECTED

TeamMembershipApplication:
  type: object
  properties:
    id:
      type: integer
      format: int64
    team:
      $ref: '#/Team'
    user:
      $ref: '../user/schemas.yaml#/User'
    status:
      $ref: '#/ApplicationStatus'
    message:
      type: string
    created_at:
      type: integer
      format: int64
    updated_at:
      type: integer
      format: int64

TeamInvitation:
  type: object
  properties:
    id:
      type: integer
      format: int64
    team:
      $ref: '#/Team'
    inviter:
      $ref: '../user/schemas.yaml#/User'
    invitee:
      $ref: '../user/schemas.yaml#/User'
    status:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED]
    created_at:
      type: integer
      format: int64

RecruitmentOpening:
  type: object
  properties:
    id:
      type: integer
      format: int64
    team:
      $ref: '#/Team'
    title:
      type: string
    description:
      type: string
    is_open:
      type: boolean
    created_at:
      type: integer
      format: int64

CreateTeamRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    avatarId:
      type: integer
      format: int64
  required:
    - name

UpdateTeamRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    avatarId:
      type: integer
      format: int64
