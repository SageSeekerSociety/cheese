# What the gateway will route, and how it accounts for it.
#
# This is also the ONE place a model becomes available to people. Cheese keeps
# no list of its own — it reads this one back through /model/info (see
# backend/app/domain/agent/gateway_catalog.py), because a model needs a route
# and a price here before it can be served at all, and a second list over there
# could only ever drift out of step with this one.
#
# Three keys under `model_info` are cheese's, all optional passthrough metadata:
#
#   cheese_selectable: true    offer it in agent settings. OPT-IN, because the
#                              gateway also routes models that are not menu
#                              items: glm-4.5 is where the subagent alias
#                              points, and nobody should be handed a model we
#                              route to on their behalf as though they chose it.
#   cheese_label: "GLM-5.2"    what to call it; the model_name when absent.
#   cheese_tier: premium       which plans may use it (included / premium /
#                              frontier); included when absent.
#   cheese_efforts: [low, high]  the thinking efforts it honours (low / medium
#                              / high / max), offered on a teammate's settings
#                              and passed by Claude Code as output_config.effort.
#                              None when absent: the model's own default.
#   cheese_auto_compact_window: 786432
#                              where Claude Code compacts on this model, when
#                              its provider recommends earlier than the window.
#                              Absent: at the window max_input_tokens declares
#                              (Claude Code is told that window either way).
#   cheese_overseas: true      only teams a platform administrator approved
#                              may use it (Claude, GPT, Gemini); other teams
#                              are not shown it at all.
#   cheese_free: true          its upstream charges nothing, and both token
#                              prices are written as 0 on purpose. The one way
#                              a selectable model may be priced at zero; a
#                              zero without it is a missing price.
#
# Two keys are per deployment, not per model group, for an upstream that wants
# headers of its own (upstream_headers.py). Other rows of the same group, such
# as the pay-per-use API behind a subscription, are sent neither:
#
#   cheese_upstream_headers: {user-agent: cheese-gateway/1.0}
#                              sent as written.
#   cheese_session_header: x-opencode-session
#                              carries the caller's Claude Code session.
#
# Two more belong to the upstream model a deployment calls. A source added
# from the admin page on the same upstream model takes them from a row that
# has them; one on another upstream does not:
#
#   cheese_no_explicit_cache: true
#                              strips Claude Code's cache_control marks, for an
#                              upstream that refuses explicit caching
#                              (no_explicit_cache.py).
#   cheese_spend_cap_usd: 1000 refuses the deployment's calls once its upstream
#                              model has cost this much in all, by the gateway's
#                              own ledger (spend_cap.py).
#
# A selectable model with no price is not offered: a call to it could not be
# charged, which is worse than a model nobody can pick.
#
# Prices are USD, the unit the ledger and every key's budget are in. A provider
# that bills our account in CNY (DeepSeek, Zhipu, Moonshot, Xiaomi) is priced
# from its Chinese price list, converted at RMB 7.1/USD, and the line says so
# with the page and the date it was read; its English USD list is a different
# price for a different account and is not what we pay.
#
# Provider credentials stay in the gateway; callers use project-scoped keys so
# every configured upstream is metered against the same project budget.
model_list:
  - model_name: mimo-v2.6-pro
    litellm_params:
      model: anthropic/mimo-v2.6-pro
      api_base: https://token-plan-cn.xiaomimimo.com/anthropic
      api_key: os.environ/MIMO_TOKEN_PLAN_API_KEY
      # Internal budget estimates use CN API rates (RMB 3 input, 6 output,
      # 0.025 cache read per million), divided by the existing RMB 7.1/USD.
      # This endpoint consumes subscription Credits, not pay-as-you-go balance.
      # https://mimo.mi.com/docs/zh-CN/price/pay-as-you-go
      input_cost_per_token: 0.000000422535
      output_cost_per_token: 0.000000845070
      cache_read_input_token_cost: 0.000000003521
      cache_creation_input_token_cost: 0
    model_info:
      cheese_selectable: true
      cheese_label: MiMo V2.6 Pro
      supports_reasoning: true
      supports_vision: true
      # Measured 2026-10-04: a system-role message in the middle of the
      # conversation is forwarded untouched and the upstream drops it, so
      # Claude Code is launched to put that content in the first user message.
      supports_mid_conversation_system: false

  - model_name: kimi-k3
    litellm_params:
      model: anthropic/kimi-k3
      api_base: https://api.moonshot.cn/anthropic
      api_key: os.environ/MOONSHOT_API_KEY
      # CN rates per million tokens: RMB 20 input, 100 output, 2 cache read,
      # 20 cache write (5m), 40 cache write (1h).
      # https://platform.kimi.com/docs/pricing/chat
      # Budget estimates in USD use the existing RMB 7.1/USD convention.
      input_cost_per_token: 0.000002816902
      output_cost_per_token: 0.000014084508
      cache_read_input_token_cost: 0.000000281691
      cache_creation_input_token_cost: 0.000002816902
      cache_creation_input_token_cost_above_1hr: 0.000005633803
    model_info:
      cheese_selectable: true
      cheese_label: Kimi K3
      cheese_efforts: [low, high, max]
      # K3 always reasons: keep native effort, but omit adaptive thinking.
      supports_output_config: true
      supports_max_reasoning_effort: true
      # Measured 2026-10-14 with gateway_conformance.py on the OpenCode Go row
      # (anthropic/, order 1, added from the admin side): a mid-conversation
      # system message is dropped there. The flag tells Claude Code to fold it
      # into the first user message, which every upstream of the group receives.
      supports_mid_conversation_system: false
  # 芝士's own turns and the agents' Claude Code both speak the Anthropic
  # protocol, so both arrive on /v1/messages and are metered by the same rows.
  - model_name: glm-4.6
    litellm_params:
      # anthropic/, not openai/: the callers speak the Anthropic protocol, and
      # routing that through an openai-prefixed model made LiteLLM translate it
      # into the OpenAI *Responses* API — a path Zhipu does not serve (404 on
      # /v4/responses). Zhipu publishes a native Anthropic endpoint; use it and
      # nothing has to be translated at all.
      model: anthropic/glm-4.6
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/ZHIPU_API_KEY
      # Without a price LiteLLM records tokens at spend=0, and max_budget — the
      # whole brake — never trips. Better an approximate number than none.
      #
      # PROVENANCE: 4.6 has no官方 figure we could read (the pricing page is
      # client-rendered); third-party sources say ~¥5/M tokens. Applied to BOTH
      # directions, which over-states input — deliberately, since for a brake
      # the safe error is to stop early. Confirm against the real invoice in the
      # Zhipu console and correct this; it is an estimate, not a fact.
      # ¥5/M ÷ 7.1 ¥/$ = $0.704/M = 7.04e-7 per token.
      input_cost_per_token: 0.000000704
      output_cost_per_token: 0.000000704

  - model_name: glm-4.5
    litellm_params:
      model: anthropic/glm-4.5
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/ZHIPU_API_KEY
      # 4.5 is the one with a published官方 figure: ¥0.8/M in, ¥2/M out.
      # ÷ 7.1 ¥/$ → $0.1127/M and $0.2817/M.
      input_cost_per_token: 0.0000001127
      output_cost_per_token: 0.0000002817

  - model_name: glm-5.2
    litellm_params:
      model: anthropic/glm-5.2
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/ZHIPU_API_KEY
      # Preserve the deployed budget estimate; Coding Plan quota is separate.
      input_cost_per_token: 0.000003944
      output_cost_per_token: 0.000003944
      cache_read_input_token_cost: 0.0000002817
    model_info:
      cheese_selectable: true
      cheese_label: GLM-5.2
      # Measured 2026-10-14 on the OpenCode Go chat route this group is getting
      # (hosted_vllm/, added from the admin page): a mid-conversation system
      # message is dropped there. The flag tells Claude Code to fold it into the
      # first user message, which every upstream of the group then receives.
      supports_mid_conversation_system: false

  # Speech to text for the composer's voice input. Not a menu item: the
  # backend's voice service calls it with a service key. DashScope serves it
  # only on its native API, so `qwen-asr/` is our handler (`qwen_asr.py`),
  # which reports the audio length as 25 prompt tokens a second.
  # RMB 0.00022 per second (Beijing), 2026-10-18:
  # https://help.aliyun.com/zh/model-studio/model-pricing
  # ÷ 25 tokens ÷ 7.1 RMB/USD = $1.2394e-6 per token.
  # The base URL is the account's own business: a workspace may hand out a
  # dedicated `{WorkspaceId}.cn-beijing.maas.aliyuncs.com`, which only that
  # workspace's key may call. It comes from the environment (compose fills in
  # the shared DashScope domain when unset), so no workspace id is in the repo.
  - model_name: qwen-audio-asr
    litellm_params:
      model: qwen-asr/qwen-audio-3.0-asr-flash
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      input_cost_per_token: 0.0000012394
      output_cost_per_token: 0

  # One model, tried in `order`: RUC's self-hosted copy first, DeepSeek's API
  # when every RUC key fails or is cooling down. RUC admits 3 parallel
  # requests per key and the limits are independent, so each of its keys is a
  # deployment of its own; a 429 on one is retried on another before the
  # request leaves RUC. RUC sends each key to one of its vLLM nodes, and each
  # node has a prompt cache of its own, so a conversation keeps its key
  # (router_settings below) and misses only when it moves: to another key while
  # its own is busy, or to DeepSeek's API. Every
  # row carries the same cheese keys because the catalogue reads whichever
  # row /model/info lists first.
  - model_name: deepseek-flash
    litellm_params: &ruc_deepseek_flash_params
      # anthropic/, not deepseek/: the pinned DeepSeek adapter sends Messages
      # requests to {api_base}/anthropic/v1/messages, DeepSeek's own path. This
      # upstream serves Messages at /v1/messages and answers that path with a
      # 500 after about 130 s. Plain http because that is all it serves.
      model: anthropic/deepseek-flash
      # The endpoint admits campus addresses only; the dev box reaches it
      # through 119pve (docs/infrastructure.md, "Campus model API"). Its
      # address and key are box settings: it is a service of another team,
      # not ours to publish.
      api_base: os.environ/RUC_DEEPSEEK_API_BASE
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_1
      order: 1
      # Used internally without a price of its own. The official rates are the
      # estimate, so the budget brake behaves the same on either backend; that
      # holds only while RUC's cache hits as DeepSeek's does, which needs
      # Claude Code's billing line kept out of the prompt
      # (system_billing_line.py).
      input_cost_per_token: 0.00000028169
      output_cost_per_token: 0.0000011268
      cache_read_input_token_cost: 0.0000000056338
    # Each row merges its own copy: LiteLLM writes the deployment id into
    # model_info, and one mapping shared by alias gives every key the same id,
    # so a 429 on one key cools them all down.
    model_info: &ruc_deepseek_flash_info
      cheese_selectable: true
      # vLLM does not run Anthropic's server tools: asked to search, it answers
      # without searching. Requests carrying web search go to the rows that
      # do (web_search.py). Measured on 2026-10-13: DeepSeek's API searched.
      supports_web_search: false
      cheese_label: DeepSeek V4.1 Flash
      # Accepted here without error; low and high gave the same reasoning
      # length when measured on 2026-10-08, so on this backend they are moot.
      cheese_efforts: [low, high]
      supports_reasoning: true
      supports_vision: true
      # Accepted a 952,366-token prompt on 2026-10-08; same limit as the
      # official route, for the same reason.
      max_input_tokens: 920000
      # DeepSeek's own Claude Code setup compacts here (75% of its 1M window).
      # https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code
      cheese_auto_compact_window: 786432
      # The group's flag, not this row's: OpenCode's free rows drop a
      # mid-conversation system message, and the catalogue reads this row first.
      supports_mid_conversation_system: false
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_2
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_3
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_4
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_5
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_6
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_7
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_8
    model_info:
      <<: *ruc_deepseek_flash_info
  - model_name: deepseek-flash
    litellm_params:
      <<: *ruc_deepseek_flash_params
      api_key: os.environ/RUC_DEEPSEEK_API_KEY_9
    model_info:
      <<: *ruc_deepseek_flash_info

  # DeepSeek's API, last: free supplies added from the admin page sit at order
  # 2. Its alias serves V4.1 Flash 1017 (https://api-docs.deepseek.com/updates/),
  # but RUC's copy lists only undated aliases, so the label names no checkpoint
  # date: a request may be answered by either.
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      order: 3
    model_info:
      cheese_selectable: true
      cheese_label: DeepSeek V4.1 Flash
      cheese_efforts: [low, high]
      # Peak rates of the Chinese price list bound the budget estimate
      # (https://api-docs.deepseek.com/zh-cn/quick_start/pricing, read
      # 2026-10-21; off-peak billing is half): per million tokens ¥2 input,
      # ¥8 output, ¥0.04 cache hit, ÷ 7.1 = $0.28169 / $1.1268 / $0.0056338.
      input_cost_per_token: 0.00000028169
      output_cost_per_token: 0.0000011268
      cache_read_input_token_cost: 0.0000000056338
      # Each search this API runs for Claude Code's WebSearch is billed on its
      # own: ¥5 per 1,000 successful requests on the Chinese list
      # (https://api-docs.deepseek.com/zh-cn/guides/search/, read 2026-10-21),
      # ÷ 7.1 = $0.000704 a search, counted per search by
      # patch_deepseek_search_cost.py. The platform's own searches
      # (search_tools below, deepseek_search.py) cost the same; test_deepseek_search.py
      # holds the two together. LiteLLM reads the medium size; DeepSeek has one
      # price for all three.
      search_context_cost_per_query:
        search_context_size_low: 0.000704
        search_context_size_medium: 0.000704
        search_context_size_high: 0.000704
      # This deployment's alias supports native thinking/effort. Without these
      # capabilities LiteLLM 1.96 drops thinking when Claude Code sends effort.
      supports_reasoning: true
      supports_vision: true
      supports_adaptive_thinking: true
      supports_output_config: true
      supports_mid_conversation_system: false
      # The window Claude Code is told (CLAUDE_CODE_MAX_CONTEXT_TOKENS), and
      # LiteLLM's own figure for this model is 1,000,000. DeepSeek counts the
      # request's max_tokens against its 1,048,576 window, and Claude Code asks
      # for 128,000 on every request, so a conversation past ~920k tokens is
      # refused. 1,048,576 - 128,000, rounded down.
      max_input_tokens: 920000
      cheese_auto_compact_window: 786432

  # Gemini through Google AI Studio. LiteLLM translates Claude Code's Messages
  # requests to Gemini; patch_gemini_generation.py makes it treat gemini-4 as
  # the Gemini 3+ generation, without which tool results fail on a missing
  # thought signature. Measured 2026-10-15 with gateway_conformance.py: text,
  # tool calls, parallel calls, tool results, images in tool results, the
  # mid-conversation system message and the implicit prompt cache (74% on the
  # second request) pass; effort low lets it skip thinking on an easy prompt;
  # a prompt asking to read /etc/hostname is refused by Google's own filter
  # (promptFeedback.blockReason OTHER).
  - model_name: gemini-4-argon
    litellm_params:
      model: gemini/gemini-4-argon
      api_key: os.environ/GEMINI_API_KEY
      # Per million tokens: $2 in, $10 out (thinking included), $0.10 cache
      # read through 2026-11-30; $4 / $20 / $0.20 from 2026-12-01. The later
      # rates, so the brake does not go soft on 12-01.
      # https://ai.google.dev/gemini-api/docs/pricing read 2026-10-15.
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_read_input_token_cost: 0.0000002
    model_info:
      cheese_selectable: true
      cheese_label: Gemini 4 Argon
      cheese_overseas: true
      cheese_efforts: [low, high]
      # 400 "Explicit caching is not supported" on every Claude Code request
      # otherwise; Gemini's implicit cache still applies.
      cheese_no_explicit_cache: true
      # The Google key's lifetime cap, at the prices above (spend_cap.py).
      cheese_spend_cap_usd: 2000
      supports_reasoning: true
      supports_vision: true
      supports_output_config: true

  # Price-only entries: the Claude models served through the platform's
  # subscription (the metering proxy), never through this gateway. Their tokens
  # are billed at these rates when the backend ingests the proxy's usage log,
  # so subscription and gateway traffic are charged by one price table.
  # `blocked: true` makes the router refuse them; no credential is configured.
  # Anthropic's public API prices per million tokens (input, output, cache
  # read, 5-minute cache write, 1-hour cache write),
  # https://platform.claude.com/docs/en/about-claude/pricing read 2026-10-02.
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      # $2 / $10 / $0.20 / $2.50 / $4
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_read_input_token_cost: 0.0000002
      cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_above_1hr: 0.000004
    model_info:
      blocked: true

  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      # $2 / $10 / $0.20 / $2.50 / $4
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_read_input_token_cost: 0.0000002
      cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_above_1hr: 0.000004
    model_info:
      blocked: true

  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      # $5 / $25 / $0.50 / $6.25 / $10
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001
    model_info:
      blocked: true

  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      # $4 / $20 / $0.20 / $5 / $8
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_read_input_token_cost: 0.0000002
      cache_creation_input_token_cost: 0.000005
      cache_creation_input_token_cost_above_1hr: 0.000008
    model_info:
      blocked: true

  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      # $5 / $25 / $0.50 / $6.25 / $10
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001
    model_info:
      blocked: true

  - model_name: claude-fable-5
    litellm_params:
      model: anthropic/claude-fable-5
      # $10 / $50 / $1 / $12.50 / $20
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00005
      cache_read_input_token_cost: 0.000001
      cache_creation_input_token_cost: 0.0000125
      cache_creation_input_token_cost_above_1hr: 0.00002
    model_info:
      blocked: true

  - model_name: claude-fable-5-1
    litellm_params:
      model: anthropic/claude-fable-5-1
      # $10 / $50 / $0.25 / $12.50 / $20
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00005
      cache_read_input_token_cost: 0.00000025
      cache_creation_input_token_cost: 0.0000125
      cache_creation_input_token_cost_above_1hr: 0.00002
    model_info:
      blocked: true

  # Claude Code's own small requests on the subscription stay on Haiku.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      # $1 / $5 / $0.10 / $1.25 / $2
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      cache_read_input_token_cost: 0.0000001
      cache_creation_input_token_cost: 0.00000125
      cache_creation_input_token_cost_above_1hr: 0.000002
    model_info:
      blocked: true

# The platform's own web search (backend `/web-search`, the agents'
# `cheese_web_search`), asked on the caller's virtual key at
# /v1/search/deepseek-search, so it is admitted, logged and drained like that
# key's model calls. DeepSeek's search API as a provider: deepseek_search.py.
search_tools:
  - search_tool_name: deepseek-search
    litellm_params:
      search_provider: deepseek
      api_key: os.environ/DEEPSEEK_API_KEY
      # LiteLLM's default is 6000 s, so a stalled DeepSeek connection would hold
      # the request until the ingress cut it at 30 min. DeepSeek answers in a
      # second or two; the backend gives up after 15 s anyway.
      timeout: 15

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # The budget brake reads each key's spend from a counter. Without a Redis the
  # counter lives in process memory, where a cold start seeds it by ADDING the
  # DB spend while another path SETS it to that spend, so the two together
  # double it: a key read 9.97 against 4.99 actually spent and refused calls
  # for the counter's whole 600 s life. With Redis the seed is SET NX and the
  # repair is a monotonic max, so neither can stack on the other.
  coordination_redis:
    host: litellm-redis
    port: 6379

router_settings:
  # A conversation, named by Claude Code's session header, stays on the
  # deployment it first used, so it keeps hitting one RUC node's prompt cache.
  # A busy or cooling key moves it to another, where it stays; a request that
  # falls over to DeepSeek's API does not pin it there.
  model_group_affinity_config:
    deepseek-flash: [session_affinity]

litellm_settings:
  # The whole point: a row per call. LiteLLM sums those rows into daily totals
  # per key and model, which the backend drains into resource_usage. Without
  # this the gateway would route traffic and still tell us nothing.
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  # Requests routed to ChatGPT carry the Claude Code session as `session_id`,
  # which is what keeps a conversation on one Codex machine and its prompt
  # cache hitting (#2597, `chatgpt_session.py`).
  # Upstreams that are not Anthropic get requests without Claude Code's
  # billing line, whose per-request hash otherwise defeats their prefix cache
  # (`system_billing_line.py`).
  # An image no model can decode is replaced by a line saying so, since one
  # such image fails every later request of its conversation (`image_guard.py`).
  # A deployment that declares cheese_upstream_headers or cheese_session_header
  # is sent them (`upstream_headers.py`), and one that declares
  # cheese_no_explicit_cache loses its cache_control marks
  # (`no_explicit_cache.py`), and one that declares cheese_spend_cap_usd is
  # refused past that total (`spend_cap.py`).
  # A request carrying web search goes to a deployment that runs it, and an
  # answer that did not search reaches the client as an error, not as a
  # search that found nothing (`web_search.py`).
  callbacks:
    - cheese_chatgpt_session.handler
    - cheese_billing_line.handler
    - cheese_image_guard.handler
    - cheese_upstream_headers.handler
    - cheese_no_explicit_cache.handler
    - cheese_spend_cap.handler
    - cheese_web_search.handler
  # Providers LiteLLM has no route for, served by a handler of ours behind the
  # chat API (`qwen_asr.py`).
  custom_provider_map:
    - provider: qwen-asr
      custom_handler: cheese_qwen_asr.handler
  # Keep a failed upstream from looking like a gateway bug in the logs.
  drop_params: true
