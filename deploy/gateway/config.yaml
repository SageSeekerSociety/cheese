# What the gateway will route, and how it accounts for it.
#
# Every model here is one this deployment already uses directly today; pointing
# the callers at the gateway instead is what makes their spend visible. Nothing
# new is introduced — the upstreams and keys are the same.
model_list:
  # 芝士's own turns and the agents' Claude Code both speak the Anthropic
  # protocol, so both arrive on /v1/messages and are metered by the same rows.
  - model_name: glm-4.6
    litellm_params:
      # anthropic/, not openai/: the callers speak the Anthropic protocol, and
      # routing that through an openai-prefixed model made LiteLLM translate it
      # into the OpenAI *Responses* API — a path Zhipu does not serve (404 on
      # /v4/responses). Zhipu publishes a native Anthropic endpoint; use it and
      # nothing has to be translated at all.
      model: anthropic/glm-4.6
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/ZHIPU_API_KEY
      # Priced from the ACTUAL invoice, not an estimate. The first version of
      # this file guessed ~¥5/M from third-party sources for glm-4.6; the bill
      # shows the traffic is glm-5.2 at ¥0.028/千token input and ¥0.002/千token
      # for a cache read. That is an order of magnitude out, and a budget brake
      # computed from the wrong price is not a brake.
      # ¥0.028/1k ÷ 7.1 ¥/$ = $3.944e-6 per token.
      input_cost_per_token: 0.000003944
      output_cost_per_token: 0.000003944
      # Cache reads are NOT free here and they dominate: one document-writing
      # task read 2.9M cached tokens against 141k of fresh input — 20x — and
      # accounted for half its cost. ¥0.002/1k ÷ 7.1 = $2.817e-7.
      cache_read_input_token_cost: 0.0000002817

  - model_name: glm-5.2
    litellm_params:
      model: anthropic/glm-5.2
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/ZHIPU_API_KEY
      input_cost_per_token: 0.000003944
      output_cost_per_token: 0.000003944
      cache_read_input_token_cost: 0.0000002817

  - model_name: glm-4.5
    litellm_params:
      model: anthropic/glm-4.5
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/ZHIPU_API_KEY
      # 4.5 is the one with a published官方 figure: ¥0.8/M in, ¥2/M out.
      # ÷ 7.1 ¥/$ → $0.1127/M and $0.2817/M.
      input_cost_per_token: 0.0000001127
      output_cost_per_token: 0.0000002817

  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # The whole point: a row per call, which is what /spend/logs reads back and
  # what the backend drains into resource_usage. Without this the gateway would
  # route traffic and still tell us nothing.
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  # Keep a failed upstream from looking like a gateway bug in the logs.
  drop_params: true
