# Unified app-tier stack — backend + frontend, deploy-by-sha.
#
# This is the SHARED core for every environment. On its own it is the dev/prod
# (RUC) shape: the stateless app tier only, connecting to an EXTERNAL Postgres
# and Redis via the box's own backend/.env (DATABASE_URL / REDIS_URL) — the
# standard "hybrid" pattern (containerize the app, keep the stateful DB external).
#
# etrip layers docker-compose.etrip.yml on top to ADD its in-container postgres +
# valkey and the agent sandbox wiring. See deploy/deploy-docker.sh.
#
# Images are pinned by commit sha via IMAGE_TAG (build.yml builds one set per
# commit). The frontend image bundles nginx and reverse-proxies /api + /uploads
# to `backend` (compose service name), so no separate/host nginx is needed.
services:
  # Owns machine and terminal WebSockets. deploy-docker.sh starts this service
  # once and deliberately leaves it alone during app-tier releases, so a backend
  # image swap cannot close a device link or cancel an in-flight executor call.
  device-connection:
    image: ${DEVICE_CONNECTION_IMAGE:-ghcr.io/sageseekersociety/cheese/backend:${IMAGE_TAG:-main}}
    env_file:
      - ${BACKEND_ENV_FILE:-/home/nictheboy/cheese-backend-py/backend/.env}
    environment:
      - DEVICE_CONNECTION_URL=
      - DEVICE_CONNECTION_OWNER=1
      - DEPLOYED_VIA_COMPOSE=1
    command:
      - uvicorn
      - app.device_connection_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8082"
    ports:
      - "127.0.0.1:${DEVICE_CONNECTION_PORT:-18083}:8082"
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  backend:
    labels:
      li.zhifei.cheese.room-cleanup: "true"
    # Default is the current-path image by sha. Override BACKEND_IMAGE for an env
    # pinned to a different release/path — e.g. prod (RUC) runs the v0.16.4 release,
    # whose image is under the pre-rename path `cheese-backend-py/*`. prod deploys
    # RELEASES (not main commits), so it stays on its release image until the next.
    image: ${BACKEND_IMAGE:-ghcr.io/sageseekersociety/cheese/backend:${IMAGE_TAG:-main}}
    env_file:
      - ${BACKEND_ENV_FILE:-/home/nictheboy/cheese-backend-py/backend/.env}
    environment:
      # "Started by this compose file" — asserted as a LITERAL, on purpose (#439).
      # The boot guard that refuses an insecure JWT_SECRET has to know it is on a
      # deployment, and it cannot learn that from ENVIRONMENT: that variable lives
      # in the env_file above, alongside JWT_SECRET, so the one failure the guard
      # exists for (the env file not applying, #342/#356) removes both at once and
      # the guard waves itself through. Anything interpolated here would inherit
      # the same weakness, so this must stay a constant with no ${...} in it.
      - DEPLOYED_VIA_COMPOSE=1
      - DEVICE_CONNECTION_URL=http://device-connection:8082
      # Uploads live OUTSIDE any release/image, on a host path bind-mounted below,
      # so deploys never touch them (the 赛题 PDFs on prod).
      - STORAGE_LOCAL_PATH=/data/uploads
      # The image's app user has HOME=/nonexistent; git needs a writable,
      # PERSISTENT home. Backed by a host path so its global config and the
      # repo-trust records survive redeploys.
      - HOME=/data/apphome
      # Memory (#187). On MEMORY_BACKEND=openviking the whole memory tree —
      # AGFS files AND the vector index — lives under this directory and
      # nowhere else: no Postgres row, no image layer. Unmounted it is
      # container-local, so every deploy would start the platform amnesiac.
      # Set here rather than in backend/.env because the value is a CONTAINER
      # path that only makes sense together with the bind mount below.
      - OPENVIKING_DATA_DIR=/data/viking
      # Preserve earlier tar archives and their additive R2 mirror. New raw
      # transcript increments go directly to the private TRANSCRIPT_S3_BUCKET.
      - TRANSCRIPTS_DIR=/data/transcripts
      # Agent containers are siblings spawned through docker.sock, not compose
      # services. Pin them to this deployment's sha so a floating/local alias
      # cannot disappear or drift independently of the backend.
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ghcr.io/sageseekersociety/cheese/sandbox:${IMAGE_TAG:-main}}
      - QUALITY_GATE_IMAGE=${QUALITY_GATE_IMAGE:-ghcr.io/sageseekersociety/cheese/sandbox:${IMAGE_TAG:-main}}
    volumes:
      - ${UPLOADS_HOST_PATH:-/home/nictheboy/shared/uploads}:/data/uploads
      # Platform workspaces (project git repos / topic worktrees / sessions)
      # must OUTLIVE container recreations — without this bind every deploy
      # erased them (they lived in the container FS). Required for the fused
      # platform features (topics/芝士).
      - ${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}:/app/.workspaces
      - ${APPHOME_HOST_PATH:-/home/nictheboy/cheese-app-home}:/data/apphome
      # Everything the openviking memory backend remembers. Mounted
      # unconditionally: on MEMORY_BACKEND=db the directory just stays empty,
      # and having it already in place is what makes flipping the backend a
      # one-line env change instead of a deploy edit.
      - ${VIKING_HOST_PATH:-/home/nictheboy/cheese-viking}:/data/viking
      # The transcript archives (TRANSCRIPTS_DIR above). Mounted so they
      # outlive the container alongside their off-site backup.
      - ${TRANSCRIPTS_HOST_PATH:-/home/nictheboy/cheese-transcripts}:/data/transcripts
      # The claude binaries the backend serves to machines it enrols. It fetches
      # each version once from the vendor and caches it under connector-dist,
      # which is image content — so every deploy threw the cache away and the
      # next enrolment re-downloaded ~40MB inside its own timeout (a dev box
      # deploys many times a day, so in practice every enrolment paid).
      - ${CLAUDE_CACHE_HOST_PATH:-/home/nictheboy/cheese-claude-cache}:/app/connector-dist/claude-cache
      # The pi builds, cached for exactly the same reason and thrown away by
      # exactly the same deploy — and this archive is ~40MB per platform too.
      - ${PI_CACHE_HOST_PATH:-/home/nictheboy/cheese-pi-cache}:/app/connector-dist/pi-cache
    # Bind 0.0.0.0, NOT 127.0.0.1: the ghg edge (APISIX) reaches these boxes from
    # a SEPARATE host (192.168.16.13) and proxies straight to the backend on :8081
    # and the frontend on :8080 — a localhost-only bind would be unreachable from
    # it. Safe here because dev/prod are on the private ghg net with no public
    # inbound. (etrip is public and uses its OWN compose, not this one.)
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8081}:8081"
    # tini as PID 1, so orphans get reaped. The git the backend runs is waited on,
    # but git's own children outlive it and reparent to PID 1 — and uvicorn never
    # waits on a process it did not start. Without this they pile up as zombies:
    # 77 `git` after 17 hours on dev (2026-09-01). They cost PIDs, not fds.
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 8s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    logging:
      # journald, not json-file. A json-file log lives inside the container's
      # own directory, so the `down` half of a deploy deletes it — and a deploy
      # is precisely when turns die. That circularity has a measured cost: on
      # 2026-08-18, 257 turn failures went unclassified (#574) and their
      # tracebacks could not be read back, because the deploy that caused them
      # had removed the only copy. A failure whose evidence is destroyed by its
      # own trigger cannot be diagnosed at all.
      #
      # journald writes to the HOST journal, so the lines outlive the container
      # that produced them. `docker logs` still works exactly as before; a dead
      # container is read with `journalctl CONTAINER_NAME=cheese-backend-1`
      # (needs sudo or membership of systemd-journal).
      driver: journald
      options:
        # Without this, every line is prefixed with the container's short id,
        # which is different after each deploy and reads as noise. The name is
        # stable and is what anyone searching already knows.
        tag: "{{.Name}}"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/sageseekersociety/cheese/frontend:${IMAGE_TAG:-main}}
    # No env_file. It used to load the BACKEND's, which handed this container the
    # database password, the JWT secret, the model provider key and the MicroCloud
    # tenant secret — 18 secrets in total, into the one container that publishes a
    # port to the world. It supplied nothing in return: the box's env file defines
    # no VITE_* at all (checked on dev), and every value this image needs is
    # declared below.
    #
    # If a box overrides VITE_CONNECTOR_WS_BASE, it belongs in the deploy shell
    # env (ops/deploy.env), which is where compose interpolation reads it — NOT in
    # backend/.env.
    # CRITICAL: the frontend image bakes __VITE_*__ placeholders that its
    # entrypoint substitutes from THESE env vars at container start. If unset,
    # the API base becomes an EMPTY string and the SPA posts to /users/... at
    # the site root instead of /api/... — every API call 405s at the static
    # server and the whole app breaks in real browsers (while curl probes that
    # hand-add /api still pass). This exact failure took prod down on 2026-07-17.
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_NEW_API_BASE_URL=${VITE_NEW_API_BASE_URL:-/api}
      - VITE_AI_API_BASE_URL=${VITE_AI_API_BASE_URL:-/api}
      # prod (RUC) needs its WS-edge override (https://119pve.ghg.org.cn) because
      # the cheese.ruc.edu.cn edge strips WebSocket Upgrade; set per box.
      - VITE_CONNECTOR_WS_BASE=${VITE_CONNECTOR_WS_BASE:-}
      # Where this nginx forwards /api and /connector. The default is the
      # compose backend. A box that deploys without downtime sets it (in
      # ops/deploy.env) to host.docker.internal:8081, the host nginx that
      # deploy-docker.sh moves between backends during a rollout.
      - API_UPSTREAM=${API_UPSTREAM:-backend:8081}
      - DEVICE_CONNECTION_UPSTREAM=${DEVICE_CONNECTION_UPSTREAM:-device-connection:8082}
    # Lets API_UPSTREAM name the host; unused otherwise.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The ghg edge proxies the SPA to the box on :8080; also publish :80 so direct
    # in-net access and any :80 probe keep working (bare-metal exposed both). Both
    # are overridable so a parallel validation run can use alt ports without
    # colliding with a still-running bare-metal nginx on :80.
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:80"
      - "${FRONTEND_PORT_DIRECT:-0.0.0.0:80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/check-static-assets /usr/share/nginx/html >/dev/null &&
          curl -fsS http://127.0.0.1:80/ >/dev/null
      interval: 15s
      timeout: 8s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    logging:
      # Same reason as the backend above: a deploy must not delete the record
      # of what happened before it.
      driver: journald
      options:
        tag: "{{.Name}}"

  # One browser for the box, shared by every topic's fetches.
  #
  # It belongs in this file rather than a compose of its own because it now has
  # to survive the same events the platform survives. Run by hand it was fine
  # until the first full redeploy, and its failure mode is silent: fetching
  # falls back a rung and coverage drops from 19-of-20 real sites to 17,
  # with nothing in any log to say why.
  #
  # Measured: one shared instance served six concurrent pages in 4.7s where a
  # browser per caller took 9.5s for three, and Chrome is installed once here
  # instead of once per topic home (185MB each).
  browser-render:
    image: ${BROWSER_RENDER_IMAGE:-ghcr.io/sageseekersociety/cheese/browser-render:${IMAGE_TAG:-main}}
    container_name: cheese-browser-render
    # Chromium writes to /dev/shm, and Docker's 64MB default is where headless
    # Chrome starts crashing on real pages. This is the single most common way
    # a working browser container turns flaky under load.
    shm_size: "1gb"
    environment:
      # Playwright does NOT read this on its own; the service hands it to the
      # browser explicitly. Named here so a box behind a proxy can set it —
      # and so nobody inherits a sandbox's own 127.0.0.1 tunnel by accident,
      # which points at the container itself and reaches nothing.
      - HTTPS_PROXY=${BROWSER_RENDER_PROXY:-}
      - RENDER_MAX_CONCURRENT=${BROWSER_RENDER_CONCURRENCY:-6}
    # A browser is the one process here that will happily eat the box. Six
    # concurrent pages measured healthy; these bounds make a burst queue
    # instead of swap.
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/healthz', timeout=3)
      interval: 30s
      timeout: 8s
      # Chromium's first launch is slow; failing the check before then would
      # restart it into the same cold start forever.
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
