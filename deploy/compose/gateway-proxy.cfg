# The gateway's front door: what callers reach as 172.17.0.1:4000 and
# http://litellm:4000. Two LiteLLM instances stand behind it, litellm-blue and
# litellm-green; outside a release one of them runs. A release starts the
# other with the new image and moves traffic to it through the runtime API
# below (deploy/release-gateway.sh), without restarting this process: a restart
# would close every idle keep-alive connection callers hold to it, and the
# metering proxy sends its next request on such a connection without noticing
# the close, which fails that request (#3640).
#
# This file runs in gateway-proxy-a or gateway-proxy-b, both inside
# gateway-netns's network namespace. A change to this file or to the proxy's
# image starts the other one beside the running one; both listen on :4000
# (SO_REUSEPORT, HAProxy's default), and the old one is then soft-stopped.
global
  # Runtime API. A path in this container's own filesystem, so the two proxies
  # sharing one network namespace each have their own.
  stats socket /tmp/gateway-proxy.sock mode 600 level admin
  maxconn 20000
  # A soft-stopped proxy keeps serving what it has; this bounds how long. Above
  # the release's drain cap (30 min) and the stream timeouts below.
  hard-stop-after 35m
  # Written by the release from the running proxy just before it starts the
  # other one, so the new process begins with the colors as they are (up or
  # down, ready or draining) instead of all down (init-state below), which would
  # refuse every request until its first check.
  server-state-file /var/lib/gateway-proxy/servers.state

defaults
  mode http
  load-server-state-from-file global
  log stdout format raw local0 err
  option http-no-delay
  timeout connect 5s
  # A request or response may sit silent while a model thinks; a stream that
  # has said nothing for this long is dead anyway. The release's drain cap
  # (GATEWAY_DRAIN_SECONDS) is the same length.
  timeout client 30m
  timeout server 30m
  # Idle keep-alive connections from callers stay open as long as the gateway
  # itself keeps them (KEEPALIVE_TIMEOUT in deploy/gateway/Dockerfile): the
  # metering proxy reuses its connection after idling up to 195 s, and a close
  # it races fails that request (#3640).
  timeout http-keep-alive 600s
  timeout http-request 60s
  # A soft-stopped proxy keeps callers' idle connections instead of closing
  # them, serves the next request on each and answers it Connection: close.
  option idle-close-on-response
  # Only a connection a color refused or never accepted is tried again, on the
  # other color. Never a request a color may have started: by then LiteLLM may
  # have called the provider, and a second attempt would be billed twice.
  retry-on conn-failure
  retries 2
  option redispatch 1

frontend gateway
  bind :4000
  default_backend litellm

backend litellm
  # Every request is placed on its own, so the next request on a caller's
  # existing keep-alive connection goes to the color that serves now.
  balance roundrobin
  # Liveliness, not readiness: readiness fails while the gateway database is
  # out of reach, which would take both colors out at once.
  option httpchk GET /health/liveliness
  http-check expect status 200
  # Fixed addresses from the compose file, never names: Docker's DNS hands a
  # name it does not know to the host's resolver, which on the dev box answers
  # every name with an address (198.18.x), so a stopped color's name would
  # still resolve and requests would go wherever that address leads.
  # A color counts as down until its first check passes, so a proxy that
  # starts with no state file sends nothing to a color that is not running.
  default-server check inter 2s fall 3 rise 2 init-state down
  server litellm-blue "${GATEWAY_BLUE_ADDR}:4000"
  server litellm-green "${GATEWAY_GREEN_ADDR}:4000"
