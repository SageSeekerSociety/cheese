# The LLM gateway — a stack of its own, deliberately not part of the app deploy.
#
# Why separate: deploy-docker.sh takes ONE compose file and brings up exactly
# `backend frontend`, and that file is shared with prod. Adding a service there
# would push the gateway onto prod without asking and still not start it. This
# stack is brought up once per box and then left alone; app deploys never touch
# it, and a gateway restart never restarts the app.
#
# Released independently by the Release gateway workflow.
#
# What it buys (docs in backend/app/domain/agent/gateway.py):
#   - real per-project token accounting, which the hooks backends cannot produce
#     locally (interactive Claude Code reports no usage);
#   - a per-project virtual key, so a sandbox never holds the upstream key;
#   - a budget brake (max_budget) that refuses calls once a grant is spent.
services:
  litellm:
    # The Dockerfile pins the upstream digest and verifies the patched file hash.
    image: ${GATEWAY_IMAGE:?set the CI-built gateway image}
    restart: unless-stopped
    # journald, for the reason the app containers use it
    # (docs/infrastructure.md, "Logs"): every release recreates this
    # container, and a json-file log goes with the container it belonged to.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    environment:
      # Admin credential. The backend holds the same value as
      # LLM_GATEWAY_ADMIN_KEY and mints per-project virtual keys with it.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      # Upstreams. Referenced by the model list in config.yaml.
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:?set ZHIPU_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - RUC_DEEPSEEK_API_BASE=${RUC_DEEPSEEK_API_BASE:-}
      - RUC_DEEPSEEK_API_KEY=${RUC_DEEPSEEK_API_KEY:-}
      - MIMO_TOKEN_PLAN_API_KEY=${MIMO_TOKEN_PLAN_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:?set MOONSHOT_API_KEY}
      - STORE_MODEL_IN_DB=True
    volumes:
      - ${GATEWAY_CONFIG:?set the release configuration path}:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # The docker0 bridge address, NOT 0.0.0.0 and NOT loopback. Sandbox
      # containers are created by the backend on the default bridge, so they
      # cannot use the app network alias; loopback is unreachable from any
      # container. Binding the bridge address reaches every container on the box
      # while staying off the LAN, which matters because this port carries the
      # upstream keys and the admin API.
      - "172.17.0.1:4000:4000"
    networks:
      # Its own network for the database, plus the app's, so the backend reaches
      # it by name. No published port at all: a host binding is either on
      # loopback (which containers cannot reach — the app is on its own bridge)
      # or on the bridge address (which exposes the upstream keys and the admin
      # API to the box's LAN). Joining the network removes the choice.
      - default
      - app
      # The metering proxy's ChatGPT listener, http://metering-proxy:8445, is
      # reachable only here: an internal network with the proxy and this
      # container on it.
      - meter-gateway
    healthcheck:
      # This image has Python at this exact path but no curl/wget. A probe whose
      # executable is absent reports the live gateway as unhealthy forever.
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read()
      interval: 15s
      timeout: 8s
      retries: 10

  litellm-db:
    # Its own database rather than a schema in the app's: LiteLLM runs its own
    # migrations, and a gateway upgrade must never be able to touch cheese's data.
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm-redis:
    # The budget brake's spend counters (general_settings.coordination_redis in
    # deploy/gateway/config.yaml). Every value in it is reseeded from
    # litellm-db when missing, so nothing is persisted: a snapshot reloaded
    # after a restart would hand back counters lower than what was spent.
    # Only on this stack's default network, so nothing but the gateway reaches it.
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  # Created by the app stack (compose project `cheese`); referenced, never owned.
  app:
    external: true
    name: cheese_default
  # Shared with the metering proxy's stack; each release creates it if missing
  # (deploy/metering-proxy/compose.yml says why neither stack owns it).
  meter-gateway:
    external: true
    name: cheese-meter-gateway

volumes:
  litellm-pgdata:
