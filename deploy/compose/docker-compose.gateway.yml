# The LLM gateway — a stack of its own, deliberately not part of the app deploy.
#
# Why separate: deploy-docker.sh takes ONE compose file and brings up exactly
# `backend frontend`, and that file is shared with prod. Adding a service there
# would push the gateway onto prod without asking and still not start it. This
# stack is brought up once per box and then left alone; app deploys never touch
# it, and a gateway restart never restarts the app.
#
# Released independently by the Release gateway workflow, without dropping a
# request: callers reach the address `gateway-netns` owns, where a proxy
# (`gateway-proxy-a` or `-b`) sends them to one of two LiteLLM instances
# (`litellm-blue`, `litellm-green`). A release starts the idle instance on the
# new image, moves traffic to it and stops the other once its streams have
# ended; a proxy change starts the idle proxy beside the running one
# (deploy/release-gateway.sh). Outside a release one of each runs.
#
# What it buys (docs in backend/app/domain/agent/gateway.py):
#   - real per-project token accounting, which the hooks backends cannot produce
#     locally (interactive Claude Code reports no usage);
#   - a per-project virtual key, so a sandbox never holds the upstream key;
#   - a budget brake (max_budget) that refuses calls once a grant is spent.
services:
  gateway-netns:
    # Owns the gateway's address and nothing else: the published port, the
    # `litellm` alias, the address on `colors`. The proxies run inside its
    # network namespace, so replacing a proxy leaves the address, and every
    # connection the other proxy still carries, where they are. A release never
    # recreates it; a change here cuts every open stream.
    image: mirror.gcr.io/library/busybox:1.37.0
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep 2147483647 & wait"]
    restart: unless-stopped
    sysctls:
      # When a proxy is soft-stopped, connections already queued on its
      # listener move to the other proxy's listener instead of being reset.
      net.ipv4.tcp_migrate_req: "1"
    ports:
      # The docker0 bridge address, NOT 0.0.0.0 and NOT loopback. Sandbox
      # containers are created by the backend on the default bridge, so they
      # cannot use the app network alias; loopback is unreachable from any
      # container. Binding the bridge address reaches every container on the box
      # while staying off the LAN, which matters because this port carries the
      # admin API and spends the upstream keys.
      - "172.17.0.1:4000:4000"
    networks:
      # Its published port.
      default:
      colors:
        ipv4_address: 10.213.47.4
      # The app's network, so the backend reaches the gateway as
      # http://litellm:4000 (LLM_GATEWAY_ADMIN_BASE).
      app:
        aliases:
          - litellm

  gateway-proxy-a: &gateway-proxy
    image: mirror.gcr.io/library/haproxy:3.2.25-alpine
    restart: unless-stopped
    network_mode: service:gateway-netns
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    environment:
      # gateway-proxy.cfg reads the colors' addresses from these.
      - GATEWAY_BLUE_ADDR=10.213.47.2
      - GATEWAY_GREEN_ADDR=10.213.47.3
    volumes:
      # A directory, not the file: the release replaces haproxy.cfg in it by
      # rename (deploy/compose/gateway-proxy.cfg), and a file mount would keep
      # showing the old one.
      - ${GATEWAY_PROXY_DIR:?set the proxy configuration directory}:/usr/local/etc/haproxy:ro
      # The colors' states, written by the release before it starts a proxy.
      - ${GATEWAY_PROXY_STATE_DIR:?set the proxy state directory}:/var/lib/gateway-proxy:ro
    healthcheck:
      # Healthy only while a color answers through it: what callers get.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Checked every second while it starts, so a release waiting for it is
      # not held up by the 15 s interval.
      start_period: 60s
      start_interval: 1s

  gateway-proxy-b: *gateway-proxy

  litellm-blue: &litellm
    # The Dockerfile pins the upstream digest and verifies the patched file hash.
    # One variable for both colors: a release only ever starts the idle one.
    image: ${GATEWAY_IMAGE:?set the CI-built gateway image}
    restart: unless-stopped
    # journald, for the reason the app containers use it
    # (docs/infrastructure.md, "Logs"): every release recreates a color, and a
    # json-file log goes with the container it belonged to.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    environment:
      # Admin credential. The backend holds the same value as
      # LLM_GATEWAY_ADMIN_KEY and mints per-project virtual keys with it.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      # Upstreams. Referenced by the model list in config.yaml.
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:?set ZHIPU_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - RUC_DEEPSEEK_API_BASE=${RUC_DEEPSEEK_API_BASE:-}
      - RUC_DEEPSEEK_API_KEY_1=${RUC_DEEPSEEK_API_KEY_1:-}
      - RUC_DEEPSEEK_API_KEY_2=${RUC_DEEPSEEK_API_KEY_2:-}
      - RUC_DEEPSEEK_API_KEY_3=${RUC_DEEPSEEK_API_KEY_3:-}
      - RUC_DEEPSEEK_API_KEY_4=${RUC_DEEPSEEK_API_KEY_4:-}
      - RUC_DEEPSEEK_API_KEY_5=${RUC_DEEPSEEK_API_KEY_5:-}
      - RUC_DEEPSEEK_API_KEY_6=${RUC_DEEPSEEK_API_KEY_6:-}
      - RUC_DEEPSEEK_API_KEY_7=${RUC_DEEPSEEK_API_KEY_7:-}
      - RUC_DEEPSEEK_API_KEY_8=${RUC_DEEPSEEK_API_KEY_8:-}
      - RUC_DEEPSEEK_API_KEY_9=${RUC_DEEPSEEK_API_KEY_9:-}
      - MIMO_TOKEN_PLAN_API_KEY=${MIMO_TOKEN_PLAN_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:?set MOONSHOT_API_KEY}
      - STORE_MODEL_IN_DB=True
    volumes:
      - ${GATEWAY_CONFIG:?set the release configuration path}:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # A color is stopped only after the proxy has sent it nothing for the whole
    # drain, so what remains on SIGTERM is LiteLLM writing its queued spend
    # counters and spend logs to the database. Docker's 10 s default would
    # SIGKILL a slow flush and lose that spend.
    stop_grace_period: 60s
    networks: &litellm-networks
      # The database, the Redis and the way out to the upstreams. No published
      # port and not on the app network: callers reach the gateway only
      # through the proxy.
      default:
      # The metering proxy's ChatGPT listener, http://metering-proxy:8445, is
      # reachable only here: an internal network with the proxy and this
      # container on it.
      meter-gateway:
      colors:
        ipv4_address: 10.213.47.2
    healthcheck:
      # This image has Python at this exact path but no curl/wget. A probe whose
      # executable is absent reports the live gateway as unhealthy forever.
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read()
      interval: 15s
      timeout: 8s
      retries: 10

  litellm-green:
    <<: *litellm
    networks:
      <<: *litellm-networks
      colors:
        ipv4_address: 10.213.47.3

  litellm-db:
    # Its own database rather than a schema in the app's: LiteLLM runs its own
    # migrations, and a gateway upgrade must never be able to touch cheese's data.
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm-redis:
    # The budget brake's spend counters (general_settings.coordination_redis in
    # deploy/gateway/config.yaml). Every value in it is reseeded from
    # litellm-db when missing, so nothing is persisted: a snapshot reloaded
    # after a restart would hand back counters lower than what was spent.
    # Only on this stack's default network, so nothing but the gateway reaches it.
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  # Where the proxy reaches the colors, at addresses fixed here rather than
  # by name (gateway-proxy.cfg says why). Internal: the colors reach the
  # upstreams through `default`. The subnet is outside Docker's default pools
  # (172.17-31.0.0/16, 192.168.0.0/16), so no network the box creates takes it.
  colors:
    internal: true
    ipam:
      config:
        - subnet: 10.213.47.0/28
  # Created by the app stack (compose project `cheese`); referenced, never owned.
  app:
    external: true
    name: cheese_default
  # Shared with the metering proxy's stack; each release creates it if missing
  # (deploy/metering-proxy/compose.yml says why neither stack owns it).
  meter-gateway:
    external: true
    name: cheese-meter-gateway

volumes:
  litellm-pgdata:
