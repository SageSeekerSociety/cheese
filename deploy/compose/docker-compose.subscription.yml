# Subscription overlay — lets a box run agent turns on a Claude subscription
# through the on-box metering proxy. Layered on top of docker-compose.base.yml
# via COMPOSE_OVERLAYS (set in the box-local ops/deploy.env); a box that does not
# set it — e.g. prod (RUC) — is completely unaffected.
#
# Why this cannot be an env file: the box's backend/.env names WORKSPACE_ROOT as
# a HOST path, while the base compose mounts the workspace tree only at
# /app/.workspaces. The backend and the preview owner read the tree at
# WORKSPACE_ROOT, so this mounts it at that same absolute path too, and it
# mounts the metering proxy's usage log and CA. Mounts are structure an env
# file cannot express.
#
# The runtime VALUES (SUBSCRIPTION_*, SANDBOX_*, WORKSPACE_ROOT) live in the box's
# backend/.env and are loaded by the base compose — they are box-specific, so
# they stay out of git. This overlay carries only the structural wiring, and
# being committed it survives the runner's per-run re-checkout (which is what
# forced a box-side heal hack before this existed).
services:
  # The preview owner serves static previews and room files straight off the
  # workspace tree, at the SAME absolute path the shared env file names in
  # WORKSPACE_ROOT, which is a HOST path (see the header above). The base file
  # mounts the tree only at /app/.workspaces, so without this mirror the owner's
  # settings.workspace_root points at an unmounted path: every static preview
  # and room-file read fails, and only on a subscription box, which is exactly
  # where nobody looks.
  preview-connection:
    volumes:
      - ${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}:${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}

  backend:
    environment:
      # Where the metering proxy's usage log appears INSIDE this container —
      # matches the mount below. Subscription turns are metered at the proxy;
      # the backend tails this file into resource_usage + credits (issue #218).
      SUBSCRIPTION_USAGE_LOG: /var/log/cheese-proxy/usage.jsonl
      # Where the proxy's CA appears INSIDE this container — matches the mount
      # below. Device screens (#325 G2) get the CA embedded in their launch
      # script, so the backend has to be able to READ it; the container path
      # only ever mounted it into sandboxes by host path.
      SUBSCRIPTION_CA_BACKEND_PATH: /etc/cheese/metering-proxy-ca.pem
    volumes:
      # Host NIC counters for the board's uplink plane (read-only, no privileges).
      # Missing mount (Docker Desktop, CI) degrades to the container's own
      # /sys/class/net and the board says `perf.netContainer` — see
      # `app/core/net_io.py`.
      - /sys/class/net:/host-sys-class/net:ro
      - ${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}:${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}
      # The proxy's log dir, read-only: the one place subscription spend exists.
      - ${SUBSCRIPTION_PROXY_LOG_HOST:-/home/nictheboy/cheese-proxy/logs}:/var/log/cheese-proxy:ro
      # The proxy's CA cert, read-only (same identity the sandboxes trust).
      - ${SUBSCRIPTION_PROXY_CA_HOST:-/home/nictheboy/cheese-proxy/certs/mitmproxy-ca-cert.pem}:/etc/cheese/metering-proxy-ca.pem:ro
