# Subscription overlay — lets a box run agent turns on a Claude subscription
# through the on-box metering proxy. Layered on top of docker-compose.base.yml
# via COMPOSE_OVERLAYS (set in the box-local ops/deploy.env); a box that does not
# set it — e.g. prod (RUC) — is completely unaffected.
#
# Why this cannot be an env file. A subscription turn runs Claude Code inside an
# agent sandbox that the backend spawns as a SIBLING container through the host
# docker.sock. Two structural things that env vars cannot express are required
# for that to work, and both are here:
#
#   1. group_add — the image's app user must be IN the host's docker group to
#      talk to /var/run/docker.sock. DOCKER_GID is the host `docker` group's gid
#      (getent group docker); 989 is the dev box's.
#   2. workspace path parity — a sibling's `-v <src>` is resolved by the HOST
#      daemon, not by the backend's mount view, so the backend must see the
#      workspace tree at the SAME absolute path it hands the sandbox. The base
#      compose only mounts it at /app/.workspaces; this adds the host-path mirror.
#
# The runtime VALUES (SUBSCRIPTION_*, SANDBOX_*, WORKSPACE_ROOT) live in the box's
# backend/.env and are loaded by the base compose — they are box-specific, so
# they stay out of git. This overlay carries only the structural wiring, and
# being committed it survives the runner's per-run re-checkout (which is what
# forced a box-side heal hack before this existed).
services:
  backend:
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}:${WORKSPACES_HOST_PATH:-/home/nictheboy/cheese-workspaces}
