# The journal's retention on a box this repository deploys to, installed by
# deploy-docker.sh as /etc/systemd/journald.conf.d/cheese.conf.
#
# The containers log to the journal (docker-compose.base.yml), so this is how
# far back anyone can read what the backend did. Left at journald's default
# (a tenth of the filesystem, at most 4G) it held about thirteen hours on dev,
# and the evidence for a failure was gone by the time anyone looked.
[Journal]
# Weeks at the volume the app tier writes, see docs/infrastructure.md.
SystemMaxUse=40G
# And never at the expense of the box: whichever of the two bounds is tighter
# applies, so a smaller disk keeps less instead of filling up.
SystemKeepFree=40G
MaxRetentionSec=1month
# journald also stops at 100 files by default, whatever their size. dev's
# files rotate at about 50 MB, so that cap held 4 GB, about eight hours,
# under the 40 GB above (2026-10-05). Room for 40 GB of such files, twice.
SystemMaxFiles=2000
