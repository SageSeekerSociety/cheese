# Only application traffic passes through this independently reloaded process.
worker_processes 1;
worker_rlimit_nofile 65535;
# A reload starts new workers and leaves the old ones serving what they already
# carry; this is how long they may. A release reloads once and stops the slots
# traffic left after the handover pause (5 s) and the drain (31 s): the frontend
# with a 120 s graceful stop, the backend once the model streams it relays have
# ended — at most 900 s (DEPLOY_MODEL_STREAM_GRACE_SECONDS) — and a 60 s
# graceful stop. Those stops end the connections themselves; this is longer
# than all of it (1000 s), so the release decides when a room's socket moves,
# and only once — at 30 s every reload ended every WebSocket it carried,
# wherever it pointed — and an old worker never cuts a model stream the release
# is still waiting for. Bounded, so a reload that no stop follows (a config
# change) cannot keep workers forever.
worker_shutdown_timeout 1080s;
events { worker_connections 8192; }
http {
  # Paths only, never the query: a query can carry a credential (the room chat
  # socket's ?token=, /llm/tunnel?token=, /preview/tunnel?token=), and an access
  # log keeps it for as long as the journal does.
  log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout path_only;
  include /etc/nginx/active/backend.conf;
  # backend_pool_active: the api pool of the serving slot, with the realtime
  # process as its backup; or that process alone where the box runs no pool
  # (deploy-docker.sh write_pool_upstream).
  include /etc/nginx/active/backend-pool.conf;
  include /etc/nginx/active/frontend.conf;
  # Which backend process answers (backend/app/core/process_role.py): a plain
  # read goes to the api pool, everything else — writes, sockets, and the reads
  # below that answer from the realtime process's own state — to the realtime
  # process. The list is REALTIME_GET_PATTERNS, which
  # backend/tests/unit/test_process_role_routes.py holds this map to.
  map $uri $realtime_get {
    default 0;
    # realtime-get-patterns:begin
    ~^/(health|healthz|readyz)(/|$) 1;
    ~^/metrics 1;
    ~^/admin/ 1;
    ~^/debug/ 1;
    ~^/_internal/ 1;
    ~^/internal/ 1;
    ~^/topics/[^/]+/status$ 1;
    ~^/topics/[^/]+/agent/control$ 1;
    ~^/run-records/turns 1;
    ~^/topics/[^/]+/session-transcript 1;
    ~^/assistant/conversations/ 1;
    ~^/documents/[^/]+/agent/ 1;
    ~^/topics/[^/]+/preview 1;
    ~^/machine/ 1;
    ~^/llm/ 1;
    ~^/connector/ 1;
    ~^/sandbox/ 1;
    ~^/preview/ 1;
    # realtime-get-patterns:end
  }
  map "$request_method:$http_upgrade:$realtime_get" $backend_for {
    default backend_active;
    "GET::0" backend_pool_active;
    "HEAD::0" backend_pool_active;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  client_max_body_size 100m;
  proxy_buffering off;
  server {
    listen 127.0.0.1:18085;
    location / { proxy_pass http://$backend_for; }
    # A message's attachment upload: the backend's 200 MB video ceiling
    # (MAX_VIDEO_BYTES) plus the multipart envelope.
    location ~ ^/topics/[^/]+/attachments$ {
      proxy_pass http://backend_active;
      client_max_body_size 210m;
      proxy_request_buffering off;
    }
  }
  server {
    listen 127.0.0.1:18086;
    location / { proxy_pass http://frontend_active; }
    location ~ ^/api/topics/[^/]+/attachments$ {
      proxy_pass http://frontend_active;
      client_max_body_size 210m;
      proxy_request_buffering off;
    }
  }
}
