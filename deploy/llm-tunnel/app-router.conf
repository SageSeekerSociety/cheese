# Only application traffic passes through this independently reloaded process.
worker_processes 1;
worker_rlimit_nofile 65535;
# A reload starts new workers and leaves the old ones serving what they already
# carry; this is how long they may. A release reloads once, replaces the
# frontend at once and stops the backend traffic left after its handover pause
# (5 s), drain (31 s) and stop grace (60 s): under two minutes, and those stops
# end the connections themselves. Longer than that, so
# the release decides when a room's socket moves, and only once — at 30 s every
# reload ended every WebSocket it carried, wherever it pointed. Bounded, so a
# reload that no stop follows (a config change) cannot keep workers forever.
worker_shutdown_timeout 180s;
events { worker_connections 8192; }
http {
  # Paths only, never the query: a query can carry a credential (the room chat
  # socket's ?token=, /llm/tunnel?token=, /preview/tunnel?token=), and an access
  # log keeps it for as long as the journal does.
  log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout path_only;
  include /etc/nginx/active/backend.conf;
  include /etc/nginx/active/frontend.conf;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  client_max_body_size 100m;
  proxy_buffering off;
  server {
    listen 127.0.0.1:18085;
    location / { proxy_pass http://backend_active; }
  }
  server {
    listen 127.0.0.1:18086;
    location / { proxy_pass http://frontend_active; }
  }
}
