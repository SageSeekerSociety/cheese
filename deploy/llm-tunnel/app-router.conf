# Only application traffic passes through this independently reloaded process.
worker_processes 1;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 30s;
events { worker_connections 8192; }
http {
  include /etc/nginx/active/backend.conf;
  include /etc/nginx/active/frontend.conf;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  client_max_body_size 100m;
  proxy_buffering off;
  server {
    listen 127.0.0.1:18085;
    location / { proxy_pass http://backend_active; }
  }
  server {
    listen 127.0.0.1:18086;
    location / { proxy_pass http://frontend_active; }
  }
}
