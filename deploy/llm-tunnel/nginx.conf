# api-front: the box's :8081 front door (#551 terminal state).
#
# The ghg edge proxies API traffic to the box on :8081 and knows nothing else.
# This nginx owns that port PERMANENTLY (standing container, host network) and
# splits by path: the model-tunnel WebSocket goes to the standing terminator,
# everything else to the backend on its relocated internal port — so swapping
# the backend container never severs machine model traffic again.
worker_processes 1;

# A worker's descriptor ceiling is the box's default (1024) unless it is set
# here, and every proxied request costs two of them — one to the client, one to
# the upstream. On 2026-09-16 that ceiling was reached and nginx refused
# everything for three minutes: `socket() failed (24: No file descriptors
# available) while connecting to upstream`, then `accept4() failed (24)`.
worker_rlimit_nofile 65535;

# A reload does not move the RUNNING workers onto the new config. It starts new
# workers with it and lets the old ones finish what they hold — and an old
# worker here still holds the OLD active/backend.conf, so it keeps sending
# traffic to the backend the deploy is about to take away. That is how a
# rollout which had already switched to the incoming container still cut every
# request in flight on an old worker (2026-09-16: six deploys, 150 ×
# `upstream prematurely closed connection`, every 502 landing on the single
# second the outgoing container was removed).
#
# Without a deadline those workers never exit, because the timeouts below are
# hours long and a worker leaves only when its last connection does — six of
# them were still alive a day later, holding the descriptors that exhausted the
# ceiling above. Both symptoms are this one missing directive.
worker_shutdown_timeout 30s;

# Headroom over the ceiling a single worker can now open, so the limit that
# binds is the descriptor count above and not this number.
events { worker_connections 8192; }

http {
  # Which backend container the box's :8081 forwards to. deploy-docker.sh
  # rewrites active/backend.conf and reloads this nginx to move traffic from
  # the running backend to the one it has just brought up, and back, so a
  # deploy never leaves this port with nothing healthy behind it. The file is
  # in a mounted DIRECTORY, not mounted by itself: a bind-mounted file keeps
  # following the old inode after the atomic rename the deploy uses.
  include /etc/nginx/active/backend.conf;
  # WebSockets in both branches (the tunnel here, /topics/{id}/chat behind).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 8081;

    # A tunnel carries a whole turn's model traffic: hold it as long as the
    # session does, and never buffer a streaming body.
    location /llm/tunnel {
      proxy_pass http://127.0.0.1:8091;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 4h;
      proxy_send_timeout 4h;
      proxy_buffering off;
    }

    # This upstream is a separately released connection owner. It is never the
    # active backend selected by a business release.
    location = /connector/agent {
      proxy_pass http://127.0.0.1:18083;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      proxy_buffering off;
    }

    # Public machine URLs use connector_public_base, whose deployed value ends
    # in /api. Route that public spelling here as well, before it can fall
    # through the active business backend/frontend and inherit their lifecycle.
    location = /api/connector/agent {
      proxy_pass http://127.0.0.1:18083/connector/agent;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      proxy_buffering off;
    }

    location ~ ^/connector/session/[^/]+/screen$ {
      proxy_pass http://127.0.0.1:18083;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      proxy_buffering off;
    }

    location ~ ^/api/connector/session/[^/]+/screen$ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:18083;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      proxy_buffering off;
    }

    location ~ ^/topics/[^/]+/execution/[^/]+$ {
      proxy_pass http://127.0.0.1:18083;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      client_max_body_size 100m;
      proxy_read_timeout 15m;
      proxy_send_timeout 15m;
      proxy_buffering off;
    }

    location ~ ^/api/topics/[^/]+/execution/[^/]+$ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:18083;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100m;
      proxy_read_timeout 15m;
      proxy_send_timeout 15m;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://backend_active;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 100m;
      proxy_buffering off;
    }
  }

  # Optional content hosts use their own server so /llm/tunnel also reaches
  # the backend's Site middleware. With no generated file, routing is unchanged.
  include /etc/nginx/active/sites*.conf;
}
