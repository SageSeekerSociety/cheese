# One browser for the machine. Attach it to the same network the backend is on,
# then point the backend at it with:
#
#     FETCH_BROWSER_ENDPOINT=http://cheese-browser-render:8900
#
services:
  browser-render:
    build: .
    container_name: cheese-browser-render
    restart: unless-stopped
    # Chromium writes to /dev/shm and the Docker default of 64 MB is where
    # headless Chrome starts crashing on real pages. This is the single most
    # common way a working browser container turns flaky under load.
    shm_size: "1gb"
    environment:
      # Leave unset when the host reaches the internet directly. Playwright does
      # NOT read this on its own — the service passes it to the browser
      # explicitly, which is why it is named here rather than assumed.
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - RENDER_MAX_CONCURRENT=6
    # A browser is the one process here that will happily eat a machine. Six
    # concurrent pages was measured healthy; these bounds keep a burst queueing
    # rather than swapping.
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:8900:8900"
    networks: [cheese]

networks:
  cheese:
    external: true
    name: ${CHEESE_NETWORK:-cheese_default}
