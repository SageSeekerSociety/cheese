# Public ingress shared by deployments that connect outward over WebSocket.
# The env file contains FORGE_EVENT_RELAY_KEYS as a JSON deployment/secret map.
services:
  forge-events:
    image: ${FORGE_EVENTS_IMAGE:?pin the backend image containing the relay}
    command: ["uvicorn", "app.forge_events_app:app", "--host", "0.0.0.0", "--port", "8093"]
    env_file:
      - ${FORGE_EVENTS_ENV_FILE:?path to the relay-specific secrets file}
    ports:
      - "127.0.0.1:8093:8093"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8093/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
