# Subscription metering proxy — meters, caps and routes every Claude turn. It
# holds the platform's only model credential: every session boots on
# NO_LOGIN_PLACEHOLDER, which authenticates nothing, and the real credential is
# put on the request here, on its way to Anthropic.
#
# Values come from a box-local .env next to this file (never committed):
#   CHEESE_SCOPED_SECRET    = the backend's SANDBOX_TOKEN (rotate together)
#                           Also the proxy's own credential on admission:
#                           without it no gateway project gets its key.
#   CHEESE_ADMISSION_URL    e.g. http://172.17.0.1:8081/llm/admission. Leaving
#                           it unset switches off TWO things with no error:
#                           per-project budgets stop being enforced, and no
#                           project is routed to the API-key pool. The addon
#                           warns once at load; that line is the only signal
#                           you get.
#   USAGE_LOG_DIR           host dir for the ledger. MUST be the same directory
#                           the backend's SUBSCRIPTION_USAGE_LOG points into —
#                           the proxy writes the rows, the backend ingests them,
#                           and nothing checks the two agree. The default (the
#                           compose file's own ./logs) is only right when this
#                           checkout is where the backend already reads from.
#   CHEESE_GATEWAY_BASE     e.g. http://172.17.0.1:4000 — where the API-key
#                           pool (LiteLLM) listens. A project whose supply
#                           decision says `gateway` is routed here instead of
#                           to Anthropic. Empty = no API-key pool on
#                           this box, and such a project is refused.
#   CHEESE_TOKEN_CAP        rolling-window backstop, 0 = off
#   CHEESE_ALLOW_HEADER_ATTR  1 ONLY on bridge-only single-host deployments
#   CHEESE_CHATGPT_KEY      the Bearer the ChatGPT listener (:8445) demands:
#                           the api_key of the gateway deployments pointed at
#                           it. Empty refuses every request there.
#
# The Codex client version ChatGPT is told is not set here: it is a file beside
# the ChatGPT accounts, changed without a restart (chatgpt-login.sh
# client-version).
#
# The ChatGPT listener (:8445) is published nowhere. Its one caller, the
# gateway's LiteLLM, reaches it as http://metering-proxy:8445 on
# cheese-meter-gateway, an internal network only those two containers join;
# no sandbox is on it. Plain HTTP is safe there because the hop never leaves
# that network, and the Bearer it carries is the listener key, not an upstream
# credential. CHEESE_CHATGPT_KEY stays as the second line of defence.
#
# The network is shared with the gateway stack, so neither stack owns it: both
# compose files name it external, and each stack's release creates it when it
# is missing. Brought up by hand before either release has run, this service
# fails with "network cheese-meter-gateway declared as external, but could not
# be found"; `docker network create --internal cheese-meter-gateway` fixes it.
#
# The CONNECT listener (:8444) is where every session's model traffic arrives:
# the session's `claude` dials its seat's tunnel helper through HTTPS_PROXY, and
# the model tunnel (`/llm/tunnel`) connects here on the bridge address
# (172.17.0.1). No machine dials it directly, so it is published on the bridge
# only.
#
# It authenticates anyway: it demands a scoped cheese token as
# Proxy-Authorization before relaying anything (#198), and with no
# CHEESE_SCOPED_SECRET configured it refuses every CONNECT rather than relaying.
# It only ever MITMs the Anthropic names; everything else tunnels raw, so device
# shell tools that honor HTTPS_PROXY but not our CA keep working.
services:
  metering-proxy:
    image: ${METERING_PROXY_IMAGE:?Use the Release metering proxy workflow}
    container_name: cheese-metering-proxy
    restart: unless-stopped
    labels:
      # A hash of this file and the .env the release started it with, so the
      # next release can tell a configuration change from an unchanged proxy
      # (release-metering-proxy.sh). Empty when started any other way, which
      # the next release treats as changed.
      cheese.metering-proxy.config-sha256: ${METERING_PROXY_CONFIG_SHA256:-}
    # Backstop, not the fix: the addon now streams both request and response
    # bodies (billing_addon.py) so per-flow memory is bounded and a long agent
    # turn no longer buffers its whole grown context. This cap only ensures that
    # if something pathological still spikes memory, the OOM is contained to this
    # container (a restart) instead of taking down every other service on the
    # box. Raise it on hosts that run many concurrent subscription turns.
    mem_limit: 2g
    # journald, for the reason the app containers use it
    # (docs/infrastructure.md, "Logs"): every release recreates this
    # container, and a json-file log goes with the container it belonged to.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    # mitmproxy puts no timeout on opening an upstream connection, so an
    # unreachable one (a credential egress across a flaky tailnet relay) waited
    # out the kernel's 6 SYN retries, ~135 s, per request. At 3 it fails in
    # ~20 s and the client's retries surface the failure instead of a silent
    # room. Scoped to this container's network namespace.
    sysctls:
      net.ipv4.tcp_syn_retries: "3"
    command: >
      mitmdump --listen-host 0.0.0.0
      --mode regular@8444
      --mode reverse:https://chatgpt.com@8445
      --ssl-insecure
      --set connection_strategy=lazy
      -s /addons/billing_addon.py
    ports:
      - "172.17.0.1:8444:8444"
    networks:
      # Listed because naming any network drops the implicit one: the
      # published listeners and the way out to Anthropic stay on it.
      default:
      meter-gateway:
        aliases:
          - metering-proxy
    environment:
      CHEESE_USAGE_LOG: /var/log/cheese/usage.jsonl
      CHEESE_TOKEN_CAP: ${CHEESE_TOKEN_CAP:-0}
      CHEESE_SCOPED_SECRET: ${CHEESE_SCOPED_SECRET:-}
      CHEESE_ALLOW_HEADER_ATTR: ${CHEESE_ALLOW_HEADER_ATTR:-}
      CHEESE_ADMISSION_URL: ${CHEESE_ADMISSION_URL:-}
      CHEESE_GATEWAY_BASE: ${CHEESE_GATEWAY_BASE:-}
      CHEESE_CLAUDE_CREDENTIAL: /etc/cheese/claude-credential/credential
      CHEESE_CHATGPT_CREDENTIALS: /etc/cheese/chatgpt-credential
      CHEESE_CHATGPT_KEY: ${CHEESE_CHATGPT_KEY:-}
    volumes:
      # The ledger. This MUST resolve to the same host directory the backend's
      # SUBSCRIPTION_USAGE_LOG points into — the proxy writes the rows and the
      # backend ingests them, and nothing checks that the two agree. Defaulting
      # it to `./logs` pins the ledger to wherever this compose file happens to
      # sit, which is how a box that moved its checkout ended up metering into a
      # directory no one read: turns were billed, rows were written, and the
      # ledger simply stopped growing. No error, on either side.
      - ${USAGE_LOG_DIR:-./logs}:/var/log/cheese
      - ${CERTS_DIR:-./certs}:/home/mitmproxy/.mitmproxy
      # The platform's Claude credential, the only copy anywhere: logging in or
      # out is writing or deleting `credential` in this directory
      # (claude-login.sh). Writable, because a login's pair is refreshed here
      # and written back; a directory, so an atomic replace is seen at once.
      - ${CLAUDE_CREDENTIAL_DIR:-./claude-credential}:/etc/cheese/claude-credential
      # The platform's ChatGPT accounts, one directory per name
      # (chatgpt-login.sh), writable for the same reason as the Claude one.
      - ${CHATGPT_CREDENTIAL_DIR:-./chatgpt-credential}:/etc/cheese/chatgpt-credential

networks:
  meter-gateway:
    external: true
    name: cheese-meter-gateway
