# Subscription metering proxy — the one place the real Claude credential lives.
#
# Values come from a box-local .env next to this file (never committed):
#   CCPROXY_UPSTREAM_AUTH   user:password for the explicit ccproxy hop
#   CHEESE_UPSTREAM_VIA     e.g. ccproxy-prod.119net.ghg.org.cn:3128
#   CHEESE_SCOPED_SECRET    = the backend's SANDBOX_TOKEN (rotate together)
#   CHEESE_ADMISSION_URL    e.g. http://172.17.0.1:8081/llm/admission
#   CHEESE_TOKEN_CAP        rolling-window backstop, 0 = off
#   CHEESE_ALLOW_HEADER_ATTR  1 ONLY on bridge-only single-host deployments
#
# Published on the docker bridge address only (172.17.0.1): sandboxes reach the
# reverse listener (:443) by --add-host; bare DEVICE screens (no root, no docker)
# reach the CONNECT listener (:8444) via HTTPS_PROXY. Exposing either wider
# requires CHEESE_SCOPED_SECRET so a caller must prove which project to bill
# before the subscription is spent (#198) — the CONNECT listener additionally
# demands that token as Proxy-Authorization before it relays anything, and only
# ever MITMs the Anthropic names (everything else tunnels raw, so device shell
# tools that honor HTTPS_PROXY but not our CA still work). Publishing 8444 on a
# device-reachable interface is what remote-device subscription turns wait on.
services:
  metering-proxy:
    image: mitmproxy/mitmproxy:12.1.2
    container_name: cheese-metering-proxy
    restart: unless-stopped
    command: >
      mitmdump --listen-host 0.0.0.0
      --mode reverse:https://api.anthropic.com@8443
      --mode regular@8444
      --ssl-insecure
      --upstream-auth ${CCPROXY_UPSTREAM_AUTH}
      --set connection_strategy=lazy
      -s /addons/billing_addon.py
    ports:
      - "172.17.0.1:443:8443"
      - "172.17.0.1:8444:8444"
    environment:
      CHEESE_USAGE_LOG: /var/log/cheese/usage.jsonl
      CHEESE_INJECT_TOKEN: /etc/cheese/secrets/inject.token
      CHEESE_TOKEN_CAP: ${CHEESE_TOKEN_CAP:-0}
      CHEESE_UPSTREAM_VIA: ${CHEESE_UPSTREAM_VIA:-}
      CHEESE_SCOPED_SECRET: ${CHEESE_SCOPED_SECRET:-}
      CHEESE_ALLOW_HEADER_ATTR: ${CHEESE_ALLOW_HEADER_ATTR:-}
      CHEESE_ADMISSION_URL: ${CHEESE_ADMISSION_URL:-}
    volumes:
      - ./logs:/var/log/cheese
      - .:/addons:ro
      # Mount the secrets DIRECTORY read-only, not the single token file. A
      # single-file bind mount pins the container to the host inode it saw at
      # start, so an atomic rotation (write a new file, then rename it over the
      # old name) leaves the container reading the OLD inode's contents until it
      # is restarted — a stale-token trap hit in production. With the directory
      # mounted, ${INJECT_SECRETS_DIR}/inject.token is resolved on each read, so
      # an atomic replace inside that dir is picked up with no restart (the addon
      # re-reads the file on every request). Boxes point INJECT_SECRETS_DIR at an
      # absolute host secrets dir; ./secrets is only the self-contained default.
      - ${INJECT_SECRETS_DIR:-./secrets}:/etc/cheese/secrets:ro
      - ${CERTS_DIR:-./certs}:/home/mitmproxy/.mitmproxy
