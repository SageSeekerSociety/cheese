# Subscription metering proxy — the one place the real Claude credential lives.
#
# Values come from a box-local .env next to this file (never committed):
#   CCPROXY_UPSTREAM_AUTH   user:password for the explicit ccproxy hop. NOT
#                           mitmdump's --upstream-auth any more: that stamps one
#                           identity onto every upstream connection, and ccproxy
#                           only honours a machine's ticket over that machine's
#                           own identity. The addon sets the header per request
#                           from the admission verdict and uses this as the
#                           fallback, so the two can never disagree.
#   CHEESE_UPSTREAM_VIA     e.g. ccproxy-prod.119net.ghg.org.cn:3128
#   CHEESE_SCOPED_SECRET    = the backend's SANDBOX_TOKEN (rotate together)
#   CHEESE_ADMISSION_URL    e.g. http://172.17.0.1:8081/llm/admission. Leaving
#                           it unset switches off TWO things with no error:
#                           per-project budgets stop being enforced, and no
#                           enrolled machine can be placed on its own ccproxy
#                           identity (every such turn is refused instead). The
#                           addon warns once at load; that line is the only
#                           signal you get.
#   USAGE_LOG_DIR           host dir for the ledger. MUST be the same directory
#                           the backend's SUBSCRIPTION_USAGE_LOG points into —
#                           the proxy writes the rows, the backend ingests them,
#                           and nothing checks the two agree. The default (the
#                           compose file's own ./logs) is only right when this
#                           checkout is where the backend already reads from.
#   CHEESE_GATEWAY_BASE     e.g. http://172.17.0.1:4000 — where the API-key
#                           pool (LiteLLM) listens. A project whose supply
#                           decision says `gateway` is routed here instead of
#                           out through ccproxy. Empty = no API-key pool on
#                           this box, and such a project is refused.
#   CHEESE_TOKEN_CAP        rolling-window backstop, 0 = off
#   CHEESE_ALLOW_HEADER_ATTR  1 ONLY on bridge-only single-host deployments
#   CONNECT_BIND_HOST       bind address for the CONNECT listener (see below);
#                           0.0.0.0 on a box that serves MicroCloud machines
#
# The reverse listener (:443) stays on the docker bridge (172.17.0.1): only
# sandboxes on this box reach it, and they are steered there by --add-host.
#
# The CONNECT listener (:8444) is where every BARE process reaches the meter via
# HTTPS_PROXY — a local device screen, and (measured 2026-08-14) a MicroCloud
# machine, which has no root, no docker and no /etc/hosts to steer. Its bind
# address is therefore a per-box decision, CONNECT_BIND_HOST:
#
#   172.17.0.1  (default) local screens only — a remote machine cannot route to
#               the bridge address even though it CAN route to the box: measured
#               from machine 192.168.31.2, 192.168.16.5:22 answers while
#               172.17.0.1:8444 does not. The gap was never routing.
#   0.0.0.0     boxes whose MicroCloud machines run subscription turns. NOT the
#               LAN address alone: local screens still reach the bridge address,
#               so a single bind has to cover both.
#
# Widening it is safe because the listener authenticates: it demands a scoped
# cheese token as Proxy-Authorization before relaying anything (#198), and with
# no CHEESE_SCOPED_SECRET configured it refuses every CONNECT rather than
# relaying — so a wider bind cannot silently become an open relay. It also only
# ever MITMs the Anthropic names; everything else tunnels raw, so device shell
# tools that honor HTTPS_PROXY but not our CA keep working.
#
# The backend half is subscription_device_proxy_host: the address a machine is
# TOLD to use. Publishing here without setting that leaves machines pointed at
# the bridge address (the backend logs an error per launch, device_provider.py).
services:
  metering-proxy:
    image: mitmproxy/mitmproxy:12.1.2
    container_name: cheese-metering-proxy
    restart: unless-stopped
    command: >
      mitmdump --listen-host 0.0.0.0
      --mode reverse:https://api.anthropic.com@8443
      --mode regular@8444
      --ssl-insecure
      --set connection_strategy=lazy
      -s /addons/billing_addon.py
    ports:
      - "172.17.0.1:443:8443"
      - "${CONNECT_BIND_HOST:-172.17.0.1}:8444:8444"
    environment:
      CHEESE_USAGE_LOG: /var/log/cheese/usage.jsonl
      CHEESE_INJECT_TOKEN: /etc/cheese/secrets/inject.token
      CHEESE_TOKEN_CAP: ${CHEESE_TOKEN_CAP:-0}
      CHEESE_UPSTREAM_VIA: ${CHEESE_UPSTREAM_VIA:-}
      CHEESE_UPSTREAM_AUTH: ${CCPROXY_UPSTREAM_AUTH:-}
      CHEESE_SCOPED_SECRET: ${CHEESE_SCOPED_SECRET:-}
      CHEESE_ALLOW_HEADER_ATTR: ${CHEESE_ALLOW_HEADER_ATTR:-}
      CHEESE_ADMISSION_URL: ${CHEESE_ADMISSION_URL:-}
      CHEESE_GATEWAY_BASE: ${CHEESE_GATEWAY_BASE:-}
    volumes:
      # The ledger. This MUST resolve to the same host directory the backend's
      # SUBSCRIPTION_USAGE_LOG points into — the proxy writes the rows and the
      # backend ingests them, and nothing checks that the two agree. Defaulting
      # it to `./logs` pins the ledger to wherever this compose file happens to
      # sit, which is how a box that moved its checkout ended up metering into a
      # directory no one read: turns were billed, rows were written, and the
      # ledger simply stopped growing. No error, on either side.
      - ${USAGE_LOG_DIR:-./logs}:/var/log/cheese
      - .:/addons:ro
      # Mount the secrets DIRECTORY read-only, not the single token file. A
      # single-file bind mount pins the container to the host inode it saw at
      # start, so an atomic rotation (write a new file, then rename it over the
      # old name) leaves the container reading the OLD inode's contents until it
      # is restarted — a stale-token trap hit in production. With the directory
      # mounted, ${INJECT_SECRETS_DIR}/inject.token is resolved on each read, so
      # an atomic replace inside that dir is picked up with no restart (the addon
      # re-reads the file on every request). Boxes point INJECT_SECRETS_DIR at an
      # absolute host secrets dir; ./secrets is only the self-contained default.
      - ${INJECT_SECRETS_DIR:-./secrets}:/etc/cheese/secrets:ro
      - ${CERTS_DIR:-./certs}:/home/mitmproxy/.mitmproxy
