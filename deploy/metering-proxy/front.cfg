# The metering proxy's front: what callers reach as 172.17.0.1:8444 (the
# CONNECT listener every session's model traffic arrives on) and as
# http://metering-proxy:8445 (the ChatGPT listener the gateway calls). Two
# proxies stand behind it, slot-blue and slot-green; outside a release one of
# them runs. A release starts the other on the new image and moves new
# connections to it through the runtime API below
# (deploy/release-metering-proxy.sh), without reloading this process.
#
# The same file runs the handover front, which carries traffic once while the
# release moves the box off the single proxy container it ran before.
global
  # Runtime API, reachable only from inside this container. The release script
  # switches slots and reads per-slot connection counts through it.
  stats socket ipv4@127.0.0.1:9999 level admin
  maxconn 20000
  # Where a reload finds each slot's state as it was: the release writes it
  # here just before reloading. Without it the reloaded front starts every
  # slot down until its checks pass, holding new connections meanwhile, and
  # forgets which slot it was told to drain.
  server-state-file /tmp/server-state

defaults
  log stdout format raw local0 err
  load-server-state-from-file global
  timeout connect 5s
  # A tunnel or a request may sit silent while a model thinks. Nothing cut
  # idle connections before this front existed, so this only bounds the ones
  # nobody is using: clients close their idle connections within minutes.
  timeout client 1h
  timeout server 1h
  # A connection refused by a slot (stopped, or not yet listening) is tried
  # again on the other.
  retries 2
  option redispatch 1
  # Fixed addresses from the compose file, never names: Docker's DNS hands a
  # name it does not know to the host's resolver, which on the dev box answers
  # every name with an address (198.18.x), so a stopped slot's name would
  # still resolve.
  default-server inter 5s fastinter 1s downinter 2s fall 3 rise 2

# The CONNECT listener carries TLS the slot terminates, so it is passed on as
# TCP: a connection stays on the slot it was opened to for its whole life, and
# only new connections follow a switch. A draining slot closes each client
# connection after the response it carries (billing_addon.py,
# `_close_when_draining`), so a client's next request reconnects here.
frontend connect
  mode tcp
  bind :8444
  default_backend connect_slots

backend connect_slots
  mode tcp
  balance leastconn
  # Healthy is what the slot's own health check calls healthy
  # (healthcheck.py): an unauthenticated CONNECT is refused with 407, which
  # reaches no model provider.
  option tcp-check
  tcp-check connect
  tcp-check send "CONNECT api.anthropic.com:443 HTTP/1.1\r\nHost: api.anthropic.com:443\r\n\r\n"
  tcp-check expect rstring "^HTTP/1\.1 407"
  # A slot counts as down until its first check passes, so a front that has
  # just started sends nothing to a slot that is not running.
  server slot-blue "${METERING_BLUE_ADDR}:8444" check init-state down
  server slot-green "${METERING_GREEN_ADDR}:8444" check init-state down

# The ChatGPT listener is plain HTTP on a private network, so each request is
# placed on its own: the gateway's next request on its existing keep-alive
# connection goes to the slot that serves now.
frontend chatgpt
  mode http
  bind :8445
  # The gateway reuses an idle connection for as long as it keeps one; a close
  # it races fails that request (#3640).
  timeout http-keep-alive 600s
  timeout http-request 60s
  default_backend chatgpt_slots

backend chatgpt_slots
  mode http
  balance roundrobin
  # Its own check, a connection to the listener. Not `track`: a tracking
  # server starts up whatever the tracked one says, and keeps that until the
  # tracked one changes (seen on 3.2.25), so a slot that never started took
  # half the requests, each waiting out a connect timeout before redispatch.
  server slot-blue "${METERING_BLUE_ADDR}:8445" check inter 10s init-state down
  server slot-green "${METERING_GREEN_ADDR}:8445" check inter 10s init-state down

# The container's own health check: healthy while a slot is up behind it.
frontend health
  mode http
  bind 127.0.0.1:8446
  monitor-uri /health
  monitor fail if { nbsrv(connect_slots) lt 1 }
