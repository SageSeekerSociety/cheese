services:
  postgres:
    image: paradedb/paradedb:v0.18.8-pg16
    command: ["-c", "shared_preload_libraries=pg_cron,pg_search"]
    container_name: cheese_prod_postgres
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=cheese
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Host NIC counters for the board's uplink plane (read-only, no privileges).
      # Missing mount (Docker Desktop, CI) degrades to the container's own
      # /sys/class/net and the board says `perf.netContainer` — see
      # `app/core/net_io.py`.
      - /sys/class/net:/host-sys-class/net:ro
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  valkey:
    image: valkey/valkey:8.0.2
    container_name: cheese_prod_valkey
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  backend:
    # Time to hand its running turns to the next backend; see
    # compose/docker-compose.base.yml.
    stop_grace_period: 60s
    image: ghcr.io/sageseekersociety/cheese/backend:${IMAGE_TAG:-main}
    container_name: cheese_prod_backend
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env.prod
    environment:
      # The workspace root is the same absolute path inside this container and
      # on the host — hence the twin bind mount.
      - WORKSPACE_ROOT=/opt/cheese-data/workspaces
      - SANDBOX_IMAGE=ghcr.io/sageseekersociety/cheese/sandbox:${IMAGE_TAG:-main}
    volumes:
      - /opt/cheese-data/workspaces:/opt/cheese-data/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  frontend:
    image: ghcr.io/sageseekersociety/cheese/frontend:${IMAGE_TAG:-main}
    container_name: cheese_prod_frontend
    ports:
      - "127.0.0.1:80:80"
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/check-static-assets /usr/share/nginx/html >/dev/null &&
          curl -fsS http://127.0.0.1:80/ >/dev/null
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

volumes:
  postgres_data:
