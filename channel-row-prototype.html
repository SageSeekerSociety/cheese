<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>频道行原型</title>
<style>
/* 实用档：沿用产品灰阶与琥珀；真实灯色只用于状态。标题/正文共用系统 SC 字体，计数用等宽字体。
   完整工作区包住频道行；改动集中在侧栏四段占位。小屏把侧栏和内容上下排，不缩放整张界面。 */
:root{color-scheme:light;--ink:#191a1c;--text:#36383c;--muted:#5a5e66;--faint:#747a82;--line:#ecedef;--line-2:#e2e3e6;--fill:#f4f5f7;--fill-2:#eeeff1;--canvas:#f7f8fa;--surface:#fff;--raised:#fff;--accent:#f57f17;--accent-ink:#9a5413;--accent-wash:#fdf1e2;--ok:#1f9d55;--yellow:#eab308;--red:#dc2626;--blue:#2563eb;--focus:#c2570a;--shadow:0 4px 12px rgba(25,26,28,.10),0 12px 32px rgba(25,26,28,.10);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--avatar-ai:#77698c;--avatar-human:#547c86;--on-avatar:#fff}
:root[data-theme=dark]{color-scheme:dark;--ink:#f3f4f6;--text:#d3d6db;--muted:#aeb4bd;--faint:#888ea0;--line:#2b2e33;--line-2:#3a3e45;--fill:#212429;--fill-2:#282c31;--canvas:#141517;--surface:#1b1d20;--raised:#282c31;--accent:#ffa733;--accent-ink:#ffc670;--accent-wash:#2e2216;--ok:#3fbf7f;--yellow:#facc15;--red:#f0625c;--blue:#60a5fa;--focus:#ffbc5e;--shadow:0 4px 12px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.5 var(--sans)}button,input,textarea{font:inherit;color:inherit}button{background:transparent;border:0;cursor:pointer}button:disabled{cursor:default;color:var(--faint)}[hidden]{display:none!important}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}h1,h2,h3,p{margin:0}h1,h2,h3{color:var(--ink)}h1{font-size:24px;font-weight:650;line-height:32px}h2{font-size:15px;font-weight:600}h3{font-size:14px;font-weight:600}.page{max-width:1400px;margin:auto;padding:24px;display:flex;flex-direction:column;gap:16px}.intro{display:flex;align-items:center;justify-content:space-between;gap:16px}.intro p{color:var(--muted);margin-top:4px;font-size:13px}.chip{background:var(--accent-wash);color:var(--accent-ink);padding:4px 9px;border-radius:6px;font-size:12px;white-space:nowrap}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.presets{display:flex;gap:2px;flex-wrap:wrap;background:var(--fill-2);padding:3px;border-radius:8px}.preset{padding:6px 10px;border-radius:6px;font-size:13px}.preset[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}.theme-button{margin-left:auto;border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;white-space:nowrap;font-size:13px}.stage{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);overflow:hidden}.appbar{height:38px;background:var(--fill);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:0 14px;color:var(--faint);font-size:12px}.window-dots{display:flex;gap:5px}.window-dots i{width:8px;height:8px;background:var(--line-2);border-radius:50%}.appbar span:last-child{margin-left:auto}.app{display:grid;grid-template-columns:52px 330px minmax(0,1fr);min-height:684px;--sidebar-size:330px}.app.narrow{grid-template-columns:52px 236px minmax(0,1fr);--sidebar-size:236px}.project-rail{background:var(--fill);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0}.project{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}.project.current{background:var(--ink);color:var(--surface)}.project-rail .bottom{margin-top:auto}.sidebar{min-width:0;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}.workspace{display:flex;align-items:center;height:54px;padding:0 14px;gap:10px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink)}.workspace span:first-child{background:var(--accent-wash);color:var(--accent-ink);border-radius:6px;display:grid;place-items:center;width:26px;height:26px;flex:none}.workspace span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-button{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none}.icon-button:hover{background:var(--fill-2);color:var(--ink)}.nav-top{padding:10px 8px;display:grid;gap:2px}.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;text-align:left;border-radius:6px;font-size:13px}.nav-item:hover{background:var(--fill)}.nav-item b{margin-left:auto;font:12px var(--mono);font-weight:400;color:var(--faint)}.channel-heading{padding:6px 16px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint)}.channel-heading span{flex:1}.channel-list{padding:2px 8px 16px;flex:1;min-width:0}.channel-block{margin-bottom:2px}.channel-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto 30px;align-items:center;gap:5px;padding:4px 5px 4px 7px;min-height:38px;border-radius:6px;min-width:0}.channel-row:hover,.channel-row.demo-hover,.channel-row:focus-within{background:var(--fill)}.channel-row.selected{background:var(--line-2)}.channel-icon{color:var(--muted);text-align:center;font-size:17px}.channel-name{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding:4px 0;font-size:13px;width:100%}.selected .channel-name{font-weight:600;color:var(--ink)}.row-status{display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap}.avatars{display:flex;align-items:center;gap:2px;flex:none}.avatar{height:20px;width:20px;display:grid;place-items:center;border-radius:50%;background:var(--avatar-human);color:var(--on-avatar);font-size:11px;font-weight:600;flex:none;font-style:normal}.avatar.ai{background:var(--avatar-ai)}.avatars .avatar:not(:first-child){margin-left:-7px;border:2px solid var(--surface)}.avatar-count{display:none;color:var(--muted);font:11px var(--mono)}.badge{background:var(--accent);color:var(--ink);min-width:19px;height:18px;padding:0 4px;display:grid;place-items:center;border-radius:99px;font:11px var(--mono);font-weight:600}.lamp{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}.lamp.green{background:var(--ok)}.lamp.yellow{background:var(--yellow)}.lamp.red{background:var(--red)}.lamp.blue{background:var(--blue)}.lamp.moving{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 20%,transparent);animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.4}}.fold{display:flex;align-items:center;justify-content:center;gap:3px;min-width:30px;height:30px;padding:0 3px;border-radius:6px;color:var(--muted);font:11px var(--mono)}.fold:hover{background:var(--fill-2)}.chevron{font:15px var(--sans);display:inline-block}.fold[aria-expanded=true] .chevron{transform:rotate(90deg)}.more{opacity:0;width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:19px;display:grid;place-items:center}.channel-row:hover .more,.channel-row:focus-within .more,.demo-hover .more,.more[aria-expanded=true]{opacity:1}.more:hover,.more[aria-expanded=true]{background:var(--fill-2);color:var(--ink)}.touch .channel-row{min-height:48px}.touch .more,.touch .fold{width:40px;min-width:40px;height:40px}.touch .channel-row{grid-template-columns:18px minmax(0,1fr) auto 40px}.touch .more{opacity:1}.narrow .avatars .avatar:not(:first-child){display:none}.narrow .avatar-count{display:inline}.narrow .row-status{gap:4px}.tasks{padding:2px 4px 5px 32px;display:grid;gap:2px}.task-button{display:flex;align-items:center;gap:7px;text-align:left;font-size:12px;color:var(--muted);padding:5px 8px;border-radius:6px;min-width:0}.task-button:hover{background:var(--fill)}.task-button span.task-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.task-button .task-member{width:17px;height:17px;font-size:10px}.sidebar-foot{padding:10px 15px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.sidebar-foot .lamp{background:var(--ok)}.main{min-width:0;background:var(--canvas);display:flex;flex-direction:column}.channel-head{min-height:54px;padding:8px 20px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--surface)}.channel-head h2{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}.channel-head .members{display:flex;gap:4px}.tabbar{display:flex;gap:20px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line)}.tab{padding:11px 0;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}.pane{padding:22px;flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}.context-label{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px}.message{display:flex;gap:10px;align-items:flex-start}.message-avatar{width:30px;height:30px;font-size:13px}.message-body{min-width:0;display:flex;flex-direction:column;gap:4px}.message-meta{display:flex;gap:8px;font-size:12px;color:var(--faint);align-items:center}.message-meta strong{font-size:13px;color:var(--ink);font-weight:600}.message-body p{font-size:14px;line-height:1.7;max-width:620px}.proposal{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.proposal h3{display:flex;align-items:center;gap:8px}.change-num{font:11px var(--mono);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;background:var(--accent-wash);color:var(--accent-ink);flex:none}.proposal ul{margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--muted)}.task-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}.task-card .task-card-copy{flex:1;min-width:0}.task-card small{display:block;color:var(--faint);font-size:12px}.mini-button{border:1px solid var(--line-2);border-radius:6px;padding:5px 9px;font-size:12px}.mini-button:hover{background:var(--fill)}.composer{margin-top:auto;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px}.composer textarea{display:block;width:100%;border:0;resize:vertical;background:transparent;min-height:52px;font-size:13px;line-height:1.5}.composer footer{display:flex;align-items:center;justify-content:space-between;color:var(--faint);font-size:12px}.composer button{border-radius:6px;padding:5px 12px;background:var(--accent-wash);color:var(--accent-ink)}.annotation{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}.annotation .status{margin-left:auto;font-size:12px;color:var(--faint)}.mobile-hint{display:none}.menu{position:fixed;z-index:100;width:192px;max-width:calc(100vw - 24px);padding:5px;background:var(--raised);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow)}.menu-title{padding:5px 9px;color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:6px;padding:9px;font-size:13px}.menu button:hover{background:var(--fill)}.menu .danger-action{color:var(--red)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px}.modal-shade{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:24px;z-index:200}.modal{width:100%;max-width:380px;background:var(--raised);border:1px solid var(--line-2);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}.modal p{font-size:13px;color:var(--muted)}.modal footer{display:flex;gap:8px;justify-content:flex-end}.legend-details{font-size:12px;color:var(--muted)}.legend-details summary{cursor:pointer}.legend-details p{padding-top:8px;line-height:1.8}.empty{padding:32px 0;color:var(--muted);font-size:13px}
@media(max-width:1000px) and (min-width:701px){.app{grid-template-columns:46px 300px minmax(0,1fr)}.pane{padding:16px}.channel-head{padding-inline:16px}}
@media(max-width:700px){.page{padding:16px;gap:12px}.intro{align-items:flex-start}.intro p{font-size:12px}.chip{font-size:11px}.controls{gap:8px}.theme-button{margin-left:0}.presets{width:100%}.preset{flex:1 0 auto}.app,.app.narrow{grid-template-columns:40px minmax(0,1fr);min-height:0}.project-rail{grid-column:1;grid-row:1}.sidebar{grid-column:2;grid-row:1;border-right:0;min-height:620px}.app.narrow .sidebar{width:236px;max-width:100%}.app.narrow{background:var(--canvas)}.main{grid-column:1/-1;grid-row:2;border-top:1px solid var(--line-2);min-height:540px}.pane{padding:18px 16px}.channel-head{padding-inline:16px}.mobile-hint{display:inline;color:var(--faint);font-size:11px}.appbar{padding-inline:10px;font-size:11px}.annotation .status{width:100%;margin-left:26px}.intro h1{font-size:21px}.menu button{min-height:40px}}
@media(hover:none){.more{opacity:1}.channel-row{min-height:44px}.more,.fold{min-height:36px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="intro"><div><h1>频道行原型</h1><p>把 ⋯ 留在自己的位置，频道名只收缩，不挤头像和状态。</p></div><span class="chip">可点击 · 非产品页面</span></header>
  <div class="controls" aria-label="切换演示状态"><div class="presets" role="group" aria-label="演示状态">
    <button class="preset" data-preset="normal" aria-pressed="true">常态</button><button class="preset" data-preset="hover" aria-pressed="false">悬停</button><button class="preset" data-preset="focus" aria-pressed="false">键盘聚焦</button><button class="preset" data-preset="menu" aria-pressed="false">打开菜单</button><button class="preset" data-preset="narrow" aria-pressed="false">窄侧栏</button><button class="preset" data-preset="touch" aria-pressed="false">触屏</button>
  </div><button id="theme" class="theme-button" aria-pressed="false">切换深色</button></div>
  <section class="stage" aria-label="仿真工作区">
    <div class="appbar"><div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div><span>知是 · 频道</span><span>示例数据，不连接真实项目</span></div>
    <div id="app" class="app">
      <nav class="project-rail" aria-label="项目"><span class="project current" title="当前项目">知</span><button class="project" data-shell="工作区切换" aria-label="切换工作区">工</button><button class="project" data-shell="新建项目" aria-label="新建项目">＋</button><button class="project bottom" data-shell="个人设置" aria-label="个人设置">⚙</button></nav>
      <aside class="sidebar" aria-label="频道侧栏"><div class="workspace"><span>知</span><span>知是</span><button class="icon-button" data-shell="项目设置" aria-label="项目设置">⌄</button></div>
        <nav class="nav-top" aria-label="项目导航"><button class="nav-item" data-nav="总览"><span aria-hidden="true">◴</span>总览<b>8</b></button><button class="nav-item" data-nav="资料库"><span aria-hidden="true">▤</span>资料库</button></nav>
        <div class="channel-heading"><span>频道</span><button class="icon-button" data-shell="新建频道" aria-label="新建频道">＋</button></div><div class="channel-list" id="channels"></div>
        <div class="sidebar-foot"><span class="avatar ai">S</span><span>芝士S · 演示</span><span class="lamp green" title="演示连接状态"></span></div>
      </aside>
      <section class="main" aria-label="频道主区"><header class="channel-head"><span class="channel-icon" aria-hidden="true">#</span><h2 id="channelTitle">前端</h2><div class="members" id="headerMembers"></div><button class="icon-button" id="membersButton" aria-label="查看成员">⋯</button></header>
        <nav class="tabbar" role="tablist" aria-label="频道内容"><button class="tab" role="tab" aria-selected="true" data-tab="chat">对话</button><button class="tab" role="tab" aria-selected="false" data-tab="tasks">任务</button><button class="tab" role="tab" aria-selected="false" data-tab="document">实况文档</button></nav>
        <div class="pane" id="pane"></div>
      </section>
    </div>
  </section>
  <div class="annotation" role="status" aria-live="polite"><span class="change-num">1</span><span id="annotation">悬停频道行，头像与状态灯不动；⋯ 在末尾显示。</span><span class="status" id="status">频道、任务折叠与菜单都能点击</span></div>
  <details class="legend-details"><summary>查看状态灯与原型边界</summary><p>红灯：显示在跑但五分钟没有输出；黄灯：有事等你；呼吸绿：工作在推进；常亮绿：交付完成但还没看过。蓝灯按蔡松洋 10 月 14 日的新要求表示自己的活，优先级低于红黄绿。头像、计数、任务与消息是演示数据；菜单操作只影响当前原型。</p></details>
</main>
<div class="menu" id="menu" role="menu" aria-label="频道操作" hidden><div class="menu-title" id="menuTitle"></div><button role="menuitem" data-menu="read"><span aria-hidden="true">✓</span>标为已读</button><button role="menuitem" data-menu="pin"><span aria-hidden="true">◇</span><span id="pinLabel">置顶频道</span></button><button role="menuitem" data-menu="mute"><span aria-hidden="true">◌</span><span id="muteLabel">静音频道</span></button><hr><button role="menuitem" data-menu="members"><span aria-hidden="true">♧</span>查看成员</button></div>
<div id="modalShade" class="modal-shade" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h3 id="modalTitle"></h3><p id="modalCopy"></p><footer><button id="closeModal" class="mini-button">关闭</button></footer></section></div>
<script>
(() => {
  'use strict';
  // 数据是演示夹具，不是项目成员的真实消息或任务状态。
  const data = [
    {id:'front',name:'前端',members:['AI','人','人','AI'],unread:12,light:'green',moving:true,tasks:[['频道行原型','green'],['通知跳转','yellow']]},
    {id:'active',name:'active-agent',members:['AI','人'],unread:4,light:'yellow',tasks:[['等待布局确认','yellow'],['自己的待办','blue']]},
    {id:'devices',name:'设备与机器',members:['人','AI','人'],unread:0,light:'red',tasks:[['工作机连接核验','red']]},
    {id:'office',name:'办公能力',members:['人','AI'],unread:99,light:'green',tasks:[['文档导出','green']]},
    {id:'long',name:'频道行布局与成员状态显示讨论',members:['AI','人','人','AI','人'],unread:128,light:'yellow',tasks:[['长名称与多位未读数','yellow']]},
    {id:'skills',name:'skill plaza',members:['人'],unread:0,light:null,tasks:[]},
    {id:'test',name:'测试频道',members:['AI','人','AI'],unread:2,light:'green',tasks:[['自己的待办','blue'],['渲染检查','green']]},
    {id:'slack',name:'slack-ui',members:['AI','人'],unread:0,light:'yellow',tasks:[['菜单向上展开','yellow']]}
  ];
  const byId = id => data.find(c => c.id === id);
  const $ = id => document.getElementById(id);
  const app = $('app'), menu = $('menu');
  let selected='front', tab='chat', preset='normal', menuChannel=null, menuTrigger=null, modalReturn=null;
  const expanded = new Set(['front']);
  const lamps = {red:'显示在跑，但五分钟没有输出',yellow:'有事等你',green:'工作在推进或交付后未读',blue:'自己的活'};
  const escapeHTML = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lamp = (kind,moving=false) => kind ? `<span class="lamp ${kind}${moving?' moving':''}" role="img" aria-label="${lamps[kind]}" title="${lamps[kind]}"></span>` : '';
  const avatar = (kind,i) => `<span class="avatar ${kind==='AI'?'ai':''}" title="${kind==='AI'?'AI 队友':'成员'} ${i+1}" aria-label="${kind==='AI'?'AI 队友':'成员'} ${i+1}">${kind==='AI'?'S':'人'}</span>`;
  function announce(text){$('status').textContent=text;}
  function renderChannels(){
    $('channels').innerHTML=data.map(c=>`<div class="channel-block" data-id="${c.id}"><div class="channel-row ${selected===c.id?'selected':''}${c.id==='front'&&preset==='hover'?' demo-hover':''}">
      <span class="channel-icon" aria-hidden="true">#</span><button class="channel-name" data-channel="${c.id}" title="${escapeHTML(c.name)}" ${selected===c.id?'aria-current="page"':''}>${escapeHTML(c.name)}${c.pinned?' ◇':''}${c.muted?' ◌':''}</button>
      <div class="row-status"><span class="avatars" title="${c.members.length} 位演示成员">${c.members.slice(0,3).map(avatar).join('')}<span class="avatar-count">${c.members.length>1?'+'+(c.members.length-1):''}</span></span>${c.unread?`<span class="badge" aria-label="${c.unread} 条未读">${c.unread>99?'99+':c.unread}</span>`:''}${lamp(c.light,c.moving)}${c.tasks.length?`<button class="fold" data-fold="${c.id}" aria-controls="tasks-${c.id}" aria-expanded="${expanded.has(c.id)}" aria-label="${expanded.has(c.id)?'收起':'展开'} ${escapeHTML(c.name)} 的 ${c.tasks.length} 个任务"><span class="chevron" aria-hidden="true">›</span><span>${c.tasks.length}</span>${!expanded.has(c.id)?lamp([...c.tasks].sort((a,b)=>({red:4,yellow:3,green:2,blue:1}[b[1]]-{red:4,yellow:3,green:2,blue:1}[a[1]]))[0][1]):''}</button>`:''}</div>
      <button class="more" data-more="${c.id}" aria-haspopup="menu" aria-controls="menu" aria-expanded="false" aria-label="${escapeHTML(c.name)} 的更多操作">⋯</button></div>
      <div class="tasks" id="tasks-${c.id}" ${expanded.has(c.id)?'':'hidden'}>${c.tasks.map((t,i)=>`<button class="task-button" data-task="${c.id}:${i}"><span aria-hidden="true">▱</span><span class="task-title">${escapeHTML(t[0])}</span>${lamp(t[1])}<span class="avatar ai task-member">S</span></button>`).join('')}</div></div>`).join('');
  }
  function renderMain(){
    const c=byId(selected); $('channelTitle').textContent=c.name; $('headerMembers').innerHTML=c.members.slice(0,3).map(avatar).join('');
    document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
    const name=escapeHTML(c.name);
    if(tab==='tasks'){
      $('pane').innerHTML=`<p class="context-label">${name} · 演示任务</p>${c.tasks.length?c.tasks.map((t,i)=>`<div class="task-card">${lamp(t[1])}<div class="task-card-copy">${escapeHTML(t[0])}<small>原型演示 · 芝士S</small></div><button class="mini-button" data-task="${c.id}:${i}">打开</button></div>`).join(''):'<p class="empty">暂无演示任务</p>'}`; return;
    }
    if(tab==='document'){
      $('pane').innerHTML=`<p class="context-label">实况文档 · 原型说明</p><section class="proposal"><h3>侧栏频道行占位</h3><p>频道图标、频道名、状态区、操作区按四段排列。菜单放在行外，空间不足时向上展开。</p><p>本页只演示布局与交互，不修改产品，不写入真实项目数据。</p></section>`;return;
    }
    $('pane').innerHTML=`<p class="context-label">${name} · 演示对话<span class="mobile-hint">侧栏在上方</span></p>
      <article class="message"><span class="avatar ai message-avatar">S</span><div class="message-body"><div class="message-meta"><strong>芝士S</strong><span>原型说明</span></div><p>这版把 ⋯ 放进行尾的独立位置。名称很长时，先缩短名称；头像、状态灯和任务箭头不被覆盖。</p></div></article>
      <section class="proposal"><h3><span class="change-num">1</span>频道行四段布局</h3><ul><li>悬停时只显示 ⋯，头像和状态区不移动。</li><li>窄侧栏把多头像收成一个头像加数量。</li><li>触屏直接显示 ⋯，不用长按。</li></ul></section>
      <div class="task-card">${lamp('green',true)}<div class="task-card-copy">频道行原型<small>布局与交互演示</small></div><button class="mini-button" data-task="front:0">打开任务</button></div>
      <div id="demoMessages"></div><form class="composer" id="composer"><textarea id="draft" aria-label="原型演示消息" placeholder="输入一条演示消息，试试切换频道后的布局"></textarea><footer><span>仅留在当前页面</span><button type="submit">发送</button></footer></form>`;
    $('composer').addEventListener('submit',e=>{e.preventDefault();const text=$('draft').value.trim();if(!text)return;const p=document.createElement('p');p.className='proposal';p.textContent=text;$('demoMessages').append(p);$('draft').value='';announce('演示消息已显示，没有写入真实项目');});
  }
  function closeMenu(restore=false){const trigger=menuTrigger;menu.hidden=true;menuChannel=null;menuTrigger=null;document.querySelectorAll('.more').forEach(b=>b.setAttribute('aria-expanded','false'));if(restore&&trigger?.isConnected)trigger.focus();}
  function positionMenu(){
    if(menu.hidden||!menuTrigger)return;const rect=menuTrigger.getBoundingClientRect(),bounds=app.getBoundingClientRect(),height=menu.offsetHeight,width=menu.offsetWidth;
    const bottom=Math.min(bounds.bottom,window.innerHeight-8),up=bottom-rect.bottom<height+5&&rect.top>height+8;
    menu.style.left=Math.max(8,Math.min(rect.right-width,window.innerWidth-width-8))+'px';menu.style.top=Math.max(8,Math.min(up?rect.top-height-5:rect.bottom+5,window.innerHeight-height-8))+'px';menu.dataset.direction=up?'up':'down';
  }
  function openMenu(id,trigger){if(menuChannel===id&&!menu.hidden){closeMenu();return;}closeMenu();const c=byId(id);menuChannel=id;menuTrigger=trigger;trigger.setAttribute('aria-expanded','true');$('menuTitle').textContent=c.name;$('pinLabel').textContent=c.pinned?'取消置顶':'置顶频道';$('muteLabel').textContent=c.muted?'取消静音':'静音频道';menu.hidden=false;positionMenu();announce('已打开 '+c.name+' 的操作菜单');}
  function modal(title,copy){closeMenu();modalReturn=document.activeElement;$('modalTitle').textContent=title;$('modalCopy').textContent=copy;$('modalShade').hidden=false;$('closeModal').focus();}
  function closeModal(){$('modalShade').hidden=true;modalReturn?.focus();}
  $('closeModal').addEventListener('click',closeModal);$('modalShade').addEventListener('click',e=>{if(e.target===$('modalShade'))closeModal();});
  function setPreset(value){
    closeMenu();preset=value;app.classList.toggle('narrow',value==='narrow');app.classList.toggle('touch',value==='touch');
    document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===value)));renderChannels();
    const notes={normal:'悬停频道行，头像与状态灯不动；⋯ 在末尾显示。',hover:'前端频道保持悬停状态；⋯ 显示，但状态区不移动。',focus:'焦点已移到前端的 ⋯；按 Enter 打开菜单，按 Tab 继续。',menu:'前端菜单已展开；也可点侧栏最下方的 ⋯ 看向上翻。',narrow:'侧栏变窄，多头像收成一个头像加数量；名称先省略。',touch:'触屏下 ⋯ 常驻，操作按钮更大；不依赖悬停。'};$('annotation').textContent=notes[value];
    if(value==='focus')document.querySelector('[data-more="front"]').focus();
    if(value==='menu')openMenu('front',document.querySelector('[data-more="front"]'));
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(b?.dataset.more){openMenu(b.dataset.more,b);return;}
    if(!e.target.closest('#menu'))closeMenu();
    if(!b)return;
    if(b.dataset.preset){setPreset(b.dataset.preset);return;}
    if(b.dataset.channel){selected=b.dataset.channel;tab='chat';renderChannels();renderMain();announce('已切换到 '+byId(selected).name);return;}
    if(b.dataset.fold){const id=b.dataset.fold;expanded.has(id)?expanded.delete(id):expanded.add(id);renderChannels();document.querySelector(`[data-fold="${id}"]`).focus();announce((expanded.has(id)?'已展开':'已收起')+' '+byId(id).name+' 的任务');return;}
    if(b.dataset.task){const [id,index]=b.dataset.task.split(':');modal(byId(id).tasks[Number(index)][0],'这是任务详情的演示入口。实际任务内容和运行状态不会随原型变化。');return;}
    if(b.dataset.shell){modal(b.dataset.shell,'此入口属于完整界面背景，当前原型只调整频道行。');return;}
    if(b.dataset.nav){modal(b.dataset.nav,b.dataset.nav==='总览'?'演示总览入口；本次只评审频道行。':'演示资料库入口；本次只评审频道行。');return;}
    if(b.dataset.tab){tab=b.dataset.tab;renderMain();return;}
  });
  menu.addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(!b||!menuChannel)return;const c=byId(menuChannel),action=b.dataset.menu;if(action==='members'){modal(c.name+' · 成员',c.members.length+' 位演示成员，头像用于观察成员信息与行尾操作的占位。');return;}if(action==='read')c.unread=0;if(action==='pin')c.pinned=!c.pinned;if(action==='mute')c.muted=!c.muted;closeMenu();renderChannels();announce(action==='read'?c.name+' 已标为已读（仅原型）':action==='pin'?'置顶状态已切换（仅原型）':'静音状态已切换（仅原型）');});
  $('membersButton').addEventListener('click',()=>modal(byId(selected).name+' · 成员',byId(selected).members.length+' 位演示成员。频道行在窄模式只展示一个头像加数量，完整成员信息仍可从这里查看。'));
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!$('modalShade').hidden)closeModal();else if(!menu.hidden)closeMenu(true);return;}
    if(!menu.hidden&&e.target.closest('#menu')&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const buttons=[...menu.querySelectorAll('[role=menuitem]')],i=buttons.indexOf(document.activeElement);buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowDown'?1:buttons.length-1))%buttons.length].focus();}
    if(e.key==='ArrowDown'&&e.target.matches('[data-more]')){e.preventDefault();if(menu.hidden)openMenu(e.target.dataset.more,e.target);menu.querySelector('[role=menuitem]').focus();}
    if(e.key==='Tab'&&!$('modalShade').hidden){e.preventDefault();$('closeModal').focus();}
  });
  $('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').setAttribute('aria-pressed',String(dark));$('theme').textContent=dark?'切换浅色':'切换深色';});
  window.addEventListener('resize',positionMenu);document.addEventListener('scroll',positionMenu,true);
  renderChannels();renderMain();
  // 浏览器自检：走通折叠、切换、菜单与演示控件后恢复初始画面。
  requestAnimationFrame(()=>{
    console.assert(document.querySelectorAll('.channel-row').length===data.length,'频道数量不符');
    const fold=document.querySelector('[data-fold="front"]');fold.click();console.assert($('tasks-front').hidden,'收起失败');document.querySelector('[data-fold="front"]').click();console.assert(!$('tasks-front').hidden,'展开失败');
    document.querySelector('[data-channel="active"]').click();console.assert($('channelTitle').textContent==='active-agent','频道切换失败');document.querySelector('[data-channel="front"]').click();
    const more=document.querySelector('[data-more="slack"]');more.click();console.assert(!menu.hidden&&more.getAttribute('aria-expanded')==='true','打开菜单失败');closeMenu();console.assert(menu.hidden&&more.getAttribute('aria-expanded')==='false','关闭菜单失败');
    setPreset('narrow');console.assert(app.classList.contains('narrow'),'窄侧栏控件未绑定');setPreset('touch');console.assert(app.classList.contains('touch'),'触屏控件未绑定');setPreset('normal');
    document.querySelectorAll('.channel-row').forEach(row=>{const nodes=[...row.children],bounds=nodes.map(n=>n.getBoundingClientRect());console.assert(bounds.every((r,i)=>i===0||r.left>=bounds[i-1].right-.5),'频道四段发生重叠');});
    document.activeElement?.blur();announce('频道、任务折叠与菜单都能点击');window.__prototypeSelfTestPassed=true;
  });
})();
</script>
</body>
</html>
