name: Box uptime check

# The CHECK half of box monitoring (probe half: box-heartbeat.yml). Runs on a
# GitHub-HOSTED runner (so it still works when a box is down) and fails — which
# emails repo admins — when the latest heartbeat is stale or didn't complete
# green. Uses only `actions: read`, which GITHUB_TOKEN CAN hold; the previous
# design polled the runners API and 403'd on every run since birth
# (administration is not a grantable workflow permission).

on:
  schedule:
    - cron: '25 * * * *' # hourly, offset past the heartbeat + scheduler lag
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alert if the latest heartbeat is stale or red
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_json="$(gh api "/repos/$REPO/actions/workflows/box-heartbeat.yml/runs?per_page=1" \
            --jq '.workflow_runs[0] | {id, status, conclusion, created_at}')"
          if [ -z "$run_json" ] || [ "$run_json" = "null" ]; then
            echo "::error::no box-heartbeat runs found — is the probe workflow present?"
            exit 1
          fi
          echo "latest heartbeat: $run_json"
          created="$(echo "$run_json" | jq -r .created_at)"
          status="$(echo "$run_json" | jq -r .status)"
          conclusion="$(echo "$run_json" | jq -r '.conclusion // ""')"
          run_id="$(echo "$run_json" | jq -r .id)"
          age_s=$(( $(date +%s) - $(date -d "$created" +%s) ))
          # Freshness: hourly probe + GitHub scheduler lag → anything older than
          # 2h35m means heartbeats stopped landing at all.
          if [ "$age_s" -gt 9300 ]; then
            echo "::error::latest box heartbeat is $((age_s/60)) minutes old — heartbeats have stopped (Actions disabled? probe deleted?)"
            exit 1
          fi
          # A heartbeat still not finished 20 min after creation = a box's job
          # is stuck queued (its runner is offline / wedged).
          if [ "$status" != "completed" ] && [ "$age_s" -gt 1200 ]; then
            gh api "/repos/$REPO/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | "\(.name): \(.status) \(.conclusion // "")"' || true
            echo "::error::box heartbeat still '$status' after $((age_s/60)) min — a box runner is offline or wedged (see job list above)"
            exit 1
          fi
          if [ "$status" = "completed" ] && [ "$conclusion" != "success" ] && [ "$conclusion" != "" ]; then
            gh api "/repos/$REPO/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | "\(.name): \(.status) \(.conclusion // "")"' || true
            echo "::error::box heartbeat concluded '$conclusion' — a box failed its liveness job (see job list above)"
            exit 1
          fi
          echo "boxes look alive (heartbeat ${age_s}s old, status=$status conclusion=${conclusion:-in-flight})"
