name: Claude Code Review

# Two ways Claude engages with a PR:
#  - auto-review: on every PR open/update, Claude reviews the diff automatically.
#    This needs a `prompt` — without one, claude-code-action on a pull_request
#    event just waits for an "@claude" mention that never comes and exits doing
#    nothing (a green check that never actually reviewed).
#  - interactive: commenting "@claude ..." on a PR invokes Claude with that ask.
#    This path must NOT carry a prompt, or it would ignore what the human wrote.
# They're split into two jobs so each is unambiguous.
#
# auto-review's `pull_request` trigger is disabled below (2026-08-09, authorized
# by wangchangxin). Reason: the auto-review job fails on 100% of PRs regardless
# of the reviewed code — `Set up job` and `actions/checkout@v4` both succeed,
# it hangs at the third step, `anthropics/claude-code-action@v1` (root cause in
# that action never investigated). Immediate cause for disabling now: under
# two-stage acceptance, `_summarize_runs` treats any completed+failing check as
# an overall failure, so this permanently deadlocks every code-touching PR in
# `pr_open` (hit in #209, #210). A path filter (paths-ignore, commit 692c2d60)
# only spared doc-only PRs; code PRs kept deadlocking.
# To restore: once claude-code-action@v1 is fixed (or the failure root-caused),
# re-add a `pull_request:` block under `on:` (see the removed
# `types: [opened, synchronize, reopened]` + `paths-ignore` shape in git history
# for this file) — the `auto-review` job below is untouched and will pick the
# trigger back up as-is.

on:
  issue_comment:
    types: [created]

jobs:
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          prompt: |
            Review this pull request. Focus on real runtime bugs — crashes, data
            corruption, security holes, incorrect behavior — not style nits or
            theoretical concerns. Follow the repo's conventions in CLAUDE.md and
            the checklist in .claude/skills/cheese-py-code-review/SKILL.md. Leave concise,
            actionable inline comments on specific lines; if you find nothing
            substantive, say so in one line rather than inventing feedback.

  interactive:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
