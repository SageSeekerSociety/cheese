# Attachment Domain Schemas

Attachment:
  type: object
  description: File attachment
  properties:
    id:
      type: integer
      format: int64
      description: Attachment ID
    type:
      type: string
      description: Attachment type
      enum:
        - image
        - video
        - audio
        - file
    url:
      type: string
      description: Access URL
    meta:
      oneOf:
        - $ref: '../material/schemas.yaml#/ImageMeta'
        - $ref: '../material/schemas.yaml#/VideoMeta'
        - $ref: '../material/schemas.yaml#/AudioMeta'
        - $ref: '../material/schemas.yaml#/FileMeta'

LinkMeta:
  type: object
  description: Link metadata
  properties:
    title:
      type: string
      description: Page title
    abstract:
      type: string
      description: Page summary
    image:
      type: string
      description: Preview image URL
