# Group Domain Schemas (Legacy)

Group:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    intro:
      type: string
      default: ""
    avatarId:
      type: integer
      format: int64
    owner:
      $ref: '../user/schemas.yaml#/User'
    created_at:
      type: integer
      format: int64
    updated_at:
      type: integer
      format: int64
    member_count:
      type: integer
      format: int64
    question_count:
      type: integer
      format: int64
    answer_count:
      type: integer
      format: int64
    is_member:
      type: boolean
    is_owner:
      type: boolean
  required:
    - id
    - name
    - intro
    - avatarId

GroupTarget:
  type: object
  description: Group target/goal
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    intro:
      type: string
      default: ""
    created_at:
      type: integer
      format: int64
    start_date:
      type: integer
      format: int64
    end_date:
      type: integer
      format: int64
    attendance:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - monthly
  required:
    - id
    - name
    - intro

CreateGroupRequest:
  type: object
  properties:
    name:
      type: string
    intro:
      type: string
    avatarId:
      type: integer
      format: int64
  required:
    - name
