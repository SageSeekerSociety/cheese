# Topic Domain Schemas

Topic:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
  required:
    - id
    - name

TopicDetail:
  allOf:
    - $ref: '#/Topic'
    - type: object
      properties:
        description:
          type: string
        question_count:
          type: integer
          format: int64
        follower_count:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64

CreateTopicRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
  required:
    - name
