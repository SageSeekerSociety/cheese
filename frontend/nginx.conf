user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Paths only, never the query: a query can carry a credential (the room chat
    # socket's ?token=, /llm/tunnel?token=, /preview/tunnel?token=), and an access
    # log keeps it for as long as the journal does.
    log_format main '$remote_addr - $remote_user [$time_local] "$http_origin" - "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout 65;

    # Allow large file uploads (PDF, etc.)
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Compress even when a proxy sits in front of us. nginx decides a request is
    # "proxied" by the presence of a Via header, and the default for that case
    # is `off` — so the day anything upstream of this container starts adding
    # Via (an edge gateway, a CDN, a debugging proxy), every /api/ response
    # silently stops being compressed, with nothing in any log to say so.
    # Measured on the topics list: 10,116 B compressed vs 122,709 B without.
    # Nothing adds Via today and compression IS live in production — this is
    # bolting a rail onto a cliff nobody has walked off yet, not a repair.
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        # The type the `.mjs` location below declares. gzip_types matches
        # exactly, so without it the 1.2 MB pdf.js worker went out uncompressed.
        text/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # The scheme the browser used, for the office editor's own URLs: TLS usually
    # ends in front of this nginx, and an editor that believes it is on http
    # writes http links into an https page.
    map $http_x_forwarded_proto $office_editor_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # The docs' own server when they have a host of their own; empty otherwise.
    include /etc/nginx/docs/host.conf;

    # The platform, and every Host nobody else claims.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            # here allow the spa itself to control the route
            try_files $uri $uri/ /index.html ;
        }

        # 文档里嵌的动态演示（frontend/demo.html → src/demo-main.ts）：自己一个入口，
        # 不启动应用。没有这一段，/demo/seats 会落到上面的兜底 index.html，
        # iframe 里拉起的是整个平台。
        # Desktop installers and the updater manifest, copied into the image by
        # build.yml. A missing file must be a 404, never the SPA's index.html:
        # the desktop updater would read that page as its manifest.
        location ^~ /downloads/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location /demo/ {
            root /usr/share/nginx/html;
            try_files /demo.html =404;
            add_header Cache-Control "no-cache";
        }

        # The docs site: here under /docs/, or on a host of its own with /docs/
        # redirecting there. docker-entrypoint.sh picks which from DOCS_ORIGIN and
        # writes it from frontend/nginx/docs/.
        include /etc/nginx/docs/platform.conf;

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # .mjs, the third entry nginx's bundled mime.types does not carry (see
        # .md above and .webmanifest below). It matters more than those two,
        # because the browser does not merely mis-handle a module served as
        # application/octet-stream — it REFUSES it, and a refused module reads
        # as a network failure: "Failed to fetch dynamically imported module".
        # A library that ships its worker as .mjs (pdf.js) is dead on arrival.
        # A regex location is matched ahead of the /assets/ prefix above, so
        # this keeps that block's immutable caching and only fixes the type.
        location ~ ^/assets/.+\.mjs$ {
            root /usr/share/nginx/html;
            types { }
            default_type "text/javascript";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # PWA service worker: never cache it long. The SW is how a new deploy
        # reaches an already-installed client, so a stale cached sw.js would
        # freeze users on an old build. Service-Worker-Allowed lets it claim
        # the whole origin ('/') as its scope.
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        # The push handlers sw.js pulls in with importScripts. Same no-cache
        # rule and the same reason: it is part of the worker, and a stale copy
        # would keep showing whatever the last build's notification code did.
        # Not content-hashed, because importScripts names it by a fixed path.
        location = /push-sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # Web app manifest: nginx's default mime.types has no .webmanifest entry,
        # so set the correct content-type; no-cache so manifest edits (icons,
        # theme color) take effect on the next load rather than a week later.
        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # One rule for the whole API: strip the /api segment and pass it on.
        # __API_UPSTREAM__ is substituted by docker-entrypoint.sh from
        # API_UPSTREAM (default backend:8081, the compose service). A box that
        # deploys without downtime sets it to the host's :8081 instead, where
        # api-front (deploy/llm-tunnel) moves traffic between the old and the
        # new backend; talking to the compose name would pin this container to
        # whichever backend existed when nginx resolved it.
        # Task metadata and private snapshot bundles require the backend's
        # database and object store. Native Git uses the project's forge.
        location ~ ^/api/(projects/[^/]+/git/|sandbox/forge/) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://__API_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            # Private snapshots can include large unfinished binary files.
            client_max_body_size 2g;
            # Bound each backup download's share of the box's uplink.
            proxy_max_temp_file_size 0;
            limit_rate 20m;
            # Allow large backup uploads and downloads to finish.
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
        }

        location /forge/ {
            proxy_pass http://__FORGEJO_UPSTREAM__/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 2g;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
        }

        location /api/forge/events/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://__FORGE_EVENTS_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 5M;
        }

        # The office editor (OnlyOffice Document Server). Resolved per request so
        # a deployment without it still starts; the editor then answers 502 and
        # the room says the editor is unreachable. X-Forwarded-Host carries the
        # mount point: the editor builds its own asset and save URLs from it.
        location /office-editor/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $office_editor __OFFICE_EDITOR_UPSTREAM__;
            rewrite ^/office-editor/(.*)$ /$1 break;
            proxy_pass http://$office_editor;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host/office-editor;
            proxy_set_header X-Forwarded-Proto $office_editor_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 100M;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://__API_UPSTREAM__/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Agent SSE/WS streams outlive the 60s default.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 知是 2.0 connector plane: device enrollment (install.sh, cheesehost),
        # device↔hub WebSockets, live-screen (现场) viewers. The backend serves
        # /connector/* natively, so NO path strip here (unlike /api/ above).
        location = /connector/agent {
            proxy_pass http://__DEVICE_CONNECTION_UPSTREAM__/connector/agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        location ~ ^/connector/session/[^/]+/screen$ {
            proxy_pass http://__DEVICE_CONNECTION_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        location ~ ^/api/topics/[^/]+/execution/[^/]+$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://__DEVICE_CONNECTION_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
        }

        # The collaboration service: every living document, live, over one
        # WebSocket per editor. Resolved per request, like the office editor, so
        # nginx starts before it does. Its /internal routes take writes from
        # the backend only, and are not served here at all.
        location /collab/internal {
            return 404;
        }
        location /collab {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $collab __COLLAB_UPSTREAM__;
            rewrite ^/collab/?(.*)$ /$1 break;
            proxy_pass http://$collab;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            # A document stays open as long as its tab does.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /connector/ {
            proxy_pass http://__API_UPSTREAM__/connector/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Device hub + 现场 terminals hold WebSockets open for hours.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
