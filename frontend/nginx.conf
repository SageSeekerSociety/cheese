user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$http_origin" - "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout 65;

    # Allow large file uploads (PDF, etc.)
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Compress even when a proxy sits in front of us. nginx decides a request is
    # "proxied" by the presence of a Via header, and the default for that case
    # is `off` — so the day anything upstream of this container starts adding
    # Via (an edge gateway, a CDN, a debugging proxy), every /api/ response
    # silently stops being compressed, with nothing in any log to say so.
    # Measured on the topics list: 10,116 B compressed vs 122,709 B without.
    # Nothing adds Via today and compression IS live in production — this is
    # bolting a rail onto a cliff nobody has walked off yet, not a repair.
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            # here allow the spa itself to control the route
            try_files $uri $uri/ /index.html ;
        }

        # 用户说明书 (docs/manual, built by `task docs:build` into public/docs).
        # VitePress 开了 cleanUrls：它写出 quickstart.html 而链接指向
        # /docs/quickstart。没有 $uri.html 这一段，这个请求会落到上面那条
        # try_files 的兜底 /index.html 上 —— 读者按着我们自己发出去的链接点进来,
        # 看到的是这个应用而不是那一页文档,而且不会有任何报错。
        location /docs/ {
            root /usr/share/nginx/html;
            try_files $uri $uri.html $uri/index.html =404;
        }

        # 每页的 .md 双胞胎。nginx 自带的 mime.types 里没有 .md,不声明的话它是
        # application/octet-stream —— 浏览器直接下载,而抓取这一页的模型也吃不到
        # 「content-type 是 text/markdown 就直接读原文」的那条快路。
        # 空 `types {}` 加 default_type 只影响这一个 location,不动全局的类型表。
        location ~ ^/docs/.+\.md$ {
            root /usr/share/nginx/html;
            types { }
            default_type "text/markdown; charset=utf-8";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # PWA service worker: never cache it long. The SW is how a new deploy
        # reaches an already-installed client, so a stale cached sw.js would
        # freeze users on an old build. Service-Worker-Allowed lets it claim
        # the whole origin ('/') as its scope.
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        # Web app manifest: nginx's default mime.types has no .webmanifest entry,
        # so set the correct content-type; no-cache so manifest edits (icons,
        # theme color) take effect on the next load rather than a week later.
        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # One rule for the whole API: strip the /api segment and pass it on.
        # __API_UPSTREAM__ is substituted by docker-entrypoint.sh from
        # API_UPSTREAM (default backend:8081, the compose service). A box that
        # deploys without downtime sets it to the host's :8081 instead, where
        # api-front (deploy/llm-tunnel) moves traffic between the old and the
        # new backend; talking to the compose name would pin this container to
        # whichever backend existed when nginx resolved it.
        location /api/ {
            proxy_pass http://__API_UPSTREAM__/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Agent SSE/WS streams outlive the 60s default.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 知是 2.0 connector plane: device enrollment (install.sh, cheesehost),
        # device↔hub WebSockets, live-screen (现场) viewers. The backend serves
        # /connector/* natively, so NO path strip here (unlike /api/ above).
        location = /connector/agent {
            proxy_pass http://__DEVICE_CONNECTION_UPSTREAM__/connector/agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        location ~ ^/connector/session/[^/]+/screen$ {
            proxy_pass http://__DEVICE_CONNECTION_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        location /connector/ {
            proxy_pass http://__API_UPSTREAM__/connector/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Device hub + 现场 terminals hold WebSockets open for hours.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
