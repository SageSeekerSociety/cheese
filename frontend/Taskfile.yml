version: '3'

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml
    generates:
      - node_modules/**/*
  dev:
    desc: Start Vite dev server
    deps: [install]
    cmds:
      - pnpm run dev
  build:
    desc: Build frontend for production
    deps: [install]
    cmds:
      - pnpm run build
    sources:
      - src/**/*
      - vite.config.*
      - tsconfig*.json
    generates:
      - dist/**/*
  # `lint` CHECKS, `lint:fix` writes. They used to be one script (`eslint . --fix`),
  # so `task check` — the thing you run to find out whether your tree is clean —
  # rewrote the tree it was inspecting, and CI could never use it as a gate.
  lint:
    desc: Run ESLint (check only, never writes)
    deps: [install]
    cmds:
      - pnpm run lint
  lint:fix:
    desc: Run ESLint and apply fixes
    deps: [install]
    cmds:
      - pnpm run lint:fix
  typecheck:
    desc: Run vue-tsc type check
    deps: [install]
    cmds:
      - pnpm exec vue-tsc --noEmit
    sources:
      - src/**/*.{ts,tsx,vue}
      - tsconfig*.json
  test:
    desc: Run vitest
    deps: [install]
    cmds:
      - pnpm run test -- --run
  check:
    desc: Run all frontend checks (lint + typecheck + build)
    cmds:
      - task: lint
      - task: typecheck
      - task: build
