version: '3'

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml
    generates:
      - node_modules/**/*
  dev:
    desc: Start Vite dev server
    deps: [install]
    cmds:
      - pnpm run dev
  build:
    desc: Build frontend for production
    deps: [install]
    cmds:
      - pnpm run build
    sources:
      - src/**/*
      - vite.config.*
      - tsconfig*.json
    generates:
      - dist/**/*
  lint:
    desc: Run ESLint
    deps: [install]
    cmds:
      - pnpm run lint
  typecheck:
    desc: Run vue-tsc type check
    deps: [install]
    cmds:
      - pnpm exec vue-tsc --noEmit
    sources:
      - src/**/*.{ts,tsx,vue}
      - tsconfig*.json
  test:
    desc: Run vitest
    deps: [install]
    cmds:
      - pnpm run test -- --run
  check:
    desc: Run all frontend checks (lint + typecheck + build)
    cmds:
      - task: lint
      - task: typecheck
      - task: build
