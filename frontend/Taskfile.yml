version: '3'

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml
    generates:
      - node_modules/**/*
  dev:
    desc: Start Vite dev server
    deps: [install]
    cmds:
      - pnpm run dev
  dev:collab:
    desc: Start the collaboration service against the dev backend
    deps: [install]
    env:
      COLLAB_SECRET: '{{.COLLAB_SECRET | default "dev-collab-secret"}}'
      COLLAB_BACKEND_URL: '{{.COLLAB_BACKEND_URL | default "http://127.0.0.1:8081"}}'
    cmds:
      - pnpm run build:collab
      - node dist-collab/main.mjs
  build:
    desc: Build frontend for production
    deps: [install]
    cmds:
      - pnpm run build
    sources:
      - src/**/*
      - vite.config.*
      - tsconfig*.json
    generates:
      - dist/**/*
  # `lint` CHECKS, `lint:fix` writes. They used to be one script (`eslint . --fix`),
  # so `task check` — the thing you run to find out whether your tree is clean —
  # rewrote the tree it was inspecting, and CI could never use it as a gate.
  lint:
    desc: Run ESLint (check only, never writes)
    deps: [install]
    cmds:
      - pnpm run lint
  lint:fix:
    desc: Run ESLint and apply fixes
    deps: [install]
    cmds:
      - pnpm run lint:fix
  # Design-system gate: no hardcoded colours, radii on the 6/8/12/999 ladder.
  # Ratcheted against stylelint-baseline.json (537 pre-existing violations are
  # frozen; only NEW ones fail) — see docs/design-system.md. Read-only, like
  # `lint:check` above and for the same reason; `lint:style:fix` is the writer.
  lint:style:
    desc: Run stylelint design-token ratchet (check only, never writes)
    deps: [install]
    cmds:
      - pnpm run lint:style
  lint:style:fix:
    desc: Run stylelint and apply fixes
    deps: [install]
    cmds:
      - pnpm run lint:style:fix
  # Components take props and emit events. Nothing under src/components/** may
  # import the network layer (@/api, @/services/*, @/network/*) or vue-router —
  # a component that fetches cannot be tested or reused without a server.
  # Ratcheted: 66 violations across 54 components
  # (import-boundary-baseline.json) are frozen, so only NEW ones fail.
  # Writer: `pnpm run lint:boundary:update`. Read-only, like `lint:style`.
  lint:boundary:
    desc: Check component import boundaries (eslint + ratchet, check only)
    deps: [install]
    cmds:
      - pnpm run lint:boundary
  # Every page the router reaches and every panel under src/components/panels/
  # must render with no backend, no route and no business store. Ratcheted:
  # 20 are standalone-ready today (scene-baseline.json) and may not stop; a
  # scene added from now on has to be from its first commit. 137 pre-existing
  # debt entries may only shrink. Writer: `pnpm run lint:scenes:update`.
  # Needs no install: it is python3 stdlib, and grades with the same module
  # arch-metrics.py reports from.
  lint:scenes:
    desc: Check scenes render standalone (python ratchet, check only)
    cmds:
      - pnpm run lint:scenes
  typecheck:
    desc: Run vue-tsc type check
    deps: [install]
    cmds:
      - pnpm exec vue-tsc --noEmit
    sources:
      - src/**/*.{ts,tsx,vue}
      - tsconfig*.json
  test:
    desc: Run vitest
    deps: [install]
    cmds:
      - pnpm exec vitest run
  # `lint` above autofixes, which is right at a keyboard and wrong in a gate:
  # it can rewrite the file and exit 0 on a violation that CI (which never
  # passes --fix) still reports. Keeping the two apart is what makes
  # `task fe:check` and .github/workflows/frontend.yml agree.
  lint:check:
    desc: Run ESLint without autofix (what CI runs)
    deps: [install]
    cmds:
      - pnpm exec eslint .
  check:
    desc: Run all frontend checks (lint + boundaries + scenes + style + typecheck + test + build)
    cmds:
      - task: lint:check
      - task: lint:boundary
      - task: lint:scenes
      - task: lint:style
      - task: typecheck
      - task: test
      - task: build
