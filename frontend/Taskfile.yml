version: '3'

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml
      - patches/*
    generates:
      - node_modules/**/*
  dev:
    desc: Start Vite dev server
    deps: [install]
    cmds:
      - pnpm run dev
  dev:collab:
    desc: Start the collaboration service against the dev backend
    deps: [install]
    env:
      COLLAB_SECRET: '{{.COLLAB_SECRET | default "dev-collab-secret"}}'
      COLLAB_BACKEND_URL: '{{.COLLAB_BACKEND_URL | default "http://127.0.0.1:8081"}}'
    cmds:
      - pnpm run build:collab
      - node dist-collab/main.mjs
  build:
    desc: Build frontend for production
    deps: [install]
    cmds:
      - pnpm run build
    sources:
      - src/**/*
      - vite.config.*
      - tsconfig*.json
    generates:
      - dist/**/*
  # `lint` CHECKS, `lint:fix` writes. They used to be one script (`eslint . --fix`),
  # so `task check` — the thing you run to find out whether your tree is clean —
  # rewrote the tree it was inspecting, and CI could never use it as a gate.
  lint:
    desc: Run ESLint (check only, never writes)
    deps: [install]
    cmds:
      - pnpm run lint
  lint:fix:
    desc: Run ESLint and apply fixes
    deps: [install]
    cmds:
      - pnpm run lint:fix
  # Design-system gate: any hardcoded colour fails. Read-only; lint:style:fix
  # keeps the existing autofix entry for style rules. See docs/design-system.md.
  lint:style:
    desc: Check stylelint design tokens (check only, never writes)
    deps: [install]
    cmds:
      - pnpm run lint:style
  lint:style:fix:
    desc: Run stylelint and apply fixes
    deps: [install]
    cmds:
      - pnpm run lint:style:fix
  # Components take props and emit events. Nothing under src/components/** may
  # import the network layer (@/api, @/services/*, @/network/*) or vue-router —
  # a component that fetches cannot be tested or reused without a server.
  # Any violation fails; there is no baseline. Read-only, like `lint:style`.
  lint:boundary:
    desc: Check component import boundaries (eslint, check only)
    deps: [install]
    cmds:
      - pnpm run lint:boundary
  # Nothing under src/ may reference localStorage or sessionStorage directly:
  # src/lib/browserStorage.ts is the one place that accepts their failure modes
  # (private mode, a full quota, no storage at all) and never throws.
  # Any reference fails; there is no baseline. Read-only, like `lint:style`.
  lint:storage:
    desc: Check for direct Web Storage access (eslint, check only)
    deps: [install]
    cmds:
      - pnpm run lint:storage
  # A component calls a bare name it binds nothing for, and a module in this tree
  # declares that name and exports it to nobody: the call does not fail, it
  # reaches the browser global of the same name and does nothing — which is what
  # a function moved into a composable and left unexported looks like. The base
  # eslint config cannot see it (it injects the browser globals and turns
  # `no-undef` off for TS), the type check cannot (`lib.dom` declares the same
  # names), and a template's calls are in no scope at all, so the rule reads
  # both halves itself with `vue-eslint-parser`.
  # Not ratcheted: 0 findings over the tree the day it landed, so there is no
  # baseline and no writer. Read-only, like `lint:style`.
  lint:global-fallback:
    desc: Check bare calls to a name a module keeps to itself (check only)
    deps: [install]
    cmds:
      - pnpm run lint:global-fallback
  # Every page the router reaches and every panel under src/components/panels/
  # must render with no backend, no route and no business store. Ratcheted
  # against the tree at the merge base with origin/main: a scene that is
  # standalone-ready there may not stop being, and a scene added from now on
  # has to be from its first commit. Nothing is written down, so there is no
  # writer. Needs no install: it is python3 stdlib, and grades with the same
  # module arch-metrics.py reports from.
  lint:scenes:
    desc: Check scenes render standalone (python ratchet, check only)
    cmds:
      - pnpm run lint:scenes
  lint:scene-debt:
    desc: Check child edges, route reads and legacy network imports only shrink
    deps: [install]
    cmds:
      - pnpm run lint:scene-debt
  typecheck:
    desc: Run the vue-tsc check, failing on any error (the API types are generated first)
    deps: [install]
    # Not `vue-tsc --noEmit`: the types it compiles against are generated
    # rather than committed, so a bare run on a checkout that has not run the
    # type check yet reports four TS2307 cannot-find-module errors for it.
    # Same command as the CI job's, which is what makes `task fe:check` and
    # .github/workflows/frontend.yml agree; CI does not skip the task on an
    # unchanged tree and this one does, so every input is listed below.
    cmds:
      - pnpm run typecheck
    sources:
      - src/**/*.{ts,tsx,vue}
      # Uncounted until now: a spec reads a locale catalog or a fixture with
      # readFileSync, and the type check compiles the `import ... from '*.json'`
      # beside it. Changing one changes the verdict, and the task reported
      # "up to date" on the old hash.
      - src/**/*.json
      - tsconfig*.json
      # The type check reads more than the sources it compiles: its own
      # scripts, and the API types, which are generated from a
      # document the backend builds out of its own app — so the backend's source
      # tree is an input, not one committed file standing in for it. Changing any
      # of them changes the verdict.
      - scripts/typecheck.mjs
      - scripts/gen-api-types.mjs
      - scripts/tsc-ratchet.mjs
      - scripts/tsc-ratchet-core.mjs
      - scripts/ratchet-report.mjs
      - ../backend/app/**
      - ../backend/scripts/export_openapi.py
      - ../backend/pyproject.toml
      - ../backend/uv.lock
  test:
    desc: Run vitest
    deps: [install]
    cmds:
      - pnpm exec vitest run
  # `lint` above autofixes, which is right at a keyboard and wrong in a gate:
  # it can rewrite the file and exit 0 on a violation that CI (which never
  # passes --fix) still reports. Keeping the two apart is what makes
  # `task fe:check` and .github/workflows/frontend.yml agree.
  lint:check:
    desc: Run ESLint without autofix (what CI runs)
    deps: [install]
    cmds:
      - pnpm exec eslint .
  check:
    desc: Run all frontend checks (lint + boundaries + scenes + catalog + style + typecheck + test + build)
    cmds:
      - task: lint:check
      - task: lint:boundary
      - task: lint:storage
      - task: lint:global-fallback
      - task: lint:scenes
      - task: lint:scene-debt
      - task: lint:style
      - task: typecheck
      - task: test
      - task: build
