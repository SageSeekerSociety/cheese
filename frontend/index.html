<!doctype html>
<html lang="zh-CN" class="overflow-y-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- `interactive-widget=resizes-content`: 软键盘弹出来时把布局视口一起缩掉,
         于是 100% / dvh / 底部的输入框全都自己让开。不写这一条的默认行为是只缩
         "看得见的那块"(visual viewport),页面自己毫不知情,输入框留在键盘底下。
         不认这个键的浏览器(Safari)照旧走 lib/keyboardInset.ts 那条 JS 路。

         `viewport-fit=cover`: 不写这一条,Safari 会把整页缩进安全区里画(刘海、
         Home 横杠那两圈都空出来),`env(safe-area-inset-*)` 于是恒为 0 —— 全仓那
         些输入区/底栏/弹窗的让位规则全都成了死代码。写了它,页面铺满整屏,
         `env()` 才报出真正的数值,由各个贴边的元素自己让开。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- Updated at runtime by src/theme.ts when the theme changes; this value
         is the light one, matching META_THEME_COLOR in that file. -->
    <meta name="theme-color" content="#F57F17" />
    <title>Cheese</title>
    <link rel="stylesheet" href="/src/styles/common.scss" />

    <!--
      Anti-flash boot script. MUST stay inline, synchronous, and above the
      stylesheet imports the bundle pulls in: it has to stamp `data-theme` on
      <html> before the browser paints the first frame. Move it into main.ts and
      a dark-mode user gets a full white flash on every cold load, because the
      module graph does not execute until after first paint.

      This duplicates ~6 lines of src/theme.ts on purpose — that module cannot be
      used here without becoming a render-blocking network request, which is the
      exact cost we are avoiding. Keep the storage key ('cheesex.theme') and the
      two colours in sync with THEME_STORAGE_KEY / META_THEME_COLOR there.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('cheesex.theme')
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#141517')
          }
        } catch (e) {
          // Any failure here must leave the app usable, so fall back to light
          // rather than letting an exception block the parser.
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <!--
      Boot splash, desktop app only. The app opens on its own page
      (desktop/shell/index.html) and hands the window over with the rail's home
      tile in the middle; this paints the same tile as the first frame, so the
      switch between the two pages does not show. lib/desktopSplash.ts then lands
      it in the rail. Keep the tile identical to the one in desktop/shell. The
      grounds are --canvas of both themes, set before style.css has loaded; the
      tile is brand paint, the same in both.
    -->
    <style>
      #boot-splash {
        display: none;
      }
      html.in-desktop-app #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #f7f8fa;
      }
      html.in-desktop-app[data-theme='dark'] #boot-splash {
        background: #141517;
      }
      #boot-splash .boot-tile {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 18.67px;
        background: #ffa20f;
      }
      #boot-splash svg {
        position: absolute;
        inset: 18.67px;
        width: 74.67px;
        height: 74.67px;
      }
    </style>
    <script>
      if (window.__TAURI__) {
        document.documentElement.classList.add('in-desktop-app')
        // Should the app never come up, the page underneath is still better than the tile.
        setTimeout(function () {
          var splash = document.getElementById('boot-splash')
          if (splash) splash.remove()
        }, 15000)
      }
    </script>
    <!--
      Cold-start skeleton shell. The served HTML paints this before the bundle
      arrives, so a slow link shows the app taking shape instead of a ~20s pure
      white screen (measured 400 kbit/s). Entirely inline — no extra request, no
      external font, small markup — so it never delays the first paint.
      `src/main.ts` removes the node the moment Vue mounts.

      The colours are literals copied from the design tokens in `src/style.css`
      (--canvas / --surface / --line / --line-2 / --fill-2 / --fill / --accent).
      They have to be literals: that sheet ships inside the bundle and is not
      here yet. Dark follows `html[data-theme]`, which the boot script above has
      already resolved from the stored preference AND prefers-color-scheme before
      the first paint, so an explicit "light" on a dark machine stays light. The
      prefers-color-scheme block is the scripting-off fallback and carries the
      same values; keep the two in step.
    -->
    <style>
      #sx-boot-skeleton,
      #sx-boot-skeleton * {
        box-sizing: border-box;
      }
      #sx-boot-skeleton {
        --sx-canvas: #f7f8fa;
        --sx-surface: #ffffff;
        --sx-line: #ecedef;
        --sx-bone: #eeeff1;
        --sx-bone-rail: #e2e3e6;
        --sx-sheen: #f4f5f7;
        --sx-accent: #f57f17;
        position: fixed;
        inset: 0;
        z-index: 2147483000; /* one below the desktop boot splash */
        display: flex;
        overflow: hidden;
        background: var(--sx-canvas);
      }
      html[data-theme='dark'] #sx-boot-skeleton {
        --sx-canvas: #141517;
        --sx-surface: #1b1d20;
        --sx-line: #2b2e33;
        --sx-bone: #282c31;
        --sx-bone-rail: #3a3e45;
        --sx-sheen: #212429;
        --sx-accent: #ffa733;
      }
      /* No script has run, so <html> carries no data-theme yet: follow the OS. */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #sx-boot-skeleton {
          --sx-canvas: #141517;
          --sx-surface: #1b1d20;
          --sx-line: #2b2e33;
          --sx-bone: #282c31;
          --sx-bone-rail: #3a3e45;
          --sx-sheen: #212429;
          --sx-accent: #ffa733;
        }
      }
      /* Left rail: a 56px column of rounded tile placeholders; the top one is the
         brand mark, so it carries the amber. */
      #sx-boot-skeleton .sx-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        flex: none;
        width: 56px;
        padding: 12px 0;
        border-right: 1px solid var(--sx-line);
      }
      #sx-boot-skeleton .sx-icon {
        display: block;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--sx-bone-rail);
      }
      #sx-boot-skeleton .sx-icon--brand {
        background: var(--sx-accent);
        opacity: 0.85;
      }
      /* Secondary sidebar: the app's default width, rows of running text. */
      #sx-boot-skeleton .sx-side {
        flex: none;
        width: 210px;
        padding: 14px 12px;
        border-right: 1px solid var(--sx-line);
      }
      #sx-boot-skeleton .sx-side .sx-bone {
        height: 12px;
        margin-bottom: 12px;
        background: var(--sx-bone-rail);
      }
      /* Content pane: a title bar and two card blocks, on --surface. */
      #sx-boot-skeleton .sx-main {
        flex: 1 1 auto;
        min-width: 0;
        padding: 16px 20px;
        background: var(--sx-surface);
      }
      #sx-boot-skeleton .sx-title {
        height: 18px;
        width: 40%;
        margin-bottom: 8px;
      }
      #sx-boot-skeleton .sx-sub {
        height: 12px;
        width: 24%;
        margin-bottom: 18px;
      }
      #sx-boot-skeleton .sx-card {
        border: 1px solid var(--sx-line);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
      }
      #sx-boot-skeleton .sx-card .sx-bone {
        height: 11px;
        margin-bottom: 10px;
      }
      #sx-boot-skeleton .sx-card .sx-bone:last-child {
        margin-bottom: 0;
      }
      #sx-boot-skeleton .sx-w50 {
        width: 50%;
      }
      #sx-boot-skeleton .sx-w60 {
        width: 60%;
      }
      #sx-boot-skeleton .sx-w70 {
        width: 70%;
      }
      #sx-boot-skeleton .sx-w75 {
        width: 75%;
      }
      #sx-boot-skeleton .sx-w85 {
        width: 85%;
      }
      #sx-boot-skeleton .sx-w90 {
        width: 90%;
      }
      /* The bones, and the "still coming" sign: a light sweep across each one,
         1.4s a cycle, the same motion the in-app LoadingSkeleton uses. */
      #sx-boot-skeleton .sx-bone {
        position: relative;
        overflow: hidden;
        display: block;
        border-radius: 6px;
        background: var(--sx-bone);
      }
      #sx-boot-skeleton .sx-bone::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--sx-sheen), transparent);
        animation: sx-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes sx-shimmer {
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sx-boot-skeleton .sx-bone::after {
          animation: none;
          background: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-tile">
        <svg viewBox="0 0 1000 1000" aria-hidden="true">
          <mask id="boot-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect width="1000" height="1000" fill="#fff" />
            <g fill="#000">
              <path d="M156.6 810.9Q167.7 793.7 186.8 775.5Q193.7 768.8 210.1 757.9Q210.2 757.8 210.3 757.8L212.2 756.5L212.2 756.5Q212.3 756.5 212.3 756.5Q213.4 755.7 216.4 754Q216.5 753.9 216.6 753.9Q229.2 746.5 233.3 741Q233.3 741 233.4 741Q233.4 741 233.4 741Q240.4 731.5 239.7 715.8Q221.6 715.8 208.2 712.2Q208.1 712.2 208.1 712.2Q193.6 708.3 178.7 698.8Q178.7 698.7 178.6 698.7C169.1 692.6 160 684.6 152.5 675Q152.4 675 152.4 674.9C144.9 665.4 138.9 654.5 135.6 642.5Q135.5 642.4 135.5 642.3C126.7 610.1 130.8 577.2 154.2 554.4Q154.4 554.2 154.6 554Q171.6 537.7 193.4 533.8Q212.5 530.4 239.7 536.2Q238.4 533.4 237.7 530.6Q236.3 524.6 238.2 518.7Q238.7 517.3 239.3 516C241.3 511.8 244.6 508.1 248.9 504.9Q249 504.8 249.1 504.8Q249.1 504.8 249.2 504.7C262.7 494.9 297.9 504.6 312.3 513.1Q330.6 524.1 340.3 534.8Q346.1 541.2 352.6 552.9C355.7 558.4 358.8 564 364.1 570.2Q398.7 568.2 416.9 568.7L416.9 568.7Q417.2 568.7 417.3 568.7Q425.4 568.9 431.6 568.9Q461.7 568.9 490.5 570.6Q496.1 570.9 498.1 575.6C499.7 580.2 500.3 585.6 500.3 591.3Q500.3 603.6 496.7 621.9C494.9 630.9 492.6 639.6 490.2 646.9Q490.2 647 490.1 647.1Q490.1 647.2 490.1 647.3C487.7 654.6 485.4 660.5 483.5 663.8Q471.4 685.9 432.6 732.7Q409.2 760.8 401.6 808.4Q397.2 836.2 398.8 861.3Q402.2 913.6 408.4 935C409.6 939.3 411.1 943.8 412.7 948.5Q413.7 951.9 412.1 955.1Q410.5 958.4 407 959.6Q405.3 960.2 403.5 960.1C370.3 953.1 338.3 942.7 308 929.1Q307.6 928.9 307.2 928.7Q306.7 928.6 306.4 928.4C249.9 902.8 199.4 866.4 157.5 821.8Q155.5 819.6 155.2 816.6Q154.9 813.5 156.6 810.9Z" />
              <circle cx="641.3" cy="602.7" r="34" />
              <circle cx="743" cy="500.7" r="56" />
              <circle cx="712.7" cy="290.9" r="92" />
            </g>
          </mask>
          <g fill="#23242a">
            <circle cx="500" cy="500" r="470" mask="url(#boot-holes)" />
            <circle cx="399" cy="618" r="14.1" />
          </g>
        </svg>
      </div>
    </div>
    <!-- The skeleton shell itself: left rail, sidebar column, content column.
         Decorative only (aria-hidden) — it is replaced by the real app on mount,
         and a screen reader that arrives that early is told nothing rather than
         a shape it cannot use. Removed in src/main.ts. -->
    <div id="sx-boot-skeleton" aria-hidden="true">
      <div class="sx-rail">
        <span class="sx-icon sx-icon--brand"></span>
        <span class="sx-icon"></span>
        <span class="sx-icon"></span>
        <span class="sx-icon"></span>
        <span class="sx-icon"></span>
      </div>
      <div class="sx-side">
        <span class="sx-bone sx-w70"></span>
        <span class="sx-bone sx-w85"></span>
        <span class="sx-bone sx-w50"></span>
        <span class="sx-bone sx-w85"></span>
        <span class="sx-bone sx-w70"></span>
        <span class="sx-bone sx-w85"></span>
      </div>
      <div class="sx-main">
        <span class="sx-bone sx-title"></span>
        <span class="sx-bone sx-sub"></span>
        <div class="sx-card">
          <span class="sx-bone sx-w60"></span>
          <span class="sx-bone sx-w90"></span>
          <span class="sx-bone sx-w75"></span>
        </div>
        <div class="sx-card">
          <span class="sx-bone sx-w60"></span>
          <span class="sx-bone sx-w90"></span>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
