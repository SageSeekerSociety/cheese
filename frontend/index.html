    <!-- `interactive-widget=resizes-content`: 软键盘弹出来时把布局视口一起缩掉,
         于是 100% / dvh / 底部的输入框全都自己让开。不写这一条的默认行为是只缩
         "看得见的那块"(visual viewport),页面自己毫不知情,输入框留在键盘底下。
         不认这个键的浏览器(Safari)照旧走 lib/keyboardInset.ts 那条 JS 路。

         `viewport-fit=cover`: 不写这一条,Safari 会把整页缩进安全区里画(刘海、
         Home 横杠那两圈都空出来),`env(safe-area-inset-*)` 于是恒为 0 —— 全仓那
         些输入区/底栏/弹窗的让位规则全都成了死代码。写了它,页面铺满整屏,
         `env()` 才报出真正的数值,由各个贴边的元素自己让开。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- Updated at runtime by src/theme.ts when the theme changes; this value
         is the light one, matching META_THEME_COLOR in that file. -->
    <meta name="theme-color" content="#F57F17" />
    <!-- The oldest build an open page may keep running. A page whose own value is
         below the one the server now serves asks to be refreshed (src/pwa.ts,
         promptIfBelowMinBuild); ordinary releases leave it alone and swap in at the
         next navigation. A pull request that fixes a severe bug raises it to one more
         than the highest value main has ever carried (`git log -p -S cx-min-build
         -- frontend/index.html`), not one more than the current value: a revert can
         lower it, and a build that carried the reverted number must still read as
         older than the next fix. -->
    <meta name="cx-min-build" content="1" />

    <!--
      Anti-flash boot script. MUST stay inline, synchronous, and above the
      stylesheet imports the bundle pulls in: it has to stamp `data-theme` on
      <html> before the browser paints the first frame. Move it into main.ts and
      a dark-mode user gets a full white flash on every cold load, because the
      module graph does not execute until after first paint.

      This duplicates ~6 lines of src/theme.ts on purpose — that module cannot be
      used here without becoming a render-blocking network request, which is the
      exact cost we are avoiding. Keep the storage key ('cheesex.theme') and the
      two colours in sync with THEME_STORAGE_KEY / META_THEME_COLOR there.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('cheesex.theme')
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#141517')
          }
        } catch (e) {
          // Any failure here must leave the app usable, so fall back to light
          // rather than letting an exception block the parser.
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <!--
      Boot splash, desktop app only. The app opens on its own page
      (desktop/shell/index.html) and hands the window over with the rail's home
      tile in the middle; this paints the same tile as the first frame, so the
      switch between the two pages does not show. lib/desktopSplash.ts then lands
      it in the rail. Keep the tile identical to the one in desktop/shell. The
      grounds are --canvas of both themes, set before style.css has loaded; the
      tile is brand paint, the same in both.
    -->
    <style>
      #boot-splash {
        display: none;
      }
      html.in-desktop-app #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #f7f8fa;
      }
      html.in-desktop-app[data-theme='dark'] #boot-splash {
        background: #141517;
      }
      #boot-splash .boot-tile {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 18.67px;
        background: #ffa20f;
      }
      #boot-splash svg {
        position: absolute;
        inset: 18.67px;
        width: 74.67px;
        height: 74.67px;
      }
    </style>
    <script>
      if (window.__TAURI__) {
        document.documentElement.classList.add('in-desktop-app')
        // Should the app never come up, the page underneath is still better than the tile.
        setTimeout(function () {
          var splash = document.getElementById('boot-splash')
          if (splash) splash.remove()
        }, 15000)
      }
    </script>
    <!--
      Which first frame this page paints, decided before any of it is parsed and
      stamped on <html data-boot>:

        page       a prerendered public page (scripts/prerender.mjs) for a visitor
                   who is not signed in and reads Chinese: the HTML in #app is the
                   page itself, main.ts hydrates it, no skeleton.
        landing    a public page the app will draw itself (English, a page that is
                   not prerendered, or a signed-in reader of /about): its outline.
        workspace  signed in and going to a project's overview (where / lands when
        room       there is a last project), or to a channel or task in one;
        inbox      the to-do page;
        shell      any other page of the app: the frame without a sidebar;
        plain      somewhere with no frame at all (sign-in, the first-run welcome).

      Everything it reads is what the app itself reads to decide where a visit
      lands (router/home.ts landingForMember, i18n resolveInitialLocale, the
      workspace store), from the same keys: keep the two in step. Signed in means
      the stored session the app restores (services/account.ts); whether it still
      holds is only known after a round trip, and the skeleton stays up for it.
      main.ts removes the attribute once the real page is in place.
    -->
    <script>
      ;(function () {
        var html = document.documentElement
        var boot = 'shell'
        try {
          var read = function (key) {
            try {
              return localStorage.getItem(key)
            } catch (e) {
              return null
            }
          }
          var json = function (key) {
            try {
              return JSON.parse(read(key) || 'null')
            } catch (e) {
              return null
            }
          }
          var path = location.pathname.replace(/\/+$/, '') || '/'
          var user = json('user')
          var signedIn = !!(read('accessToken') && user)
          var app = !!window.__TAURI__
          var locale = read('cheese:locale')
          var zh = locale ? locale === 'zh-CN' : (navigator.language || '').toLowerCase().indexOf('zh') === 0
          var marker = document.querySelector('meta[name="cx-prerendered"]')
          var publicPage = /^\/(about|solutions|download)?$/.test(path)
          var layout = json('cheesex.layout') || {}
          var rail = read('cheesex.railCount')
          if (app && publicPage && !signedIn) boot = 'plain'
          else if (publicPage && !signedIn) boot = marker && marker.content === path && zh ? 'page' : 'landing'
          else if (publicPage && path !== '/' && !app) boot = 'landing'
          else if (!signedIn) boot = 'plain'
          else if (path === '/')
            boot = layout.lastProjectId && rail !== '0' ? 'workspace' : user.onboarded_at ? 'inbox' : 'plain'
          else if (/^\/projects\/[^/]+\/(channels|tasks|dm)\//.test(path)) boot = 'room'
          else if (/^\/projects\//.test(path)) boot = 'workspace'
          else if (path === '/inbox') boot = 'inbox'
          else if (/^\/(welcome|account)(\/|$)/.test(path)) boot = 'plain'
          // The frame's own measurements, as the app keeps them.
          var side = Number(read('cheesex.sidebarWidth'))
          side = side > 0 ? Math.min(480, Math.max(190, Math.round(side))) : 280
          html.style.setProperty('--sx-side-w', side + 'px')
          html.dataset.bootRail = String(Math.min(9, Math.max(0, rail === null ? 3 : Number(rail) || 0)))
          // The room's side panel: the reader's own choice, else open when the pane
          // is wide enough (useWorkspaceLayout PANEL_OPEN_MIN).
          var pane = window.innerWidth - 64 - side
          var panel = typeof layout.panelOpen === 'boolean' ? layout.panelOpen : pane >= 1000
          if (panel)
            html.style.setProperty(
              '--sx-chat-w',
              (Number(layout.chatPct) || (window.innerWidth >= 1440 ? 45 : 50)) + '%'
            )
        } catch (e) {
          // Whatever went wrong, the generic frame is never wrong for long.
        }
        html.dataset.boot = boot
      })()
    </script>
    <!--
      Renew an expired session now, while the bundle is still on its way: the app
      would otherwise ask only once its scripts have run, and wait a round trip
      for the answer before it can even ask for the first page's data. This does
      what lib/session.ts does (same URL, request, lock, storage keys) and only
      that: it takes the same Web Lock the app takes for a renewal, checks under
      it that no other tab has already renewed (the cookie rotates, and presenting
      a spent one ends the session), and stores the new token and user before it
      lets go. The app's own renewal then waits on the lock, finds the token has
      changed, and takes it, exactly as when another tab renewed. Anything short
      of a fresh token is left to the app: it asks again and handles the answer.
      Without Web Locks it does nothing, rather than race the app.

      Then, with a live token in hand, it asks for the project list on a page
      whose frame needs it (every signed-in frame: the project rail, and where `/`
      lands): the app would otherwise ask only after its scripts arrive and the
      session is restored. The app takes this one answer in place of its own first
      request (src/lib/earlyProjects.ts) and asks itself when there is none.
    -->
    <script>
      ;(function () {
        try {
          var boot = document.documentElement.dataset.boot
          if (boot === 'page' || boot === 'landing' || !window.fetch) return
          var token = localStorage.getItem('accessToken')
          if (!token || !localStorage.getItem('user')) return
          var framed = boot === 'workspace' || boot === 'room' || boot === 'inbox' || boot === 'shell'
          // Same request as listProjects() in src/api/projects.ts; the answer
          // remembers the token it was asked with.
          var projects = function (jwt) {
            var controller = new AbortController()
            var timer = setTimeout(function () {
              controller.abort()
            }, 10000)
            return fetch('/api/projects', {
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + jwt },
              signal: controller.signal,
            })
              .then(function (res) {
                return res.ok ? res.json() : null
              })
              .then(function (body) {
                return body ? { token: jwt, body: body } : null
              })
              .catch(function () {
                return null
              })
              .then(function (answer) {
                clearTimeout(timer)
                return answer
              })
          }
          var expired = function (jwt) {
            try {
              var exp = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp
              return typeof exp !== 'number' || exp * 1000 - 30000 <= Date.now()
            } catch (e) {
              return true
            }
          }
          if (!expired(token)) {
            if (framed) window.__cxEarlyProjects = projects(token)
            return
          }
          if (!navigator.locks) return
          var renewed = navigator.locks.request('cheese:session-refresh', function () {
            if (localStorage.getItem('accessToken') !== token) return
            var controller = new AbortController()
            var timer = setTimeout(function () {
              controller.abort()
            }, 10000)
            return fetch('/api/users/auth/refresh-token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              signal: controller.signal,
            })
              .then(function (res) {
                return res.ok ? res.json() : null
              })
              .then(function (body) {
                var data = body && body.data
                if (!data || typeof data.accessToken !== 'string' || !data.accessToken) return
                localStorage.setItem('accessToken', data.accessToken)
                if (data.user) localStorage.setItem('user', JSON.stringify(data.user))
              })
              .catch(function () {})
              .then(function () {
                clearTimeout(timer)
              })
          })
          // Renewed here or by another tab meanwhile: either way a new token. Still
          // the expired one means no renewal, and the app's own requests follow it.
          if (framed) {
            window.__cxEarlyProjects = renewed.then(function () {
              var now = localStorage.getItem('accessToken')
              return now && now !== token ? projects(now) : null
            })
          }
        } catch (e) {
          // The app renews the session itself in any case.
        }
      })()
    </script>
    <!--
      The cold-start skeletons. The served HTML paints one before the bundle
      arrives, so a slow link shows the page taking shape instead of a pure white
      screen (~20s measured at 400 kbit/s), and it stays up until the page it
      stands for is in place (main.ts). Entirely inline, no extra request, no
      external font. Each one is drawn to the measurements of the real page it
      stands for, desktop and phone (Vuetify's md breakpoint, 960px), so the
      switch to the real page moves nothing.

      The colours are literals copied from the design tokens in `src/style.css`
      (--canvas / --surface / --line / --fill-2 / --fill / --accent). They have to
      be literals: that sheet ships inside the bundle and is not here yet. Dark
      follows `html[data-theme]`, resolved above before the first paint.
    -->
    <style>
      #sx-boot-skeleton,
      #sx-boot-skeleton * {
        box-sizing: border-box;
      }
      #sx-boot-skeleton {
        --sx-canvas: #f7f8fa;
        --sx-surface: #ffffff;
        --sx-line: #ecedef;
        --sx-bone: #eeeff1;
        --sx-bone-rail: #e2e3e6;
        --sx-sheen: #f4f5f7;
        --sx-accent: #f57f17;
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483000; /* one below the desktop boot splash */
        overflow: hidden;
        background: var(--sx-canvas);
      }
      html[data-theme='dark'] #sx-boot-skeleton {
        --sx-canvas: #141517;
        --sx-surface: #1b1d20;
        --sx-line: #2b2e33;
        --sx-bone: #282c31;
        --sx-bone-rail: #3a3e45;
        --sx-sheen: #212429;
        --sx-accent: #ffa733;
      }
      /* A prerendered page is shown only to the visitor it was rendered for; for
         anyone else the skeleton covers it until the app has drawn their page. */
      html[data-boot]:not([data-boot='page']) #sx-boot-skeleton {
        display: block;
      }
      /* Not laid out at all, not just unseen: a laid-out prerendered page still
         fetches its fonts and pictures, on the bandwidth this visit needs. */
      html[data-boot]:not([data-boot='page']) #app {
        display: none;
      }
      #sx-boot-skeleton > div,
      #sx-boot-skeleton .sx-app > div,
      #sx-boot-skeleton .sx-main > div,
      #sx-boot-skeleton .sx-side > div {
        display: none;
      }

      /* The bones, and the "still coming" sign: a light sweep across each one,
         1.4s a cycle, the same motion the in-app LoadingSkeleton uses. */
      #sx-boot-skeleton .sx-bone {
        position: relative;
        overflow: hidden;
        display: block;
        flex: none;
        height: 12px;
        border-radius: 6px;
        background: var(--sx-bone);
      }
      #sx-boot-skeleton .sx-on-canvas .sx-bone {
        background: var(--sx-bone-rail);
      }
      #sx-boot-skeleton .sx-bone::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--sx-sheen), transparent);
        animation: sx-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes sx-shimmer {
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sx-boot-skeleton .sx-bone::after {
          animation: none;
          background: none;
        }
      }
      #sx-boot-skeleton .sx-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        margin: 0 8px 4px;
        padding: 0 8px;
        border-radius: 8px;
      }
      #sx-boot-skeleton .sx-row--on {
        background: var(--sx-bone-rail);
      }
      #sx-boot-skeleton .sx-row--on .sx-bone {
        background: var(--sx-bone);
      }
      #sx-boot-skeleton .sx-ico {
        width: 16px;
        height: 14px;
        border-radius: 4px;
      }
      #sx-boot-skeleton .sx-sub {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 6px 16px 0;
      }
      #sx-boot-skeleton .sx-sub .sx-bone {
        width: 28px;
        height: 10px;
      }
      #sx-boot-skeleton .sx-sub .sx-bone + .sx-bone {
        width: 12px;
        height: 12px;
      }

      /* ---- Public pages: LandingShell's bar and the hero under it. ---- */
      html[data-boot='landing'] #sx-boot-skeleton .sx-landing {
        display: block;
      }
      #sx-boot-skeleton .sx-lbar {
        display: flex;
        align-items: center;
        height: 64px;
        padding: 0 48px;
        gap: 32px;
      }
      #sx-boot-skeleton .sx-lbar-brand {
        width: 68px;
        height: 24px;
      }
      #sx-boot-skeleton .sx-lbar-nav {
        display: flex;
        flex: 1 1 auto;
        justify-content: center;
        gap: 32px;
      }
      #sx-boot-skeleton .sx-lbar-nav .sx-bone {
        width: 28px;
      }
      #sx-boot-skeleton .sx-lbar-cta {
        width: 112px;
        height: 36px;
        border-radius: 8px;
      }
      #sx-boot-skeleton .sx-lhero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        height: calc(100dvh - 64px);
        padding: 0 48px 64px;
      }
      #sx-boot-skeleton .sx-lhero-title {
        width: min(752px, 100%);
        height: clamp(64px, 12vw, 172px);
        border-radius: 12px;
      }
      #sx-boot-skeleton .sx-lhero-sub {
        width: min(648px, 90%);
        height: 32px;
      }
      #sx-boot-skeleton .sx-lhero-actions {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-top: 12px;
      }
      #sx-boot-skeleton .sx-lhero-btn {
        width: 120px;
        height: 44px;
        border-radius: 8px;
      }
      #sx-boot-skeleton .sx-lhero-link {
        width: 84px;
      }

      /* ---- The app's frame (App.vue): title bar, rail, sidebar, content pane. ---- */
      html[data-boot='shell'] #sx-boot-skeleton .sx-app,
      html[data-boot='workspace'] #sx-boot-skeleton .sx-app,
      html[data-boot='room'] #sx-boot-skeleton .sx-app,
      html[data-boot='inbox'] #sx-boot-skeleton .sx-app {
        display: block;
      }
      #sx-boot-skeleton .sx-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex !important;
        align-items: center;
        justify-content: center;
        height: 32px;
      }
      #sx-boot-skeleton .sx-top-title {
        width: 96px;
      }
      #sx-boot-skeleton .sx-top-help {
        position: absolute;
        right: 16px;
        width: 72px;
      }
      #sx-boot-skeleton .sx-rail {
        position: absolute;
        top: 32px;
        left: 0;
        bottom: 0;
        display: flex !important;
        flex-direction: column;
        align-items: center;
        width: 64px;
        padding-top: 4px;
      }
      #sx-boot-skeleton .sx-tile {
        display: block;
        flex: none;
        width: 48px;
        height: 48px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: var(--sx-bone-rail);
      }
      html[data-boot='inbox'] #sx-boot-skeleton .sx-tile--home {
        background: var(--sx-accent);
        opacity: 0.85;
      }
      #sx-boot-skeleton .sx-rail-rule {
        display: block;
        width: 24px;
        height: 2px;
        margin: 6px 0 14px;
        border-radius: 1px;
        background: var(--sx-bone-rail);
      }
      #sx-boot-skeleton .sx-tile--add {
        border: 1px dashed var(--sx-bone-rail);
        background: none;
      }
      #sx-boot-skeleton .sx-rail-me {
        position: absolute;
        bottom: 24px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--sx-bone-rail);
      }
      #sx-boot-skeleton .sx-body {
        position: absolute;
        top: 32px;
        left: 64px;
        right: 0;
        bottom: 0;
        display: flex !important;
        overflow: hidden;
        border-top: 1px solid var(--sx-line);
        border-left: 1px solid var(--sx-line);
        border-top-left-radius: 12px;
      }
      #sx-boot-skeleton .sx-side {
        flex: none;
        width: calc(var(--sx-side-w, 280px) - 1px);
      }
      html[data-boot='shell'] #sx-boot-skeleton .sx-side {
        display: none;
      }
      html[data-boot='workspace'] #sx-boot-skeleton .sx-side-ws,
      html[data-boot='room'] #sx-boot-skeleton .sx-side-ws,
      html[data-boot='inbox'] #sx-boot-skeleton .sx-side-home {
        display: block;
      }
      html[data-boot='room'] #sx-boot-skeleton .sx-side-ws .sx-row--on {
        background: none;
      }
      html[data-boot='room'] #sx-boot-skeleton .sx-side-ws .sx-row--on .sx-bone {
        background: var(--sx-bone-rail);
      }
      html[data-boot='room'] #sx-boot-skeleton .sx-side-ws .sx-row--room {
        background: var(--sx-bone-rail);
      }
      html[data-boot='room'] #sx-boot-skeleton .sx-side-ws .sx-row--room .sx-bone {
        background: var(--sx-bone);
      }
      #sx-boot-skeleton .sx-side-head {
        position: relative;
        height: 48px;
