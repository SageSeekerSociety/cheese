# What the mainland redirect (mainland/send.conf) decides on.
#
# okcheese.com is served from Hong Kong; okcheese.cn is the same deployment
# served from Beijing (docs/infrastructure.md, "Beijing edge"). A visitor in
# China pays a Beijing → Hong Kong → Beijing detour on the first, and nothing on
# the second, which is what the Beijing edge exists for.

# The visitor's own address. nginx's peer here is the proxy in front — the box's
# front door, then api-front — so without this every request would carry a proxy's
# address and the rule would decide about the wrong machine. Only private space
# and loopback are believed: the public entry (Hong Kong's Caddy) replaces
# X-Forwarded-For with the address its relay's PROXY header carried, so the
# leftmost address this walk lands on is the visitor's.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# This deployment's own names, less the mainland entry itself: written at
# container start from FRONTEND_URL and FRONTEND_ALIASES. A request for any other
# Host — the docs' host, a content host, the container's own name — is never sent
# to the other origin.
include /etc/nginx/mainland/hosts.map;

geo $is_china {
    default 0;
    include /etc/nginx/mainland/china-ip.txt;
}

# A page navigation: the browser says so, or it is too old to say it and asks for
# HTML. Nothing else moves — an API call belongs to the origin the page is on,
# and a module script that crossed origins would be refused by CORS.
map $http_sec_fetch_mode $mainland_navigation {
    default 0;
    navigate 1;
    "" $mainland_accepts_html;
}

map $http_accept $mainland_accepts_html {
    default 0;
    "~*text/html" 1;
}

# Nothing under these paths is a page, whatever the headers say. The API and the
# connector are listed again as a belt: a page navigation never asks for them,
# but a rule that let one through would break a long-lived connection mid-turn.
map $uri $mainland_a_page {
    default 1;
    "~^/(api|connector|collab|office-editor|forge|_internal)/" 0;
}

# Someone signed in on this origin. A session is this origin's cookie, and moving
# them to the other origin would sign them out of it.
map $http_cookie $mainland_signed_in {
    default 0;
    "~*(^|;\s*)cheese_refresh=" 1;
}

# The desktop app names itself in its user agent (desktop/src-tauri/src/main.rs):
# its window runs only the pages of the origin it was built against — everything
# else opens in the browser — so a redirect here would leave it on a page its own
# commands are not allowed on. A browser never carries this string.
map $http_user_agent $mainland_is_desktop {
    default 0;
    "~*CheeseDesktop" 1;
}
