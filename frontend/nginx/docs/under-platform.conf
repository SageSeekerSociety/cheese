# The docs site served by the platform under /docs/: DOCS_ORIGIN is empty.
# docker-entrypoint.sh copies this into the platform's server block
# (nginx.conf, `include /etc/nginx/docs/platform.conf`). The tree is the
# DOCS_BASE=/docs build (docs/site/src/where.mjs) in public/docs.

# 文档站 (docs/site, built by `task docs:build` into public/docs).
# 每页写成 <slug>.html，链接指向 /docs/<slug>。没有 $uri.html 这一段，
# 这个请求会落到平台 `location /` 那条 try_files 的兜底 /index.html 上 —— 读者按着
# 我们自己发出去的链接点进来，看到的是这个应用而不是那一页文档，而且
# 不会有任何报错。
# Relative Location: behind the TLS proxy an absolute one would say http://.
location = /docs {
    absolute_redirect off;
    return 301 /docs/;
}

location /docs/ {
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/index.html =404;
    error_page 404 /docs/404.html;
    # Pages are small and change with every deploy; revalidate them.
    add_header Cache-Control "no-cache";
}

# Content-hashed: a changed file is a new name.
location /docs/assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 每页的 .md 双胞胎。nginx 自带的 mime.types 里没有 .md,不声明的话它是
# application/octet-stream —— 浏览器直接下载,而抓取这一页的模型也吃不到
# 「content-type 是 text/markdown 就直接读原文」的那条快路。
# 空 `types {}` 加 default_type 只影响这一个 location,不动全局的类型表。
location ~ ^/docs/.+\.md$ {
    root /usr/share/nginx/html;
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache";
}

# 开发文档只给平台管理员。`^~` 让这个前缀压过上面那条 .md 正则 ——
# 没有它，/docs/dev/auth.md 会先匹配正则、绕过鉴权原样发出去。
# 每个请求都去后端问一次（它按文档站的登录 cookie 和当前的管理员名单答
# 204/401/403），所以撤掉管理员一分钟内关门，不等 cookie 过期。
location = /docs/dev {
    absolute_redirect off;
    return 301 /docs/dev/;
}

location ^~ /docs/dev/ {
    auth_request /_docs_dev_auth;
    error_page 401 403 /docs/dev-gate.html;
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "private, no-store";

    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "private, no-store";
    }
}

location = /_docs_dev_auth {
    internal;
    proxy_pass http://__API_UPSTREAM__/docs/dev-access/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
