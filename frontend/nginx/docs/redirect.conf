# The docs live on their own host (DOCS_ORIGIN), so the platform's old address
# sends every reader there: the same page, the same query. The browser keeps the
# #fragment across a redirect itself. docker-entrypoint.sh copies this into the
# platform's server block, with __DOCS_ORIGIN__ filled in.
location = /docs {
    return 301 __DOCS_ORIGIN__/;
}

# `^~`: no regex location may serve a file from the old tree instead.
# $request_uri, not $uri: the path as the reader sent it, query included.
location ^~ /docs/ {
    if ($request_uri ~ "^/docs/(.*)$") {
        return 301 __DOCS_ORIGIN__/$1;
    }
    return 404;
}
