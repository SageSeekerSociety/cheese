# The docs site on a host of its own: DOCS_ORIGIN is set. docker-entrypoint.sh
# writes this server into nginx.conf's `include /etc/nginx/docs/host.conf`, with
# __DOCS_HOST__ and __API_UPSTREAM__ filled in. The tree is the DOCS_BASE= build
# (docs/site/src/where.mjs), kept outside the platform's html root so that no
# path on the platform reaches it, the gated dev/ pages least of all.
server {
    listen 80;
    listen [::]:80;
    # `frontend` is this container's compose name: the backend reads the docs'
    # search index and .md pages through it (backend/app/domain/docs_site/site.py)
    # and has to get the very files readers get.
    server_name __DOCS_HOST__ frontend;
    root /usr/share/nginx/docs-host;

    # Each page is <slug>.html and its links say /<slug>.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /404.html;
        # Pages are small and change with every deploy; revalidate them.
        add_header Cache-Control "no-cache";
    }

    # Content-hashed: a changed file is a new name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Each page's .md twin. nginx's mime.types has no .md, and a model fetching
    # the page reads text/markdown as the original straight away.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache";
    }

    # Developer pages are for platform admins. `^~` puts this prefix ahead of
    # the .md regex, which would otherwise serve dev/*.md past the check. The
    # backend answers every file (204/401/403) from the docs sign-in cookie and
    # the current admin list.
    location = /dev {
        absolute_redirect off;
        return 301 /dev/;
    }

    location ^~ /dev/ {
        auth_request /_docs_dev_auth;
        error_page 401 403 /dev-gate.html;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "private, no-store";

        location ~ \.md$ {
            types { }
            default_type "text/markdown; charset=utf-8";
            add_header Cache-Control "private, no-store";
        }
    }

    location = /_docs_dev_auth {
        internal;
        proxy_pass http://__API_UPSTREAM__/docs/dev-access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The docs' own part of the API (sign-in, 问芝士, the visit beacon), and
    # nothing else of the platform's: this host has no business with the rest.
    location ^~ /api/docs/ {
        proxy_pass http://__API_UPSTREAM__/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 问芝士 streams its answer for longer than the 60 s default.
        proxy_read_timeout 600s;
    }
}
