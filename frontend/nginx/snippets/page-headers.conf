# Headers for the platform's own pages (the app shell and the prerendered
# public pages), included in each location that serves one. A location with
# an add_header of its own drops the server's, so they cannot sit on the
# server block.
#
# - The page is not framed by another site (clickjacking): frame-ancestors for
#   current browsers, X-Frame-Options for the rest. /demo/ is framed by the
#   docs and does not include this file.
# - A response is read as the type it says (nosniff).
# - A link out of the platform does not carry the page's path and query.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
