<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧栏任务折叠原型</title>
<style>
/* ---- token：照 frontend/src/style.css 的两套主题块抄下来 ---- */
:root{
  color-scheme:light;
  --ink:#191a1c; --text:#36383c; --muted:#5a5e66; --faint:#747a82;
  --line:#ecedef; --line-2:#e2e3e6; --fill:#f4f5f7; --fill-2:#eeeff1;
  --canvas:#f7f8fa; --surface:#ffffff; --raised:#ffffff;
  --accent:#f57f17; --accent-press:#d96e0a; --accent-ink:#9a5413; --accent-wash:#fdf1e2;
  --ok:#1f9d55; --ok-ink:#12703a; --ok-wash:#e8f6ee;
  --warn:#e8901c; --warn-ink:#8f5406; --warn-wash:#faf0dc;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'PingFang SC','HarmonyOS Sans SC','MiSans','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-1:0 1px 2px rgba(25,26,28,.06), 0 2px 8px rgba(25,26,28,.06);
  --shadow-2:0 4px 12px rgba(25,26,28,.1), 0 12px 32px rgba(25,26,28,.1);
  --focus-ring:#c2570a;
  /* 批注标的颜色：刻意不用产品里的任何一档（橙=等你、绿=在跑），
     否则挂在行上会跟状态点混掉。 */
  --note:#3b5bdb; --note-press:#2f4bbd; --note-wash:#e7ebfb; --note-ink:#2c45a8;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --ink:#f3f4f6; --text:#d3d6db; --muted:#aeb4bd; --faint:#888ea0;
  --line:#2b2e33; --line-2:#3a3e45; --fill:#212429; --fill-2:#282c31;
  --canvas:#141517; --surface:#1b1d20; --raised:#212429;
  --accent:#ffa733; --accent-press:#ffbc5e; --accent-ink:#ffc670; --accent-wash:#2e2216;
  --ok:#3fbf7f; --ok-ink:#6fd9a0; --ok-wash:#14261d;
  --warn:#f0a94a; --warn-ink:#f7c078; --warn-wash:#2a2114;
  --focus-ring:rgba(255,167,51,.65);
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-2:0 4px 12px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.4);
  --note:#8aa5ff; --note-press:#a8bcff; --note-wash:#1c2440; --note-ink:#b6c6ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font-family:var(--font-sans);font-size:14px;line-height:20px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;color:var(--ink);font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
.t-meta{font-size:12px;line-height:18px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- 页面外壳（不属于产品） ---- */
.chrome{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.chrome__mark{
  width:28px;height:28px;border-radius:var(--radius-md);background:var(--accent);
  color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;flex:none;
}
.chrome__id{display:flex;align-items:center;gap:10px}
.chrome__tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-md);font-size:13px;font-weight:600}
.btn--secondary{background:var(--fill);color:var(--ink)}
.btn--secondary:hover{background:var(--fill-2)}
.btn--sm{height:28px;font-size:12px;padding:0 10px}
.stage{padding:20px 24px 40px;max-width:1400px;margin:0 auto}
.hint{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.segs{display:inline-flex;background:var(--fill);border-radius:var(--radius-md);padding:2px;gap:2px}
.segs button{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);font-weight:600}
.segs button.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.legend{font-size:12px;color:var(--muted)}
.legend b{color:var(--ink)}
.frame{
  border:1px solid var(--line-2);border-radius:var(--radius-lg);overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow-2);
}
.frame__bar{
  display:flex;align-items:center;gap:6px;padding:0 12px;height:36px;
  background:var(--fill);border-bottom:1px solid var(--line);
}
.frame__dot{width:9px;height:9px;border-radius:var(--radius-pill);background:var(--line-2)}
.frame__url{flex:1;text-align:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.frame__tag{font-size:11px;color:var(--warn-ink);background:var(--warn-wash);border-radius:var(--radius-sm);padding:2px 6px;font-weight:600}
/* 这份原型是给桌面看的：窄屏不重排，横向滚，免得把侧栏挤成一条 */
.app{display:flex;height:680px;min-width:940px;background:var(--canvas)}

/* ---- 最左那条图标栏 ---- */
.railbar{
  width:52px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;
}
.railbar button{width:34px;height:34px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--muted);font-size:14px}
.railbar button.is-on{background:var(--ink);color:var(--surface)}
.railbar button:hover{background:var(--fill-2)}

/* ---- 频道侧栏：这一块就是被改的东西 ---- */
.side{
  width:304px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.side__head{display:flex;align-items:center;gap:4px;height:48px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);flex:none}
.side__proj{font-weight:600;color:var(--ink);font-size:14px;flex:1;text-align:left}
.side__label{display:flex;align-items:center;gap:6px;padding:14px 8px 4px 16px;font-size:12px;font-weight:600;color:var(--faint);flex:none}
.side__label span{flex:1}
.side__list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:1px}

/* 频道行 */
.ch{
  position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  min-height:32px;padding:0 6px 0 8px;border-radius:var(--radius-md);color:var(--text);font-size:14px;
}
.ch:hover{background:var(--fill)}
.ch.is-on{background:var(--line-2);color:var(--ink);font-weight:600}
.ch__glyph{width:16px;flex:none;text-align:center;color:var(--faint);font-size:14px}
.ch__name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch__tail{display:flex;align-items:center;gap:6px;flex:none}
.ch__n{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--fill);border-radius:var(--radius-sm);padding:0 5px;border:1px solid var(--line)}
.ch__more{opacity:0;color:var(--muted);font-size:14px;line-height:1;padding:2px 4px}
.ch:hover .ch__more,.ch.is-on .ch__more{opacity:1}
.ch__fold{width:20px;height:20px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--faint);font-size:13px;line-height:1}
.ch__fold:hover{background:var(--fill-2);color:var(--ink)}
.ch--folded .ch__fold{color:var(--ink);background:var(--fill-2)}
.ch__rollup{display:flex;align-items:center;gap:5px}
.ch__rollup .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:var(--radius-pill);display:block;flex:none}
.dot--run{background:var(--ok)}
.dot--await{background:var(--warn)}
.dot--idle{background:var(--faint)}

/* 任务行 */
.tk{
  position:relative;display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  min-height:32px;padding:0 6px 0 40px;border-radius:var(--radius-md);color:var(--text);font-size:14px;line-height:20px;
}
.tk:hover{background:var(--fill-2);color:var(--ink)}
.tk.is-on{background:var(--line-2);color:var(--ink);font-weight:600}
.tk::before{content:'';position:absolute;left:16px;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.tk--last::before{bottom:50%}
.tk__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk--help .tk__t{color:var(--muted)}
.tk--pad .tk__t{color:var(--muted)}
.tk__tail{display:flex;align-items:center;gap:6px;flex:none}
.tk__tag{font-size:10px;font-weight:600;color:var(--faint);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:0 4px;line-height:15px}
.tk__badge{min-width:16px;height:16px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}

/* 最后那行「展开其余 N 个」 */
.more{
  position:relative;display:flex;align-items:center;gap:6px;width:100%;min-height:32px;
  padding:0 6px 0 40px;border-radius:var(--radius-md);color:var(--muted);font-size:14px;text-align:left;
}
.more:hover{background:var(--fill-2);color:var(--ink)}
.more::before{content:'';position:absolute;left:16px;top:-3px;height:calc(50% + 3px);width:1px;background:var(--line-2)}
.more__label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more__tail{display:flex;align-items:center;gap:6px;flex:none}
.more__chev{color:var(--faint);font-size:12px}
.more--open{color:var(--ink)}
.more--end{color:var(--faint);pointer-events:none}
/* 展开以后接着挂的其余任务 */
.tk--rest .tk__t{color:var(--muted)}

/* ---- 主区 ---- */
.view{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);min-height:0}
.vhead{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.vhead h2{font-size:15px}
.vhead__crumb{font-size:13px;color:var(--muted)}
.vbody{flex:1;min-height:0;overflow-y:auto;padding:20px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.card h3{font-size:15px;margin-bottom:6px}
.msg{display:flex;gap:10px;margin-bottom:16px}
.face{width:28px;height:28px;border-radius:var(--radius-pill);flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--ink)}
.msg__body{flex:1;min-width:0}
.msg__who{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.msg__text{font-size:14px;line-height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;background:var(--fill);color:var(--muted)}
.chip--warn{background:var(--warn-wash);color:var(--warn-ink)}

/* ---- 改动标记（蓝色，跟产品里的状态点分得开） ---- */
.mk{
  display:inline-grid;place-items:center;width:17px;height:17px;border-radius:var(--radius-pill);
  background:var(--note);color:#fff;font-size:11px;font-weight:700;font-style:normal;
  cursor:pointer;font-family:var(--mono);flex:none;box-shadow:0 0 0 2px var(--note-wash);
}
.mk:hover{background:var(--note-press)}
.mk.is-seen{background:var(--muted);box-shadow:0 0 0 2px var(--fill)}

/* ---- 说明卡 ---- */
/* 靠右下角，不盖住左边那条侧栏（被改的就是它）；窄屏才铺开 */
.sheet{
  position:fixed;right:24px;bottom:20px;
  width:min(820px,calc(100vw - 424px));background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);
  z-index:60;overflow:hidden;
}
.sheet[hidden]{display:none}
.sheet__head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet__no{width:26px;height:26px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:var(--mono)}
.sheet__head h3{font-size:15px;line-height:21px}
.sheet__body{padding:12px 16px 16px;display:grid;gap:8px;max-height:52vh;overflow-y:auto}
.sheet__row{display:flex;gap:10px;font-size:13px;line-height:20px}
.sheet__k{width:60px;flex:none;color:var(--faint)}
.sheet__v{flex:1;color:var(--text)}
.sheet__v b{color:var(--ink)}
.sheet__row--ask .sheet__v{color:var(--accent-ink)}
.sheet__foot{display:flex;align-items:center;gap:8px;padding:0 12px 12px;font-size:12px;color:var(--faint)}
.icon-btn{width:28px;height:28px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--muted);font-size:15px;line-height:1}
.icon-btn:hover{background:var(--fill)}

@media (max-width:940px){
  .stage{padding:12px}
  .chrome{padding:12px 16px}
  .sheet{left:12px;right:12px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="chrome">
  <div class="chrome__id">
    <span class="chrome__mark">知</span>
    <div>
      <h1>侧栏任务折叠原型</h1>
      <p class="t-meta">按 caisongyang 2026-10-12 定的四条画 · 界面上那些蓝标点一下，看这处改什么</p>
    </div>
  </div>
  <div class="chrome__tools">
    <span class="t-meta mono" id="seen">已看过 0 / 7</span>
    <button class="btn btn--secondary btn--sm" id="themeBtn">深色</button>
  </div>
</header>

<main class="stage">
  <div class="hint">
    <div class="segs" id="modeSeg">
      <button data-mode="now">现状：每频道最多 5 条</button>
      <button data-mode="new" class="is-on">新规则：全部挂出 + 可折叠</button>
    </div>
    <span class="legend">左边点着走：<b>点频道</b>打开它，<b>点任务</b>打开那条任务，频道行最右边的 <b>⌄</b> 把下面这一整块收起来。看「客服值班」已经收起来的样子。</span>
  </div>

  <div class="frame">
    <div class="frame__bar">
      <span class="frame__dot"></span><span class="frame__dot"></span><span class="frame__dot"></span>
      <span class="frame__url">okcheese.com/workspace</span>
      <span class="frame__tag">原型 · 不是线上</span>
    </div>
    <div class="frame__scroll">
      <div class="app">

        <nav class="railbar" aria-label="项目">
          <button class="is-on" title="知是平台">知</button>
          <button title="我的项目">我</button>
        </nav>

        <aside class="side">
          <div class="side__head">
            <button class="side__proj">知是平台</button>
            <button class="icon-btn" title="项目菜单">▾</button>
          </div>
          <div class="side__label">
            <span>频道</span>
            <button class="icon-btn" title="新建频道" style="width:22px;height:22px;font-size:14px">＋</button>
          </div>
          <nav class="side__list" id="sideList"></nav>
        </aside>

        <section class="view">
          <div class="vhead" id="vhead"></div>
          <div class="vbody" id="vbody"></div>
        </section>

      </div>
    </div>
  </div>
</main>

<aside class="sheet" id="sheet" hidden>
  <div class="sheet__head">
    <span class="sheet__no" id="sheetNo">1</span>
    <div style="flex:1">
      <h3 id="sheetTitle"></h3>
      <p class="t-meta" id="sheetSrc"></p>
    </div>
    <button class="icon-btn" id="sheetClose">×</button>
  </div>
  <div class="sheet__body">
    <div class="sheet__row"><span class="sheet__k">现状</span><span class="sheet__v" id="sheetNow"></span></div>
    <div class="sheet__row"><span class="sheet__k">这一版</span><span class="sheet__v" id="sheetFix"></span></div>
    <div class="sheet__row sheet__row--ask" id="sheetAskRow" hidden><span class="sheet__k">要你定</span><span class="sheet__v" id="sheetAsk"></span></div>
    <div class="sheet__row"><span class="sheet__k">要动哪里</span><span class="sheet__v" id="sheetWork"></span></div>
  </div>
  <div class="sheet__foot"><span>点别的标记换一张</span></div>
</aside>

<script>
(function(){
  'use strict';

  // ------------------------------------------------------------------
  // 假数据。照 caisongyang 截图里那个侧栏画的：频道「综合」下面 5 条 + 「展开其余 46 个」，
  // 再补上他打不开的那条「电脑端待办入口位置」。
  //   mine   = 和我有关的（我负责的 own + 我协助的 help），已经按最近有动静排好
  //   others = 这个频道其余的进行中任务（补足时从这里拿）
  //   open   = 这个频道进行中的任务总数
  // ------------------------------------------------------------------
  var DATA = [
    {
      id:'general', name:'综合', on:true, folded:false,
      open:51,
      mine:[
        {t:'灯', rel:'own', dot:'run', when:'8 分钟前'},
        {t:'电脑端待办入口位置', rel:'own', dot:'await', when:'22 分钟前', badge:2},
        {t:'验收卡 merge_state 快照过期', rel:'own', when:'2 小时前'},
        {t:'黑客松任务总体设计', rel:'own', when:'昨天'},
        {t:'空间重设计', rel:'help', when:'昨天'},
        {t:'新建频道入口设计', rel:'help', when:'3 天前'}
      ],
      others:[
        {t:'记忆整理巡检', when:'2 小时前'},
        {t:'算法备案材料', when:'昨天'},
        {t:'客服值班表', when:'2 天前'}
      ]
    },
    {
      id:'design', name:'产品设计', on:false, folded:false,
      open:6,
      mine:[
        {t:'出题改动原型', rel:'own', dot:'run', when:'5 分钟前'},
        {t:'频道改动原型', rel:'own', dot:'await', when:'1 小时前', badge:1}
      ],
      others:[
        {t:'全部频道页加搜索', when:'3 小时前'},
        {t:'设置页分组重排', when:'昨天'}
      ]
    },
    {
      id:'test', name:'测试频道', on:false, folded:false,
      open:3,
      mine:[],
      others:[
        {t:'冒烟测试补跑一遍', when:'40 分钟前'},
        {t:'移动端宽度回归', when:'昨天'},
        {t:'合并队列卡住排查', when:'2 天前'}
      ]
    },
    {
      id:'duty', name:'客服值班', on:false, folded:true,
      open:4,
      mine:[
        {t:'值班表自动排班', rel:'own', dot:'run', when:'12 分钟前'}
      ],
      others:[
        {t:'工单标签规范化', when:'2 小时前'},
        {t:'常见问题库更新', when:'昨天'}
      ]
    },
    {
      id:'arch', name:'营销素材库', on:false, folded:false, archived:true,
      open:0, mine:[], others:[]
    }
  ];

  var ITEMS = {
    1:{t:'频道行右边加了折叠加手', s:'第 4 条：每个频道要能把它下面的任务整块折叠收起',
       now:'现在频道行上没有这个把手，频道下面挂了什么就一直在那儿，收不起来。左边那个 ⌄ 收的是子频道，不是任务。',
       fix:'频道行右边加一个 ⌄：点一下把频道下面这一整块任务收起来，再点一下展开。左边那个 ⌄ 管子频道，两个各管各的。',
       ask:'两个 ⌄ 挨在一条行上会不会认错；要的话可以把任务的折叠挪到这一块任务的末行（现在「展开其余」那一行的位置）。',
       work:'TopicRailRow.vue 加一个把手槽，TopicSidebar.vue 记「这个频道收着没有」。'},
    2:{t:'和你有关的全部挂出来，不再截 5 条', s:'第 1 条',
       now:'每个频道最多挂 5 条和我有关的任务，第 6 条起收进「展开其余 N 个」。频道「综合」里你有 6 条，第 6 条就看不见了。',
       fix:'全部挂出来。上面这个侧栏里「综合」挂了 6 条，你打不开的那条「电脑端待办入口位置」就在里面（这一行）。',
       ask:'条数多起来侧栏会变长，收不收由第 1 条那个把手管。',
       work:'后端 rail_tasks() 去掉 [:RAIL_TASKS] 的截断（backend/app/api/routes/projects.py）；前端不用改。'},
    3:{t:'不足 3 条就补到 3 条', s:'第 2 条：拿这个频道其余进行中的任务补',
       now:'没有这一条。频道里只有一两条和你有关的，下面就只有一两行。',
       fix:'和你有关的不足 3 条时，用这个频道其余进行中的任务补足到 3 条，带「补足」标签的那几条就是补的。看「产品设计」：你有 2 条，补了 1 条。',
       ask:'「少于 3 条」数的是「我负责的 + 我协助的」还是只数「我负责的」？这一版按前者做的。',
       work:'rail_tasks() 里补足的逻辑，外加一个字段告诉前端哪几条是补的；前端 TopicRailTaskRow.vue 给补的那几条画淡一档 + 标签。'},
    4:{t:'排序：我负责的在前', s:'第 3 条：排序方式不变',
       now:'现在就是这个顺序：我负责的在前，然后其余的，各自按最近有动静排。',
       fix:'不改。左边「综合」里你负责的 4 条在上面，你协助的 2 条在下面；补足的那几条排在最后。',
       ask:'',
       work:'不用改。'},
    5:{t:'收起来就是整块放下', s:'第 4 条的背面：收起来不能把信号一起收掉，但也不留单独一条',
       now:'#3580 实现的版本留下你正打开的那一条；2026-10-13 改成不留（收起只收一半、人还留在一条看不见的任务里，比不收还难懂）。',
       fix:'收起来的频道行尾巴上留一个小数字和一颗灯，看下面「客服值班」：数字是这个频道里进行中的任务数，灯沿用现有口径——绿 = 有队友在跑，黄 = 有事等你，只说这一块里的任务，不重复频道行自己那盏。下面一条都不留：正在这个频道下的任务里点收起，跟着回这个频道的页面。收一下左边「综合」就能看到。',
       ask:'',
       work:'TopicSidebar.vue 画 rollup；ProjectSidebar.vue 的 toggleTasksFold 收起时把正开着的那条任务一起放下（回频道页，不再拿 selectedTaskId 留一行）。'},
    6:{t:'「展开其余 N 个」这行留着', s:'你说留着，我改回来了——点一下把别人的接在下面，再点收起来',
       now:'现在它是频道下面最后一行，点一下把频道里其余进行中的任务接在下面。它当初是为了接回「你自己的第 6 条」，所以第 1 条改完以后我把它划掉了。',
       fix:'留着。第 1 条之后它管的事变了：和你有关的都直接挂着，它接的是这个频道里和你无关的任务——那些还是会有很多，所以这行照样有用。现在点一下原地展开，再点收起来。看「综合」：上面 6 条是你的，展开以后接着挂别人的。',
       ask:'',
       work:'不用改。TopicRailMoreTasksRow.vue 和 moreTasks.ts 都留着。'},
    7:{t:'一条都没有的频道', s:'第 2 条照字面读出来的结果',
       now:'和你没有任何关系的频道下面一直空着，什么都不挂。',
       fix:'这一版照字面做：像「测试频道」这样，你一条都没有，也补到 3 条，全是别人的（都带「补足」标签）。',
       ask:'这条是照字面做的，不一定是你要的。要不要改成「我一条都没有就干脆不挂」？那样侧栏会短很多。',
       work:'rail_tasks() 里给「我 0 条」的频道也补足；做不做由你定。'}
  };

  var seen = {}, current = 0, mode = 'new', selTask = '电脑端待办入口位置', selChannel = 'general';
  var moreOpen = {};   // 哪个频道的「展开其余 N 个」正开着
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
    });
  }
  function mk(n){
    return '<i class="mk" data-item="'+n+'" title="这一处改什么">'+n+'</i>';
  }

  // 新规则下这个频道下面挂哪几行：和我有关的全部，不足 3 条时用其余补足。
  function rowsFor(ch){
    var pad = [];
    if (ch.mine.length < 3) {
      pad = ch.others.slice(0, 3 - ch.mine.length).map(function(o){
        return {t:o.t, rel:'pad', when:o.when};
      });
    }
    return {mine:ch.mine, pad:pad};
  }
  function dotHTML(d){
    return d ? '<span class="dot dot--'+d+'" title="'+(d==='run'?'有队友在跑':'有事等你')+'"></span>' : '';
  }

  function renderSide(){
    var parts = [];
    DATA.forEach(function(ch){
      var folded = (mode === 'new') && ch.folded;

      // ---- 频道行 ----
      parts.push('<div class="ch'+(ch.on?' is-on':'')+(folded?' ch--folded':'')+'" data-ch="'+ch.id+'">');
      parts.push('<span class="ch__glyph">#</span>');
      parts.push('<span class="ch__name">'+esc(ch.name)+'</span>');
      parts.push('<span class="ch__tail">');
      if (ch.archived) {
        parts.push('<span class="chip">已归档</span>');
      } else if (folded) {
        var light = ch.mine.some(function(t){return t.dot==='await';}) ? 'await'
                  : (ch.mine.some(function(t){return t.dot==='run';}) ? 'run' : 'idle');
        parts.push('<span class="ch__rollup">'
          + '<span class="dot dot--'+light+'" title="这个频道里有活"></span>'
          + '<span class="num">'+ch.open+'</span>'
          + mk(5) + '</span>');
      } else if (ch.open) {
        parts.push('<span class="ch__n" title="这个频道里进行中的任务数">'+ch.open+'</span>');
      }
      if (!ch.archived) {
        parts.push('<button class="ch__fold" data-fold="'+ch.id+'" title="'
          + (folded ? '展开这个频道下面的任务' : '收起这个频道下面的任务')
          + '" aria-expanded="'+(folded?'false':'true')+'">'+(folded?'›':'⌄')+'</button>');
        if (ch.id === 'general') parts.push(mk(1));
        if (ch.id === 'test') parts.push(mk(7));
        parts.push('<span class="ch__more" title="更多操作">⋯</span>');
      }
      parts.push('</span></div>');

      // ---- 频道下面那一块 ----
      if (ch.archived) return;
      // 收起来就是整块放下：里面一条都不留（第 5 条）。
      if (folded) return;
      var r = rowsFor(ch);
      var all = r.mine.map(function(t){ return {t:t.t, rel:t.rel, dot:t.dot, badge:t.badge}; })
        .concat(r.pad.map(function(t){ return {t:t.t, rel:'pad'}; }));
      if (mode === 'now') all = ch.mine.slice(0, 5).map(function(t){
        return {t:t.t, rel:t.rel, dot:t.dot, badge:t.badge};
      });

      var sortMarked = false;
      all.forEach(function(t){
        var on = t.t === selTask;
        var cls = 'tk' + (on?' is-on':'') + (t.rel==='help'?' tk--help':'') + (t.rel==='pad'?' tk--pad':'');
        parts.push('<button class="'+cls+'" data-task="'+esc(t.t)+'" data-chid="'+ch.id+'">');
        parts.push('<span class="tk__t">'+esc(t.t)+'</span>');
        parts.push('<span class="tk__tail">');
        if (t.rel === 'pad' && mode === 'new') parts.push('<span class="tk__tag">补足</span>');
        if (t.badge) parts.push('<span class="tk__badge">'+t.badge+'</span>');
        parts.push(dotHTML(t.dot));
        if (t.t === '电脑端待办入口位置') parts.push(mk(2));
        if (t.rel === 'pad' && ch.id === 'design') parts.push(mk(3));
        // 排在第 3 条：这一行是「我负责的」和「我协助的」的分界
        if (t.rel === 'help' && ch.id === 'general' && !sortMarked) { parts.push(mk(4)); sortMarked = true; }
        parts.push('</span></button>');
      });

      // 最后那行「展开其余 N 个」：这一行留着。它管的是「这个频道里和我无关的任务」，
      // 新规则把它自己那几条都挂出来了，别人的还是看不全，所以照样得有。
      var rest = Math.max(0, ch.open - all.length);
      if (rest) {
        var isOpen = !!moreOpen[ch.id];
        parts.push('<button class="more'+(isOpen?' more--open':'')+'" data-more="'+ch.id+'">'
          + '<span class="more__label">展开其余 '+rest+' 个</span>'
          + '<span class="more__tail">'
          + (ch.id === 'general' ? mk(6) : '')
          + '<span class="more__chev">'+(isOpen?'⌃':'⌄')+'</span></span></button>');
        if (isOpen) {
          // 这一版只用假数据里的几条演一下，条数对不上时末尾交代一句。
          var padN = mode === 'now' ? 0 : Math.max(0, 3 - ch.mine.length);
          var restRows = ch.others.slice(padN);
          restRows.forEach(function(o){
            parts.push('<button class="tk tk--rest" data-task="'+esc(o.t)+'" data-chid="'+ch.id+'">'
              + '<span class="tk__t">'+esc(o.t)+'</span>'
              + '<span class="tk__tail"><span class="t-meta">'+esc(o.when)+'</span></span></button>');
          });
          var left = rest - restRows.length;
          if (left > 0) {
            parts.push('<span class="more more--end"><span class="more__label">还有 '+left
              + ' 个，去频道页的「全部任务」</span></span>');
          }
        }
      }
    });
    $('#sideList').innerHTML = parts.join('');
  }

  function renderView(){
    var ch = DATA.filter(function(c){ return c.id === selChannel; })[0] || DATA[0];
    var title = selTask || ch.name;
    $('#vhead').innerHTML = '<span class="vhead__crumb">'+esc(ch.name)+' /</span>'
      + '<h2>'+esc(title)+'</h2><span class="chip chip--warn">已开始</span>';
    $('#vbody').innerHTML =
        '<div class="card"><h3>'+esc(title)+'</h3>'
      + '<p class="t-meta">这里是内容区，放它只为让左边点得动。这次改的是左边那条侧栏，别的一概没动。</p></div>'
      + '<div class="msg"><span class="face">蔡</span><div class="msg__body">'
      + '<div class="msg__who">蔡松洋</div>'
      + '<div class="msg__text">明明是我的话题，为什么侧栏里不呈现？而被折叠起来了。</div></div></div>'
      + '<div class="msg"><span class="face" style="background:var(--accent)">芝</span><div class="msg__body">'
      + '<div class="msg__who">芝士</div>'
      + '<div class="msg__text">找到了。侧栏每个频道下面固定只挂 5 条和你有关的任务，你打开的这条没排进去，只能靠「展开其余」才看得见。</div></div></div>';
  }

  function render(){ renderSide(); renderView(); }

  function seenText(){
    $('#seen').textContent = '已看过 ' + Object.keys(seen).length + ' / 7';
  }

  function openSheet(n){
    var it = ITEMS[n]; if (!it) return;
    current = Number(n);
    seen[n] = 1;
    $$('.mk').forEach(function(m){ if (m.dataset.item === String(n)) m.classList.add('is-seen'); });
    seenText();
    $('#sheetNo').textContent = n;
    $('#sheetTitle').textContent = it.t;
    $('#sheetSrc').textContent = it.s;
    $('#sheetNow').innerHTML = it.now;
    $('#sheetFix').innerHTML = it.fix;
    $('#sheetWork').innerHTML = it.work;
    if (it.ask) { $('#sheetAsk').innerHTML = it.ask; $('#sheetAskRow').hidden = false; }
    else { $('#sheetAskRow').hidden = true; }
    $('#sheet').hidden = false;
  }

  document.addEventListener('click', function(e){
    var mkEl = e.target.closest('.mk');
    if (mkEl) { e.stopPropagation(); openSheet(mkEl.dataset.item); return; }

    var fold = e.target.closest('[data-fold]');
    if (fold) {
      e.stopPropagation();
      var id = fold.dataset.fold;
      var fc = DATA.filter(function(c){ return c.id === id; })[0];
      fc.folded = !fc.folded;
      // 收起是整块放下：正开着的那条就在这一块里，跟着一起走——回到这个频道的页面。
      if (fc.folded && selTask && fc.mine.filter(function(t){ return t.t === selTask; }).length) {
        selChannel = fc.id; selTask = '';
        DATA.forEach(function(c){ c.on = (c.id === selChannel); });
      }
      render();
      return;
    }
    var chRow = e.target.closest('.ch');
    if (chRow) {
      selChannel = chRow.dataset.ch; selTask = '';
      DATA.forEach(function(c){ c.on = (c.id === selChannel); });
      render();
      return;
    }
    var tk = e.target.closest('.tk');
    if (tk) {
      selTask = tk.dataset.task; selChannel = tk.dataset.chid;
      DATA.forEach(function(c){ c.on = (c.id === selChannel); });
      render();
      return;
    }
    var more = e.target.closest('[data-more]');
    if (more) {
      var mid = more.dataset.more;
      moreOpen[mid] = !moreOpen[mid];
      // 展开/收起这一块是为了看清那一行的作用，顺手把第 6 条也摆出来。
      if (moreOpen[mid]) openSheet(6);
      render();
      return;
    }

    var seg = e.target.closest('#modeSeg button');
    if (seg) {
      moreOpen = {};
      mode = seg.dataset.mode;
      $$('#modeSeg button').forEach(function(b){ b.classList.toggle('is-on', b === seg); });
      render();
      return;
    }
    if (e.target.closest('#sheetClose')) { $('#sheet').hidden = true; }
  });

  $('#themeBtn').addEventListener('click', function(){
    var dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    this.textContent = dark ? '深色' : '浅色';
  });

  seenText();
  render();
})();
</script>
</body>
</html>
